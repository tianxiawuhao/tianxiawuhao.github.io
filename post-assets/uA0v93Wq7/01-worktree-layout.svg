<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fd0"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">git worktree：工作树目录与 .git 元数据的关系</text>

  <rect x="30" y="56" width="250" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="48" y="82" font-size="14" font-weight="700" fill="#1f2b38">主工作树 /repo</text>
  <rect x="46" y="94" width="218" height="276" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="58" y="116" font-size="13" font-weight="700" fill="#2f6fd0">.git/（目录）</text>
  <rect x="58" y="128" width="194" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="70" y="150" font-size="12" font-weight="700" fill="#1f2b38">共享区（所有工作树共用）</text>
  <text x="70" y="172" font-size="11" fill="#5b6b7c">objects/</text>
  <text x="70" y="192" font-size="11" fill="#5b6b7c">refs/heads/  refs/tags/</text>
  <text x="70" y="212" font-size="11" fill="#5b6b7c">config  hooks/  info/</text>
  <text x="70" y="232" font-size="11" fill="#5b6b7c">packed-refs</text>
  <rect x="58" y="270" width="194" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="70" y="292" font-size="12" font-weight="700" fill="#1f2b38">主工作树私有</text>
  <text x="70" y="312" font-size="11" fill="#5b6b7c">HEAD  index</text>
  <text x="70" y="332" font-size="11" fill="#5b6b7c">ORIG_HEAD  logs/HEAD</text>
  <text x="70" y="352" font-size="11" fill="#5b6b7c">（不在 worktrees/ 下）</text>

  <rect x="330" y="56" width="230" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="348" y="82" font-size="14" font-weight="700" fill="#1f2b38">仓库内 .git/worktrees/</text>
  <rect x="346" y="100" width="198" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="358" y="122" font-size="12" font-weight="700" fill="#1f2b38">worktrees/feature/</text>
  <text x="358" y="144" font-size="11" fill="#5b6b7c">gitdir → 指向工作树的</text>
  <text x="358" y="160" font-size="11" fill="#5b6b7c">.git 文件</text>
  <text x="358" y="182" font-size="11" fill="#5b6b7c">HEAD  index  commondir</text>
  <text x="358" y="202" font-size="11" fill="#5b6b7c">ORIG_HEAD  logs/HEAD</text>
  <rect x="346" y="240" width="198" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="358" y="262" font-size="12" font-weight="700" fill="#1f2b38">worktrees/hotfix/</text>
  <text x="358" y="284" font-size="11" fill="#5b6b7c">gitdir → 指向工作树的</text>
  <text x="358" y="300" font-size="11" fill="#5b6b7c">.git 文件</text>
  <text x="358" y="322" font-size="11" fill="#5b6b7c">HEAD  index  commondir</text>
  <text x="358" y="342" font-size="11" fill="#5b6b7c">ORIG_HEAD  logs/HEAD</text>

  <rect x="620" y="96" width="250" height="130" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="634" y="120" font-size="13" font-weight="700" fill="#1f2b38">链接工作树 /repo-feature</text>
  <rect x="634" y="132" width="222" height="58" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="646" y="152" font-size="11.5" font-weight="700" fill="#2f6fd0">.git（普通文件）</text>
  <text x="646" y="170" font-size="11" fill="#1f2b38">gitdir: /repo/.git/worktrees/</text>
  <text x="646" y="184" font-size="11" fill="#1f2b38">        feature</text>
  <text x="634" y="212" font-size="11.5" fill="#2f6fd0">分支 feature（独占检出）</text>
  <rect x="620" y="246" width="250" height="130" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="634" y="270" font-size="13" font-weight="700" fill="#1f2b38">链接工作树 /repo-hotfix</text>
  <rect x="634" y="282" width="222" height="58" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="646" y="302" font-size="11.5" font-weight="700" fill="#2f6fd0">.git（普通文件）</text>
  <text x="646" y="320" font-size="11" fill="#1f2b38">gitdir: /repo/.git/worktrees/</text>
  <text x="646" y="334" font-size="11" fill="#1f2b38">        hotfix</text>
  <text x="634" y="362" font-size="11.5" fill="#2f6fd0">分支 hotfix（独占检出）</text>

  <path d="M254 180 H340" stroke="#2f6fd0" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <text x="297" y="172" text-anchor="middle" font-size="11" fill="#2f6fd0">add 时创建</text>
  <path d="M548 160 H630" stroke="#2f6fd0" stroke-width="1.6" fill="none" marker-start="url(#arwb)" marker-end="url(#arw)"/>
  <text x="589" y="152" text-anchor="middle" font-size="11" fill="#2f6fd0">gitdir 互指</text>
  <path d="M548 310 H630" stroke="#2f6fd0" stroke-width="1.6" fill="none" marker-start="url(#arwb)" marker-end="url(#arw)"/>
  <text x="589" y="302" text-anchor="middle" font-size="11" fill="#2f6fd0">gitdir 互指</text>

  <rect x="30" y="404" width="840" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="48" y="430" font-size="12" font-weight="700" fill="#1f2b38">共享：objects/ refs/ config hooks —— fetch 一次，所有工作树立即可见</text>
  <text x="48" y="454" font-size="12" font-weight="700" fill="#1f2b38">独占：每棵工作树有自己的 HEAD / index / 工作区文件，互不影响</text>
  <text x="48" y="478" font-size="12" fill="#5b6b7c">同一分支只能在一棵工作树检出；remove / move 需 Git 2.17+，repair 需 2.29+</text>
</svg>
