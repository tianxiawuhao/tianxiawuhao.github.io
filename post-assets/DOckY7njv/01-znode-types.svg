<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>znode 的四种类型：持久化、持久化顺序、临时、临时顺序</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">znode 的四种类型（生命周期 × 是否顺序编号）</text>

  <rect x="30" y="60" width="400" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="50" y="88" font-size="13.5" font-weight="700" fill="#1f2b38">PERSISTENT</text>
  <text x="50" y="110" font-size="12" font-weight="700" fill="#2f6fd0">持久化节点</text>
  <text x="50" y="134" font-size="12" fill="#5b6b7c">客户端会话断开后，节点依然存在。</text>
  <text x="50" y="156" font-size="12" fill="#5b6b7c">常用于配置、元数据等长期数据。</text>

  <rect x="470" y="60" width="400" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="490" y="88" font-size="13.5" font-weight="700" fill="#1f2b38">PERSISTENT_SEQUENTIAL</text>
  <text x="490" y="110" font-size="12" font-weight="700" fill="#2f6fd0">持久化顺序节点</text>
  <text x="490" y="134" font-size="12" fill="#5b6b7c">会话断开后依然存在，并在名称后</text>
  <text x="490" y="156" font-size="12" fill="#5b6b7c">追加单调递增的 10 位序号。</text>

  <rect x="30" y="215" width="400" height="130" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="50" y="243" font-size="13.5" font-weight="700" fill="#1f2b38">EPHEMERAL</text>
  <text x="50" y="265" font-size="12" font-weight="700" fill="#2e9e5b">临时节点</text>
  <text x="50" y="289" font-size="12" fill="#5b6b7c">会话一断开，节点即被自动删除。</text>
  <text x="50" y="311" font-size="12" fill="#5b6b7c">不能拥有子节点；用于存活探测。</text>

  <rect x="470" y="215" width="400" height="130" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="490" y="243" font-size="13.5" font-weight="700" fill="#1f2b38">EPHEMERAL_SEQUENTIAL</text>
  <text x="490" y="265" font-size="12" font-weight="700" fill="#2e9e5b">临时顺序节点</text>
  <text x="490" y="289" font-size="12" fill="#5b6b7c">会话断开即删除，且名称带序号。</text>
  <text x="490" y="311" font-size="12" fill="#5b6b7c">分布式锁、Master 选举常用。</text>

  <text x="450" y="375" text-anchor="middle" font-size="12" fill="#5b6b7c">说明：顺序编号由父节点维护，10 位、单调递增；临时节点随会话结束消失，因此不能有子节点。</text>
</svg>
