<rect x="55" y="298" width="175" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="142" y="315" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle">时间复杂度</text>
<text x="142" y="331" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">O(log n)</text>
<rect x="245" y="298" width="210" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="350" y="315" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle">支持操作符</text>
<text x="350" y="331" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">=、&lt;、&lt;=、&gt;、&gt;=、BETWEEN</text>
<rect x="470" y="298" width="180" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="560" y="315" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle">额外能力</text>
<text x="560" y="331" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">排序、唯一约束</text>
<rect x="665" y="298" width="180" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="755" y="315" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle">典型场景</text>
<text x="755" y="331" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">主键、普通列</text>

<text x="30" y="372" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#5b6b7c">二、其他索引类型的适用场景</text>

<rect x="30" y="386" width="205" height="92" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="46" y="408" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#2f6fd0">B-tree（默认）</text>
<text x="46" y="428" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#1f2b38">等值 / 范围 / 排序</text>
<text x="46" y="446" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">支持唯一约束</text>
<text x="46" y="464" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">最通用，优先选择</text>

<rect x="250" y="386" width="205" height="92" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="266" y="408" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#2e9e5b">GIN</text>
<text x="266" y="428" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#1f2b38">数组、jsonb、全文检索</text>
<text x="266" y="446" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">@&gt;、&lt;@、?、@@</text>
<text x="266" y="464" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">倒排结构，写入偏慢</text>

<rect x="470" y="386" width="205" height="92" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="486" y="408" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#e08a1e">GiST</text>
<text x="486" y="428" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#1f2b38">几何、范围、排他约束</text>
<text x="486" y="446" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">&amp;&amp;、&lt;@、&gt;&gt;=</text>
<text x="486" y="464" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">可结合 btree_gist 扩展</text>

<rect x="690" y="386" width="180" height="92" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
<text x="706" y="408" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#7a5bd0">BRIN / Hash</text>
<text x="706" y="428" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#1f2b38">BRIN：块级范围摘要</text>
<text x="706" y="446" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">适合自然有序的大表</text>
<text x="706" y="464" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">Hash：仅等值查询</text>
</svg>
