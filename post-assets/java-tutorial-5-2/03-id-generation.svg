<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>分布式 ID 方案对比与雪花算法的位结构</title>
  <rect width="900" height="450" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">分布式 ID：四种方案与雪花算法的位结构</text>

  <text x="45" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">方案</text>
  <text x="185" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">有序性</text>
  <text x="290" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">性能</text>
  <text x="390" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">依赖</text>
  <text x="520" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">主要问题</text>
  <rect x="40" y="68" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="80" width="820" height="38" fill="#eef4ff"/>
  <text x="45" y="104" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">UUID</text>
  <text x="185" y="104" font-size="11.5" fill="#e08a1e" text-anchor="start">无序（随机）</text>
  <text x="290" y="104" font-size="11.5" fill="#1f2b38" text-anchor="start">高（本地生成）</text>
  <text x="390" y="104" font-size="11.5" fill="#1f2b38" text-anchor="start">无</text>
  <text x="520" y="104" font-size="11.5" fill="#5b6b7c" text-anchor="start">36 位字符串占空间、随机导致索引页分裂</text>

  <rect x="40" y="118" width="820" height="38" fill="#ffffff"/>
  <text x="45" y="142" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">数据库自增</text>
  <text x="185" y="142" font-size="11.5" fill="#2e9e5b" text-anchor="start">严格有序</text>
  <text x="290" y="142" font-size="11.5" fill="#e08a1e" text-anchor="start">受数据库限制</text>
  <text x="390" y="142" font-size="11.5" fill="#1f2b38" text-anchor="start">数据库</text>
  <text x="520" y="142" font-size="11.5" fill="#5b6b7c" text-anchor="start">分库分表后冲突、并发写入是瓶颈、易被遍历</text>

  <rect x="40" y="156" width="820" height="38" fill="#eef4ff"/>
  <text x="45" y="180" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">号段模式</text>
  <text x="185" y="180" font-size="11.5" fill="#2e9e5b" text-anchor="start">按段有序</text>
  <text x="290" y="180" font-size="11.5" fill="#2e9e5b" text-anchor="start">高（批量取）</text>
  <text x="390" y="180" font-size="11.5" fill="#1f2b38" text-anchor="start">数据库（低频写）</text>
  <text x="520" y="180" font-size="11.5" fill="#5b6b7c" text-anchor="start">ID 不连续、服务重启可能浪费一段</text>

  <rect x="40" y="194" width="820" height="38" fill="#ffffff"/>
  <text x="45" y="218" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">雪花算法 Snowflake</text>
  <text x="185" y="218" font-size="11.5" fill="#2e9e5b" text-anchor="start">趋势递增</text>
  <text x="290" y="218" font-size="11.5" fill="#2e9e5b" text-anchor="start">极高（纯内存）</text>
  <text x="390" y="218" font-size="11.5" fill="#1f2b38" text-anchor="start">无（依赖时钟）</text>
  <text x="520" y="218" font-size="11.5" fill="#e08a1e" text-anchor="start">时钟回拨会导致重复 ID，必须处理</text>
  <rect x="40" y="232" width="820" height="1.6" fill="#c8d3e0"/>

  <text x="40" y="262" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">雪花算法的 64 位结构（long 类型，共 64 bit）</text>

  <rect x="40" y="276" width="60" height="42" rx="4" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="302" font-size="12" fill="#5b6b7c" text-anchor="middle">0</text>
  <rect x="102" y="276" width="290" height="42" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="247" y="296" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">41 bit 时间戳（毫秒）</text>
  <text x="247" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">相对起始时间的偏移，可用约 69 年</text>
  <rect x="394" y="276" width="180" height="42" rx="4" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="484" y="296" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">10 bit 机器标识</text>
  <text x="484" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">5+5 位，最多 1024 台</text>
  <rect x="576" y="276" width="284" height="42" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="718" y="296" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">12 bit 序列号</text>
  <text x="718" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">同毫秒自增，上限 4096 个</text>

  <rect x="40" y="336" width="400" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="358" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">时钟回拨怎么处理</text>
  <text x="60" y="380" font-size="11.5" fill="#5b6b7c" text-anchor="start">回拨很小时（几十毫秒）：自旋等待追上上次时间戳；</text>
  <text x="60" y="400" font-size="11.5" fill="#5b6b7c" text-anchor="start">回拨较大时：直接抛异常并告警，宁可短暂不可用，也不能</text>
  <text x="60" y="420" font-size="11.5" fill="#5b6b7c" text-anchor="start">生成重复 ID（NTP 校时、闰秒、虚拟机迁移都会触发）。</text>

  <rect x="460" y="336" width="400" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="480" y="358" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">为什么工程上更适合业务主键</text>
  <text x="480" y="380" font-size="11.5" fill="#5b6b7c" text-anchor="start">趋势递增：B+ 树索引始终在右侧追加，不会频繁页分裂；</text>
  <text x="480" y="400" font-size="11.5" fill="#5b6b7c" text-anchor="start">8 字节 long 比 UUID 的 36 字符省空间，二级索引也更小；</text>
  <text x="480" y="420" font-size="11.5" fill="#5b6b7c" text-anchor="start">纯内存生成、无网络开销，单机每秒可产出数百万个。</text>
</svg>
