<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>isEmpty 与 isBlank 的判定差别</title>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">isEmpty 与 isBlank 的判定差别</text>

  <rect x="40" y="55" width="820" height="42" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">输入值</text>
  <text x="440" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">StringUtils.isEmpty</text>
  <text x="720" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">StringUtils.isBlank</text>

  <rect x="40" y="97" width="820" height="44" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="125" text-anchor="middle" font-size="11.5" fill="#1f2b38">null</text>
  <text x="440" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e08a1e">false</text>
  <text x="720" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">true</text>

  <rect x="40" y="141" width="820" height="44" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="169" text-anchor="middle" font-size="11.5" fill="#1f2b38">空串（长度为 0）</text>
  <text x="440" y="169" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">true</text>
  <text x="720" y="169" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">true</text>

  <rect x="40" y="185" width="820" height="44" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="213" text-anchor="middle" font-size="11.5" fill="#1f2b38">空白串（只有空格）</text>
  <text x="440" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e08a1e">false</text>
  <text x="720" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">true</text>

  <rect x="40" y="229" width="820" height="44" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="257" text-anchor="middle" font-size="11.5" fill="#1f2b38">含内容的字符串</text>
  <text x="440" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e08a1e">false</text>
  <text x="720" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e08a1e">false</text>

  <line x1="300" y1="55" x2="300" y2="273" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="580" y1="55" x2="580" y2="273" stroke="#c8d3e0" stroke-width="1.4"/>

  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#5b6b7c">isBlank 会先 trim 再判空、且对 null 安全，业务判空优先用它</text>
</svg>
