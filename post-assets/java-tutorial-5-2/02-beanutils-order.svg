<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>两个同名方法的参数顺序相反</title>
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">两个同名方法，参数顺序恰好相反</text>

  <rect x="40" y="55" width="820" height="105" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="62" y="88" font-size="13" font-weight="700" fill="#2f6fd0">Spring BeanUtils</text>
  <text x="62" y="118" font-size="12.5" fill="#1f2b38">BeanUtils.copyProperties(user, vo)</text>
  <text x="62" y="144" font-size="11.5" fill="#5b6b7c">第一个参数是源对象 user，第二个是目标对象 vo</text>
  <rect x="670" y="90" width="170" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="755" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">源 → 目标</text>

  <rect x="40" y="180" width="820" height="105" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="62" y="213" font-size="13" font-weight="700" fill="#e08a1e">Commons BeanUtils</text>
  <text x="62" y="243" font-size="12.5" fill="#1f2b38">BeanUtils.copyProperties(vo, user)</text>
  <text x="62" y="269" font-size="11.5" fill="#5b6b7c">第一个参数是目标对象 vo，第二个才是源对象 user</text>
  <rect x="670" y="215" width="170" height="44" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="755" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">目标 → 源</text>

  <text x="450" y="320" text-anchor="middle" font-size="12" fill="#5b6b7c">写反了不会报错，只会把字段静默拷成 null；且只拷贝同名同类型的属性</text>
</svg>
