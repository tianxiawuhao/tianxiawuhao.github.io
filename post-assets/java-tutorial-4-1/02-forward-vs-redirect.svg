<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>请求转发与请求重定向的流程对比</title>
  <rect width="900" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">请求转发 vs 请求重定向</text>

  <!-- 左：转发 -->
  <rect x="25" y="55" width="410" height="360" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="82" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">请求转发 forward（一次请求）</text>

  <rect x="55" y="100" width="120" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="130" font-size="12" fill="#1f2b38" text-anchor="middle">浏览器</text>

  <rect x="290" y="100" width="120" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="350" y="130" font-size="12" fill="#1f2b38" text-anchor="middle">Servlet A</text>

  <line x1="175" y1="125" x2="285" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="230" y="117" font-size="11" fill="#5b6b7c" text-anchor="middle">请求一次</text>

  <line x1="350" y1="150" x2="350" y2="196" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="360" y="178" font-size="11" fill="#5b6b7c">forward(req, resp)</text>

  <rect x="275" y="196" width="150" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="350" y="226" font-size="12" fill="#1f2b38" text-anchor="middle">Servlet B / JSP</text>

  <line x1="275" y1="221" x2="180" y2="221" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="228" y="213" font-size="11" fill="#5b6b7c" text-anchor="middle">服务器内部调用</text>

  <text x="55" y="285" font-size="12" fill="#1f2b38">· 地址栏保持原 URL 不变</text>
  <text x="55" y="312" font-size="12" fill="#1f2b38">· request 域数据可跨资源共享</text>
  <text x="55" y="339" font-size="12" fill="#1f2b38">· 只能转到同一 Web 应用内</text>
  <text x="55" y="366" font-size="12" fill="#1f2b38">· 目标在 /WEB-INF 下也可访问</text>
  <text x="55" y="396" font-size="12" font-weight="700" fill="#2e9e5b">适合：查询结果页、表单回显</text>

  <!-- 右：重定向 -->
  <rect x="465" y="55" width="410" height="360" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="82" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="middle">请求重定向 redirect（两次请求）</text>

  <rect x="495" y="100" width="120" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="555" y="130" font-size="12" fill="#1f2b38" text-anchor="middle">浏览器</text>

  <rect x="730" y="100" width="120" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="790" y="130" font-size="12" fill="#1f2b38" text-anchor="middle">Servlet A</text>

  <line x1="615" y1="115" x2="725" y2="115" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ahr)"/>
  <text x="670" y="107" font-size="11" fill="#5b6b7c" text-anchor="middle">第 1 次请求 POST</text>

  <line x1="730" y1="140" x2="620" y2="140" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ahr)"/>
  <text x="672" y="158" font-size="11" fill="#5b6b7c" text-anchor="middle">302 + Location: /list</text>

  <line x1="555" y1="185" x2="555" y2="216" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ahr)"/>
  <text x="563" y="205" font-size="11" fill="#5b6b7c">浏览器自动再发</text>

  <rect x="495" y="216" width="120" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="555" y="244" font-size="12" fill="#1f2b38" text-anchor="middle">第 2 次请求 GET</text>

  <text x="495" y="285" font-size="12" fill="#1f2b38">· 地址栏变成目标 URL</text>
  <text x="495" y="312" font-size="12" fill="#1f2b38">· request 域数据丢失（新请求）</text>
  <text x="495" y="339" font-size="12" fill="#1f2b38">· 可跳到其他应用或站点</text>
  <text x="495" y="366" font-size="12" fill="#1f2b38">· 路径以 / 开头时相对站点根</text>
  <text x="495" y="396" font-size="12" font-weight="700" fill="#2e9e5b">适合：登录跳转、PRG 防重复提交</text>
</svg>
