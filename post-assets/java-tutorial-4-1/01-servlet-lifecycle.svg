<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Servlet 生命周期：实例一个，init 与 destroy 各一次，service 每请求一次</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Servlet 生命周期</text>

  <!-- 阶段条：容器创建实例 → init（一次） -->
  <rect x="40" y="55" width="210" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="82" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">容器创建实例</text>
  <text x="145" y="104" font-size="11" fill="#5b6b7c" text-anchor="middle">只 new 一次</text>

  <line x1="250" y1="90" x2="300" y2="90" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="300" y="55" width="210" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="405" y="82" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">init()</text>
  <text x="405" y="104" font-size="11" fill="#5b6b7c" text-anchor="middle">整个生命周期仅一次</text>

  <line x1="510" y1="90" x2="560" y2="90" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="560" y="55" width="300" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="710" y="82" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">实例驻留内存，等待请求</text>
  <text x="710" y="104" font-size="11" fill="#5b6b7c" text-anchor="middle">@WebServlet(loadOnStartup = 1) 可提前到启动时</text>

  <!-- 实例被复用 -->
  <text x="450" y="160" font-size="12" font-weight="700" fill="#5b6b7c" text-anchor="middle">同一个 Servlet 实例被并发复用</text>

  <!-- 三个请求框 -->
  <rect x="90" y="180" width="180" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="180" y="204" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">请求 1 / 线程 A</text>
  <text x="180" y="224" font-size="11" fill="#5b6b7c" text-anchor="middle">request 1 · response 1</text>

  <rect x="360" y="180" width="180" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="204" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">请求 2 / 线程 B</text>
  <text x="450" y="224" font-size="11" fill="#5b6b7c" text-anchor="middle">request 2 · response 2</text>

  <rect x="630" y="180" width="180" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="204" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">请求 3 / 线程 C</text>
  <text x="720" y="224" font-size="11" fill="#5b6b7c" text-anchor="middle">request 3 · response 3</text>

  <line x1="180" y1="236" x2="180" y2="290" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="236" x2="450" y2="290" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="720" y1="236" x2="720" y2="290" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="240" y="290" width="420" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="314" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">service() → doGet / doPost</text>
  <text x="450" y="336" font-size="11" fill="#5b6b7c" text-anchor="middle">每个请求调用一次，多线程并发</text>

  <rect x="20" y="272" width="190" height="98" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="115" y="296" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">不要写可变成员变量</text>
  <text x="115" y="318" font-size="11" fill="#5b6b7c" text-anchor="middle">实例是共享的</text>
  <text x="115" y="338" font-size="11" fill="#5b6b7c" text-anchor="middle">请求数据放局部变量</text>
  <text x="115" y="358" font-size="11" fill="#5b6b7c" text-anchor="middle">或 request 域</text>

  <line x1="450" y1="352" x2="450" y2="404" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="270" y="404" width="360" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="428" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">destroy()</text>
  <text x="450" y="450" font-size="11" fill="#5b6b7c" text-anchor="middle">容器关闭或应用卸载时调用一次，释放资源</text>
</svg>
