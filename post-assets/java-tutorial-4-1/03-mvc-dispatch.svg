<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MVC 分层与 DispatcherServlet 的调度流程</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">MVC 分层与请求调度</text>

  <!-- 请求入口 -->
  <rect x="30" y="58" width="110" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="85" y="82" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">浏览器</text>
  <text x="85" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">HTTP 请求</text>

  <line x1="140" y1="84" x2="190" y2="84" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- C 层 -->
  <rect x="190" y="58" width="300" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="82" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">C 控制器：DispatcherServlet</text>
  <text x="340" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">统一的入口与调度中心</text>

  <!-- 三列 -->
  <rect x="60" y="160" width="220" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="186" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">HandlerMapping</text>
  <text x="170" y="208" font-size="11" fill="#5b6b7c" text-anchor="middle">按 URL 找到处理该请求的</text>
  <text x="170" y="226" font-size="11" fill="#5b6b7c" text-anchor="middle">Controller 方法与拦截器</text>

  <rect x="340" y="160" width="220" height="86" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="186" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">你写的 @Controller</text>
  <text x="450" y="208" font-size="11" fill="#5b6b7c" text-anchor="middle">调用 Service 与 DAO</text>
  <text x="450" y="226" font-size="11" fill="#5b6b7c" text-anchor="middle">返回模型数据 + 逻辑视图名</text>

  <rect x="620" y="160" width="230" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="186" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">ViewResolver</text>
  <text x="735" y="208" font-size="11" fill="#5b6b7c" text-anchor="middle">逻辑视图名 → 真实视图</text>
  <text x="735" y="226" font-size="11" fill="#5b6b7c" text-anchor="middle">JSP / Thymeleaf / JSON</text>

  <line x1="340" y1="110" x2="205" y2="156" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="400" y1="110" x2="415" y2="156" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 490 86 L 735 86 L 735 156" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="235" y="138" font-size="11" fill="#5b6b7c" text-anchor="middle">① 找处理器</text>
  <text x="330" y="138" font-size="11" fill="#5b6b7c" text-anchor="middle">② 适配并调用</text>
  <text x="560" y="78" font-size="11" fill="#5b6b7c" text-anchor="middle">③ 解析视图</text>

  <!-- 返回路径 -->
  <line x1="620" y1="204" x2="495" y2="204" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="170" y1="246" x2="170" y2="296" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="180" y="278" font-size="11" fill="#5b6b7c">找不到映射 → 404</text>

  <rect x="60" y="296" width="220" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="170" y="322" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">M 模型</text>
  <text x="170" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">Service / DAO / 实体</text>

  <rect x="340" y="296" width="220" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="322" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">V 视图</text>
  <text x="450" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">渲染后的 HTML / JSON</text>

  <rect x="620" y="296" width="230" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="735" y="322" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">响应写回浏览器</text>
  <text x="735" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">全程只有一次 HTTP 往返</text>

  <text x="450" y="396" font-size="11" fill="#5b6b7c" text-anchor="middle">Controller 只做「取参数 → 调模型 → 选视图」，业务与展示分离，视图可替换为 JSON</text>
</svg>
