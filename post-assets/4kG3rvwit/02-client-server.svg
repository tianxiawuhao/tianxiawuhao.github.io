<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Docker 客户端与服务端的分工</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Docker 客户端与服务端的分工</text>

  <rect x="20" y="62" width="230" height="96" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="135" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">docker 客户端 (CLI)</text>
  <text x="135" y="116" text-anchor="middle" font-size="11" fill="#5b6b7c">docker run / build / pull</text>
  <text x="135" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">只负责把请求发出去</text>

  <line x1="252" y1="110" x2="330" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="291" y="100" text-anchor="middle" font-size="11" fill="#5b6b7c">REST / socket</text>

  <rect x="332" y="62" width="250" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="457" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">dockerd 守护进程</text>
  <text x="457" y="116" text-anchor="middle" font-size="11" fill="#5b6b7c">接收请求，管理镜像</text>
  <text x="457" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">调度容器生命周期</text>

  <line x1="584" y1="110" x2="662" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="623" y="100" text-anchor="middle" font-size="11" fill="#5b6b7c">容器运行时</text>

  <rect x="664" y="62" width="216" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="772" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">containerd / runc</text>
  <text x="772" y="116" text-anchor="middle" font-size="11" fill="#5b6b7c">真正创建并运行</text>
  <text x="772" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">一个个容器进程</text>

  <rect x="20" y="188" width="860" height="128" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="214" font-size="13" font-weight="700" fill="#1f2b38">常用运维命令</text>
  <text x="40" y="240" font-size="12" fill="#1f2b38">docker ps -a                  列出全部容器（含已停止）</text>
  <text x="40" y="264" font-size="12" fill="#1f2b38">docker images                 列出本地镜像</text>
  <text x="40" y="288" font-size="12" fill="#1f2b38">docker logs -f &lt;容器名&gt;      持续查看容器日志</text>

  <text x="880" y="330" text-anchor="end" font-size="11" fill="#5b6b7c">客户端与服务端可同机部署，也可通过 DOCKER_HOST 远程连接</text>
</svg>
