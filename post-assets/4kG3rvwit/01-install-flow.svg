<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>CentOS 7 安装 Docker 的五步流程</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">CentOS 7 安装 Docker 的五步流程</text>

  <rect x="20" y="60" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="95" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">① 环境检查</text>
  <text x="95" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">uname -r 看内核</text>
  <text x="95" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">卸载旧版本</text>

  <line x1="172" y1="98" x2="200" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="202" y="60" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="277" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">② 安装依赖包</text>
  <text x="277" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">yum-utils</text>
  <text x="277" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">device-mapper / lvm2</text>

  <line x1="354" y1="98" x2="382" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="384" y="60" width="150" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="459" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">③ 添加 yum 源</text>
  <text x="459" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">docker-ce.repo</text>
  <text x="459" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">官方源或阿里源</text>

  <line x1="536" y1="98" x2="564" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="566" y="60" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="641" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">④ 选版本安装</text>
  <text x="641" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">yum list --showduplicates</text>
  <text x="641" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">yum install docker-ce-版本</text>

  <line x1="718" y1="98" x2="746" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="748" y="60" width="132" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="814" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">⑤ 启动服务</text>
  <text x="814" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">start + enable</text>
  <text x="814" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">开机自启</text>

  <rect x="20" y="172" width="860" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="198" font-size="13" font-weight="700" fill="#1f2b38">装完后的验证命令</text>
  <text x="40" y="224" font-size="12" fill="#1f2b38">docker version          查看客户端与服务端版本</text>
  <text x="40" y="248" font-size="12" fill="#1f2b38">docker info             查看存储驱动、镜像与容器数量</text>
  <text x="40" y="272" font-size="12" fill="#1f2b38">systemctl status docker 查看服务运行状态</text>

  <text x="880" y="308" text-anchor="end" font-size="11" fill="#5b6b7c">全程需 root 权限，非 root 用户请在命令前加 sudo</text>
</svg>
