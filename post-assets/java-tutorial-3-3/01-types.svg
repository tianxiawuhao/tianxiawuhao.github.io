<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JavaScript 类型体系与 typeof 陷阱</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">JS 类型体系：七种原始类型 + 对象，typeof 有三个坑</text>
  <rect x="40" y="52" width="300" height="262" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="78" font-size="14" fill="#2f6fd0" text-anchor="middle" font-weight="700">原始类型（按值访问，共 7 种）</text>
  <rect x="52" y="86" width="276" height="28" rx="5" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="64" y="105" font-size="12" fill="#1f2b38" text-anchor="start" font-family="DejaVu Sans Mono, monospace">undefined</text>
  <rect x="52" y="118" width="276" height="28" rx="5" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="64" y="137" font-size="12" fill="#1f2b38" text-anchor="start" font-family="DejaVu Sans Mono, monospace">null</text>
  <rect x="52" y="150" width="276" height="28" rx="5" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="64" y="169" font-size="12" fill="#1f2b38" text-anchor="start" font-family="DejaVu Sans Mono, monospace">boolean</text>
  <rect x="52" y="182" width="276" height="28" rx="5" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="64" y="201" font-size="12" fill="#1f2b38" text-anchor="start" font-family="DejaVu Sans Mono, monospace">number（含整数与浮点）</text>
  <rect x="52" y="214" width="276" height="28" rx="5" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="64" y="233" font-size="12" fill="#1f2b38" text-anchor="start" font-family="DejaVu Sans Mono, monospace">string</text>
  <rect x="52" y="246" width="276" height="28" rx="5" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="64" y="265" font-size="12" fill="#1f2b38" text-anchor="start" font-family="DejaVu Sans Mono, monospace">symbol（ES6）</text>
  <rect x="52" y="278" width="276" height="28" rx="5" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="64" y="297" font-size="12" fill="#1f2b38" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bigint（ES2020）</text>
  <rect x="380" y="52" width="230" height="262" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="495" y="78" font-size="14" fill="#5b6b7c" text-anchor="middle" font-weight="700">typeof 的返回值</text>
  <text x="392" y="105" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">typeof true</text>
  <text x="600" y="105" font-size="11" fill="#2e9e5b" text-anchor="end" font-family="DejaVu Sans Mono, monospace">"boolean"</text>
  <text x="392" y="137" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">typeof 3.14</text>
  <text x="600" y="137" font-size="11" fill="#2e9e5b" text-anchor="end" font-family="DejaVu Sans Mono, monospace">"number"</text>
  <text x="392" y="169" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">typeof "abc"</text>
  <text x="600" y="169" font-size="11" fill="#2e9e5b" text-anchor="end" font-family="DejaVu Sans Mono, monospace">"string"</text>
  <text x="392" y="201" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">typeof 10n</text>
  <text x="600" y="201" font-size="11" fill="#2e9e5b" text-anchor="end" font-family="DejaVu Sans Mono, monospace">"bigint"</text>
  <text x="392" y="233" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">typeof null</text>
  <text x="600" y="233" font-size="11" fill="#e08a1e" text-anchor="end" font-family="DejaVu Sans Mono, monospace">"object" ✗</text>
  <text x="392" y="265" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">typeof []</text>
  <text x="600" y="265" font-size="11" fill="#e08a1e" text-anchor="end" font-family="DejaVu Sans Mono, monospace">"object" ✗</text>
  <text x="392" y="297" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">typeof (() =&gt; {})</text>
  <text x="600" y="297" font-size="11" fill="#2e9e5b" text-anchor="end" font-family="DejaVu Sans Mono, monospace">"function"</text>
  <rect x="650" y="52" width="210" height="262" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="755" y="78" font-size="14" fill="#e08a1e" text-anchor="middle" font-weight="700">别踩这三个坑</text>
  <text x="755" y="116" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">① typeof null 是历史遗留 bug</text>
  <text x="755" y="136" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">判断空值写</text>
  <text x="755" y="154" font-size="11" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">value === null</text>
  <text x="755" y="190" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">② 数组也被当 object</text>
  <text x="755" y="210" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">日常判数组用</text>
  <text x="755" y="228" font-size="11" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Array.isArray(x)</text>
  <text x="755" y="264" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">③ 判 NaN 用</text>
  <text x="755" y="284" font-size="11" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Number.isNaN(v)</text>
  <rect x="40" y="338" width="820" height="78" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="364" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400">不能只靠 typeof：想要精确类型用</text>
  <text x="610" y="364" font-size="12" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Object.prototype.toString.call(x)   // "[object Array]"</text>
  <text x="60" y="392" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400">变量本身不绑定类型，类型属于「值」；同一变量可以先存数字再存字符串——动态类型不等于没有类型。</text>
</svg>
