<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>原型链与 ES6 class</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">原型链：属性查找一路向上，class 只是语法糖</text>
  <rect x="60" y="52" width="430" height="290" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="78" font-size="13" fill="#5b6b7c" text-anchor="middle" font-weight="700">属性查找顺序（instanceof 看的就是这条链）</text>
  <rect x="100" y="94" width="350" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="275" y="115" font-size="13" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">new Student()</text>
  <text x="275" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">对象自身属性：#score、name</text>
  <path d="M 275 136 L 275 158" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="100" y="158" width="350" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="275" y="179" font-size="13" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Student.prototype</text>
  <text x="275" y="194" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">构造函数的 prototype，被 new 出的实例当原型</text>
  <path d="M 275 200 L 275 222" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="100" y="222" width="350" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="275" y="243" font-size="13" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Person.prototype</text>
  <text x="275" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">再往上是父类的原型对象</text>
  <path d="M 275 264 L 275 286" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="275" y="306" font-size="13" fill="#5b6b7c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">null</text>
  <text x="275" y="324" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">查找终止，返回 undefined</text>
  <text x="60" y="404" font-size="11" fill="#5b6b7c" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Object.getPrototypeOf(p) === Person.prototype   // true      p instanceof Person   // 真：prototype 在不在链上</text>
  <rect x="450" y="52" width="390" height="290" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="645" y="78" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">两个 prototype 别混淆</text>
  <rect x="466" y="86" width="358" height="50" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="478" y="104" font-size="12" fill="#e08a1e" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Class.prototype</text>
  <text x="478" y="122" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">构造函数的属性，专给 new 出的实例当原型</text>
  <text x="478" y="160" font-size="12" fill="#e08a1e" text-anchor="start" font-family="DejaVu Sans Mono, monospace">obj.__proto__</text>
  <text x="478" y="178" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">对象的原型引用，非标准、不推荐使用</text>
  <rect x="466" y="198" width="358" height="50" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="478" y="216" font-size="12" fill="#e08a1e" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Object.getPrototypeOf(obj)</text>
  <text x="478" y="234" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">读取对象原型的标准写法</text>
  <text x="478" y="272" font-size="12" fill="#e08a1e" text-anchor="start" font-family="DejaVu Sans Mono, monospace">obj instanceof Class</text>
  <text x="478" y="290" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">构造函数的 prototype 是否在 obj 的原型链上</text>
  <text x="645" y="338" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">class 没有改变底层模型：它仍是构造函数 + 原型对象</text>
</svg>
