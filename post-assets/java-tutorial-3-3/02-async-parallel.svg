<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>串行 await 与 Promise.all 耗时对比</title>
<rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">串行 await 与 Promise.all 并发：耗时对比</text>
<text x="50" y="112" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">串行 await</text>
<rect x="210" y="92" width="160" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="290" y="112" font-size="12" fill="#1f2b38" text-anchor="middle">请求 1</text>
<rect x="380" y="92" width="160" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="460" y="112" font-size="12" fill="#1f2b38" text-anchor="middle">请求 2</text>
<rect x="550" y="92" width="160" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="630" y="112" font-size="12" fill="#1f2b38" text-anchor="middle">请求 3</text>
<line x1="210" y1="136" x2="708" y2="136" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="459" y="158" font-size="12.5" fill="#e08a1e" text-anchor="middle">总耗时 = 三个请求依次相加</text>
<text x="50" y="235" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">Promise.all</text>
<rect x="210" y="200" width="160" height="24" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="290" y="217" font-size="11.5" fill="#1f2b38" text-anchor="middle">请求 1</text>
<rect x="210" y="228" width="160" height="24" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="290" y="245" font-size="11.5" fill="#1f2b38" text-anchor="middle">请求 2</text>
<rect x="210" y="256" width="160" height="24" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="290" y="273" font-size="11.5" fill="#1f2b38" text-anchor="middle">请求 3</text>
<line x1="210" y1="296" x2="366" y2="296" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="382" y="301" font-size="12.5" fill="#2e9e5b" text-anchor="start">总耗时 = 最慢的那个请求</text>
<text x="450" y="340" font-size="12.5" fill="#5b6b7c" text-anchor="middle">独立请求用 Promise.all([...]) 并发发起，别用 await 一个个串起来</text>
<!-- 设计说明：两条时间轴对比：串行 await 累加三个请求耗时，Promise.all 并发只等最慢的一个。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
</svg>
