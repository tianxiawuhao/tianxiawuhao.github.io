<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>闭包结构与 var/let 循环绑定对比</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">闭包：私有状态如何在函数返回后存活</text>
<rect x="40" y="55" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="240" y="80" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">createCounter 的作用域（外层函数已返回）</text>
<rect x="70" y="95" width="340" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="240" y="124" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">let count = 0</text>
<text x="240" y="146" font-size="11.5" fill="#5b6b7c" text-anchor="middle">外部拿不到，是真正的私有状态</text>
<line x1="240" y1="165" x2="240" y2="188" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="252" y="182" font-size="11.5" fill="#5b6b7c" text-anchor="start">被内层函数记住</text>
<rect x="70" y="190" width="340" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="240" y="215" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">返回 () =&gt; ++count</text>
<text x="240" y="236" font-size="11.5" fill="#5b6b7c" text-anchor="middle">外层作用域不随函数返回而销毁</text>
<rect x="70" y="264" width="160" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="150" y="290" font-size="12" fill="#1f2b38" text-anchor="middle">next() → 1</text>
<rect x="250" y="264" width="160" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="330" y="290" font-size="12" fill="#1f2b38" text-anchor="middle">next() → 2</text>
<text x="240" y="338" font-size="11.5" fill="#5b6b7c" text-anchor="middle">代价：变量不被回收，长期持有大对象或 DOM 会内存泄漏</text>
<rect x="470" y="55" width="390" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="665" y="80" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">循环里绑定回调：var 与 let</text>
<rect x="500" y="95" width="330" height="92" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="665" y="122" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">for (var i = 0; i &lt; 3; i++)</text>
<text x="665" y="145" font-size="11.5" fill="#5b6b7c" text-anchor="middle">三轮迭代共用同一个 i</text>
<text x="665" y="170" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">回调全部输出：3 3 3</text>
<rect x="500" y="203" width="330" height="92" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="665" y="230" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">for (let j = 0; j &lt; 3; j++)</text>
<text x="665" y="253" font-size="11.5" fill="#5b6b7c" text-anchor="middle">每轮迭代一个独立绑定</text>
<text x="665" y="278" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">回调输出：0 1 2</text>
<text x="665" y="338" font-size="11.5" fill="#5b6b7c" text-anchor="middle">老项目里的 IIFE 就是为了模拟块级作用域</text>
<!-- 设计说明：左panel 展示闭包把 count 留在内存中，右panel 对比 var 共用绑定与 let 每轮独立绑定。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
</svg>
