<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Kafka 提交日志：分区、offset 与消费组</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Kafka 是分布式的提交日志，不是会删除消息的队列</text>

  <text x="40" y="66" font-size="12.5" font-weight="700" fill="#1f2b38">topic: order-events</text>

  <text x="330" y="94" text-anchor="middle" font-size="11.5" fill="#5b6b7c">P0 leader（broker-1）</text>
  <text x="545" y="94" text-anchor="middle" font-size="11.5" fill="#5b6b7c">P1 leader（broker-2）</text>
  <text x="760" y="94" text-anchor="middle" font-size="11.5" fill="#5b6b7c">P2 leader（broker-3）</text>

  <rect x="220" y="102" width="70" height="36" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="290" y="102" width="70" height="36" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="360" y="102" width="70" height="36" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="430" y="102" width="70" height="36" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="255" y="125" text-anchor="middle" font-size="11" fill="#1f2b38">0</text>
  <text x="325" y="125" text-anchor="middle" font-size="11" fill="#1f2b38">1</text>
  <text x="395" y="125" text-anchor="middle" font-size="11" fill="#1f2b38">2</text>
  <text x="465" y="125" text-anchor="middle" font-size="11" fill="#5b6b7c">3</text>
  <text x="255" y="155" text-anchor="middle" font-size="10.5" fill="#5b6b7c">msg</text>
  <text x="325" y="155" text-anchor="middle" font-size="10.5" fill="#5b6b7c">msg</text>
  <text x="395" y="155" text-anchor="middle" font-size="10.5" fill="#5b6b7c">msg</text>
  <text x="465" y="155" text-anchor="middle" font-size="10.5" fill="#5b6b7c">新写入</text>
  <text x="220" y="180" font-size="11" fill="#2f6fd0">offset 0</text>
  <text x="500" y="125" font-size="11" fill="#2f6fd0">追加写 →</text>

  <rect x="635" y="102" width="70" height="36" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="705" y="102" width="70" height="36" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="775" y="102" width="70" height="36" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="125" text-anchor="middle" font-size="11" fill="#1f2b38">0</text>
  <text x="740" y="125" text-anchor="middle" font-size="11" fill="#1f2b38">1</text>
  <text x="810" y="125" text-anchor="middle" font-size="11" fill="#5b6b7c">2</text>

  <text x="340" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">分区内严格有序；分区之间不保证顺序</text>
  <text x="740" y="175" text-anchor="middle" font-size="11" fill="#5b6b7c">按 key 哈希选分区，key 为 null 则轮询</text>
  <text x="740" y="196" text-anchor="middle" font-size="11" fill="#e08a1e">同一 key 才有序，顺序要靠业务主键</text>

  <rect x="30" y="228" width="270" height="105" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6fd0">消费组 A</text>
  <text x="165" y="279" text-anchor="middle" font-size="11" fill="#1f2b38">三个消费者线程，各领一个分区</text>
  <text x="165" y="299" text-anchor="middle" font-size="11" fill="#1f2b38">一条消息组内只被处理一次</text>
  <text x="165" y="319" text-anchor="middle" font-size="11" fill="#5b6b7c">消费者数 = 分区数时负载最均衡</text>

  <line x1="305" y1="280" x2="338" y2="280" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="345" y1="280" x2="378" y2="280" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="390" y="228" width="240" height="105" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="510" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">offset 与提交</text>
  <text x="510" y="279" text-anchor="middle" font-size="11" fill="#1f2b38">0.9 起提交到 __consumer_offsets</text>
  <text x="510" y="299" text-anchor="middle" font-size="11" fill="#1f2b38">compact 主题，只留每个 key 最新值</text>
  <text x="510" y="319" text-anchor="middle" font-size="11" fill="#5b6b7c">自动提交会先提交后处理，可能丢消息</text>

  <line x1="635" y1="280" x2="668" y2="280" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="675" y="228" width="195" height="105" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="772" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6fd0">消费组 B</text>
  <text x="772" y="279" text-anchor="middle" font-size="11" fill="#1f2b38">组间广播</text>
  <text x="772" y="299" text-anchor="middle" font-size="11" fill="#1f2b38">独立读全量消息</text>
  <text x="772" y="319" text-anchor="middle" font-size="11" fill="#5b6b7c">互不影响</text>

  <text x="450" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">消息按保留时间或大小统一清理，同一 topic 可被多个业务反复读取</text>
  <text x="450" y="392" text-anchor="middle" font-size="11.5" fill="#5b6b7c">高吞吐来自分区水平扩展、批量收发、page cache 与 sendfile 零拷贝</text>
  <text x="450" y="415" text-anchor="middle" font-size="11.5" fill="#5b6b7c">先加分区再加消费者，两者要一起加；分区只能增加不能减少</text>
</svg>
