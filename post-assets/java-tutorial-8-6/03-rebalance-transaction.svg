<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>消费组再平衡与事务的恰好一次</title>
  <rect width="900" height="450" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">再平衡的触发与规避、事务实现恰好一次</text>

  <rect x="30" y="52" width="405" height="180" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="232" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">Rebalance 的触发条件</text>
  <text x="55" y="104" font-size="11.5" fill="#1f2b38">· 消费者加入或离开消费组</text>
  <text x="55" y="128" font-size="11.5" fill="#1f2b38">· 订阅的 topic 分区数发生变化</text>
  <text x="55" y="152" font-size="11.5" fill="#1f2b38">· 长时间未发心跳被判定失联</text>
  <text x="55" y="176" font-size="11.5" fill="#1f2b38">· 两次 poll 间隔超过 max.poll.interval.ms</text>
  <text x="232" y="206" text-anchor="middle" font-size="11.5" fill="#e08a1e">期间整个组短暂停止消费，是线上常见故障</text>
  <text x="232" y="224" text-anchor="middle" font-size="11" fill="#5b6b7c">规避：调大 max.poll.interval.ms，或用静态成员</text>

  <rect x="465" y="52" width="405" height="180" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="667" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">规避手段的效果</text>
  <text x="490" y="104" font-size="11.5" fill="#1f2b38">调大 max.poll.interval.ms</text>
  <text x="490" y="126" font-size="11" fill="#5b6b7c">单批处理慢也不会被踢出组，仍会重平衡</text>
  <text x="490" y="152" font-size="11.5" fill="#1f2b38">设置稳定的 group.instance.id</text>
  <text x="490" y="174" font-size="11" fill="#5b6b7c">静态成员，短暂重启不触发全组重平衡</text>
  <text x="667" y="206" text-anchor="middle" font-size="11.5" fill="#2e9e5b">目标：把再平衡从「频繁」降到「计划内」</text>
  <text x="667" y="224" text-anchor="middle" font-size="11" fill="#5b6b7c">扩容分区与消费者要一起做，数量对齐最理想</text>

  <rect x="30" y="252" width="840" height="130" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">事务：把「消费 - 处理 - 生产」打包成原子操作</text>
  <rect x="55" y="292" width="180" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="319" text-anchor="middle" font-size="11.5" fill="#1f2b38">initTransactions()</text>
  <rect x="260" y="292" width="180" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="350" y="319" text-anchor="middle" font-size="11.5" fill="#1f2b38">beginTransaction()</text>
  <rect x="465" y="292" width="180" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="555" y="319" text-anchor="middle" font-size="11.5" fill="#1f2b38">send + 位移纳入事务</text>
  <rect x="670" y="292" width="180" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="760" y="319" text-anchor="middle" font-size="11.5" fill="#2e9e5b">commitTransaction()</text>
  <line x1="237" y1="314" x2="258" y2="314" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="442" y1="314" x2="463" y2="314" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="647" y1="314" x2="668" y2="314" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="362" text-anchor="middle" font-size="11.5" fill="#1f2b38">前提：acks=all、enable.idempotence=true、transactional.id 唯一；读端用 read_committed</text>
  <text x="450" y="376" text-anchor="middle" font-size="11.5" fill="#5b6b7c">不可恢复异常须重建生产者，其他异常回滚（abortTransaction）后重试</text>

  <text x="450" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">事务只保证 Kafka 内部的原子性，跨系统恰好一次要靠两阶段提交或本地事务表</text>
  <text x="450" y="436" text-anchor="middle" font-size="11.5" fill="#5b6b7c">上线前对照：key 不能为 null、提交位移必须在业务处理成功之后</text>
</svg>
