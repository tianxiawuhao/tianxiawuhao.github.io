<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Kafka 副本、ISR 与 acks 可靠性配置</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">副本与 ISR：acks 配置如何决定丢不丢消息</text>

  <rect x="30" y="58" width="840" height="160" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="55" y="84" font-size="13" font-weight="700" fill="#1f2b38">分区 P0（replication.factor = 3）</text>

  <rect x="55" y="98" width="230" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6fd0">Leader 副本（broker-1）</text>
  <text x="170" y="150" text-anchor="middle" font-size="11.5" fill="#1f2b38">读写只走 leader</text>
  <text x="170" y="172" text-anchor="middle" font-size="11" fill="#5b6b7c">在 ISR 中，进度最快</text>

  <rect x="335" y="98" width="230" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">Follower 副本（broker-2）</text>
  <text x="450" y="150" text-anchor="middle" font-size="11.5" fill="#1f2b38">持续向 leader 拉取同步</text>
  <text x="450" y="172" text-anchor="middle" font-size="11" fill="#5b6b7c">跟得上进度 → 留在 ISR</text>

  <rect x="615" y="98" width="230" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="730" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e08a1e">Follower 副本（broker-3）</text>
  <text x="730" y="150" text-anchor="middle" font-size="11.5" fill="#1f2b38">落后太多，被踢出 ISR</text>
  <text x="730" y="172" text-anchor="middle" font-size="11" fill="#5b6b7c">追上后会自动加回来</text>

  <line x1="287" y1="143" x2="333" y2="143" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="567" y1="143" x2="613" y2="143" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="450" y="208" text-anchor="middle" font-size="11.5" fill="#5b6b7c">ISR = {broker-1, broker-2}；leader 宕机时 controller 从 ISR 中选出新 leader，ISR 空了只能等成员恢复</text>

  <rect x="30" y="240" width="840" height="105" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="55" y="266" font-size="12.5" font-weight="700" fill="#1f2b38">三种 acks 设置（配合 min.insync.replicas 判断）</text>
  <rect x="55" y="278" width="255" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="182" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">acks=all</text>
  <text x="182" y="320" text-anchor="middle" font-size="11" fill="#1f2b38">等 ISR 全部确认，可靠性最高</text>
  <rect x="322" y="278" width="255" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="449" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">acks=1</text>
  <text x="449" y="320" text-anchor="middle" font-size="11" fill="#1f2b38">leader 写入即返回，吞吐高但可能丢</text>
  <rect x="589" y="278" width="255" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="716" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">acks=0</text>
  <text x="716" y="320" text-anchor="middle" font-size="11" fill="#1f2b38">发出即算成功，最快也最易丢</text>

  <text x="450" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">不丢的三个条件：acks=all + replication.factor=3 + min.insync.replicas=2</text>
  <text x="450" y="398" text-anchor="middle" font-size="11.5" fill="#5b6b7c">ISR 副本数少于 min.insync.replicas 时 broker 直接拒绝写入，而不是假装成功</text>
  <text x="450" y="421" text-anchor="middle" font-size="11.5" fill="#5b6b7c">再配合足够的 delivery.timeout.ms 与重试次数，否则重试未成消息已被判超时</text>
</svg>
