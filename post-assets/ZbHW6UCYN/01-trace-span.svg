<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>一个 Trace 内的多个 Span 与 cs、sr、ss、cr 注解的时间线示意</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">一个 Trace 内的多个 Span 与 cs/sr/ss/cr 注解</text>

  <text x="30" y="100" font-size="13" fill="#1f2b38">网关服务</text>
  <text x="30" y="118" font-size="11" fill="#5b6b7c">server-gateway</text>
  <rect x="150" y="91" width="680" height="26" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="490" y="109" font-size="12" fill="#1f2b38" text-anchor="middle">网关 Span（TraceId 贯穿全程）</text>
  <text x="150" y="85" font-size="11" fill="#2f6fd0" text-anchor="middle">cs</text>
  <text x="830" y="85" font-size="11" fill="#2f6fd0" text-anchor="middle">cr</text>

  <text x="30" y="160" font-size="13" fill="#1f2b38">订单服务</text>
  <text x="30" y="178" font-size="11" fill="#5b6b7c">server-order</text>
  <rect x="250" y="151" width="500" height="26" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="500" y="169" font-size="12" fill="#1f2b38" text-anchor="middle">订单 Span（新的 SpanId）</text>
  <text x="250" y="145" font-size="11" fill="#2e9e5b" text-anchor="middle">sr</text>
  <text x="750" y="145" font-size="11" fill="#2e9e5b" text-anchor="middle">ss</text>

  <text x="30" y="220" font-size="13" fill="#1f2b38">商品服务</text>
  <text x="30" y="238" font-size="11" fill="#5b6b7c">server-product</text>
  <rect x="350" y="211" width="300" height="26" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="500" y="229" font-size="12" fill="#1f2b38" text-anchor="middle">商品 Span（新的 SpanId）</text>
  <text x="350" y="205" font-size="11" fill="#e08a1e" text-anchor="middle">sr</text>
  <text x="650" y="205" font-size="11" fill="#e08a1e" text-anchor="middle">ss</text>

  <line x1="250" y1="117" x2="250" y2="149" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="350" y1="177" x2="350" y2="209" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>

  <line x1="150" y1="270" x2="846" y2="270" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="870" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">时间</text>

  <text x="40" y="306" font-size="12" fill="#1f2b38">· cs / cr 由客户端（调用方）记录，sr / ss 由服务端（被调方）记录</text>
  <text x="40" y="328" font-size="12" fill="#1f2b38">· sr - cs = 网络延迟，ss - sr = 服务端处理时间，cr - cs = 请求总耗时</text>
  <text x="40" y="350" font-size="12" fill="#1f2b38">· 同一个 TraceId 贯穿整条链路，每进入一个微服务都会生成新的 SpanId</text>
</svg>
