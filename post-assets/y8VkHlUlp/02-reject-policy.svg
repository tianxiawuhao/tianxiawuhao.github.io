<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ThreadPoolExecutor 四种拒绝策略对比</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ThreadPoolExecutor 四种拒绝策略对比</text>

  <rect x="40" y="70" width="400" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="240" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">AbortPolicy（默认）</text>
  <text x="240" y="130" text-anchor="middle" font-size="12" fill="#5b6b7c">不执行新任务，直接抛出 RejectedExecutionException</text>
  <text x="240" y="154" text-anchor="middle" font-size="12" fill="#5b6b7c">适合必须感知提交失败的场景</text>

  <rect x="460" y="70" width="400" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="660" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">DiscardPolicy</text>
  <text x="660" y="130" text-anchor="middle" font-size="12" fill="#5b6b7c">不执行新任务，也不抛出任何异常</text>
  <text x="660" y="154" text-anchor="middle" font-size="12" fill="#5b6b7c">适合可以容忍任务丢失的场景</text>

  <rect x="40" y="200" width="400" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">DiscardOldestPolicy</text>
  <text x="240" y="260" text-anchor="middle" font-size="12" fill="#5b6b7c">丢弃队列中最旧的任务，再重新提交当前任务</text>
  <text x="240" y="284" text-anchor="middle" font-size="12" fill="#5b6b7c">适合新任务优先于旧任务的场景</text>

  <rect x="460" y="200" width="400" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">CallerRunsPolicy</text>
  <text x="660" y="260" text-anchor="middle" font-size="12" fill="#5b6b7c">交给提交任务的调用线程直接执行，不丢弃任务</text>
  <text x="660" y="284" text-anchor="middle" font-size="12" fill="#5b6b7c">形成反压、降低提交速度，但会阻塞调用方</text>
</svg>
