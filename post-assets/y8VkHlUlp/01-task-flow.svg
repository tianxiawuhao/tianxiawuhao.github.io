<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ThreadPoolExecutor 任务提交与处理顺序</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ThreadPoolExecutor 的任务提交与处理顺序</text>

  <rect x="60" y="60" width="300" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="93" text-anchor="middle" font-size="13" fill="#1f2b38">① 提交新任务 execute/submit</text>
  <line x1="360" y1="88" x2="412" y2="88" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="386" y="80" text-anchor="middle" font-size="11" fill="#5b6b7c">是</text>
  <rect x="420" y="60" width="420" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="630" y="86" text-anchor="middle" font-size="13" fill="#1f2b38">核心线程数 &lt; corePoolSize</text>
  <text x="630" y="106" text-anchor="middle" font-size="12" fill="#5b6b7c">创建核心线程并立即执行任务</text>

  <line x1="210" y1="116" x2="210" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="198" y="136" text-anchor="end" font-size="11" fill="#5b6b7c">否</text>
  <rect x="60" y="150" width="300" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="183" text-anchor="middle" font-size="13" fill="#1f2b38">② 核心线程都在忙</text>
  <line x1="360" y1="178" x2="412" y2="178" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="386" y="170" text-anchor="middle" font-size="11" fill="#5b6b7c">是</text>
  <rect x="420" y="150" width="420" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="630" y="176" text-anchor="middle" font-size="13" fill="#1f2b38">工作队列 workQueue 未满</text>
  <text x="630" y="196" text-anchor="middle" font-size="12" fill="#5b6b7c">任务入队，等待空闲线程取走</text>

  <line x1="210" y1="206" x2="210" y2="235" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="198" y="226" text-anchor="end" font-size="11" fill="#5b6b7c">否</text>
  <rect x="60" y="240" width="300" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="273" text-anchor="middle" font-size="13" fill="#1f2b38">③ 工作队列已满</text>
  <line x1="360" y1="268" x2="412" y2="268" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="386" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">是</text>
  <rect x="420" y="240" width="420" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="630" y="266" text-anchor="middle" font-size="13" fill="#1f2b38">线程数 &lt; maximumPoolSize</text>
  <text x="630" y="286" text-anchor="middle" font-size="12" fill="#5b6b7c">创建非核心线程执行任务</text>

  <line x1="210" y1="296" x2="210" y2="325" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="198" y="316" text-anchor="end" font-size="11" fill="#5b6b7c">否</text>
  <rect x="60" y="330" width="300" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="210" y="363" text-anchor="middle" font-size="13" fill="#1f2b38">④ 队列满且线程数达上限</text>
  <line x1="360" y1="358" x2="412" y2="358" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="420" y="330" width="420" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="630" y="356" text-anchor="middle" font-size="13" fill="#1f2b38">触发拒绝策略 RejectedExecutionHandler</text>
  <text x="630" y="376" text-anchor="middle" font-size="12" fill="#5b6b7c">Abort / Discard / DiscardOldest / CallerRuns</text>
</svg>
