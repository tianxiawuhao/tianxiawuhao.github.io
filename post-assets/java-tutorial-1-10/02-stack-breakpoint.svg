<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>断点调试如何找到异常的源头</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">断点调试：从崩溃现场回到错误源头</text>
  <rect x="270" y="52" width="360" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">程序崩溃，控制台打印堆栈轨迹</text>
  <text x="450" y="89" text-anchor="middle" font-size="11" fill="#5b6b7c">at com.xxx.Main.main(Main.java:8)</text>
  <path d="M 450 98 L 450 118" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="270" y="120" width="360" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">加上异常断点：不放过第一现场</text>
  <text x="450" y="157" text-anchor="middle" font-size="11" fill="#5b6b7c">Run → View Breakpoints（Ctrl+Shift+F8）填异常类名</text>
  <path d="M 450 166 L 450 186" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="250" y="188" width="400" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">在抛出异常的那一行暂停</text>
  <text x="450" y="226" text-anchor="middle" font-size="11" fill="#5b6b7c">打开 Frames / Variables / Watches 三个窗口</text>
  <path d="M 450 236 L 450 256" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="250" y="258" width="400" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">顺着调用栈向上回溯</text>
  <text x="450" y="295" text-anchor="middle" font-size="11" fill="#5b6b7c">看清「这个 null 到底是谁放进去的」</text>
  <rect x="30" y="322" width="270" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">单步快捷键</text>
  <text x="165" y="360" text-anchor="middle" font-size="11" fill="#1f2b38">F8 跨过　F7 步入</text>
  <text x="165" y="375" text-anchor="middle" font-size="11" fill="#1f2b38">Shift+F8 步出　F9 继续</text>
  <rect x="315" y="322" width="270" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">其它三个有用的断点</text>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#1f2b38">行断点　条件断点</text>
  <text x="450" y="375" text-anchor="middle" font-size="11" fill="#1f2b38">字段断点（Watchpoint）</text>
  <rect x="600" y="322" width="270" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="735" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">排查底线</text>
  <text x="735" y="360" text-anchor="middle" font-size="11" fill="#1f2b38">不写空 catch 块</text>
  <text x="735" y="375" text-anchor="middle" font-size="11" fill="#1f2b38">不吞异常、不丢 cause</text>
</svg>
