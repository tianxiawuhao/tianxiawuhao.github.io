<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>Throwable 异常体系与受检、非受检分支</title>
<rect width="900" height="460" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Throwable：受检与非受检的分界线</text>
<rect x="40" y="55" width="820" height="26" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="73" font-size="12" fill="#5b6b7c" text-anchor="middle">编译器只强制处理「受检异常」；Error 与 RuntimeException 一族都不受编译检查</text>
<rect x="370" y="100" width="160" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="123" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">Throwable</text>
<line x1="450" y1="136" x2="450" y2="155" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="240" y1="155" x2="660" y2="155" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="240" y1="155" x2="240" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="660" y1="155" x2="660" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="352" y="150" font-size="11" fill="#5b6b7c" text-anchor="middle">两个直接子类</text>
<rect x="160" y="182" width="160" height="36" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="240" y="205" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">Error</text>
<rect x="540" y="182" width="240" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="660" y="205" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">Exception</text>
<text x="240" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">OutOfMemoryError</text>
<text x="240" y="256" font-size="11" fill="#5b6b7c" text-anchor="middle">StackOverflowError</text>
<text x="240" y="272" font-size="11" fill="#5b6b7c" text-anchor="middle">JVM 级严重问题，不建议捕获</text>
<line x1="660" y1="218" x2="660" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="330" y1="252" x2="790" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="330" y1="252" x2="330" y2="276" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="790" y1="252" x2="790" y2="276" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="240" y="282" width="180" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="330" y="305" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">RuntimeException</text>
<rect x="700" y="282" width="180" height="36" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="790" y="305" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">其余 Exception 子类</text>
<rect x="178" y="336" width="300" height="72" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="328" y="356" font-size="11" fill="#e08a1e" text-anchor="middle">非受检：NullPointerException、</text>
<text x="328" y="372" font-size="11" fill="#e08a1e" text-anchor="middle">ArrayIndexOutOfBoundsException、</text>
<text x="328" y="388" font-size="11" fill="#e08a1e" text-anchor="middle">IllegalArgumentException</text>
<rect x="638" y="336" width="300" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="788" y="356" font-size="11" fill="#2e9e5b" text-anchor="middle">受检：IOException、SQLException、</text>
<text x="788" y="372" font-size="11" fill="#2e9e5b" text-anchor="middle">ClassNotFoundException、</text>
<text x="788" y="388" font-size="11" fill="#2e9e5b" text-anchor="middle">InterruptedException</text>
<text x="100" y="300" font-size="11" fill="#5b6b7c">不必 catch / throws</text>
<text x="788" y="428" font-size="11" fill="#5b6b7c" text-anchor="middle">必须 catch 或 throws，否则编译失败</text>
</svg>
