<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Throwable 异常体系：受检异常与非受检异常的分界</title>
  <rect width="900" height="580" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">异常体系：受检异常与非受检异常的分界</text>
  <rect x="350" y="56" width="200" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Throwable</text>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="#5b6b7c">所有可抛出类型的根</text>
  <path d="M 450 102 L 450 120 L 180 120 L 180 140" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 102 L 450 120 L 720 120 L 720 140" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="142" width="240" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="180" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">Error</text>
  <text x="180" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">JVM 层面严重问题，不该捕获</text>
  <rect x="600" y="142" width="240" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">Exception</text>
  <text x="720" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">程序运行中可处理的问题</text>
  <path d="M 180 192 L 180 208" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 720 192 L 720 208" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="210" width="240" height="34" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="180" y="232" text-anchor="middle" font-size="12" fill="#1f2b38">OutOfMemoryError</text>
  <rect x="60" y="250" width="240" height="34" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="180" y="272" text-anchor="middle" font-size="12" fill="#1f2b38">StackOverflowError</text>
  <rect x="600" y="210" width="240" height="34" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="720" y="232" text-anchor="middle" font-size="12" fill="#1f2b38">RuntimeException</text>
  <rect x="600" y="250" width="240" height="34" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="720" y="272" text-anchor="middle" font-size="12" fill="#1f2b38">其余 Exception 子类</text>
  <path d="M 720 284 L 720 306" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="600" y="308" width="260" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="730" y="330" text-anchor="middle" font-size="12" fill="#1f2b38">IOException</text>
  <rect x="600" y="348" width="260" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="730" y="370" text-anchor="middle" font-size="12" fill="#1f2b38">SQLException</text>
  <rect x="600" y="388" width="260" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="730" y="410" text-anchor="middle" font-size="12" fill="#1f2b38">ClassNotFoundException</text>
  <rect x="600" y="428" width="260" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="730" y="450" text-anchor="middle" font-size="12" fill="#1f2b38">InterruptedException</text>
  <path d="M 180 284 L 180 306" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="308" width="280" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="180" y="330" text-anchor="middle" font-size="12" fill="#1f2b38">NullPointerException</text>
  <rect x="40" y="348" width="280" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="180" y="370" text-anchor="middle" font-size="12" fill="#1f2b38">ArrayIndexOutOfBoundsException</text>
  <rect x="40" y="388" width="280" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="180" y="410" text-anchor="middle" font-size="12" fill="#1f2b38">ClassCastException</text>
  <rect x="40" y="428" width="280" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="180" y="450" text-anchor="middle" font-size="12" fill="#1f2b38">IllegalArgumentException</text>
  <rect x="30" y="480" width="400" height="82" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="230" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">受检异常（checked）</text>
  <text x="230" y="522" text-anchor="middle" font-size="11" fill="#1f2b38">编译器强制处理：要么 try-catch，</text>
  <text x="230" y="538" text-anchor="middle" font-size="11" fill="#1f2b38">要么在方法签名上 throws 声明出去</text>
  <text x="230" y="554" text-anchor="middle" font-size="11" fill="#5b6b7c">IOException / SQLException 等</text>
  <rect x="460" y="480" width="410" height="82" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="665" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">非受检异常（unchecked）</text>
  <text x="665" y="522" text-anchor="middle" font-size="11" fill="#1f2b38">RuntimeException 及其子类，以及 Error 一支，</text>
  <text x="665" y="538" text-anchor="middle" font-size="11" fill="#1f2b38">编译期不检查，运行时才可能抛出</text>
  <text x="665" y="554" text-anchor="middle" font-size="11" fill="#5b6b7c">注意：Error 也不是受检异常</text>
</svg>
