<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>try-catch-finally 的执行流程</title>
<rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">try-catch-finally 的执行路径</text>
<rect x="40" y="55" width="820" height="26" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="73" font-size="12" fill="#5b6b7c" text-anchor="middle">catch 从上到下依次匹配，匹配成功后后面的 catch 不再执行；finally 在离开 try 语句前必然执行</text>
<rect x="90" y="95" width="180" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="180" y="117" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">try 代码块</text>
<text x="180" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">可能出错的代码</text>
<line x1="180" y1="143" x2="180" y2="171" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="180" y1="165" x2="450" y2="165" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="180" y1="165" x2="180" y2="185" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="450" y1="165" x2="450" y2="185" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="255" y="160" font-size="11" fill="#5b6b7c">正常结束</text>
<text x="545" y="160" font-size="11" fill="#5b6b7c">抛出异常</text>
<rect x="90" y="192" width="180" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="180" y="212" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">跳过全部 catch</text>
<text x="180" y="228" font-size="11" fill="#5b6b7c" text-anchor="middle">直接进入 finally</text>
<rect x="330" y="192" width="240" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="211" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">catch (A e)　　匹配？</text>
<text x="450" y="228" font-size="11" fill="#e08a1e" text-anchor="middle">不匹配则继续向下匹配</text>
<line x1="450" y1="236" x2="450" y2="256" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="470" y="252" font-size="11" fill="#5b6b7c">不匹配</text>
<rect x="330" y="262" width="240" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="281" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">catch (B | C e)</text>
<text x="450" y="298" font-size="11" fill="#e08a1e" text-anchor="middle">多重捕获，类型间不能有继承关系</text>
<line x1="570" y1="214" x2="620" y2="214" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="622" y="209" font-size="11" fill="#2e9e5b">匹配成功</text>
<text x="622" y="225" font-size="11" fill="#2e9e5b">执行处理代码</text>
<line x1="620" y1="240" x2="620" y2="330" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="180" y1="236" x2="180" y2="330" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="450" y1="306" x2="450" y2="330" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="180" y1="330" x2="620" y2="330" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="400" y1="330" x2="400" y2="344" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="280" y="346" width="240" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="400" y="365" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">finally 代码块</text>
<text x="400" y="381" font-size="11" fill="#5b6b7c" text-anchor="middle">禁止在其中写 return / throw</text>
</svg>
