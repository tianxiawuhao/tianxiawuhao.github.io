<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">RocketMQ 架构与消息流转</text>

  <rect x="330" y="64" width="240" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">NameServer 集群</text>
  <text x="450" y="114" text-anchor="middle" font-size="11" fill="#5b6b7c">无状态 · 节点间不通信</text>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">每个节点保存全量 Topic 路由</text>

  <rect x="40" y="210" width="190" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="135" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Producer 集群</text>
  <text x="135" y="264" text-anchor="middle" font-size="11" fill="#5b6b7c">完全无状态，可水平扩展</text>
  <text x="135" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">从 NameServer 获取路由</text>
  <text x="135" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">只向 Master 发送消息</text>

  <rect x="670" y="210" width="190" height="120" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="765" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Consumer 集群</text>
  <text x="765" y="264" text-anchor="middle" font-size="11" fill="#5b6b7c">集群 / 广播两种消费模式</text>
  <text x="765" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">从 NameServer 获取路由</text>
  <text x="765" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">Master 与 Slave 都可拉取</text>

  <rect x="310" y="210" width="210" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="415" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Broker-A（Master）</text>
  <text x="415" y="264" text-anchor="middle" font-size="11" fill="#5b6b7c">brokerId=0，可读可写</text>
  <text x="415" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">CommitLog / ConsumeQueue</text>
  <text x="415" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">同步刷盘 / 异步刷盘可选</text>

  <rect x="310" y="380" width="210" height="100" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="415" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Broker-B（Slave）</text>
  <text x="415" y="430" text-anchor="middle" font-size="11" fill="#5b6b7c">brokerId=1，只读</text>
  <text x="415" y="450" text-anchor="middle" font-size="11" fill="#5b6b7c">同步复制 / 异步复制</text>

  <line x1="205" y1="210" x2="348" y2="146" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="255" cy="196" r="11" fill="#2f6fd0"/>
  <text x="255" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>

  <line x1="695" y1="210" x2="552" y2="146" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="645" cy="196" r="11" fill="#2f6fd0"/>
  <text x="645" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>

  <line x1="415" y1="210" x2="415" y2="148" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="440" cy="179" r="11" fill="#2f6fd0"/>
  <text x="440" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>

  <line x1="230" y1="290" x2="304" y2="290" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="267" cy="263" r="11" fill="#2f6fd0"/>
  <text x="267" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>

  <line x1="520" y1="290" x2="664" y2="290" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="592" cy="263" r="11" fill="#2f6fd0"/>
  <text x="592" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>

  <line x1="415" y1="330" x2="415" y2="374" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="440" cy="352" r="11" fill="#2f6fd0"/>
  <text x="440" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>

  <text x="40" y="512" font-size="11" fill="#5b6b7c">1) Producer 拉取 Topic 路由    2) Broker 向所有 NameServer 注册并定时心跳    3) Producer 只向 Master 发送消息</text>
  <text x="40" y="534" font-size="11" fill="#5b6b7c">4) Consumer 从 Master / Slave 拉取消息    5) Master 主从同步数据    6) Consumer 上报消费位点并感知路由变化</text>
</svg>
