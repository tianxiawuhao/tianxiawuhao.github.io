<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>if / else if 链的分级判断流程</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">if / else if 链：自上而下判断，命中一支就跳出</text>

  <rect x="30" y="56" width="220" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="82" font-size="12" fill="#1f2b38" text-anchor="middle">int score = 87</text>

  <rect x="30" y="118" width="220" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="140" y="144" font-size="12" fill="#1f2b38" text-anchor="middle">score &lt; 0 || score &gt; 100</text>
  <rect x="30" y="180" width="220" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="206" font-size="12" fill="#1f2b38" text-anchor="middle">score &gt;= 90</text>
  <rect x="30" y="242" width="220" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="268" font-size="12" fill="#1f2b38" text-anchor="middle">score &gt;= 80</text>
  <rect x="30" y="304" width="220" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="330" font-size="12" fill="#1f2b38" text-anchor="middle">score &gt;= 70</text>
  <rect x="30" y="366" width="220" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="392" font-size="12" fill="#1f2b38" text-anchor="middle">score &gt;= 60</text>
  <rect x="30" y="428" width="220" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="140" y="454" font-size="12" fill="#5b6b7c" text-anchor="middle">else（兜底）</text>

  <line x1="140" y1="98" x2="140" y2="118" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="112" font-size="11" fill="#5b6b7c">假</text>
  <line x1="140" y1="160" x2="140" y2="180" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="174" font-size="11" fill="#5b6b7c">假</text>
  <line x1="140" y1="222" x2="140" y2="242" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="236" font-size="11" fill="#5b6b7c">假</text>
  <line x1="140" y1="284" x2="140" y2="304" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="298" font-size="11" fill="#5b6b7c">假</text>
  <line x1="140" y1="346" x2="140" y2="366" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="360" font-size="11" fill="#5b6b7c">假</text>
  <line x1="140" y1="408" x2="140" y2="428" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="150" y="422" font-size="11" fill="#5b6b7c">假</text>

  <line x1="250" y1="139" x2="428" y2="139" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="133" font-size="11" fill="#2e9e5b" text-anchor="middle">真</text>
  <line x1="250" y1="201" x2="428" y2="201" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="195" font-size="11" fill="#2e9e5b" text-anchor="middle">真</text>
  <line x1="250" y1="263" x2="428" y2="263" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="257" font-size="11" fill="#2e9e5b" text-anchor="middle">真</text>
  <line x1="250" y1="325" x2="428" y2="325" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="319" font-size="11" fill="#2e9e5b" text-anchor="middle">真</text>
  <line x1="250" y1="387" x2="428" y2="387" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="381" font-size="11" fill="#2e9e5b" text-anchor="middle">真</text>
  <line x1="250" y1="449" x2="428" y2="449" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="340" y="443" font-size="11" fill="#5b6b7c" text-anchor="middle">以上都不满足</text>

  <rect x="430" y="118" width="200" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="530" y="144" font-size="12" fill="#1f2b38" text-anchor="middle">成绩数据有误</text>
  <rect x="430" y="180" width="200" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="530" y="206" font-size="12" fill="#1f2b38" text-anchor="middle">优秀</text>
  <rect x="430" y="242" width="200" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="530" y="268" font-size="12" fill="#1f2b38" text-anchor="middle">良好</text>
  <rect x="430" y="304" width="200" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="530" y="330" font-size="12" fill="#1f2b38" text-anchor="middle">中等</text>
  <rect x="430" y="366" width="200" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="530" y="392" font-size="12" fill="#1f2b38" text-anchor="middle">及格</text>
  <rect x="430" y="428" width="200" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="530" y="454" font-size="12" fill="#1f2b38" text-anchor="middle">不及格</text>

  <rect x="660" y="118" width="210" height="186" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="142" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">写这类分支的纪律</text>
  <text x="765" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">条件由窄到宽排列</text>
  <text x="765" y="202" font-size="11" fill="#5b6b7c" text-anchor="middle">非法数据最先挡</text>
  <text x="765" y="228" font-size="11" fill="#5b6b7c" text-anchor="middle">else 负责兜底</text>
  <line x1="676" y1="244" x2="854" y2="244" stroke="#c8d3e0" stroke-width="1"/>
  <text x="765" y="268" font-size="11" fill="#5b6b7c" text-anchor="middle">命中一支即跳出</text>
  <text x="765" y="292" font-size="11" fill="#5b6b7c" text-anchor="middle">后面条件不再判断</text>

  <rect x="660" y="326" width="210" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="765" y="356" font-size="11" fill="#5b6b7c" text-anchor="middle">本例命中的是</text>
  <text x="765" y="386" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">score &gt;= 80 → 良好</text>
</svg>
