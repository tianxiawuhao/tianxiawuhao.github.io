<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>depends_on 与 healthcheck 的差别</title>
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" text-anchor="middle" font-size="17" fill="#1f2b38" font-weight="700">depends_on 只管启动顺序，healthcheck 才等到真正就绪</text>
<text x="60" y="64" text-anchor="start" font-size="13.5" fill="#e08a1e" font-weight="700">① 只写 depends_on: [mysql]：MySQL 进程一拉起来，app 就启动</text>
<rect x="60" y="84" width="220" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="170.0" y="105" text-anchor="middle" font-size="12.5" fill="#1f2b38">mysql 容器启动</text>
<text x="170.0" y="123" text-anchor="middle" font-size="11.5" fill="#5b6b7c">初始化还要几十秒</text>
<rect x="320" y="84" width="220" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="430.0" y="105" text-anchor="middle" font-size="12.5" fill="#1f2b38">app 立即启动并连库</text>
<text x="430.0" y="123" text-anchor="middle" font-size="11.5" fill="#5b6b7c">jdbc:mysql://mysql:3306</text>
<rect x="580" y="84" width="260" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="710.0" y="105" text-anchor="middle" font-size="12.5" fill="#1f2b38">连接失败：Connection refused</text>
<text x="710.0" y="123" text-anchor="middle" font-size="11.5" fill="#5b6b7c">app 启动即报错退出</text>
<line x1="280" y1="108" x2="320" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="540" y1="108" x2="580" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="60" y="176" text-anchor="start" font-size="13.5" fill="#2e9e5b" font-weight="700">② depends_on + condition: service_healthy：等到健康检查通过</text>
<text x="560" y="176" text-anchor="start" font-size="11.5" fill="#5b6b7c">interval: 10s / retries: 10 / start_period: 30s</text>
<rect x="60" y="196" width="220" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="170.0" y="217" text-anchor="middle" font-size="12.5" fill="#1f2b38">mysql 启动 + healthcheck</text>
<text x="170.0" y="235" text-anchor="middle" font-size="11.5" fill="#5b6b7c">mysqladmin ping 成功 → healthy</text>
<rect x="320" y="196" width="220" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="430.0" y="217" text-anchor="middle" font-size="12.5" fill="#1f2b38">app 此时才启动</text>
<text x="430.0" y="235" text-anchor="middle" font-size="11.5" fill="#5b6b7c">依赖已就绪</text>
<rect x="580" y="196" width="260" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="710.0" y="217" text-anchor="middle" font-size="12.5" fill="#1f2b38">连接成功，应用正常运行</text>
<text x="710.0" y="235" text-anchor="middle" font-size="11.5" fill="#5b6b7c">健康检查通过才放行</text>
<line x1="280" y1="220" x2="320" y2="220" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="540" y1="220" x2="580" y2="220" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="60" y="272" width="780" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="298" text-anchor="start" font-size="12.5" fill="#1f2b38">restart: unless-stopped 只能让崩掉的容器反复重启，不能替代就绪等待；</text>
<text x="80" y="324" text-anchor="start" font-size="12.5" fill="#5b6b7c">等待启动顺序用 depends_on，等待服务就绪用 healthcheck + condition: service_healthy。</text>
</svg>
