<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>Compose 服务拓扑与网络</title>
<rect width="900" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" text-anchor="middle" font-size="17" fill="#1f2b38" font-weight="700">Compose 单机编排：一份 YAML 拉起 Nginx + App + MySQL + Redis</text>
<rect x="350" y="56" width="200" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="81" text-anchor="middle" font-size="12.5" fill="#1f2b38">客户端（宿主机浏览器）</text>
<line x1="450" y1="96" x2="450" y2="164" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="460" y="134" text-anchor="start" font-size="12" fill="#2f6fd0">80:80</text>
<rect x="50" y="126" width="800" height="270" rx="10" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
<text x="66" y="148" text-anchor="start" font-size="12" fill="#7a5bd0">默认网络 <项目名>_default：服务名即容器 DNS 名</text>
<rect x="350" y="168" width="200" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="187" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">nginx:1.25-alpine</text>
<text x="450" y="203" text-anchor="middle" font-size="11.5" fill="#5b6b7c">ports: 80:80（仅它对外暴露）</text>
<line x1="450" y1="212" x2="450" y2="244" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="464" y="232" text-anchor="start" font-size="11.5" fill="#5b6b7c">proxy_pass http://app:8080</text>
<rect x="340" y="248" width="220" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="450" y="269" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">app（Spring Boot）</text>
<text x="450" y="287" text-anchor="middle" font-size="11.5" fill="#5b6b7c">build: . / image: 私仓地址</text>
<polyline points="390,298 390,318 250,318 250,336" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="510,298 510,318 650,318 650,336" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="380" y="312" text-anchor="end" font-size="11.5" fill="#5b6b7c">jdbc:mysql://mysql:3306/appdb</text>
<text x="520" y="312" text-anchor="start" font-size="11.5" fill="#5b6b7c">SPRING_REDIS_HOST=redis</text>
<rect x="130" y="340" width="240" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="250" y="361" text-anchor="middle" font-size="12.5" fill="#1f2b38">mysql:8.0　healthcheck</text>
<text x="250" y="379" text-anchor="middle" font-size="11.5" fill="#5b6b7c">命名卷 mysql-data</text>
<rect x="530" y="340" width="240" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="650" y="361" text-anchor="middle" font-size="12.5" fill="#1f2b38">redis:7-alpine</text>
<text x="650" y="379" text-anchor="middle" font-size="11.5" fill="#5b6b7c">命名卷 redis-data</text>
<text x="450" y="422" text-anchor="middle" font-size="12.5" fill="#5b6b7c">容器之间用服务名互访，不需要 ports；只有对外提供服务的 nginx 才写端口映射</text>
</svg>
