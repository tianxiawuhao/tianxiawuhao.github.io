<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>蒙特卡洛与时序差分的更新方式对比</title>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="492" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">蒙特卡洛与时序差分：更新方式的对比</text>

  <rect x="40" y="46" width="380" height="362" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="70" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f6fd0">蒙特卡洛 MC：等回合结束，用真实回报</text>

  <rect x="60" y="82" width="340" height="62" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="104" font-size="11" fill="#5b6b7c">需要的数据</text>
  <text x="80" y="130" font-size="12.5" font-weight="700" fill="#1f2b38">整条回合的奖励 r₀, r₁, … , r_T₋₁</text>

  <path d="M230,144 V164" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ad)"/>

  <rect x="60" y="168" width="340" height="76" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="190" font-size="11" fill="#5b6b7c">更新目标</text>
  <text x="80" y="214" font-size="13" font-weight="700" fill="#1f2b38">y = u<tspan font-size="10" dy="3">t</tspan><tspan font-size="13" dy="-3">（真实的折扣回报）</tspan></text>
  <text x="80" y="236" font-size="12" fill="#1f2b38">Q(s,a) ← Q(s,a) + α (u − Q)</text>

  <path d="M230,244 V264" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ad)"/>

  <rect x="60" y="268" width="340" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="80" y="290" font-size="11" fill="#5b6b7c">特点</text>
  <text x="80" y="314" font-size="12.5" fill="#1f2b38">• 无偏估计，但方差大</text>
  <text x="80" y="338" font-size="12.5" fill="#1f2b38">• 必须等回合结束才能更新</text>
  <text x="80" y="362" font-size="12.5" fill="#1f2b38">• 回合越长，样本噪声越大</text>

  <rect x="480" y="46" width="380" height="362" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="670" y="70" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e08a1e">时序差分 TD：走一步，用自举估计</text>

  <rect x="500" y="82" width="340" height="62" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="520" y="104" font-size="11" fill="#5b6b7c">需要的数据</text>
  <text x="520" y="130" font-size="12.5" font-weight="700" fill="#1f2b38">一步转移 (s, a, r, s′)</text>

  <path d="M670,144 V164" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ad)"/>

  <rect x="500" y="168" width="340" height="76" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="520" y="190" font-size="11" fill="#5b6b7c">更新目标</text>
  <text x="520" y="214" font-size="13" font-weight="700" fill="#1f2b38">y = r + γ · q(s′, a′; w)</text>
  <text x="520" y="236" font-size="12" fill="#1f2b38">δ = q(s, a; w) − y（自举）</text>

  <path d="M670,244 V264" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ad)"/>

  <rect x="500" y="268" width="340" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="520" y="290" font-size="11" fill="#5b6b7c">特点</text>
  <text x="520" y="314" font-size="12.5" fill="#1f2b38">• 方差小，收敛通常更快</text>
  <text x="520" y="338" font-size="12.5" fill="#1f2b38">• 每一步都能在线更新</text>
  <text x="520" y="362" font-size="12.5" fill="#1f2b38">• 有自举带来的偏差</text>

  <rect x="40" y="424" width="820" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="447" text-anchor="middle" font-size="12.5" fill="#1f2b38">同一架天平的两端：MC 无偏但方差大，TD 低方差但有偏差</text>
  <text x="450" y="465" text-anchor="middle" font-size="11.5" fill="#5b6b7c">n 步回报 / TD(λ) 在两者之间取值：m = 1 即 TD，m → ∞ 即 MC</text>
</svg>
