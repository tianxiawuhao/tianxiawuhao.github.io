<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>蒙特卡洛：用整条回合的回报平均估计 Q(s,a)</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">蒙特卡洛：用整条回合的回报平均估计 Q(s,a)</text>

  <text x="40" y="60" font-size="12" fill="#5b6b7c">① 按当前策略 π 采样一条完整回合</text>

  <rect x="40" y="72" width="170" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="94" text-anchor="middle" font-size="11" fill="#5b6b7c">t = 0</text>
  <text x="125" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">s₀ , a₀</text>
  <text x="125" y="136" text-anchor="middle" font-size="13" fill="#2f6fd0">r₀</text>

  <path d="M210,108 H246" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="250" y="72" width="170" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="335" y="94" text-anchor="middle" font-size="11" fill="#5b6b7c">t = 1</text>
  <text x="335" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">s₁ , a₁</text>
  <text x="335" y="136" text-anchor="middle" font-size="13" fill="#2f6fd0">r₁</text>

  <path d="M420,108 H456" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="460" y="72" width="170" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="545" y="94" text-anchor="middle" font-size="11" fill="#5b6b7c">t = 2</text>
  <text x="545" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">s₂ , a₂</text>
  <text x="545" y="136" text-anchor="middle" font-size="13" fill="#2f6fd0">r₂</text>

  <path d="M630,108 H666" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="670" y="72" width="190" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="765" y="94" text-anchor="middle" font-size="11" fill="#2e9e5b">t = T（终止）</text>
  <text x="765" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">回合结束</text>
  <text x="765" y="136" text-anchor="middle" font-size="13" fill="#5b6b7c">此后没有奖励</text>

  <rect x="40" y="166" width="820" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="190" text-anchor="middle" font-size="12" fill="#5b6b7c">② 从终止处反向累加，得到每一时刻的折扣回报</text>
  <text x="450" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2b38">u<tspan font-size="10" dy="4">t</tspan><tspan font-size="16" dy="-4"> = r</tspan><tspan font-size="10" dy="4">t</tspan><tspan font-size="16" dy="-4"> + γ · u</tspan><tspan font-size="10" dy="4">t+1</tspan><tspan font-size="16" dy="-4"> ,   u</tspan><tspan font-size="10" dy="4">T</tspan><tspan font-size="16" dy="-4"> = 0</tspan></text>
  <text x="450" y="246" text-anchor="middle" font-size="12" fill="#5b6b7c">回报 u 完全来自真实采样，不含任何自举估计</text>

  <rect x="40" y="278" width="330" height="126" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="205" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">③ N 条回合给出 N 个回报样本</text>
  <text x="66" y="334" font-size="12.5" fill="#1f2b38">第 1 条回合 → 样本 u<tspan font-size="10" dy="-5">(1)</tspan></text>
  <text x="66" y="360" font-size="12.5" fill="#1f2b38">第 2 条回合 → 样本 u<tspan font-size="10" dy="-5">(2)</tspan></text>
  <text x="66" y="386" font-size="12.5" fill="#1f2b38">⋯ 第 N 条回合 → 样本 u<tspan font-size="10" dy="-5">(N)</tspan></text>

  <path d="M374,341 H426" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="430" y="278" width="430" height="126" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="645" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">样本均值就是蒙特卡洛估计</text>
  <text x="645" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2b38">Q(s,a) ≈ (1/N) · Σ u<tspan font-size="10" dy="-5">(i)</tspan></text>
  <text x="645" y="366" text-anchor="middle" font-size="12" fill="#1f2b38">增量写法：Q ← Q + (u − Q) / N(s,a)</text>
  <text x="645" y="390" text-anchor="middle" font-size="12" fill="#5b6b7c">必须等回合结束；无偏但方差大</text>
</svg>
