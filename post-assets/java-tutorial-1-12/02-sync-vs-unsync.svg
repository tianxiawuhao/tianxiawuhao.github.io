<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>不加锁与加锁时 tickets-- 的执行对比</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">tickets-- 的并发执行：不加锁丢更新，加锁串行</text>

  <!-- 左：不加锁 -->
  <rect x="40" y="55" width="390" height="330" rx="10" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="82" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">不加 synchronized</text>
  <text x="235" y="104" font-size="12" fill="#5b6b7c" text-anchor="middle">两个线程同时读到 100</text>

  <rect x="70" y="125" width="330" height="26" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="235" y="143" font-size="12" fill="#1f2b38" text-anchor="middle">tickets = 100</text>
  <line x1="235" y1="151" x2="235" y2="171" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="55" y="173" width="150" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="191" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">线程 T1</text>
  <text x="130" y="207" font-size="11" fill="#5b6b7c" text-anchor="middle">读 100，算 99</text>
  <rect x="265" y="173" width="150" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="191" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">线程 T2</text>
  <text x="340" y="207" font-size="11" fill="#5b6b7c" text-anchor="middle">读 100，算 99</text>

  <line x1="130" y1="213" x2="130" y2="241" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="340" y1="213" x2="340" y2="241" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="55" y="243" width="360" height="26" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="235" y="261" font-size="12" fill="#1f2b38" text-anchor="middle">两次写回都是 99 —— 第 100 张票被卖两次</text>

  <line x1="45" y1="298" x2="425" y2="298" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="322" font-size="12" fill="#5b6b7c" text-anchor="middle">丢更新：读-改-写不是一步，两次读之间</text>
  <text x="235" y="342" font-size="12" fill="#5b6b7c" text-anchor="middle">另一个线程可以插进来</text>
  <text x="235" y="366" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">结果：卖出重复票号</text>

  <!-- 右：加锁 -->
  <rect x="470" y="55" width="390" height="330" rx="10" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="82" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">加 synchronized (lock)</text>
  <text x="665" y="104" font-size="12" fill="#5b6b7c" text-anchor="middle">同一把锁，进入临界区前先排队</text>

  <line x1="490" y1="130" x2="840" y2="130" stroke="#2f6fd0" stroke-width="3"/>
  <text x="665" y="122" font-size="11" fill="#5b6b7c" text-anchor="middle">时间轴 →</text>

  <rect x="498" y="150" width="160" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="578" y="168" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">T1 持锁</text>
  <text x="578" y="185" font-size="11" fill="#5b6b7c" text-anchor="middle">读 100 改 99 写回</text>

  <rect x="668" y="150" width="160" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="748" y="168" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">T2 持锁</text>
  <text x="748" y="185" font-size="11" fill="#5b6b7c" text-anchor="middle">读 99 改 98 写回</text>
  <line x1="658" y1="172" x2="666" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="498" y="215" width="330" height="26" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="663" y="233" font-size="12" fill="#1f2b38" text-anchor="middle">依次写回 99、98 —— 两次递减没有丢失</text>

  <line x1="475" y1="298" x2="855" y2="298" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="322" font-size="12" fill="#5b6b7c" text-anchor="middle">锁对象必须被所有线程共用，不能写在 run() 里</text>
  <text x="665" y="342" font-size="12" fill="#5b6b7c" text-anchor="middle">synchronized 方法锁 this，静态方法锁 类名.class</text>
  <text x="665" y="366" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">结果：票号不重复</text>

  <text x="450" y="418" font-size="12" fill="#5b6b7c" text-anchor="middle">volatile 只保证可见性，count++ 仍会丢更新；要原子性须用同步块或 AtomicInteger</text>
  <text x="450" y="442" font-size="12" fill="#5b6b7c" text-anchor="middle">临界区范围越小越好，只包住操作共享数据的那几行</text>
</svg>
