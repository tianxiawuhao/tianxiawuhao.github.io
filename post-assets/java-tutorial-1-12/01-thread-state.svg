<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>Thread.State 的六种状态与转换</title>
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">线程生命周期：Thread.State 只有六种</text>
<rect x="40" y="55" width="820" height="26" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="73" font-size="12" fill="#5b6b7c" text-anchor="middle">sleep 不释放锁；wait 释放锁；stop() 已废弃，会把数据停在改了一半的状态</text>
<rect x="60" y="115" width="140" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="130" y="138" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">NEW</text>
<text x="130" y="155" font-size="11" fill="#5b6b7c" text-anchor="middle">已创建未启动</text>
<line x1="200" y1="140" x2="274" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="238" y="132" font-size="11" fill="#5b6b7c" text-anchor="middle">start()</text>
<rect x="280" y="115" width="180" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="370" y="138" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">RUNNABLE</text>
<text x="370" y="155" font-size="11" fill="#5b6b7c" text-anchor="middle">排队等 CPU 或正在运行</text>
<line x1="460" y1="140" x2="694" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="577" y="132" font-size="11" fill="#5b6b7c" text-anchor="middle">run() 执行完毕</text>
<rect x="700" y="115" width="160" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="780" y="138" font-size="12" font-weight="700" fill="#5b6b7c" text-anchor="middle">TERMINATED</text>
<text x="780" y="155" font-size="11" fill="#5b6b7c" text-anchor="middle">已结束，状态不可逆</text>
<path d="M 330 165 L 330 213 L 130 213 L 130 234" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="238" y="205" font-size="11" fill="#5b6b7c" text-anchor="middle">等锁 / 拿到锁</text>
<line x1="400" y1="171" x2="400" y2="280" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="388" y="252" font-size="11" fill="#5b6b7c" text-anchor="end">wait() / join()</text>
<text x="388" y="268" font-size="11" fill="#5b6b7c" text-anchor="end">被 notify() 唤醒</text>
<line x1="600" y1="171" x2="600" y2="280" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="612" y="252" font-size="11" fill="#5b6b7c">sleep(ms) / wait(ms)</text>
<text x="612" y="268" font-size="11" fill="#5b6b7c">超时或被唤醒</text>
<rect x="60" y="238" width="140" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="130" y="258" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">BLOCKED</text>
<text x="130" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">等待锁释放</text>
<rect x="330" y="286" width="150" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="405" y="306" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">WAITING</text>
<text x="405" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">无限期等待唤醒</text>
<rect x="530" y="286" width="180" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="620" y="306" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">TIMED_WAITING</text>
<text x="620" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">限时等待</text>
<text x="450" y="352" font-size="11" fill="#5b6b7c" text-anchor="middle">六个状态里没有「就绪」和「运行」的区分，两者都归 RUNNABLE；状态转换由 JVM 与调度器决定，代码只能触发、不能指定</text>
</svg>
