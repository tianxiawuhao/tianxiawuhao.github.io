<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>Fast Leader Election 投票流程</title>
<rect width="900" height="540" fill="#ffffff"/>
<defs>
<marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
</defs>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Fast Leader Election：一次选举的投票流程</text>
<rect x="60" y="54" width="220" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="60" y="54" width="220" height="28" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="170" y="73" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">服务器 S1（myid=1）</text>
<text x="170" y="104" font-size="11.5" fill="#5b6b7c" text-anchor="middle">投票 (epoch, zxid, sid)</text>
<text x="170" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">(1, 12, 1)</text>
<rect x="340" y="54" width="220" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="340" y="54" width="220" height="28" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="73" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">服务器 S2（myid=2）</text>
<text x="450" y="104" font-size="11.5" fill="#5b6b7c" text-anchor="middle">投票 (epoch, zxid, sid)</text>
<text x="450" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">(1, 15, 2)</text>
<rect x="620" y="54" width="220" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="620" y="54" width="220" height="28" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="730" y="73" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">服务器 S3（myid=3）</text>
<text x="730" y="104" font-size="11.5" fill="#5b6b7c" text-anchor="middle">投票 (epoch, zxid, sid)</text>
<text x="730" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">(1, 15, 3)</text>
<path d="M 170 164 L 170 189" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#fl)"/>
<path d="M 450 164 L 450 189" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#fl)"/>
<path d="M 730 164 L 730 189" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="40" y="196" width="820" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="56" y="220" font-size="11.5" fill="#1f2b38">① 进入 LOOKING：先投自己一票，并把自己的选票广播给所有 participant（FLE 用 TCP 选举端口）</text>
<text x="56" y="238" font-size="11" fill="#5b6b7c">同一轮选举由 electionEpoch 标识，服务器只比较同一轮内的选票</text>
<path d="M 450 248 L 450 264" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="40" y="268" width="820" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="56" y="292" font-size="11.5" fill="#1f2b38">② 收到票就 PK：epoch 大者胜 → zxid 大者胜 → sid 大者胜</text>
<text x="56" y="312" font-size="11" fill="#5b6b7c">对方更优 → 改投对方并重新广播；对方更差 → 回发自己的票，提示对方改票</text>
<text x="56" y="330" font-size="11" fill="#5b6b7c">每台服务器在同一轮选举里只会认可一个 Leader</text>
<path d="M 450 336 L 450 352" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="40" y="356" width="820" height="56" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="56" y="380" font-size="11.5" fill="#1f2b38">③ 计票：某候选人得票 ≥ quorum（participant 数 ÷ 2 + 1，Observer 不计入）即定局</text>
<text x="56" y="398" font-size="11" fill="#5b6b7c">得票过半之前，任何节点都不会对外提供读写服务</text>
<path d="M 450 412 L 450 426" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="40" y="430" width="190" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="135" y="458" font-size="11.5" fill="#1f2b38" text-anchor="middle">Observer 不投票，</text>
<text x="135" y="478" font-size="11.5" fill="#1f2b38" text-anchor="middle">也不计入 quorum，</text>
<text x="135" y="496" font-size="11" fill="#5b6b7c" text-anchor="middle">只做数据同步与读</text>
<rect x="250" y="430" width="400" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="450" y="454" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">S3 当选 Leader → LEADING</text>
<text x="450" y="474" font-size="11.5" fill="#1f2b38" text-anchor="middle">S1、S2 转为 FOLLOWING，得票 3 ≥ quorum 2</text>
<text x="450" y="494" font-size="11" fill="#5b6b7c" text-anchor="middle">S2 与 S3 的 zxid 都是 15，sid 更大的 S3 胜出</text>
<rect x="670" y="430" width="190" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="765" y="458" font-size="11.5" fill="#1f2b38" text-anchor="middle">选举只在 participant</text>
<text x="765" y="478" font-size="11.5" fill="#1f2b38" text-anchor="middle">之间进行，两两 PK</text>
<text x="765" y="496" font-size="11" fill="#5b6b7c" text-anchor="middle">后快速收敛</text>
</svg>
