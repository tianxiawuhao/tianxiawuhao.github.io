<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>ZooKeeper 服务器状态机：LOOKING、LEADING、FOLLOWING、OBSERVING</title>
<rect width="900" height="480" fill="#ffffff"/>
<defs>
<marker id="sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
</defs>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">ZooKeeper 服务器状态机：谁在选举、谁是 Leader</text>
<rect x="60" y="170" width="200" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="160" y="198" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">LOOKING</text>
<text x="160" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">选举中：不对外提供服务</text>
<rect x="380" y="70" width="200" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="480" y="98" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">LEADING</text>
<text x="480" y="120" font-size="11" fill="#5b6b7c" text-anchor="middle">当前节点就是 Leader</text>
<rect x="380" y="210" width="200" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="480" y="238" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">FOLLOWING</text>
<text x="480" y="260" font-size="11" fill="#5b6b7c" text-anchor="middle">参与投票与过半确认</text>
<rect x="380" y="340" width="200" height="70" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
<text x="480" y="368" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">OBSERVING</text>
<text x="480" y="390" font-size="11" fill="#5b6b7c" text-anchor="middle">只同步数据、不投票</text>
<path d="M 260 245 L 374 245" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#sm)"/>
<text x="318" y="236" font-size="11" fill="#5b6b7c" text-anchor="middle">败选</text>
<path d="M 200 170 L 374 112" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#sm)"/>
<text x="282" y="130" font-size="11" fill="#2e9e5b" text-anchor="middle">自己当选 Leader</text>
<path d="M 400 280 L 400 440 L 160 440 L 160 246" fill="none" stroke="#e08a1e" stroke-width="1.6" marker-end="url(#sm)"/>
<text x="290" y="432" font-size="11" fill="#e08a1e" text-anchor="middle">心跳超时 / 与 Leader 失联</text>
<path d="M 400 70 L 400 50 L 160 50 L 160 164" fill="none" stroke="#e08a1e" stroke-width="1.6" marker-end="url(#sm)"/>
<text x="290" y="42" font-size="11" fill="#e08a1e" text-anchor="middle">失去过半联系 → 主动退位</text>
<path d="M 220 240 L 220 375 L 374 375" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#sm)"/>
<text x="300" y="366" font-size="11" fill="#5b6b7c" text-anchor="middle">Observer 同步后进入</text>
<rect x="640" y="70" width="240" height="340" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="655" y="96" font-size="12.5" font-weight="700" fill="#1f2b38">触发选举的时机</text>
<text x="655" y="120" font-size="11" fill="#1f2b38">1  集群启动初始化</text>
<text x="655" y="140" font-size="11" fill="#1f2b38">2  心跳超时（syncLimit×</text>
<text x="655" y="158" font-size="11" fill="#1f2b38">   tickTime 收不到 ping）</text>
<text x="655" y="178" font-size="11" fill="#1f2b38">3  Leader 失去过半联系，</text>
<text x="655" y="196" font-size="11" fill="#1f2b38">   主动退位回到 LOOKING</text>
<text x="655" y="228" font-size="12.5" font-weight="700" fill="#1f2b38">四种状态</text>
<text x="655" y="252" font-size="11" fill="#1f2b38">LOOKING    正在选举</text>
<text x="655" y="272" font-size="11" fill="#1f2b38">LEADING    主节点</text>
<text x="655" y="292" font-size="11" fill="#1f2b38">FOLLOWING  参与投票的从节点</text>
<text x="655" y="312" font-size="11" fill="#1f2b38">OBSERVING  只读不投票的从节点</text>
<text x="655" y="344" font-size="11" fill="#2f6fd0">只有 participant 参与投票，</text>
<text x="655" y="362" font-size="11" fill="#2f6fd0">Observer 不计入 quorum。</text>
</svg>
