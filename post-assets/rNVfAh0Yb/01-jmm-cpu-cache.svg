<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>单 CPU 双核的缓存结构：各核心独享 L1、共享 L2/L3 与主内存</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">单 CPU 双核的缓存结构（以独占 L1、共享 L2/L3 为例）</text>

  <rect x="60" y="70" width="360" height="160" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">核心 0</text>
  <rect x="90" y="115" width="300" height="40" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="140" text-anchor="middle" font-size="12" fill="#1f2b38">L1 缓存（私有，速度最快、容量最小）</text>
  <rect x="90" y="170" width="300" height="40" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="195" text-anchor="middle" font-size="12" fill="#1f2b38">L2 缓存（多数实现中为各核私有）</text>

  <rect x="480" y="70" width="360" height="160" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="660" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">核心 1</text>
  <rect x="510" y="115" width="300" height="40" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="660" y="140" text-anchor="middle" font-size="12" fill="#1f2b38">L1 缓存（私有，速度最快、容量最小）</text>
  <rect x="510" y="170" width="300" height="40" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="660" y="195" text-anchor="middle" font-size="12" fill="#1f2b38">L2 缓存（多数实现中为各核私有）</text>

  <text x="450" y="265" text-anchor="middle" font-size="11.5" fill="#5b6b7c">各核心的私有缓存可能同时保存同一个共享变量的副本</text>

  <rect x="60" y="290" width="780" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">L3 缓存 / 总线（多核共享）</text>
  <text x="450" y="335" text-anchor="middle" font-size="11.5" fill="#5b6b7c">容量更大、速度更慢，是核心之间交换数据的中转站</text>

  <rect x="60" y="390" width="780" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">主内存（所有核心共享）</text>
  <text x="450" y="435" text-anchor="middle" font-size="11.5" fill="#5b6b7c">容量最大、速度最慢，是共享变量的最终存放位置</text>

  <line x1="300" y1="286" x2="300" y2="254" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="600" y1="286" x2="600" y2="254" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="386" x2="450" y2="350" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="466" y="372" font-size="11" fill="#5b6b7c">读写</text>
</svg>
