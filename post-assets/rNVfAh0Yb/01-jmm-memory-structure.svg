<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 内存模型：主内存、线程工作内存与八种原子操作</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java 内存模型：主内存、工作内存与八种原子操作</text>

  <rect x="270" y="55" width="360" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">主内存（所有线程共享）</text>
  <text x="450" y="101" text-anchor="middle" font-size="11.5" fill="#5b6b7c">实例字段、静态字段、数组元素</text>

  <rect x="30" y="210" width="330" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="195" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">线程 A 的工作内存</text>
  <text x="195" y="260" text-anchor="middle" font-size="11.5" fill="#5b6b7c">主内存变量的副本</text>
  <text x="195" y="280" text-anchor="middle" font-size="11.5" fill="#5b6b7c">线程私有，其他线程不可见</text>
  <text x="195" y="300" text-anchor="middle" font-size="11.5" fill="#5b6b7c">对应虚拟机栈中的部分区域</text>
  <text x="195" y="323" text-anchor="middle" font-size="11.5" fill="#5b6b7c">（不要与堆、栈、方法区混淆）</text>

  <rect x="540" y="210" width="330" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="705" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">线程 B 的工作内存</text>
  <text x="705" y="260" text-anchor="middle" font-size="11.5" fill="#5b6b7c">主内存变量的副本</text>
  <text x="705" y="280" text-anchor="middle" font-size="11.5" fill="#5b6b7c">各自持有副本 → 可能不一致</text>
  <text x="705" y="300" text-anchor="middle" font-size="11.5" fill="#5b6b7c">线程间通信必须经过主内存</text>

  <line x1="150" y1="208" x2="150" y2="116" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="360" y1="118" x2="360" y2="206" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahr)"/>
  <text x="158" y="168" font-size="11" fill="#5b6b7c">read · load</text>
  <text x="368" y="168" font-size="11" fill="#5b6b7c">store · write</text>
  <line x1="600" y1="208" x2="600" y2="116" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="690" y1="118" x2="690" y2="206" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahr)"/>
  <text x="530" y="168" text-anchor="end" font-size="11" fill="#5b6b7c">read · load</text>
  <text x="700" y="168" font-size="11" fill="#5b6b7c">store · write</text>

  <rect x="30" y="375" width="840" height="100" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="402" font-size="13" font-weight="700" fill="#1f2b38">作用于主内存：lock（锁定）、unlock（解锁）、read（读取）、write（写入）</text>
  <text x="50" y="426" font-size="12" fill="#5b6b7c">作用于工作内存：load（载入）、use（使用）、assign（赋值）、store（存储）</text>
  <text x="50" y="452" font-size="11.5" fill="#5b6b7c">read / load 成对、store / write 成对，不允许单独出现；变量必须先 assign 再 store，不允许丢弃最近的 assign。</text>
</svg>
