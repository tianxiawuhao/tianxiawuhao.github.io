<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>BOM 分类维度与层级结构对照图</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">BOM 分类维度与层级结构对照</text>

  <!-- 表头 -->
  <rect x="30" y="50" width="840" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="182" y="70" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">按视角命名（设计/工艺/生产/服务）</text>
  <text x="450" y="70" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">按生命周期阶段</text>
  <text x="718" y="70" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">按结构层级</text>

  <!-- 第一列：按视角 -->
  <rect x="30" y="90" width="304" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="110" font-size="12.5" fill="#1f2b38" font-weight="700">EBOM 工程BOM</text>
  <text x="46" y="129" font-size="11.5" fill="#5b6b7c">设计结构：图号、位号、</text>
  <text x="46" y="147" font-size="11.5" fill="#5b6b7c">装配关系，来自 CAD</text>
  <text x="46" y="171" font-size="12.5" fill="#1f2b38" font-weight="700">PBOM 工艺BOM</text>
  <text x="46" y="190" font-size="11.5" fill="#5b6b7c">加工艺路线、工装与工艺</text>
  <text x="46" y="208" font-size="11.5" fill="#5b6b7c">合件（有的企业指采购BOM）</text>
  <text x="46" y="232" font-size="12.5" fill="#1f2b38" font-weight="700">MBOM 制造BOM</text>
  <text x="46" y="251" font-size="11.5" fill="#5b6b7c">面向生产：装配顺序、</text>
  <text x="46" y="269" font-size="11.5" fill="#5b6b7c">工作中心、辅料与损耗</text>

  <rect x="30" y="300" width="304" height="82" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="46" y="320" font-size="12.5" fill="#1f2b38" font-weight="700">服务BOM（Service BOM）</text>
  <text x="46" y="339" font-size="11.5" fill="#5b6b7c">备件、易损件、维修与保养</text>
  <text x="46" y="357" font-size="11.5" fill="#5b6b7c">清单，供售后与备件计划使用</text>
  <text x="46" y="375" font-size="11" fill="#5b6b7c">注：SBOM 也可指软件物料清单</text>

  <!-- 第二列：生命周期阶段 -->
  <rect x="360" y="90" width="180" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="110" font-size="12.5" fill="#1f2b38" text-anchor="middle">设计阶段</text>
  <text x="450" y="127" font-size="11" fill="#5b6b7c" text-anchor="middle">设计BOM</text>
  <line x1="450" y1="136" x2="450" y2="148" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="360" y="150" width="180" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="170" font-size="12.5" fill="#1f2b38" text-anchor="middle">工程开发阶段</text>
  <text x="450" y="187" font-size="11" fill="#5b6b7c" text-anchor="middle">工程BOM</text>
  <line x1="450" y1="196" x2="450" y2="208" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="360" y="210" width="180" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="230" font-size="12.5" fill="#1f2b38" text-anchor="middle">制造阶段</text>
  <text x="450" y="247" font-size="11" fill="#5b6b7c" text-anchor="middle">制造BOM</text>
  <line x1="450" y1="256" x2="450" y2="268" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="360" y="270" width="180" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="290" font-size="12.5" fill="#1f2b38" text-anchor="middle">销售阶段</text>
  <text x="450" y="307" font-size="11" fill="#5b6b7c" text-anchor="middle">销售BOM</text>
  <line x1="450" y1="316" x2="450" y2="328" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="360" y="330" width="180" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="350" font-size="12.5" fill="#1f2b38" text-anchor="middle">售后服务阶段</text>
  <text x="450" y="367" font-size="11" fill="#5b6b7c" text-anchor="middle">服务BOM</text>

  <!-- 第三列：结构层级 -->
  <rect x="570" y="90" width="300" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="586" y="108" font-size="12.5" fill="#1f2b38" font-weight="700">L0 总装（成品）</text>
  <text x="586" y="125" font-size="11" fill="#5b6b7c">Top-Level BOM</text>
  <line x1="720" y1="132" x2="720" y2="144" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="570" y="146" width="300" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="586" y="164" font-size="12.5" fill="#1f2b38" font-weight="700">L1 子装配件</text>
  <text x="586" y="181" font-size="11" fill="#5b6b7c">Sub-assembly BOM</text>
  <line x1="720" y1="188" x2="720" y2="200" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="570" y="202" width="300" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="586" y="220" font-size="12.5" fill="#1f2b38" font-weight="700">L2 零部件</text>
  <text x="586" y="237" font-size="11" fill="#5b6b7c">Component BOM</text>
  <line x1="720" y1="244" x2="720" y2="256" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="570" y="258" width="300" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="586" y="276" font-size="12.5" fill="#1f2b38" font-weight="700">L3 原材料 / 外购件</text>
  <text x="586" y="293" font-size="11" fill="#5b6b7c">Material BOM</text>

  <rect x="570" y="312" width="300" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="586" y="332" font-size="11.5" fill="#1f2b38" font-weight="700">父子件关系字段</text>
  <text x="586" y="350" font-size="11" fill="#5b6b7c">父件 / 子件 / 单位用量 / 层级号</text>
  <text x="586" y="368" font-size="11" fill="#5b6b7c">行号位号 / 损耗率 / 低阶码展开</text>

  <!-- 底部横条 -->
  <rect x="30" y="398" width="840" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="46" y="419" font-size="12.5" fill="#1f2b38" font-weight="700">分类维度不互斥：同一份产品数据，换个视角就换一个 BOM 名称</text>
  <text x="46" y="439" font-size="11.5" fill="#5b6b7c">串联它们的公共基础是物料主数据（物料编码、单位、来源、提前期）与版本/有效性（版本号 + 生效日期或序号），</text>
  <text x="46" y="455" font-size="11.5" fill="#5b6b7c">再经工艺路线把 EBOM 转成 MBOM，MRP 据此展开需求，ERP 据此核算标准成本。</text>
</svg>
