<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>BOM 层级、父子件与版本有效性</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">BOM 层级、父子件与版本有效性</text>
  <text x="450" y="48" text-anchor="middle" font-size="11.5" fill="#5b6b7c">括号内为父件下的单位用量（基础数量），数字随层级逐级倍增</text>

  <text x="50" y="82" font-size="11" fill="#5b6b7c">层级 0 · 成品</text>
  <text x="50" y="140" font-size="11" fill="#5b6b7c">层级 1 · 子件 / 组件</text>
  <text x="50" y="198" font-size="11" fill="#5b6b7c">层级 2 · 零件 / 原材料</text>

  <rect x="320" y="60" width="240" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="440" y="88" text-anchor="middle" font-size="12.5" fill="#1f2b38">A 工业路由器（成品）</text>

  <line x1="440" y1="106" x2="440" y2="130" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="165" y1="130" x2="715" y2="130" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="165" y1="130" x2="165" y2="166" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="440" y1="130" x2="440" y2="166" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="715" y1="130" x2="715" y2="166" stroke="#5b6b7c" stroke-width="1.4"/>

  <rect x="80" y="168" width="170" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="165" y="196" text-anchor="middle" font-size="12" fill="#1f2b38">B 主机单元（×1）</text>
  <rect x="355" y="168" width="170" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="440" y="196" text-anchor="middle" font-size="12" fill="#1f2b38">C 附件包（×1）</text>
  <rect x="630" y="168" width="170" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="715" y="196" text-anchor="middle" font-size="12" fill="#1f2b38">D 包装材料（×1）</text>

  <line x1="115" y1="214" x2="115" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="250" y1="214" x2="250" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="200" y1="234" x2="260" y2="234" stroke="#5b6b7c" stroke-width="1.4"/>

  <line x1="440" y1="214" x2="440" y2="234" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="390" y1="234" x2="610" y2="234" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="390" y1="234" x2="390" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="610" y1="234" x2="610" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>

  <line x1="715" y1="214" x2="715" y2="234" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="680" y1="234" x2="860" y2="234" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="680" y1="234" x2="680" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="860" y1="234" x2="860" y2="252" stroke="#5b6b7c" stroke-width="1.4"/>

  <rect x="40" y="254" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="279" text-anchor="middle" font-size="11.5" fill="#1f2b38">主板组件（×1）</text>
  <rect x="210" y="254" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="285" y="279" text-anchor="middle" font-size="11.5" fill="#1f2b38">电源模块（×1）</text>
  <rect x="380" y="254" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="455" y="279" text-anchor="middle" font-size="11.5" fill="#1f2b38">螺钉 M3（×4）</text>
  <rect x="545" y="254" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="620" y="279" text-anchor="middle" font-size="11.5" fill="#1f2b38">网线（×2）</text>
  <rect x="710" y="254" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="785" y="279" text-anchor="middle" font-size="11.5" fill="#1f2b38">纸箱（×1）</text>

  <text x="40" y="316" font-size="11" fill="#5b6b7c">合计用量按层级相乘：螺钉 M3 的整机用量 = 4 · 1 · 1 = 4 件</text>

  <rect x="290" y="330" width="580" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="306" y="352" font-size="11.5" fill="#1f2b38">版本 V1.0 有效 2024-01-01 起 · V2.0 自 2024-07-01 生效（工程变更 ECO 切换）</text>
</svg>
