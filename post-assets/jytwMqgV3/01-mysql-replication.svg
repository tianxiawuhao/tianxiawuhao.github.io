<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MySQL 主从复制：三个线程与两类日志</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">MySQL 主从复制：三个线程与两类日志</text>

  <rect x="40" y="60" width="300" height="270" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="190" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">主库 master</text>
  <rect x="70" y="100" width="240" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="124" text-anchor="middle" font-size="12" fill="#1f2b38">客户端写入 / 事务提交</text>
  <line x1="190" y1="138" x2="190" y2="156" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="70" y="160" width="240" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="190" y="184" text-anchor="middle" font-size="12" fill="#1f2b38">binlog（二进制日志）</text>
  <line x1="190" y1="198" x2="190" y2="216" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="70" y="220" width="240" height="38" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="190" y="244" text-anchor="middle" font-size="12" fill="#1f2b38">binlog dump 线程</text>
  <text x="190" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">事务提交时写入 binlog</text>

  <rect x="560" y="60" width="300" height="270" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="710" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5bd0">从库 slave / replica</text>
  <rect x="590" y="100" width="240" height="38" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="710" y="124" text-anchor="middle" font-size="12" fill="#1f2b38">I/O 线程</text>
  <line x1="710" y1="138" x2="710" y2="156" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="590" y="160" width="240" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="710" y="184" text-anchor="middle" font-size="12" fill="#1f2b38">relay log（中继日志）</text>
  <line x1="710" y1="198" x2="710" y2="216" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="590" y="220" width="240" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="710" y="244" text-anchor="middle" font-size="12" fill="#1f2b38">SQL 线程</text>
  <text x="710" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">重放事件，保持数据一致</text>

  <line x1="312" y1="239" x2="586" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="449" y="165" text-anchor="middle" font-size="11" fill="#5b6b7c">推送 binlog 事件</text>
</svg>
