<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>垂直分表（拆列）与水平分表（拆行）</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">垂直分表（拆列）与水平分表（拆行）</text>

  <rect x="30" y="52" width="400" height="278" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">垂直分表：按列拆分</text>
  <rect x="60" y="96" width="340" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="118" text-anchor="middle" font-size="12" fill="#1f2b38">原表 user（字段很多、冷热混合）</text>
  <text x="230" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">id | 账号 | 密码 | 昵称 | 头像 | 地址</text>
  <line x1="230" y1="148" x2="150" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="230" y1="148" x2="310" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="178" width="150" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="135" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">user_auth</text>
  <text x="135" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">id | 账号 | 密码</text>
  <rect x="250" y="178" width="150" height="64" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="325" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">user_profile</text>
  <text x="325" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">id | 昵称 | 头像 | 地址</text>
  <line x1="42" y1="262" x2="418" y2="262" stroke="#c8d3e0" stroke-width="1"/>
  <text x="44" y="284" font-size="11" fill="#5b6b7c">优点：行变小，查询时减少读取的 Block 数和 I/O 次数</text>
  <text x="44" y="306" font-size="11" fill="#5b6b7c">缺点：主键冗余，跨表查询要在应用层做 Join</text>

  <rect x="470" y="52" width="400" height="278" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5bd0">水平分表：按行拆分</text>
  <rect x="500" y="96" width="340" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="118" text-anchor="middle" font-size="12" fill="#1f2b38">原表 user（单表数据量很大）</text>
  <text x="670" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">全部数据行 id 1 ~ N</text>
  <line x1="670" y1="148" x2="590" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="148" x2="750" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="500" y="178" width="150" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="575" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">user_0</text>
  <text x="575" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">id % 2 = 0</text>
  <rect x="690" y="178" width="150" height="64" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">user_1</text>
  <text x="765" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">id % 2 = 1</text>
  <line x1="482" y1="262" x2="858" y2="262" stroke="#c8d3e0" stroke-width="1"/>
  <text x="484" y="284" font-size="11" fill="#5b6b7c">优点：可支撑非常大的数据量，应用端改造少</text>
  <text x="484" y="306" font-size="11" fill="#5b6b7c">缺点：分片事务难解决，跨节点 Join 与分页复杂</text>

  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#5b6b7c">垂直拆列、水平拆行，两者可以组合使用；水平拆分最好配合分库</text>
</svg>
