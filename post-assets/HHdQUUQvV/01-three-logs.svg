<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>binlog、redo log、undo log 三种日志的层次与职责</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">binlog、redo log、undo log 的层次与职责</text>

  <rect x="30" y="55" width="840" height="140" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="80" font-size="13" font-weight="700" fill="#1f2b38">MySQL Server 层</text>

  <rect x="52" y="96" width="300" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="202" y="126" font-size="14" font-weight="700" text-anchor="middle" fill="#2f6fd0">binlog（二进制日志）</text>
  <text x="202" y="150" font-size="12" text-anchor="middle" fill="#1f2b38">记录写入性操作，追加写入，不覆盖</text>
  <text x="202" y="168" font-size="12" text-anchor="middle" fill="#5b6b7c">用于主从复制与数据恢复（归档）</text>

  <rect x="392" y="96" width="150" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="467" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2b38">所有存储引擎</text>
  <text x="467" y="148" font-size="12" text-anchor="middle" fill="#5b6b7c">只要开启就会记录</text>

  <text x="580" y="126" font-size="12" fill="#5b6b7c">逻辑日志：记录的是 SQL 语句等逻辑变更</text>
  <text x="580" y="148" font-size="12" fill="#5b6b7c">与存储引擎无关，能力不含 crash-safe</text>

  <rect x="30" y="215" width="840" height="160" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="240" font-size="13" font-weight="700" fill="#1f2b38">InnoDB 引擎层</text>

  <rect x="52" y="256" width="380" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="242" y="284" font-size="14" font-weight="700" text-anchor="middle" fill="#e08a1e">redo log（重做日志）</text>
  <text x="242" y="308" font-size="12" text-anchor="middle" fill="#1f2b38">记录数据页的物理变更，大小固定、循环写</text>
  <text x="242" y="328" font-size="12" text-anchor="middle" fill="#1f2b38">保证持久性：宕机后按日志重做，具备 crash-safe</text>
  <text x="242" y="348" font-size="12" text-anchor="middle" fill="#5b6b7c">先写日志再写磁盘（WAL）</text>

  <rect x="468" y="256" width="380" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="658" y="284" font-size="14" font-weight="700" text-anchor="middle" fill="#2e9e5b">undo log（回滚日志）</text>
  <text x="658" y="308" font-size="12" text-anchor="middle" fill="#1f2b38">记录数据的逻辑变化，保存变更前的旧版本</text>
  <text x="658" y="328" font-size="12" text-anchor="middle" fill="#1f2b38">保证原子性：出错时回滚到事务前状态</text>
  <text x="658" y="348" font-size="12" text-anchor="middle" fill="#5b6b7c">也是 MVCC 多版本并发控制的关键</text>

  <line x1="242" y1="215" x2="242" y2="176" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="658" y1="215" x2="658" y2="176" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
