<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>innodb_flush_log_at_trx_commit 三种取值下 redo log 的写入与刷盘时机</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">innodb_flush_log_at_trx_commit 三种取值的刷盘时机</text>

  <text x="30" y="72" font-size="12" fill="#5b6b7c">内存</text>
  <text x="560" y="72" font-size="12" fill="#5b6b7c">磁盘</text>

  <rect x="30" y="85" width="200" height="88" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#2f6fd0">0：延迟写</text>
  <text x="130" y="142" font-size="12" text-anchor="middle" fill="#1f2b38">提交时不刷盘</text>

  <rect x="270" y="85" width="250" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="395" y="112" font-size="12" text-anchor="middle" fill="#1f2b38">redo log buffer → OS buffer</text>
  <text x="395" y="136" font-size="12" text-anchor="middle" fill="#1f2b38">每秒 fsync() 一次 → redo log file</text>

  <rect x="560" y="85" width="310" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="715" y="112" font-size="12" text-anchor="middle" fill="#1f2b38">每秒才落盘一次，性能最好</text>
  <text x="715" y="136" font-size="12" text-anchor="middle" fill="#2e9e5b">mysqld 崩溃或宕机最多丢 1 秒事务</text>

  <rect x="30" y="203" width="200" height="88" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#2f6fd0">1：实时写、实时刷</text>
  <text x="130" y="260" font-size="12" text-anchor="middle" fill="#1f2b38">默认值</text>

  <rect x="270" y="203" width="250" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="395" y="230" font-size="12" text-anchor="middle" fill="#1f2b38">提交时写入 OS buffer</text>
  <text x="395" y="254" font-size="12" text-anchor="middle" fill="#1f2b38">并立即 fsync() → redo log file</text>

  <rect x="560" y="203" width="310" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="715" y="230" font-size="12" text-anchor="middle" fill="#1f2b38">数据最安全，事务不丢</text>
  <text x="715" y="254" font-size="12" text-anchor="middle" fill="#e08a1e">每次提交都刷盘，IO 开销最大</text>

  <rect x="30" y="321" width="200" height="88" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="354" font-size="14" font-weight="700" text-anchor="middle" fill="#2f6fd0">2：实时写、延迟刷</text>
  <text x="130" y="378" font-size="12" text-anchor="middle" fill="#1f2b38">折中方案</text>

  <rect x="270" y="321" width="250" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="395" y="348" font-size="12" text-anchor="middle" fill="#1f2b38">提交时仅写入 OS buffer</text>
  <text x="395" y="372" font-size="12" text-anchor="middle" fill="#1f2b38">每秒 fsync() → redo log file</text>

  <rect x="560" y="321" width="310" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="715" y="348" font-size="12" text-anchor="middle" fill="#1f2b38">只在操作系统崩溃或断电时丢数据</text>
  <text x="715" y="372" font-size="12" text-anchor="middle" fill="#e08a1e">mysqld 进程崩溃不影响已提交事务</text>

  <line x1="230" y1="129" x2="268" y2="129" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="230" y1="247" x2="268" y2="247" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="230" y1="365" x2="268" y2="365" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="520" y1="129" x2="558" y2="129" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="520" y1="247" x2="558" y2="247" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="520" y1="365" x2="558" y2="365" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
