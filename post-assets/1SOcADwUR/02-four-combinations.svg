<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四种组合方式：发送方是否等待响应 与 接收方 IO 是否等待</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">四种组合方式：发送方是否等待响应 × 接收方 IO 是否等待</text>

  <text x="340" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">接收方：IO 阻塞（未就绪就等）</text>
  <text x="700" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">接收方：IO 非阻塞（未就绪立即返回）</text>

  <rect x="20" y="76" width="130" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="85" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">发送方</text>
  <text x="85" y="148" text-anchor="middle" font-size="12" fill="#5b6b7c">同步等待</text>
  <rect x="20" y="206" width="130" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="85" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">发送方</text>
  <text x="85" y="278" text-anchor="middle" font-size="12" fill="#5b6b7c">异步等待</text>

  <rect x="170" y="76" width="340" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="340" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">同步阻塞</text>
  <text x="340" y="130" text-anchor="middle" font-size="11" fill="#5b6b7c">发送方：发出请求后一直等待响应</text>
  <text x="340" y="150" text-anchor="middle" font-size="11" fill="#5b6b7c">接收方：IO 未就绪就一直等，期间</text>
  <text x="340" y="170" text-anchor="middle" font-size="11" fill="#5b6b7c">不处理其他请求（最常用）</text>

  <rect x="530" y="76" width="340" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="700" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">同步非阻塞</text>
  <text x="700" y="130" text-anchor="middle" font-size="11" fill="#5b6b7c">发送方：发出请求后一直等待响应</text>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#5b6b7c">接收方：IO 未就绪立即返回，先做</text>
  <text x="700" y="170" text-anchor="middle" font-size="11" fill="#5b6b7c">其他事，完成后才响应（实际不应用）</text>

  <rect x="170" y="206" width="340" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="340" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">异步阻塞</text>
  <text x="340" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">发送方：发出请求后继续做其他事</text>
  <text x="340" y="280" text-anchor="middle" font-size="11" fill="#5b6b7c">接收方：IO 未就绪就一直等，期间</text>
  <text x="340" y="300" text-anchor="middle" font-size="11" fill="#5b6b7c">不处理其他请求（实际不应用）</text>

  <rect x="530" y="206" width="340" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="700" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">异步非阻塞</text>
  <text x="700" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">发送方：发出请求后继续做其他事</text>
  <text x="700" y="280" text-anchor="middle" font-size="11" fill="#5b6b7c">接收方：IO 未就绪立即返回，完成</text>
  <text x="700" y="300" text-anchor="middle" font-size="11" fill="#5b6b7c">后通知并响应发送方（效率最高）</text>

  <rect x="170" y="336" width="12" height="12" rx="2" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="190" y="346" font-size="11" fill="#5b6b7c">最常用</text>
  <rect x="330" y="336" width="12" height="12" rx="2" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="350" y="346" font-size="11" fill="#5b6b7c">需轮询或等通知</text>
  <rect x="530" y="336" width="12" height="12" rx="2" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="550" y="346" font-size="11" fill="#5b6b7c">效率最高</text>
  <rect x="700" y="336" width="12" height="12" rx="2" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="720" y="346" font-size="11" fill="#5b6b7c">实际不应用</text>

  <text x="450" y="380" text-anchor="middle" font-size="11" fill="#5b6b7c">按“发送方是否等待响应”与“接收方 IO 是否等待”抽象划分，和 Linux 五种 IO 模型不是同一套分类</text>
</svg>
