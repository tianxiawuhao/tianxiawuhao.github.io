<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>IO 的两个阶段：阶段 1 决定阻塞与非阻塞，阶段 2 决定同步与异步</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">IO 的两个阶段：阻塞看阶段 1，同步看阶段 2</text>

  <rect x="50" y="58" width="360" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">阶段 1：数据准备</text>
  <text x="230" y="112" text-anchor="middle" font-size="12" fill="#5b6b7c">等待数据到达内核缓冲区</text>
  <text x="230" y="134" text-anchor="middle" font-size="12" fill="#5b6b7c">等网卡收包、等磁盘读入页缓存</text>

  <rect x="490" y="58" width="360" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">阶段 2：数据复制</text>
  <text x="670" y="112" text-anchor="middle" font-size="12" fill="#5b6b7c">内核缓冲区 → 用户进程缓冲区</text>
  <text x="670" y="134" text-anchor="middle" font-size="12" fill="#5b6b7c">这一步必须做，区别只在由谁来做</text>

  <line x1="414" y1="110" x2="484" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="230" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">判定阻塞 / 非阻塞</text>
  <text x="670" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">判定同步 / 异步</text>
  <line x1="230" y1="202" x2="230" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="202" x2="670" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="50" y="236" width="360" height="116" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">同步 IO（阶段 2 由用户线程完成）</text>
  <text x="230" y="290" text-anchor="middle" font-size="11" fill="#5b6b7c">阻塞 IO · 非阻塞 IO</text>
  <text x="230" y="310" text-anchor="middle" font-size="11" fill="#5b6b7c">IO 多路复用（select / poll / epoll）</text>
  <text x="230" y="330" text-anchor="middle" font-size="11" fill="#5b6b7c">信号驱动 IO</text>

  <rect x="490" y="236" width="360" height="116" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">异步 IO（阶段 2 由内核完成）</text>
  <text x="670" y="290" text-anchor="middle" font-size="11" fill="#5b6b7c">Linux native AIO · io_uring</text>
  <text x="670" y="310" text-anchor="middle" font-size="11" fill="#5b6b7c">内核复制完成后，用信号或回调</text>
  <text x="670" y="330" text-anchor="middle" font-size="11" fill="#5b6b7c">把结果通知用户线程</text>

  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b7c">只有真正的异步 IO 不阻塞阶段 2，其余四种常见模型都归入同步 IO</text>
</svg>
