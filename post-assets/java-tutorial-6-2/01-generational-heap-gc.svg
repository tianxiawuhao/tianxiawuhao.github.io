<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>分代堆结构：新生代 8:1:1 与对象晋升路径</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">分代堆：新生代 8:1:1 与对象晋升</text>

  <rect x="30" y="58" width="840" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="48" y="80" font-size="13" font-weight="700" fill="#1f2b38">堆（Heap）</text>

  <rect x="48" y="90" width="556" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="62" y="112" font-size="11.5" font-weight="700" fill="#2f6fd0">新生代 Eden : S0 : S1 = 8 : 1 : 1</text>

  <rect x="62" y="124" width="411" height="68" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="267" y="162" text-anchor="middle" font-size="12" fill="#1f2b38">Eden（8）</text>

  <rect x="481" y="124" width="51" height="68" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="506" y="162" text-anchor="middle" font-size="11.5" fill="#1f2b38">S0</text>

  <rect x="540" y="124" width="51" height="68" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="565" y="162" text-anchor="middle" font-size="11.5" fill="#1f2b38">S1</text>

  <rect x="628" y="90" width="224" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="642" y="112" font-size="11.5" font-weight="700" fill="#2e9e5b">老年代（Old / Tenured）</text>
  <text x="642" y="138" font-size="11" fill="#5b6b7c">存活率高，适合标记-整理</text>
  <text x="642" y="160" font-size="11" fill="#5b6b7c">或标记-清除算法</text>
  <text x="642" y="182" font-size="11" fill="#5b6b7c">空间不足触发 Full GC</text>

  <line x1="606" y1="158" x2="626" y2="158" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="616" y="144" text-anchor="middle" font-size="10.5" fill="#5b6b7c">晋升</text>

  <text x="48" y="236" font-size="11.5" fill="#5b6b7c">对象每熬过一次 GC 年龄 +1，达到 -XX:MaxTenuringThreshold（默认 15）或 Survivor 空间不足时晋升老年代。</text>
  <text x="48" y="260" font-size="11.5" fill="#5b6b7c">大对象（如 new byte[4 * 1024 * 1024]）通常直接进入老年代，避免在 Eden 与 Survivor 之间反复复制。</text>

  <rect x="30" y="282" width="410" height="98" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="46" y="308" font-size="12.5" font-weight="700" fill="#2f6fd0">Minor GC / Young GC</text>
  <text x="46" y="334" font-size="11" fill="#5b6b7c">Eden 耗尽时触发：Eden 与 From 的存活对象</text>
  <text x="46" y="356" font-size="11" fill="#5b6b7c">复制到 To，然后清空前两者并交换 S0 / S1 角色</text>

  <rect x="460" y="282" width="410" height="98" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="476" y="308" font-size="12.5" font-weight="700" fill="#e08a1e">Full GC</text>
  <text x="476" y="334" font-size="11" fill="#5b6b7c">老年代空间不足时触发，作用于全堆</text>
  <text x="476" y="356" font-size="11" fill="#5b6b7c">所有分代收集器都有 STW，停顿明显更长</text>
</svg>
