<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>行式存储与列式存储的读取方式对比</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">行式存储与列式存储的读取方式对比</text>

  <rect x="40" y="55" width="380" height="290" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="80" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">行式存储：数据按行连续存放</text>
  <text x="134" y="96" font-size="11" fill="#5b6b7c" text-anchor="middle">C1</text>
  <text x="198" y="96" font-size="11" fill="#2f6fd0" text-anchor="middle">C2</text>
  <text x="262" y="96" font-size="11" fill="#5b6b7c" text-anchor="middle">C3</text>
  <text x="326" y="96" font-size="11" fill="#2f6fd0" text-anchor="middle">C4</text>

  <text x="94" y="121" font-size="11" fill="#5b6b7c" text-anchor="end">R1</text>
  <rect x="104" y="100" width="252" height="34" rx="4" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <line x1="168" y1="100" x2="168" y2="134" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="232" y1="100" x2="232" y2="134" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="296" y1="100" x2="296" y2="134" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <text x="134" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">R1C1</text>
  <text x="198" y="121" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R1C2</text>
  <text x="262" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">R1C3</text>
  <text x="326" y="121" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R1C4</text>

  <text x="94" y="159" font-size="11" fill="#5b6b7c" text-anchor="end">R2</text>
  <rect x="104" y="138" width="252" height="34" rx="4" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <line x1="168" y1="138" x2="168" y2="172" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="232" y1="138" x2="232" y2="172" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="296" y1="138" x2="296" y2="172" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <text x="134" y="159" font-size="11" fill="#5b6b7c" text-anchor="middle">R2C1</text>
  <text x="198" y="159" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R2C2</text>
  <text x="262" y="159" font-size="11" fill="#5b6b7c" text-anchor="middle">R2C3</text>
  <text x="326" y="159" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R2C4</text>

  <text x="94" y="197" font-size="11" fill="#5b6b7c" text-anchor="end">R3</text>
  <rect x="104" y="176" width="252" height="34" rx="4" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <line x1="168" y1="176" x2="168" y2="210" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="232" y1="176" x2="232" y2="210" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="296" y1="176" x2="296" y2="210" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <text x="134" y="197" font-size="11" fill="#5b6b7c" text-anchor="middle">R3C1</text>
  <text x="198" y="197" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R3C2</text>
  <text x="262" y="197" font-size="11" fill="#5b6b7c" text-anchor="middle">R3C3</text>
  <text x="326" y="197" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R3C4</text>

  <text x="94" y="235" font-size="11" fill="#5b6b7c" text-anchor="end">R4</text>
  <rect x="104" y="214" width="252" height="34" rx="4" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <line x1="168" y1="214" x2="168" y2="248" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="232" y1="214" x2="232" y2="248" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <line x1="296" y1="214" x2="296" y2="248" stroke="#e08a1e" stroke-width="1" opacity="0.5"/>
  <text x="134" y="235" font-size="11" fill="#5b6b7c" text-anchor="middle">R4C1</text>
  <text x="198" y="235" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R4C2</text>
  <text x="262" y="235" font-size="11" fill="#5b6b7c" text-anchor="middle">R4C3</text>
  <text x="326" y="235" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R4C4</text>

  <text x="230" y="286" font-size="12" fill="#5b6b7c" text-anchor="middle">查询只用到 C2、C4 两列</text>
  <text x="230" y="312" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">行存要整行读入：4 行 × 4 列 = 16 格</text>

  <rect x="480" y="55" width="380" height="290" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="80" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">列式存储：数据按列连续存放</text>
  <text x="574" y="96" font-size="11" fill="#5b6b7c" text-anchor="middle">C1</text>
  <text x="638" y="96" font-size="11" fill="#2f6fd0" text-anchor="middle">C2</text>
  <text x="702" y="96" font-size="11" fill="#5b6b7c" text-anchor="middle">C3</text>
  <text x="766" y="96" font-size="11" fill="#2f6fd0" text-anchor="middle">C4</text>

  <text x="534" y="121" font-size="11" fill="#5b6b7c" text-anchor="end">R1</text>
  <text x="534" y="159" font-size="11" fill="#5b6b7c" text-anchor="end">R2</text>
  <text x="534" y="197" font-size="11" fill="#5b6b7c" text-anchor="end">R3</text>
  <text x="534" y="235" font-size="11" fill="#5b6b7c" text-anchor="end">R4</text>

  <rect x="544" y="100" width="60" height="148" rx="4" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="544" y1="138" x2="604" y2="138" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="544" y1="176" x2="604" y2="176" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="544" y1="214" x2="604" y2="214" stroke="#c8d3e0" stroke-width="1"/>
  <text x="574" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">R1C1</text>
  <text x="574" y="159" font-size="11" fill="#5b6b7c" text-anchor="middle">R2C1</text>
  <text x="574" y="197" font-size="11" fill="#5b6b7c" text-anchor="middle">R3C1</text>
  <text x="574" y="235" font-size="11" fill="#5b6b7c" text-anchor="middle">R4C1</text>

  <rect x="608" y="100" width="60" height="148" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <line x1="608" y1="138" x2="668" y2="138" stroke="#2f6fd0" stroke-width="1" opacity="0.5"/>
  <line x1="608" y1="176" x2="668" y2="176" stroke="#2f6fd0" stroke-width="1" opacity="0.5"/>
  <line x1="608" y1="214" x2="668" y2="214" stroke="#2f6fd0" stroke-width="1" opacity="0.5"/>
  <text x="638" y="121" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R1C2</text>
  <text x="638" y="159" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R2C2</text>
  <text x="638" y="197" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R3C2</text>
  <text x="638" y="235" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R4C2</text>

  <rect x="672" y="100" width="60" height="148" rx="4" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="672" y1="138" x2="732" y2="138" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="672" y1="176" x2="732" y2="176" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="672" y1="214" x2="732" y2="214" stroke="#c8d3e0" stroke-width="1"/>
  <text x="702" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">R1C3</text>
  <text x="702" y="159" font-size="11" fill="#5b6b7c" text-anchor="middle">R2C3</text>
  <text x="702" y="197" font-size="11" fill="#5b6b7c" text-anchor="middle">R3C3</text>
  <text x="702" y="235" font-size="11" fill="#5b6b7c" text-anchor="middle">R4C3</text>

  <rect x="736" y="100" width="60" height="148" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <line x1="736" y1="138" x2="796" y2="138" stroke="#2f6fd0" stroke-width="1" opacity="0.5"/>
  <line x1="736" y1="176" x2="796" y2="176" stroke="#2f6fd0" stroke-width="1" opacity="0.5"/>
  <line x1="736" y1="214" x2="796" y2="214" stroke="#2f6fd0" stroke-width="1" opacity="0.5"/>
  <text x="766" y="121" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R1C4</text>
  <text x="766" y="159" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R2C4</text>
  <text x="766" y="197" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R3C4</text>
  <text x="766" y="235" font-size="11" font-weight="600" fill="#2f6fd0" text-anchor="middle">R4C4</text>

  <text x="670" y="286" font-size="12" fill="#5b6b7c" text-anchor="middle">列存只读取 C2、C4 两列</text>
  <text x="670" y="312" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">实际读入：4 行 × 2 列 = 8 格，I/O 减半</text>
</svg>
