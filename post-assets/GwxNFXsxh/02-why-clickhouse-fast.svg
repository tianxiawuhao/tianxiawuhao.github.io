<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ClickHouse 查询快的三个关键设计</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">ClickHouse 查询快的三个关键设计</text>

  <rect x="40" y="55" width="240" height="190" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="92" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">① 列式读取</text>
  <text x="160" y="132" font-size="12" fill="#1f2b38" text-anchor="middle">只读参与计算的列</text>
  <text x="160" y="162" font-size="12" fill="#1f2b38" text-anchor="middle">100 列只取 5 列</text>
  <text x="160" y="192" font-size="12" fill="#5b6b7c" text-anchor="middle">I/O 至少降至 1/20</text>

  <rect x="330" y="55" width="240" height="190" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="92" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">② 高压缩比</text>
  <text x="450" y="132" font-size="12" fill="#1f2b38" text-anchor="middle">同列同类型，易压缩</text>
  <text x="450" y="162" font-size="12" fill="#1f2b38" text-anchor="middle">压缩比可达 10 倍以上</text>
  <text x="450" y="192" font-size="12" fill="#5b6b7c" text-anchor="middle">数据更小，缓存命中更高</text>

  <rect x="620" y="55" width="240" height="190" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="92" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="middle">③ 向量化执行</text>
  <text x="740" y="132" font-size="12" fill="#1f2b38" text-anchor="middle">SIMD 指令批量处理</text>
  <text x="740" y="162" font-size="12" fill="#1f2b38" text-anchor="middle">运行时代码生成</text>
  <text x="740" y="192" font-size="12" fill="#5b6b7c" text-anchor="middle">CPU 缓存命中率更高</text>

  <text x="450" y="276" font-size="12" fill="#5b6b7c" text-anchor="middle">三者叠加，使分析查询比传统行存系统快 2–3 个数量级</text>
</svg>
