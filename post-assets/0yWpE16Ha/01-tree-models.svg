<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">树形结构的四种存储模型对比（同一棵树）</text>

  <!-- 原始树 -->
  <text x="30" y="58" font-size="13" font-weight="700" fill="#1f2b38">目标树：A → B → D，A → C</text>
  <rect x="30" y="70" width="70" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="65" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">A (1)</text>
  <line x1="100" y1="87" x2="128" y2="87" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="132" y="70" width="70" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="167" y="92" text-anchor="middle" font-size="13" fill="#1f2b38">B (2)</text>
  <line x1="202" y1="87" x2="230" y2="87" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="234" y="70" width="70" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="269" y="92" text-anchor="middle" font-size="13" fill="#1f2b38">D (4)</text>
  <line x1="65" y1="104" x2="65" y2="126" stroke="#5b6b7c" stroke-width="1.5"/>
  <line x1="65" y1="126" x2="167" y2="126" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="336" y="92" font-size="12" fill="#5b6b7c">另有 C (3) 为 A 的第二个子节点，四个模型均据此建表</text>

  <!-- 1 邻接表 -->
  <rect x="30" y="146" width="840" height="112" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="48" y="170" font-size="14" font-weight="700" fill="#1f2b38">1. 邻接表（Adjacency List）：只存 parent_id</text>
  <text x="48" y="192" font-size="12" fill="#5b6b7c">id</text>
  <text x="110" y="192" font-size="12" fill="#5b6b7c">parent_id</text>
  <text x="230" y="192" font-size="12" fill="#5b6b7c">name</text>
  <text x="320" y="192" font-size="12" fill="#5b6b7c">根节点：id=1 的 parent_id 为 NULL</text>
  <text x="48" y="212" font-size="12" fill="#5b6b7c">1</text>
  <text x="110" y="212" font-size="12" fill="#5b6b7c">NULL</text>
  <text x="230" y="212" font-size="12" fill="#5b6b7c">A</text>
  <text x="320" y="212" font-size="12" fill="#5b6b7c">写入/移动最便宜：改一行 parent_id 即可</text>
  <text x="48" y="232" font-size="12" fill="#5b6b7c">2</text>
  <text x="110" y="232" font-size="12" fill="#5b6b7c">1</text>
  <text x="230" y="232" font-size="12" fill="#5b6b7c">B</text>
  <text x="320" y="232" font-size="12" fill="#5b6b7c">查整棵子树需 WITH RECURSIVE，逐层展开</text>
  <text x="48" y="250" font-size="12" fill="#5b6b7c">3</text>
  <text x="110" y="250" font-size="12" fill="#5b6b7c">1</text>
  <text x="230" y="250" font-size="12" fill="#5b6b7c">C</text>
  <text x="320" y="250" font-size="12" fill="#5b6b7c">全表只有一张表、一个外键，一致性最好</text>

  <!-- 2 路径枚举 -->
  <rect x="30" y="270" width="840" height="112" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="48" y="294" font-size="14" font-weight="700" fill="#1f2b38">2. 路径枚举（Path Enumeration）：存物化路径</text>
  <text x="48" y="316" font-size="12" fill="#5b6b7c">id</text>
  <text x="110" y="316" font-size="12" fill="#5b6b7c">path</text>
  <text x="230" y="316" font-size="12" fill="#5b6b7c">节点</text>
  <text x="320" y="316" font-size="12" fill="#5b6b7c">子树查询：WHERE path LIKE '/1/%'，一次索引范围扫描</text>
  <text x="48" y="336" font-size="12" fill="#5b6b7c">1</text>
  <text x="110" y="336" font-size="12" fill="#5b6b7c">/1/</text>
  <text x="230" y="336" font-size="12" fill="#5b6b7c">A</text>
  <text x="320" y="336" font-size="12" fill="#5b6b7c">祖先查询：按 path 前缀直接得出，无需递归</text>
  <text x="48" y="356" font-size="12" fill="#5b6b7c">2</text>
  <text x="110" y="356" font-size="12" fill="#5b6b7c">/1/2/</text>
  <text x="230" y="356" font-size="12" fill="#5b6b7c">B / D</text>
  <text x="320" y="356" font-size="12" fill="#5b6b7c">移动子树要批量改 path；注意 /1 与 /10 前缀歧义</text>

  <!-- 3 嵌套集 -->
  <rect x="30" y="394" width="840" height="112" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="48" y="418" font-size="14" font-weight="700" fill="#1f2b38">3. 嵌套集（Nested Set）：左右值 lft / rgt</text>
  <text x="48" y="440" font-size="12" fill="#5b6b7c">A: lft=1 rgt=8</text>
  <text x="230" y="440" font-size="12" fill="#5b6b7c"></text>
  <text x="320" y="440" font-size="12" fill="#5b6b7c">子树查询：WHERE lft BETWEEN 1 AND 8，无递归、极快</text>
  <text x="48" y="460" font-size="12" fill="#5b6b7c">B: lft=2 rgt=5</text>
  <text x="320" y="460" font-size="12" fill="#5b6b7c">代价：插入/移动要重算受影响节点的 lft/rgt（写锁范围大）</text>
  <text x="48" y="480" font-size="12" fill="#5b6b7c">D: lft=3 rgt=4</text>
  <text x="320" y="480" font-size="12" fill="#5b6b7c">适合“读多写极少”的分类目录；并发写入高时不宜选用</text>

  <!-- 4 闭包表 -->
  <rect x="30" y="518" width="840" height="108" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.5"/>
  <text x="48" y="542" font-size="14" font-weight="700" fill="#1f2b38">4. 闭包表（Closure Table）：单独一张祖先-后代关系表</text>
  <text x="48" y="564" font-size="12" fill="#5b6b7c">ancestor</text>
  <text x="130" y="564" font-size="12" fill="#5b6b7c">descendant</text>
  <text x="230" y="564" font-size="12" fill="#5b6b7c">depth</text>
  <text x="320" y="564" font-size="12" fill="#5b6b7c">存下每一对可达关系（含自身，depth=0）</text>
  <text x="48" y="584" font-size="12" fill="#5b6b7c">1</text>
  <text x="130" y="584" font-size="12" fill="#5b6b7c">1</text>
  <text x="230" y="584" font-size="12" fill="#5b6b7c">0</text>
  <text x="320" y="584" font-size="12" fill="#5b6b7c">子树：JOIN 后 WHERE ancestor=1；祖先：WHERE descendant=4</text>
  <text x="48" y="604" font-size="12" fill="#5b6b7c">1</text>
  <text x="130" y="604" font-size="12" fill="#5b6b7c">2</text>
  <text x="230" y="604" font-size="12" fill="#5b6b7c">1</text>
  <text x="320" y="604" font-size="12" fill="#5b6b7c">任意深度查询都无递归，且可精确控层级（depth &lt;= 2）</text>
  <text x="48" y="622" font-size="11" fill="#7a5bd0">代价：行数为 O(n·深度)，写入与移动需增删成组关系行，须事务保证一致</text>
</svg>
