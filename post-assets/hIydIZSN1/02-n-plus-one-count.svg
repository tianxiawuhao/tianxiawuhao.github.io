<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">N+1 查询次数示意：3 个模型配置下的 SQL 往返对比</text>

  <rect x="20" y="50" width="420" height="370" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <rect x="460" y="50" width="420" height="370" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="230" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">逐行触发的子查询（路径 B）</text>
  <text x="670" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">一条 join 取回（路径 A）</text>

  <rect x="60" y="100" width="330" height="90" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="70" y="122" font-size="12.5" font-weight="700" fill="#1f2b38">主查询 selectInstanceList</text>
  <text x="70" y="146" font-size="11.5" fill="#5b6b7c">返回 3 行模型数据，SQL 计数 +1</text>
  <rect x="70" y="156" width="60" height="20" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="100" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f6fd0">1 次</text>

  <rect x="60" y="200" width="330" height="90" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="70" y="222" font-size="12.5" font-weight="700" fill="#e08a1e">第 1 行：getEquipmentPicture</text>
  <text x="70" y="246" font-size="11.5" fill="#5b6b7c">+ getEquipmentPictures 等子语句</text>
  <rect x="70" y="256" width="60" height="20" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="100" y="270" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e08a1e">+3 次</text>

  <rect x="60" y="300" width="330" height="100" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="70" y="322" font-size="12.5" font-weight="700" fill="#e08a1e">第 2 行 / 第 3 行同样触发</text>
  <text x="70" y="346" font-size="11.5" fill="#5b6b7c">每行都独立回库一次，次数随行数增长</text>
  <rect x="70" y="356" width="70" height="20" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="105" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e08a1e">+3 / +3</text>

  <rect x="500" y="100" width="330" height="100" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="510" y="124" font-size="12.5" font-weight="700" fill="#2f6fd0">selectInstanceList 一次 join</text>
  <text x="510" y="148" font-size="11.5" fill="#5b6b7c">DISTINCT 去重后返回宽结果集</text>
  <text x="510" y="170" font-size="11.5" fill="#5b6b7c">MyBatis 按 id 折叠嵌套对象</text>
  <rect x="510" y="180" width="60" height="20" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="540" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f6fd0">1 次</text>

  <rect x="500" y="240" width="330" height="160" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="665" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">路径 A：3 行也是 1 次 SQL</text>
  <text x="665" y="298" text-anchor="middle" font-size="12" fill="#1f2b38">SQL 数 = 1，与行数无关</text>
  <text x="665" y="326" text-anchor="middle" font-size="12" fill="#1f2b38">代价：结果集变宽，DISTINCT 开销上升</text>
  <text x="665" y="354" text-anchor="middle" font-size="12" fill="#5b6b7c">适合模型数少、每行关联数据量可控</text>
  <text x="665" y="382" text-anchor="middle" font-size="12" fill="#5b6b7c">一次查询后立即映射为嵌套对象</text>

  <rect x="20" y="440" width="860" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="40" y="466" font-size="12.5" font-weight="700" fill="#1f2b38">规模放大后的差距：100 个模型 × 每行 3 条子语句 = 1 + 300 次数据库往返</text>
  <text x="40" y="488" font-size="11.5" fill="#5b6b7c">每次往返都占用连接与网络 RTT，还可能在会话缓存中堆积大量嵌套对象，是级联查询最主要的性能风险</text>
</svg>
