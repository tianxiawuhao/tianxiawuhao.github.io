<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="490" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">嵌套结果（join 一次查询）与嵌套查询（select 子查询）执行路径对比</text>
  <rect x="20" y="50" width="420" height="400" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
  <rect x="460" y="50" width="420" height="400" rx="8" fill="#fff6e8" stroke="#c8d3e0"/>
  <text x="230" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">路径 A：嵌套结果 resultMap</text>
  <text x="230" y="96" text-anchor="middle" font-size="11.5" fill="#5b6b7c">association / collection 内直接写映射列</text>
  <text x="670" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">路径 B：嵌套查询 select 子语句</text>
  <text x="670" y="96" text-anchor="middle" font-size="11.5" fill="#5b6b7c">association / collection 内写 select 引用子语句</text>

  <rect x="60" y="120" width="340" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="80" y="146" font-size="12.5" font-weight="700" fill="#1f2b38">Mapper 方法调用一次</text>
  <text x="80" y="168" font-size="11.5" fill="#5b6b7c">selectInstanceList(vo) → 只发 1 条 SQL</text>

  <path d="M230,182 L230,208" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="60" y="210" width="340" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="80" y="236" font-size="12.5" font-weight="700" fill="#1f2b38">一条 join SQL 返回宽结果集</text>
  <text x="80" y="258" font-size="11.5" fill="#5b6b7c">4 表 LEFT JOIN + DISTINCT，DB 一次取回</text>

  <path d="M230,272 L230,298" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="60" y="300" width="340" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="80" y="326" font-size="12.5" font-weight="700" fill="#1f2b38">MyBatis 按 id 聚合并去重</text>
  <text x="80" y="348" font-size="11.5" fill="#5b6b7c">同一主键的重复行折叠成嵌套对象</text>

  <path d="M230,362 L230,388" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="60" y="390" width="340" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="230" y="416" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">总 SQL 数：1（与返回行数无关）</text>

  <rect x="500" y="120" width="340" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="520" y="144" font-size="12.5" font-weight="700" fill="#1f2b38">Mapper 方法调用一次</text>
  <text x="520" y="166" font-size="11.5" fill="#5b6b7c">selectInstanceList(vo) → 主查询 1 条 SQL</text>

  <path d="M670,178 L670,200" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="500" y="202" width="340" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="520" y="226" font-size="12.5" font-weight="700" fill="#1f2b38">resultMap 触发子语句</text>
  <text x="520" y="248" font-size="11.5" fill="#5b6b7c">association / collection 走 select 引用</text>

  <path d="M670,260 L670,282" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="500" y="284" width="340" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="520" y="308" font-size="12.5" font-weight="700" fill="#1f2b38">返回 M 行，每行触发一次子查询</text>
  <text x="520" y="330" font-size="11.5" fill="#5b6b7c">column 逐个传入 equipment_model_mark 等</text>

  <path d="M670,342 L670,364" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="500" y="366" width="340" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="670" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">总 SQL 数：1 + N（典型 N+1）</text>

  <text x="670" y="432" text-anchor="middle" font-size="11.5" fill="#5b6b7c">可配 fetchType="lazy" 把子查询推迟到访问时</text>
</svg>
