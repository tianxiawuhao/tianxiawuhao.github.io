<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
<defs>
<marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
</marker>
</defs>
<rect width="900" height="660" fill="#ffffff"/>
<g font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Go 指针：内存布局与接收者方法集</text>
<text x="450" y="52" text-anchor="middle" font-size="11" fill="#5b6b7c">变量与地址、结构体字段布局，以及值接收者 / 指针接收者的调用规则与接口实现</text>

<rect x="30" y="70" width="400" height="230" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="50" y="95" font-size="14" font-weight="700" fill="#1f2b38">① 变量、地址与指针</text>
<rect x="50" y="110" width="360" height="120" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="62" y="128" font-size="11" fill="#5b6b7c">main 的栈帧（栈内存）</text>
<rect x="66" y="142" width="150" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="141" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">x  int = 42</text>
<text x="141" y="187" text-anchor="middle" font-size="11" fill="#5b6b7c">值：42</text>
<text x="141" y="205" text-anchor="middle" font-size="11" fill="#5b6b7c">地址 0x1040</text>
<rect x="250" y="142" width="150" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="325" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">p  *int</text>
<text x="325" y="187" text-anchor="middle" font-size="11" fill="#5b6b7c">值：0x1040</text>
<text x="325" y="205" text-anchor="middle" font-size="11" fill="#5b6b7c">地址 0x1048</text>
<path d="M 246 178 L 220 178" stroke="#2f6fd0" fill="none" marker-end="url(#arw2)"/>
<text x="50" y="252" font-size="11" fill="#5b6b7c">p 是独立变量：自身有地址（0x1048），值就是 x 的地址；*p 解引用得到 42。</text>
<text x="50" y="274" font-size="11" fill="#5b6b7c">&amp;x 取地址，* 取值，两者互为逆操作。</text>

<rect x="470" y="70" width="400" height="230" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="490" y="95" font-size="14" font-weight="700" fill="#1f2b38">② 结构体字段的内存布局</text>
<rect x="490" y="110" width="360" height="120" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="502" y="128" font-size="11" fill="#5b6b7c">type Circle struct</text>
<rect x="502" y="140" width="96" height="18" rx="4" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="550" y="154" text-anchor="middle" font-size="11" fill="#1f2b38">Radius</text>
<text x="612" y="154" font-size="11" fill="#5b6b7c">float64（8 字节）</text>
<rect x="502" y="166" width="192" height="18" rx="4" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="598" y="180" text-anchor="middle" font-size="11" fill="#1f2b38">Name（string 头）</text>
<text x="708" y="180" font-size="11" fill="#5b6b7c">16 字节</text>
<rect x="502" y="192" width="96" height="18" rx="4" fill="#fff6e8" stroke="#e08a1e"/>
<text x="550" y="206" text-anchor="middle" font-size="11" fill="#1f2b38">Next</text>
<text x="612" y="206" font-size="11" fill="#5b6b7c">*Circle（8 字节）</text>
<text x="490" y="252" font-size="11" fill="#5b6b7c">字段按声明顺序与对齐要求排布，指针字段只存地址。</text>
<text x="490" y="274" font-size="11" fill="#5b6b7c">&amp;s 是结构体首地址，&amp;s.Radius 是字段地址，两者不同。</text>

<rect x="30" y="330" width="840" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="50" y="356" font-size="14" font-weight="700" fill="#1f2b38">③ 方法集：值接收者与指针接收者</text>
<text x="50" y="390" font-size="12" font-weight="700" fill="#1f2b38">方法定义</text>
<text x="380" y="390" font-size="12" font-weight="700" fill="#1f2b38">值 T 调用</text>
<text x="520" y="390" font-size="12" font-weight="700" fill="#1f2b38">指针 *T 调用</text>
<text x="680" y="390" font-size="12" font-weight="700" fill="#1f2b38">接口实现</text>
<path d="M 50 398 L 850 398" stroke="#c8d3e0" fill="none"/>
<text x="50" y="428" font-size="11" fill="#1f2b38">func (c Circle) Area() float64</text>
<text x="380" y="428" font-size="11" fill="#2e9e5b">可以</text>
<text x="520" y="428" font-size="11" fill="#2e9e5b">可以</text>
<text x="680" y="428" font-size="11" fill="#1f2b38">T 与 *T 都满足</text>
<path d="M 50 444 L 850 444" stroke="#c8d3e0" fill="none"/>
<text x="50" y="474" font-size="11" fill="#1f2b38">func (c *Circle) Scale(k float64)</text>
<text x="380" y="474" font-size="11" fill="#e08a1e">需可取地址</text>
<text x="520" y="474" font-size="11" fill="#2e9e5b">可以</text>
<text x="680" y="474" font-size="11" fill="#e08a1e">只有 *T 满足</text>
<path d="M 50 490 L 850 490" stroke="#c8d3e0" fill="none"/>
<text x="50" y="520" font-size="11" fill="#5b6b7c">① 值接收者方法：T 与 *T 都能调用；指针接收者方法的调用要求该值可取地址（编译器自动插入 &amp;）。</text>
<text x="50" y="546" font-size="11" fill="#5b6b7c">② 接口方法集：T 只含值接收者方法，*T 含两者；含指针接收者方法时 var s Shaper = Circle{} 会编译报错。</text>
<text x="50" y="572" font-size="11" fill="#5b6b7c">③ map 元素、接口中取出的值不可寻址，不能直接调用指针接收者方法，需先取到局部变量再写回。</text>
<text x="50" y="598" font-size="11" fill="#5b6b7c">④ 实践：同一类型的方法尽量统一用一种接收者；小而不变的值类型适合值接收者。</text>
</g>
</svg>
