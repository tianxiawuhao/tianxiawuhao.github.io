<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Zookeeper 的数据模型、节点类型与 Watch 机制</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Zookeeper 数据模型：像文件系统，但每个节点都能挂数据</text>

  <rect x="360" y="52" width="180" height="36" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="75" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">/（根）</text>

  <line x1="420" y1="88" x2="220" y2="112" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="450" y1="88" x2="450" y2="112" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="480" y1="88" x2="690" y2="112" stroke="#c8d3e0" stroke-width="1.4"/>

  <rect x="120" y="116" width="190" height="36" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="215" y="139" font-size="12" fill="#1f2b38" text-anchor="middle">/app1（持久节点）</text>
  <rect x="360" y="116" width="190" height="36" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="455" y="139" font-size="12" fill="#1f2b38" text-anchor="middle">/config（持久节点）</text>
  <rect x="600" y="116" width="190" height="36" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="695" y="139" font-size="12" fill="#1f2b38" text-anchor="middle">/locks（持久节点）</text>

  <line x1="180" y1="152" x2="140" y2="176" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="250" y1="152" x2="290" y2="176" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="60" y="180" width="180" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="150" y="203" font-size="11.5" fill="#1f2b38" text-anchor="middle">/app1/node-0001 临时顺序</text>
  <rect x="250" y="180" width="180" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="203" font-size="11.5" fill="#1f2b38" text-anchor="middle">/app1 下的数据（byte[]）</text>
  <rect x="620" y="180" width="180" height="36" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="710" y="203" font-size="11.5" fill="#1f2b38" text-anchor="middle">/locks/lock-0000000001</text>

  <rect x="40" y="240" width="400" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="264" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">四种节点类型（znode）</text>
  <text x="60" y="288" font-size="11.5" fill="#5b6b7c" text-anchor="start">持久节点 PERSISTENT：会话结束仍存在，放配置与目录结构</text>
  <text x="60" y="308" font-size="11.5" fill="#5b6b7c" text-anchor="start">临时节点 EPHEMERAL：会话断开即自动删除，用于服务注册</text>
  <text x="60" y="328" font-size="11.5" fill="#5b6b7c" text-anchor="start">持久顺序 PERSISTENT_SEQUENTIAL：名字后补 10 位自增序号</text>
  <text x="60" y="348" font-size="11.5" fill="#5b6b7c" text-anchor="start">临时顺序 EPHEMERAL_SEQUENTIAL：分布式锁的标准做法</text>

  <rect x="460" y="240" width="400" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="480" y="264" font-size="12.5" fill="#e08a1e" text-anchor="start" font-weight="700">Watch：一次性的轻量通知</text>
  <text x="480" y="288" font-size="11.5" fill="#1f2b38" text-anchor="start">客户端可以在「读」时顺手注册监听：getData / getChildren / exists</text>
  <text x="480" y="308" font-size="11.5" fill="#1f2b38" text-anchor="start">节点发生变化时，服务端向客户端推送一次事件</text>
  <text x="480" y="328" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">关键特性：一次性 —— 触发后自动失效，要持续监听必须重新注册</text>
  <text x="480" y="348" font-size="11.5" fill="#5b6b7c" text-anchor="start">事件只告诉「什么变了」，不告诉「变之前是什么」，需自己重新读取</text>

  <rect x="40" y="376" width="820" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="398" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">为什么 ZK 不适合当注册中心（CAP 视角）</text>
  <text x="60" y="420" font-size="11.5" fill="#5b6b7c" text-anchor="start">ZK 是 CP 设计：网络分区时少数派节点会不可用，它选择「不返回」而不是「返回可能过期的数据」。</text>
  <text x="60" y="438" font-size="11.5" fill="#5b6b7c" text-anchor="start">而注册中心需要 AP：宁可拿到几秒前的服务列表，也不能因为查不到而整体不可用（Nacos/Eureka 更合适）。</text>
</svg>
