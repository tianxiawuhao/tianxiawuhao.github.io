<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Zookeeper 的典型应用场景与中间件替代方案</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Zookeeper 能做什么，以及今天该用什么替代</text>

  <text x="45" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">应用场景</text>
  <text x="255" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">用到的 ZK 能力</text>
  <text x="565" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">今天的常见替代</text>
  <rect x="40" y="70" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="82" width="820" height="42" fill="#eef4ff"/>
  <text x="45" y="108" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">配置中心（动态刷新）</text>
  <text x="255" y="108" font-size="11.5" fill="#5b6b7c" text-anchor="start">持久节点存配置 + Watch 通知变更</text>
  <text x="565" y="108" font-size="11.5" fill="#5b6b7c" text-anchor="start">Nacos / Apollo / Spring Cloud Config</text>

  <rect x="40" y="124" width="820" height="42" fill="#ffffff"/>
  <text x="45" y="150" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">分布式锁</text>
  <text x="255" y="150" font-size="11.5" fill="#5b6b7c" text-anchor="start">临时顺序节点 + Watch 前一个节点</text>
  <text x="565" y="150" font-size="11.5" fill="#5b6b7c" text-anchor="start">Redis（Redisson）/ 数据库唯一约束</text>

  <rect x="40" y="166" width="820" height="42" fill="#eef4ff"/>
  <text x="45" y="192" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">服务注册与发现</text>
  <text x="255" y="192" font-size="11.5" fill="#5b6b7c" text-anchor="start">临时节点（会话断开自动摘除）</text>
  <text x="565" y="192" font-size="11.5" fill="#5b6b7c" text-anchor="start">Nacos / Eureka / Consul（AP 更适合）</text>

  <rect x="40" y="208" width="820" height="42" fill="#ffffff"/>
  <text x="45" y="234" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">集群选主 / Master 选举</text>
  <text x="255" y="234" font-size="11.5" fill="#5b6b7c" text-anchor="start">临时顺序节点，最小者为主</text>
  <text x="565" y="234" font-size="11.5" fill="#5b6b7c" text-anchor="start">K8s Lease / etcd / 各中间件内置选主</text>

  <rect x="40" y="250" width="820" height="42" fill="#eef4ff"/>
  <text x="45" y="276" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">命名服务 / 元数据管理</text>
  <text x="255" y="276" font-size="11.5" fill="#5b6b7c" text-anchor="start">层次化目录 + 顺序节点</text>
  <text x="565" y="276" font-size="11.5" fill="#5b6b7c" text-anchor="start">etcd / Nacos；分布式 ID 用雪花算法</text>

  <rect x="40" y="292" width="820" height="42" fill="#ffffff"/>
  <text x="45" y="318" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">集群成员管理 / 上下线感知</text>
  <text x="255" y="318" font-size="11.5" fill="#5b6b7c" text-anchor="start">临时节点 + getChildren Watch</text>
  <text x="565" y="318" font-size="11.5" fill="#5b6b7c" text-anchor="start">K8s Service / Nacos 健康检查</text>
  <rect x="40" y="334" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="350" width="400" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="372" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">仍然必须用 ZK 的地方</text>
  <text x="60" y="394" font-size="11.5" fill="#5b6b7c" text-anchor="start">Kafka 旧版本（2.8 前依赖 ZK 存元数据）、HBase、Hadoop HA、</text>
  <text x="60" y="414" font-size="11.5" fill="#5b6b7c" text-anchor="start">Dubbo 的 ZK 注册中心模式、SolrCloud —— 生态绑定，不是选型选择。</text>

  <rect x="460" y="350" width="400" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="480" y="372" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">面试常见的追问</text>
  <text x="480" y="394" font-size="11.5" fill="#5b6b7c" text-anchor="start">ZK 与 Nacos 的区别：CP vs AP、是否有配置中心能力、</text>
  <text x="480" y="414" font-size="11.5" fill="#5b6b7c" text-anchor="start">是否依赖长连接推送。结合 CAP 与业务场景回答即可。</text>
</svg>
