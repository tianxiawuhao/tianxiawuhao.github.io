<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Type Switch 按接口值的动态类型分支匹配</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Type Switch：按接口值的动态类型分支</text>

  <rect x="330" y="55" width="240" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="83" text-anchor="middle" font-size="13" fill="#1f2b38">switch x := i.(type)</text>

  <line x1="450" y1="99" x2="450" y2="118" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="135" y1="118" x2="765" y2="118" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="135" y1="118" x2="135" y2="152" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="345" y1="118" x2="345" y2="152" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="555" y1="118" x2="555" y2="152" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="765" y1="118" x2="765" y2="152" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="154" width="190" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="135" y="182" text-anchor="middle" font-size="13" fill="#1f2b38">case int</text>
  <rect x="250" y="154" width="190" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="345" y="182" text-anchor="middle" font-size="13" fill="#1f2b38">case string</text>
  <rect x="460" y="154" width="190" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="555" y="182" text-anchor="middle" font-size="13" fill="#1f2b38">case nil</text>
  <rect x="670" y="154" width="190" height="46" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="765" y="182" text-anchor="middle" font-size="13" fill="#1f2b38">default</text>

  <line x1="135" y1="200" x2="135" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="345" y1="200" x2="345" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="555" y1="200" x2="555" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="765" y1="200" x2="765" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="230" width="190" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="135" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">x 的动态类型为 int</text>
  <text x="135" y="288" text-anchor="middle" font-size="11" fill="#2e9e5b">输出 10 is int</text>
  <rect x="250" y="230" width="190" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="345" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">x 的动态类型为 string</text>
  <text x="345" y="288" text-anchor="middle" font-size="11" fill="#2e9e5b">输出 hello is string</text>
  <rect x="460" y="230" width="190" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="555" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">i 本身是 nil 接口值</text>
  <text x="555" y="288" text-anchor="middle" font-size="11" fill="#2e9e5b">输出 nil is nil</text>
  <rect x="670" y="230" width="190" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">以上类型都不匹配</text>
  <text x="765" y="288" text-anchor="middle" font-size="11" fill="#e08a1e">输出 not matched</text>

  <rect x="40" y="330" width="820" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="360" font-size="12" fill="#1f2b38">注意：type switch 只匹配一次动态类型，命中即结束，比连续写多个类型断言更清晰；nil 接口值只会命中 case nil。</text>
</svg>
