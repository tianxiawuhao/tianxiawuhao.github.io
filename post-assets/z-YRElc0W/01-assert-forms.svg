<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>类型断言 x.(T) 的单返回值与双返回值两种写法对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">类型断言 x.(T)：检查接口值是否持有类型 T</text>

  <rect x="300" y="55" width="300" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="84" text-anchor="middle" font-size="13" fill="#1f2b38">接口值 x（静态类型 interface{}）</text>

  <line x1="450" y1="101" x2="450" y2="133" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="135" width="240" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="163" text-anchor="middle" font-size="13" fill="#1f2b38">执行 x.(T)，比较动态类型</text>

  <line x1="450" y1="179" x2="450" y2="200" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="250" y1="200" x2="650" y2="200" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="250" y1="200" x2="250" y2="223" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="650" y1="200" x2="650" y2="223" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="70" y="225" width="360" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="250" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">第一种：t := x.(T)　单返回值</text>

  <rect x="470" y="225" width="360" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="650" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">第二种：t, ok := x.(T)　双返回值</text>

  <line x1="250" y1="269" x2="250" y2="293" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="650" y1="269" x2="650" y2="293" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="70" y="295" width="360" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="90" y="322" font-size="13" fill="#2e9e5b">成功：t = x 的值，可直接使用</text>
  <text x="90" y="352" font-size="13" fill="#e08a1e">失败：panic，x 为 nil 时同样 panic</text>

  <rect x="470" y="295" width="360" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="322" font-size="13" fill="#2e9e5b">成功：ok = true，t = x 的值</text>
  <text x="490" y="352" font-size="13" fill="#e08a1e">失败：ok = false，t 为零值（不 panic）</text>
</svg>
