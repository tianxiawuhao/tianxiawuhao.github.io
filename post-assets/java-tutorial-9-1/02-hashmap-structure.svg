<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>HashMap 结构：数组、链表与红黑树</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">HashMap 结构：数组 + 链表 + 红黑树</text>
  <rect x="30" y="52" width="400" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="83" font-size="12" fill="#1f2b38" text-anchor="middle">定位：hashCode → 扰动 h ^ (h &gt;&gt;&gt; 16) → (n-1) &amp; hash</text>
  <line x1="100" y1="104" x2="100" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="30" y="124" width="140" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="147" font-size="11" fill="#1f2b38" text-anchor="middle">table[0]</text>
  <rect x="30" y="164" width="140" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="187" font-size="11" fill="#1f2b38" text-anchor="middle">table[1]</text>
  <rect x="30" y="204" width="140" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="227" font-size="11" fill="#1f2b38" text-anchor="middle">table[2]</text>
  <rect x="30" y="244" width="140" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="267" font-size="11" fill="#1f2b38" text-anchor="middle">table[3]</text>
  <rect x="30" y="284" width="140" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="307" font-size="11" fill="#1f2b38" text-anchor="middle">table[4]</text>
  <line x1="170" y1="222" x2="196" y2="222" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="200" y="204" width="104" height="36" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="252" y="227" font-size="11" fill="#1f2b38" text-anchor="middle">Node K1</text>
  <line x1="304" y1="222" x2="326" y2="222" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="204" width="104" height="36" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="382" y="227" font-size="11" fill="#1f2b38" text-anchor="middle">Node K2</text>
  <line x1="434" y1="222" x2="456" y2="222" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="460" y="204" width="104" height="36" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="512" y="227" font-size="11" fill="#1f2b38" text-anchor="middle">Node K3</text>
  <line x1="170" y1="302" x2="196" y2="302" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="200" y="278" width="364" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="382" y="300" font-size="12" fill="#1f2b38" text-anchor="middle">链表长度 ≥ 8 且容量 ≥ 64 → 转红黑树</text>
  <text x="382" y="319" font-size="11" fill="#5b6b7c" text-anchor="middle">最坏查找从 O(n) 降到 O(log n)</text>
  <rect x="600" y="124" width="270" height="202" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="152" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">容量与扩容</text>
  <text x="735" y="180" font-size="11" fill="#5b6b7c" text-anchor="middle">负载因子 0.75（默认）</text>
  <text x="735" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">size &gt; 容量 × 0.75 触发扩容</text>
  <text x="735" y="228" font-size="11" fill="#5b6b7c" text-anchor="middle">每次扩容容量翻倍</text>
  <text x="735" y="252" font-size="11" fill="#5b6b7c" text-anchor="middle">容量取 2 的幂：取模变位运算</text>
  <text x="735" y="276" font-size="11" fill="#5b6b7c" text-anchor="middle">允许 1 个 null 键、多个 null 值</text>
  <text x="735" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">线程不安全 → ConcurrentHashMap</text>
  <text x="450" y="372" font-size="11" fill="#5b6b7c" text-anchor="middle">阈值 = 容量 × 负载因子；需要迭代顺序用 LinkedHashMap，需要排序用 TreeMap</text>
</svg>
