<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>equals 与 hashCode 契约及两种后果</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">equals 与 hashCode 契约：两种做法的后果</text>
  <rect x="30" y="55" width="840" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="85" font-size="13" fill="#1f2b38" text-anchor="middle">契约：equals 返回 true ⇒ hashCode 必须相等</text>
  <text x="450" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">反之 hashCode 相等不要求 equals 为 true（这就是哈希冲突，允许存在）</text>
  <line x1="227" y1="125" x2="227" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="672" y1="125" x2="672" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="30" y="150" width="395" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="227" y="180" font-size="12" fill="#1f2b38" text-anchor="middle">正确：重写 equals 时同时重写 hashCode</text>
  <text x="227" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">hashCode() = Objects.hash(name, age)</text>
  <rect x="475" y="150" width="395" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="672" y="180" font-size="12" fill="#1f2b38" text-anchor="middle">违规：只重写 equals，hashCode 用默认实现</text>
  <text x="672" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">两个“相等”对象拿到不同的哈希值</text>
  <line x1="227" y1="230" x2="227" y2="248" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="672" y1="230" x2="672" y2="248" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="30" y="252" width="395" height="90" rx="8" fill="#f7f9fc" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="227" y="284" font-size="12" fill="#1f2b38" text-anchor="middle">等价对象落进同一个桶</text>
  <text x="227" y="310" font-size="11" fill="#5b6b7c" text-anchor="middle">HashSet 正确去重；HashMap 的 get 命中同一个 entry</text>
  <rect x="475" y="252" width="395" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="672" y="280" font-size="12" fill="#1f2b38" text-anchor="middle">等价对象落进不同桶</text>
  <text x="672" y="303" font-size="11" fill="#5b6b7c" text-anchor="middle">HashSet 出现看着重复的元素；HashMap 的 get</text>
  <text x="672" y="324" font-size="11" fill="#5b6b7c" text-anchor="middle">找不到刚 put 进去的键（数据没丢，只是找不到）</text>
  <text x="450" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">以哈希为基础的容器都依赖这条契约：HashSet / HashMap / ConcurrentHashMap 的键</text>
</svg>
