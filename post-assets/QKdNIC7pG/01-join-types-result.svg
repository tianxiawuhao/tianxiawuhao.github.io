<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>关联查询结果对照：交叉连接、内连接、左外连接、右外连接</title>
<rect width="900" height="330" fill="#ffffff"/>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">关联查询结果对照：R(c1,c2,c3) 与 S(c1,c2,c4)</text>
<rect x="20" y="52" width="200" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="120" y="76" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">交叉连接</text>
<text x="120" y="94" font-size="11" fill="#5b6b7c" text-anchor="middle">CROSS JOIN</text>
<text x="120" y="120" font-size="12" fill="#1f2b38" text-anchor="middle">3 × 3 = 9 行</text>
<text x="120" y="146" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c1c1 c1c2 c1c4</text>
<text x="120" y="170" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c2c1 c2c2 c2c4</text>
<text x="120" y="194" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c3c1 c3c2 c3c4</text>
<text x="120" y="224" font-size="11.5" fill="#5b6b7c" text-anchor="middle">无关联条件，笛卡尔积</text>
<rect x="240" y="52" width="200" height="200" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="340" y="76" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">内连接</text>
<text x="340" y="94" font-size="11" fill="#5b6b7c" text-anchor="middle">INNER JOIN</text>
<text x="340" y="120" font-size="12" fill="#1f2b38" text-anchor="middle">只保留 c 相等的行</text>
<text x="340" y="146" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c1 = c1</text>
<text x="340" y="170" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c2 = c2</text>
<text x="340" y="194" font-size="11.5" fill="#5b6b7c" text-anchor="middle">c3 无匹配，丢弃</text>
<text x="340" y="224" font-size="11.5" fill="#2e9e5b" text-anchor="middle">共 2 行</text>
<rect x="460" y="52" width="200" height="200" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="560" y="76" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">左外连接</text>
<text x="560" y="94" font-size="11" fill="#5b6b7c" text-anchor="middle">LEFT JOIN</text>
<text x="560" y="120" font-size="12" fill="#1f2b38" text-anchor="middle">保留左表全部行</text>
<text x="560" y="146" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c1 = c1</text>
<text x="560" y="170" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c2 = c2</text>
<text x="560" y="194" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c3 = NULL</text>
<text x="560" y="224" font-size="11.5" fill="#2f6fd0" text-anchor="middle">共 3 行</text>
<rect x="680" y="52" width="200" height="200" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="780" y="76" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">右外连接</text>
<text x="780" y="94" font-size="11" fill="#5b6b7c" text-anchor="middle">RIGHT JOIN</text>
<text x="780" y="120" font-size="12" fill="#1f2b38" text-anchor="middle">保留右表全部行</text>
<text x="780" y="146" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c1 = c1</text>
<text x="780" y="170" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">c2 = c2</text>
<text x="780" y="194" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">NULL = c4</text>
<text x="780" y="224" font-size="11.5" fill="#e08a1e" text-anchor="middle">共 3 行</text>
<text x="20" y="278" font-size="11.5" fill="#5b6b7c">内连接 = 交叉连接 + 过滤（只留匹配行）；左/右外连接保留一侧的全部行，另一侧缺失处补 NULL。</text>
<text x="20" y="300" font-size="11.5" fill="#5b6b7c">MySQL 不支持 FULL JOIN，可用 LEFT JOIN … UNION … RIGHT JOIN 模拟；UNION 会去重，UNION ALL 更快。</text>
</svg>
