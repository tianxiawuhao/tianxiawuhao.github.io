<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
</marker>
</defs>
<rect width="900" height="660" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Flink Table API &amp; SQL：时间属性与窗口演进（1.13.1）</text>
<rect x="24" y="54" width="852" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="44" y="84" font-size="14" font-weight="700" fill="#1f2b38">① 时间属性的两种定义方式</text>
<rect x="44" y="96" width="400" height="112" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="62" y="120" font-size="13" font-weight="700" fill="#2f6fd0">建表 DDL 中定义</text>
<text x="62" y="144" font-size="12" fill="#1f2b38">事件时间：WATERMARK FOR ts</text>
<text x="62" y="164" font-size="12" fill="#1f2b38">　　AS ts - INTERVAL '5' SECOND</text>
<text x="62" y="188" font-size="12" fill="#1f2b38">处理时间：ts AS PROCTIME()</text>
<rect x="456" y="96" width="400" height="112" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="474" y="120" font-size="13" font-weight="700" fill="#2e9e5b">DataStream 转 Table 时定义</text>
<text x="474" y="144" font-size="12" fill="#1f2b38">事件时间：$("ts").rowtime()</text>
<text x="474" y="164" font-size="12" fill="#1f2b38">（需先用 WatermarkStrategy 生成水位线）</text>
<text x="474" y="188" font-size="12" fill="#1f2b38">处理时间：$("ts").proctime()</text>
<text x="44" y="234" font-size="12" fill="#5b6b7c">rowtime() / proctime() 取到的都是不带时区的时间值，需要本地时区语义时应使用 TIMESTAMP_LTZ。</text>
<rect x="24" y="274" width="852" height="352" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="44" y="304" font-size="14" font-weight="700" fill="#1f2b38">② 窗口语法：老版分组窗口 vs 1.13 窗口 TVF</text>
<rect x="44" y="318" width="812" height="108" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="64" y="344" font-size="13" font-weight="700" fill="#e08a1e">老版分组窗口（Group Window，1.13 起标记废弃）</text>
<text x="64" y="368" font-size="12" fill="#1f2b38">TUMBLE(ts, INTERVAL '10' SECOND)　/　HOP(ts, INTERVAL '5' SECOND, INTERVAL '10' SECOND)</text>
<text x="64" y="390" font-size="12" fill="#1f2b38">SESSION(ts, INTERVAL '10' MINUTE)　/　分组：GROUP BY user, TUMBLE(ts, ...)</text>
<text x="64" y="412" font-size="12" fill="#1f2b38">窗口信息：只能靠 TUMBLE_END() / HOP_END() 等辅助函数取出，再当作普通字段使用</text>
<line x1="450" y1="432" x2="450" y2="458" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ah)"/>
<rect x="44" y="464" width="812" height="108" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="64" y="490" font-size="13" font-weight="700" fill="#2e9e5b">窗口 TVF（Windowing TVF，1.13 起）</text>
<text x="64" y="514" font-size="12" fill="#1f2b38">FROM TABLE(TUMBLE(TABLE t, DESCRIPTOR(ts), INTERVAL '10' SECOND))　/　HOP　/　CUMULATE</text>
<text x="64" y="536" font-size="12" fill="#1f2b38">分组：GROUP BY user, window_start, window_end（固定写法，窗口边界就是普通字段）</text>
<text x="64" y="558" font-size="12" fill="#1f2b38">输出：window_start / window_end 可直接参与后续联结、Top-N 等计算</text>
<text x="44" y="606" font-size="12" fill="#5b6b7c">会话窗口（SESSION）暂无 TVF 形式；老语法在 1.13 被标记废弃，新代码请统一用 TVF。</text>
</svg>
