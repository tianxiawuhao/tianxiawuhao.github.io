<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>jQuery 链式调用中集合的流动与回退</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">jQuery 链式调用：集合如何流动</text>
  <text x="40" y="62" font-size="12" fill="#5b6b7c">链式步骤（自上而下执行）</text>
  <text x="400" y="62" font-size="12" fill="#5b6b7c">当前 jQuery 对象持有的集合</text>

  <rect x="40" y="72" width="330" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="98" font-size="12" fill="#1f2b38">$("#list li")</text>
  <rect x="400" y="72" width="470" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="416" y="98" font-size="12" fill="#5b6b7c">选中页面里全部 li，共 5 个</text>
  <line x1="205" y1="114" x2="205" y2="124" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="126" width="330" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="152" font-size="12" fill="#1f2b38">.filter(":contains('Java')")</text>
  <rect x="400" y="126" width="470" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="416" y="152" font-size="12" fill="#5b6b7c">只留下文本含 Java 的 2 个 li</text>
  <line x1="205" y1="168" x2="205" y2="178" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="180" width="330" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="206" font-size="12" fill="#1f2b38">.addClass("hot")</text>
  <rect x="400" y="180" width="470" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="416" y="206" font-size="12" fill="#5b6b7c">改动样式并返回自身，链可以继续</text>
  <line x1="205" y1="222" x2="205" y2="232" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="234" width="330" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="56" y="260" font-size="12" fill="#1f2b38">.find("a")</text>
  <rect x="400" y="234" width="470" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="416" y="260" font-size="12" fill="#1f2b38">破坏性操作：集合变成 li 内部的 a</text>
  <line x1="205" y1="276" x2="205" y2="286" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="288" width="330" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="314" font-size="12" fill="#1f2b38">.attr("target", "_blank")</text>
  <rect x="400" y="288" width="470" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="416" y="314" font-size="12" fill="#5b6b7c">给这些 a 设置属性，集合不变</text>
  <line x1="205" y1="330" x2="205" y2="340" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="342" width="330" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="56" y="368" font-size="12" fill="#1f2b38">.end()</text>
  <rect x="400" y="342" width="470" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="416" y="368" font-size="12" fill="#1f2b38">回退一层：集合恢复为 li.hot</text>
  <line x1="205" y1="384" x2="205" y2="394" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="396" width="330" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="422" font-size="12" fill="#1f2b38">.append("&lt;span&gt;热门&lt;/span&gt;")</text>
  <rect x="400" y="396" width="470" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="416" y="422" font-size="12" fill="#5b6b7c">在回退后的集合里追加「热门」标记</text>
</svg>
