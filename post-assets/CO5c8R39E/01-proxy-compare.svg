<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 三种代理方式对比：静态代理、JDK 动态代理、CGLIB 动态代理</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java 三种代理方式对比</text>

  <rect x="200" y="55" width="220" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="310" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">静态代理</text>
  <rect x="430" y="55" width="220" height="36" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="540" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">JDK 动态代理</text>
  <rect x="660" y="55" width="220" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="770" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">CGLIB 动态代理</text>

  <text x="40" y="126" font-size="12" fill="#5b6b7c">代理类产生时机</text>
  <rect x="200" y="101" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="310" y="126" text-anchor="middle" font-size="12" fill="#1f2b38">编译前手写完成</text>
  <rect x="430" y="101" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="540" y="126" text-anchor="middle" font-size="12" fill="#1f2b38">运行时反射生成</text>
  <rect x="660" y="101" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="770" y="126" text-anchor="middle" font-size="12" fill="#1f2b38">运行时生成字节码</text>

  <text x="40" y="176" font-size="12" fill="#5b6b7c">是否要求接口</text>
  <rect x="200" y="151" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="310" y="176" text-anchor="middle" font-size="12" fill="#1f2b38">需要接口</text>
  <rect x="430" y="151" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="540" y="176" text-anchor="middle" font-size="12" fill="#1f2b38">目标类必须实现接口</text>
  <rect x="660" y="151" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="770" y="176" text-anchor="middle" font-size="12" fill="#1f2b38">目标类无需接口</text>

  <text x="40" y="226" font-size="12" fill="#5b6b7c">核心 API</text>
  <rect x="200" y="201" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="310" y="226" text-anchor="middle" font-size="12" fill="#1f2b38">手写代理类持有目标</text>
  <rect x="430" y="201" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="540" y="226" text-anchor="middle" font-size="12" fill="#1f2b38">InvocationHandler + Proxy</text>
  <rect x="660" y="201" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="770" y="219" text-anchor="middle" font-size="12" fill="#1f2b38">MethodInterceptor</text>
  <text x="770" y="235" text-anchor="middle" font-size="12" fill="#1f2b38">+ Enhancer</text>

  <text x="40" y="276" font-size="12" fill="#5b6b7c">局限</text>
  <rect x="200" y="251" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="310" y="276" text-anchor="middle" font-size="12" fill="#1f2b38">方法多时代码膨胀</text>
  <rect x="430" y="251" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="540" y="276" text-anchor="middle" font-size="12" fill="#1f2b38">只能代理接口中的方法</text>
  <rect x="660" y="251" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="770" y="276" text-anchor="middle" font-size="12" fill="#1f2b38">不能代理 final 类方法</text>

  <text x="40" y="326" font-size="12" fill="#5b6b7c">生成代理对象的角色</text>
  <rect x="200" y="301" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="310" y="326" text-anchor="middle" font-size="12" fill="#1f2b38">开发人员</text>
  <rect x="430" y="301" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="540" y="326" text-anchor="middle" font-size="12" fill="#1f2b38">java.lang.reflect.Proxy</text>
  <rect x="660" y="301" width="220" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="770" y="326" text-anchor="middle" font-size="12" fill="#1f2b38">net.sf.cglib.proxy.Enhancer</text>

  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#5b6b7c">Spring AOP 对实现了接口的目标用 JDK 代理，Spring Boot 2.x 起默认统一使用 CGLIB</text>
</svg>
