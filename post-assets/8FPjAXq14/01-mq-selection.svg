<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="490" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">MQ 选型对比与适用场景</text>
<rect x="320" y="62" width="260" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="450" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">业务引入消息中间件</text>
<line x1="340" y1="110" x2="176" y2="156" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="110" x2="450" y2="156" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="110" x2="724" y2="156" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="160" width="260" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="170" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">RabbitMQ</text>
<rect x="40" y="202" width="260" height="186" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="56" y="234" font-size="13" fill="#1f2b38">功能全面、消息可靠性高</text>
<text x="56" y="264" font-size="13" fill="#1f2b38">吞吐量较低</text>
<text x="56" y="294" font-size="13" fill="#1f2b38">积压时性能明显下降</text>
<text x="56" y="324" font-size="13" fill="#1f2b38">Erlang 开发，定制较难</text>
<text x="56" y="354" font-size="13" fill="#1f2b38">适用：规模不大的业务</text>
<rect x="320" y="160" width="260" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="450" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Kafka</text>
<rect x="320" y="202" width="260" height="186" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="336" y="234" font-size="13" fill="#1f2b38">吞吐量最高，集群高可用</text>
<text x="336" y="264" font-size="13" fill="#1f2b38">功能相对单一</text>
<text x="336" y="294" font-size="13" fill="#1f2b38">可靠性靠 acks、副本配置</text>
<text x="336" y="324" font-size="13" fill="#1f2b38">适用：日志分析、大数据</text>
<rect x="600" y="160" width="260" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="730" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">RocketMQ</text>
<rect x="600" y="202" width="260" height="186" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="616" y="234" font-size="13" fill="#1f2b38">吞吐量高，可用性高</text>
<text x="616" y="264" font-size="13" fill="#1f2b38">功能全面，Java 易定制</text>
<text x="616" y="294" font-size="13" fill="#1f2b38">开源版不及商业版</text>
<text x="616" y="324" font-size="13" fill="#1f2b38">官方文档相对简略</text>
<text x="616" y="354" font-size="13" fill="#1f2b38">适用：业务 + 大数据</text>
<rect x="40" y="408" width="820" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="450" y="434" text-anchor="middle" font-size="13" fill="#1f2b38">共同关注：可用性、消息不丢不重、消息积压治理</text>
<text x="450" y="458" text-anchor="middle" font-size="13" fill="#5b6b7c">选型没有最优解，只有与业务规模、团队技术栈更匹配的方案</text>
</svg>
