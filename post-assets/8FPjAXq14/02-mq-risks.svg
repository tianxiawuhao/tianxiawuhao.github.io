<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">引入 MQ 后的三类风险与应对</text>
<rect x="40" y="64" width="290" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="56" y="94" font-size="14" font-weight="700" fill="#1f2b38">系统可用性降低</text>
<text x="56" y="122" font-size="12.5" fill="#5b6b7c">业务强依赖 MQ，MQ 宕机则业务不可用</text>
<line x1="338" y1="108" x2="412" y2="108" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="64" width="440" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="436" y="94" font-size="14" font-weight="700" fill="#1f2b38">MQ 高可用部署</text>
<text x="436" y="122" font-size="12.5" fill="#5b6b7c">集群 + 主从/多副本，消除单点故障</text>
<rect x="40" y="172" width="290" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="56" y="202" font-size="14" font-weight="700" fill="#1f2b38">系统复杂度变高</text>
<text x="56" y="230" font-size="12.5" fill="#5b6b7c">异步调用难以重现、定位与排查</text>
<line x1="338" y1="216" x2="412" y2="216" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="172" width="440" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="436" y="202" font-size="14" font-weight="700" fill="#1f2b38">统一规范与可观测性</text>
<text x="436" y="230" font-size="12.5" fill="#5b6b7c">约定消息格式，补充链路追踪与监控告警</text>
<rect x="40" y="280" width="290" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="56" y="310" font-size="14" font-weight="700" fill="#1f2b38">消息一致性问题</text>
<text x="56" y="338" font-size="12.5" fill="#5b6b7c">消息丢失、重复消费与消息积压</text>
<line x1="338" y1="324" x2="412" y2="324" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="280" width="440" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="436" y="310" font-size="14" font-weight="700" fill="#1f2b38">可靠投递 + 幂等消费</text>
<text x="436" y="338" font-size="12.5" fill="#5b6b7c">发送端确认与重试，消费端幂等，积压时限流</text>
</svg>
