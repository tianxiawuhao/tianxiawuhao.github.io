<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker></defs>
<rect width="900" height="650" fill="#ffffff"/>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">KubeSphere 3.2.1 最小化安装流程（ks-installer 方式）</text>
<text x="450" y="52" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">适用于已有 Kubernetes 1.19–1.22 集群，命令在 master 节点执行</text>
<rect x="40" y="76" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="97" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">① 前置检查</text>
<text x="56" y="116" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">k8s 1.19–1.22、默认 StorageClass、节点时间同步、可拉取镜像</text>
<line x1="320" y1="128" x2="320" y2="140" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="142" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="163" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">② 准备默认 SC</text>
<text x="56" y="182" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">NFS + nfs-client-provisioner，或 OpenEBS / LocalPV，并标记为 default</text>
<line x1="320" y1="194" x2="320" y2="206" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="208" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="229" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">③ 确认 metrics-server</text>
<text x="56" y="248" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">用 metrics_server.enabled: true，或自装 v0.6.x；两者只保留一个</text>
<line x1="320" y1="260" x2="320" y2="272" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="274" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="295" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">④ 部署 ks-installer</text>
<text x="56" y="314" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">kubectl apply -f kubesphere-installer.yaml（CRD / NS / RBAC / Deployment）</text>
<line x1="320" y1="326" x2="320" y2="338" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="340" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="361" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">⑤ 编辑 ClusterConfiguration</text>
<text x="56" y="380" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">persistence.storageClass、etcd.endpointIps、各组件开关</text>
<line x1="320" y1="392" x2="320" y2="404" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="406" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="427" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">⑥ 应用配置</text>
<text x="56" y="446" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">kubectl apply -f cluster-configuration.yaml，ks-installer 开始编排组件</text>
<line x1="320" y1="458" x2="320" y2="470" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="472" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="493" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">⑦ 观察安装日志</text>
<text x="56" y="512" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">kubectl logs -n kubesphere-system deploy/ks-installer -f，等待成功</text>
<line x1="320" y1="524" x2="320" y2="536" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="538" width="560" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="56" y="559" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">⑧ 验证访问</text>
<text x="56" y="578" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">浏览器打开 http://&lt;master-ip&gt;:30880，默认账号 admin / P@88w0rd</text>
<rect x="620" y="76" width="250" height="340" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="634" y="100" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">离线（air-gap）安装要点</text>
<text x="634" y="124" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">1. 联网机导出制品（含镜像）：</text>
<text x="634" y="146" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">./kk artifact export -m m.yaml</text>
<text x="634" y="168" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">   -o ks-artifact.tar.gz</text>
<text x="634" y="190" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">2. 内网推送镜像到私有仓库：</text>
<text x="634" y="212" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">./kk artifact image push -f c.yaml</text>
<text x="634" y="234" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">   -a ks-artifact.tar.gz</text>
<text x="634" y="256" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">3. 只用 ks-installer 时，把</text>
<text x="634" y="278" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">spec.local_registry 指向私有仓库</text>
<text x="634" y="300" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">4. 必须导入 ks-installer 与</text>
<text x="634" y="322" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">MinIO/Prometheus/Redis/ES 等镜像</text>
<text x="634" y="344" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">5. 自签证书配 insecure-registries</text>
<rect x="620" y="436" width="250" height="154" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="634" y="460" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">常见失败点</text>
<text x="634" y="486" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">• 组件 ImagePullBackOff：镜像</text>
<text x="634" y="506" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">• PVC Pending：没有默认 SC</text>
<text x="634" y="526" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">• apply 报 no matches：顺序错</text>
<text x="634" y="546" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">• 30880 打不开：NodePort/防火墙</text>
<text x="634" y="566" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">• 时间不同步：chronyd 未启用</text>
<text x="450" y="614" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">整个安装通常需要 10–25 分钟，期间不要重复 apply，也不要重启节点，ks-installer 会幂等重试</text>
<text x="450" y="634" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">组件开关可在安装后随时修改 ClusterConfiguration，ks-installer 会自动同步</text>
</svg>
