<text x="450" y="506" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="400">版本提示：KubeSphere 3.2.1 支持 Kubernetes 1.19.x – 1.22.x（1.22 为实验性支持）</text>
<text x="450" y="526" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">KubeSphere 4.x 改用 LuBan 架构，按需安装扩展组件，不再使用 ks-installer</text>
