<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>小程序登录授权链路：用 code 换 openid 与 session_key</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">小程序登录：用 code 换 openid 与 session_key</text>
  <g stroke-width="1.4">
    <rect x="40" y="80" width="230" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
    <rect x="335" y="80" width="230" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
    <rect x="630" y="80" width="230" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">
    <text x="155" y="108">① 小程序前端</text>
    <text x="450" y="108">② 自己的后端</text>
    <text x="745" y="108">③ 微信接口服务器</text>
  </g>
  <g font-size="11.5" fill="#1f2b38" text-anchor="middle">
    <text x="155" y="136">wx.login() 拿临时 code</text>
    <text x="155" y="160">code 走 HTTPS 上报</text>
    <text x="450" y="136">校验参数后调</text>
    <text x="450" y="160">sns/jscode2session</text>
    <text x="745" y="136">返回 openid</text>
    <text x="745" y="160">+ session_key / unionid</text>
  </g>
  <g stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="272" y1="132" x2="331" y2="132"/>
    <line x1="567" y1="132" x2="626" y2="132"/>
    <path d="M 745 184 L 745 198 L 155 198 L 155 202" fill="none"/>
    <line x1="272" y1="252" x2="331" y2="252"/>
    <line x1="567" y1="252" x2="626" y2="252"/>
  </g>
  <g stroke-width="1.4">
    <rect x="40" y="206" width="230" height="92" rx="8" fill="#f7f9fc" stroke="#2f6fd0"/>
    <rect x="335" y="206" width="230" height="92" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
    <rect x="630" y="206" width="230" height="92" rx="8" fill="#f7f9fc" stroke="#2f6fd0"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">
    <text x="155" y="234">④ 服务端存凭证</text>
    <text x="450" y="234">⑤ 只发业务 token</text>
    <text x="745" y="234">⑥ 前端访问业务接口</text>
  </g>
  <g font-size="11.5" fill="#1f2b38" text-anchor="middle">
    <text x="155" y="262">session_key → Redis</text>
    <text x="155" y="284">TTL 30 分钟</text>
    <text x="450" y="262">返回不透明 token</text>
    <text x="450" y="284">可撤销、可续期</text>
    <text x="745" y="262">携带 token 调接口</text>
    <text x="745" y="284">session_key 不出服务端</text>
  </g>
  <rect x="40" y="314" width="410" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="245" y="340" font-size="12.5" font-weight="700" fill="#e08a1e" text-anchor="middle">code 一次性，5 分钟内有效</text>
  <text x="245" y="362" font-size="11.5" fill="#1f2b38" text-anchor="middle">刷新页面必须重新 wx.login()，复用旧 code 必现 40029</text>
  <rect x="464" y="314" width="406" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="667" y="340" font-size="12.5" font-weight="700" fill="#e08a1e" text-anchor="middle">session_key 绝不下发前端</text>
  <text x="667" y="362" font-size="11.5" fill="#1f2b38" text-anchor="middle">只给不透明 token；校验用 sha1(rawData + session_key)</text>
</svg>
