<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Boot 自动装配的调用链路</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring Boot 自动装配的调用链路</text>

  <rect x="40" y="70" width="240" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="94" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">@SpringBootApplication</text>
  <text x="160" y="113" font-size="11" fill="#5b6b7c" text-anchor="middle">启动类上的组合注解</text>
  <rect x="330" y="70" width="240" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="94" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">@EnableAutoConfiguration</text>
  <text x="450" y="113" font-size="11" fill="#5b6b7c" text-anchor="middle">开启自动配置能力</text>
  <rect x="620" y="70" width="240" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="740" y="94" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">@Import 导入选择器</text>
  <text x="740" y="113" font-size="11" fill="#5b6b7c" text-anchor="middle">AutoConfigurationImportSelector</text>
  <line x1="280" y1="98" x2="322" y2="98" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="98" x2="612" y2="98" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <path d="M 740 126 V 153 H 160 V 172" fill="none" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="180" width="240" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="204" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">SpringFactoriesLoader</text>
  <text x="160" y="223" font-size="11" fill="#5b6b7c" text-anchor="middle">loadFactoryNames() 取候选配置类</text>
  <rect x="330" y="180" width="240" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="204" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">加载 spring.factories</text>
  <text x="450" y="223" font-size="11" fill="#5b6b7c" text-anchor="middle">key = EnableAutoConfiguration</text>
  <rect x="620" y="180" width="240" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="204" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">按 @Conditional 过滤</text>
  <text x="740" y="223" font-size="11" fill="#5b6b7c" text-anchor="middle">条件不满足则跳过</text>
  <line x1="280" y1="208" x2="322" y2="208" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="208" x2="612" y2="208" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <path d="M 740 236 V 263 H 450 V 282" fill="none" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="330" y="290" width="240" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="314" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">注册 BeanDefinition</text>
  <text x="450" y="333" font-size="11" fill="#5b6b7c" text-anchor="middle">条件成立的配置类生效</text>
  <line x1="450" y1="346" x2="450" y2="392" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="330" y="400" width="240" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="424" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">IoC 容器完成自动装配</text>
  <text x="450" y="443" font-size="11" fill="#5b6b7c" text-anchor="middle">starter 依赖开箱即用</text>
</svg>
