<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>@Conditional 条件注解如何决定配置类是否生效</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">@Conditional 条件装配：条件成立才生效</text>

  <rect x="40" y="110" width="190" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="135" y="152" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">候选自动配置类</text>
  <text x="135" y="180" font-size="11" fill="#5b6b7c" text-anchor="middle">注册文件中列出</text>
  <line x1="230" y1="160" x2="262" y2="160" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="270" y="100" width="250" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="395" y="127" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">@Conditional 条件判断</text>
  <text x="395" y="150" font-size="11" fill="#5b6b7c" text-anchor="middle">@ConditionalOnClass</text>
  <text x="395" y="168" font-size="11" fill="#5b6b7c" text-anchor="middle">@ConditionalOnBean</text>
  <text x="395" y="186" font-size="11" fill="#5b6b7c" text-anchor="middle">@ConditionalOnMissingBean</text>
  <text x="395" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">@ConditionalOnProperty</text>

  <line x1="520" y1="160" x2="550" y2="160" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="550" y1="110" x2="550" y2="230" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="550" y1="110" x2="614" y2="110" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="550" y1="230" x2="614" y2="230" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="620" y="70" width="250" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="745" y="104" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">条件全部成立</text>
  <text x="745" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">配置类被解析，Bean 注册进容器</text>
  <rect x="620" y="190" width="250" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="745" y="224" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">任一条件不成立</text>
  <text x="745" y="250" font-size="11" fill="#5b6b7c" text-anchor="middle">跳过该配置类，不做任何装配</text>
</svg>
