<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>线程池任务提交的四步决策链</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">提交任务后，线程池的决策顺序</text>
  <rect x="40" y="56" width="340" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="78" font-size="12" fill="#1f2b38" text-anchor="middle">① 工作线程数 &lt; corePoolSize ？</text>
  <text x="210" y="98" font-size="11" fill="#5b6b7c" text-anchor="middle">线程池还没填满核心线程</text>
  <rect x="440" y="56" width="430" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="655" y="88" font-size="12" fill="#1f2b38" text-anchor="middle">是 → 新建核心线程执行任务，不入队</text>
  <line x1="380" y1="83" x2="436" y2="83" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="210" y1="110" x2="210" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="232" y="127" font-size="11" fill="#e08a1e" text-anchor="start">否</text>
  <rect x="40" y="132" width="340" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="154" font-size="12" fill="#1f2b38" text-anchor="middle">② 任务成功放入 workQueue ？</text>
  <text x="210" y="174" font-size="11" fill="#5b6b7c" text-anchor="middle">先入队，而不是先扩容</text>
  <rect x="440" y="132" width="430" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="655" y="164" font-size="12" fill="#1f2b38" text-anchor="middle">是 → 入队，等空闲线程来取</text>
  <line x1="380" y1="159" x2="436" y2="159" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="210" y1="186" x2="210" y2="206" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="232" y="203" font-size="11" fill="#e08a1e" text-anchor="start">否</text>
  <rect x="40" y="208" width="340" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="230" font-size="12" fill="#1f2b38" text-anchor="middle">③ 线程数 &lt; maximumPoolSize ？</text>
  <text x="210" y="250" font-size="11" fill="#5b6b7c" text-anchor="middle">队列满了才轮到扩容非核心线程</text>
  <rect x="440" y="208" width="430" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="655" y="240" font-size="12" fill="#1f2b38" text-anchor="middle">是 → 新建非核心线程执行任务</text>
  <line x1="380" y1="235" x2="436" y2="235" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="210" y1="262" x2="210" y2="282" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="232" y="279" font-size="11" fill="#e08a1e" text-anchor="start">否</text>
  <rect x="40" y="284" width="340" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="210" y="306" font-size="12" fill="#1f2b38" text-anchor="middle">④ 队列已满且线程数已达上限</text>
  <text x="210" y="326" font-size="11" fill="#5b6b7c" text-anchor="middle">无法再容纳新任务</text>
  <rect x="440" y="284" width="430" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="655" y="316" font-size="12" fill="#1f2b38" text-anchor="middle">触发 RejectedExecutionHandler 拒绝策略</text>
  <line x1="380" y1="311" x2="436" y2="311" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="370" font-size="11" fill="#5b6b7c" text-anchor="middle">AbortPolicy 抛异常 · CallerRunsPolicy 提交线程执行形成背压 · Discard 静默丢弃 · DiscardOldest 丢最早任务</text>
</svg>
