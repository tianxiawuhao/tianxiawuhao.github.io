<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>AQS 核心：state 与 CLH 等待队列</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">AQS：一个 state + 一条 CLH 等待队列</text>
  <rect x="30" y="52" width="840" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="79" font-size="12" fill="#1f2b38" text-anchor="middle">j.u.c 同步器：ReentrantLock · Semaphore · CountDownLatch · ReentrantReadWriteLock</text>
  <line x1="265" y1="96" x2="265" y2="114" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="30" y="118" width="470" height="232" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="265" y="145" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">AbstractQueuedSynchronizer</text>
  <rect x="50" y="158" width="430" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="265" y="182" font-size="11" fill="#1f2b38" text-anchor="middle">volatile int state：0 = 未加锁，加锁置 1，重入自增</text>
  <text x="265" y="201" font-size="11" fill="#5b6b7c" text-anchor="middle">重入上限是 state 的溢出边界，不是某个固定常数</text>
  <rect x="50" y="226" width="430" height="104" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="265" y="250" font-size="11" fill="#1f2b38" text-anchor="middle">CLH 变体双向 FIFO 等待队列：存放阻塞线程</text>
  <rect x="66" y="262" width="88" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="110" y="288" font-size="11" fill="#1f2b38" text-anchor="middle">head</text>
  <rect x="166" y="262" width="88" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="288" font-size="11" fill="#1f2b38" text-anchor="middle">Node</text>
  <rect x="266" y="262" width="88" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="310" y="288" font-size="11" fill="#1f2b38" text-anchor="middle">Node</text>
  <rect x="366" y="262" width="88" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="410" y="288" font-size="11" fill="#1f2b38" text-anchor="middle">tail</text>
  <rect x="530" y="118" width="340" height="232" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="700" y="145" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">模板方法模式</text>
  <text x="700" y="173" font-size="11" fill="#5b6b7c" text-anchor="middle">骨架固定：入队、阻塞、唤醒、中断处理</text>
  <text x="700" y="199" font-size="11" fill="#5b6b7c" text-anchor="middle">子类只实现钩子方法：</text>
  <text x="700" y="221" font-size="11" fill="#5b6b7c" text-anchor="middle">tryAcquire / tryRelease</text>
  <text x="700" y="243" font-size="11" fill="#5b6b7c" text-anchor="middle">tryAcquireShared / tryReleaseShared</text>
  <text x="700" y="265" font-size="11" fill="#5b6b7c" text-anchor="middle">isHeldExclusively</text>
  <line x1="560" y1="284" x2="840" y2="284" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="700" y="307" font-size="11" fill="#1f2b38" text-anchor="middle">公平：先 hasQueuedPredecessors() 再抢</text>
  <text x="700" y="331" font-size="11" fill="#1f2b38" text-anchor="middle">非公平：允许插队，吞吐高但可能饥饿</text>
  <text x="450" y="376" font-size="11" fill="#5b6b7c" text-anchor="middle">独占与共享两种模式：ReentrantLock 走独占，Semaphore / CountDownLatch 走共享</text>
</svg>
