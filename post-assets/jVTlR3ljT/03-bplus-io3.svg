<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>B+树单行查询的第三次磁盘IO示意图</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">B+树的单行查询：第 3 次磁盘IO</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#5b6b7c">查询 key = 5，每一次磁盘IO读入查找路径上的一个节点。</text>
  <rect x="380" y="78" width="140" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="102" text-anchor="middle" font-size="15" fill="#1f2b38">6 | 15</text>
  <circle cx="545" cy="96" r="12" fill="#e08a1e"/>
  <text x="545" y="101" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
  <text x="566" y="101" font-size="12" fill="#1f2b38">第1次磁盘IO：读根节点</text>
  <rect x="180" y="170" width="110" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="194" text-anchor="middle" font-size="15" fill="#1f2b38">3 | 6</text>
  <rect x="610" y="170" width="110" height="36" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="194" text-anchor="middle" font-size="15" fill="#5b6b7c">11 | 15</text>
  <circle cx="305" cy="188" r="12" fill="#e08a1e"/>
  <text x="305" y="193" text-anchor="middle" font-size="13" fill="#ffffff">2</text>
  <text x="326" y="193" font-size="12" fill="#1f2b38">第2次磁盘IO：读中间节点</text>
  <rect x="80" y="262" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="140" y="284" text-anchor="middle" font-size="13" fill="#5b6b7c">1, 2, 3</text>
  <text x="140" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">卫星数据</text>
  <rect x="280" y="262" width="120" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="284" text-anchor="middle" font-size="13" fill="#1f2b38">4, 5, 6</text>
  <text x="340" y="303" text-anchor="middle" font-size="11" fill="#2e9e5b">含 key = 5</text>
  <rect x="500" y="262" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="560" y="284" text-anchor="middle" font-size="13" fill="#5b6b7c">9, 10, 11</text>
  <text x="560" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">卫星数据</text>
  <rect x="700" y="262" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="760" y="284" text-anchor="middle" font-size="13" fill="#5b6b7c">13, 14, 15</text>
  <text x="760" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">卫星数据</text>
  <line x1="415" y1="114" x2="250" y2="166" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="485" y1="114" x2="650" y2="166" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="210" y1="206" x2="150" y2="258" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="260" y1="206" x2="330" y2="258" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="640" y1="206" x2="570" y2="258" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="690" y1="206" x2="750" y2="258" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="340" y1="316" x2="340" y2="332" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <circle cx="340" cy="352" r="12" fill="#e08a1e"/>
  <text x="340" y="357" text-anchor="middle" font-size="13" fill="#ffffff">3</text>
  <text x="362" y="357" font-size="12" fill="#1f2b38">第3次磁盘IO：读到叶子节点，取出 key = 5 的记录</text>
</svg>
