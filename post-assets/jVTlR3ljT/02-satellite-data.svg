<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>卫星数据存放位置对比：B树与B+树</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">卫星数据放在哪里：B树 vs B+树</text>
  <rect x="30" y="70" width="400" height="272" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">B树</text>
  <rect x="55" y="118" width="350" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="230" y="147" text-anchor="middle" font-size="13" fill="#1f2b38">根节点：key + 卫星数据</text>
  <rect x="55" y="176" width="350" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="230" y="205" text-anchor="middle" font-size="13" fill="#1f2b38">中间节点：key + 卫星数据</text>
  <rect x="55" y="234" width="350" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="230" y="263" text-anchor="middle" font-size="13" fill="#1f2b38">叶子节点：key + 卫星数据</text>
  <text x="230" y="314" text-anchor="middle" font-size="12" fill="#5b6b7c">每一层节点都可能命中记录</text>
  <rect x="470" y="70" width="400" height="272" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">B+树</text>
  <rect x="495" y="118" width="350" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="147" text-anchor="middle" font-size="13" fill="#1f2b38">根节点：只有 key（索引）</text>
  <rect x="495" y="176" width="350" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="205" text-anchor="middle" font-size="13" fill="#1f2b38">中间节点：只有 key（索引）</text>
  <rect x="495" y="234" width="350" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="263" text-anchor="middle" font-size="13" fill="#1f2b38">叶子节点：key + 卫星数据</text>
  <text x="670" y="314" text-anchor="middle" font-size="12" fill="#5b6b7c">只有叶子节点带数据，且连成有序链表</text>
</svg>
