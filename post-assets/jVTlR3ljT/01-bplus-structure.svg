<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>B+树结构示意图：中间节点只做索引，数据全部在叶子层</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">B+树结构：中间节点只做索引，数据全部在叶子层</text>
  <text x="40" y="60" font-size="12" fill="#5b6b7c">中间节点只保存索引 key，叶子节点保存全部 key 与卫星数据，叶子之间用指针连成有序链表。</text>
  <text x="24" y="106" font-size="12" fill="#5b6b7c">根节点</text>
  <rect x="385" y="86" width="130" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="108" text-anchor="middle" font-size="15" fill="#1f2b38">6 | 15</text>
  <text x="24" y="198" font-size="12" fill="#5b6b7c">中间节点</text>
  <rect x="180" y="178" width="110" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="200" text-anchor="middle" font-size="15" fill="#1f2b38">3 | 6</text>
  <rect x="610" y="178" width="110" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="665" y="200" text-anchor="middle" font-size="15" fill="#1f2b38">11 | 15</text>
  <text x="24" y="300" font-size="12" fill="#5b6b7c">叶子节点</text>
  <rect x="80" y="278" width="120" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="300" text-anchor="middle" font-size="13" fill="#1f2b38">1, 2, 3</text>
  <text x="140" y="319" text-anchor="middle" font-size="11" fill="#5b6b7c">卫星数据</text>
  <rect x="280" y="278" width="120" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="300" text-anchor="middle" font-size="13" fill="#1f2b38">4, 5, 6</text>
  <text x="340" y="319" text-anchor="middle" font-size="11" fill="#5b6b7c">卫星数据</text>
  <rect x="500" y="278" width="120" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="560" y="300" text-anchor="middle" font-size="13" fill="#1f2b38">9, 10, 11</text>
  <text x="560" y="319" text-anchor="middle" font-size="11" fill="#5b6b7c">卫星数据</text>
  <rect x="700" y="278" width="120" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="760" y="300" text-anchor="middle" font-size="13" fill="#1f2b38">13, 14, 15</text>
  <text x="760" y="319" text-anchor="middle" font-size="11" fill="#5b6b7c">卫星数据</text>
  <line x1="415" y1="120" x2="248" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="485" y1="120" x2="652" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="208" y1="212" x2="150" y2="274" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="262" y1="212" x2="330" y2="274" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="638" y1="212" x2="570" y2="274" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="692" y1="212" x2="750" y2="274" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="200" y1="304" x2="276" y2="304" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="400" y1="304" x2="496" y2="304" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="620" y1="304" x2="696" y2="304" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#5b6b7c">叶子节点之间是有序链表：范围查询只需顺序扫描叶子层。</text>
</svg>
