<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">自动配置装配流程：候选清单 → 条件筛选 → Bean 注册</text>

  <rect x="290" y="52" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">@SpringBootApplication</text>
  <line x1="450" y1="100" x2="450" y2="124" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="290" y="128" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">@EnableAutoConfiguration</text>
  <text x="450" y="168" text-anchor="middle" font-size="12" fill="#5b6b7c">@Import(AutoConfigurationImportSelector)</text>
  <line x1="450" y1="176" x2="450" y2="200" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="170" y="204" width="560" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="190" y="228" font-size="13" font-weight="700" fill="#1f2b38">候选自动配置类清单的来源</text>
  <rect x="190" y="240" width="250" height="98" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="206" y="262" font-size="12" font-weight="700" fill="#1f2b38">Spring Boot 2.6 及以前</text>
  <text x="206" y="284" font-size="12" fill="#5b6b7c">META-INF/spring.factories</text>
  <text x="206" y="304" font-size="11" fill="#5b6b7c">键：EnableAutoConfiguration</text>
  <text x="206" y="324" font-size="11" fill="#5b6b7c">逗号分隔、无序、已废弃</text>
  <rect x="460" y="240" width="250" height="98" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="476" y="262" font-size="12" font-weight="700" fill="#1f2b38">Spring Boot 2.7 起 / 3.x</text>
  <text x="476" y="284" font-size="11" fill="#5b6b7c">META-INF/spring/…</text>
  <text x="476" y="304" font-size="11" fill="#5b6b7c">AutoConfiguration.imports</text>
  <text x="476" y="324" font-size="11" fill="#5b6b7c">每行一个类名，3.x 唯一入口</text>
  <line x1="370" y1="354" x2="370" y2="378" stroke="#5b6b7c" stroke-width="1.5"/>
  <line x1="530" y1="354" x2="530" y2="378" stroke="#5b6b7c" stroke-width="1.5"/>
  <line x1="370" y1="378" x2="530" y2="378" stroke="#5b6b7c" stroke-width="1.5"/>
  <line x1="450" y1="378" x2="450" y2="402" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="290" y="406" width="320" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="450" y="434" text-anchor="middle" font-size="12" fill="#1f2b38">去重 + @AutoConfigureOrder/Before/After 排序</text>
  <line x1="450" y1="450" x2="450" y2="474" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="60" y="478" width="300" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="80" y="502" font-size="13" font-weight="700" fill="#2e9e5b">条件满足 → 生效</text>
  <text x="80" y="526" font-size="12" fill="#1f2b38">@ConditionalOnClass　类路径存在</text>
  <text x="80" y="548" font-size="12" fill="#1f2b38">@ConditionalOnMissingBean　无同名 Bean</text>
  <text x="80" y="570" font-size="12" fill="#1f2b38">@ConditionalOnProperty　开关为真</text>
  <text x="80" y="592" font-size="12" fill="#1f2b38">@ConditionalOnWebApplication 等</text>
  <text x="80" y="614" font-size="11" fill="#5b6b7c">元注解为 Spring 的 @Conditional</text>

  <rect x="540" y="478" width="300" height="150" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="560" y="502" font-size="13" font-weight="700" fill="#e08a1e">条件不满足 → 跳过</text>
  <text x="560" y="526" font-size="12" fill="#1f2b38">记入条件评估报告的</text>
  <text x="560" y="548" font-size="12" fill="#1f2b38">Negative matches 列表</text>
  <text x="560" y="572" font-size="11" fill="#5b6b7c">开启 debug=true 或</text>
  <text x="560" y="592" font-size="11" fill="#5b6b7c">logging.level.org.springframework</text>
  <text x="560" y="610" font-size="11" fill="#5b6b7c">.boot.autoconfigure=DEBUG 查看</text>

  <line x1="450" y1="478" x2="360" y2="478" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="478" x2="540" y2="478" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="290" y="644" width="320" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="664" text-anchor="middle" font-size="12" fill="#1f2b38">@Bean 注册 + XxxProperties 绑定配置值</text>
  <text x="450" y="682" text-anchor="middle" font-size="11" fill="#5b6b7c">最终成为可 @Autowired 的 Bean</text>
  <line x1="210" y1="628" x2="210" y2="660" stroke="#5b6b7c" stroke-width="1.5"/>
  <line x1="210" y1="660" x2="286" y2="660" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>
</svg>
