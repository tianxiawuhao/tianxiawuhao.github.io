<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Servlet 三大组件的两种注册方式对比</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Servlet 三大组件的两种注册方式</text>

  <rect x="40" y="55" width="380" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">方式一：继承接口 + XxxRegistrationBean</text>
  <rect x="480" y="55" width="380" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">方式二：注解 + @ServletComponentScan</text>
  <line x1="424" y1="74" x2="476" y2="74" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/>

  <rect x="40" y="110" width="380" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="133" font-size="13" font-weight="700" fill="#1f2b38">HttpServlet</text>
  <text x="60" y="151" font-size="11" fill="#5b6b7c">重写 doGet / doPost，再注册 ServletRegistrationBean</text>
  <rect x="40" y="180" width="380" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="203" font-size="13" font-weight="700" fill="#1f2b38">javax.servlet.Filter</text>
  <text x="60" y="221" font-size="11" fill="#5b6b7c">注册 FilterRegistrationBean，并设置拦截路径</text>
  <rect x="40" y="250" width="380" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="273" font-size="13" font-weight="700" fill="#1f2b38">ServletContextListener</text>
  <text x="60" y="291" font-size="11" fill="#5b6b7c">注册 ServletListenerRegistrationBean</text>

  <rect x="480" y="110" width="380" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="500" y="133" font-size="13" font-weight="700" fill="#1f2b38">@WebServlet</text>
  <text x="500" y="151" font-size="11" fill="#5b6b7c">urlPatterns 指定路径，name 指定组件名</text>
  <rect x="480" y="180" width="380" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="500" y="203" font-size="13" font-weight="700" fill="#1f2b38">@WebFilter</text>
  <text x="500" y="221" font-size="11" fill="#5b6b7c">value / urlPatterns 指定过滤规则</text>
  <rect x="480" y="250" width="380" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="500" y="273" font-size="13" font-weight="700" fill="#1f2b38">@WebListener</text>
  <text x="500" y="291" font-size="11" fill="#5b6b7c">标注 ServletContextListener 等实现类</text>

  <rect x="40" y="330" width="820" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="356" font-size="12" fill="#1f2b38">两种方式可以共存，组件最终都由 Servlet 容器管理；Bean 方式下组件名来自 @Bean 方法名或 RegistrationBean.setName()，</text>
  <text x="60" y="380" font-size="12" fill="#1f2b38">注解方式下则由注解的 name / filterName 决定。Spring Boot 3.x 中两者的包名都由 javax.servlet 换成 jakarta.servlet。</text>
</svg>
