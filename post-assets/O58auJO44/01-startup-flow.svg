<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Spring Boot 启动流程：三大阶段、关键事件与内嵌容器</text>

  <!-- 阶段一 -->
  <rect x="30" y="56" width="840" height="170" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="50" y="82" font-size="14" font-weight="700" fill="#2f6fd0">阶段一　启动引导（SpringApplication 构造 + run）</text>
  <rect x="50" y="96" width="245" height="112" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="66" y="120" font-size="13" font-weight="700" fill="#1f2b38">推断应用类型</text>
  <text x="66" y="144" font-size="12" fill="#5b6b7c">WebApplicationType.deduceFromClasspath()</text>
  <text x="66" y="166" font-size="12" fill="#5b6b7c">SERVLET / REACTIVE / NONE</text>
  <text x="66" y="190" font-size="12" fill="#5b6b7c">同时记录主配置类与启动计时器</text>
  <rect x="327" y="96" width="245" height="112" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="343" y="120" font-size="13" font-weight="700" fill="#1f2b38">加载扩展点</text>
  <text x="343" y="144" font-size="12" fill="#5b6b7c">spring.factories 中读取</text>
  <text x="343" y="166" font-size="12" fill="#5b6b7c">ApplicationContextInitializer</text>
  <text x="343" y="188" font-size="12" fill="#5b6b7c">ApplicationListener</text>
  <rect x="604" y="96" width="245" height="112" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="620" y="120" font-size="13" font-weight="700" fill="#1f2b38">事件</text>
  <text x="620" y="144" font-size="12" fill="#5b6b7c">ApplicationStartingEvent</text>
  <text x="620" y="166" font-size="12" fill="#5b6b7c">（Environment 尚未准备）</text>
  <line x1="295" y1="152" x2="322" y2="152" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="572" y1="152" x2="599" y2="152" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="226" x2="450" y2="252" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段二 -->
  <rect x="30" y="256" width="840" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="50" y="282" font-size="14" font-weight="700" fill="#2f6fd0">阶段二　Environment 准备（配置在此全部就绪）</text>
  <rect x="50" y="296" width="245" height="94" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="66" y="320" font-size="13" font-weight="700" fill="#1f2b38">创建 Environment</text>
  <text x="66" y="344" font-size="12" fill="#5b6b7c">StandardServletEnvironment</text>
  <text x="66" y="366" font-size="12" fill="#5b6b7c">（Web 应用）</text>
  <rect x="327" y="296" width="245" height="94" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="343" y="320" font-size="13" font-weight="700" fill="#1f2b38">加载属性源</text>
  <text x="343" y="344" font-size="12" fill="#5b6b7c">命令行 → 环境变量 → 配置文件</text>
  <text x="343" y="366" font-size="12" fill="#5b6b7c">按 profile 过滤后排序</text>
  <rect x="604" y="296" width="245" height="94" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="620" y="320" font-size="13" font-weight="700" fill="#1f2b38">事件</text>
  <text x="620" y="344" font-size="12" fill="#5b6b7c">ApplicationEnvironmentPreparedEvent</text>
  <text x="620" y="366" font-size="12" fill="#5b6b7c">由 EnvironmentPostProcessor 处理</text>
  <line x1="295" y1="343" x2="322" y2="343" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="572" y1="343" x2="599" y2="343" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="406" x2="450" y2="432" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段三 -->
  <rect x="30" y="436" width="840" height="204" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="50" y="462" font-size="14" font-weight="700" fill="#2f6fd0">阶段三　创建并 refresh 应用上下文（内嵌容器在此时启动）</text>
  <rect x="50" y="476" width="245" height="94" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="66" y="500" font-size="13" font-weight="700" fill="#1f2b38">prepareContext</text>
  <text x="66" y="524" font-size="12" fill="#5b6b7c">执行 Initializer、注册主配置类</text>
  <text x="66" y="546" font-size="12" fill="#5b6b7c">加载 BeanDefinition</text>
  <rect x="327" y="476" width="245" height="94" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="343" y="500" font-size="13" font-weight="700" fill="#1f2b38">refreshContext</text>
  <text x="343" y="524" font-size="12" fill="#5b6b7c">触发自动配置、实例化单例 Bean</text>
  <text x="343" y="546" font-size="12" fill="#5b6b7c">onRefresh() 创建并启动 Tomcat</text>
  <rect x="604" y="476" width="245" height="94" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="620" y="500" font-size="13" font-weight="700" fill="#1f2b38">收尾</text>
  <text x="620" y="524" font-size="12" fill="#5b6b7c">执行 ApplicationRunner /</text>
  <text x="620" y="546" font-size="12" fill="#5b6b7c">CommandLineRunner</text>
  <line x1="295" y1="523" x2="322" y2="523" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="572" y1="523" x2="599" y2="523" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="50" y="584" width="799" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="66" y="604" font-size="12" fill="#1f2b38">事件顺序：ApplicationContextInitializedEvent → ApplicationPreparedEvent → ContextRefreshedEvent</text>
  <text x="66" y="622" font-size="12" fill="#1f2b38">→ ApplicationStartedEvent（Runner 之前）→ ApplicationReadyEvent（应用可对外服务）</text>
</svg>
