<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gradle 属性的配置来源与优先级顺序</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Gradle 属性的配置来源与优先级</text>

  <line x1="205" y1="80" x2="205" y2="400" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="205" y1="80" x2="232" y2="80" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="240" y="85" font-size="12" fill="#5b6b7c">优先级由高到低，同名属性以更靠上的来源为准</text>

  <rect x="40" y="100" width="820" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <circle cx="68" cy="124" r="14" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="68" y="129" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">1</text>
  <text x="98" y="121" font-size="14" font-weight="700" fill="#1f2b38">命令行选项与系统属性</text>
  <text x="98" y="139" font-size="11" fill="#5b6b7c">例如 -Dgradle.user.home，或在 gradle.properties 中写 systemProp.xxx</text>

  <rect x="40" y="176" width="820" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <circle cx="68" cy="200" r="14" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="68" y="205" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">2</text>
  <text x="98" y="197" font-size="14" font-weight="700" fill="#1f2b38">GRADLE_USER_HOME 目录中的 gradle.properties</text>
  <text x="98" y="215" font-size="11" fill="#5b6b7c">默认在用户目录的 .gradle 下，仅对本机用户全局生效</text>

  <rect x="40" y="252" width="820" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <circle cx="68" cy="276" r="14" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="68" y="281" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">3</text>
  <text x="98" y="273" font-size="14" font-weight="700" fill="#1f2b38">项目根目录中的 gradle.properties</text>
  <text x="98" y="291" font-size="11" fill="#5b6b7c">随项目一起提交，团队成员与 CI 都会读到</text>

  <rect x="40" y="328" width="820" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="68" cy="352" r="14" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="68" y="357" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">4</text>
  <text x="98" y="349" font-size="14" font-weight="700" fill="#1f2b38">Gradle 安装目录中的 gradle.properties</text>
  <text x="98" y="367" font-size="11" fill="#5b6b7c">随 Gradle 发行版分发，优先级最低，容易被上层来源覆盖</text>

  <rect x="40" y="386" width="820" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="406" font-size="11" fill="#1f2b38">项目属性还可写成 org.gradle.project.foo=bar，并用 -Pfoo=bar 在命令行覆盖</text>
</svg>
