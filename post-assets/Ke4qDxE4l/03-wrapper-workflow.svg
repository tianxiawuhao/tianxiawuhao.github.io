<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gradle Wrapper 执行流程：脚本读取属性文件并按需下载发行版</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Gradle Wrapper 执行流程</text>

  <circle cx="40" cy="88" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="40" y="93" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">1</text>
  <text x="62" y="86" font-size="14" font-weight="700" fill="#1f2b38">执行 Wrapper 脚本</text>
  <text x="62" y="105" font-size="11" fill="#5b6b7c">./gradlew build（Windows 用 gradlew.bat build）</text>

  <line x1="40" y1="101" x2="40" y2="138" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <circle cx="40" cy="155" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="40" y="160" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">2</text>
  <text x="62" y="153" font-size="14" font-weight="700" fill="#1f2b38">读取 gradle-wrapper.properties</text>
  <text x="62" y="172" font-size="11" fill="#5b6b7c">从中取 distributionUrl，确定本次构建要用的 Gradle 版本</text>

  <line x1="40" y1="168" x2="40" y2="205" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <circle cx="40" cy="222" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="40" y="227" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">3</text>
  <text x="62" y="220" font-size="14" font-weight="700" fill="#1f2b38">检查本地缓存 GRADLE_USER_HOME/wrapper/dists</text>
  <text x="62" y="239" font-size="11" fill="#5b6b7c">默认位置为用户目录下的 .gradle，缓存命中则跳过下载</text>

  <line x1="40" y1="235" x2="40" y2="272" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <circle cx="40" cy="289" r="13" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="40" y="294" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">4</text>
  <text x="62" y="287" font-size="14" font-weight="700" fill="#1f2b38">未命中则下载并解压到该目录</text>
  <text x="62" y="306" font-size="11" fill="#5b6b7c">默认从 services.gradle.org 取发行版 ZIP，内网可换成自建镜像地址</text>

  <line x1="40" y1="302" x2="40" y2="339" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <circle cx="40" cy="356" r="13" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="40" y="361" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">5</text>
  <text x="62" y="354" font-size="14" font-weight="700" fill="#1f2b38">用该版本执行构建任务</text>
  <text x="62" y="373" font-size="11" fill="#5b6b7c">开发者与 CI 使用同一版本，无需在本机预装 Gradle</text>
</svg>
