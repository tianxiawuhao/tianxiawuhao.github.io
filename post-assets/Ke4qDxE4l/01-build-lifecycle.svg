<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gradle 构建的三个阶段与任务依赖图</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Gradle 构建的三个阶段与任务依赖图</text>

  <rect x="40" y="60" width="240" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">1. 初始化</text>
  <text x="160" y="112" text-anchor="middle" font-size="12" fill="#5b6b7c">读取 settings.gradle</text>
  <text x="160" y="132" text-anchor="middle" font-size="12" fill="#5b6b7c">确定哪些项目参与构建</text>

  <rect x="330" y="60" width="240" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">2. 配置</text>
  <text x="450" y="112" text-anchor="middle" font-size="12" fill="#5b6b7c">执行各项目的 build.gradle</text>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#5b6b7c">构造任务图（DAG）</text>

  <rect x="620" y="60" width="240" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="740" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">3. 执行</text>
  <text x="740" y="112" text-anchor="middle" font-size="12" fill="#5b6b7c">按依赖顺序运行任务</text>
  <text x="740" y="132" text-anchor="middle" font-size="12" fill="#5b6b7c">只运行被选中的任务</text>

  <line x1="280" y1="105" x2="322" y2="105" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="105" x2="612" y2="105" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="175" width="820" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="205" text-anchor="middle" font-size="13" fill="#1f2b38">任务（Task）= 动作 Action + 输入 Input + 输出 Output，任务之间用依赖关系连成有向无环图</text>

  <text x="40" y="255" font-size="13" font-weight="700" fill="#1f2b38">示例：build 的任务依赖链（配置阶段生成，执行阶段按序运行）</text>

  <rect x="40" y="290" width="150" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="320" text-anchor="middle" font-size="12" fill="#1f2b38">compileJava</text>
  <rect x="40" y="350" width="150" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="380" text-anchor="middle" font-size="12" fill="#1f2b38">processResources</text>

  <rect x="250" y="320" width="140" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#1f2b38">classes</text>

  <rect x="460" y="290" width="130" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="525" y="320" text-anchor="middle" font-size="12" fill="#1f2b38">test</text>
  <rect x="460" y="350" width="130" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="525" y="380" text-anchor="middle" font-size="12" fill="#1f2b38">jar</text>

  <rect x="670" y="320" width="150" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="745" y="350" text-anchor="middle" font-size="12" fill="#1f2b38">build</text>

  <line x1="190" y1="314" x2="242" y2="336" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="190" y1="374" x2="242" y2="352" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="390" y1="336" x2="452" y2="316" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="390" y1="352" x2="452" y2="372" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="590" y1="314" x2="662" y2="336" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="590" y1="374" x2="662" y2="352" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
