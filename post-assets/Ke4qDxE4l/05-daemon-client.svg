<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gradle 客户端 JVM 与守护进程的分工</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Gradle 客户端 JVM 与守护进程的分工</text>

  <rect x="40" y="55" width="300" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">命令行输入</text>
  <text x="190" y="100" text-anchor="middle" font-size="12" fill="#5b6b7c">gradle build</text>

  <line x1="190" y1="113" x2="190" y2="144" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="148" width="300" height="104" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="190" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">客户端 JVM</text>
  <text x="190" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">只处理命令行输入 / 输出</text>
  <text x="190" y="222" text-anchor="middle" font-size="12" fill="#5b6b7c">GRADLE_OPTS 影响它</text>
  <text x="190" y="242" text-anchor="middle" font-size="11" fill="#e08a1e">启动后很快退出</text>

  <line x1="342" y1="200" x2="453" y2="200" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="398" y="192" text-anchor="middle" font-size="11" fill="#5b6b7c">转发构建</text>

  <rect x="460" y="140" width="400" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Gradle 守护程序（Daemon）</text>
  <text x="660" y="192" text-anchor="middle" font-size="12" fill="#5b6b7c">长期驻留的后台进程，复用已初始化的 JVM</text>
  <text x="660" y="214" text-anchor="middle" font-size="12" fill="#5b6b7c">真正执行构建任务</text>
  <text x="660" y="236" text-anchor="middle" font-size="12" fill="#5b6b7c">org.gradle.jvmargs 影响它</text>

  <line x1="660" y1="262" x2="660" y2="286" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="288" width="820" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="319" font-size="12" fill="#5b6b7c">守护程序状态：</text>
  <rect x="160" y="300" width="86" height="28" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="203" y="319" text-anchor="middle" font-size="12" fill="#2e9e5b">IDLE 空闲</text>
  <rect x="262" y="300" width="86" height="28" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="305" y="319" text-anchor="middle" font-size="12" fill="#e08a1e">BUSY 繁忙</text>
  <rect x="364" y="300" width="110" height="28" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="419" y="319" text-anchor="middle" font-size="12" fill="#5b6b7c">STOPPED 已关闭</text>
  <text x="500" y="319" font-size="12" fill="#5b6b7c">gradle --status 查看状态，gradle --stop 关闭</text>
</svg>
