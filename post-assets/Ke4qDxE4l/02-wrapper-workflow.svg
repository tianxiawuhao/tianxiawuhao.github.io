<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gradle Wrapper 的启动流程</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Gradle Wrapper 的启动流程</text>

  <text x="40" y="82" font-size="14" font-weight="700" fill="#1f2b38">为什么需要 Wrapper</text>
  <text x="40" y="110" font-size="12" fill="#5b6b7c">· 把 Gradle 版本固化在项目里</text>
  <text x="40" y="134" font-size="12" fill="#5b6b7c">· 团队与 CI 无需手动装 Gradle</text>
  <text x="40" y="158" font-size="12" fill="#5b6b7c">· 首次运行自动下载并缓存</text>
  <text x="40" y="182" font-size="12" fill="#5b6b7c">· 换机器、换版本都可复现</text>

  <rect x="340" y="60" width="240" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="460" y="93" text-anchor="middle" font-size="13" fill="#1f2b38">① 执行 ./gradlew build</text>
  <line x1="460" y1="114" x2="460" y2="142" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="340" y="150" width="240" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="460" y="175" text-anchor="middle" font-size="13" fill="#1f2b38">② 读取 Wrapper 配置</text>
  <text x="460" y="194" text-anchor="middle" font-size="12" fill="#5b6b7c">gradle-wrapper.properties</text>
  <line x1="460" y1="204" x2="460" y2="232" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="340" y="240" width="240" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="460" y="273" text-anchor="middle" font-size="13" fill="#1f2b38">③ 检查本地缓存 dists</text>

  <line x1="460" y1="294" x2="460" y2="322" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="470" y="314" font-size="11" fill="#5b6b7c">未缓存</text>

  <rect x="340" y="330" width="240" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="460" y="363" text-anchor="middle" font-size="12" fill="#1f2b38">④ 下载 distributionUrl 并解压</text>

  <line x1="580" y1="267" x2="652" y2="267" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="590" y="259" font-size="11" fill="#5b6b7c">已缓存</text>

  <rect x="660" y="240" width="220" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="770" y="273" text-anchor="middle" font-size="12" fill="#1f2b38">④ 直接复用已解压的发行版</text>

  <line x1="460" y1="384" x2="460" y2="412" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 770 294 L 770 447 L 580 447" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="340" y="420" width="240" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="453" text-anchor="middle" font-size="13" fill="#1f2b38">⑤ 启动 Gradle 执行构建</text>

  <text x="40" y="500" font-size="11" fill="#5b6b7c">缓存目录：~/.gradle/wrapper/dists（可用 GRADLE_USER_HOME 改写存放位置）</text>
</svg>
