<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.2 L0,6.4 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.2 L0,6.4 z" fill="#2f6fd0"/>
    </marker>
    <marker id="ar-green" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.2 L0,6.4 z" fill="#2e9e5b"/>
    </marker>
  </defs>
  <rect width="900" height="570" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">切面链的构建与执行：请求下行、响应回溯</text>

  <!-- row 1: request -->
  <rect x="40" y="70" width="820" height="140" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="62" y="95" font-size="13" font-weight="700" fill="#5b6b7c">① 下行链（chain.next）：按注册顺序依次进入切面</text>

  <rect x="60" y="128" width="150" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="135" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">LogServiceAspect</text>
  <text x="135" y="171" text-anchor="middle" font-size="11" fill="#5b6b7c">before 记日志 → next()</text>

  <line x1="210" y1="156" x2="250" y2="156" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="256" y="128" width="150" height="56" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="331" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">AuthAspect</text>
  <text x="331" y="171" text-anchor="middle" font-size="11" fill="#5b6b7c">鉴权 → next()</text>

  <line x1="406" y1="156" x2="446" y2="156" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="452" y="128" width="150" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="527" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">TxAspect</text>
  <text x="527" y="171" text-anchor="middle" font-size="11" fill="#5b6b7c">开事务 → next()</text>

  <line x1="602" y1="156" x2="642" y2="156" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="648" y="128" width="192" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="744" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">ServiceAspectChainCallback</text>
  <text x="744" y="171" text-anchor="middle" font-size="11" fill="#5b6b7c">真正业务逻辑 run()</text>

  <!-- row 2: return -->
  <rect x="40" y="228" width="820" height="140" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="62" y="253" font-size="13" font-weight="700" fill="#5b6b7c">② 回溯链（栈式返回）：异常沿原路向外传播，释放逻辑写在 finally 里</text>

  <rect x="60" y="286" width="150" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="135" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">LogServiceAspect</text>
  <text x="135" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">返回 → after 记日志</text>

  <rect x="256" y="286" width="150" height="56" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="331" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">AuthAspect</text>
  <text x="331" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">返回 → 清理凭据</text>

  <rect x="452" y="286" width="150" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="527" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">TxAspect</text>
  <text x="527" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">提交 / 回滚事务</text>

  <rect x="648" y="286" width="192" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="744" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">ServiceInfo 结果对象</text>
  <text x="744" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">成功返回 / 抛出异常</text>

  <line x1="648" y1="314" x2="608" y2="314" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ar-green)"/>
  <line x1="452" y1="314" x2="412" y2="314" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ar-green)"/>
  <line x1="256" y1="314" x2="216" y2="314" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ar-green)"/>

  <!-- self state note -->
  <rect x="40" y="388" width="820" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="62" y="413" font-size="13" font-weight="700" fill="#1f2b38">③ Iterator 是链自身的状态：一条链只能消费一次</text>
  <text x="62" y="436" font-size="12" fill="#5b6b7c">ServiceAspectChain 持有 Iterator&lt;ServiceAspect&gt;，next() 一次即前进一步；同一个实例第二次 next() 会直接落到 callback，</text>
  <text x="62" y="453" font-size="12" fill="#5b6b7c">因此每次调用都应 new 一条链，切面本身则做成无状态单例（Spring 中即 singleton 的 @Aspect）。</text>

  <!-- legend -->
  <rect x="40" y="478" width="14" height="14" rx="3" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="60" y="490" font-size="11.5" fill="#5b6b7c">日志等观察型切面</text>
  <rect x="200" y="478" width="14" height="14" rx="3" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="220" y="490" font-size="11.5" fill="#5b6b7c">鉴权等前置校验切面</text>
  <rect x="370" y="478" width="14" height="14" rx="3" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="390" y="490" font-size="11.5" fill="#5b6b7c">事务等资源型切面</text>
  <rect x="540" y="478" width="14" height="14" rx="3" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="560" y="490" font-size="11.5" fill="#5b6b7c">业务回调 / 最终实现</text>

  <text x="40" y="524" font-size="12" fill="#5b6b7c">注：切面之间只能通过 ServiceInfo（或显式上下文）传递数据，链本身不保存任何请求级状态，避免并发串数据。</text>
  <text x="40" y="548" font-size="12" fill="#5b6b7c">若某个切面不再调用 chain.next()，后续切面与业务回调都不会执行 —— 这既是“短路”能力，也是最容易踩的坑。</text>
</svg>
