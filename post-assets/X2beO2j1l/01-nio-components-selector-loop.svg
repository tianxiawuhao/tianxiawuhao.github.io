<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>NIO 三大组件与 Selector 事件循环</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">NIO 三大组件与 Selector 事件循环</text>
  <rect x="40" y="55" width="300" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">单个 I/O 线程</text>
  <text x="190" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">调用 select() 阻塞等待就绪事件</text>
  <rect x="40" y="145" width="300" height="105" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="170" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Selector 多路复用器</text>
  <text x="190" y="192" font-size="11" fill="#5b6b7c" text-anchor="middle">轮询注册在它上面的所有 Channel</text>
  <text x="190" y="212" font-size="11" fill="#5b6b7c" text-anchor="middle">返回就绪的 SelectionKey 集合</text>
  <text x="190" y="232" font-size="11" fill="#2f6fd0" text-anchor="middle">ACCEPT / CONNECT / READ / WRITE</text>
  <line x1="190" y1="115" x2="190" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="340" y1="160" x2="420" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="340" y1="197" x2="420" y2="197" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="340" y1="235" x2="420" y2="270" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="420" y="75" width="220" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="530" y="99" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Channel A（连接 1）</text>
  <text x="530" y="119" font-size="11" fill="#5b6b7c" text-anchor="middle">SocketChannel</text>
  <text x="530" y="139" font-size="11" fill="#2f6fd0" text-anchor="middle">当前就绪：OP_READ</text>
  <text x="530" y="159" font-size="11" fill="#5b6b7c" text-anchor="middle">配置 configureBlocking(false)</text>
  <rect x="420" y="185" width="220" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="530" y="209" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Channel B（连接 2）</text>
  <text x="530" y="231" font-size="11" fill="#5b6b7c" text-anchor="middle">未就绪，本轮不处理</text>
  <rect x="420" y="265" width="220" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="530" y="289" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Channel C（连接 N）</text>
  <text x="530" y="311" font-size="11" fill="#5b6b7c" text-anchor="middle">未就绪，本轮不处理</text>
  <line x1="640" y1="100" x2="685" y2="100" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="640" y1="205" x2="685" y2="205" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="640" y1="285" x2="685" y2="285" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="75" width="170" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="775" y="96" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Buffer A</text>
  <text x="775" y="115" font-size="11" fill="#5b6b7c" text-anchor="middle">读写共用，需 flip</text>
  <rect x="690" y="185" width="170" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="775" y="210" font-size="12" fill="#1f2b38" text-anchor="middle">Buffer B</text>
  <rect x="690" y="265" width="170" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="775" y="290" font-size="12" fill="#1f2b38" text-anchor="middle">Buffer C</text>
  <text x="40" y="358" font-size="11" fill="#5b6b7c">一个线程 + 一个 Selector 管理 N 个连接；每个 Channel 对应一个 Buffer，只有就绪事件到达时才做真正的读写。</text>
</svg>
