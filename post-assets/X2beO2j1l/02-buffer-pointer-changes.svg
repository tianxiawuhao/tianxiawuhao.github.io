<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Buffer 三个指针在 flip/read/clear/compact/rewind 下的变化</title>
  <rect width="900" height="370" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Buffer 三个指针在 flip / read / clear / compact / rewind 下的变化</text>
  <rect x="40" y="55" width="820" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="76" font-size="12" font-weight="700" fill="#1f2b38">① 初始 / 写入状态：clear() 或构造后</text>
  <rect x="56" y="88" width="200" height="22" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="156" y="103" font-size="11" fill="#1f2b38" text-anchor="middle">写满 5 字节</text>
  <rect x="256" y="88" width="608" height="22" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="560" y="103" font-size="11" fill="#5b6b7c" text-anchor="middle">空闲空间</text>
  <text x="56" y="80" font-size="11" fill="#5b6b7c"></text>
  <text x="715" y="76" font-size="11" font-weight="700" fill="#5b6b7c">pos = 5　limit = capacity = 100</text>
  <rect x="40" y="137" width="820" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="158" font-size="12" font-weight="700" fill="#1f2b38">② flip()：limit = position，position = 0，进入读模式</text>
  <rect x="56" y="170" width="200" height="22" rx="4" fill="#2f6fd0" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="156" y="185" font-size="11" fill="#ffffff" text-anchor="middle">可读数据 5 字节</text>
  <rect x="256" y="170" width="608" height="22" rx="4" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="560" y="185" font-size="11" fill="#5b6b7c" text-anchor="middle">不再可读（limit 之后的内容不参与读写）</text>
  <text x="715" y="158" font-size="11" font-weight="700" fill="#5b6b7c">pos = 0　limit = 5</text>
  <rect x="40" y="219" width="820" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="56" y="240" font-size="12" font-weight="700" fill="#1f2b38">③ 读完 3 字节后 clear()：position = 0，limit = capacity，重新可写（旧数据未擦除但会被覆盖）</text>
  <rect x="56" y="252" width="200" height="22" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="156" y="267" font-size="11" fill="#1f2b38" text-anchor="middle">旧数据（失效）</text>
  <rect x="256" y="252" width="608" height="22" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="560" y="267" font-size="11" fill="#5b6b7c" text-anchor="middle">重新可写</text>
  <text x="715" y="240" font-size="11" font-weight="700" fill="#5b6b7c">pos = 0　limit = 100</text>
  <rect x="40" y="301" width="820" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="56" y="322" font-size="11" fill="#1f2b38">读完 3 字节后 compact()：把剩余 2 字节左移到头部，position = 2，limit = capacity，之后可以继续写入而不丢数据。</text>
  <text x="56" y="342" font-size="11" fill="#1f2b38">rewind()：position = 0，limit 不变，用于把已写入的同一份数据重读一遍；mark()/reset() 可在中途打点并回到该位置。</text>
</svg>
