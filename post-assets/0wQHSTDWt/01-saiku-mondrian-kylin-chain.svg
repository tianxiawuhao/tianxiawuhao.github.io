<svg xmlns="http://www.w3.org/2000/svg" width="900" height="448" viewBox="0 0 900 448" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="448" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Saiku → Mondrian → Kylin 查询链路</text>
  <text x="450" y="54" font-size="12" fill="#5b6b7c" text-anchor="middle">界面产出 MDX，Mondrian 翻译成 SQL，Kylin（Calcite）在 HBase 上执行</text>

  <rect x="30" y="80" width="250" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="155" y="106" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Saiku Web 前端</text>
  <text x="155" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">拖拽分析 / MDX 编辑器</text>

  <rect x="325" y="80" width="250" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="106" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Saiku Service</text>
  <text x="450" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">SaikuDatasource + olap4j</text>

  <rect x="620" y="80" width="250" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="745" y="106" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Mondrian 引擎</text>
  <text x="745" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">解析 Schema 与 MDX，生成 SQL</text>

  <line x1="282" y1="113" x2="321" y2="113" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="301" y="104" font-size="11" fill="#2f6fd0" text-anchor="middle">MDX</text>
  <line x1="577" y1="113" x2="616" y2="113" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="596" y="104" font-size="11" fill="#2f6fd0" text-anchor="middle">MDX</text>

  <polyline points="745,146 745,182 155,182 155,206" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="175" font-size="11" fill="#2f6fd0" text-anchor="middle">Mondrian 生成的 SQL</text>

  <rect x="30" y="210" width="250" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="155" y="236" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Kylin JDBC 驱动</text>
  <text x="155" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">org.apache.kylin.jdbc.Driver</text>

  <rect x="325" y="210" width="250" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="236" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Kylin 查询服务</text>
  <text x="450" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">Calcite 解析并执行 SQL</text>

  <rect x="620" y="210" width="250" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="745" y="236" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">HBase / Cube 存储</text>
  <text x="745" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">扫描 cube 数据返回结果</text>

  <line x1="282" y1="243" x2="321" y2="243" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="301" y="234" font-size="11" fill="#2f6fd0" text-anchor="middle">SQL</text>
  <line x1="577" y1="243" x2="616" y2="243" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="596" y="234" font-size="11" fill="#2f6fd0" text-anchor="middle">Scan</text>

  <rect x="30" y="300" width="840" height="126" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="48" y="324" font-size="12" font-weight="700" fill="#1f2b38">连接与认证要点</text>
  <text x="48" y="348" font-size="11" fill="#1f2b38">Saiku 数据源 location：jdbc:mondrian:Jdbc=jdbc:kylin://&lt;host&gt;:7070/&lt;project&gt;;JdbcDrivers=org.apache.kylin.jdbc.Driver</text>
  <text x="48" y="368" font-size="11" fill="#1f2b38">Catalog=mondrian:///datasources/&lt;project&gt;.&lt;cube&gt;.xml；driver=mondrian.olap4j.MondrianOlap4jDriver</text>
  <text x="48" y="388" font-size="11" fill="#1f2b38">元数据接口：/kylin/api/cubes、/kylin/api/cube_desc/{cube}、/kylin/api/model/{model}，均用 HTTP Basic 认证</text>
  <text x="48" y="408" font-size="11" fill="#5b6b7c">权限由 Kylin 判定；Saiku 侧 security.enabled=false 表示不再叠加自身 ACL 校验</text>
</svg>
