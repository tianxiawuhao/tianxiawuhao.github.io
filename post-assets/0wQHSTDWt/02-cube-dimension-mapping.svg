<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Kylin Cube 与 Mondrian Schema 的映射结构</text>
  <text x="450" y="54" font-size="12" fill="#5b6b7c" text-anchor="middle">CubeDesc / DataModelDesc 如何落到 Mondrian 的 Cube、Dimension 与 Measure</text>

  <rect x="24" y="74" width="270" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="159" y="98" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Kylin 元数据</text>
  <rect x="330" y="74" width="300" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="480" y="98" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">转换规则（SchemaUtil）</text>
  <rect x="666" y="74" width="210" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="771" y="98" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Mondrian Schema</text>
  <line x1="296" y1="92" x2="326" y2="92" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="92" x2="662" y2="92" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="118" width="852" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="40" y="142" font-size="11" fill="#1f2b38">project + cube.name</text>
  <text x="40" y="160" font-size="11" fill="#5b6b7c">（GET /kylin/api/cubes）</text>
  <text x="346" y="142" font-size="11" fill="#5b6b7c">Schema 名取 project，</text>
  <text x="346" y="160" font-size="11" fill="#5b6b7c">Cube 名取 # 后半段</text>
  <text x="682" y="142" font-size="11" fill="#1f2b38">&lt;Schema name='project'&gt;</text>
  <text x="682" y="160" font-size="11" fill="#1f2b38">&lt;Cube name='cube'&gt;</text>

  <rect x="24" y="186" width="852" height="68" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="40" y="210" font-size="11" fill="#1f2b38">DataModelDesc</text>
  <text x="40" y="228" font-size="11" fill="#5b6b7c">root_fact_table_name</text>
  <text x="346" y="210" font-size="11" fill="#5b6b7c">去掉库名前缀，作为事实表</text>
  <text x="346" y="228" font-size="11" fill="#5b6b7c">贴到 &lt;Cube&gt; 下</text>
  <text x="682" y="210" font-size="11" fill="#1f2b38">&lt;Cube&gt;&lt;Table name='FACT'/&gt;</text>

  <rect x="24" y="254" width="852" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="40" y="278" font-size="11" fill="#1f2b38">DimensionDesc</text>
  <text x="40" y="296" font-size="11" fill="#5b6b7c">(table = 事实表)</text>
  <text x="346" y="278" font-size="11" fill="#5b6b7c">退化维度：层次直接落在事实表</text>
  <text x="346" y="296" font-size="11" fill="#5b6b7c">列上，不写 foreignKey</text>
  <text x="682" y="278" font-size="11" fill="#1f2b38">&lt;Dimension name='d'&gt;</text>
  <text x="682" y="296" font-size="11" fill="#1f2b38">&lt;Level column='c'/&gt;</text>

  <rect x="24" y="322" width="852" height="68" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="40" y="346" font-size="11" fill="#1f2b38">DimensionDesc</text>
  <text x="40" y="364" font-size="11" fill="#5b6b7c">(table = 维表)</text>
  <text x="346" y="346" font-size="11" fill="#5b6b7c">普通维度：写 foreignKey，并在</text>
  <text x="346" y="364" font-size="11" fill="#5b6b7c">层次内用 &lt;Table&gt; 指向维表</text>
  <text x="682" y="346" font-size="11" fill="#1f2b38">&lt;Dimension name='d'</text>
  <text x="682" y="364" font-size="11" fill="#1f2b38">  foreignKey='FK'&gt;</text>
  <text x="682" y="382" font-size="11" fill="#1f2b38">&lt;Table name='DIM'/&gt;</text>

  <rect x="24" y="390" width="852" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="40" y="414" font-size="11" fill="#1f2b38">DimensionDesc.derived[]</text>
  <text x="346" y="414" font-size="11" fill="#5b6b7c">派生维度：维表多列合成一个层次</text>
  <text x="682" y="414" font-size="11" fill="#1f2b38">&lt;Level column='c1'/&gt;</text>
  <text x="682" y="432" font-size="11" fill="#1f2b38">&lt;Level column='c2'/&gt;</text>

  <rect x="24" y="458" width="852" height="68" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="40" y="482" font-size="11" fill="#1f2b38">MeasureDesc.function</text>
  <text x="40" y="500" font-size="11" fill="#5b6b7c">(expression + parameter)</text>
  <text x="346" y="482" font-size="11" fill="#5b6b7c">count_distinct → distinct-count；</text>
  <text x="346" y="500" font-size="11" fill="#5b6b7c">parameter 为 1 时用 rowkey 首列</text>
  <text x="682" y="482" font-size="11" fill="#1f2b38">&lt;Measure aggregator='sum'</text>
  <text x="682" y="500" font-size="11" fill="#1f2b38">  column='c' name='n'/&gt;</text>

  <rect x="24" y="546" width="852" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="40" y="568" font-size="11" fill="#1f2b38">Mondrian 3.0：&lt;Dimension&gt;/&lt;Hierarchy&gt;/&lt;Level column&gt; 与 &lt;Measure aggregator&gt;</text>
  <text x="40" y="586" font-size="11" fill="#1f2b38">Mondrian 4.0：PhysicalSchema(Table/Key/Link) + Dimension(Attribute/Level attribute) + MeasureGroup/DimensionLinks</text>
</svg>
