<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>拦截器执行顺序图：preHandle 正序进入，postHandle 与 afterCompletion 逆序返回，preHandle 返回 false 时流程终止</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">拦截器链：先进后出，一处 false 就地终止</text>

  <rect x="30" y="58" width="840" height="142" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="48" y="80" font-size="12" font-weight="700" fill="#2f6fd0">正常放行：preHandle 正序进入，postHandle / afterCompletion 逆序返回</text>
  <rect x="50" y="92" width="150" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">拦截器 1</text>
  <text x="125" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">preHandle → true</text>
  <rect x="270" y="92" width="150" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="345" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">拦截器 2</text>
  <text x="345" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">preHandle → true</text>
  <rect x="490" y="92" width="150" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="565" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">拦截器 3</text>
  <text x="565" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">preHandle → true</text>
  <rect x="710" y="92" width="140" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="780" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Handler 方法</text>
  <text x="780" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">参数绑定后执行</text>
  <line x1="200" y1="119" x2="264" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="420" y1="119" x2="484" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="640" y1="119" x2="704" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="780" y1="178" x2="60" y2="178" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="170" text-anchor="middle" font-size="11.5" fill="#1f2b38">postHandle / afterCompletion 逆序：③ → ② → ①，像进出门一样先进后出</text>

  <rect x="30" y="224" width="840" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="48" y="246" font-size="12" font-weight="700" fill="#e08a1e">某个 preHandle 返回 false：后面的拦截器与 Handler 都不执行</text>
  <rect x="50" y="258" width="150" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="125" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">拦截器 1</text>
  <text x="125" y="298" text-anchor="middle" font-size="11" fill="#2e9e5b">已放行，afterCompletion 仍执行</text>
  <rect x="270" y="258" width="150" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="345" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">拦截器 2</text>
  <text x="345" y="298" text-anchor="middle" font-size="11" fill="#e08a1e">preHandle → false</text>
  <rect x="490" y="258" width="150" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="565" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">拦截器 3</text>
  <text x="565" y="298" text-anchor="middle" font-size="11" fill="#5b6b7c">不执行</text>
  <rect x="710" y="258" width="140" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="780" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">Handler 方法</text>
  <text x="780" y="298" text-anchor="middle" font-size="11" fill="#5b6b7c">不执行</text>
  <line x1="200" y1="285" x2="264" y2="285" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="262" y1="252" x2="262" y2="318" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="450" y="332" text-anchor="middle" font-size="11.5" fill="#5b6b7c">注意：postHandle 不会执行，而已放行的拦截器仍会逆序执行 afterCompletion</text>

  <text x="450" y="374" text-anchor="middle" font-size="11.5" fill="#1f2b38">Filter 由 Servlet 容器管理、只认 URL；Interceptor 由 Spring 容器管理、作用在 Handler 上，能读写 model</text>
</svg>
