<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring MVC 请求处理链路图：DispatcherServlet 经 HandlerMapping、拦截器、HandlerAdapter、ViewResolver 完成一次请求</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一个请求的六步旅程：五个角色的分工</text>

  <rect x="40" y="60" width="150" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">DispatcherServlet</text>
  <rect x="230" y="60" width="440" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">① 前端控制器接收请求</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#5b6b7c">只注册一个 Servlet，所有请求先到它手里</text>
  <line x1="450" y1="106" x2="450" y2="118" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="122" width="150" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">HandlerMapping</text>
  <text x="115" y="168" text-anchor="middle" font-size="11" fill="#5b6b7c">负责「找」</text>
  <rect x="230" y="122" width="440" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">② 按 URL 查找能处理它的 Handler</text>
  <text x="450" y="164" text-anchor="middle" font-size="11" fill="#1f2b38">返回 HandlerExecutionChain = Handler + 一组拦截器</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#5b6b7c">拦截器是跟着 Handler 一起返回的</text>
  <line x1="450" y1="186" x2="450" y2="198" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="202" width="150" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Interceptor</text>
  <text x="115" y="242" text-anchor="middle" font-size="11" fill="#5b6b7c">前后插逻辑</text>
  <rect x="230" y="202" width="440" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">③ 依次调用拦截器的 preHandle</text>
  <text x="450" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">任一返回 false：后面的拦截器与 Handler 都不执行</text>
  <line x1="450" y1="254" x2="450" y2="266" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="272" width="150" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">HandlerAdapter</text>
  <text x="115" y="312" text-anchor="middle" font-size="11" fill="#5b6b7c">负责「调」</text>
  <rect x="230" y="272" width="440" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">④ 适配并真正调用 Handler 方法</text>
  <text x="450" y="314" text-anchor="middle" font-size="11" fill="#5b6b7c">参数绑定在此发生：@RequestParam / @PathVariable / POJO</text>
  <line x1="450" y1="324" x2="450" y2="336" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="342" width="150" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">ViewResolver</text>
  <text x="115" y="382" text-anchor="middle" font-size="11" fill="#5b6b7c">负责「渲染」</text>
  <rect x="230" y="342" width="440" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">⑤ 把逻辑视图名解析成真实视图</text>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#5b6b7c">prefix + viewName + suffix → /WEB-INF/views/hello.jsp</text>
  <line x1="450" y1="394" x2="450" y2="406" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="412" width="150" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">响应与收尾</text>
  <text x="115" y="454" text-anchor="middle" font-size="11" fill="#5b6b7c">拦截器逆序执行</text>
  <rect x="230" y="412" width="440" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">⑥ 渲染视图并写回响应</text>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#1f2b38">最后逆序执行 postHandle 与 afterCompletion</text>

  <path d="M 700 441 L 700 83 L 678 83" fill="none" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="712" y="262" font-size="11" fill="#5b6b7c">响应写回</text>
</svg>
