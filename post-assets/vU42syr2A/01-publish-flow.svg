<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>发布 JAR 包到 Maven 中央仓库的五个步骤</title>
  <rect width="900" height="260" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">发布 JAR 包到 Maven 中央仓库的五个步骤</text>
  <rect x="35" y="80" width="150" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="110" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">① 创建工单</text>
  <text x="110" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">申请 groupId 与仓库</text>
  <rect x="205" y="80" width="150" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="280" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">② 配置 pom.xml</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">补齐 licenses 与 SCM</text>
  <rect x="375" y="80" width="150" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">③ 配置 GPG 密钥</text>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">生成密钥并上传公钥</text>
  <rect x="545" y="80" width="150" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="620" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">④ mvn deploy</text>
  <text x="620" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">构件上传到 OSS</text>
  <rect x="715" y="80" width="150" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="790" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">⑤ Close → Release</text>
  <text x="790" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">同步到中央仓库</text>
  <line x1="187" y1="116" x2="203" y2="116" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="357" y1="116" x2="373" y2="116" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="527" y1="116" x2="543" y2="116" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="697" y1="116" x2="713" y2="116" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="35" y="182" width="830" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="204" text-anchor="middle" font-size="12" fill="#1f2b38">关键：settings.xml 中 server 的 id，必须与 pom 中 distributionManagement 的仓库 id</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#1f2b38">以及 nexus-staging-maven-plugin 的 serverId 完全一致（本文统一为 ossrh）</text>
</svg>
