<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>GPG 签名与公钥验签的流转过程</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">GPG 签名：构件来源如何被验证</text>
  <rect x="40" y="90" width="230" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="155" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">① 本地私钥签名</text>
  <text x="155" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">生成 jar.asc 签名文件</text>
  <rect x="335" y="90" width="230" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">② 上传到中央仓库</text>
  <text x="450" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">jar、pom 与 .asc 一起发布</text>
  <rect x="630" y="90" width="230" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="745" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">③ 使用者公钥验签</text>
  <text x="745" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">确认构件未被篡改</text>
  <line x1="272" y1="122" x2="333" y2="122" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="567" y1="122" x2="628" y2="122" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="335" y="232" width="230" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">公钥服务器 keyserver</text>
  <text x="450" y="276" text-anchor="middle" font-size="11" fill="#5b6b7c">公开存放发布者的公钥</text>
  <path d="M 155 154 V 260 H 333" fill="none" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 567 260 H 745 V 156" fill="none" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="170" y="252" font-size="11" fill="#5b6b7c">上传公钥</text>
  <text x="610" y="252" font-size="11" fill="#5b6b7c">获取公钥</text>
</svg>
