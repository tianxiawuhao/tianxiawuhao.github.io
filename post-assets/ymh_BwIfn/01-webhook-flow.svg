<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>GitLab 提交代码自动触发 Jenkins 构建的流程</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">GitLab 提交代码自动触发 Jenkins 构建的流程</text>
  <rect x="40" y="110" width="180" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="130" y="152" text-anchor="middle" font-size="13" fill="#1f2b38">开发者</text>
  <text x="130" y="178" text-anchor="middle" font-size="11" fill="#5b6b7c">push 代码到 GitLab</text>
  <rect x="250" y="110" width="180" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="152" text-anchor="middle" font-size="13" fill="#1f2b38">GitLab 仓库</text>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#5b6b7c">Webhook：URL + Token</text>
  <rect x="460" y="110" width="180" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="550" y="152" text-anchor="middle" font-size="13" fill="#1f2b38">Jenkins</text>
  <text x="550" y="178" text-anchor="middle" font-size="11" fill="#5b6b7c">GitLab 插件接收请求</text>
  <rect x="670" y="110" width="180" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="760" y="152" text-anchor="middle" font-size="13" fill="#1f2b38">触发构建</text>
  <text x="760" y="178" text-anchor="middle" font-size="11" fill="#5b6b7c">构建历史中出现新构建</text>
  <line x1="220" y1="165" x2="248" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="430" y1="165" x2="458" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="640" y1="165" x2="668" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 760 220 L 760 262 L 340 262 L 340 228" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="550" y="254" text-anchor="middle" font-size="11" fill="#5b6b7c">构建状态回写到 GitLab</text>
  <text x="450" y="295" text-anchor="middle" font-size="11" fill="#5b6b7c">Webhook 返回 HTTP 200，表示 Jenkins 已收到触发请求</text>
</svg>
