<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>BASE 三要素与最终一致性的五类变种</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">BASE 三要素与最终一致性的五类变种</text>
  <rect x="30" y="55" width="260" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">基本可用</text>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#5b6b7c">Basically Available</text>
  <rect x="320" y="55" width="260" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">软状态</text>
  <text x="450" y="100" text-anchor="middle" font-size="11" fill="#5b6b7c">Soft state</text>
  <rect x="610" y="55" width="260" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="740" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">最终一致性</text>
  <text x="740" y="100" text-anchor="middle" font-size="11" fill="#5b6b7c">Eventually Consistent</text>
  <line x1="450" y1="122" x2="450" y2="150" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="20" y="162" width="160" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="100" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">因果一致性</text>
  <text x="100" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">依赖因果序</text>
  <rect x="195" y="162" width="160" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">读己之所写</text>
  <text x="275" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">自己写自己读</text>
  <rect x="370" y="162" width="160" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">会话一致性</text>
  <text x="450" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">限定同一会话</text>
  <rect x="545" y="162" width="160" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="625" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">单调读一致性</text>
  <text x="625" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">不返回更旧值</text>
  <rect x="720" y="162" width="160" height="68" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="800" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">单调写一致性</text>
  <text x="800" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">写操作按序执行</text>
  <text x="450" y="258" text-anchor="middle" font-size="12.5" fill="#5b6b7c">工程实现：同步复制保证强一致，异步复制走向最终一致</text>
  <rect x="30" y="276" width="390" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">同步复制 · 强一致</text>
  <text x="225" y="324" text-anchor="middle" font-size="11.5" fill="#5b6b7c">复制是更新事务的一部分，提交即一致</text>
  <text x="225" y="346" text-anchor="middle" font-size="11.5" fill="#5b6b7c">主备数据始终相同</text>
  <rect x="480" y="276" width="390" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="675" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">异步复制 · 最终一致</text>
  <text x="675" y="324" text-anchor="middle" font-size="11.5" fill="#5b6b7c">备库有延时，可能读到旧值</text>
  <text x="675" y="346" text-anchor="middle" font-size="11.5" fill="#5b6b7c">重试或数据订正后最终达到一致</text>
  <line x1="424" y1="316" x2="476" y2="316" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
