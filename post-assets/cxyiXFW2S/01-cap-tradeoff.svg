<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>CAP 三者不可兼得与 CA、CP、AP 三类取舍</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">CAP 三者不可兼得与三类取舍</text>
  <rect x="30" y="55" width="380" height="320" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="220" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">三选二：只能保住两个顶点</text>
  <line x1="220" y1="105" x2="105" y2="290" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="220" y1="105" x2="335" y2="290" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="105" y1="290" x2="335" y2="290" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="220" cy="105" r="22" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="220" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">C</text>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#5b6b7c">一致性 Consistency</text>
  <circle cx="105" cy="290" r="22" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="105" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">A</text>
  <text x="105" y="336" text-anchor="middle" font-size="12" fill="#5b6b7c">可用性</text>
  <circle cx="335" cy="290" r="22" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="335" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">P</text>
  <text x="335" y="336" text-anchor="middle" font-size="12" fill="#5b6b7c">分区容错性</text>
  <rect x="144" y="176" width="48" height="24" rx="8" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="168" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">CA</text>
  <rect x="248" y="176" width="48" height="24" rx="8" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="272" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">CP</text>
  <rect x="196" y="278" width="48" height="24" rx="8" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="220" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">AP</text>
  <rect x="455" y="55" width="415" height="320" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="662" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">三类取舍与代表系统</text>
  <rect x="475" y="96" width="375" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="497" y="122" font-size="13" font-weight="700" fill="#1f2b38">CA · 放弃 P</text>
  <text x="497" y="144" font-size="11.5" fill="#5b6b7c">强一致 + 高可用，不允许分区</text>
  <text x="497" y="162" font-size="11.5" fill="#5b6b7c">单机关系型数据库：Oracle / MySQL</text>
  <rect x="475" y="188" width="375" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="497" y="214" font-size="13" font-weight="700" fill="#1f2b38">CP · 放弃 A</text>
  <text x="497" y="236" font-size="11.5" fill="#5b6b7c">优先保证一致性，分区时可能拒绝服务</text>
  <text x="497" y="254" font-size="11.5" fill="#5b6b7c">Redis、HBase、ZooKeeper</text>
  <rect x="475" y="280" width="375" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="497" y="306" font-size="13" font-weight="700" fill="#1f2b38">AP · 放弃 C</text>
  <text x="497" y="328" font-size="11.5" fill="#5b6b7c">优先保证可用性，容忍数据暂时不一致</text>
  <text x="497" y="346" font-size="11.5" fill="#5b6b7c">电商抢购 / 秒杀、Cassandra</text>
</svg>
