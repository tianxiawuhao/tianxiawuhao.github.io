<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>DQN 的 TD 学习回路：DQN 给出预测 q，目标网络给出 TD 目标 y，用两者之差做梯度下降，并定期把参数同步给目标网络</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9e5b"/></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/></marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">DQN：用 TD 学习逼近最优动作价值函数 Q*</text>
  <rect x="60" y="70" width="250" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="185" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">DQN：Q(s, a; w)</text>
  <text x="185" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">输入状态 s，输出每个动作的 Q 值</text>
  <text x="185" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">决策：a = argmax Q(s, a; w)</text>
  <text x="185" y="156" text-anchor="middle" font-size="11" fill="#2e9e5b">预测 q = Q(s, a; w)</text>
  <rect x="580" y="70" width="260" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="710" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">损失与梯度下降</text>
  <text x="710" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">L(w) = ½·(q − y)²，δ = q − y</text>
  <text x="710" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">∂L/∂w = δ · ∂Q(s, a; w)/∂w</text>
  <text x="710" y="156" text-anchor="middle" font-size="11" fill="#e08a1e">w ← w − α · δ · ∂Q/∂w</text>
  <rect x="60" y="210" width="250" height="96" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="185" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">经验回放 Replay Buffer</text>
  <text x="185" y="258" text-anchor="middle" font-size="11" fill="#5b6b7c">存放交互得到的 (s, a, r, s′)</text>
  <text x="185" y="278" text-anchor="middle" font-size="11" fill="#5b6b7c">随机采样一批，打破样本相关性</text>
  <text x="185" y="296" text-anchor="middle" font-size="11" fill="#5b6b7c">因为目标是 max，旧数据也能用</text>
  <rect x="580" y="210" width="260" height="96" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="710" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">目标网络：Q(s, a; w⁻)</text>
  <text x="710" y="258" text-anchor="middle" font-size="11" fill="#5b6b7c">TD 目标 y = r + γ · max Q(s′, a; w⁻)</text>
  <text x="710" y="278" text-anchor="middle" font-size="11" fill="#5b6b7c">参数冻结，只提供稳定的 y</text>
  <text x="710" y="296" text-anchor="middle" font-size="11" fill="#2f6fd0">每 C 步同步一次：w⁻ ← w</text>
  <line x1="312" y1="104" x2="576" y2="104" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ahg)"/>
  <text x="444" y="96" text-anchor="middle" font-size="11" fill="#2e9e5b">预测 q</text>
  <line x1="576" y1="142" x2="316" y2="142" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#aho)"/>
  <text x="444" y="160" text-anchor="middle" font-size="11" fill="#e08a1e">梯度下降更新 w</text>
  <line x1="185" y1="208" x2="185" y2="170" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="185" y="190" text-anchor="middle" font-size="11" fill="#5b6b7c">取样本</text>
  <line x1="312" y1="258" x2="576" y2="258" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="444" y="250" text-anchor="middle" font-size="11" fill="#5b6b7c">把 s′ 送入目标网络</text>
  <line x1="710" y1="208" x2="710" y2="170" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahb)"/>
  <text x="782" y="192" text-anchor="middle" font-size="11" fill="#2f6fd0">TD 目标 y</text>
  <rect x="40" y="330" width="820" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="356" font-size="11" fill="#1f2b38">① TD 目标 y = r + γ·max Q(s′, a; w⁻)：max 让目标与行为策略无关，所以可以用旧数据（off-policy）</text>
  <text x="60" y="380" font-size="11" fill="#1f2b38">② 目标网络冻结一段时间，避免「用正在移动的 y 去追正在移动的 q」造成的震荡与发散</text>
  <text x="60" y="404" font-size="11" fill="#1f2b38">③ 这正是最优贝尔曼方程 Q*(s,a) = E[ r + γ·max Q*(s′, a) ] 的样本形式</text>
</svg>
