<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>EventTime 滑动窗口的重叠关系与 Watermark 触发 TopN 计算的时机</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/></marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">EventTime 滑动窗口与 Watermark 触发</text>

  <rect x="90" y="64" width="665" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="422" y="87" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">窗口 [09:00, 10:00)</text>

  <rect x="145" y="112" width="665" height="36" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="477" y="135" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">窗口 [09:05, 10:05)</text>

  <line x1="90" y1="100" x2="90" y2="190" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="145" y1="148" x2="145" y2="190" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="755" y1="100" x2="755" y2="190" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="810" y1="148" x2="810" y2="190" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="5 4"/>

  <line x1="70" y1="190" x2="840" y2="190" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="90" y1="184" x2="90" y2="196" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="145" y1="184" x2="145" y2="196" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="755" y1="184" x2="755" y2="196" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="810" y1="184" x2="810" y2="196" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="90" y="212" font-size="11" fill="#5b6b7c" text-anchor="end">09:00</text>
  <text x="145" y="212" font-size="11" fill="#5b6b7c" text-anchor="start">09:05</text>
  <text x="755" y="212" font-size="11" fill="#5b6b7c" text-anchor="end">10:00</text>
  <text x="810" y="212" font-size="11" fill="#5b6b7c" text-anchor="start">10:05</text>

  <circle cx="422" cy="190" r="4" fill="#2f6fd0"/>
  <circle cx="644" cy="190" r="4" fill="#2f6fd0"/>
  <circle cx="744" cy="190" r="4" fill="#2f6fd0"/>
  <text x="70" y="234" font-size="11" fill="#5b6b7c">时间轴上的圆点：按 EventTime 落在窗口内的点击事件；Watermark 随事件时间戳单调递增</text>

  <line x1="755" y1="200" x2="755" y2="240" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah2)"/>

  <rect x="30" y="246" width="840" height="74" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="52" y="270" font-size="12" fill="#1f2b38">1) Watermark 由 AscendingTimestampExtractor 生成：数据单调递增时 Watermark 即当前最大事件时间</text>
  <text x="52" y="292" font-size="12" fill="#1f2b38">2) Watermark 推进到 windowEnd+1（10:00:00.001）时，注册的 EventTime 定时器触发 onTimer()</text>
  <text x="52" y="314" font-size="12" fill="#1f2b38">3) onTimer() 取出 ListState 中该窗口的全部商品点击量，排序后输出点击量前 3 名</text>
</svg>
