<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>实时热门商品作业的数据流拓扑：数据源、过滤、滑动窗口聚合、TopN 计算与输出</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">实时热门商品作业的数据流</text>

  <rect x="30" y="80" width="152" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="106" y="114" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">数据源</text>
  <text x="106" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">CSV 文件 / Kafka</text>

  <rect x="202" y="80" width="152" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="278" y="114" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">过滤点击行为</text>
  <text x="278" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">behavior = pv</text>

  <rect x="374" y="80" width="152" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="114" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">滑动窗口聚合</text>
  <text x="450" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">1h 窗口 / 5min 滑动</text>

  <rect x="546" y="80" width="152" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="622" y="114" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">TopN 计算</text>
  <text x="622" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">keyBy(windowEnd)</text>

  <rect x="718" y="80" width="152" height="92" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="794" y="114" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">输出</text>
  <text x="794" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">print / Kafka / ES</text>

  <line x1="183" y1="126" x2="200" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="126" x2="372" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="527" y1="126" x2="544" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="699" y1="126" x2="716" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="200" width="840" height="92" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="226" font-size="12" fill="#1f2b38">1) 数据源用 PojoCsvInputFormat 读取 CSV，生产环境换成 FlinkKafkaConsumer</text>
  <text x="52" y="252" font-size="12" fill="#1f2b38">2) 窗口用 aggregate(CountAgg, WindowResultFunction) 增量聚合，比 apply() 更省状态</text>
  <text x="52" y="278" font-size="12" fill="#1f2b38">3) TopN 用 KeyedProcessFunction + ListState，靠 windowEnd+1 的 EventTime 定时器触发</text>
</svg>
