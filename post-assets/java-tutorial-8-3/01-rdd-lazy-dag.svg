<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spark 惰性求值：Transformation 只记血缘，Action 才提交作业</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">惰性求值：Transformation 记血缘，Action 触发作业</text>

  <!-- driver -->
  <rect x="30" y="60" width="110" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="85" y="82" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Driver</text>
  <text x="85" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">SparkContext</text>

  <!-- operator chain -->
  <rect x="160" y="60" width="86" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="203" y="82" font-size="11" fill="#1f2b38" text-anchor="middle">textFile</text>
  <text x="203" y="99" font-size="10" fill="#5b6b7c" text-anchor="middle">2 分区</text>
  <rect x="262" y="60" width="86" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="305" y="82" font-size="11" fill="#1f2b38" text-anchor="middle">flatMap</text>
  <text x="305" y="99" font-size="10" fill="#5b6b7c" text-anchor="middle">窄依赖</text>
  <rect x="364" y="60" width="86" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="407" y="82" font-size="11" fill="#1f2b38" text-anchor="middle">filter</text>
  <text x="407" y="99" font-size="10" fill="#5b6b7c" text-anchor="middle">窄依赖</text>
  <rect x="466" y="60" width="86" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="509" y="82" font-size="11" fill="#1f2b38" text-anchor="middle">mapToPair</text>
  <text x="509" y="99" font-size="10" fill="#5b6b7c" text-anchor="middle">窄依赖</text>
  <rect x="568" y="60" width="130" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="633" y="82" font-size="11" font-weight="700" fill="#1f2b38" text-anchor="middle">reduceByKey</text>
  <text x="633" y="99" font-size="10" fill="#e08a1e" text-anchor="middle">宽依赖 · 产生 Shuffle</text>

  <line x1="140" y1="86" x2="154" y2="86" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="246" y1="86" x2="256" y2="86" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="348" y1="86" x2="358" y2="86" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="86" x2="460" y2="86" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="552" y1="86" x2="562" y2="86" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="380" y="138" font-size="11" fill="#2f6fd0" text-anchor="middle">这一段只是记录血缘（lineage），不会立刻计算，也不产生任何 Job</text>

  <line x1="450" y1="148" x2="450" y2="176" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="466" y="170" font-size="11" fill="#e08a1e">遇到 Action 才提交作业</text>

  <!-- actions -->
  <rect x="560" y="180" width="150" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="635" y="202" font-size="11" font-weight="700" fill="#1f2b38" text-anchor="middle">saveAsTextFile</text>
  <text x="635" y="219" font-size="10" fill="#5b6b7c" text-anchor="middle">Action：写外部存储</text>
  <rect x="730" y="180" width="140" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="800" y="202" font-size="11" font-weight="700" fill="#1f2b38" text-anchor="middle">count / collect</text>
  <text x="800" y="219" font-size="10" fill="#5b6b7c" text-anchor="middle">Action：结果回 Driver</text>
  <line x1="633" y1="112" x2="633" y2="174" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="700" y1="206" x2="724" y2="206" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- stages -->
  <rect x="30" y="252" width="340" height="152" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="200" y="278" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Stage 1（窄依赖流水线）</text>
  <rect x="55" y="296" width="140" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="318" font-size="11" fill="#1f2b38" text-anchor="middle">Task 0 · 分区 0</text>
  <rect x="205" y="296" width="140" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="275" y="318" font-size="11" fill="#1f2b38" text-anchor="middle">Task 1 · 分区 1</text>
  <text x="200" y="352" font-size="11" fill="#5b6b7c" text-anchor="middle">多个算子合成一个 Task，先在 map 端局部聚合</text>
  <text x="200" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">一个 Job = 若干 Stage，一个 Stage = 若干 Task</text>
  <text x="200" y="396" font-size="11" fill="#5b6b7c" text-anchor="middle">Task 数 = 该 Stage 的分区数</text>

  <!-- shuffle -->
  <line x1="320" y1="303" x2="320" y2="238" stroke="#e08a1e" stroke-width="1.4"/>
  <line x1="320" y1="238" x2="392" y2="238" stroke="#e08a1e" stroke-width="1.4"/>
  <line x1="392" y1="238" x2="392" y2="296" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="402" y="228" font-size="11" font-weight="700" fill="#e08a1e">Shuffle</text>
  <text x="402" y="246" font-size="10" fill="#5b6b7c">按 key 重分发</text>
  <text x="402" y="262" font-size="10" fill="#5b6b7c">写磁盘 + fetch</text>

  <rect x="560" y="252" width="310" height="152" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="715" y="278" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Stage 2（宽依赖后）</text>
  <rect x="585" y="296" width="120" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="645" y="318" font-size="11" fill="#1f2b38" text-anchor="middle">Task 0</text>
  <rect x="725" y="296" width="120" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="785" y="318" font-size="11" fill="#1f2b38" text-anchor="middle">Task 1</text>
  <text x="715" y="352" font-size="11" fill="#5b6b7c" text-anchor="middle">reduce 端 fetch 后汇总，得到最终结果</text>
  <text x="715" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">规则：遇到宽依赖就切一刀</text>
  <text x="715" y="396" font-size="11" fill="#5b6b7c" text-anchor="middle">连续窄依赖合并进同一个 Stage</text>
</svg>
