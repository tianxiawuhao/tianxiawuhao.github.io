<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>crontab 任务行的五个时间字段与常用写法</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">crontab 任务行：五个时间字段 + 一条命令</text>

  <text x="72" y="86" text-anchor="middle" font-size="11.5" fill="#5b6b7c">分</text>
  <text x="168" y="86" text-anchor="middle" font-size="11.5" fill="#5b6b7c">时</text>
  <text x="264" y="86" text-anchor="middle" font-size="11.5" fill="#5b6b7c">日</text>
  <text x="360" y="86" text-anchor="middle" font-size="11.5" fill="#5b6b7c">月</text>
  <text x="456" y="86" text-anchor="middle" font-size="11.5" fill="#5b6b7c">周</text>
  <text x="696" y="86" text-anchor="middle" font-size="11.5" fill="#5b6b7c">要执行的命令</text>

  <rect x="30" y="95" width="84" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="72" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">0</text>

  <rect x="126" y="95" width="84" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="168" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">3</text>

  <rect x="222" y="95" width="84" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="264" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">*</text>

  <rect x="318" y="95" width="84" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="360" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">*</text>

  <rect x="414" y="95" width="84" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="456" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">*</text>

  <rect x="522" y="95" width="348" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="696" y="134" text-anchor="middle" font-size="13" fill="#1f2b38">/opt/myapp/bin/clean-logs.sh prod 7</text>

  <rect x="30" y="185" width="840" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="220" text-anchor="middle" font-size="12.5" fill="#1f2b38">取值范围：分 0-59 ｜ 时 0-23 ｜ 日 1-31 ｜ 月 1-12 ｜ 周 0-7（0 与 7 都表示周日）</text>

  <rect x="30" y="258" width="200" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="130" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">*</text>
  <text x="130" y="300" text-anchor="middle" font-size="11" fill="#5b6b7c">任意值</text>

  <rect x="243" y="258" width="200" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="343" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">1,15</text>
  <text x="343" y="300" text-anchor="middle" font-size="11" fill="#5b6b7c">列表，第 1 和第 15 分钟</text>

  <rect x="456" y="258" width="200" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="556" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">8-11</text>
  <text x="556" y="300" text-anchor="middle" font-size="11" fill="#5b6b7c">范围，8 到 11 点</text>

  <rect x="669" y="258" width="200" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="769" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">*/10</text>
  <text x="769" y="300" text-anchor="middle" font-size="11" fill="#5b6b7c">步长，每 10 分钟一次</text>

  <rect x="30" y="330" width="840" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#1f2b38">日与周是「或」关系：既写 4 号又写周一，两天都会执行；命令里的 % 要转义为 \%，否则会被当成换行</text>
</svg>
