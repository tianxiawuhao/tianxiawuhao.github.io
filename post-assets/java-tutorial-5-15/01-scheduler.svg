<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>调度框架的核心关系与调度触发链路</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">调度框架的四个角色：Job、Trigger、Scheduler、JobStore</text>

  <rect x="40" y="56" width="200" height="74" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="80" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">Job（做什么）</text>
  <text x="140" y="102" font-size="11" fill="#1f2b38" text-anchor="middle">实现 Job 接口</text>
  <text x="140" y="120" font-size="11" fill="#5b6b7c" text-anchor="middle">只写业务，不含调度信息</text>

  <rect x="350" y="56" width="200" height="74" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="80" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">Trigger（何时做）</text>
  <text x="450" y="102" font-size="11" fill="#1f2b38" text-anchor="middle">SimpleTrigger / CronTrigger</text>
  <text x="450" y="120" font-size="11" fill="#5b6b7c" text-anchor="middle">间隔重复 or cron 表达式</text>

  <rect x="660" y="56" width="200" height="74" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="760" y="80" font-size="13" fill="#2e9e5b" text-anchor="middle" font-weight="700">Scheduler（调度器）</text>
  <text x="760" y="102" font-size="11" fill="#1f2b38" text-anchor="middle">把 JobDetail 与 Trigger 绑定</text>
  <text x="760" y="120" font-size="11" fill="#5b6b7c" text-anchor="middle">start / standby / shutdown</text>

  <line x1="244" y1="93" x2="346" y2="93" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="295" y="84" font-size="10.5" fill="#5b6b7c" text-anchor="middle">绑定</text>
  <line x1="554" y1="93" x2="656" y2="93" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="605" y="84" font-size="10.5" fill="#5b6b7c" text-anchor="middle">注册</text>

  <rect x="350" y="158" width="200" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="182" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">JobStore（存哪儿）</text>
  <text x="450" y="202" font-size="11" fill="#5b6b7c" text-anchor="middle">RAMJobStore / JDBCJobStore</text>

  <line x1="450" y1="132" x2="450" y2="154" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="248" x2="450" y2="222" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="120" y="252" width="660" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="274" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">调度链路：Scheduler 线程按 Trigger 算出下次触发时间 → 触发时刻到达 → 交给线程池执行 Job</text>
  <text x="450" y="294" font-size="11.5" fill="#5b6b7c" text-anchor="middle">Job 与 Trigger 解耦，所以「同一件事按不同时间表跑」只需换 Trigger，不必改 Job 代码</text>

  <rect x="40" y="322" width="400" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="346" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">为什么不用 Timer / ScheduledExecutorService</text>
  <text x="60" y="368" font-size="11.5" fill="#5b6b7c" text-anchor="start">单线程、任务抛异常会终止后续调度、不支持 cron、任务状态不持久化，</text>
  <text x="60" y="388" font-size="11.5" fill="#5b6b7c" text-anchor="start">重启就全丢；多节点部署时会各跑一遍，造成重复执行。</text>
  <text x="60" y="410" font-size="11.5" fill="#1f2b38" text-anchor="start">单机小任务用 ScheduledExecutorService 就够；要 cron、要持久化、要集群才上框架。</text>

  <rect x="460" y="322" width="400" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="480" y="346" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">集群调度的三种实现思路</text>
  <text x="480" y="368" font-size="11.5" fill="#5b6b7c" text-anchor="start">1　数据库抢锁：触发时用「更新行数」判定是否抢到，最简单；</text>
  <text x="480" y="388" font-size="11.5" fill="#5b6b7c" text-anchor="start">2　Redis 分布式锁：SET NX PX，注意锁过期与续期；</text>
  <text x="480" y="410" font-size="11.5" fill="#5b6b7c" text-anchor="start">3　专业调度平台：XXL-JOB / ElasticJob，自带分片与失败重试</text>
</svg>
