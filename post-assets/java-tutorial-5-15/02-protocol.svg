<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四种服务端推送方案的对比与选型</title>
  <rect width="900" height="450" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">服务端推送：轮询、长轮询、SSE、WebSocket 怎么选</text>

  <text x="45" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">方案</text>
  <text x="165" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">通信方向</text>
  <text x="285" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">实时性</text>
  <text x="395" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">服务端开销</text>
  <text x="520" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">典型场景</text>
  <rect x="40" y="70" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="82" width="820" height="42" fill="#eef4ff"/>
  <text x="45" y="108" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">短轮询 Polling</text>
  <text x="165" y="108" font-size="12" fill="#1f2b38" text-anchor="start">客户端 → 服务端</text>
  <text x="285" y="108" font-size="12" fill="#e08a1e" text-anchor="start">取决于间隔</text>
  <text x="395" y="108" font-size="12" fill="#e08a1e" text-anchor="start">高（大量空请求）</text>
  <text x="520" y="108" font-size="11.5" fill="#5b6b7c" text-anchor="start">数据变化不频繁、能容忍延迟（如未读数）</text>

  <rect x="40" y="124" width="820" height="42" fill="#ffffff"/>
  <text x="45" y="150" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">长轮询 Long Polling</text>
  <text x="165" y="150" font-size="12" fill="#1f2b38" text-anchor="start">客户端 → 服务端</text>
  <text x="285" y="150" font-size="12" fill="#2e9e5b" text-anchor="start">较好（秒级）</text>
  <text x="395" y="150" font-size="12" fill="#1f2b38" text-anchor="start">中（连接长期挂起）</text>
  <text x="520" y="150" font-size="11.5" fill="#5b6b7c" text-anchor="start">兼容性要求高、消息不密集（如扫码登录）</text>

  <rect x="40" y="166" width="820" height="42" fill="#eef4ff"/>
  <text x="45" y="192" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">SSE（Server-Sent Events）</text>
  <text x="165" y="192" font-size="12" fill="#1f2b38" text-anchor="start">服务端 → 客户端（单向）</text>
  <text x="285" y="192" font-size="12" fill="#2e9e5b" text-anchor="start">好（流式）</text>
  <text x="395" y="192" font-size="12" fill="#1f2b38" text-anchor="start">低（一条 HTTP 长连接）</text>
  <text x="520" y="192" font-size="11.5" fill="#5b6b7c" text-anchor="start">只推不收：进度条、日志流、AI 逐字输出</text>

  <rect x="40" y="208" width="820" height="42" fill="#ffffff"/>
  <text x="45" y="234" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">WebSocket</text>
  <text x="165" y="234" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">全双工双向</text>
  <text x="285" y="234" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">最好（毫秒级）</text>
  <text x="395" y="234" font-size="12" fill="#1f2b38" text-anchor="start">低（升级后无 HTTP 头开销）</text>
  <text x="520" y="234" font-size="11.5" fill="#5b6b7c" text-anchor="start">IM、协同编辑、行情推送、在线游戏</text>
  <rect x="40" y="250" width="820" height="1.6" fill="#c8d3e0"/>

  <text x="40" y="278" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">WebSocket 为什么比 HTTP 轮询省</text>
  <rect x="40" y="290" width="400" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="312" font-size="11.5" fill="#5b6b7c" text-anchor="start">一次 HTTP 请求要带上几百字节到几 KB 的请求头与 Cookie；</text>
  <text x="60" y="332" font-size="11.5" fill="#5b6b7c" text-anchor="start">每秒轮询一次，1 万个在线用户就是每秒 1 万次请求。</text>
  <text x="60" y="352" font-size="11.5" fill="#1f2b38" text-anchor="start">WebSocket 只在握手时用一次 HTTP，之后是极简的帧协议。</text>

  <rect x="460" y="290" width="400" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="480" y="312" font-size="11.5" fill="#5b6b7c" text-anchor="start">握手：客户端发 GET，带 Upgrade: websocket 与 Sec-WebSocket-Key；</text>
  <text x="480" y="332" font-size="11.5" fill="#5b6b7c" text-anchor="start">服务端返回 101 Switching Protocols 与算好的 Accept 值，</text>
  <text x="480" y="352" font-size="11.5" fill="#1f2b38" text-anchor="start">连接从 HTTP 升级为 TCP 长连接，之后收发数据帧。</text>

  <rect x="40" y="372" width="820" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="394" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">选型顺序</text>
  <text x="130" y="394" font-size="11.5" fill="#1f2b38" text-anchor="start">只推不收 → SSE（实现最省，自带断线重连）；要双向交互 → WebSocket；</text>
  <text x="60" y="416" font-size="11.5" fill="#1f2b38" text-anchor="start">老浏览器或中间设备限制严格 → 长轮询兜底；消息极少变、能容忍分钟级延迟 → 短轮询最省事。</text>
</svg>
