<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>WebSocket 集群推送架构与消息可靠性设计</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">WebSocket 集群推送：连接在哪台机器上</text>

  <rect x="360" y="52" width="180" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="77" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">浏览器 / 客户端</text>
  <line x1="450" y1="92" x2="450" y2="114" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="330" y="118" width="240" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="143" font-size="12.5" fill="#1f2b38" text-anchor="middle">Nginx（需支持 Upgrade 转发）</text>

  <line x1="390" y1="158" x2="230" y2="186" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="510" y1="158" x2="670" y2="186" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="90" y="190" width="280" height="86" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="214" font-size="12.5" fill="#2f6fd0" text-anchor="middle" font-weight="700">应用节点 A</text>
  <text x="230" y="236" font-size="11.5" fill="#1f2b38" text-anchor="middle">本地 Session 表</text>
  <text x="230" y="256" font-size="11" fill="#5b6b7c" text-anchor="middle">userId → session（只能推给连在本机的用户）</text>
  <text x="230" y="272" font-size="11" fill="#e08a1e" text-anchor="middle">只推本机连接，会漏掉另一台机器上的用户</text>

  <rect x="530" y="190" width="280" height="86" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="214" font-size="12.5" fill="#2f6fd0" text-anchor="middle" font-weight="700">应用节点 B</text>
  <text x="670" y="236" font-size="11.5" fill="#1f2b38" text-anchor="middle">本地 Session 表</text>
  <text x="670" y="256" font-size="11" fill="#5b6b7c" text-anchor="middle">session 无法跨 JVM 共享，也不能序列化到 Redis</text>
  <text x="670" y="272" font-size="11" fill="#e08a1e" text-anchor="middle">所以广播必须靠一个中间件来中转</text>

  <line x1="230" y1="280" x2="230" y2="316" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="280" x2="670" y2="316" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="230" y="320" width="440" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="342" font-size="12.5" fill="#2e9e5b" text-anchor="middle" font-weight="700">Redis Pub/Sub（或 MQ 广播）</text>
  <text x="450" y="360" font-size="11" fill="#5b6b7c" text-anchor="middle">业务服务 publish 一条消息，所有节点都订阅到，各自推给本机在线用户</text>

  <rect x="40" y="382" width="400" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="404" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">三个必做的健壮性设计</text>
  <text x="60" y="426" font-size="11.5" fill="#5b6b7c" text-anchor="start">心跳：30 秒 ping/pong，清理僵尸连接（Nginx 默认 60 秒断空闲连接）</text>
  <text x="60" y="446" font-size="11.5" fill="#5b6b7c" text-anchor="start">重连：前端指数退避重连 + 重连后按最后一条消息 ID 补拉历史</text>

  <rect x="460" y="382" width="400" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="480" y="404" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">两个容易忽略的坑</text>
  <text x="480" y="426" font-size="11.5" fill="#5b6b7c" text-anchor="start">并发发送：同一 session 多线程同时 sendMessage 会抛</text>
  <text x="480" y="446" font-size="11.5" fill="#5b6b7c" text-anchor="start">IllegalStateException，需按 session 加锁或做发送队列</text>
</svg>
