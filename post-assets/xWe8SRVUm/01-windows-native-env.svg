<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Windows 下 native-image 编译所需的环境变量</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Windows 下 native-image 编译所需的环境变量</text>

  <rect x="45" y="55" width="230" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="83" font-size="12" fill="#1f2b38" text-anchor="middle">mvn -Pnative native:compile</text>
  <line x1="275" y1="78" x2="322" y2="78" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="55" width="230" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="445" y="75" font-size="12" fill="#1f2b38" text-anchor="middle">native-image</text>
  <text x="445" y="92" font-size="11" fill="#5b6b7c" text-anchor="middle">静态编译，需要本地 C 工具链</text>
  <line x1="560" y1="78" x2="607" y2="78" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="615" y="55" width="240" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="735" y="75" font-size="12" fill="#1f2b38" text-anchor="middle">cl.exe / link.exe</text>
  <text x="735" y="92" font-size="11" fill="#5b6b7c" text-anchor="middle">来自 MSVC 与 Windows SDK</text>

  <rect x="45" y="130" width="810" height="86" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="65" y="157" font-size="13" font-weight="700" fill="#2f6fd0">Path（追加 cl.exe 所在目录）</text>
  <text x="65" y="186" font-size="11.5" fill="#1f2b38">C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.35.32215\bin\Hostx64\x64</text>

  <rect x="45" y="236" width="810" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="65" y="263" font-size="13" font-weight="700" fill="#2e9e5b">INCLUDE（MSVC 与 Windows SDK 的头文件目录，分号分隔）</text>
  <text x="65" y="291" font-size="11.5" fill="#1f2b38">C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.35.32215\include;</text>
  <text x="65" y="313" font-size="11.5" fill="#1f2b38">C:\Program Files (x86)\Windows Kits\10\Include\10.0.22000.0\{shared, ucrt, um, winrt};</text>

  <rect x="45" y="352" width="810" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="65" y="379" font-size="13" font-weight="700" fill="#e08a1e">LIB（与头文件对应的库目录，分号分隔）</text>
  <text x="65" y="407" font-size="11.5" fill="#1f2b38">C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.35.32215\lib\x64;</text>
  <text x="65" y="429" font-size="11.5" fill="#1f2b38">C:\Program Files (x86)\Windows Kits\10\Lib\10.0.22000.0\{um, ucrt}\x64;</text>

  <text x="45" y="478" font-size="11.5" fill="#5b6b7c">配置后需重启命令行或 IDEA；也可直接在 x64 Native Tools Command Prompt for VS 2022 中执行编译。</text>
</svg>
