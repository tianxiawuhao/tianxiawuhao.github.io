<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Boot 3 原生镜像编译流程与启动方式对比</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring Boot 3 原生镜像编译流程与启动方式对比</text>

  <text x="45" y="68" font-size="13" font-weight="700" fill="#5b6b7c">JVM 模式（传统部署）</text>
  <rect x="45" y="80" width="165" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="127" y="103" font-size="12" fill="#1f2b38" text-anchor="middle">源码</text>
  <text x="127" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">Spring Boot 3 项目</text>
  <line x1="210" y1="106" x2="255" y2="106" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="260" y="80" width="165" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="342" y="103" font-size="12" fill="#1f2b38" text-anchor="middle">mvn package</text>
  <text x="342" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">编译为 .class / jar</text>
  <line x1="425" y1="106" x2="470" y2="106" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="475" y="80" width="165" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="557" y="103" font-size="12" fill="#1f2b38" text-anchor="middle">JVM 启动</text>
  <text x="557" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">类加载 + JIT 即时编译</text>
  <line x1="640" y1="106" x2="685" y2="106" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="80" width="165" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="772" y="103" font-size="12" fill="#1f2b38" text-anchor="middle">启动 1–2s</text>
  <text x="772" y="121" font-size="11" fill="#5b6b7c" text-anchor="middle">内存占用较高</text>

  <text x="45" y="172" font-size="13" font-weight="700" fill="#5b6b7c">Native Image（AOT 原生部署）</text>
  <rect x="45" y="186" width="165" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="127" y="209" font-size="12" fill="#1f2b38" text-anchor="middle">源码</text>
  <text x="127" y="227" font-size="11" fill="#5b6b7c" text-anchor="middle">Spring Boot 3 项目</text>
  <line x1="210" y1="212" x2="255" y2="212" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="260" y="186" width="165" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="342" y="209" font-size="12" fill="#1f2b38" text-anchor="middle">process-aot</text>
  <text x="342" y="227" font-size="11" fill="#5b6b7c" text-anchor="middle">生成 AOT 元数据</text>
  <line x1="425" y1="212" x2="470" y2="212" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="475" y="186" width="165" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="557" y="209" font-size="12" fill="#1f2b38" text-anchor="middle">native-image</text>
  <text x="557" y="227" font-size="11" fill="#5b6b7c" text-anchor="middle">静态编译进运行时</text>
  <line x1="640" y1="212" x2="685" y2="212" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="186" width="165" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="772" y="209" font-size="12" fill="#1f2b38" text-anchor="middle">本地可执行文件</text>
  <text x="772" y="227" font-size="11" fill="#5b6b7c" text-anchor="middle">启动约 0.1s</text>

  <text x="45" y="275" font-size="11.5" fill="#5b6b7c">原生可执行文件启动快、内存占用低，但构建时间长，且反射、动态代理等运行期动态特性受限。</text>
</svg>
