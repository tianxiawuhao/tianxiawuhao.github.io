<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>八大排序算法时间复杂度、空间复杂度与稳定性对照表</title>
<rect width="900" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">八大排序算法复杂度与稳定性对照表</text>
<rect x="20" y="52" width="860" height="30" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">算法</text>
<text x="212" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">平均时间</text>
<text x="355" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">最好时间</text>
<text x="495" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">最坏时间</text>
<text x="615" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">辅助空间</text>
<text x="715" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">稳定性</text>
<text x="822" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">原地</text>
<rect x="20" y="86" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="106" font-size="12.5" fill="#1f2b38" text-anchor="middle">冒泡排序</text>
<text x="212" y="106" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)</text>
<text x="355" y="106" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="495" y="106" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)</text>
<text x="615" y="106" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="715" y="106" font-size="12.5" fill="#2e9e5b" text-anchor="middle">稳定</text>
<text x="822" y="106" font-size="12.5" fill="#1f2b38" text-anchor="middle">是</text>
<rect x="20" y="120" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="140" font-size="12.5" fill="#1f2b38" text-anchor="middle">直接插入排序</text>
<text x="212" y="140" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)</text>
<text x="355" y="140" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="495" y="140" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)</text>
<text x="615" y="140" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="715" y="140" font-size="12.5" fill="#2e9e5b" text-anchor="middle">稳定</text>
<text x="822" y="140" font-size="12.5" fill="#1f2b38" text-anchor="middle">是</text>
<rect x="20" y="154" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="174" font-size="12.5" fill="#1f2b38" text-anchor="middle">希尔排序</text>
<text x="212" y="174" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n^1.3)*</text>
<text x="355" y="174" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)*</text>
<text x="495" y="174" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)*</text>
<text x="615" y="174" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="715" y="174" font-size="12.5" fill="#e08a1e" text-anchor="middle">不稳定</text>
<text x="822" y="174" font-size="12.5" fill="#1f2b38" text-anchor="middle">是</text>
<rect x="20" y="188" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="208" font-size="12.5" fill="#1f2b38" text-anchor="middle">简单选择排序</text>
<text x="212" y="208" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)</text>
<text x="355" y="208" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)</text>
<text x="495" y="208" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n²)</text>
<text x="615" y="208" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="715" y="208" font-size="12.5" fill="#e08a1e" text-anchor="middle">不稳定</text>
<text x="822" y="208" font-size="12.5" fill="#1f2b38" text-anchor="middle">是</text>
<rect x="20" y="222" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="242" font-size="12.5" fill="#1f2b38" text-anchor="middle">堆排序</text>
<text x="212" y="242" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="355" y="242" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="495" y="242" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="615" y="242" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="715" y="242" font-size="12.5" fill="#e08a1e" text-anchor="middle">不稳定</text>
<text x="822" y="242" font-size="12.5" fill="#1f2b38" text-anchor="middle">是</text>
<rect x="20" y="256" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="276" font-size="12.5" fill="#1f2b38" text-anchor="middle">快速排序</text>
<text x="212" y="276" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="355" y="276" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="495" y="276" font-size="12.5" fill="#e08a1e" text-anchor="middle">O(n²)</text>
<text x="615" y="276" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(log n)</text>
<text x="715" y="276" font-size="12.5" fill="#e08a1e" text-anchor="middle">不稳定</text>
<text x="822" y="276" font-size="12.5" fill="#1f2b38" text-anchor="middle">是</text>
<rect x="20" y="290" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="310" font-size="12.5" fill="#1f2b38" text-anchor="middle">归并排序</text>
<text x="212" y="310" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="355" y="310" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="495" y="310" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n log n)</text>
<text x="615" y="310" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="715" y="310" font-size="12.5" fill="#2e9e5b" text-anchor="middle">稳定</text>
<text x="822" y="310" font-size="12.5" fill="#5b6b7c" text-anchor="middle">否</text>
<rect x="20" y="324" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="344" font-size="12.5" fill="#1f2b38" text-anchor="middle">基数排序</text>
<text x="212" y="344" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(d(n+k))</text>
<text x="355" y="344" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(d(n+k))</text>
<text x="495" y="344" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(d(n+k))</text>
<text x="615" y="344" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n+k)</text>
<text x="715" y="344" font-size="12.5" fill="#2e9e5b" text-anchor="middle">稳定</text>
<text x="822" y="344" font-size="12.5" fill="#5b6b7c" text-anchor="middle">否</text>
<rect x="20" y="358" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="378" font-size="12.5" fill="#1f2b38" text-anchor="middle">计数排序</text>
<text x="212" y="378" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n+k)</text>
<text x="355" y="378" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n+k)</text>
<text x="495" y="378" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n+k)</text>
<text x="615" y="378" font-size="12.5" fill="#1f2b38" text-anchor="middle">O(n+k)</text>
<text x="715" y="378" font-size="12.5" fill="#2e9e5b" text-anchor="middle">稳定</text>
<text x="822" y="378" font-size="12.5" fill="#5b6b7c" text-anchor="middle">否</text>
<text x="20" y="410" font-size="11" fill="#5b6b7c">n：元素个数　k：桶/计数区间大小　d：最大数的位数　* 希尔排序的复杂度与增量序列有关（Hibbard 约 O(n^1.5)，Sedgewick 平均约 O(n^1.3)）</text>
<text x="20" y="430" font-size="11" fill="#5b6b7c">稳定性：相等元素排序前后相对次序不变；原地：额外辅助空间为 O(1)。计数排序可看作基数排序 d = 1 的特例。</text>
</svg>
