<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MyBatis 两级缓存的取数顺序与 Cache 装饰器链</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">MyBatis 两级缓存：取数顺序与装饰器链</text>

  <text x="60" y="64" font-size="12" font-weight="700" fill="#5b6b7c">一次查询的取数顺序</text>
  <rect x="60" y="74" width="330" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="103" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Mapper 查询（同一 statementId）</text>

  <line x1="225" y1="122" x2="225" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="148" width="330" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="172" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">CachingExecutor：二级缓存</text>
  <text x="225" y="191" font-size="11" fill="#5b6b7c" text-anchor="middle">namespace 级 · 提交或回滚后才写入</text>

  <line x1="225" y1="206" x2="225" y2="230" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="232" width="330" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="225" y="256" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">BaseExecutor：一级缓存</text>
  <text x="225" y="275" font-size="11" fill="#5b6b7c" text-anchor="middle">SqlSession 级 · 增删改执行即清空</text>

  <line x1="225" y1="290" x2="225" y2="314" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="316" width="330" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="225" y="344" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">数据库</text>

  <rect x="470" y="74" width="390" height="286" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="98" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Cache 装饰器（自外向内）</text>
  <rect x="490" y="114" width="350" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="141" font-size="12" fill="#1f2b38" text-anchor="middle">LoggingCache 日志记录</text>
  <rect x="510" y="170" width="310" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="197" font-size="12" fill="#1f2b38" text-anchor="middle">LruCache 回收策略</text>
  <rect x="530" y="226" width="270" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="253" font-size="12" fill="#1f2b38" text-anchor="middle">ScheduledCache 定时刷新</text>
  <rect x="550" y="282" width="230" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="309" font-size="12" fill="#1f2b38" text-anchor="middle">PerpetualCache（HashMap）</text>
  <text x="665" y="348" font-size="11" fill="#5b6b7c" text-anchor="middle">包多少层，最里层都是它</text>
</svg>
