<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>SSM 整合的分层职责与 dao 层配置三件套</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">SSM 整合：分层职责与 dao 层配置三件套</text>

  <rect x="60" y="58" width="780" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">SpringMVC · web 层</text>
  <text x="450" y="98" font-size="11" fill="#5b6b7c" text-anchor="middle">@Controller / @RestController：参数绑定、校验、返回 JSON</text>

  <line x1="450" y1="112" x2="450" y2="136" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="138" width="780" height="54" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="160" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring · Service 层与事务</text>
  <text x="450" y="178" font-size="11" fill="#5b6b7c" text-anchor="middle">@Service、DataSourceTransactionManager、@Transactional</text>

  <line x1="450" y1="192" x2="450" y2="216" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="218" width="780" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="240" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">MyBatis · 持久层</text>
  <text x="450" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">Mapper 接口 + XML 映射、PageHelper 插件、二级缓存（由 mybatis-spring 桥接）</text>

  <line x1="450" y1="272" x2="450" y2="296" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="298" width="780" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="319" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">数据库</text>
  <text x="450" y="337" font-size="11" fill="#5b6b7c" text-anchor="middle">Druid 数据源：连接池 + JDBC 驱动</text>

  <text x="450" y="375" font-size="12" fill="#5b6b7c" text-anchor="middle">dao 配置三件套：dataSource → SqlSessionFactoryBean → MapperScannerConfigurer，Service 只 @Autowired 接口</text>
</svg>
