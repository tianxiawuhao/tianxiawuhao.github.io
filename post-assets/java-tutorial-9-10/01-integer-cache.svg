<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>包装类缓存池范围与 == 比较的判定过程</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">包装类缓存池：自动装箱复用对象，== 比的却是引用</text>
  <text x="40" y="56" font-size="12" font-weight="700" fill="#1f2b38">各包装类的缓存范围</text>
  <text x="470" y="56" font-size="12" font-weight="700" fill="#1f2b38">一次自动装箱的判定过程</text>

  <rect x="40" y="68" width="390" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="58" y="96" font-size="12" font-weight="700" fill="#1f2b38">Boolean</text>
  <text x="190" y="96" font-size="11" fill="#5b6b7c">TRUE / FALSE</text>
  <rect x="40" y="122" width="390" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="58" y="150" font-size="12" font-weight="700" fill="#1f2b38">Byte</text>
  <text x="190" y="150" font-size="11" fill="#5b6b7c">全部 256 个值</text>
  <rect x="40" y="176" width="390" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="58" y="204" font-size="12" font-weight="700" fill="#1f2b38">Short / Integer</text>
  <text x="190" y="204" font-size="11" fill="#5b6b7c">-128 ~ 127</text>
  <rect x="40" y="230" width="390" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="58" y="258" font-size="12" font-weight="700" fill="#1f2b38">Character</text>
  <text x="190" y="258" font-size="11" fill="#5b6b7c">\u0000 ~ \u007F</text>

  <rect x="40" y="288" width="390" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="56" y="312" font-size="11" fill="#1f2b38">Integer 上界可用 -XX:AutoBoxCacheMax=&lt;size&gt; 调整，</text>
  <text x="56" y="330" font-size="11" fill="#1f2b38">源码最终取 max(127, 设定值)：只能变大，不能变小。</text>

  <rect x="470" y="68" width="390" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="665" y="96" font-size="12" fill="#1f2b38" text-anchor="middle">Integer a = 127;  // 自动装箱 = valueOf(127)</text>
  <line x1="665" y1="112" x2="665" y2="130" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="470" y="132" width="390" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="665" y="160" font-size="12" fill="#1f2b38" text-anchor="middle">值是否落在缓存范围内？</text>
  <line x1="665" y1="176" x2="567" y2="200" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="665" y1="176" x2="763" y2="200" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="472" y="204" width="190" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="567" y="230" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">命中缓存</text>
  <text x="567" y="252" font-size="11" fill="#1f2b38" text-anchor="middle">复用同一个对象</text>
  <text x="567" y="268" font-size="11" fill="#1f2b38" text-anchor="middle">a == b 为 true</text>
  <rect x="670" y="204" width="190" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="765" y="230" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">未命中缓存</text>
  <text x="765" y="252" font-size="11" fill="#1f2b38" text-anchor="middle">new 一个新对象</text>
  <text x="765" y="268" font-size="11" fill="#1f2b38" text-anchor="middle">c == d 为 false</text>
  <rect x="470" y="296" width="390" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="486" y="320" font-size="11" fill="#1f2b38">new Integer(127) 一定不走缓存；</text>
  <text x="486" y="338" font-size="11" fill="#1f2b38">包装类型比较一律用 equals()，或先拆箱再比。</text>
</svg>
