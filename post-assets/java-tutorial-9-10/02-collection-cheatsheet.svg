<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>List、Set、Map 的底层结构与选型速查</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">集合选型速查：底层的四种结构决定了取舍</text>

  <rect x="40" y="48" width="260" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="73" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">List：有序、可重复</text>
  <rect x="40" y="94" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="54" y="118" font-size="12" font-weight="700" fill="#1f2b38">ArrayList</text>
  <text x="54" y="136" font-size="11" fill="#5b6b7c">可变数组：按下标查 O(1)</text>
  <text x="54" y="152" font-size="11" fill="#5b6b7c">中间增删要位移元素 O(n)</text>
  <rect x="40" y="164" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="54" y="188" font-size="12" font-weight="700" fill="#1f2b38">LinkedList</text>
  <text x="54" y="206" font-size="11" fill="#5b6b7c">双向链表：增删 O(1)、查 O(n)</text>
  <text x="54" y="222" font-size="11" fill="#5b6b7c">兼作 Deque，可当栈 / 队列</text>
  <rect x="40" y="234" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="54" y="258" font-size="12" font-weight="700" fill="#1f2b38">Vector / 并发替代</text>
  <text x="54" y="276" font-size="11" fill="#5b6b7c">方法 synchronized，遗留类</text>
  <text x="54" y="292" font-size="11" fill="#5b6b7c">并发用 CopyOnWriteArrayList</text>

  <rect x="320" y="48" width="260" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="73" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Set：去重</text>
  <rect x="320" y="94" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="334" y="118" font-size="12" font-weight="700" fill="#1f2b38">HashSet</text>
  <text x="334" y="136" font-size="11" fill="#5b6b7c">哈希表：存取无序、不可重复</text>
  <text x="334" y="152" font-size="11" fill="#5b6b7c">靠 hashCode() + equals() 去重</text>
  <rect x="320" y="164" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="334" y="188" font-size="12" font-weight="700" fill="#1f2b38">LinkedHashSet</text>
  <text x="334" y="206" font-size="11" fill="#5b6b7c">哈希表 + 双向链表</text>
  <text x="334" y="222" font-size="11" fill="#5b6b7c">因此保持插入顺序</text>
  <rect x="320" y="234" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="334" y="258" font-size="12" font-weight="700" fill="#1f2b38">TreeSet</text>
  <text x="334" y="276" font-size="11" fill="#5b6b7c">红黑树：天然有序</text>
  <text x="334" y="292" font-size="11" fill="#5b6b7c">排序靠 Comparable / Comparator</text>

  <rect x="600" y="48" width="260" height="38" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="730" y="73" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Map：键值对</text>
  <rect x="600" y="94" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="614" y="118" font-size="12" font-weight="700" fill="#1f2b38">HashMap</text>
  <text x="614" y="136" font-size="11" fill="#5b6b7c">数组 + 链表，链长 ≥ 8 且容量</text>
  <text x="614" y="152" font-size="11" fill="#5b6b7c">≥ 64 转红黑树：O(n) → O(log n)</text>
  <rect x="600" y="164" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="614" y="188" font-size="12" font-weight="700" fill="#1f2b38">容量与扩容</text>
  <text x="614" y="206" font-size="11" fill="#5b6b7c">容量取 2 的幂，负载因子 0.75</text>
  <text x="614" y="222" font-size="11" fill="#5b6b7c">扩容翻倍并重算桶位置</text>
  <rect x="600" y="234" width="260" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="614" y="258" font-size="12" font-weight="700" fill="#1f2b38">ConcurrentHashMap</text>
  <text x="614" y="276" font-size="11" fill="#5b6b7c">不允许 null key / null value</text>
  <text x="614" y="292" font-size="11" fill="#5b6b7c">HashMap 允许一个 null key</text>

  <rect x="40" y="312" width="820" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="56" y="336" font-size="11" fill="#1f2b38">遍历陷阱：for-each 中 list.remove(obj) 抛 ConcurrentModificationException，改用 Iterator.remove() 或 removeIf()</text>
  <text x="56" y="354" font-size="11" fill="#1f2b38">Arrays.asList() 返回定长视图，add / remove 抛 UnsupportedOperationException，可变列表要包一层 new ArrayList&lt;&gt;(...)</text>
  <text x="56" y="370" font-size="11" fill="#5b6b7c">遍历时用 entrySet() 比 keySet() 再 get(key) 更快，后者多一次查找</text>
</svg>
