<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>HelloWorld 的编译与运行流程</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">HelloWorld 的编译与运行流程</text>
  <rect x="30" y="130" width="170" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">HelloWorld.java</text>
  <text x="115" y="180" text-anchor="middle" font-size="11" fill="#5b6b7c">你写的源代码</text>
  <line x1="200" y1="165" x2="285" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="243" y="155" text-anchor="middle" font-size="11" fill="#2f6fd0">javac 编译</text>
  <rect x="295" y="130" width="170" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="380" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">HelloWorld.class</text>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#5b6b7c">平台无关的字节码</text>
  <line x1="380" y1="200" x2="380" y2="236" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="452" y="224" text-anchor="middle" font-size="11" fill="#2f6fd0">java 命令交给 JVM</text>
  <rect x="295" y="246" width="170" height="60" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="380" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">JVM 执行</text>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">输出 HelloWorld</text>
  <line x1="465" y1="150" x2="560" y2="92" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="465" y1="165" x2="560" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="465" y1="180" x2="560" y2="238" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="570" y="60" width="300" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Windows 上的 JVM</text>
  <text x="720" y="104" text-anchor="middle" font-size="11" fill="#5b6b7c">字节码由它翻译成本机指令</text>
  <rect x="570" y="137" width="300" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="161" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Linux 上的 JVM</text>
  <text x="720" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">同一份 class 文件照样能跑</text>
  <rect x="570" y="214" width="300" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">macOS 上的 JVM</text>
  <text x="720" y="258" text-anchor="middle" font-size="11" fill="#5b6b7c">一次编写，到处运行</text>
</svg>
