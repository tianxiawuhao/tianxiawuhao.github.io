<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JDK、JRE、JVM 的包含关系</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">JDK、JRE、JVM 的包含关系</text>
  <rect x="30" y="55" width="580" height="315" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="50" y="80" font-size="14" font-weight="700" fill="#2f6fd0">JDK：开发环境</text>
  <text x="50" y="99" font-size="11" fill="#5b6b7c">给写程序的人用，装它就同时拥有运行环境</text>
  <rect x="60" y="112" width="330" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="76" y="136" font-size="13" font-weight="700" fill="#1f2b38">开发工具</text>
  <text x="76" y="158" font-size="11" fill="#5b6b7c">javac 编译器、jar 打包工具</text>
  <text x="470" y="140" font-size="11" fill="#5b6b7c">开发工具</text>
  <text x="470" y="158" font-size="11" fill="#5b6b7c">= JDK 减 JRE</text>
  <rect x="60" y="196" width="520" height="156" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="76" y="220" font-size="14" font-weight="700" fill="#2e9e5b">JRE：运行环境</text>
  <text x="76" y="239" font-size="11" fill="#5b6b7c">只运行已经编译好的程序时，装它即可</text>
  <rect x="90" y="252" width="200" height="54" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="190" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">JVM</text>
  <text x="190" y="294" text-anchor="middle" font-size="11" fill="#5b6b7c">执行字节码的虚拟机</text>
  <rect x="330" y="252" width="220" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="440" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">核心类库</text>
  <text x="440" y="294" text-anchor="middle" font-size="11" fill="#5b6b7c">String、System 等基础类</text>
  <line x1="610" y1="300" x2="680" y2="248" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="150" width="180" height="170" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="780" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">记住一句话</text>
  <text x="780" y="206" text-anchor="middle" font-size="11" fill="#5b6b7c">JDK = JRE + 开发工具</text>
  <text x="780" y="230" text-anchor="middle" font-size="11" fill="#5b6b7c">JRE = JVM + 核心类库</text>
  <text x="780" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">JVM 让字节码</text>
  <text x="780" y="280" text-anchor="middle" font-size="11" fill="#5b6b7c">能跑在不同系统上</text>
</svg>
