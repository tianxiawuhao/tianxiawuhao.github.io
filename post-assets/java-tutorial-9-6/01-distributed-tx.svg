<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>分布式事务五种方案的一致性、代价与适用场景对比</title>
  <rect width="900" height="450" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">分布式事务五种方案：一致性、代价与适用场景</text>

  <rect x="24" y="54" width="852" height="34" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="76" font-size="13" font-weight="700" fill="#2f6fd0">方案</text>
  <text x="164" y="76" font-size="13" font-weight="700" fill="#2f6fd0">一致性</text>
  <text x="312" y="76" font-size="13" font-weight="700" fill="#2f6fd0">性能 / 阻塞</text>
  <text x="492" y="76" font-size="13" font-weight="700" fill="#2f6fd0">关键坑与适用场景</text>

  <rect x="24" y="94" width="852" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="128" font-size="12.5" font-weight="700" fill="#1f2b38">2PC / XA</text>
  <text x="164" y="128" font-size="12" fill="#e08a1e">强一致</text>
  <text x="312" y="128" font-size="12" fill="#1f2b38">同步阻塞，协调者单点</text>
  <text x="492" y="118" font-size="12" fill="#1f2b38">坑：commit 阶段部分成功 + 协调者宕机</text>
  <text x="492" y="138" font-size="12" fill="#5b6b7c">适用：参与者少、事务短、并发低</text>

  <rect x="24" y="156" width="852" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="190" font-size="12.5" font-weight="700" fill="#1f2b38">TCC</text>
  <text x="164" y="190" font-size="12" fill="#2e9e5b">最终一致（业务补偿）</text>
  <text x="312" y="190" font-size="12" fill="#1f2b38">无长事务锁，性能好</text>
  <text x="492" y="180" font-size="12" fill="#1f2b38">坑：空回滚、悬挂、Confirm/Cancel 幂等</text>
  <text x="492" y="200" font-size="12" fill="#5b6b7c">适用：可定义补偿动作、要求较高并发</text>

  <rect x="24" y="218" width="852" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="252" font-size="12.5" font-weight="700" fill="#1f2b38">本地消息表</text>
  <text x="164" y="252" font-size="12" fill="#2e9e5b">最终一致</text>
  <text x="312" y="252" font-size="12" fill="#1f2b38">不阻塞业务主流程</text>
  <text x="492" y="242" font-size="12" fill="#1f2b38">坑：消息表耦合业务库，消费端必须幂等</text>
  <text x="492" y="262" font-size="12" fill="#5b6b7c">适用：本地写库 + 发消息，实际最常用</text>

  <rect x="24" y="280" width="852" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="314" font-size="12.5" font-weight="700" fill="#1f2b38">MQ 事务消息</text>
  <text x="164" y="314" font-size="12" fill="#2e9e5b">最终一致</text>
  <text x="312" y="314" font-size="12" fill="#1f2b38">异步，吞吐好</text>
  <text x="492" y="304" font-size="12" fill="#1f2b38">坑：Broker 需 check 反查本地事务结果</text>
  <text x="492" y="324" font-size="12" fill="#5b6b7c">适用：RocketMQ 事务消息生态</text>

  <rect x="24" y="342" width="852" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="376" font-size="12.5" font-weight="700" fill="#1f2b38">Saga</text>
  <text x="164" y="376" font-size="12" fill="#7a5bd0">最终一致，无隔离性</text>
  <text x="312" y="376" font-size="12" fill="#1f2b38">无阻塞，适合长流程</text>
  <text x="492" y="366" font-size="12" fill="#1f2b38">坑：中间状态对外可见，需语义锁</text>
  <text x="492" y="386" font-size="12" fill="#5b6b7c">适用：订车、订酒店、订机票等长流程</text>

  <text x="450" y="428" text-anchor="middle" font-size="12" fill="#5b6b7c">选型：要强一致选 2PC；能写补偿选 TCC；只管本地写库 + 发消息选消息表 / MQ 事务；长流程选 Saga</text>
</svg>
