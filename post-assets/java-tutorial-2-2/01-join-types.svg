<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>内连接与左外连接的取行范围对比</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">内连接 vs 左外连接：banana 会不会被丢掉</text>

  <!-- 输入：A 表 -->
  <rect x="40" y="60" width="240" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="84" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">左表 A（A_ID、A_NAME）</text>
  <rect x="58" y="94" width="204" height="26" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="112" font-size="12" fill="#1f2b38" text-anchor="middle">1　apple</text>
  <rect x="58" y="124" width="204" height="26" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="142" font-size="12" fill="#1f2b38" text-anchor="middle">2　banana　（B 表无记录）</text>
  <rect x="58" y="154" width="204" height="26" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="172" font-size="12" fill="#1f2b38" text-anchor="middle">3　cherry</text>

  <!-- 输入：B 表 -->
  <rect x="620" y="60" width="240" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="740" y="84" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">右表 B（A_ID、B_PRICE）</text>
  <rect x="638" y="94" width="204" height="26" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="112" font-size="12" fill="#1f2b38" text-anchor="middle">1　3.5</text>
  <rect x="638" y="124" width="204" height="26" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="142" font-size="12" fill="#1f2b38" text-anchor="middle">2　（无记录）</text>
  <rect x="638" y="154" width="204" height="26" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="172" font-size="12" fill="#1f2b38" text-anchor="middle">3　5.0</text>

  <line x1="280" y1="125" x2="618" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="449" y="115" font-size="12" fill="#5b6b7c" text-anchor="middle">on A.A_ID = B.A_ID</text>

  <!-- 内连接结果 -->
  <rect x="40" y="215" width="390" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="240" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">内连接 inner join</text>
  <text x="235" y="260" font-size="12" fill="#5b6b7c" text-anchor="middle">只保留匹配上的行</text>
  <rect x="58" y="272" width="354" height="24" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="235" y="289" font-size="12" fill="#1f2b38" text-anchor="middle">1　apple　3.5</text>
  <rect x="58" y="300" width="354" height="24" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="235" y="317" font-size="12" fill="#1f2b38" text-anchor="middle">3　cherry　5.0</text>
  <text x="235" y="348" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">banana 不在结果里（丢行）</text>

  <!-- 左外连接结果 -->
  <rect x="470" y="215" width="390" height="150" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="240" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">左外连接 left join</text>
  <text x="665" y="260" font-size="12" fill="#5b6b7c" text-anchor="middle">左表全部保留，缺的补 NULL</text>
  <rect x="488" y="272" width="354" height="24" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="289" font-size="12" fill="#1f2b38" text-anchor="middle">1　apple　3.5</text>
  <rect x="488" y="300" width="354" height="24" rx="4" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="665" y="317" font-size="12" fill="#1f2b38" text-anchor="middle">2　banana　NULL</text>
  <text x="665" y="348" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">不丢行，只会多出 NULL</text>

  <text x="450" y="398" font-size="12" fill="#5b6b7c" text-anchor="middle">A、B 直接并列且无条件时得到笛卡尔积（A 行数 × B 行数），只是连接的原料</text>
  <text x="450" y="422" font-size="12" fill="#5b6b7c" text-anchor="middle">on 描述两表如何关联，where 描述留下哪些行；右外连接可改写成调换表序的左外连接</text>
</svg>
