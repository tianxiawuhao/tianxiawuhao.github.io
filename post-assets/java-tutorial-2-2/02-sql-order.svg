<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>where、group by、having、order by 的书写顺序与执行顺序</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">分组过滤四步：书写顺序与逻辑执行顺序</text>

  <!-- 书写顺序（静态） -->
  <text x="40" y="62" font-size="13" font-weight="700" fill="#5b6b7c">书写顺序</text>
  <rect x="40" y="72" width="820" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="100" font-size="13" fill="#1f2b38" text-anchor="middle">select name, sum(singin) as total　from employee_tbl　where …　group by …　having …　order by …</text>

  <!-- 执行顺序（流程） -->
  <text x="40" y="152" font-size="13" font-weight="700" fill="#5b6b7c">逻辑执行顺序</text>

  <rect x="40" y="170" width="170" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="194" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">where</text>
  <text x="125" y="213" font-size="11" fill="#5b6b7c" text-anchor="middle">先过滤行，不能用聚合</text>

  <rect x="260" y="170" width="170" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="345" y="194" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">group by</text>
  <text x="345" y="213" font-size="11" fill="#5b6b7c" text-anchor="middle">分组聚合，可当去重</text>

  <rect x="480" y="170" width="170" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="565" y="194" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">having</text>
  <text x="565" y="213" font-size="11" fill="#5b6b7c" text-anchor="middle">过滤分组后的结果</text>

  <rect x="700" y="170" width="160" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="780" y="194" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">order by</text>
  <text x="780" y="213" font-size="11" fill="#5b6b7c" text-anchor="middle">最后排序输出</text>

  <line x1="210" y1="198" x2="258" y2="198" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="430" y1="198" x2="478" y2="198" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="650" y1="198" x2="698" y2="198" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="40" y1="250" x2="860" y2="250" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="274" font-size="12" fill="#5b6b7c">having 里才能写 sum(singin) &gt; 5；where 在分组前执行，引用聚合会报错</text>
</svg>
