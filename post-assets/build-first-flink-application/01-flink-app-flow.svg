<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">从零构建第一个 Flink 应用：数据流向</text>

  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">步骤 1</text>
  <rect x="25" y="96" width="150" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="100" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">终端输入</text>
  <text x="100" y="155" text-anchor="middle" font-size="11.5" fill="#5b6b7c">nc -lk 9000</text>

  <line x1="179" y1="138" x2="196" y2="138" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="275" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">步骤 2</text>
  <rect x="200" y="96" width="150" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="275" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">数据源</text>
  <text x="275" y="155" text-anchor="middle" font-size="11.5" fill="#5b6b7c">socketTextStream</text>

  <line x1="354" y1="138" x2="371" y2="138" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="450" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">步骤 3</text>
  <rect x="375" y="96" width="150" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="450" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">转换</text>
  <text x="450" y="155" text-anchor="middle" font-size="11.5" fill="#5b6b7c">flatMap 拆词</text>

  <line x1="529" y1="138" x2="546" y2="138" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="625" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">步骤 4</text>
  <rect x="550" y="96" width="150" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="625" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">分组聚合</text>
  <text x="625" y="155" text-anchor="middle" font-size="11.5" fill="#5b6b7c">keyBy + 窗口 + sum</text>

  <line x1="704" y1="138" x2="721" y2="138" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="800" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">步骤 5</text>
  <rect x="725" y="96" width="150" height="84" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="800" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">输出</text>
  <text x="800" y="155" text-anchor="middle" font-size="11.5" fill="#5b6b7c">print 到控制台</text>

  <rect x="25" y="210" width="850" height="64" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
  <text x="45" y="236" font-size="12" fill="#1f2b38">链路：netcat → socketTextStream → flatMap 拆成 (word, 1) → keyBy 分组、5 秒窗口 sum → print 控制台</text>
  <text x="45" y="260" font-size="12" fill="#5b6b7c">提示：以上算子只是在构建执行图，只有调用 env.execute() 之后，作业才会真正提交并运行。</text>
</svg>
