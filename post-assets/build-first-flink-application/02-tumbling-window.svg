<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">5 秒滚动窗口（Tumbling Window）计数示意</text>
  <text x="40" y="54" font-size="11.5" fill="#5b6b7c">输入流（netcat 中键入的多行文本）</text>

  <rect x="40" y="62" width="240" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="160" y="92" text-anchor="middle" font-size="12.5" fill="#1f2b38">flink flink hadoop</text>

  <rect x="330" y="62" width="240" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="92" text-anchor="middle" font-size="12.5" fill="#1f2b38">hadoop flink</text>

  <rect x="620" y="62" width="240" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="740" y="92" text-anchor="middle" font-size="12.5" fill="#1f2b38">flink flink</text>

  <line x1="160" y1="114" x2="160" y2="150" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="114" x2="450" y2="150" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="740" y1="114" x2="740" y2="150" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="40" y="156" width="240" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="160" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">窗口 1（0-5 秒）</text>
  <text x="160" y="212" text-anchor="middle" font-size="12.5" fill="#2e9e5b">flink → 2，hadoop → 1</text>

  <rect x="330" y="156" width="240" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="450" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">窗口 2（5-10 秒）</text>
  <text x="450" y="212" text-anchor="middle" font-size="12.5" fill="#2e9e5b">hadoop → 1，flink → 1</text>

  <rect x="620" y="156" width="240" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="740" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">窗口 3（10-15 秒）</text>
  <text x="740" y="212" text-anchor="middle" font-size="12.5" fill="#2e9e5b">flink → 2</text>

  <text x="450" y="272" text-anchor="middle" font-size="12" fill="#5b6b7c">窗口之间互不重叠，各自独立统计；窗口结束触发时才输出该 5 秒内的词频结果。</text>
</svg>
