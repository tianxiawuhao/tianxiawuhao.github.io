<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>GMP 模型结构：G、M、P 三者关系</title>
<rect width="900" height="500" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
</defs>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">GMP 模型：G（协程）、M（内核线程）、P（逻辑处理器）</text>
<text x="450" y="50" font-size="11.5" fill="#5b6b7c" text-anchor="middle">G = Goroutine 用户态协程，初始栈仅几 KB；M = Machine 内核线程；P = Processor 运行 Go 代码所需的上下文与资源</text>
<rect x="20" y="64" width="860" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="88" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">全局队列 Global Run Queue（共享，入队/出队需加锁）</text>
<text x="450" y="108" font-size="11.5" fill="#5b6b7c" text-anchor="middle">本地队列溢出时接收一半 G，也是取不到 G 时的兜底来源</text>
<path d="M 450 120 L 450 138" stroke="#2f6fd0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="134" font-size="11" fill="#5b6b7c">取不到 G 时回退到这里</text>
<rect x="50" y="140" width="250" height="210" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="50" y="140" width="250" height="30" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="175" y="160" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">P0 逻辑处理器</text>
<text x="62" y="192" font-size="11.5" fill="#5b6b7c">本地队列 runq（≤256 个 G，无锁）</text>
<rect x="64" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="96" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G1</text>
<rect x="136" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="168" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G2</text>
<rect x="208" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="240" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G3</text>
<text x="62" y="262" font-size="11.5" fill="#5b6b7c">P 还持有 mcache、栈内存</text>
<text x="62" y="280" font-size="11.5" fill="#5b6b7c">等运行上下文，同一时刻</text>
<text x="62" y="298" font-size="11.5" fill="#5b6b7c">只被一个 M 占用</text>
<text x="62" y="330" font-size="11.5" fill="#2f6fd0">本地队列优先，无锁最快</text>
<rect x="325" y="140" width="250" height="210" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="325" y="140" width="250" height="30" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="160" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">P1 逻辑处理器</text>
<text x="337" y="192" font-size="11.5" fill="#5b6b7c">本地队列 runq（≤256 个 G，无锁）</text>
<rect x="339" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="371" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G4</text>
<rect x="411" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="443" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G5</text>
<rect x="483" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="515" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G6</text>
<text x="337" y="262" font-size="11.5" fill="#5b6b7c">本地队列满时，一半 G 被</text>
<text x="337" y="280" font-size="11.5" fill="#5b6b7c">搬进全局队列，新 G 优先</text>
<text x="337" y="298" font-size="11.5" fill="#5b6b7c">留在本地队列</text>
<text x="337" y="330" font-size="11.5" fill="#e08a1e">队友空闲时可来偷一半</text>
<rect x="600" y="140" width="250" height="210" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="600" y="140" width="250" height="30" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="725" y="160" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">P2 逻辑处理器</text>
<text x="612" y="192" font-size="11.5" fill="#5b6b7c">本地队列 runq（≤256 个 G，无锁）</text>
<rect x="614" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="646" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G7</text>
<rect x="686" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="718" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G8</text>
<rect x="758" y="202" width="64" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="790" y="222" font-size="11.5" fill="#1f2b38" text-anchor="middle">G9</text>
<text x="612" y="262" font-size="11.5" fill="#5b6b7c">P 的数量 = GOMAXPROCS，</text>
<text x="612" y="280" font-size="11.5" fill="#5b6b7c">它决定了同时运行的 G 的</text>
<text x="612" y="298" font-size="11.5" fill="#5b6b7c">上限，也就是并行度</text>
<text x="612" y="330" font-size="11.5" fill="#5b6b7c">程序启动时一次性创建好</text>
<path d="M 175 350 L 175 384" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 450 350 L 450 384" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 725 350 L 725 384" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="181" y="372" font-size="11" fill="#5b6b7c">1:1 绑定</text>
<text x="456" y="372" font-size="11" fill="#5b6b7c">1:1 绑定</text>
<text x="731" y="372" font-size="11" fill="#5b6b7c">1:1 绑定</text>
<rect x="90" y="386" width="170" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="175" y="408" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">M0 内核线程</text>
<text x="175" y="426" font-size="11" fill="#5b6b7c" text-anchor="middle">执行绑定 P 取到的 G</text>
<rect x="365" y="386" width="170" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="408" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">M1 内核线程</text>
<text x="450" y="426" font-size="11" fill="#5b6b7c" text-anchor="middle">执行绑定 P 取到的 G</text>
<rect x="640" y="386" width="170" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="725" y="408" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">M2 内核线程</text>
<text x="725" y="426" font-size="11" fill="#5b6b7c" text-anchor="middle">系统调用阻塞中</text>
<path d="M 175 438 L 175 450" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 725 438 L 725 450" stroke="#e08a1e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="20" y="452" width="420" height="36" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="230" y="475" font-size="11.5" fill="#1f2b38" text-anchor="middle">空闲 M 链表：需要时唤醒，与 P 绑定后继续跑 G</text>
<rect x="460" y="452" width="420" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="670" y="475" font-size="11.5" fill="#1f2b38" text-anchor="middle">阻塞的 M 释放 P（hand off），P 立刻被其他 M 接管</text>
</svg>
