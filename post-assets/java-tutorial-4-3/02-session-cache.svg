<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>一级缓存、快照与二级缓存的作用范围</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一级缓存（Session 级）与二级缓存（SessionFactory 级）</text>

  <rect x="32" y="52" width="836" height="250" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="76" font-size="13" font-weight="700" fill="#2e9e5b">SessionFactory：二级缓存（跨 Session 共享，需显式开启并加 @Cache 声明）</text>

  <rect x="52" y="90" width="396" height="196" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="68" y="112" font-size="12" font-weight="700" fill="#1f2b38">Session A：一级缓存 = Session 缓存</text>
  <rect x="68" y="122" width="364" height="66" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="82" y="146" font-size="12" fill="#1f2b38">缓存 Map&lt;OID, 实体实例&gt;</text>
  <text x="82" y="168" font-size="11" fill="#5b6b7c">同一 OID 两次 get() 只发一条 SQL，返回同一引用</text>
  <rect x="68" y="198" width="364" height="66" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="82" y="222" font-size="12" fill="#1f2b38">快照（属性副本）</text>
  <text x="82" y="244" font-size="11" fill="#5b6b7c">flush 时按 OID 比对缓存与快照，属性变了自动发 UPDATE</text>

  <rect x="464" y="90" width="396" height="196" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="112" font-size="12" font-weight="700" fill="#1f2b38">Session B：各自独立的一级缓存</text>
  <rect x="480" y="122" width="364" height="66" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="494" y="146" font-size="12" fill="#1f2b38">缓存不跨 Session 共享</text>
  <text x="494" y="168" font-size="11" fill="#5b6b7c">换一个 Session 就要重新查库，一级缓存白送但不救你</text>
  <rect x="480" y="198" width="364" height="66" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="494" y="222" font-size="12" fill="#1f2b38">Session 关闭即释放</text>
  <text x="494" y="244" font-size="11" fill="#5b6b7c">clear() 只清缓存数据，不销毁对象</text>

  <rect x="32" y="322" width="836" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="50" y="348" font-size="12" fill="#1f2b38">真正靠缓存省掉 SQL 的是按 OID 加载实体的路径（get()、load()）；list() 每次都执行 SQL，只复用同 OID 的实体实例。</text>
  <text x="50" y="370" font-size="12" fill="#1f2b38">iterate() 先查一批 ID 再逐条按 OID 装载，缓存未预热时就是典型的 N+1，不要为了「用缓存」而改用它。</text>
  <text x="50" y="392" font-size="12" fill="#1f2b38">二级缓存只缓存按 ID 装载的实体与集合，事务提交时才真正写入、回滚不留脏缓存；查询缓存失效条件苛刻，默认别开。</text>
</svg>
