<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>一对多与多对多映射的外键维护方</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一对多与多对多的表结构：外键由谁维护</text>

  <rect x="32" y="52" width="836" height="190" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="78" font-size="13" font-weight="700" fill="#2f6fd0">一对多：客户 1 : N 联系人（外键列在多方）</text>

  <rect x="60" y="92" width="250" height="88" rx="6" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="76" y="116" font-size="13" font-weight="700" fill="#1f2b38">cst_customer</text>
  <text x="76" y="138" font-size="12" fill="#5b6b7c">cust_id（PK 自增）</text>
  <text x="76" y="160" font-size="12" fill="#5b6b7c">cust_name、cust_level</text>
  <text x="60" y="200" font-size="11" fill="#5b6b7c">一方集合：Set&lt;LinkMan&gt; linkMans</text>
  <text x="60" y="218" font-size="11" fill="#5b6b7c">mappedBy = 'customer'，只映射不写外键</text>

  <rect x="590" y="92" width="250" height="100" rx="6" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="606" y="116" font-size="13" font-weight="700" fill="#1f2b38">cst_linkman</text>
  <text x="606" y="138" font-size="12" fill="#5b6b7c">lkm_id（PK 自增）</text>
  <text x="606" y="160" font-size="12" fill="#e08a1e">lkm_customer_id（FK）</text>
  <text x="590" y="212" font-size="11" fill="#5b6b7c">@ManyToOne(fetch = LAZY)</text>
  <text x="590" y="230" font-size="11" fill="#5b6b7c">持有外键列，由它维护外键</text>

  <line x1="586" y1="140" x2="316" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="451" y="126" font-size="12" fill="#e08a1e" text-anchor="middle">lkm_customer_id → cust_id</text>
  <text x="451" y="162" font-size="11" fill="#5b6b7c" text-anchor="middle">维护权交给多方，保存时少发一条 UPDATE</text>

  <rect x="32" y="262" width="836" height="186" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="288" font-size="13" font-weight="700" fill="#2f6fd0">多对多：用户 N : N 角色（靠中间表实现）</text>

  <rect x="52" y="300" width="210" height="96" rx="6" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="68" y="326" font-size="13" font-weight="700" fill="#1f2b38">sys_user</text>
  <text x="68" y="348" font-size="12" fill="#5b6b7c">user_id（PK 自增）</text>
  <text x="68" y="366" font-size="12" fill="#5b6b7c">Set&lt;SysRole&gt; roles</text>

  <rect x="345" y="300" width="210" height="96" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="361" y="326" font-size="13" font-weight="700" fill="#e08a1e">user_role 中间表</text>
  <text x="361" y="348" font-size="12" fill="#5b6b7c">user_id（FK）</text>
  <text x="361" y="366" font-size="12" fill="#5b6b7c">role_id（FK）</text>

  <rect x="638" y="300" width="210" height="96" rx="6" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="654" y="326" font-size="13" font-weight="700" fill="#1f2b38">sys_role</text>
  <text x="654" y="348" font-size="12" fill="#5b6b7c">role_id（PK 自增）</text>
  <text x="654" y="366" font-size="12" fill="#5b6b7c">Set&lt;SysUser&gt; users</text>

  <line x1="341" y1="348" x2="266" y2="348" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="559" y1="348" x2="634" y2="348" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="303" y="338" font-size="11" fill="#5b6b7c" text-anchor="middle">user_id</text>
  <text x="597" y="338" font-size="11" fill="#5b6b7c" text-anchor="middle">role_id</text>

  <text x="52" y="418" font-size="12" fill="#1f2b38">主动方用 @JoinTable(name、joinColumns、inverseJoinColumns) 定义中间表；</text>
  <text x="52" y="438" font-size="12" fill="#1f2b38">被动方 @ManyToMany(mappedBy = 'roles') 只映射、不写中间表记录；级联 REMOVE 会删掉关联对象，生产慎用。</text>
</svg>
