<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Boot 自动配置的触发、加载、条件筛选与生效流程</title>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring Boot 自动配置：从启动类到条件生效</text>

  <rect x="40" y="55" width="820" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="80" font-size="13" font-weight="700" fill="#1f2b38">启动类 @SpringBootApplication</text>
  <text x="60" y="102" font-size="11.5" fill="#5b6b7c">= @SpringBootConfiguration（配置类） + @ComponentScan（扫描本包及子包） + @EnableAutoConfiguration（开启自动配置）</text>

  <line x1="450" y1="119" x2="450" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="148" width="820" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="175" font-size="12.5" fill="#1f2b38">@EnableAutoConfiguration 通过 <tspan font-weight="700">@Import(AutoConfigurationImportSelector.class)</tspan> 导入自动配置选择器</text>

  <line x1="450" y1="192" x2="450" y2="219" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="221" width="820" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="246" font-size="12.5" fill="#1f2b38">AutoConfigurationImportSelector#selectImports 读取候选配置类清单并去重、排除 exclude</text>
  <text x="60" y="267" font-size="11.5" fill="#5b6b7c">来源：META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports（2.7 起；更早为 spring.factories）</text>

  <line x1="450" y1="279" x2="450" y2="306" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="308" width="820" height="126" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="333" font-size="13" font-weight="700" fill="#1f2b38">条件注解筛选（仅满足条件的配置类才生效）</text>
  <rect x="60" y="347" width="185" height="70" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="152" y="370" font-size="11.5" fill="#2f6fd0" text-anchor="middle">@ConditionalOnClass</text>
  <text x="152" y="390" font-size="11" fill="#5b6b7c" text-anchor="middle">类路径存在指定类</text>
  <text x="152" y="406" font-size="11" fill="#5b6b7c" text-anchor="middle">例：有 Tomcat 才配容器</text>
  <rect x="265" y="347" width="185" height="70" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="357" y="370" font-size="11.5" fill="#2f6fd0" text-anchor="middle">@ConditionalOnMissingBean</text>
  <text x="357" y="390" font-size="11" fill="#5b6b7c" text-anchor="middle">容器尚无该 Bean</text>
  <text x="357" y="406" font-size="11" fill="#5b6b7c" text-anchor="middle">用户定义优先</text>
  <rect x="470" y="347" width="185" height="70" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="562" y="370" font-size="11.5" fill="#2f6fd0" text-anchor="middle">@ConditionalOnProperty</text>
  <text x="562" y="390" font-size="11" fill="#5b6b7c" text-anchor="middle">开关项匹配才生效</text>
  <text x="562" y="406" font-size="11" fill="#5b6b7c" text-anchor="middle">havingValue / matchIfMissing</text>
  <rect x="675" y="347" width="165" height="70" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="757" y="370" font-size="11.5" fill="#2f6fd0" text-anchor="middle">@ConditionalOnWeb…</text>
  <text x="757" y="390" font-size="11" fill="#5b6b7c" text-anchor="middle">按应用类型判断</text>
  <text x="757" y="406" font-size="11" fill="#5b6b7c" text-anchor="middle">SERVLET / REACTIVE</text>

  <line x1="450" y1="434" x2="450" y2="461" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="463" width="395" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="237" y="488" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">配置类注册为 BeanDefinition</text>
  <text x="237" y="510" font-size="11" fill="#5b6b7c" text-anchor="middle">@EnableConfigurationProperties 再绑定配置属性</text>
  <text x="237" y="527" font-size="11" fill="#5b6b7c" text-anchor="middle">例：ServerProperties 绑定 server.*</text>

  <rect x="465" y="463" width="395" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="662" y="488" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">默认 Bean 生效（可被覆盖）</text>
  <text x="662" y="510" font-size="11" fill="#5b6b7c" text-anchor="middle">如 DispatchServlet、DataSource、内嵌容器</text>
  <text x="662" y="527" font-size="11" fill="#5b6b7c" text-anchor="middle">排错：--debug 打印条件评估报告</text>
</svg>
