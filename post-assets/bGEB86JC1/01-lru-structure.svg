<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>LRU 缓存结构：HashMap 定位节点，双向链表维护访问顺序</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">LRU 缓存结构：HashMap 定位 + 双向链表维护顺序</text>
  <rect x="60" y="62" width="780" height="96" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="80" y="86" font-size="13" fill="#5b6b7c">HashMap&lt;key, Node&gt;：O(1) 定位节点，本身不维护顺序</text>
  <rect x="290" y="100" width="120" height="40" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="350" y="125" text-anchor="middle" font-size="13" fill="#1f2b38">key = C</text>
  <rect x="430" y="100" width="120" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="125" text-anchor="middle" font-size="13" fill="#1f2b38">key = A</text>
  <rect x="570" y="100" width="120" height="40" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="630" y="125" text-anchor="middle" font-size="13" fill="#1f2b38">key = B</text>
  <line x1="350" y1="144" x2="350" y2="228" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="490" y1="144" x2="490" y2="228" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="630" y1="144" x2="630" y2="228" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="190" y="232" width="70" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="266" text-anchor="middle" font-size="12" fill="#5b6b7c">head</text>
  <rect x="300" y="232" width="100" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="350" y="266" text-anchor="middle" font-size="13" fill="#1f2b38">C</text>
  <rect x="440" y="232" width="100" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="490" y="266" text-anchor="middle" font-size="13" fill="#1f2b38">A</text>
  <rect x="580" y="232" width="100" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="630" y="266" text-anchor="middle" font-size="13" fill="#1f2b38">B</text>
  <rect x="740" y="232" width="70" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="775" y="266" text-anchor="middle" font-size="12" fill="#5b6b7c">tail</text>
  <line x1="262" y1="261" x2="296" y2="261" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="402" y1="261" x2="436" y2="261" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="542" y1="261" x2="576" y2="261" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="682" y1="261" x2="736" y2="261" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="350" y="312" text-anchor="middle" font-size="11" fill="#2e9e5b">最近使用</text>
  <text x="630" y="312" text-anchor="middle" font-size="11" fill="#e08a1e">最久未使用</text>
  <text x="450" y="352" text-anchor="middle" font-size="13" fill="#1f2b38">命中 get/put：把节点移到 head 之后　｜　容量已满：删除 tail 的前驱节点</text>
</svg>
