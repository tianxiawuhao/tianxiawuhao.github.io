<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Redis 近似 LRU：随机采样若干键，淘汰其中最久未使用的键</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Redis 近似 LRU：采样后淘汰最久未使用的键</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#5b6b7c">每个键用 24 位时钟记录最近访问时间，maxmemory-samples 默认 5</text>
  <rect x="50" y="70" width="420" height="240" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="94" font-size="13" fill="#5b6b7c">键空间（示意图，实际可达千万级）</text>
  <g fill="#2f6fd0">
    <circle cx="90" cy="118" r="8"/><circle cx="174" cy="118" r="8"/><circle cx="216" cy="118" r="8"/><circle cx="258" cy="118" r="8"/><circle cx="300" cy="118" r="8"/>
    <circle cx="90" cy="160" r="8"/><circle cx="132" cy="160" r="8"/><circle cx="174" cy="160" r="8"/><circle cx="258" cy="160" r="8"/><circle cx="300" cy="160" r="8"/>
    <circle cx="132" cy="202" r="8"/><circle cx="174" cy="202" r="8"/><circle cx="216" cy="202" r="8"/><circle cx="258" cy="202" r="8"/><circle cx="300" cy="202" r="8"/>
    <circle cx="90" cy="244" r="8"/><circle cx="132" cy="244" r="8"/><circle cx="174" cy="244" r="8"/><circle cx="216" cy="244" r="8"/><circle cx="300" cy="244" r="8"/>
    <circle cx="90" cy="286" r="8"/><circle cx="132" cy="286" r="8"/><circle cx="216" cy="286" r="8"/><circle cx="258" cy="286" r="8"/><circle cx="300" cy="286" r="8"/>
  </g>
  <g fill="#e08a1e">
    <circle cx="132" cy="118" r="8"/><circle cx="216" cy="160" r="8"/><circle cx="90" cy="202" r="8"/><circle cx="174" cy="286" r="8"/>
  </g>
  <circle cx="258" cy="244" r="9" fill="#7a5bd0"/>
  <line x1="472" y1="195" x2="536" y2="195" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="548" y="150" width="150" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="623" y="185" text-anchor="middle" font-size="12" fill="#1f2b38">比较采样键</text>
  <text x="623" y="208" text-anchor="middle" font-size="12" fill="#1f2b38">的空闲时间</text>
  <line x1="700" y1="195" x2="734" y2="195" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="738" y="150" width="124" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="800" y="190" text-anchor="middle" font-size="12" fill="#1f2b38">移除该键</text>
  <text x="800" y="213" text-anchor="middle" font-size="12" fill="#1f2b38">释放内存</text>
  <circle cx="90" cy="336" r="7" fill="#2f6fd0"/><text x="104" y="340" font-size="12" fill="#1f2b38">普通键</text>
  <circle cx="200" cy="336" r="7" fill="#e08a1e"/><text x="214" y="340" font-size="12" fill="#1f2b38">本次采样</text>
  <circle cx="320" cy="336" r="7" fill="#7a5bd0"/><text x="334" y="340" font-size="12" fill="#1f2b38">被选中淘汰</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#5b6b7c">只采样少量键即可逼近严格 LRU，省去了维护全局链表的内存与开销</text>
</svg>
