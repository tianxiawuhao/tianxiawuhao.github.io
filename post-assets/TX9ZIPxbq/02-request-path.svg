<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Client 经 Ingress、Service 到达 Pod 的请求链路</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">请求链路：Client → Ingress → Service → Pod</text>

  <rect x="25" y="70" width="150" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="104" font-size="13" fill="#1f2b38" text-anchor="middle">Client</text>
  <text x="100" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">浏览器 / curl</text>

  <line x1="175" y1="110" x2="243" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="209" y="102" font-size="11" fill="#5b6b7c" text-anchor="middle">HTTP(S)</text>

  <rect x="245" y="70" width="170" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="330" y="104" font-size="13" fill="#1f2b38" text-anchor="middle">Ingress Controller</text>
  <text x="330" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">nginx 监听 80 / 443</text>

  <line x1="415" y1="110" x2="483" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="449" y="102" font-size="11" fill="#5b6b7c" text-anchor="middle">匹配规则</text>

  <rect x="485" y="70" width="150" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="560" y="104" font-size="13" fill="#1f2b38" text-anchor="middle">Service</text>
  <text x="560" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">ClusterIP + 端口</text>

  <line x1="635" y1="110" x2="703" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="669" y="102" font-size="11" fill="#5b6b7c" text-anchor="middle">负载均衡</text>

  <rect x="705" y="70" width="170" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="790" y="104" font-size="13" fill="#1f2b38" text-anchor="middle">Pod</text>
  <text x="790" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">容器应用</text>

  <line x1="330" y1="150" x2="330" y2="185" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="560" y1="150" x2="560" y2="185" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="790" y1="150" x2="790" y2="185" stroke="#c8d3e0" stroke-width="1.4"/>

  <rect x="245" y="185" width="170" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="330" y="212" font-size="12" fill="#1f2b38" text-anchor="middle">Ingress 规则</text>
  <text x="330" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">host + path + pathType</text>

  <rect x="485" y="185" width="150" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="560" y="212" font-size="12" fill="#1f2b38" text-anchor="middle">Endpoints</text>
  <text x="560" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">就绪 Pod IP 列表</text>

  <rect x="705" y="185" width="170" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="790" y="212" font-size="12" fill="#1f2b38" text-anchor="middle">X-Forwarded-For</text>
  <text x="790" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">透传真实客户端 IP</text>

  <rect x="40" y="290" width="820" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="316" font-size="12" fill="#1f2b38">Controller 不直接感知 Pod：请求先交给 Service，再由 Endpoints 决定落到哪个 Pod。</text>
  <text x="60" y="340" font-size="12" fill="#1f2b38">Pod 扩缩容时 Endpoints 自动更新，Ingress 规则本身不需要修改。</text>
</svg>
