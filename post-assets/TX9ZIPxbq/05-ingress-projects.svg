<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ingress-nginx 与 nginx-ingress 两套项目的区别</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">ingress-nginx 与 nginx-ingress 两套项目的区别</text>

  <rect x="40" y="56" width="140" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="81" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">对比项</text>
  <rect x="180" y="56" width="340" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="350" y="81" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">ingress-nginx</text>
  <rect x="520" y="56" width="340" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="81" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">nginx-ingress</text>

  <rect x="40" y="96" width="140" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="122" font-size="12" fill="#5b6b7c" text-anchor="middle">维护方</text>
  <rect x="180" y="96" width="340" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="350" y="122" font-size="12" fill="#1f2b38" text-anchor="middle">Kubernetes 社区（SIG Network）</text>
  <rect x="520" y="96" width="340" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="122" font-size="12" fill="#1f2b38" text-anchor="middle">NGINX / F5 官方</text>

  <rect x="40" y="138" width="140" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="164" font-size="12" fill="#5b6b7c" text-anchor="middle">仓库与镜像</text>
  <rect x="180" y="138" width="340" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="350" y="164" font-size="12" fill="#1f2b38" text-anchor="middle">kubernetes/ingress-nginx</text>
  <rect x="520" y="138" width="340" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="164" font-size="12" fill="#1f2b38" text-anchor="middle">nginxinc/kubernetes-ingress</text>

  <rect x="40" y="180" width="140" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="206" font-size="12" fill="#5b6b7c" text-anchor="middle">注解前缀</text>
  <rect x="180" y="180" width="340" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="350" y="206" font-size="12" fill="#1f2b38" text-anchor="middle">nginx.ingress.kubernetes.io/*</text>
  <rect x="520" y="180" width="340" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="206" font-size="12" fill="#1f2b38" text-anchor="middle">nginx.org/*</text>

  <rect x="40" y="222" width="140" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="248" font-size="12" fill="#5b6b7c" text-anchor="middle">IngressClass</text>
  <rect x="180" y="222" width="340" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="350" y="248" font-size="12" fill="#1f2b38" text-anchor="middle">nginx（可自定义）</text>
  <rect x="520" y="222" width="340" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="248" font-size="12" fill="#1f2b38" text-anchor="middle">nginx（可自定义）</text>

  <rect x="40" y="264" width="140" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="290" font-size="12" fill="#5b6b7c" text-anchor="middle">扩展资源</text>
  <rect x="180" y="264" width="340" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="350" y="290" font-size="12" fill="#1f2b38" text-anchor="middle">无内置 CRD，靠 ConfigMap 调优</text>
  <rect x="520" y="264" width="340" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="290" font-size="12" fill="#1f2b38" text-anchor="middle">VirtualServer / VirtualServerRoute</text>

  <rect x="40" y="306" width="140" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="332" font-size="12" fill="#5b6b7c" text-anchor="middle">典型入口</text>
  <rect x="180" y="306" width="340" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="350" y="332" font-size="12" fill="#1f2b38" text-anchor="middle">deploy/ 清单与 Helm 官方 chart</text>
  <rect x="520" y="306" width="340" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="332" font-size="12" fill="#1f2b38" text-anchor="middle">deployments/ 清单与 Helm chart</text>

  <rect x="40" y="366" width="820" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="400" font-size="12" fill="#1f2b38">两套项目功能重叠但互不兼容：混用注解不会生效，也不会明确报错，选型后应统一镜像、注解前缀与 ConfigMap 名称。</text>
</svg>
