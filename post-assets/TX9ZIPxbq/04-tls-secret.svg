<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Ingress TLS：证书、Secret 与 HTTPS 接入</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Ingress TLS：证书、Secret 与 HTTPS 接入</text>

  <rect x="40" y="54" width="820" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="82" font-size="13" fill="#1f2b38">① 证书与私钥</text>
  <text x="60" y="106" font-size="12" fill="#5b6b7c">openssl 生成自签名证书，或由 CA 机构签发；文件为 tls.crt 与 tls.key</text>

  <line x1="70" y1="124" x2="70" y2="154" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="465" y="144" font-size="11" fill="#5b6b7c" text-anchor="middle">kubectl create secret tls happylau-sslkey --cert=tls.crt --key=tls.key</text>

  <rect x="40" y="158" width="820" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="186" font-size="13" fill="#1f2b38">② Secret（type: kubernetes.io/tls）</text>
  <text x="60" y="210" font-size="12" fill="#5b6b7c">data.tls.crt 与 data.tls.key 以 base64 保存，必须与 Ingress 在同一命名空间</text>

  <line x1="70" y1="228" x2="70" y2="258" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="465" y="248" font-size="11" fill="#5b6b7c" text-anchor="middle">spec.tls.secretName 引用；证书域名需与 tls.hosts 及 rules.host 一致</text>

  <rect x="40" y="262" width="820" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="290" font-size="13" fill="#1f2b38">③ Ingress 引用 Secret</text>
  <text x="60" y="314" font-size="12" fill="#5b6b7c">spec.tls.hosts 列出域名，spec.tls.secretName 指向上面的 Secret</text>

  <rect x="40" y="354" width="400" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="240" y="380" font-size="12" fill="#1f2b38" text-anchor="middle">TLS 相关注解</text>
  <text x="240" y="402" font-size="11" fill="#5b6b7c" text-anchor="middle">ssl-redirect / force-ssl-redirect</text>

  <rect x="460" y="354" width="400" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="660" y="380" font-size="12" fill="#1f2b38" text-anchor="middle">加密范围</text>
  <text x="660" y="402" font-size="11" fill="#5b6b7c" text-anchor="middle">Client→Controller 为 HTTPS，Controller→Pod 默认仍为 HTTP</text>
</svg>
