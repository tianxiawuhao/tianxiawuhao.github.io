<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Nginx Ingress 配置要点：ConfigMap 与 Annotations</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Nginx Ingress 配置要点：ConfigMap 与 Annotations</text>

  <rect x="40" y="58" width="390" height="156" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="86" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">ConfigMap：全局默认参数</text>
  <text x="235" y="112" font-size="12" fill="#5b6b7c" text-anchor="middle">被所有 Ingress 共同继承</text>
  <text x="235" y="134" font-size="12" fill="#5b6b7c" text-anchor="middle">nginx-ingress：nginx-config</text>
  <text x="235" y="156" font-size="12" fill="#5b6b7c" text-anchor="middle">ingress-nginx：controller-configmap</text>
  <text x="235" y="178" font-size="12" fill="#5b6b7c" text-anchor="middle">proxy-connect-timeout: "10s"</text>
  <text x="235" y="200" font-size="12" fill="#5b6b7c" text-anchor="middle">client-max-body-size: "3m"</text>

  <rect x="470" y="58" width="390" height="156" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="86" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Annotations：单个 Ingress 生效</text>
  <text x="665" y="112" font-size="12" fill="#5b6b7c" text-anchor="middle">只影响当前 Ingress 对象</text>
  <text x="665" y="134" font-size="12" fill="#5b6b7c" text-anchor="middle">与 ConfigMap 冲突时优先级更高</text>
  <text x="665" y="156" font-size="12" fill="#5b6b7c" text-anchor="middle">nginx-ingress 前缀：nginx.org/*</text>
  <text x="665" y="178" font-size="12" fill="#5b6b7c" text-anchor="middle">ingress-nginx 前缀：nginx.ingress.kubernetes.io/*</text>
  <text x="665" y="200" font-size="12" fill="#5b6b7c" text-anchor="middle">nginx.org/lb-method: "round_robin"</text>

  <rect x="40" y="240" width="270" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="175" y="268" font-size="13" fill="#1f2b38" text-anchor="middle">重写与跳转</text>
  <text x="175" y="294" font-size="11" fill="#5b6b7c" text-anchor="middle">rewrite-target: /</text>
  <text x="175" y="316" font-size="11" fill="#5b6b7c" text-anchor="middle">ssl-redirect: "true"</text>

  <rect x="315" y="240" width="270" height="96" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="268" font-size="13" fill="#1f2b38" text-anchor="middle">超时与请求体</text>
  <text x="450" y="294" font-size="11" fill="#5b6b7c" text-anchor="middle">proxy-connect-timeout: 30s</text>
  <text x="450" y="316" font-size="11" fill="#5b6b7c" text-anchor="middle">client-max-body-size: 10m</text>

  <rect x="590" y="240" width="270" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="725" y="268" font-size="13" fill="#1f2b38" text-anchor="middle">后端与重试</text>
  <text x="725" y="294" font-size="11" fill="#5b6b7c" text-anchor="middle">backend-protocol: "HTTPS"</text>
  <text x="725" y="316" font-size="11" fill="#5b6b7c" text-anchor="middle">proxy-next-upstream: error</text>

  <rect x="40" y="356" width="820" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="382" font-size="12" fill="#1f2b38">两套项目的 IngressClass 常都叫 nginx，同一集群同时安装时必须改名区分，</text>
  <text x="60" y="404" font-size="12" fill="#1f2b38">否则 Ingress 可能被错误的控制器接管，或两边都不处理。</text>
</svg>
