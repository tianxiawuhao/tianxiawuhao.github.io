<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Ingress 资源与 Ingress Controller 的关系</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Ingress 资源与 Ingress Controller 的关系</text>

  <rect x="30" y="52" width="840" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="76" font-size="12" fill="#5b6b7c">控制面：规则由 API Server 存储，Controller 监听后生效</text>

  <rect x="50" y="90" width="200" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="120" font-size="13" fill="#1f2b38" text-anchor="middle">kubectl apply -f</text>
  <text x="150" y="142" font-size="12" fill="#5b6b7c" text-anchor="middle">提交 YAML 清单</text>

  <line x1="250" y1="126" x2="298" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="300" y="90" width="180" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="390" y="120" font-size="13" fill="#1f2b38" text-anchor="middle">API Server</text>
  <text x="390" y="142" font-size="12" fill="#5b6b7c" text-anchor="middle">校验并写入 etcd</text>

  <line x1="480" y1="126" x2="526" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="503" y="118" font-size="11" fill="#5b6b7c" text-anchor="middle">watch</text>

  <rect x="530" y="90" width="330" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="695" y="116" font-size="13" fill="#1f2b38" text-anchor="middle">Ingress 资源（规则声明）</text>
  <text x="695" y="138" font-size="11" fill="#5b6b7c" text-anchor="middle">host / path / pathType / backend + IngressClass</text>

  <line x1="695" y1="162" x2="695" y2="196" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="695" y1="196" x2="392" y2="196" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="392" y1="196" x2="392" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="543" y="190" font-size="11" fill="#5b6b7c" text-anchor="middle">Controller 持续监听规则变化</text>

  <rect x="50" y="230" width="330" height="86" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="215" y="258" font-size="13" fill="#1f2b38" text-anchor="middle">Ingress Controller（Pod）</text>
  <text x="215" y="280" font-size="12" fill="#5b6b7c" text-anchor="middle">内部运行 nginx 进程，监听 80 / 443</text>
  <text x="215" y="300" font-size="12" fill="#5b6b7c" text-anchor="middle">按 IngressClass 决定处理哪些规则</text>

  <line x1="380" y1="273" x2="470" y2="273" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="425" y="265" font-size="11" fill="#5b6b7c" text-anchor="middle">渲染配置</text>

  <rect x="475" y="230" width="385" height="86" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="667" y="258" font-size="13" fill="#1f2b38" text-anchor="middle">生成 nginx.conf 并 reload</text>
  <text x="667" y="280" font-size="12" fill="#5b6b7c" text-anchor="middle">/etc/nginx/conf.d/&lt;命名空间&gt;-&lt;Ingress 名&gt;.conf</text>
  <text x="667" y="300" font-size="12" fill="#5b6b7c" text-anchor="middle">校验通过后 SIGHUP 平滑生效，无需重启 Pod</text>

  <rect x="50" y="340" width="810" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="70" y="366" font-size="12" fill="#1f2b38">Ingress 只是规则声明，自身不监听端口、不转发流量；真正干活的组件是 Ingress Controller。</text>
  <text x="70" y="390" font-size="12" fill="#1f2b38">因此没有 Controller 时创建 Ingress 毫无效果；多个 Controller 共存时需用 IngressClass 划分职责。</text>
</svg>
