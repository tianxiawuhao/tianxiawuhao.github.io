<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>宿主机定时清理容器日志的整体流程</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">图1 宿主机定时清理容器日志流程</text>
  <rect x="30" y="100" width="180" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="132" text-anchor="middle" font-size="13" fill="#1f2b38">编写清理脚本</text>
  <text x="120" y="158" text-anchor="middle" font-size="12" fill="#5b6b7c">/opt/auto-del-log.sh</text>
  <text x="120" y="182" text-anchor="middle" font-size="12" fill="#5b6b7c">find -mtime +5</text>
  <rect x="250" y="100" width="180" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="340" y="132" text-anchor="middle" font-size="13" fill="#1f2b38">手动验证效果</text>
  <text x="340" y="158" text-anchor="middle" font-size="12" fill="#5b6b7c">docker exec 执行</text>
  <text x="340" y="182" text-anchor="middle" font-size="12" fill="#5b6b7c">先查后删</text>
  <rect x="470" y="100" width="180" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="560" y="132" text-anchor="middle" font-size="13" fill="#1f2b38">宿主机定时器</text>
  <text x="560" y="158" text-anchor="middle" font-size="12" fill="#5b6b7c">crontab -e</text>
  <text x="560" y="182" text-anchor="middle" font-size="12" fill="#5b6b7c">02 4 * * *</text>
  <rect x="690" y="100" width="180" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="780" y="132" text-anchor="middle" font-size="13" fill="#1f2b38">自动清理</text>
  <text x="780" y="158" text-anchor="middle" font-size="12" fill="#5b6b7c">老日志被删除</text>
  <text x="780" y="182" text-anchor="middle" font-size="12" fill="#5b6b7c">磁盘空间释放</text>
  <line x1="214" y1="155" x2="246" y2="155" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="434" y1="155" x2="466" y2="155" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="654" y1="155" x2="686" y2="155" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#5b6b7c">脚本先在容器内验证通过，再交给宿主机 cron 定时调用，容器本身无需安装定时服务</text>
</svg>
