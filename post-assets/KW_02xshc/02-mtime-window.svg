<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>-mtime 加号与减号的时间窗口对比</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">图2 -mtime +5 与 -mtime -5 的删除范围对比</text>
  <rect x="70" y="58" width="760" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="89" text-anchor="middle" font-size="13" fill="#1f2b38">老日志（修改时间早于 5 天）：-mtime +5 负责清理</text>
  <rect x="70" y="150" width="760" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="181" text-anchor="middle" font-size="13" fill="#1f2b38">新日志（近 5 天内）：-mtime -5 会误删，正确写法不应碰它</text>
  <line x1="70" y1="252" x2="846" y2="252" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="640" y1="242" x2="640" y2="262" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="82" y="278" text-anchor="start" font-size="12" fill="#5b6b7c">更早</text>
  <text x="640" y="278" text-anchor="middle" font-size="12" fill="#5b6b7c">5 天前</text>
  <text x="846" y="278" text-anchor="end" font-size="12" fill="#5b6b7c">现在</text>
  <text x="450" y="315" text-anchor="middle" font-size="12" fill="#1f2b38">正确用法：-mtime +5 只删 5 天以前的老日志；写成 -mtime -5 会反过来删掉最新日志</text>
</svg>
