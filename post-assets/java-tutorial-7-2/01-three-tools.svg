<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>文本处理三剑客的分工：grep 挑行、sed 改行、awk 拆列</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">文本处理流水线：按行进来的数据，各管一段</text>

  <rect x="330" y="52" width="240" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="79" font-size="12.5" fill="#1f2b38" text-anchor="middle">原始文本：日志 / 配置 / 列表</text>
  <line x1="450" y1="100" x2="450" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="130" width="250" height="140" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="155" y="164" font-size="19" font-weight="700" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">grep</text>
  <text x="155" y="190" font-size="12.5" fill="#1f2b38" text-anchor="middle">挑行：按整行内容筛选</text>
  <text x="155" y="216" font-size="11" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">grep -n -C 3 'ERROR'</text>
  <text x="155" y="244" font-size="11.5" fill="#5b6b7c" text-anchor="middle">不修改内容，只决定留哪行</text>

  <rect x="325" y="130" width="250" height="140" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="164" font-size="19" font-weight="700" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sed</text>
  <text x="450" y="190" font-size="12.5" fill="#1f2b38" text-anchor="middle">改行：替换 / 删除 / 插入</text>
  <text x="450" y="216" font-size="11" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sed -i.bak 's/old/new/g'</text>
  <text x="450" y="244" font-size="11.5" fill="#5b6b7c" text-anchor="middle">原地改前先预览、先备份</text>

  <rect x="620" y="130" width="250" height="140" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="745" y="164" font-size="19" font-weight="700" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">awk</text>
  <text x="745" y="190" font-size="12.5" fill="#1f2b38" text-anchor="middle">拆列：按字段计算统计</text>
  <text x="745" y="216" font-size="11" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">awk -F: '{print $1, $3}'</text>
  <text x="745" y="244" font-size="11.5" fill="#5b6b7c" text-anchor="middle">$1 列、$0 整行、NF / NR</text>

  <line x1="285" y1="200" x2="320" y2="200" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="580" y1="200" x2="615" y2="200" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="274" x2="450" y2="298" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="302" width="780" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="326" font-size="12.5" fill="#1f2b38" text-anchor="middle">管道组合：grep 缩小范围 → awk 抽列统计 → sort | uniq -c | sort -rn 取前几名</text>
  <text x="450" y="346" font-size="12" fill="#5b6b7c" text-anchor="middle">三者都逐行读取、都能接管道，可以像积木一样拼起来</text>
</svg>
