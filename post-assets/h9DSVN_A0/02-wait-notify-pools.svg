<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>wait/notify 与等待池、锁池的转换关系</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">wait/notify 与等待池、锁池的转换关系</text>
<rect x="30" y="110" width="140" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="100" y="140" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">持有锁的线程</text>
<text x="100" y="160" font-size="11" fill="#5b6b7c" text-anchor="middle">RUNNING</text>
<rect x="250" y="110" width="160" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="330" y="136" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">等待池</text>
<text x="330" y="158" font-size="11" fill="#5b6b7c" text-anchor="middle">Wait Set</text>
<rect x="490" y="110" width="160" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="570" y="136" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">锁池</text>
<text x="570" y="158" font-size="11" fill="#5b6b7c" text-anchor="middle">Entry List</text>
<rect x="730" y="110" width="140" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="800" y="140" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">重新获得锁</text>
<text x="800" y="160" font-size="11" fill="#5b6b7c" text-anchor="middle">RUNNABLE</text>
<line x1="170" y1="145" x2="246" y2="145" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="208" y="132" font-size="11.5" fill="#5b6b7c" text-anchor="middle">wait()</text>
<text x="208" y="168" font-size="11.5" fill="#5b6b7c" text-anchor="middle">释放锁</text>
<line x1="410" y1="145" x2="486" y2="145" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="448" y="132" font-size="11.5" fill="#5b6b7c" text-anchor="middle">notify()</text>
<text x="448" y="168" font-size="11.5" fill="#5b6b7c" text-anchor="middle">notifyAll()</text>
<line x1="650" y1="145" x2="726" y2="145" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="688" y="132" font-size="11.5" fill="#5b6b7c" text-anchor="middle">竞争锁成功</text>
<text x="688" y="168" font-size="11.5" fill="#5b6b7c" text-anchor="middle">获得锁</text>
<path d="M 800 180 L 800 240 L 100 240 L 100 184" fill="none" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="450" y="232" font-size="11.5" fill="#5b6b7c" text-anchor="middle">run() 继续执行</text>
<rect x="30" y="285" width="400" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="46" y="310" font-size="12.5" font-weight="700" fill="#1f2b38">等待池：调用 wait() 之后</text>
<text x="46" y="334" font-size="11.5" fill="#5b6b7c">线程释放对象锁并进入等待池；</text>
<text x="46" y="354" font-size="11.5" fill="#5b6b7c">池中线程不参与锁竞争。</text>
<rect x="470" y="285" width="400" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="486" y="310" font-size="12.5" font-weight="700" fill="#1f2b38">锁池：等待获取锁</text>
<text x="486" y="334" font-size="11.5" fill="#5b6b7c">notify()/notifyAll() 把线程移入；</text>
<text x="486" y="354" font-size="11.5" fill="#5b6b7c">抢到锁后才能继续执行。</text>
</svg>
