<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 线程五态转换图</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Java 线程状态转换（五态模型）</text>

  <rect x="40" y="80" width="130" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="105" y="114" font-size="13" fill="#1f2b38" text-anchor="middle">新建 (new)</text>

  <rect x="225" y="80" width="130" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="290" y="114" font-size="13" fill="#1f2b38" text-anchor="middle">可运行 (就绪)</text>

  <rect x="410" y="80" width="130" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="475" y="114" font-size="13" fill="#1f2b38" text-anchor="middle">运行 (running)</text>

  <rect x="620" y="80" width="130" height="56" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="685" y="114" font-size="13" fill="#1f2b38" text-anchor="middle">死亡 (dead)</text>

  <rect x="410" y="220" width="130" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="475" y="254" font-size="13" fill="#1f2b38" text-anchor="middle">阻塞 (blocked)</text>

  <line x1="170" y1="108" x2="223" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="196" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">start()</text>

  <line x1="355" y1="108" x2="408" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="381" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">获得 CPU</text>

  <line x1="540" y1="108" x2="618" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="579" y="96" font-size="11" fill="#5b6b7c" text-anchor="middle">run() 结束</text>

  <path d="M 465 136 V 162 H 290 V 138" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="380" y="182" font-size="11" fill="#5b6b7c" text-anchor="middle">时间片用完 / yield()</text>

  <line x1="480" y1="136" x2="480" y2="218" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="492" y="180" font-size="11" fill="#5b6b7c">wait() / sleep() / join() / I/O / 抢锁失败</text>

  <path d="M 410 248 H 240 V 138" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="325" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">被唤醒 / 超时 / 中断</text>

  <text x="450" y="310" font-size="12" fill="#5b6b7c" text-anchor="middle">阻塞三种情形：等待阻塞（wait 进入等待队列）｜同步阻塞（抢锁失败进入锁池）</text>
  <text x="450" y="334" font-size="12" fill="#5b6b7c" text-anchor="middle">其他阻塞（sleep()/join()/I/O，条件解除后回到就绪态）</text>
</svg>
