<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>Java 线程生命周期与五种状态转换</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Java 线程生命周期与五种状态转换</text>
<rect x="40" y="120" width="100" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="90" y="145" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">新建</text>
<text x="90" y="163" font-size="11" fill="#5b6b7c" text-anchor="middle">NEW</text>
<rect x="230" y="120" width="100" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="280" y="145" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">就绪</text>
<text x="280" y="163" font-size="11" fill="#5b6b7c" text-anchor="middle">READY</text>
<rect x="420" y="120" width="100" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="470" y="145" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">运行</text>
<text x="470" y="163" font-size="11" fill="#5b6b7c" text-anchor="middle">RUNNING</text>
<rect x="700" y="120" width="100" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="750" y="145" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">死亡</text>
<text x="750" y="163" font-size="11" fill="#5b6b7c" text-anchor="middle">TERMINATED</text>
<line x1="140" y1="148" x2="226" y2="148" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="183" y="140" font-size="11.5" fill="#5b6b7c" text-anchor="middle">start()</text>
<line x1="330" y1="141" x2="416" y2="141" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="373" y="132" font-size="11.5" fill="#5b6b7c" text-anchor="middle">被调度</text>
<line x1="420" y1="163" x2="334" y2="163" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="377" y="186" font-size="11.5" fill="#5b6b7c" text-anchor="middle">yield()/时间片用完</text>
<line x1="520" y1="148" x2="696" y2="148" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="608" y="140" font-size="11.5" fill="#5b6b7c" text-anchor="middle">run() 结束 / 异常退出</text>
<line x1="470" y1="176" x2="470" y2="240" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="480" y="214" font-size="11.5" fill="#5b6b7c">wait() / sleep() / join() / IO</text>
<rect x="400" y="244" width="140" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="470" y="269" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">阻塞</text>
<text x="470" y="287" font-size="11" fill="#5b6b7c" text-anchor="middle">BLOCKED</text>
<path d="M 400 272 L 280 272 L 280 182" fill="none" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="335" y="262" font-size="11.5" fill="#5b6b7c" text-anchor="middle">条件满足/超时</text>
<rect x="240" y="320" width="460" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="256" y="344" font-size="11.5" fill="#1f2b38">等待阻塞：wait() 进入等待队列</text>
<text x="256" y="364" font-size="11.5" fill="#5b6b7c">同步阻塞：synchronized 抢锁失败　其他：sleep()/join()/IO</text>
</svg>
