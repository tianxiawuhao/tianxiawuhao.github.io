<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>sleep() 与 wait() 对比图</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">sleep() 与 wait() 的区别</text>

  <rect x="40" y="55" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="40" y="55" width="400" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="82" font-size="15" font-weight="700" fill="#2f6fd0" text-anchor="middle">sleep()（Thread 静态方法）</text>

  <rect x="460" y="55" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="460" y="55" width="400" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="82" font-size="15" font-weight="700" fill="#2e9e5b" text-anchor="middle">wait()（Object 实例方法）</text>

  <rect x="60" y="110" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="74" y="140" font-size="12" fill="#1f2b38">所属类：Thread 类的静态方法</text>
  <rect x="60" y="166" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="74" y="196" font-size="12" fill="#1f2b38">是否释放锁：不释放，继续持有</text>
  <rect x="60" y="222" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="74" y="252" font-size="12" fill="#1f2b38">唤醒方式：到时自动苏醒或 interrupt</text>
  <rect x="60" y="278" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="74" y="308" font-size="12" fill="#1f2b38">使用场景：暂停执行、让出 CPU</text>

  <rect x="480" y="110" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="494" y="140" font-size="12" fill="#1f2b38">所属类：Object 类的实例方法</text>
  <rect x="480" y="166" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="494" y="196" font-size="12" fill="#1f2b38">是否释放锁：立即释放对象锁</text>
  <rect x="480" y="222" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="494" y="252" font-size="12" fill="#1f2b38">唤醒方式：notify()/notifyAll() 或超时</text>
  <rect x="480" y="278" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="494" y="308" font-size="12" fill="#1f2b38">使用场景：线程间通信、等待条件成立</text>

  <text x="450" y="378" font-size="12" fill="#5b6b7c" text-anchor="middle">两者都能暂停线程，核心区别在于是否释放锁、以及由谁负责把它唤醒。</text>
</svg>
