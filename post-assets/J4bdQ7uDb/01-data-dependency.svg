<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>写后读、写后写、读后写三种数据依赖</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">三种数据依赖：重排序就会改变执行结果</text>

  <rect x="20" y="60" width="260" height="190" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="150" y="88" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">写后读（RAW）</text>
  <rect x="38" y="100" width="224" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="123" font-size="12.5" fill="#1f2b38" text-anchor="middle">操作1：a = 1;（写）</text>
  <line x1="150" y1="138" x2="150" y2="166" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="160" y="157" font-size="11" fill="#e08a1e">不可交换</text>
  <rect x="38" y="168" width="224" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="150" y="191" font-size="12.5" fill="#1f2b38" text-anchor="middle">操作2：b = a;（读）</text>

  <rect x="320" y="60" width="260" height="190" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="88" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">写后写（WAW）</text>
  <rect x="338" y="100" width="224" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="123" font-size="12.5" fill="#1f2b38" text-anchor="middle">操作1：a = 1;（写）</text>
  <line x1="450" y1="138" x2="450" y2="166" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="460" y="157" font-size="11" fill="#e08a1e">不可交换</text>
  <rect x="338" y="168" width="224" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="191" font-size="12.5" fill="#1f2b38" text-anchor="middle">操作2：a = 2;（写）</text>

  <rect x="620" y="60" width="260" height="190" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="750" y="88" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">读后写（WAR）</text>
  <rect x="638" y="100" width="224" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="750" y="123" font-size="12.5" fill="#1f2b38" text-anchor="middle">操作1：a = b;（读）</text>
  <line x1="750" y1="138" x2="750" y2="166" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="760" y="157" font-size="11" fill="#e08a1e">不可交换</text>
  <rect x="638" y="168" width="224" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="750" y="191" font-size="12.5" fill="#1f2b38" text-anchor="middle">操作2：b = 1;（写）</text>

  <text x="450" y="290" font-size="12" fill="#5b6b7c" text-anchor="middle">编译器和处理器会遵守数据依赖性，不会重排序存在数据依赖关系的两个操作。</text>
</svg>
