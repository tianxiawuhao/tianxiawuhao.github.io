<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三类重排序与对应的阻止手段</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">三类重排序与对应的阻止手段</text>

  <rect x="30" y="70" width="310" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="102" font-size="13" fill="#1f2b38" text-anchor="middle">编译器重排序（源码 → 字节码）</text>
  <line x1="348" y1="96" x2="512" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="520" y="70" width="350" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="695" y="102" font-size="12.5" fill="#1f2b38" text-anchor="middle">禁止编译器重排序：编译器屏障</text>

  <rect x="30" y="150" width="310" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="182" font-size="13" fill="#1f2b38" text-anchor="middle">指令重排序（处理器乱序执行）</text>
  <line x1="348" y1="176" x2="512" y2="176" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="520" y="150" width="350" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="695" y="182" font-size="12.5" fill="#1f2b38" text-anchor="middle">内存屏障：LoadLoad / StoreStore</text>

  <rect x="30" y="230" width="310" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="262" font-size="13" fill="#1f2b38" text-anchor="middle">内存系统重排序（写缓存延迟刷新）</text>
  <line x1="348" y1="256" x2="512" y2="256" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="520" y="230" width="350" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="695" y="262" font-size="12.5" fill="#1f2b38" text-anchor="middle">内存屏障 + Lock 前缀指令</text>

  <text x="450" y="310" font-size="12" fill="#5b6b7c" text-anchor="middle">重排序会让共享变量在线程间不可见，因此需要按需禁止。</text>
</svg>
