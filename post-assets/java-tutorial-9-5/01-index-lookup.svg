<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>二级索引查询的回表过程与覆盖索引</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">二级索引查询：回表与覆盖索引</text>
  <rect x="40" y="52" width="340" height="214" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="76" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">二级索引 idx_user_time</text>
  <rect x="60" y="88" width="300" height="64" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="114" font-size="11" fill="#1f2b38" text-anchor="middle">叶子节点只存索引列 + 主键值</text>
  <text x="210" y="136" font-size="11" fill="#5b6b7c" text-anchor="middle">user_id、created_at、id</text>
  <rect x="60" y="168" width="300" height="64" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="194" font-size="11" fill="#1f2b38" text-anchor="middle">先拿到主键 id = 7</text>
  <text x="210" y="216" font-size="11" fill="#e08a1e" text-anchor="middle">但 amount 不在索引里</text>
  <line x1="382" y1="160" x2="466" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="424" y="146" font-size="11" fill="#e08a1e" text-anchor="middle">回表</text>
  <text x="424" y="182" font-size="11" fill="#5b6b7c" text-anchor="middle">再查一次</text>
  <rect x="470" y="52" width="390" height="214" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="76" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">聚簇索引（主键 id）</text>
  <rect x="490" y="112" width="350" height="96" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="148" font-size="11" fill="#1f2b38" text-anchor="middle">按 id = 7 定位到叶子节点</text>
  <text x="665" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">叶子存整行 → 取到 amount</text>
  <rect x="40" y="286" width="820" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="312" font-size="11" fill="#1f2b38" text-anchor="middle">覆盖索引：SELECT 所需列全部包含在索引中 → 免回表</text>
  <text x="450" y="336" font-size="11" fill="#5b6b7c" text-anchor="middle">最左前缀决定命中列，范围列必须放在等值列之后</text>
  <text x="450" y="378" font-size="11" fill="#5b6b7c" text-anchor="middle">B+ 树 16KB 页可装数百个键，三到四层覆盖千万行，一次等值查询约 3～4 次磁盘 I/O</text>
</svg>
