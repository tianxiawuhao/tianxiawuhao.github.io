<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四个隔离级别与三类读异常</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">隔离级别与三类读异常（InnoDB 默认 REPEATABLE READ）</text>
  <rect x="40" y="52" width="250" height="38" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="290" y="52" width="190" height="38" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="480" y="52" width="190" height="38" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="670" y="52" width="190" height="38" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="76" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">隔离级别</text>
  <text x="385" y="76" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">脏读</text>
  <text x="575" y="76" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">不可重复读</text>
  <text x="765" y="76" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">幻读</text>
  <rect x="40" y="90" width="250" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="290" y="90" width="190" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="480" y="90" width="190" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="670" y="90" width="190" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="114" font-size="11" fill="#1f2b38" text-anchor="middle">READ UNCOMMITTED</text>
  <text x="385" y="114" font-size="11" fill="#e08a1e" text-anchor="middle">可能</text>
  <text x="575" y="114" font-size="11" fill="#e08a1e" text-anchor="middle">可能</text>
  <text x="765" y="114" font-size="11" fill="#e08a1e" text-anchor="middle">可能</text>
  <rect x="40" y="128" width="250" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="290" y="128" width="190" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="480" y="128" width="190" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="670" y="128" width="190" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="152" font-size="11" fill="#1f2b38" text-anchor="middle">READ COMMITTED</text>
  <text x="385" y="152" font-size="11" fill="#2e9e5b" text-anchor="middle">不可能</text>
  <text x="575" y="152" font-size="11" fill="#e08a1e" text-anchor="middle">可能</text>
  <text x="765" y="152" font-size="11" fill="#e08a1e" text-anchor="middle">可能</text>
  <rect x="40" y="166" width="250" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="290" y="166" width="190" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="480" y="166" width="190" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="670" y="166" width="190" height="38" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="190" font-size="11" fill="#1f2b38" text-anchor="middle">REPEATABLE READ</text>
  <text x="385" y="190" font-size="11" fill="#2e9e5b" text-anchor="middle">不可能</text>
  <text x="575" y="190" font-size="11" fill="#2e9e5b" text-anchor="middle">不可能</text>
  <text x="765" y="190" font-size="11" fill="#2f6fd0" text-anchor="middle">InnoDB 基本避免</text>
  <rect x="40" y="204" width="250" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="290" y="204" width="190" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="480" y="204" width="190" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="670" y="204" width="190" height="38" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="228" font-size="11" fill="#1f2b38" text-anchor="middle">SERIALIZABLE</text>
  <text x="385" y="228" font-size="11" fill="#2e9e5b" text-anchor="middle">不可能</text>
  <text x="575" y="228" font-size="11" fill="#2e9e5b" text-anchor="middle">不可能</text>
  <text x="765" y="228" font-size="11" fill="#2e9e5b" text-anchor="middle">不可能</text>
  <rect x="40" y="262" width="820" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="288" font-size="11" fill="#1f2b38" text-anchor="middle">InnoDB 的 RR：快照读靠 MVCC 保证一致性，当前读靠临键锁（记录锁 + 间隙锁）锁住范围</text>
  <text x="450" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">所以「RR 无法防幻读」是照搬 SQL 标准的说法，在 InnoDB 里并不准确</text>
  <text x="450" y="352" font-size="11" fill="#5b6b7c" text-anchor="middle">Oracle / SQL Server 默认 READ COMMITTED · MySQL InnoDB 默认 REPEATABLE READ</text>
  <text x="450" y="380" font-size="11" fill="#5b6b7c" text-anchor="middle">死锁：两事务以相反顺序持锁并互相申请 → InnoDB 检测后回滚代价较小的事务</text>
</svg>
