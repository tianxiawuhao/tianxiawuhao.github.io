<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>哈希桶长度分布与树化阈值 8 的关系</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">哈希桶内节点数 k 的出现概率（λ ≈ 0.5）</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#5b6b7c">前提：hashCode 分布均匀、负载因子 0.75；数值摘自 JDK HashMap 源码注释</text>

  <rect x="60" y="70" width="370" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="78" y="100" font-size="12" fill="#5b6b7c">桶内节点数 k</text>
  <text x="340" y="100" font-size="12" fill="#5b6b7c">出现概率</text>
  <text x="90" y="126" font-size="12" fill="#1f2b38">k = 0</text>
  <text x="340" y="126" font-size="12" fill="#1f2b38">0.60653066</text>
  <text x="90" y="156" font-size="12" fill="#1f2b38">k = 1</text>
  <text x="340" y="156" font-size="12" fill="#1f2b38">0.30326533</text>
  <text x="90" y="186" font-size="12" fill="#1f2b38">k = 2</text>
  <text x="340" y="186" font-size="12" fill="#1f2b38">0.07581633</text>
  <text x="90" y="216" font-size="12" fill="#1f2b38">k = 3</text>
  <text x="340" y="216" font-size="12" fill="#1f2b38">0.01263606</text>
  <text x="90" y="246" font-size="12" fill="#1f2b38">k = 4</text>
  <text x="340" y="246" font-size="12" fill="#1f2b38">0.00157952</text>
  <text x="90" y="276" font-size="12" fill="#1f2b38">k = 5</text>
  <text x="340" y="276" font-size="12" fill="#1f2b38">0.00015795</text>
  <text x="90" y="306" font-size="12" fill="#1f2b38">k = 6</text>
  <text x="340" y="306" font-size="12" fill="#1f2b38">0.00001316</text>
  <text x="90" y="336" font-size="12" fill="#1f2b38">k = 7</text>
  <text x="340" y="336" font-size="12" fill="#1f2b38">0.00000094</text>
  <rect x="70" y="348" width="350" height="30" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="90" y="368" font-size="12" font-weight="700" fill="#1f2b38">k = 8</text>
  <text x="340" y="368" font-size="12" font-weight="700" fill="#1f2b38">0.00000006</text>
  <text x="90" y="392" font-size="11" fill="#5b6b7c">k &gt; 8：小于千万分之一</text>

  <rect x="460" y="70" width="380" height="190" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="650" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">阈值为什么取 8？</text>
  <text x="482" y="130" font-size="12" fill="#1f2b38">8 次碰撞的概率约 0.00000006，</text>
  <text x="482" y="162" font-size="12" fill="#1f2b38">即千万分之一，几乎不会出现；</text>
  <text x="482" y="194" font-size="12" fill="#1f2b38">但一旦出现，链表查找要 O(n)，</text>
  <text x="482" y="226" font-size="12" fill="#1f2b38">转成红黑树后降为 O(log n)。</text>

  <rect x="460" y="280" width="380" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="650" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">相关常量（JDK 8）</text>
  <text x="482" y="334" font-size="12" fill="#1f2b38">TREEIFY_THRESHOLD = 8</text>
  <text x="482" y="360" font-size="12" fill="#1f2b38">UNTREEIFY_THRESHOLD = 6</text>
  <text x="482" y="386" font-size="12" fill="#1f2b38">MIN_TREEIFY_CAPACITY = 64</text>
</svg>
