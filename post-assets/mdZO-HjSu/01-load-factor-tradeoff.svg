<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>负载因子在空闲空间与哈希冲突之间的折中</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">负载因子：空闲空间与哈希冲突的折中</text>

  <rect x="60" y="60" width="220" height="230" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">负载因子 0.5</text>
  <text x="78" y="124" font-size="12" fill="#5b6b7c">空闲空间 50%</text>
  <rect x="78" y="134" width="184" height="16" rx="4" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1"/>
  <rect x="78" y="134" width="92" height="16" rx="4" fill="#2f6fd0"/>
  <text x="78" y="192" font-size="12" fill="#5b6b7c">哈希冲突概率 低</text>
  <rect x="78" y="202" width="184" height="16" rx="4" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1"/>
  <rect x="78" y="202" width="55" height="16" rx="4" fill="#e08a1e"/>
  <text x="78" y="250" font-size="11" fill="#5b6b7c">空间浪费大，查询快</text>

  <rect x="340" y="60" width="220" height="230" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="450" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">负载因子 0.75（默认）</text>
  <text x="358" y="124" font-size="12" fill="#5b6b7c">空闲空间 25%</text>
  <rect x="358" y="134" width="184" height="16" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <rect x="358" y="134" width="46" height="16" rx="4" fill="#2f6fd0"/>
  <text x="358" y="192" font-size="12" fill="#5b6b7c">哈希冲突概率 中</text>
  <rect x="358" y="202" width="184" height="16" rx="4" fill="#ffffff" stroke="#c8d3e0" stroke-width="1"/>
  <rect x="358" y="202" width="110" height="16" rx="4" fill="#e08a1e"/>
  <text x="358" y="250" font-size="11" fill="#5b6b7c">两者折中，默认取值</text>

  <rect x="620" y="60" width="220" height="230" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="730" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">负载因子 1.0</text>
  <text x="638" y="124" font-size="12" fill="#5b6b7c">空闲空间 0%</text>
  <rect x="638" y="134" width="184" height="16" rx="4" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1"/>
  <text x="638" y="192" font-size="12" fill="#5b6b7c">哈希冲突概率 高</text>
  <rect x="638" y="202" width="184" height="16" rx="4" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1"/>
  <rect x="638" y="202" width="184" height="16" rx="4" fill="#e08a1e"/>
  <text x="638" y="250" font-size="11" fill="#5b6b7c">空间最省，链表易变长</text>

  <text x="450" y="306" text-anchor="middle" font-size="12" fill="#5b6b7c">负载因子增大</text>
  <line x1="80" y1="316" x2="820" y2="316" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="334" width="780" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="358" text-anchor="middle" font-size="12" fill="#1f2b38">结论：0.75 是时间成本与空间成本之间的折中</text>
  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#5b6b7c">对应 JDK 源码中的 DEFAULT_LOAD_FACTOR = 0.75f</text>
</svg>
