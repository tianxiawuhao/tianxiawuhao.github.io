<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring 全家桶的五层主线</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring 全家桶的五层主线：谁负责什么</text>
  <rect x="40" y="56" width="200" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="86" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">IoC 与 DI</text>
  <rect x="256" y="56" width="604" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="276" y="86" font-size="11" fill="#1f2b38" text-anchor="start">容器用工厂 + 反射创建对象，按类型或名称注入依赖；三级缓存救字段注入的循环依赖</text>
  <rect x="40" y="124" width="200" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="154" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">AOP</text>
  <rect x="256" y="124" width="604" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="276" y="154" font-size="11" fill="#1f2b38" text-anchor="start">有接口用 JDK 动态代理，无接口用 CGLIB；Spring Boot 2.x 起默认走 CGLIB</text>
  <rect x="40" y="192" width="200" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="222" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">声明式事务</text>
  <rect x="256" y="192" width="604" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="276" y="222" font-size="11" fill="#1f2b38" text-anchor="start">本质是 AOP 环绕通知；REQUIRED 是默认传播行为，NESTED 靠保存点实现</text>
  <rect x="40" y="260" width="200" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="290" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring Boot</text>
  <rect x="256" y="260" width="604" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="276" y="290" font-size="11" fill="#1f2b38" text-anchor="start">@SpringBootApplication = 配置 + 自动配置 + 组件扫描，条件注解筛掉不满足的配置类</text>
  <rect x="40" y="328" width="200" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="358" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring Cloud</text>
  <rect x="256" y="328" width="604" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="276" y="358" font-size="11" fill="#1f2b38" text-anchor="start">组件集合：注册发现、负载均衡、OpenFeign 调用、熔断降级、网关与配置中心</text>
</svg>
