<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>声明式事务不生效的四种常见场景</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">声明式事务不生效的四种常见场景</text>
  <rect x="40" y="56" width="390" height="118" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="84" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="start">① 自调用</text>
  <text x="60" y="112" font-size="11" fill="#1f2b38" text-anchor="start">同类内 this.methodB() 不走代理，注解形同虚设</text>
  <text x="60" y="140" font-size="11" fill="#5b6b7c" text-anchor="start">解法：拆到另一个 Bean，或用 AopContext.currentProxy()</text>
  <rect x="470" y="56" width="390" height="118" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="490" y="84" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="start">② 方法不是 public</text>
  <text x="490" y="112" font-size="11" fill="#1f2b38" text-anchor="start">proxy 模式下非 public 方法的事务属性被忽略</text>
  <text x="490" y="140" font-size="11" fill="#5b6b7c" text-anchor="start">解法：改为 public，或改用 AspectJ 织入</text>
  <rect x="40" y="196" width="390" height="118" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="224" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="start">③ 异常被吞或类型不对</text>
  <text x="60" y="252" font-size="11" fill="#1f2b38" text-anchor="start">默认只对 RuntimeException 与 Error 回滚</text>
  <text x="60" y="280" font-size="11" fill="#5b6b7c" text-anchor="start">解法：写 rollbackFor = Exception.class，别 catch 后不抛</text>
  <rect x="470" y="196" width="390" height="118" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="490" y="224" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="start">④ 对象不受容器管理</text>
  <text x="490" y="252" font-size="11" fill="#1f2b38" text-anchor="start">自己 new 出来的实例没有代理；MyISAM 不支持事务</text>
  <text x="490" y="280" font-size="11" fill="#5b6b7c" text-anchor="start">解法：交给容器管理，并确认引擎是 InnoDB</text>
  <text x="450" y="350" font-size="11" fill="#5b6b7c" text-anchor="middle">传播行为记「三组加一个默认」：REQUIRED 默认 · REQUIRES_NEW 挂起外层 · NESTED 靠保存点</text>
  <text x="450" y="382" font-size="11" fill="#5b6b7c" text-anchor="middle">答失效先想自调用与非 public，再想异常类型与对象是否受容器管理</text>
</svg>
