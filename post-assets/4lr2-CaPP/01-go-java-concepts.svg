<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="610" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Go 与 Java 核心概念对照表</text>
  <text x="48" y="60" font-size="12" font-weight="700" fill="#5b6b7c">对比维度</text>
  <text x="212" y="60" font-size="12" font-weight="700" fill="#5b6b7c">Java</text>
  <text x="532" y="60" font-size="12" font-weight="700" fill="#2e9e5b">Go</text>

  <rect x="30" y="68" width="840" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <line x1="200" y1="77" x2="200" y2="113" stroke="#c8d3e0"/>
  <line x1="520" y1="77" x2="520" y2="113" stroke="#c8d3e0"/>
  <text x="48" y="100" font-size="13" font-weight="700" fill="#1f2b38">变量与类型</text>
  <text x="212" y="92" font-size="12.5" fill="#1f2b38">8 种基本类型 + 对应包装类；</text>
  <text x="212" y="110" font-size="12.5" fill="#1f2b38">引用类型默认值为 null</text>
  <text x="532" y="92" font-size="12.5" fill="#1f2b38">类型不隐式转换，变量总有零值；</text>
  <text x="532" y="110" font-size="12.5" fill="#1f2b38">切片、map、channel 的零值为 nil</text>

  <rect x="30" y="126" width="840" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <line x1="200" y1="135" x2="200" y2="171" stroke="#c8d3e0"/>
  <line x1="520" y1="135" x2="520" y2="171" stroke="#c8d3e0"/>
  <text x="48" y="158" font-size="13" font-weight="700" fill="#1f2b38">结构体 vs 类</text>
  <text x="212" y="150" font-size="12.5" fill="#1f2b38">class 封装字段与方法，</text>
  <text x="212" y="168" font-size="12.5" fill="#1f2b38">支持继承、重载与多态</text>
  <text x="532" y="150" font-size="12.5" fill="#1f2b38">struct 只组织数据，方法写在</text>
  <text x="532" y="168" font-size="12.5" fill="#1f2b38">类型之外，用组合代替继承</text>

  <rect x="30" y="184" width="840" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <line x1="200" y1="193" x2="200" y2="229" stroke="#c8d3e0"/>
  <line x1="520" y1="193" x2="520" y2="229" stroke="#c8d3e0"/>
  <text x="48" y="216" font-size="13" font-weight="700" fill="#1f2b38">接口实现</text>
  <text x="212" y="208" font-size="12.5" fill="#1f2b38">必须显式 implements，</text>
  <text x="212" y="226" font-size="12.5" fill="#1f2b38">接口与实现类强绑定</text>
  <text x="532" y="208" font-size="12.5" fill="#1f2b38">隐式实现（鸭子类型），方法</text>
  <text x="532" y="226" font-size="12.5" fill="#1f2b38">齐全即满足接口，无需声明</text>

  <rect x="30" y="242" width="840" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <line x1="200" y1="251" x2="200" y2="287" stroke="#c8d3e0"/>
  <line x1="520" y1="251" x2="520" y2="287" stroke="#c8d3e0"/>
  <text x="48" y="274" font-size="13" font-weight="700" fill="#1f2b38">并发单元</text>
  <text x="212" y="266" font-size="12.5" fill="#1f2b38">Thread / 线程池，</text>
  <text x="212" y="284" font-size="12.5" fill="#1f2b38">一个线程对应一个内核线程</text>
  <text x="532" y="266" font-size="12.5" fill="#1f2b38">goroutine 用户态协程，由 GMP</text>
  <text x="532" y="284" font-size="12.5" fill="#1f2b38">运行时复用到少量 OS 线程上</text>

  <rect x="30" y="300" width="840" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <line x1="200" y1="309" x2="200" y2="345" stroke="#c8d3e0"/>
  <line x1="520" y1="309" x2="520" y2="345" stroke="#c8d3e0"/>
  <text x="48" y="332" font-size="13" font-weight="700" fill="#1f2b38">并发通信</text>
  <text x="212" y="324" font-size="12.5" fill="#1f2b38">共享内存 + 锁：</text>
  <text x="212" y="342" font-size="12.5" fill="#1f2b38">synchronized、Lock、阻塞队列</text>
  <text x="532" y="324" font-size="12.5" fill="#1f2b38">channel 传递指定类型的值：</text>
  <text x="532" y="342" font-size="12.5" fill="#1f2b38">以通信来共享内存（CSP 模型）</text>

  <rect x="30" y="358" width="840" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <line x1="200" y1="367" x2="200" y2="403" stroke="#c8d3e0"/>
  <line x1="520" y1="367" x2="520" y2="403" stroke="#c8d3e0"/>
  <text x="48" y="390" font-size="13" font-weight="700" fill="#1f2b38">延迟执行</text>
  <text x="212" y="382" font-size="12.5" fill="#1f2b38">finally 块 / try-with-resources</text>
  <text x="212" y="400" font-size="12.5" fill="#1f2b38">在正常与异常路径都释放资源</text>
  <text x="532" y="382" font-size="12.5" fill="#1f2b38">defer 注册延迟调用，函数</text>
  <text x="532" y="400" font-size="12.5" fill="#1f2b38">返回时按 LIFO 逆序执行</text>

  <rect x="30" y="416" width="840" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <line x1="200" y1="425" x2="200" y2="461" stroke="#c8d3e0"/>
  <line x1="520" y1="425" x2="520" y2="461" stroke="#c8d3e0"/>
  <text x="48" y="448" font-size="13" font-weight="700" fill="#1f2b38">错误处理</text>
  <text x="212" y="440" font-size="12.5" fill="#1f2b38">try / catch / finally，</text>
  <text x="212" y="458" font-size="12.5" fill="#1f2b38">异常沿调用栈向上传播</text>
  <text x="532" y="440" font-size="12.5" fill="#1f2b38">error 是接口值，多返回值</text>
  <text x="532" y="458" font-size="12.5" fill="#1f2b38">显式判断 if err != nil</text>

  <rect x="30" y="474" width="840" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <line x1="200" y1="483" x2="200" y2="519" stroke="#c8d3e0"/>
  <line x1="520" y1="483" x2="520" y2="519" stroke="#c8d3e0"/>
  <text x="48" y="506" font-size="13" font-weight="700" fill="#1f2b38">垃圾回收</text>
  <text x="212" y="498" font-size="12.5" fill="#1f2b38">分代收集，Serial / G1 / ZGC</text>
  <text x="212" y="516" font-size="12.5" fill="#1f2b38">等可选，参数可调</text>
  <text x="532" y="498" font-size="12.5" fill="#1f2b38">并发三色标记清除，STW 极短，</text>
  <text x="532" y="516" font-size="12.5" fill="#1f2b38">基本无需调参</text>

  <rect x="30" y="532" width="840" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <line x1="200" y1="541" x2="200" y2="577" stroke="#c8d3e0"/>
  <line x1="520" y1="541" x2="520" y2="577" stroke="#c8d3e0"/>
  <text x="48" y="564" font-size="13" font-weight="700" fill="#1f2b38">包管理</text>
  <text x="212" y="556" font-size="12.5" fill="#1f2b38">Maven / Gradle：pom.xml 声明</text>
  <text x="212" y="574" font-size="12.5" fill="#1f2b38">依赖，从中央仓库拉取</text>
  <text x="532" y="556" font-size="12.5" fill="#1f2b38">go mod：go.mod + go.sum 记录</text>
  <text x="532" y="574" font-size="12.5" fill="#1f2b38">版本，经模块代理拉取</text>
</svg>
