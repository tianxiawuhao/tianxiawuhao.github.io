<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="455" fill="#ffffff"/>
  <text x="450" y="36" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">goroutine 调度与 channel 通信示意</text>

  <rect x="30" y="56" width="410" height="274" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="48" y="82" font-size="14" font-weight="700" fill="#1f2b38">GMP 调度模型</text>
  <text x="48" y="102" font-size="11.5" fill="#5b6b7c">G：goroutine（用户态协程，初始栈约 2KB）</text>

  <rect x="52" y="116" width="112" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="108" y="141" font-size="13" fill="#1f2b38" text-anchor="middle">G1</text>
  <rect x="180" y="116" width="112" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="236" y="141" font-size="13" fill="#1f2b38" text-anchor="middle">G2</text>
  <rect x="308" y="116" width="112" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="364" y="141" font-size="13" fill="#1f2b38" text-anchor="middle">G3</text>

  <line x1="236" y1="157" x2="236" y2="172" stroke="#5b6b7c" marker-end="url(#arw)"/>
  <rect x="52" y="176" width="368" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="236" y="203" font-size="13" fill="#1f2b38" text-anchor="middle">P：逻辑处理器，本地运行队列</text>

  <line x1="236" y1="221" x2="236" y2="236" stroke="#5b6b7c" marker-end="url(#arw)"/>
  <text x="246" y="233" font-size="11" fill="#5b6b7c">取出 G 执行</text>
  <rect x="52" y="240" width="368" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="236" y="267" font-size="13" fill="#1f2b38" text-anchor="middle">M：内核线程，由 OS 调度到 CPU</text>

  <text x="52" y="302" font-size="11.5" fill="#5b6b7c">GOMAXPROCS 决定并行执行的 P 数量；</text>
  <text x="52" y="322" font-size="11.5" fill="#5b6b7c">G 阻塞时运行时切换到其他 G，不陷入内核</text>

  <rect x="460" y="56" width="410" height="274" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="478" y="82" font-size="14" font-weight="700" fill="#1f2b38">channel：以通信共享内存</text>
  <text x="478" y="102" font-size="11.5" fill="#5b6b7c">无缓冲 cap=0，发送与接收必须配对</text>

  <rect x="478" y="118" width="172" height="42" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
  <text x="564" y="144" font-size="13" fill="#1f2b38" text-anchor="middle">G1：c &lt;- 1</text>
  <rect x="478" y="182" width="172" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="564" y="208" font-size="13" fill="#1f2b38" text-anchor="middle">G2：&lt;- c</text>

  <rect x="700" y="118" width="152" height="106" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="776" y="152" font-size="13" fill="#1f2b38" text-anchor="middle">channel</text>
  <text x="776" y="176" font-size="11.5" fill="#5b6b7c" text-anchor="middle">cap = 0</text>
  <text x="776" y="198" font-size="11.5" fill="#5b6b7c" text-anchor="middle">配对后同时就绪</text>

  <line x1="652" y1="139" x2="694" y2="139" stroke="#5b6b7c" marker-end="url(#arw)"/>
  <text x="656" y="131" font-size="11" fill="#5b6b7c">发送</text>
  <line x1="698" y1="203" x2="656" y2="203" stroke="#5b6b7c" marker-end="url(#arw)"/>
  <text x="660" y="195" font-size="11" fill="#5b6b7c">接收</text>

  <text x="478" y="248" font-size="11.5" fill="#5b6b7c">无缓冲通道是同步点：发送与接收</text>
  <text x="478" y="266" font-size="11.5" fill="#5b6b7c">必须同时就绪，先到的一方阻塞等待</text>
  <text x="478" y="292" font-size="11.5" fill="#5b6b7c">有缓冲通道容量为 n，缓冲未满即可</text>
  <text x="478" y="310" font-size="11.5" fill="#5b6b7c">发送，缓冲非空即可接收</text>

  <text x="40" y="352" font-size="13" fill="#1f2b38">• 无缓冲（cap=0）：发送与接收必须成对出现，先到的一方阻塞等待，天然是同步点。</text>
  <text x="40" y="376" font-size="13" fill="#1f2b38">• 有缓冲（cap&gt;0）：缓冲未满时发送不阻塞，缓冲非空时接收不阻塞，只有满或空时才阻塞。</text>
  <text x="40" y="400" font-size="13" fill="#1f2b38">• 关闭：close(c) 之后接收方仍能取走剩余数据，range 循环在通道关闭后自动结束。</text>
  <text x="40" y="424" font-size="13" fill="#1f2b38">• 死锁：所有 goroutine 都阻塞时，运行时报 all goroutines are asleep - deadlock。</text>
</svg>
