<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MongoDB 分片集群的请求路径与各层角色</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">MongoDB 分片集群：请求路径与各层角色</text>

  <rect x="30" y="85" width="150" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="105" y="105" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">应用 / 驱动</text>
  <text x="105" y="123" font-size="11" fill="#5b6b7c" text-anchor="middle">mongo 连接串</text>

  <line x1="180" y1="108" x2="209" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="215" y="85" width="170" height="46" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="300" y="105" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">mongos</text>
  <text x="300" y="123" font-size="11" fill="#5b6b7c" text-anchor="middle">无状态路由进程</text>

  <rect x="640" y="85" width="230" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="755" y="105" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">config server ×3</text>
  <text x="755" y="123" font-size="11" fill="#5b6b7c" text-anchor="middle">chunk 分布等全部元数据</text>

  <line x1="397" y1="100" x2="632" y2="100" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="632" y1="116" x2="397" y2="116" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="514" y="92" font-size="11" fill="#5b6b7c" text-anchor="middle">加载元数据 / 心跳</text>

  <line x1="300" y1="131" x2="300" y2="165" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="312" y="152" font-size="11" fill="#5b6b7c">按分片键路由并聚合结果</text>
  <line x1="215" y1="165" x2="685" y2="165" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="215" y1="165" x2="215" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="165" x2="450" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="685" y1="165" x2="685" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="110" y="190" width="210" height="95" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="215" y="216" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Shard 1</text>
  <text x="215" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">本身是一个复制集</text>
  <text x="215" y="262" font-size="11" fill="#5b6b7c" text-anchor="middle">真正存放 chunk 数据</text>

  <rect x="345" y="190" width="210" height="95" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="216" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Shard 2</text>
  <text x="450" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">本身是一个复制集</text>
  <text x="450" y="262" font-size="11" fill="#5b6b7c" text-anchor="middle">超过设定大小就分裂</text>

  <rect x="580" y="190" width="210" height="95" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="685" y="216" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Shard 3</text>
  <text x="685" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">本身是一个复制集</text>
  <text x="685" y="262" font-size="11" fill="#5b6b7c" text-anchor="middle">balancer 迁移 chunk</text>

  <text x="450" y="312" font-size="12" fill="#5b6b7c" text-anchor="middle">分片键决定查询能否定向到单个 shard：单调递增的键会把写入压到最后一个 chunk，形成热点。</text>
</svg>
