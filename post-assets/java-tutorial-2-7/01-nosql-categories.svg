<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>NoSQL 四类存储的模型、代表产品与适用场景对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">NoSQL 四类存储：数据模型决定选型</text>

  <text x="52" y="80" font-size="12" font-weight="700" fill="#5b6b7c">类型</text>
  <text x="202" y="80" font-size="12" font-weight="700" fill="#5b6b7c">代表产品</text>
  <text x="382" y="80" font-size="12" font-weight="700" fill="#5b6b7c">数据模型</text>
  <text x="582" y="80" font-size="12" font-weight="700" fill="#5b6b7c">典型场景</text>
  <line x1="40" y1="90" x2="860" y2="90" stroke="#c8d3e0" stroke-width="1.4"/>

  <rect x="40" y="95" width="820" height="56" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="40" y="95" width="150" height="56" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="120" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">键值型</text>
  <text x="115" y="139" font-size="11.5" fill="#5b6b7c" text-anchor="middle">缓存首选</text>
  <text x="202" y="129" font-size="12.5" fill="#1f2b38">Redis / Memcached</text>
  <text x="382" y="129" font-size="12.5" fill="#1f2b38">key → value 键值映射</text>
  <text x="582" y="129" font-size="12.5" fill="#1f2b38">缓存、会话、计数、排行榜</text>

  <rect x="40" y="151" width="820" height="56" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="40" y="151" width="150" height="56" fill="#eaf7ef" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="176" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">文档型</text>
  <text x="115" y="195" font-size="11.5" fill="#5b6b7c" text-anchor="middle">结构灵活</text>
  <text x="202" y="185" font-size="12.5" fill="#1f2b38">MongoDB</text>
  <text x="382" y="185" font-size="12.5" fill="#1f2b38">类 JSON 文档，字段可不同</text>
  <text x="582" y="185" font-size="12.5" fill="#1f2b38">内容管理、商品、订单与日志</text>

  <rect x="40" y="207" width="820" height="56" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="40" y="207" width="150" height="56" fill="#fff6e8" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="232" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">列族型</text>
  <text x="115" y="251" font-size="11.5" fill="#5b6b7c" text-anchor="middle">天然分布式</text>
  <text x="202" y="241" font-size="12.5" fill="#1f2b38">HBase / Cassandra</text>
  <text x="382" y="241" font-size="12.5" fill="#1f2b38">按列族存储的稀疏宽表</text>
  <text x="582" y="241" font-size="12.5" fill="#1f2b38">十亿行级、写入吞吐密集</text>

  <rect x="40" y="263" width="820" height="56" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="40" y="263" width="150" height="56" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="288" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">图数据库</text>
  <text x="115" y="307" font-size="11.5" fill="#5b6b7c" text-anchor="middle">多跳关系</text>
  <text x="202" y="297" font-size="12.5" fill="#1f2b38">Neo4j</text>
  <text x="382" y="297" font-size="12.5" fill="#1f2b38">节点与边，天然处理多跳关系</text>
  <text x="582" y="297" font-size="12.5" fill="#1f2b38">社交推荐、反欺诈路径分析</text>

  <line x1="190" y1="95" x2="190" y2="319" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="370" y1="95" x2="370" y2="319" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="570" y1="95" x2="570" y2="319" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="40" y="95" width="820" height="224" fill="none" stroke="#c8d3e0" stroke-width="1.4"/>

  <rect x="40" y="344" width="820" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="369" font-size="12.5" fill="#1f2b38" text-anchor="middle">选型顺序：先看数据模型 → 再看读写比例 → 最后看一致性要求</text>
</svg>
