<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>加入 max 项前后 V 与 A 分解唯一性的对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">为什么需要 max 项：让 V 与 A 的分解唯一</text>

  <rect x="30" y="55" width="400" height="320" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">不加 max 项：分解不唯一</text>

  <rect x="55" y="115" width="160" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="135" y="140" text-anchor="middle" font-size="13" fill="#1f2b38">V' = V* + 10</text>
  <text x="135" y="162" text-anchor="middle" font-size="11" fill="#5b6b7c">价值被抬高</text>

  <rect x="245" y="115" width="160" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="325" y="140" text-anchor="middle" font-size="13" fill="#1f2b38">A' = A* − 10</text>
  <text x="325" y="162" text-anchor="middle" font-size="11" fill="#5b6b7c">优势被压低</text>

  <path d="M 135 175 V 205 H 325 V 175" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M 230 205 V 236" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="130" y="240" width="200" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="264" text-anchor="middle" font-size="13" fill="#1f2b38">Q' = Q* 保持不变</text>
  <text x="230" y="286" text-anchor="middle" font-size="11" fill="#5b6b7c">两项偏移互相抵消</text>

  <text x="230" y="330" text-anchor="middle" font-size="12" fill="#e08a1e">但 V 与 A 都大幅偏移</text>
  <text x="230" y="352" text-anchor="middle" font-size="12" fill="#5b6b7c">两个神经网络都难以训练好</text>

  <rect x="470" y="55" width="400" height="320" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">加入 max 项：分解唯一</text>

  <rect x="495" y="115" width="160" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="575" y="140" text-anchor="middle" font-size="13" fill="#1f2b38">V*(s)</text>
  <text x="575" y="162" text-anchor="middle" font-size="11" fill="#5b6b7c">状态价值</text>

  <rect x="685" y="115" width="160" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="765" y="140" text-anchor="middle" font-size="13" fill="#1f2b38">A*(s,a)</text>
  <text x="765" y="162" text-anchor="middle" font-size="11" fill="#5b6b7c">动作优势</text>

  <path d="M 575 175 V 186 H 620 V 192" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 765 175 V 186 H 720 V 192" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="590" y="195" width="160" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="227" text-anchor="middle" font-size="12" fill="#1f2b38">max A*(s,a) = 0</text>

  <path d="M 670 249 V 274" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="520" y="278" width="300" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="302" text-anchor="middle" font-size="13" fill="#1f2b38">Q = V + A − max A</text>
  <text x="670" y="324" text-anchor="middle" font-size="11" fill="#5b6b7c">Q 与 V、A 一一对应</text>

  <text x="670" y="360" text-anchor="middle" font-size="12" fill="#5b6b7c">基线固定后，网络只需学唯一的一组 V 与 A</text>
</svg>
