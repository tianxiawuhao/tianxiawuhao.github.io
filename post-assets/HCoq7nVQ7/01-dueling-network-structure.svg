<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Dueling Network 结构示意图</title>
  <rect width="900" height="410" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Dueling Network：把 Q 分解为状态价值与优势</text>

  <rect x="30" y="178" width="120" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="202" text-anchor="middle" font-size="13" fill="#1f2b38">输入状态 s</text>
  <text x="90" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">游戏画面</text>

  <rect x="190" y="170" width="150" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="265" y="200" text-anchor="middle" font-size="13" fill="#1f2b38">共享卷积主干</text>
  <text x="265" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">提取特征</text>

  <rect x="390" y="80" width="190" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="485" y="106" text-anchor="middle" font-size="13" fill="#1f2b38">优势分支 A(s,a; wA)</text>
  <text x="485" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">每个动作相对基线的优势</text>

  <rect x="390" y="272" width="190" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="485" y="298" text-anchor="middle" font-size="13" fill="#1f2b38">价值分支 V(s; wV)</text>
  <text x="485" y="320" text-anchor="middle" font-size="11" fill="#5b6b7c">状态本身的价值</text>

  <rect x="640" y="170" width="230" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="755" y="200" text-anchor="middle" font-size="13" fill="#1f2b38">输出 Q(s,a; w)</text>
  <text x="755" y="224" text-anchor="middle" font-size="12" fill="#1f2b38">= V + A − max A</text>

  <path d="M 150 208 H 186" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 340 208 H 362 V 112 H 386" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 340 208 H 362 V 304 H 386" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 580 112 H 606 V 196 H 636" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 580 304 H 606 V 224 H 636" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#5b6b7c">两支共享主干参数；max 项固定优势基线，使 V 与 A 的分解唯一</text>
</svg>
