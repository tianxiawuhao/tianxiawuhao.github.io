<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Docker 安装 Elasticsearch 与 head 插件的流程</title>
  <rect width="900" height="510" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Docker 安装 Elasticsearch 与 head 插件的流程</text>
  <rect x="90" y="55" width="720" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="120" cy="79" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="84" text-anchor="middle" font-size="12" fill="#2f6fd0">1</text>
  <text x="150" y="77" font-size="12" fill="#1f2b38">docker search elasticsearch</text>
  <text x="150" y="95" font-size="11" fill="#5b6b7c">搜索可用的镜像</text>
  <line x1="120" y1="95" x2="120" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="90" y="123" width="720" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="120" cy="147" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="152" text-anchor="middle" font-size="12" fill="#2f6fd0">2</text>
  <text x="150" y="145" font-size="12" fill="#1f2b38">docker pull elasticsearch:2.4.4</text>
  <text x="150" y="163" font-size="11" fill="#5b6b7c">拉取指定版本的镜像</text>
  <line x1="120" y1="163" x2="120" y2="178" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="90" y="191" width="720" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="120" cy="215" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="220" text-anchor="middle" font-size="12" fill="#2f6fd0">3</text>
  <text x="150" y="213" font-size="12" fill="#1f2b38">docker run -d -p 9200:9200 -p 9300:9300 ...</text>
  <text x="150" y="231" font-size="11" fill="#5b6b7c">启动容器并映射 HTTP 与节点通信端口</text>
  <line x1="120" y1="231" x2="120" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="90" y="259" width="720" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="120" cy="283" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="288" text-anchor="middle" font-size="12" fill="#2f6fd0">4</text>
  <text x="150" y="281" font-size="12" fill="#1f2b38">docker ps</text>
  <text x="150" y="299" font-size="11" fill="#5b6b7c">确认容器已启动，访问 9200 端口验证服务</text>
  <line x1="120" y1="299" x2="120" y2="314" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="90" y="327" width="720" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="120" cy="351" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="356" text-anchor="middle" font-size="12" fill="#2f6fd0">5</text>
  <text x="150" y="349" font-size="12" fill="#1f2b38">docker exec -it elasticsearch /bin/bash</text>
  <text x="150" y="367" font-size="11" fill="#5b6b7c">进入容器</text>
  <line x1="120" y1="367" x2="120" y2="382" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="90" y="395" width="720" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="120" cy="419" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="424" text-anchor="middle" font-size="12" fill="#2f6fd0">6</text>
  <text x="150" y="417" font-size="12" fill="#1f2b38">plugin install mobz/elasticsearch-head</text>
  <text x="150" y="435" font-size="11" fill="#5b6b7c">安装 head 插件，再打开 head 页面验证</text>
  <text x="450" y="480" text-anchor="middle" font-size="11" fill="#5b6b7c">命令在宿主机执行；只有查看 bin 目录和安装插件需要先进入容器</text>
</svg>
