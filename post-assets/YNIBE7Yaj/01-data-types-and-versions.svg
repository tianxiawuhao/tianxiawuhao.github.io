<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
</marker>
</defs>
<rect width="900" height="620" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Redis 五种基础数据类型：命令、底层编码与版本演进</text>
<rect x="24" y="54" width="852" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="44" y="84" font-size="14" font-weight="700" fill="#1f2b38">① 基础类型、典型命令与底层编码</text>
<text x="48" y="112" font-size="12" font-weight="700" fill="#5b6b7c">类型</text>
<text x="140" y="112" font-size="12" font-weight="700" fill="#5b6b7c">典型命令（部分）</text>
<text x="590" y="112" font-size="12" font-weight="700" fill="#5b6b7c">底层编码（随元素规模自动切换）</text>
<line x1="44" y1="122" x2="856" y2="122" stroke="#c8d3e0"/>
<text x="48" y="146" font-size="12" font-weight="700" fill="#2f6fd0">String</text>
<text x="140" y="146" font-size="12" fill="#1f2b38">SET / GET / INCR / INCRBYFLOAT / MSET / MGET</text>
<text x="590" y="146" font-size="12" fill="#1f2b38">int / embstr / raw</text>
<text x="48" y="178" font-size="12" font-weight="700" fill="#2f6fd0">List</text>
<text x="140" y="178" font-size="12" fill="#1f2b38">LPUSH / RPUSH / LPOP / RPOP / LRANGE / LREM / LTRIM / BLPOP</text>
<text x="590" y="178" font-size="12" fill="#1f2b38">quicklist（节点为 listpack）</text>
<text x="48" y="210" font-size="12" font-weight="700" fill="#2f6fd0">Set</text>
<text x="140" y="210" font-size="12" fill="#1f2b38">SADD / SREM / SISMEMBER / SINTER / SUNION / SDIFF / SPOP</text>
<text x="590" y="210" font-size="12" fill="#1f2b38">intset / listpack（7.2 起）/ hashtable</text>
<text x="48" y="242" font-size="12" font-weight="700" fill="#2f6fd0">Hash</text>
<text x="140" y="242" font-size="12" fill="#1f2b38">HSET / HGET / HDEL / HGETALL / HINCRBY / HSCAN</text>
<text x="590" y="242" font-size="12" fill="#1f2b38">listpack（7.0 前为 ziplist）/ hashtable</text>
<text x="48" y="274" font-size="12" font-weight="700" fill="#2f6fd0">Zset</text>
<text x="140" y="274" font-size="12" fill="#1f2b38">ZADD / ZRANGE / ZSCORE / ZRANK / ZINCRBY / ZREVRANGE</text>
<text x="590" y="274" font-size="12" fill="#1f2b38">listpack（7.0 前为 ziplist）/ skiplist</text>
<text x="48" y="304" font-size="11.5" fill="#5b6b7c">编码不是固定的：元素个数或单个元素长度超过阈值时会自动升级为 hashtable / skiplist。</text>
<text x="48" y="326" font-size="11.5" fill="#5b6b7c">阈值参数 7.0 起为 hash-max-listpack-entries 等；老版本名为 hash-max-ziplist-entries。</text>
<rect x="24" y="374" width="852" height="226" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="44" y="404" font-size="14" font-weight="700" fill="#1f2b38">② 主要版本演进（与数据类型、命令相关）</text>
<rect x="44" y="418" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="119" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">4.0</text>
<text x="119" y="462" text-anchor="middle" font-size="11" fill="#1f2b38">HMSET 废弃</text>
<text x="119" y="480" text-anchor="middle" font-size="11" fill="#1f2b38">UNLINK、模块系统</text>
<rect x="210" y="418" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="285" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">5.0</text>
<text x="285" y="462" text-anchor="middle" font-size="11" fill="#1f2b38">Stream 类型</text>
<text x="285" y="480" text-anchor="middle" font-size="11" fill="#1f2b38">可靠消息队列</text>
<rect x="375" y="418" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="450" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">6.0</text>
<text x="450" y="462" text-anchor="middle" font-size="11" fill="#1f2b38">多线程 I/O</text>
<text x="450" y="480" text-anchor="middle" font-size="11" fill="#1f2b38">ACL、KEEPTTL</text>
<rect x="540" y="418" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="615" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">6.2</text>
<text x="615" y="462" text-anchor="middle" font-size="11" fill="#1f2b38">GETEX / GETDEL</text>
<text x="615" y="480" text-anchor="middle" font-size="11" fill="#1f2b38">ZADD GT|LT 等</text>
<rect x="706" y="418" width="150" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="781" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">7.0</text>
<text x="781" y="462" text-anchor="middle" font-size="11" fill="#1f2b38">LMPOP / ZMPOP</text>
<text x="781" y="480" text-anchor="middle" font-size="11" fill="#1f2b38">listpack 替代 ziplist</text>
<line x1="119" y1="494" x2="119" y2="528" stroke="#c8d3e0"/>
<line x1="285" y1="494" x2="285" y2="528" stroke="#c8d3e0"/>
<line x1="450" y1="494" x2="450" y2="528" stroke="#c8d3e0"/>
<line x1="615" y1="494" x2="615" y2="528" stroke="#c8d3e0"/>
<line x1="781" y1="494" x2="781" y2="528" stroke="#c8d3e0"/>
<line x1="60" y1="530" x2="840" y2="530" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ah)"/>
<text x="44" y="566" font-size="11.5" fill="#5b6b7c">命令语义在各版本基本兼容：升级时主要关注被废弃的命令（如 hmset、georadius）与改名后的配置项。</text>
</svg>
