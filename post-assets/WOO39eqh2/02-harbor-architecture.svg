  <line x1="472" y1="346" x2="538" y2="346" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="538" y1="368" x2="472" y2="368" stroke="#e08a1e" stroke-width="1.8" marker-end="url(#a2)"/>
