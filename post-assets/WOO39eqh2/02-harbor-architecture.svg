  <text x="450" y="428" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c">v2.5.0 起配置文件为 harbor.yml，默认管理员密码 admin / Harbor12345</text>
