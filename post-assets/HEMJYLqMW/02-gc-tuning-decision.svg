<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">GC 选型与调优决策流程</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#5b6b7c">先量化目标，再选收集器；收集器不能弥补代码里的内存问题</text>

  <rect x="330" y="72" width="240" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">第一步：量化目标与基线</text>
  <text x="450" y="113" text-anchor="middle" font-size="11" fill="#5b6b7c">吞吐量、延迟（P99）、堆占用、GC 频率</text>

  <path d="M 450 124 L 450 158" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="330" y="164" width="240" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="450" y="192" text-anchor="middle" font-size="12" fill="#1f2b38">主要瓶颈是什么？</text>

  <path d="M 400 208 L 240 226" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 500 208 L 660 226" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="60" y="234" width="360" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="80" y="258" font-size="13" font-weight="700" fill="#2e9e5b">吞吐优先（批处理、离线计算）</text>
  <text x="80" y="284" font-size="11" fill="#1f2b38">选 Parallel（-XX:+UseParallelGC）</text>
  <text x="80" y="306" font-size="11" fill="#5b6b7c">-XX:ParallelGCThreads=CPU 核数</text>
  <text x="80" y="326" font-size="11" fill="#5b6b7c">-XX:GCTimeRatio=99 → GC 时间 ≤ 1%</text>
  <text x="80" y="346" font-size="11" fill="#5b6b7c">无需极低停顿，追求单位时间完成任务量</text>

  <rect x="480" y="234" width="360" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="500" y="258" font-size="13" font-weight="700" fill="#e08a1e">延迟优先（在线服务、大堆）</text>
  <text x="500" y="284" font-size="11" fill="#1f2b38">JDK 9+ 默认 G1：-XX:+UseG1GC</text>
  <text x="500" y="306" font-size="11" fill="#5b6b7c">-XX:MaxGCPauseMillis=200 设停顿目标</text>
  <text x="500" y="326" font-size="11" fill="#5b6b7c">堆 &gt; 8G 或停顿要求毫秒级：ZGC -XX:+UseZGC</text>
  <text x="500" y="346" font-size="11" fill="#5b6b7c">CMS 自 JDK 9 弃用、JDK 14 移除，新项目勿选</text>

  <rect x="60" y="372" width="780" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="80" y="396" font-size="13" font-weight="700" fill="#1f2b38">第三步：用数据验证并迭代</text>
  <text x="80" y="418" font-size="11" fill="#1f2b38">打开 GC 日志（JDK 9+：-Xlog:gc*:file=gc.log:time,uptime；JDK 8：-XX:+PrintGCDetails -Xloggc:gc.log）</text>
  <text x="80" y="438" font-size="11" fill="#5b6b7c">每次只改一个参数 → 压测对比 → 观察 Full GC 次数、单次停顿、老年代回收后残留，再决定下一步。</text>
</svg>
