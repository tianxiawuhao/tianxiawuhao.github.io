<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">JVM 内存结构与常用参数</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#5b6b7c">JDK 8 及以后：永久代（PermGen）被元空间（Metaspace）取代</text>

  <rect x="40" y="76" width="500" height="300" rx="8" fill="#f7f9fc" stroke="#1f2b38"/>
  <text x="60" y="100" font-size="14" font-weight="700" fill="#1f2b38">堆 Heap（-Xms / -Xmx）</text>

  <rect x="60" y="116" width="460" height="160" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="290" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">年轻代 Young（-Xmn / -XX:NewRatio）</text>

  <rect x="76" y="154" width="290" height="104" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="221" y="182" text-anchor="middle" font-size="13" fill="#1f2b38">Eden</text>
  <text x="221" y="204" text-anchor="middle" font-size="11" fill="#5b6b7c">-XX:SurvivorRatio=Eden:Survivor</text>
  <text x="221" y="226" text-anchor="middle" font-size="11" fill="#5b6b7c">新对象优先在此分配</text>
  <text x="221" y="246" text-anchor="middle" font-size="11" fill="#5b6b7c">大对象可用 PretenureSizeThreshold 直接晋升</text>

  <rect x="380" y="154" width="60" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="410" y="200" text-anchor="middle" font-size="12" fill="#1f2b38">S0</text>
  <text x="410" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">From</text>

  <rect x="452" y="154" width="60" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="482" y="200" text-anchor="middle" font-size="12" fill="#1f2b38">S1</text>
  <text x="482" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">To</text>

  <text x="60" y="302" font-size="11" fill="#5b6b7c">复制算法：Eden + From 中存活对象复制到 To，年龄 +1；达到 MaxTenuringThreshold 后晋升</text>

  <rect x="60" y="316" width="460" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="76" y="338" font-size="13" fill="#1f2b38">老年代 Old / Tenured（堆大小 − 年轻代）</text>
  <text x="76" y="356" font-size="11" fill="#5b6b7c">标记-整理 / 标记-清除；大对象与长期存活对象在此</text>

  <rect x="570" y="76" width="290" height="140" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="590" y="100" font-size="14" font-weight="700" fill="#1f2b38">非堆（本地内存）</text>
  <text x="590" y="126" font-size="11" fill="#1f2b38">Metaspace　　类元数据</text>
  <text x="590" y="146" font-size="11" fill="#5b6b7c">-XX:MetaspaceSize / -XX:MaxMetaspaceSize</text>
  <text x="590" y="172" font-size="11" fill="#1f2b38">直接内存　　 NIO allocateDirect</text>
  <text x="590" y="192" font-size="11" fill="#5b6b7c">-XX:MaxDirectMemorySize（默认等于 -Xmx）</text>
  <text x="590" y="212" font-size="11" fill="#1f2b38">线程栈　　　 每线程 -Xss，默认约 1M</text>

  <rect x="570" y="236" width="290" height="140" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="590" y="260" font-size="14" font-weight="700" fill="#2f6fd0">持久代（仅 JDK 7 及以前）</text>
  <text x="590" y="286" font-size="11" fill="#1f2b38">-XX:PermSize / -XX:MaxPermSize</text>
  <text x="590" y="306" font-size="11" fill="#5b6b7c">类元数据 + 字符串常量池，容量固定</text>
  <text x="590" y="326" font-size="11" fill="#5b6b7c">JDK 8 起：元数据 → Metaspace，</text>
  <text x="590" y="344" font-size="11" fill="#5b6b7c">字符串常量池 → 堆</text>
  <text x="590" y="364" font-size="11" fill="#e08a1e">JDK 8 上传入 -XX:MaxPermSize 会被忽略并告警</text>

  <rect x="40" y="400" width="820" height="196" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="60" y="426" font-size="14" font-weight="700" fill="#2e9e5b">三条容易踩错的规则</text>
  <text x="60" y="454" font-size="12" fill="#1f2b38">1. -Xmn 与 -XX:NewRatio 互斥：显式指定年轻代大小后，NewRatio 失效，二者不要同时设置。</text>
  <text x="60" y="482" font-size="12" fill="#1f2b38">2. -Xms 与 -Xmx 建议相等：避免运行期反复扩缩容带来额外 GC 与抖动；容器内务必显式设置，勿依赖默认值。</text>
  <text x="60" y="510" font-size="12" fill="#1f2b38">3. -Xss 决定单线程栈大小：调小可提升可创建线程数，但会加深溢出风险，需与递归深度、框架栈深共同评估。</text>
  <text x="60" y="542" font-size="12" fill="#1f2b38">4. 元空间不设上限并非好事：MaxMetaspaceSize 留白会让动态代理类无限增长，最终耗尽机器内存。</text>
  <text x="60" y="574" font-size="12" fill="#5b6b7c">调优顺序：先定目标（吞吐 / 延迟）→ 再定堆与分代 → 最后选收集器与线程数。</text>
</svg>
