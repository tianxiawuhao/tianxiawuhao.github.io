<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>起步依赖：父 POM 锁定版本，starter 传递一组对齐的 jar</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">起步依赖：父 POM 锁版本，starter 传递一组对齐的 jar</text>

  <rect x="300" y="56" width="300" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="84" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">spring-boot-starter-parent 3.3.5</text>

  <line x1="450" y1="102" x2="450" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="466" y="119" font-size="11" fill="#5b6b7c">继承</text>
  <rect x="230" y="128" width="440" height="54" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="150" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">spring-boot-dependencies（真正的父 POM）</text>
  <text x="450" y="169" font-size="11" fill="#5b6b7c" text-anchor="middle">properties + dependencyManagement 统一锁定上百个库的版本</text>

  <line x1="450" y1="182" x2="450" y2="206" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="466" y="199" font-size="11" fill="#5b6b7c">子模块引入 starter 不必写 &lt;version&gt;</text>
  <rect x="340" y="208" width="220" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="237" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">spring-boot-starter-web</text>

  <line x1="450" y1="256" x2="180" y2="288" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="256" x2="450" y2="288" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="256" x2="720" y2="288" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="290" width="240" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="180" y="314" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">spring-web + spring-webmvc</text>
  <text x="180" y="333" font-size="11" fill="#5b6b7c" text-anchor="middle">MVC 核心</text>
  <rect x="330" y="290" width="240" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="314" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">spring-boot-starter-tomcat</text>
  <text x="450" y="333" font-size="11" fill="#5b6b7c" text-anchor="middle">内嵌 Tomcat</text>
  <rect x="600" y="290" width="240" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="720" y="314" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">jackson-databind</text>
  <text x="720" y="333" font-size="11" fill="#5b6b7c" text-anchor="middle">JSON 序列化</text>

  <text x="450" y="378" font-size="12" fill="#5b6b7c" text-anchor="middle">要换版本就改父 POM 暴露的 xxx.version 属性，不要给依赖手写 version</text>
</svg>
