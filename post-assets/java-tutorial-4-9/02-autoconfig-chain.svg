<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>SpringBootApplication 背后的自动配置装配链路</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">@SpringBootApplication 背后的自动配置装配链路</text>

  <rect x="60" y="56" width="380" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="250" y="76" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">@SpringBootApplication（组合注解）</text>
  <text x="250" y="93" font-size="11" fill="#5b6b7c" text-anchor="middle">@SpringBootConfiguration + @ComponentScan</text>
  <text x="250" y="109" font-size="11" fill="#5b6b7c" text-anchor="middle">+ @EnableAutoConfiguration（真正的开关）</text>

  <line x1="250" y1="118" x2="250" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="142" width="380" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="250" y="164" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">@EnableAutoConfiguration</text>
  <text x="250" y="182" font-size="11" fill="#5b6b7c" text-anchor="middle">@Import(AutoConfigurationImportSelector.class)</text>

  <line x1="250" y1="198" x2="250" y2="220" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="222" width="380" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="250" y="244" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">读取候选自动配置类清单</text>
  <text x="250" y="262" font-size="11" fill="#5b6b7c" text-anchor="middle">AutoConfiguration.imports（2.7+）/ spring.factories（≤2.6）</text>

  <line x1="250" y1="278" x2="250" y2="300" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="302" width="380" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="250" y="324" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">逐个条件筛选，通过才注册 Bean</text>
  <text x="250" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">@ConditionalOnClass / Bean / Property / WebApplication</text>

  <rect x="470" y="56" width="390" height="302" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="82" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">条件装配：三条要点</text>
  <rect x="490" y="96" width="350" height="60" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="120" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">① 清单里的类只是候选</text>
  <text x="665" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">spring.factories 中的类也要过条件</text>
  <rect x="490" y="176" width="350" height="60" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="200" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">② 用户自定义 Bean 优先</text>
  <text x="665" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">@ConditionalOnMissingBean 让默认实现让位</text>
  <rect x="490" y="256" width="350" height="60" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="280" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">③ 排查是否生效</text>
  <text x="665" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">--debug 打印 Positive / Negative matches</text>
  <text x="665" y="340" font-size="11" fill="#5b6b7c" text-anchor="middle">任一条件不成立 → 整个配置类不注册</text>
</svg>
