<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JVM 运行时数据区域：线程私有与线程共享</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">运行时数据区域：线程私有 vs 线程共享</text>
  <rect x="40" y="52" width="390" height="326" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="78" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">线程私有 · 随线程生灭，不参与 GC</text>
  <rect x="60" y="88" width="350" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="118" font-size="12" fill="#1f2b38" text-anchor="middle">程序计数器</text>
  <text x="235" y="142" font-size="11" fill="#5b6b7c" text-anchor="middle">唯一不会抛 OutOfMemoryError 的区域</text>
  <rect x="60" y="182" width="350" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="212" font-size="12" fill="#1f2b38" text-anchor="middle">虚拟机栈</text>
  <text x="235" y="236" font-size="11" fill="#5b6b7c" text-anchor="middle">每方法一个栈帧；-Xss 超限抛 SOE</text>
  <rect x="60" y="276" width="350" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="306" font-size="12" fill="#1f2b38" text-anchor="middle">本地方法栈</text>
  <text x="235" y="330" font-size="11" fill="#5b6b7c" text-anchor="middle">为 native 方法服务，与虚拟机栈类似</text>
  <rect x="470" y="52" width="390" height="326" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="78" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">线程共享 · GC 主战场，都会 OOM</text>
  <rect x="490" y="88" width="350" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="112" font-size="12" fill="#1f2b38" text-anchor="middle">堆</text>
  <text x="665" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">-Xms / -Xmx 控制，扩展失败抛 OOM</text>
  <rect x="490" y="158" width="350" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="182" font-size="12" fill="#1f2b38" text-anchor="middle">方法区</text>
  <text x="665" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">类信息与静态变量；JDK 8 起为元空间</text>
  <rect x="490" y="228" width="350" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="252" font-size="12" fill="#1f2b38" text-anchor="middle">运行时常量池</text>
  <text x="665" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">方法区的一部分，intern() 可动态添加</text>
  <rect x="490" y="298" width="350" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="322" font-size="12" fill="#1f2b38" text-anchor="middle">直接内存</text>
  <text x="665" y="344" font-size="11" fill="#5b6b7c" text-anchor="middle">NIO 直接缓冲区，受本机内存限制</text>
</svg>
