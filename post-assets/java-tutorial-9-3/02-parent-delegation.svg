<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>双亲委派模型的三层加载器与委派方向</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">双亲委派：先委派父加载器，父加载不到才自己 findClass</text>
  <rect x="250" y="64" width="400" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="92" font-size="12" fill="#1f2b38" text-anchor="middle">启动类加载器 Bootstrap</text>
  <text x="450" y="114" font-size="11" fill="#5b6b7c" text-anchor="middle">C++ 实现，加载 JAVA_HOME/lib，Java 侧为 null</text>
  <rect x="250" y="152" width="400" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="180" font-size="12" fill="#1f2b38" text-anchor="middle">扩展类加载器 Extension</text>
  <text x="450" y="202" font-size="11" fill="#5b6b7c" text-anchor="middle">JDK 9 起由平台类加载器取代</text>
  <rect x="250" y="240" width="400" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="268" font-size="12" fill="#1f2b38" text-anchor="middle">应用程序类加载器 App</text>
  <text x="450" y="290" font-size="11" fill="#5b6b7c" text-anchor="middle">加载 ClassPath，即 getSystemClassLoader()</text>
  <line x1="222" y1="280" x2="222" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="205" y="180" font-size="11" fill="#5b6b7c" text-anchor="end">① 委派向上</text>
  <text x="205" y="200" font-size="11" fill="#5b6b7c" text-anchor="end">父优先</text>
  <line x1="678" y1="96" x2="678" y2="280" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="698" y="180" font-size="11" fill="#5b6b7c" text-anchor="start">② 回退 findClass</text>
  <text x="698" y="200" font-size="11" fill="#5b6b7c" text-anchor="start">由自己加载</text>
  <text x="450" y="344" font-size="11" fill="#5b6b7c" text-anchor="middle">loadClass 的流程：已加载过直接返回 → 委派 parent → 父加载不到才调自己的 findClass</text>
  <text x="450" y="376" font-size="11" fill="#5b6b7c" text-anchor="middle">父子关系是组合而非继承 · 两个类相等要求同一个类加载器 · 想绕过委派（SPI、热部署）才重写 loadClass</text>
</svg>
