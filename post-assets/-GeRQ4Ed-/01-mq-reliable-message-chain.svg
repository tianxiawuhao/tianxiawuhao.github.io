<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MQ 消息从生产到消费的可靠性链路</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">MQ 不丢消息、不重复消费的全链路设计</text>

  <rect x="40" y="55" width="250" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="78" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">① 消息生产阶段</text>
  <rect x="325" y="55" width="250" height="36" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="78" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">② 消息存储阶段</text>
  <rect x="610" y="55" width="250" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="735" y="78" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">③ 消息消费阶段</text>

  <rect x="40" y="105" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="126" font-size="12" fill="#1f2b38" text-anchor="middle">发送前：拦截器注入</text>
  <text x="165" y="144" font-size="12" fill="#5b6b7c" text-anchor="middle">全局唯一 ID / 版本号</text>
  <rect x="40" y="175" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="196" font-size="12" fill="#1f2b38" text-anchor="middle">同步发送，校验 Broker</text>
  <text x="165" y="214" font-size="12" fill="#5b6b7c" text-anchor="middle">返回的 ack（异步需回调）</text>
  <rect x="40" y="245" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="266" font-size="12" fill="#1f2b38" text-anchor="middle">失败重试并记录异常</text>
  <text x="165" y="284" font-size="12" fill="#5b6b7c" text-anchor="middle">日志 + 监控告警</text>

  <rect x="325" y="105" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="126" font-size="12" fill="#1f2b38" text-anchor="middle">消息持久化落盘</text>
  <text x="450" y="144" font-size="12" fill="#5b6b7c" text-anchor="middle">（按刷盘策略）</text>
  <rect x="325" y="175" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="196" font-size="12" fill="#1f2b38" text-anchor="middle">主从副本同步</text>
  <text x="450" y="214" font-size="12" fill="#5b6b7c" text-anchor="middle">（至少 2 个副本）</text>
  <rect x="325" y="245" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="266" font-size="12" fill="#1f2b38" text-anchor="middle">副本写入成功之后</text>
  <text x="450" y="284" font-size="12" fill="#5b6b7c" text-anchor="middle">才返回 ack</text>

  <rect x="610" y="105" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="126" font-size="12" fill="#1f2b38" text-anchor="middle">消费端拦截器校验</text>
  <text x="735" y="144" font-size="12" fill="#5b6b7c" text-anchor="middle">ID 连续性 / 消费状态</text>
  <rect x="610" y="175" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="196" font-size="12" fill="#1f2b38" text-anchor="middle">幂等处理：消息日志表</text>
  <text x="735" y="214" font-size="12" fill="#5b6b7c" text-anchor="middle">或 Redis 唯一约束</text>
  <rect x="610" y="245" width="250" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="266" font-size="12" fill="#1f2b38" text-anchor="middle">业务处理完成之后</text>
  <text x="735" y="284" font-size="12" fill="#5b6b7c" text-anchor="middle">再发送消费确认</text>

  <line x1="290" y1="131" x2="322" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="575" y1="131" x2="607" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="165" y1="159" x2="165" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="165" y1="229" x2="165" y2="242" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="159" x2="450" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="229" x2="450" y2="242" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="735" y1="159" x2="735" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="735" y1="229" x2="735" y2="242" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="318" width="820" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="338" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">全局唯一 ID 贯穿三阶段：生产端注入 → 随消息持久化 → 消费端校验</text>
  <text x="450" y="356" font-size="12" fill="#5b6b7c" text-anchor="middle">它既是检测消息丢失的依据，也是消费端幂等去重的键</text>
</svg>
