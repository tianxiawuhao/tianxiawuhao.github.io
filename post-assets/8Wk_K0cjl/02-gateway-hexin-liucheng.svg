<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Cloud Gateway 请求处理核心流程</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9e5b"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Spring Cloud Gateway 请求处理核心流程</text>

  <!-- 客户端 -->
  <rect x="40" y="70" width="130" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="105" y="90" text-anchor="middle" font-size="13" fill="#1f2b38">客户端请求</text>
  <text x="105" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">HTTP 请求</text>

  <!-- 主链路 -->
  <rect x="230" y="70" width="250" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="355" y="90" text-anchor="middle" font-size="13" fill="#1f2b38">DispatcherHandler</text>
  <text x="355" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">WebFlux 前端控制器</text>

  <rect x="230" y="145" width="250" height="44" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="355" y="165" text-anchor="middle" font-size="13" fill="#1f2b38">RoutePredicateHandlerMapping</text>
  <text x="355" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">按断言匹配对应 Route</text>

  <rect x="230" y="225" width="250" height="44" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="355" y="245" text-anchor="middle" font-size="13" fill="#1f2b38">FilteringWebHandler</text>
  <text x="355" y="261" text-anchor="middle" font-size="11" fill="#5b6b7c">组装过滤器链</text>

  <rect x="230" y="305" width="250" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="355" y="327" text-anchor="middle" font-size="13" fill="#1f2b38">过滤器链（前置过滤）</text>
  <text x="355" y="345" text-anchor="middle" font-size="11" fill="#5b6b7c">Gateway Filter + Global Filter</text>

  <rect x="230" y="400" width="250" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="355" y="420" text-anchor="middle" font-size="13" fill="#1f2b38">代理请求到目标微服务</text>
  <text x="355" y="436" text-anchor="middle" font-size="11" fill="#5b6b7c">由 reactor-netty 发起</text>

  <line x1="170" y1="92" x2="228" y2="92" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="114" x2="355" y2="143" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="189" x2="355" y2="223" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="269" x2="355" y2="303" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="361" x2="355" y2="398" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 右侧说明面板 -->
  <rect x="560" y="70" width="300" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="578" y="94" font-size="12" font-weight="700" fill="#1f2b38">Route 由三部分组成</text>
  <text x="578" y="118" font-size="11" fill="#1f2b38">· id：路由唯一标识</text>
  <text x="578" y="140" font-size="11" fill="#1f2b38">· uri：转发目标地址</text>
  <text x="578" y="162" font-size="11" fill="#1f2b38">· predicates：匹配条件（断言）</text>
  <text x="578" y="184" font-size="11" fill="#1f2b38">· filters：请求与响应的处理逻辑</text>
  <text x="578" y="206" font-size="11" fill="#5b6b7c">断言全部匹配成功，路由才会生效</text>

  <!-- 前置过滤器侧注 -->
  <rect x="560" y="300" width="300" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="578" y="324" font-size="12" font-weight="700" fill="#e08a1e">前置过滤常见用途</text>
  <text x="578" y="348" font-size="11" fill="#1f2b38">鉴权校验、限流、重试、请求头改写</text>
  <text x="578" y="370" font-size="11" fill="#1f2b38">日志埋点、灰度与路由标记</text>
  <text x="578" y="390" font-size="11" fill="#5b6b7c">过滤器顺序由 @Order 决定</text>

  <line x1="480" y1="333" x2="558" y2="340" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="480" y1="150" x2="558" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 响应回流 -->
  <path d="M 150 92 L 150 470 L 355 470" fill="none" stroke="#2e9e5b" stroke-width="1.4"/>
  <line x1="355" y1="470" x2="360" y2="452" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ahg)"/>
  <text x="252" y="488" text-anchor="middle" font-size="11" fill="#2e9e5b">响应返回后执行后置过滤器，再回写客户端</text>
</svg>
