<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>无网关直连与引入 API 网关后的调用方式对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8d3e0"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
    <marker id="ahC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">无网关直连 与 引入 API 网关 的调用方式对比</text>

  <!-- ================= 左：无网关 ================= -->
  <rect x="20" y="50" width="420" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="140" y="65" width="180" height="32" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="86" text-anchor="middle" font-size="13" fill="#1f2b38">客户端</text>

  <rect x="45" y="135" width="120" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="105" y="155" text-anchor="middle" font-size="12" fill="#1f2b38">微服务 A</text>
  <text x="105" y="173" text-anchor="middle" font-size="11" fill="#5b6b7c">接口地址 1</text>

  <rect x="170" y="135" width="120" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="230" y="155" text-anchor="middle" font-size="12" fill="#1f2b38">微服务 B</text>
  <text x="230" y="173" text-anchor="middle" font-size="11" fill="#5b6b7c">接口地址 2</text>

  <rect x="295" y="135" width="120" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="355" y="155" text-anchor="middle" font-size="12" fill="#1f2b38">微服务 C</text>
  <text x="355" y="173" text-anchor="middle" font-size="11" fill="#5b6b7c">接口地址 3</text>

  <line x1="200" y1="97" x2="105" y2="133" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ahA)"/>
  <line x1="230" y1="97" x2="230" y2="133" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ahA)"/>
  <line x1="260" y1="97" x2="355" y2="133" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ahA)"/>

  <rect x="45" y="210" width="370" height="130" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="234" font-size="12" font-weight="700" fill="#e08a1e">存在的问题</text>
  <text x="60" y="258" font-size="12" fill="#1f2b38">· 客户端记录并管理全部接口，安全性差</text>
  <text x="60" y="282" font-size="12" fill="#1f2b38">· 认证鉴权逻辑在每个微服务重复实现</text>
  <text x="60" y="306" font-size="12" fill="#1f2b38">· 域名与端口各不相同，存在跨域风险</text>
  <text x="60" y="330" font-size="12" fill="#1f2b38">· 客户端越多，接口配置越难维护</text>

  <!-- ================= 右：有网关 ================= -->
  <rect x="460" y="50" width="420" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="580" y="65" width="180" height="32" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="86" text-anchor="middle" font-size="13" fill="#1f2b38">客户端</text>

  <rect x="570" y="137" width="200" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="157" text-anchor="middle" font-size="13" fill="#1f2b38">API 网关（统一入口）</text>
  <text x="670" y="174" text-anchor="middle" font-size="11" fill="#5b6b7c">路由 · 认证 · 限流 · 监控</text>

  <line x1="670" y1="97" x2="670" y2="135" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahB)"/>

  <rect x="485" y="245" width="105" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="537" y="273" text-anchor="middle" font-size="12" fill="#1f2b38">微服务 A</text>
  <rect x="617" y="245" width="105" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="669" y="273" text-anchor="middle" font-size="12" fill="#1f2b38">微服务 B</text>
  <rect x="749" y="245" width="105" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="801" y="273" text-anchor="middle" font-size="12" fill="#1f2b38">微服务 C</text>

  <line x1="640" y1="183" x2="537" y2="243" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahB)"/>
  <line x1="670" y1="183" x2="669" y2="243" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahB)"/>
  <line x1="700" y1="183" x2="801" y2="243" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahB)"/>

  <text x="670" y="316" text-anchor="middle" font-size="12" fill="#2e9e5b">客户端只与网关交互，微服务内部结构被封装</text>
  <line x1="460" y1="330" x2="880" y2="330" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="352" text-anchor="middle" font-size="11" fill="#5b6b7c">新增微服务或调整地址时，只需修改网关路由</text>
  <text x="670" y="372" text-anchor="middle" font-size="11" fill="#5b6b7c">通用逻辑在网关集中实现，业务服务更专注</text>

  <line x1="450" y1="215" x2="458" y2="215" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ahC)"/>
</svg>
