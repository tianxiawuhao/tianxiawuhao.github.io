<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Helm 3 核心概念与发布流程</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">Helm 3 核心概念与发布流程</text>

  <!-- 概念区 -->
  <rect x="30" y="56" width="840" height="132" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="78" font-size="13" font-weight="700" fill="#2f6fd0">三个核心概念</text>

  <rect x="55" y="88" width="250" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="67" y="116" font-size="13" font-weight="700" fill="#1f2b38">Chart</text>
  <text x="67" y="138" font-size="11" fill="#5b6b7c">K8s 资源模板包（tar）</text>
  <text x="67" y="157" font-size="11" fill="#5b6b7c">Chart.yaml、templates、values.yaml</text>

  <rect x="325" y="88" width="250" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="337" y="116" font-size="13" font-weight="700" fill="#1f2b38">Repository</text>
  <text x="337" y="138" font-size="11" fill="#5b6b7c">Chart 仓库（Web 服务器）</text>
  <text x="337" y="157" font-size="11" fill="#5b6b7c">index.yaml 提供清单查询</text>

  <rect x="595" y="88" width="250" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="607" y="116" font-size="13" font-weight="700" fill="#1f2b38">Release</text>
  <text x="607" y="138" font-size="11" fill="#5b6b7c">Chart 的部署实例</text>
  <text x="607" y="157" font-size="11" fill="#5b6b7c">状态存入 Secret，保留 history</text>

  <!-- 发布流程 -->
  <text x="40" y="206" font-size="13" font-weight="700" fill="#1f2b38">发布流程（Helm 3 无 Tiller，客户端直连 API Server）</text>

  <rect x="40" y="218" width="200" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="52" y="246" font-size="12" font-weight="700" fill="#1f2b38">helm 客户端</text>
  <text x="52" y="268" font-size="11" fill="#5b6b7c">helm install / upgrade</text>

  <line x1="244" y1="253" x2="264" y2="253" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="270" y="218" width="170" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="282" y="246" font-size="12" font-weight="700" fill="#1f2b38">解析 Chart 与 values</text>
  <text x="282" y="268" font-size="11" fill="#5b6b7c">渲染为 K8s manifest</text>

  <line x1="444" y1="253" x2="464" y2="253" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="218" width="160" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="482" y="246" font-size="12" font-weight="700" fill="#1f2b38">kube-apiserver</text>
  <text x="482" y="268" font-size="11" fill="#5b6b7c">创建 / 更新资源</text>

  <line x1="634" y1="253" x2="654" y2="253" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="660" y="218" width="200" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="672" y="246" font-size="12" font-weight="700" fill="#1f2b38">生成 Release</text>
  <text x="672" y="268" font-size="11" fill="#5b6b7c">helm rollback 的依据</text>

  <!-- 生命周期 -->
  <rect x="30" y="306" width="840" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="328" font-size="13" font-weight="700" fill="#2e9e5b">发布之后：版本管理与回滚</text>

  <rect x="53" y="338" width="185" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="65" y="362" font-size="12" font-weight="700" fill="#1f2b38">helm upgrade</text>
  <text x="65" y="382" font-size="11" fill="#5b6b7c">改配置后发布新版本</text>
  <text x="65" y="399" font-size="11" fill="#5b6b7c">生成新的 revision</text>

  <rect x="256" y="338" width="185" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="268" y="362" font-size="12" font-weight="700" fill="#1f2b38">helm history</text>
  <text x="268" y="382" font-size="11" fill="#5b6b7c">查看各 revision</text>
  <text x="268" y="399" font-size="11" fill="#5b6b7c">含状态与描述</text>

  <rect x="459" y="338" width="185" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="471" y="362" font-size="12" font-weight="700" fill="#1f2b38">helm rollback</text>
  <text x="471" y="382" font-size="11" fill="#5b6b7c">回滚到指定版本</text>
  <text x="471" y="399" font-size="11" fill="#5b6b7c">helm rollback web 2</text>

  <rect x="662" y="338" width="185" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="674" y="362" font-size="12" font-weight="700" fill="#1f2b38">helm uninstall</text>
  <text x="674" y="382" font-size="11" fill="#5b6b7c">删除 release</text>
  <text x="674" y="399" font-size="11" fill="#5b6b7c">--keep-history 保留历史</text>
</svg>
