<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">JWT 的三段结构与校验流程</text>
  <text x="450" y="57" text-anchor="middle" font-size="12" fill="#5b6b7c">header.payload.signature —— 前两段是 Base64Url 编码的明文，不是加密</text>

  <text x="25" y="90" font-size="12.5" font-weight="700" fill="#1f2b38">① Token 外观（两处圆点分隔三段）</text>
  <rect x="25" y="102" width="850" height="36" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="45" y="126" font-size="11.5">
    <tspan fill="#2f6fd0">eyJhbGciOiJIUzI1NiJ9</tspan><tspan fill="#5b6b7c">.</tspan><tspan fill="#2e9e5b">eyJzdWIiOiLlsI_nmb0ifQ</tspan><tspan fill="#5b6b7c">.</tspan><tspan fill="#e08a1e">5iVVdTw747L3ScHeCqle-bwj3cezK8NnE7VilQWOr8Y</tspan>
  </text>
  <line x1="200" y1="138" x2="200" y2="163" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="450" y1="138" x2="450" y2="163" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="700" y1="138" x2="700" y2="163" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="25" y="165" width="263" height="240" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="156" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Header</text>
  <text x="156" y="208" text-anchor="middle" font-size="11" fill="#5b6b7c">头部：元数据</text>
  <text x="42" y="236" font-size="12" fill="#1f2b38">alg：签名算法，如 HS256</text>
  <text x="42" y="258" font-size="12" fill="#1f2b38">typ：固定为 JWT</text>
  <text x="42" y="288" font-size="11.5" fill="#5b6b7c">JSON 经 Base64Url 编码</text>
  <text x="42" y="308" font-size="11.5" fill="#5b6b7c">得到 token 第一段</text>
  <text x="42" y="336" font-size="11.5" fill="#5b6b7c">示例明文：</text>
  <text x="42" y="356" font-size="11.5" fill="#1f2b38">{&quot;alg&quot;:&quot;HS256&quot;,</text>
  <text x="42" y="374" font-size="11.5" fill="#1f2b38"> &quot;typ&quot;:&quot;JWT&quot;}</text>
  <text x="42" y="394" font-size="11.5" fill="#5b6b7c">JJWT 中对应 signWith()</text>

  <rect x="318" y="165" width="263" height="240" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="449" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">Payload</text>
  <text x="449" y="208" text-anchor="middle" font-size="11" fill="#5b6b7c">载荷：标准声明 + 自定义</text>
  <text x="335" y="236" font-size="12" fill="#1f2b38">iss / sub / aud / exp</text>
  <text x="335" y="258" font-size="12" fill="#1f2b38">nbf / iat / jti</text>
  <text x="335" y="288" font-size="11.5" fill="#5b6b7c">自定义 claim：roles、logo</text>
  <text x="335" y="308" font-size="11.5" fill="#5b6b7c">同样只做 Base64Url 编码</text>
  <text x="335" y="336" font-size="11.5" fill="#e08a1e">任何人都能解开看到内容</text>
  <text x="335" y="356" font-size="11.5" fill="#1f2b38">禁止放密码、手机号、</text>
  <text x="335" y="374" font-size="11.5" fill="#1f2b38">身份证号等敏感信息</text>
  <text x="335" y="394" font-size="11.5" fill="#5b6b7c">体积越大，请求头越臃肿</text>

  <rect x="611" y="165" width="264" height="240" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="743" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">Signature</text>
  <text x="743" y="208" text-anchor="middle" font-size="11" fill="#5b6b7c">签名：防篡改的关键</text>
  <text x="628" y="236" font-size="12" fill="#1f2b38">HMACSHA256(</text>
  <text x="628" y="258" font-size="12" fill="#1f2b38">  base64Url(header)</text>
  <text x="628" y="280" font-size="12" fill="#1f2b38">  + &quot;.&quot; +</text>
  <text x="628" y="302" font-size="12" fill="#1f2b38">  base64Url(payload),</text>
  <text x="628" y="324" font-size="12" fill="#1f2b38">  secretKey )</text>
  <text x="628" y="352" font-size="11.5" fill="#1f2b38">只改 payload 不重算签名</text>
  <text x="628" y="370" font-size="11.5" fill="#1f2b38">服务端校验立刻失败</text>
  <text x="628" y="394" font-size="11.5" fill="#5b6b7c">HS256 密钥须足够长且保密</text>

  <text x="25" y="437" font-size="12.5" font-weight="700" fill="#1f2b38">② 服务端校验顺序（任一步失败即返回 401）</text>
  <text x="25" y="464" font-size="12.5" fill="#1f2b38">取 Authorization: Bearer &lt;token&gt; → 拆成三段并解码 → 按 header.alg 用服务端密钥验签 → 校验 exp/nbf/iss → 通过后才读 claim 授权</text>
  <rect x="25" y="478" width="850" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="45" y="500" font-size="12" fill="#2f6fd0">注意：校验必须由服务端完成，alg 只能取自服务端允许的算法白名单（拒绝 alg=none），不能听信 token 自报的算法。</text>
</svg>
