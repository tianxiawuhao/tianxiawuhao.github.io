<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>秒杀系统分层削峰：流量逐级衰减到数据库</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">秒杀分层削峰：把流量挡在数据库之前</text>

  <rect x="65" y="56" width="770" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="80" text-anchor="middle" font-size="12.5" fill="#1f2b38">① 接入层：CDN 静态化、按钮置灰、验证码防刷</text>

  <rect x="110" y="102" width="680" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="126" text-anchor="middle" font-size="12.5" fill="#1f2b38">② Nginx：动静分离、负载均衡、gzip 压缩</text>

  <rect x="152" y="148" width="595" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="172" text-anchor="middle" font-size="12.5" fill="#1f2b38">③ 服务集群：无状态水平扩容、库存预热到 Redis</text>

  <rect x="205" y="194" width="490" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="218" text-anchor="middle" font-size="12.5" fill="#1f2b38">④ Redis：Lua 原子扣减，挡住无效请求</text>

  <rect x="257" y="240" width="385" height="38" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="264" text-anchor="middle" font-size="12.5" fill="#1f2b38">⑤ MQ：削峰，按数据库能力匀速消费</text>

  <rect x="307" y="286" width="285" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="310" text-anchor="middle" font-size="12.5" fill="#1f2b38">⑥ MySQL：条件更新 + 唯一索引兜底</text>

  <line x1="862" y1="62" x2="862" y2="316" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="880" y="190" text-anchor="middle" font-size="12" fill="#5b6b7c" transform="rotate(90 880 190)">流量逐级衰减</text>

  <text x="450" y="362" text-anchor="middle" font-size="12" fill="#5b6b7c">Redis 单条命令是原子的，但「先查库存再扣减」不是原子操作，必须用 Lua 或 DECR 返回值判断</text>
</svg>
