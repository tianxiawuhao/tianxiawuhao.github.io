<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Kafka 与 Spark Streaming 集成数据流</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Kafka 与 Spark Streaming 集成数据流</text>

  <rect x="30" y="60" width="170" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="88" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">数据源</text>
  <text x="115" y="114" font-size="12" fill="#5b6b7c" text-anchor="middle">Kafka Producer</text>
  <text x="115" y="136" font-size="12" fill="#5b6b7c" text-anchor="middle">Flume / Twitter</text>
  <text x="115" y="158" font-size="12" fill="#5b6b7c" text-anchor="middle">日志文件</text>

  <line x1="200" y1="120" x2="243" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="250" y="60" width="170" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="335" y="88" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">Kafka 集群</text>
  <text x="335" y="114" font-size="12" fill="#1f2b38" text-anchor="middle">Broker + Topic</text>
  <text x="335" y="136" font-size="12" fill="#5b6b7c" text-anchor="middle">消息缓冲削峰</text>
  <text x="335" y="158" font-size="12" fill="#5b6b7c" text-anchor="middle">分区并行消费</text>

  <line x1="420" y1="120" x2="463" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="60" width="180" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="560" y="88" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">Spark Streaming</text>
  <text x="560" y="114" font-size="12" fill="#1f2b38" text-anchor="middle">createStream</text>
  <text x="560" y="136" font-size="12" fill="#1f2b38" text-anchor="middle">createDirectStream</text>
  <text x="560" y="158" font-size="12" fill="#5b6b7c" text-anchor="middle">按批拉取 DStream</text>

  <line x1="650" y1="120" x2="693" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="700" y="60" width="170" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="785" y="88" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">转换与计算</text>
  <text x="785" y="114" font-size="12" fill="#1f2b38" text-anchor="middle">map / reduce</text>
  <text x="785" y="136" font-size="12" fill="#1f2b38" text-anchor="middle">join / window</text>
  <text x="785" y="158" font-size="12" fill="#5b6b7c" text-anchor="middle">RDD 分布式处理</text>

  <line x1="785" y1="180" x2="785" y2="231" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="250" y="235" width="620" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="560" y="264" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="middle">结果输出</text>
  <text x="560" y="290" font-size="12" fill="#1f2b38" text-anchor="middle">另一个 Kafka Topic ｜ HDFS ｜ 数据库 ｜ 实时仪表板</text>
  <text x="560" y="312" font-size="12" fill="#5b6b7c" text-anchor="middle">Kafka 是实时数据的中心枢纽，Spark Streaming 负责消费与计算</text>
</svg>
