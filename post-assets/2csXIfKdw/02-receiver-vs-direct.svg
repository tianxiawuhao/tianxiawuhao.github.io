<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>KafkaUtils 两种消费 API 对比</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">KafkaUtils 两种消费 API 对比</text>

  <rect x="40" y="55" width="390" height="230" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="85" font-size="14" font-weight="700" fill="#2f6fd0">Receiver 模式：createStream</text>
  <text x="60" y="113" font-size="12" fill="#1f2b38">KafkaUtils.createStream(ssc, zkQuorum,</text>
  <text x="60" y="133" font-size="12" fill="#1f2b38">    groupId, topicMap)</text>
  <text x="60" y="163" font-size="12" fill="#1f2b38">· Receiver 线程接收数据</text>
  <text x="60" y="186" font-size="12" fill="#1f2b38">· 偏移量保存在 ZooKeeper</text>
  <text x="60" y="209" font-size="12" fill="#1f2b38">· 需 checkpoint + WAL 才不丢数据</text>
  <text x="60" y="232" font-size="12" fill="#1f2b38">· 并行度受 Receiver 数量限制</text>
  <text x="60" y="262" font-size="12" fill="#e08a1e">· 0.10 起官方推荐改用 Direct 模式</text>

  <rect x="470" y="55" width="390" height="230" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="490" y="85" font-size="14" font-weight="700" fill="#2e9e5b">Direct 模式：createDirectStream</text>
  <text x="490" y="113" font-size="12" fill="#1f2b38">KafkaUtils.createDirectStream(ssc,</text>
  <text x="490" y="133" font-size="12" fill="#1f2b38">    kafkaParams, topics)</text>
  <text x="490" y="163" font-size="12" fill="#1f2b38">· 直接查询分区并从 Broker 拉取</text>
  <text x="490" y="186" font-size="12" fill="#1f2b38">· 无 Receiver，无需 WAL</text>
  <text x="490" y="209" font-size="12" fill="#1f2b38">· 偏移量由 Spark 自己管理</text>
  <text x="490" y="232" font-size="12" fill="#1f2b38">· 每条消息恰好处理一次</text>
  <text x="490" y="262" font-size="12" fill="#2e9e5b">· 流式计算的首选方式</text>

  <text x="450" y="322" font-size="12" fill="#5b6b7c" text-anchor="middle">两者都基于 Spark Streaming 的微批模型；新项目也可考虑 Structured Streaming 的 Kafka Source</text>
</svg>
