<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ConcurrentHashMap 锁粒度对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">ConcurrentHashMap 锁粒度：JDK 1.7 分段锁 vs JDK 1.8 CAS + synchronized</text>
  <rect x="30" y="55" width="400" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="82" font-size="13" font-weight="700" fill="#2f6fd0">JDK 1.7：Segment[] 分段锁（默认 16 段）</text>
  <rect x="49" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="69" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S1</text><rect x="95" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="115" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S2</text><rect x="141" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="161" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S3</text><rect x="187" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="207" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S4</text><rect x="233" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="253" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S5</text><rect x="279" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="299" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S6</text><rect x="325" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="345" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S7</text><rect x="371" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="391" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">S8</text>
  <text x="50" y="160" font-size="12" fill="#5b6b7c">每段内部是一张 HashEntry 表，各段自带一把 ReentrantLock</text>
  <text x="50" y="185" font-size="12" fill="#5b6b7c">写操作：定位段 → lock() → 修改该段</text>
  <text x="50" y="210" font-size="12" fill="#5b6b7c">并发写上限 = 段数（默认 16）</text>
  <text x="50" y="235" font-size="12" fill="#5b6b7c">扩容只能逐段进行，段数初始化后不可变</text>
  <circle cx="450" cy="155" r="18" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="160" font-size="12" font-weight="700" fill="#5b6b7c" text-anchor="middle">VS</text>
  <rect x="470" y="55" width="400" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="82" font-size="13" font-weight="700" fill="#2e9e5b">JDK 1.8：Node[] + CAS / synchronized</text>
  <rect x="489" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="509" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">B1</text><rect x="535" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="555" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">B2</text><rect x="581" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="601" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">B3</text><rect x="627" y="100" width="40" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/><text x="647" y="124" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">B4</text><rect x="673" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="693" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">B5</text><rect x="719" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="739" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">B6</text><rect x="765" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="785" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">B7</text><rect x="811" y="100" width="40" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="831" y="124" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">B8</text>
  <text x="490" y="160" font-size="12" fill="#5b6b7c">空桶：CAS 写入；非空桶：synchronized 锁头节点</text>
  <text x="490" y="185" font-size="12" fill="#5b6b7c">锁对象是桶内首节点，粒度细到一个桶</text>
  <text x="490" y="210" font-size="12" fill="#5b6b7c">并发度随桶数量增长，不受固定段数限制</text>
  <text x="490" y="235" font-size="12" fill="#5b6b7c">size() 变为弱一致统计（baseCount + CounterCell）</text>
  <text x="30" y="295" font-size="12" fill="#5b6b7c">· 1.8 弃用分段锁的原因：分段锁额外占用内存；生产中写入极少命中同一把锁，分段反而造成等待；也有利于 GC 效率</text>
  <text x="30" y="320" font-size="12" fill="#5b6b7c">· 两代的读操作都不加锁，靠 volatile 读保证可见性，因此 get() 是弱一致的，不保证读到最新写入</text>
  <text x="30" y="345" font-size="12" fill="#5b6b7c">· 1.8 在链表长度达到 8 且数组容量 ≥ 64 时把桶内链表转为红黑树，最坏查找由 O(n) 降为 O(log n)</text>
  <text x="30" y="370" font-size="12" fill="#5b6b7c">· 1.8 支持多线程协同扩容（transfer + ForwardingNode），1.7 的 Segment 只能逐段扩容</text>
</svg>
