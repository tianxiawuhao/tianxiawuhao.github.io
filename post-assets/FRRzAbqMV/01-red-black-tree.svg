<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>红黑树示例</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">红黑树示例：根黑、红节点的子节点为黑、各路径黑高一致</text>
  <g stroke="#c8d3e0" stroke-width="1.4">
    <line x1="450" y1="90" x2="290" y2="180"/><line x1="450" y1="90" x2="610" y2="180"/>
    <line x1="290" y1="180" x2="190" y2="270"/><line x1="290" y1="180" x2="390" y2="270"/>
    <line x1="610" y1="180" x2="510" y2="270"/><line x1="610" y1="180" x2="710" y2="270"/>
  </g>
  <g stroke="#c8d3e0" stroke-width="1">
    <line x1="190" y1="270" x2="148" y2="340"/><line x1="190" y1="270" x2="232" y2="340"/>
    <line x1="390" y1="270" x2="348" y2="340"/><line x1="390" y1="270" x2="432" y2="340"/>
    <line x1="510" y1="270" x2="468" y2="340"/><line x1="510" y1="270" x2="552" y2="340"/>
    <line x1="710" y1="270" x2="668" y2="340"/><line x1="710" y1="270" x2="752" y2="340"/>
  </g>
  <g>
    <circle cx="450" cy="90" r="18" fill="#1f2b38" stroke="#1f2b38" stroke-width="1.4"/>
    <text x="450" y="95" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">30</text>
    <circle cx="290" cy="180" r="18" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
    <text x="290" y="185" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">15</text>
    <circle cx="610" cy="180" r="18" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
    <text x="610" y="185" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">50</text>
    <circle cx="190" cy="270" r="18" fill="#1f2b38" stroke="#1f2b38" stroke-width="1.4"/>
    <text x="190" y="275" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
    <circle cx="390" cy="270" r="18" fill="#1f2b38" stroke="#1f2b38" stroke-width="1.4"/>
    <text x="390" y="275" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">20</text>
    <circle cx="510" cy="270" r="18" fill="#1f2b38" stroke="#1f2b38" stroke-width="1.4"/>
    <text x="510" y="275" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">40</text>
    <circle cx="710" cy="270" r="18" fill="#1f2b38" stroke="#1f2b38" stroke-width="1.4"/>
    <text x="710" y="275" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">60</text>
    <rect x="142" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
    <rect x="226" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
    <rect x="342" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
    <rect x="426" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
    <rect x="462" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
    <rect x="546" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
    <rect x="662" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
    <rect x="746" y="334" width="12" height="12" rx="8" fill="#1f2b38"/>
  </g>
  <text x="30" y="378" font-size="12" fill="#5b6b7c">橙=红节点，墨色=黑节点，小方块=NIL 叶子（黑）；中序序列 10 &lt; 15 &lt; 20 &lt; 30 &lt; 40 &lt; 50 &lt; 60，故它同时是一棵二叉查找树</text>
</svg>
