<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>异步编程 7 种实现方式总览与选型</title>
  <rect width="900" height="500" fill="#ffffff"/>

  <text x="450" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">异步编程 7 种实现方式总览与选型</text>

  <!-- 分组 A：JDK 原生 -->
  <rect x="30" y="58" width="840" height="145" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="80" font-size="13" font-weight="700" fill="#2f6fd0">JDK 原生能力：手动管理并发与结果</text>

  <rect x="50" y="90" width="185" height="95" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="62" y="122" font-size="13" font-weight="700" fill="#1f2b38">1 线程 Thread</text>
  <text x="62" y="145" font-size="11" fill="#5b6b7c">继承 Thread 或实现</text>
  <text x="62" y="165" font-size="11" fill="#5b6b7c">Runnable，无返回值</text>

  <rect x="255" y="90" width="185" height="95" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="267" y="122" font-size="13" font-weight="700" fill="#1f2b38">2 Future</text>
  <text x="267" y="145" font-size="11" fill="#5b6b7c">线程池提交 Callable</text>
  <text x="267" y="165" font-size="11" fill="#5b6b7c">get() 阻塞取结果</text>

  <rect x="460" y="90" width="185" height="95" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="472" y="122" font-size="13" font-weight="700" fill="#1f2b38">3 FutureTask</text>
  <text x="472" y="145" font-size="11" fill="#5b6b7c">Runnable + Future</text>
  <text x="472" y="165" font-size="11" fill="#5b6b7c">可交线程直接执行</text>

  <rect x="665" y="90" width="185" height="95" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="677" y="122" font-size="13" font-weight="700" fill="#1f2b38">4 CompletableFuture</text>
  <text x="677" y="145" font-size="11" fill="#5b6b7c">回调式非阻塞编排</text>
  <text x="677" y="165" font-size="11" fill="#5b6b7c">组合 50+ 个 API</text>

  <!-- 分组 B：Spring 生态 -->
  <rect x="30" y="223" width="840" height="145" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="245" font-size="13" font-weight="700" fill="#2e9e5b">Spring 生态：以注解和事件为边界</text>

  <rect x="50" y="255" width="400" height="95" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="62" y="287" font-size="13" font-weight="700" fill="#1f2b38">5 @Async 注解</text>
  <text x="62" y="310" font-size="11" fill="#5b6b7c">方法级异步，需 @EnableAsync</text>
  <text x="62" y="330" font-size="11" fill="#5b6b7c">建议指定自定义线程池并返回 void / Future</text>

  <rect x="470" y="255" width="380" height="95" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="482" y="287" font-size="13" font-weight="700" fill="#1f2b38">6 ApplicationEvent 事件</text>
  <text x="482" y="310" font-size="11" fill="#5b6b7c">发布 / 订阅解耦，默认同步调用</text>
  <text x="482" y="330" font-size="11" fill="#5b6b7c">换 TaskExecutor 后消费端异步</text>

  <!-- 分组 C：架构层 -->
  <rect x="30" y="388" width="840" height="90" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="408" font-size="13" font-weight="700" fill="#e08a1e">架构层：用中间件解耦</text>
  <rect x="50" y="418" width="800" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="70" y="438" font-size="13" font-weight="700" fill="#1f2b38">7 消息队列 MQ</text>
  <text x="70" y="456" font-size="11" fill="#5b6b7c">生产者 → 消息队列（点对点 / 发布订阅）→ 消费者，削峰填谷、高吞吐低时延</text>
</svg>
