<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>多态的成员访问规则与向上向下转型</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">多态：编译期看左边，运行期看右边</text>

  <text x="40" y="52" font-size="12" font-weight="700" fill="#2f6fd0">① 子类重写父类方法</text>
  <rect x="330" y="60" width="240" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="82" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Worker（父类）</text>
  <text x="450" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">public void work()</text>
  <rect x="90" y="152" width="220" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="200" y="176" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Hr</text>
  <text x="200" y="194" font-size="11" fill="#5b6b7c" text-anchor="middle">重写 work()</text>
  <rect x="560" y="152" width="260" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="176" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Coder</text>
  <text x="690" y="194" font-size="11" fill="#5b6b7c" text-anchor="middle">重写 work() + study()</text>
  <line x1="200" y1="152" x2="384" y2="112" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="255" y="124" font-size="11" fill="#5b6b7c" text-anchor="middle">extends</text>
  <line x1="690" y1="152" x2="516" y2="112" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="645" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">extends</text>

  <text x="40" y="240" font-size="12" font-weight="700" fill="#2f6fd0">② 成员访问规则</text>
  <rect x="40" y="252" width="400" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="276" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">编译期：只看左边（父类型）</text>
  <text x="240" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">Worker w = new Coder();</text>
  <text x="240" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">w.study() → 编译错误：父类型没有 study()</text>
  <rect x="460" y="252" width="400" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="660" y="276" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">运行期：被重写的实例方法看右边</text>
  <text x="660" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">w.work() → 真正执行 Coder.work()</text>
  <text x="660" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">成员变量、静态方法仍然看左边</text>

  <text x="40" y="368" font-size="12" font-weight="700" fill="#2f6fd0">③ 转型</text>
  <rect x="40" y="378" width="400" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="240" y="400" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">向上转型：自动完成</text>
  <text x="240" y="424" font-size="11" fill="#5b6b7c" text-anchor="middle">Worker w = new Hr();　子类 → 父类</text>
  <rect x="460" y="378" width="400" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="660" y="400" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">向下转型：必须强转，先判断</text>
  <text x="660" y="424" font-size="11" fill="#5b6b7c" text-anchor="middle">if (w instanceof Coder c) { c.study(); }</text>
</svg>
