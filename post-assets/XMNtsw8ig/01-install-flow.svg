<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Linux 上安装 Node.js 的流程</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Linux 上安装 Node.js 的流程</text>

  <rect x="60" y="60" width="240" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="180" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">1 下载</text>
  <text x="180" y="108" text-anchor="middle" font-size="11" fill="#5b6b7c">wget node-*-linux-x64.tar.xz</text>

  <rect x="600" y="60" width="240" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">2 移动到指定目录</text>
  <text x="720" y="108" text-anchor="middle" font-size="11" fill="#5b6b7c">mv … /usr/local/node</text>

  <line x1="300" y1="91" x2="592" y2="91" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="600" y="152" width="240" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">3 解压</text>
  <text x="720" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">xz -d  →  tar -xvf</text>

  <line x1="720" y1="122" x2="720" y2="144" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="152" width="240" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="180" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">4 设置软链接</text>
  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">ln -s …/bin/node /usr/bin/node</text>

  <line x1="600" y1="183" x2="308" y2="183" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="255" width="240" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="180" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">5 安装 yarn</text>
  <text x="180" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">npm install yarn -g 并建链接</text>

  <line x1="180" y1="214" x2="180" y2="247" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="600" y="255" width="240" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="720" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">6 安装 cnpm</text>
  <text x="720" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">npm install -g 并建链接</text>

  <line x1="300" y1="286" x2="592" y2="286" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
