<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>解压后的目录与软链接指向关系</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">解压后的目录与软链接指向关系</text>

  <rect x="40" y="60" width="360" height="240" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="220" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">$PREFIX = /usr/local/node/node-v16.13.0-linux-x64</text>
  <line x1="64" y1="98" x2="376" y2="98" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="64" y="122" font-size="12" fill="#1f2b38">bin/</text>
  <text x="88" y="146" font-size="12" fill="#5b6b7c">├─ node</text>
  <text x="88" y="170" font-size="12" fill="#5b6b7c">├─ npm</text>
  <text x="88" y="194" font-size="12" fill="#5b6b7c">├─ yarn（npm install yarn -g 生成）</text>
  <text x="88" y="218" font-size="12" fill="#5b6b7c">└─ cnpm（npm install -g cnpm 生成）</text>
  <text x="64" y="250" font-size="12" fill="#1f2b38">lib/node_modules/</text>
  <text x="64" y="276" font-size="12" fill="#5b6b7c">include/ · share/ · CHANGELOG.md</text>

  <rect x="520" y="60" width="340" height="240" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="690" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">/usr/bin（已在 PATH 中）</text>
  <line x1="544" y1="98" x2="836" y2="98" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="544" y="146" font-size="12" fill="#1f2b38">/usr/bin/node</text>
  <text x="544" y="194" font-size="12" fill="#1f2b38">/usr/bin/npm</text>
  <text x="544" y="242" font-size="12" fill="#1f2b38">/usr/bin/yarn</text>
  <text x="544" y="290" font-size="12" fill="#1f2b38">/usr/bin/cnpm</text>

  <line x1="400" y1="146" x2="512" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="400" y1="194" x2="512" y2="194" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="400" y1="242" x2="512" y2="242" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="400" y1="290" x2="512" y2="290" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="456" y="322" text-anchor="middle" font-size="11" fill="#5b6b7c">ln -s 建立指向</text>
</svg>
