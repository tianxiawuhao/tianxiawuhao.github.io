<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>策略模式与模板方法对比图</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">策略 vs 模板方法：换掉整个算法，还是只放开几步</text>
<rect x="40" y="55" width="390" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="60" y="84" font-size="15" fill="#2f6fd0" text-anchor="start" font-weight="700">策略模式 Strategy</text>
<rect x="70" y="100" width="330" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="235" y="127" font-size="13" fill="#1f2b38" text-anchor="middle">PricingContext 持有抽象策略</text>
<line x1="235" y1="145" x2="235" y2="175" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="248" y="166" font-size="11.5" fill="#5b6b7c" text-anchor="start">运行期切换</text>
<rect x="70" y="180" width="330" height="34" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="235" y="202" font-size="12.5" fill="#1f2b38" text-anchor="middle">接口 DiscountStrategy.apply(price)</text>
<line x1="235" y1="214" x2="235" y2="226" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="120" y1="226" x2="350" y2="226" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="120" y1="226" x2="120" y2="236" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="235" y1="226" x2="235" y2="236" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="350" y1="226" x2="350" y2="236" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="70" y="238" width="100" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="120" y="262" font-size="12" fill="#1f2b38" text-anchor="middle">无折扣</text>
<text x="120" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">原价</text>
<rect x="185" y="238" width="100" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="235" y="262" font-size="12" fill="#1f2b38" text-anchor="middle">中级会员</text>
<text x="235" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">× 0.9</text>
<rect x="300" y="238" width="100" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="350" y="262" font-size="12" fill="#1f2b38" text-anchor="middle">高级会员</text>
<text x="350" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">× 0.8</text>
<text x="70" y="318" font-size="11.5" fill="#5b6b7c" text-anchor="start">组合 + 接口：任一时刻只用一个策略</text>
<text x="70" y="342" font-size="11.5" fill="#5b6b7c" text-anchor="start">调用方知道有哪些策略可选（白盒）</text>
<text x="70" y="366" font-size="11.5" fill="#5b6b7c" text-anchor="start">新增等级就是新增一个类，不改老代码</text>
<rect x="470" y="55" width="390" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="490" y="84" font-size="15" fill="#2e9e5b" text-anchor="start" font-weight="700">模板方法 Template Method</text>
<rect x="500" y="100" width="330" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="665" y="125" font-size="12.5" fill="#1f2b38" text-anchor="middle">importData() 声明为 final 的骨架</text>
<line x1="665" y1="141" x2="665" y2="153" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="500" y="155" width="200" height="26" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="512" y="172" font-size="12" fill="#1f2b38" text-anchor="start">open() 抽象方法</text>
<text x="712" y="172" font-size="11" fill="#5b6b7c" text-anchor="start">子类必须实现</text>
<rect x="500" y="191" width="200" height="26" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="512" y="208" font-size="12" fill="#1f2b38" text-anchor="start">read() 抽象方法</text>
<text x="712" y="208" font-size="11" fill="#5b6b7c" text-anchor="start">子类必须实现</text>
<rect x="500" y="227" width="200" height="26" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="512" y="244" font-size="12" fill="#1f2b38" text-anchor="start">needValidate() 钩子</text>
<text x="712" y="244" font-size="11" fill="#e08a1e" text-anchor="start">默认 true，子类可选覆盖</text>
<rect x="500" y="263" width="200" height="26" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="512" y="280" font-size="12" fill="#1f2b38" text-anchor="start">save() 抽象方法</text>
<text x="712" y="280" font-size="11" fill="#5b6b7c" text-anchor="start">子类必须实现</text>
<rect x="500" y="299" width="200" height="26" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="512" y="316" font-size="12" fill="#1f2b38" text-anchor="start">close() 具体方法</text>
<text x="712" y="316" font-size="11" fill="#5b6b7c" text-anchor="start">父类实现，子类可选覆盖</text>
<text x="490" y="348" font-size="11.5" fill="#5b6b7c" text-anchor="start">继承 + 抽象类：子类只填步骤，不改流程</text>
<text x="490" y="372" font-size="11.5" fill="#5b6b7c" text-anchor="start">好莱坞原则：别调用我们，我们会调用你</text>
  <!-- 制图说明：本图遵循站内自制示意图规范，白底卡片、纯矢量、无外链与脚本；内容要点：左半是策略模式用组合与接口在运行期换算法，右半是模板方法用继承固定骨架只放开步骤。 -->
</svg>
