<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>访问者的双重分派与备忘录的三角色协作</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">访问者：双重分派怎么发生</text>

  <rect x="60" y="56" width="200" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="76" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">Document</text>
  <text x="160" y="94" font-size="11" fill="#5b6b7c" text-anchor="middle">持有节点列表</text>

  <line x1="262" y1="79" x2="356" y2="79" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="309" y="70" font-size="11" fill="#5b6b7c" text-anchor="middle">① node.accept(v)</text>

  <rect x="360" y="56" width="200" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="460" y="76" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">Paragraph / Image</text>
  <text x="460" y="94" font-size="11" fill="#5b6b7c" text-anchor="middle">元素（稳定）</text>

  <line x1="562" y1="79" x2="656" y2="79" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="609" y="70" font-size="11" fill="#5b6b7c" text-anchor="middle">② visitor.visit(this)</text>

  <rect x="660" y="56" width="190" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="755" y="76" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">具体访问者</text>
  <text x="755" y="94" font-size="11" fill="#5b6b7c" text-anchor="middle">Markdown / 统计</text>

  <text x="60" y="130" font-size="11.5" fill="#5b6b7c" text-anchor="start">第一次分派决定「哪种元素」，第二次分派决定「哪个访问者」——两次虚方法调用共同选中最终方法，</text>
  <text x="60" y="150" font-size="11.5" fill="#5b6b7c" text-anchor="start">所以新增访问者不必改元素；反过来新增元素要改所有访问者。这就是「操作易加、元素难加」的由来。</text>

  <line x1="40" y1="176" x2="860" y2="176" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="204" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">备忘录：谁存、谁管、谁恢复</text>

  <rect x="70" y="228" width="200" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="252" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">发起人 Originator</text>
  <text x="170" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">拥有状态 · save / restore</text>

  <line x1="274" y1="258" x2="344" y2="258" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="309" y="248" font-size="11" fill="#5b6b7c" text-anchor="middle">创建快照</text>

  <rect x="348" y="228" width="200" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="448" y="252" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">备忘录 Memento</text>
  <text x="448" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">不可变快照 · 不暴露字段</text>

  <line x1="552" y1="258" x2="622" y2="258" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="587" y="248" font-size="11" fill="#5b6b7c" text-anchor="middle">保管</text>

  <rect x="626" y="228" width="200" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="726" y="252" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">管理者 Caretaker</text>
  <text x="726" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">栈式历史 · 不解读内容</text>

  <path d="M 726 292 L 726 320 L 170 320 L 170 292" fill="none" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="448" y="340" font-size="11.5" fill="#5b6b7c" text-anchor="middle">撤销时管理者弹出快照，交回发起人恢复状态</text>

  <rect x="40" y="358" width="820" height="92" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="382" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">三个容易混的对比</text>
  <text x="60" y="404" font-size="11.5" fill="#5b6b7c" text-anchor="start">备忘录 vs 原型：前者为了回到过去（存历史），后者为了少创建对象（造副本）。</text>
  <text x="60" y="424" font-size="11.5" fill="#5b6b7c" text-anchor="start">中介者 vs 外观：中介者是同事之间双向通信，外观是客户端到子系统的单向调用。</text>
  <text x="60" y="444" font-size="11.5" fill="#5b6b7c" text-anchor="start">中介者 vs 观察者：观察者仍持有目标引用，中介者把同事之间的引用全部收进中介。</text>
</svg>
