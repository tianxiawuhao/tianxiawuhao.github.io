<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>行为型模式地图：把会变的部分抽成对象</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">行为型模式地图：会变的那部分，抽成对象</text>
<text x="40" y="52" font-size="11.5" fill="#5b6b7c" text-anchor="start">会变化的部分</text>
<text x="410" y="52" font-size="11.5" fill="#5b6b7c" text-anchor="start">对应的行为型模式</text>
<rect x="40" y="62" width="290" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="185" y="86.5" font-size="12.5" fill="#1f2b38" text-anchor="middle">一整个算法要能随时替换</text>
<line x1="338" y1="82" x2="402" y2="82" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="62" width="450" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="548" y1="69" x2="548" y2="95" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="428" y="86.5" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">策略模式</text>
<text x="566" y="86.5" font-size="11.5" fill="#5b6b7c" text-anchor="start">Strategy · 运行期切换整套算法</text>
<rect x="40" y="120" width="290" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="185" y="144.5" font-size="12.5" fill="#1f2b38" text-anchor="middle">算法骨架固定，只放开几步</text>
<line x1="338" y1="140" x2="402" y2="140" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="120" width="450" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="548" y1="127" x2="548" y2="153" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="428" y="144.5" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">模板方法</text>
<text x="566" y="144.5" font-size="11.5" fill="#5b6b7c" text-anchor="start">Template Method · 子类只填步骤</text>
<rect x="40" y="178" width="290" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="185" y="202.5" font-size="12.5" fill="#1f2b38" text-anchor="middle">「谁需要被通知」会变</text>
<line x1="338" y1="198" x2="402" y2="198" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="178" width="450" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="548" y1="185" x2="548" y2="211" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="428" y="202.5" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">观察者模式</text>
<text x="566" y="202.5" font-size="11.5" fill="#5b6b7c" text-anchor="start">Observer · 状态一变一对多广播</text>
<rect x="40" y="236" width="290" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="185" y="260.5" font-size="12.5" fill="#1f2b38" text-anchor="middle">「这个请求谁来处理」会变</text>
<line x1="338" y1="256" x2="402" y2="256" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="236" width="450" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="548" y1="243" x2="548" y2="269" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="428" y="260.5" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">责任链模式</text>
<text x="566" y="260.5" font-size="11.5" fill="#5b6b7c" text-anchor="start">Chain of Responsibility · 依次尝试</text>
<rect x="40" y="294" width="290" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="185" y="318.5" font-size="12.5" fill="#1f2b38" text-anchor="middle">对象当前处在哪个阶段</text>
<line x1="338" y1="314" x2="402" y2="314" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="294" width="450" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="548" y1="301" x2="548" y2="327" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="428" y="318.5" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">状态模式</text>
<text x="566" y="318.5" font-size="11.5" fill="#5b6b7c" text-anchor="start">State · 状态迁移驱动行为变化</text>
<rect x="40" y="352" width="290" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="185" y="376.5" font-size="12.5" fill="#1f2b38" text-anchor="middle">一次请求要排队、可撤销</text>
<line x1="338" y1="372" x2="402" y2="372" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="352" width="450" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="548" y1="359" x2="548" y2="385" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="428" y="376.5" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">命令模式</text>
<text x="566" y="376.5" font-size="11.5" fill="#5b6b7c" text-anchor="start">Command · 请求封装成对象</text>
<rect x="40" y="410" width="290" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="185" y="434.5" font-size="12.5" fill="#1f2b38" text-anchor="middle">聚合的遍历顺序要能换</text>
<line x1="338" y1="430" x2="402" y2="430" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="410" width="450" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="548" y1="417" x2="548" y2="443" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="428" y="434.5" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">迭代器模式</text>
<text x="566" y="434.5" font-size="11.5" fill="#5b6b7c" text-anchor="start">Iterator · 遍历逻辑与聚合分离</text>
<text x="450" y="478" font-size="12" fill="#5b6b7c" text-anchor="middle">核心动作两步：找出会变的部分并抽成对象，再让稳定的一端持有它的引用</text>
  <!-- 制图说明：本图遵循站内自制示意图规范，白底卡片、纯矢量、无外链与脚本；内容要点：左侧是七种变化点，右侧是与之对应的行为型模式及一句话职责。 -->
</svg>
