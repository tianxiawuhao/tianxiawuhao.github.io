<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>坐标决定构件在仓库中的路径</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">坐标决定构件在仓库中的路径</text>

  <rect x="40" y="55" width="360" height="215" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="220" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">pom.xml 中的四个字段</text>
  <text x="62" y="112" font-size="11.5" fill="#5b6b7c">groupId</text>
  <text x="150" y="112" font-size="12" fill="#1f2b38">com.example.shop</text>
  <text x="62" y="145" font-size="11.5" fill="#5b6b7c">artifactId</text>
  <text x="150" y="145" font-size="12" fill="#1f2b38">shop-service</text>
  <text x="62" y="178" font-size="11.5" fill="#5b6b7c">version</text>
  <text x="150" y="178" font-size="12" fill="#1f2b38">1.0-SNAPSHOT</text>
  <text x="62" y="211" font-size="11.5" fill="#5b6b7c">packaging</text>
  <text x="150" y="211" font-size="12" fill="#1f2b38">jar</text>
  <text x="62" y="245" font-size="11.5" fill="#5b6b7c">packaging 决定扩展名：jar / war / pom</text>

  <line x1="410" y1="162" x2="490" y2="162" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="500" y="55" width="360" height="215" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="680" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b7c">本地仓库中的相对路径</text>
  <text x="520" y="112" font-size="12" fill="#1f2b38">com/example/shop/</text>
  <text x="520" y="142" font-size="12" fill="#1f2b38">└ shop-service/</text>
  <text x="520" y="172" font-size="12" fill="#1f2b38">  └ 1.0-SNAPSHOT/</text>
  <text x="520" y="202" font-size="12" fill="#2f6fd0">    └ shop-service-1.0-SNAPSHOT.jar</text>
  <text x="520" y="242" font-size="11.5" fill="#5b6b7c">groupId 的每个「.」= 一层目录</text>

  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#5b6b7c">本地仓库默认在 ~/.m2/repository，找不到才去远程下载并缓存</text>
</svg>
