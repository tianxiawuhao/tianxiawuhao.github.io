<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三套相互独立的生命周期</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">三套相互独立的生命周期</text>

  <rect x="40" y="58" width="110" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="95" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">clean</text>
  <rect x="175" y="58" width="110" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="92" text-anchor="middle" font-size="12" fill="#1f2b38">pre-clean</text>
  <line x1="289" y1="87" x2="307" y2="87" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="311" y="58" width="110" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="366" y="92" text-anchor="middle" font-size="12" fill="#1f2b38">clean</text>
  <line x1="425" y1="87" x2="443" y2="87" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="447" y="58" width="110" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="502" y="92" text-anchor="middle" font-size="12" fill="#1f2b38">post-clean</text>
  <text x="600" y="92" font-size="11.5" fill="#5b6b7c">clean 删除 target 目录</text>

  <rect x="40" y="136" width="110" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="95" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">default</text>
  <rect x="175" y="136" width="95" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="222" y="170" text-anchor="middle" font-size="12" fill="#1f2b38">validate</text>
  <line x1="272" y1="165" x2="291" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="293" y="136" width="95" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="340" y="170" text-anchor="middle" font-size="12" fill="#1f2b38">compile</text>
  <line x1="390" y1="165" x2="409" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="411" y="136" width="95" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="458" y="170" text-anchor="middle" font-size="12" fill="#1f2b38">test</text>
  <line x1="508" y1="165" x2="527" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="529" y="136" width="95" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="576" y="170" text-anchor="middle" font-size="12" fill="#1f2b38">package</text>
  <line x1="626" y1="165" x2="645" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="647" y="136" width="95" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="694" y="170" text-anchor="middle" font-size="12" fill="#1f2b38">install</text>
  <line x1="744" y1="165" x2="763" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="765" y="136" width="95" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="812" y="170" text-anchor="middle" font-size="12" fill="#1f2b38">deploy</text>

  <rect x="40" y="214" width="110" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="95" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">site</text>
  <rect x="175" y="214" width="110" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="248" text-anchor="middle" font-size="12" fill="#1f2b38">pre-site</text>
  <line x1="289" y1="243" x2="307" y2="243" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="311" y="214" width="110" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="366" y="248" text-anchor="middle" font-size="12" fill="#1f2b38">site</text>
  <line x1="425" y1="243" x2="443" y2="243" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="447" y="214" width="110" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="502" y="248" text-anchor="middle" font-size="12" fill="#1f2b38">post-site</text>
  <line x1="561" y1="243" x2="579" y2="243" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="583" y="214" width="110" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="638" y="248" text-anchor="middle" font-size="12" fill="#1f2b38">site-deploy</text>

  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#5b6b7c">执行某阶段时，同一生命周期中排在它前面的阶段都会先被执行</text>
</svg>
