<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>缓存穿透、击穿、雪崩的成因与解法对比</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">缓存穿透、击穿、雪崩：成因不同，解法也不同</text>

  <rect x="24" y="52" width="268" height="290" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="24" y="52" width="268" height="46" rx="8" fill="#fff6e8" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="158" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#e08a1e">穿透</text>
  <text x="40" y="124" font-size="11" font-weight="700" fill="#5b6b7c">成因</text>
  <text x="40" y="146" font-size="12" fill="#1f2b38">缓存与数据库都不存在</text>
  <text x="40" y="168" font-size="12" fill="#1f2b38">恶意 key 被反复查询</text>
  <line x1="40" y1="190" x2="276" y2="190" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="214" font-size="11" font-weight="700" fill="#e08a1e">解法</text>
  <text x="40" y="236" font-size="12" fill="#1f2b38">1. 缓存空值 + 短 TTL 30s</text>
  <text x="40" y="258" font-size="12" fill="#1f2b38">2. 布隆过滤器前置拦截</text>
  <text x="40" y="280" font-size="12" fill="#5b6b7c">（有误判率，不支持删除）</text>

  <rect x="316" y="52" width="268" height="290" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="316" y="52" width="268" height="46" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fd0">击穿</text>
  <text x="332" y="124" font-size="11" font-weight="700" fill="#5b6b7c">成因</text>
  <text x="332" y="146" font-size="12" fill="#1f2b38">热点 key 恰好过期</text>
  <text x="332" y="168" font-size="12" fill="#1f2b38">大量并发同时回源</text>
  <line x1="332" y1="190" x2="568" y2="190" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="332" y="214" font-size="11" font-weight="700" fill="#2f6fd0">解法</text>
  <text x="332" y="236" font-size="12" fill="#1f2b38">1. 互斥锁，只放一个请求回源</text>
  <text x="332" y="258" font-size="12" fill="#1f2b38">2. 其余请求短暂等待后重试</text>
  <text x="332" y="280" font-size="12" fill="#5b6b7c">（特征是并发查同一条数据）</text>

  <rect x="608" y="52" width="268" height="290" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="608" y="52" width="268" height="46" rx="8" fill="#eaf7ef" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="742" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#2e9e5b">雪崩</text>
  <text x="624" y="124" font-size="11" font-weight="700" fill="#5b6b7c">成因</text>
  <text x="624" y="146" font-size="12" fill="#1f2b38">大批 key 同一时刻失效</text>
  <text x="624" y="168" font-size="12" fill="#1f2b38">或缓存服务整体不可用</text>
  <line x1="624" y1="190" x2="860" y2="190" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="624" y="214" font-size="11" font-weight="700" fill="#2e9e5b">解法</text>
  <text x="624" y="236" font-size="12" fill="#1f2b38">1. 基础 TTL 叠加随机值打散</text>
  <text x="624" y="258" font-size="12" fill="#1f2b38">2. 主从 + 哨兵 / Cluster</text>
  <text x="624" y="280" font-size="12" fill="#1f2b38">3. 本地缓存 + 限流降级兜底</text>
</svg>
