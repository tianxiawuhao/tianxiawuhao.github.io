<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>Nginx 权重灰度与回滚</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" text-anchor="middle" font-size="17" fill="#1f2b38" font-weight="700">灰度发布：按权重切流量，异常时打回 0 即刻回滚</text>
<rect x="60" y="44" width="18" height="14" rx="3" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
<text x="86" y="56" text-anchor="start" font-size="12" fill="#1f2b38">v1 老版本（线上运行）</text>
<rect x="250" y="44" width="18" height="14" rx="3" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
<text x="276" y="56" text-anchor="start" font-size="12" fill="#1f2b38">v2 新版本（灰度）</text>
<text x="70" y="92" text-anchor="start" font-size="12.5" fill="#1f2b38">① 初始灰度：新版本只接 10% 流量（weight=9:1）</text>
<rect x="70" y="100" width="630" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<rect x="700" y="100" width="70" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="385.0" y="122" text-anchor="middle" font-size="11.5" fill="#1f2b38">v1 老版本 90%</text>
<text x="735.0" y="122" text-anchor="middle" font-size="11.5" fill="#1f2b38">v2 10%</text>
<text x="70" y="168" text-anchor="start" font-size="12.5" fill="#1f2b38">② 指标正常：各分一半（weight=5:5）</text>
<rect x="70" y="176" width="350" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<rect x="420" y="176" width="350" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="245.0" y="198" text-anchor="middle" font-size="12" fill="#1f2b38">v1 老版本 50%</text>
<text x="595.0" y="198" text-anchor="middle" font-size="12" fill="#1f2b38">v2 新版本 50%</text>
<text x="70" y="244" text-anchor="start" font-size="12.5" fill="#1f2b38">③ 继续放量：老版本只留 10%（weight=1:9）</text>
<rect x="70" y="252" width="70" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<rect x="140" y="252" width="630" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="105.0" y="274" text-anchor="middle" font-size="11.5" fill="#1f2b38">v1 10%</text>
<text x="455.0" y="274" text-anchor="middle" font-size="11.5" fill="#1f2b38">v2 新版本 90%</text>
<rect x="70" y="312" width="760" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="90" y="338" text-anchor="start" font-size="12.5" fill="#1f2b38">每轮改权重：9:1 → 5:5 → 1:9 → 0:10，同时观察错误率与 P95 延迟</text>
<text x="90" y="362" text-anchor="start" font-size="12.5" fill="#e08a1e">异常时把权重打回 0，流量立刻回到老版本，无需重新构建部署</text>
</svg>
