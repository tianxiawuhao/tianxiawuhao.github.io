<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>从提交到灰度上线的 CI/CD 链路</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" text-anchor="middle" font-size="17" fill="#1f2b38" font-weight="700">CI/CD 链路：提交 → 构建测试 → 打镜像推私仓 → 部署 → 灰度 → 回滚</text>
<rect x="60" y="64" width="240" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="180" y="90" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">① 提交代码</text>
<text x="180" y="110" text-anchor="middle" font-size="11.5" fill="#5b6b7c">git push / MR 触发</text>
<rect x="330" y="64" width="240" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="90" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">② 构建与单测</text>
<text x="450" y="110" text-anchor="middle" font-size="11.5" fill="#5b6b7c">mvn -B clean verify</text>
<rect x="600" y="64" width="240" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="720" y="90" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">③ 打镜像 + 推私仓</text>
<text x="720" y="110" text-anchor="middle" font-size="11.5" fill="#5b6b7c">jib:build → registry</text>
<line x1="300" y1="94" x2="330" y2="94" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="570" y1="94" x2="600" y2="94" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="720" y1="124" x2="720" y2="192" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="736" y="162" text-anchor="start" font-size="11.5" fill="#5b6b7c">同一份可追溯的产物往下走</text>
<rect x="600" y="196" width="240" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="720" y="222" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">④ 部署测试环境</text>
<text x="720" y="242" text-anchor="middle" font-size="11.5" fill="#5b6b7c">冒烟验证</text>
<rect x="330" y="196" width="240" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="450" y="222" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">⑤ 生产灰度</text>
<text x="450" y="242" text-anchor="middle" font-size="11.5" fill="#5b6b7c">新版本先接 10% 流量</text>
<rect x="60" y="196" width="240" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="180" y="222" text-anchor="middle" font-size="13" fill="#1f2b38" font-weight="700">⑥ 观察指标</text>
<text x="180" y="242" text-anchor="middle" font-size="11.5" fill="#5b6b7c">放量 or 回滚</text>
<line x1="600" y1="226" x2="570" y2="226" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="330" y1="226" x2="300" y2="226" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="60" y="290" width="780" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="316" text-anchor="start" font-size="12.5" fill="#1f2b38">版本可追溯：镜像 tag 用提交号（$CI_COMMIT_SHORT_SHA），不要只用 latest</text>
<text x="80" y="340" text-anchor="start" font-size="12.5" fill="#5b6b7c">回滚 = 把上一个 tag 重新部署一次，不必重新构建；失败必须通知到人（邮件 / 企业微信 / Slack）</text>
<text x="80" y="364" text-anchor="start" font-size="12.5" fill="#5b6b7c">凭据只放 Jenkins Credentials 或 GitLab CI Variables，不写进 Jenkinsfile 与 .gitlab-ci.yml</text>
</svg>
