<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JVM 运行时数据区：线程共享与线程独享</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">JVM 运行时数据区：线程共享与线程独享</text>

  <rect x="40" y="55" width="390" height="325" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">线程共享（所有线程共用一份）</text>
  <rect x="65" y="105" width="340" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">方法区 Method Area</text>
  <text x="235" y="170" text-anchor="middle" font-size="11" fill="#5b6b7c">类元信息 / 运行时常量池 / 静态变量</text>
  <text x="235" y="196" text-anchor="middle" font-size="11" fill="#e08a1e">JDK 8 起由元空间（本地内存）实现</text>
  <rect x="65" y="245" width="340" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">堆 Heap</text>
  <text x="235" y="310" text-anchor="middle" font-size="11" fill="#5b6b7c">所有对象与数组实例</text>
  <text x="235" y="334" text-anchor="middle" font-size="11" fill="#5b6b7c">垃圾收集器回收的主要区域</text>

  <rect x="470" y="55" width="390" height="325" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">线程独享（每个线程各一份）</text>
  <rect x="495" y="105" width="340" height="75" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Java 虚拟机栈</text>
  <text x="665" y="158" text-anchor="middle" font-size="11" fill="#5b6b7c">栈帧：局部变量表 / 操作数栈 / 返回地址</text>
  <rect x="495" y="195" width="340" height="75" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">本地方法栈</text>
  <text x="665" y="248" text-anchor="middle" font-size="11" fill="#5b6b7c">支撑 native 方法调用</text>
  <rect x="495" y="285" width="340" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">PC 寄存器</text>
  <text x="665" y="336" text-anchor="middle" font-size="11" fill="#5b6b7c">记录当前线程执行到的字节码地址</text>
</svg>
