<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JDK 7 到 JDK 8：永久代到元空间的迁移</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">JDK 7 到 JDK 8：永久代到元空间的迁移</text>

  <rect x="40" y="55" width="340" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">JDK 7 及以前</text>
  <text x="210" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">HotSpot 以永久代实现方法区</text>
  <rect x="60" y="130" width="300" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">堆 Heap</text>
  <text x="210" y="194" text-anchor="middle" font-size="11" fill="#5b6b7c">对象实例</text>
  <rect x="60" y="240" width="300" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="210" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">永久代 PermGen</text>
  <text x="210" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">类元信息 / 符号引用 / 静态变量</text>

  <rect x="520" y="55" width="340" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">JDK 8 及以后</text>
  <text x="690" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">方法区改由元空间实现</text>
  <rect x="540" y="130" width="300" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="690" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">堆 Heap</text>
  <text x="690" y="194" text-anchor="middle" font-size="11" fill="#5b6b7c">对象实例 / 字符串常量池 / 静态变量</text>
  <rect x="540" y="240" width="300" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">元空间 Metaspace</text>
  <text x="690" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">类元信息，改用本地内存</text>

  <line x1="382" y1="175" x2="516" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="448" y="164" text-anchor="middle" font-size="11" fill="#e08a1e">常量池下移至堆</text>
  <line x1="382" y1="285" x2="516" y2="285" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="448" y="274" text-anchor="middle" font-size="11" fill="#e08a1e">类元信息迁移</text>
</svg>
