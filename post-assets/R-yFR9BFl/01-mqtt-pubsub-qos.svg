<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MQTT 发布订阅模型与 QoS 0/1/2 消息确认流程</title>
  <rect width="900" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">MQTT 发布/订阅模型与 QoS 消息流程</text>

  <rect x="40" y="70" width="170" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">发布者 Publisher</text>
  <text x="125" y="121" text-anchor="middle" font-size="11" fill="#5b6b7c">publish(topic, msg, QoS)</text>

  <rect x="355" y="58" width="190" height="96" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="450" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">MQTT Broker</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#5b6b7c">主题树 · 订阅关系</text>
  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">会话 / 离线消息队列</text>

  <rect x="690" y="70" width="170" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="775" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">订阅者 Subscriber</text>
  <text x="775" y="121" text-anchor="middle" font-size="11" fill="#5b6b7c">subscribe(topic, QoS)</text>

  <line x1="214" y1="95" x2="348" y2="95" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="281" y="86" text-anchor="middle" font-size="11" fill="#5b6b7c">PUBLISH</text>

  <line x1="549" y1="80" x2="684" y2="80" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="616" y="71" text-anchor="middle" font-size="11" fill="#5b6b7c">投递消息</text>

  <line x1="684" y1="124" x2="551" y2="124" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="618" y="143" text-anchor="middle" font-size="11" fill="#5b6b7c">SUBSCRIBE / SUBACK</text>

  <rect x="40" y="205" width="820" height="305" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>

  <rect x="55" y="220" width="150" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="130" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">QoS 0</text>
  <text x="130" y="264" text-anchor="middle" font-size="11" fill="#5b6b7c">最多一次</text>
  <rect x="230" y="220" width="150" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="305" y="245" text-anchor="middle" font-size="12" fill="#1f2b38">PUBLISH</text>
  <text x="305" y="264" text-anchor="middle" font-size="11" fill="#5b6b7c">QoS 0</text>
  <line x1="382" y1="248" x2="406" y2="248" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="410" y="220" width="250" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="535" y="253" text-anchor="middle" font-size="12" fill="#1f2b38">Broker 直接转发，不回确认</text>
  <line x1="662" y1="248" x2="686" y2="248" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="220" width="170" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="775" y="253" text-anchor="middle" font-size="12" fill="#1f2b38">网络抖动即丢失</text>

  <rect x="55" y="320" width="150" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="130" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">QoS 1</text>
  <text x="130" y="364" text-anchor="middle" font-size="11" fill="#5b6b7c">至少一次</text>
  <rect x="230" y="320" width="150" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="305" y="345" text-anchor="middle" font-size="12" fill="#1f2b38">PUBLISH</text>
  <text x="305" y="364" text-anchor="middle" font-size="11" fill="#5b6b7c">QoS 1</text>
  <line x1="382" y1="348" x2="406" y2="348" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="410" y="320" width="250" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="535" y="345" text-anchor="middle" font-size="12" fill="#1f2b38">存储消息并回 PUBACK</text>
  <text x="535" y="364" text-anchor="middle" font-size="11" fill="#5b6b7c">未收到确认会重发</text>
  <line x1="662" y1="348" x2="686" y2="348" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="320" width="170" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="775" y="353" text-anchor="middle" font-size="12" fill="#1f2b38">可能重复，需幂等</text>

  <rect x="55" y="420" width="150" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="130" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">QoS 2</text>
  <text x="130" y="464" text-anchor="middle" font-size="11" fill="#5b6b7c">恰好一次</text>
  <rect x="230" y="420" width="150" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="305" y="445" text-anchor="middle" font-size="12" fill="#1f2b38">PUBLISH</text>
  <text x="305" y="464" text-anchor="middle" font-size="11" fill="#5b6b7c">QoS 2</text>
  <line x1="382" y1="448" x2="406" y2="448" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="410" y="420" width="250" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="535" y="445" text-anchor="middle" font-size="12" fill="#1f2b38">PUBREC → PUBREL → PUBCOMP</text>
  <text x="535" y="464" text-anchor="middle" font-size="11" fill="#5b6b7c">两次往返完成去重</text>
  <line x1="662" y1="448" x2="686" y2="448" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="420" width="170" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="775" y="453" text-anchor="middle" font-size="12" fill="#1f2b38">不丢不重</text>

  <text x="450" y="530" text-anchor="middle" font-size="12" fill="#e08a1e">实际投递 QoS = min(发布 QoS, 订阅 QoS)；离线消息依赖 cleanSession=false 的持久会话</text>
</svg>
