<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Sentinel 断路器 CLOSED、OPEN、HALF-OPEN 三态转换</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Sentinel 断路器三态转换（熔断降级）</text>

  <rect x="40" y="170" width="200" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">CLOSED 闭合</text>
  <text x="140" y="232" text-anchor="middle" font-size="12" fill="#5b6b7c">正常放行全部请求</text>
  <text x="140" y="256" text-anchor="middle" font-size="12" fill="#5b6b7c">统计慢调用与异常</text>

  <rect x="350" y="170" width="210" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="455" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">OPEN 打开（熔断）</text>
  <text x="455" y="232" text-anchor="middle" font-size="12" fill="#5b6b7c">拒绝请求，快速失败</text>
  <text x="455" y="256" text-anchor="middle" font-size="12" fill="#5b6b7c">不再调用目标服务</text>

  <rect x="660" y="170" width="200" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="760" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">HALF-OPEN 半开</text>
  <text x="760" y="232" text-anchor="middle" font-size="12" fill="#5b6b7c">放行一次探测请求</text>
  <text x="760" y="256" text-anchor="middle" font-size="12" fill="#5b6b7c">按探测结果决定去留</text>

  <line x1="240" y1="240" x2="344" y2="240" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="295" y="194" text-anchor="middle" font-size="11" fill="#e08a1e">慢调用/异常比例</text>
  <text x="295" y="212" text-anchor="middle" font-size="11" fill="#e08a1e">超过阈值触发熔断</text>

  <line x1="560" y1="240" x2="654" y2="240" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="610" y="194" text-anchor="middle" font-size="11" fill="#2f6fd0">熔断时长结束</text>
  <text x="610" y="212" text-anchor="middle" font-size="11" fill="#2f6fd0">进入半开状态</text>

  <path d="M 710 290 L 710 340 L 455 340 L 455 292" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="582" y="330" text-anchor="middle" font-size="11" fill="#e08a1e">探测请求失败：继续熔断</text>

  <path d="M 810 290 L 810 420 L 140 420 L 140 292" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="475" y="410" text-anchor="middle" font-size="11" fill="#2e9e5b">探测请求成功：断路器闭合，恢复正常</text>

  <text x="450" y="465" text-anchor="middle" font-size="11" fill="#5b6b7c">示例阈值：慢调用 RT &gt; 400ms、统计时长 10000ms、最小请求数 10、慢调用比例 0.6、熔断时长 5s</text>
</svg>
