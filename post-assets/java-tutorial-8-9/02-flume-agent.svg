<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flume Agent 结构：Source 经 Channel 到 Sink，用事务保证至少一次</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Flume Agent：Source → Channel → Sink 用事务串联</text>

  <text x="140" y="86" text-anchor="middle" font-size="11" fill="#5b6b7c">不断追加的 .log 文件</text>
  <rect x="40" y="100" width="200" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Source</text>
  <text x="140" y="152" text-anchor="middle" font-size="11.5" fill="#1f2b38">Taildir Source</text>
  <text x="140" y="172" text-anchor="middle" font-size="11" fill="#5b6b7c">positionFile 记录位点</text>

  <line x1="240" y1="145" x2="326" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="283" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">事务 1</text>

  <rect x="330" y="100" width="200" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="430" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Channel</text>
  <text x="430" y="152" text-anchor="middle" font-size="11.5" fill="#1f2b38">Memory ／ File</text>
  <text x="430" y="172" text-anchor="middle" font-size="11" fill="#5b6b7c">Memory 快但崩溃即丢</text>

  <line x1="530" y1="145" x2="616" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="573" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">事务 2</text>

  <rect x="620" y="100" width="240" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="740" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Sink</text>
  <text x="740" y="152" text-anchor="middle" font-size="11.5" fill="#1f2b38">HDFS Sink ／ KafkaSink</text>
  <text x="740" y="172" text-anchor="middle" font-size="11" fill="#5b6b7c">rollInterval 防小文件</text>

  <text x="40" y="230" font-size="12" fill="#1f2b38">至少一次（at-least-once）：不丢，但重启后可能重复，所以下游必须按主键幂等。</text>
  <text x="40" y="254" font-size="12" fill="#5b6b7c">删掉 positionFile 等于从头再读一遍；File Channel 更稳，代价是吞吐明显下降。</text>
</svg>
