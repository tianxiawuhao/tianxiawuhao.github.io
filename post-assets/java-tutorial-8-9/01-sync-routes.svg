<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四条数据采集路线：批量关系库、日志文件、binlog 增量、埋点指标流</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">按「数据从哪来、要什么时效」选采集工具</text>

  <text x="56" y="72" font-size="11.5" font-weight="700" fill="#5b6b7c">数据源</text>
  <text x="316" y="72" font-size="11.5" font-weight="700" fill="#5b6b7c">采集工具</text>
  <text x="606" y="72" font-size="11.5" font-weight="700" fill="#5b6b7c">下游存储与时效</text>

  <rect x="40" y="88" width="230" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="118" font-size="12" font-weight="700" fill="#1f2b38">业务库（MySQL／Oracle）</text>
  <text x="56" y="140" font-size="11" fill="#5b6b7c">JDBC 读取，可并发切分</text>
  <line x1="274" y1="126" x2="294" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="88" width="250" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="316" y="118" font-size="12" font-weight="700" fill="#1f2b38">Sqoop ／ DataX</text>
  <text x="316" y="140" font-size="11" fill="#5b6b7c">Sqoop 翻译成 MR；DataX 单机多线程</text>
  <line x1="554" y1="126" x2="584" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="590" y="88" width="270" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="606" y="118" font-size="12" font-weight="700" fill="#1f2b38">HDFS ／ Hive</text>
  <text x="606" y="140" font-size="11" fill="#5b6b7c">离线批任务：天级或小时级</text>

  <rect x="40" y="178" width="230" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="208" font-size="12" font-weight="700" fill="#1f2b38">应用服务器日志</text>
  <text x="56" y="230" font-size="11" fill="#5b6b7c">持续追加的文本文件</text>
  <line x1="274" y1="216" x2="294" y2="216" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="178" width="250" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="316" y="208" font-size="12" font-weight="700" fill="#1f2b38">Flume ／ Filebeat</text>
  <text x="316" y="230" font-size="11" fill="#5b6b7c">Source - Channel - Sink 事务</text>
  <line x1="554" y1="216" x2="584" y2="216" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="590" y="178" width="270" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="606" y="208" font-size="12" font-weight="700" fill="#1f2b38">HDFS ／ Kafka</text>
  <text x="606" y="230" font-size="11" fill="#5b6b7c">准实时汇聚，先落地再计算</text>

  <rect x="40" y="268" width="230" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="298" font-size="12" font-weight="700" fill="#1f2b38">MySQL binlog</text>
  <text x="56" y="320" font-size="11" fill="#5b6b7c">行级 insert／update／delete</text>
  <line x1="274" y1="306" x2="294" y2="306" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="268" width="250" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="316" y="298" font-size="12" font-weight="700" fill="#1f2b38">Canal ／ Debezium</text>
  <text x="316" y="320" font-size="11" fill="#5b6b7c">伪装成从库，走 dump 协议</text>
  <line x1="554" y1="306" x2="584" y2="306" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="590" y="268" width="270" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="606" y="298" font-size="12" font-weight="700" fill="#1f2b38">Kafka → Flink</text>
  <text x="606" y="320" font-size="11" fill="#5b6b7c">秒级／亚秒级增量，含删除</text>

  <rect x="40" y="358" width="230" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="388" font-size="12" font-weight="700" fill="#1f2b38">埋点与指标流</text>
  <text x="56" y="410" font-size="11" fill="#5b6b7c">轻量采集与清洗</text>
  <line x1="274" y1="396" x2="294" y2="396" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="358" width="250" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="316" y="388" font-size="12" font-weight="700" fill="#1f2b38">Filebeat ／ Logstash</text>
  <text x="316" y="410" font-size="11" fill="#5b6b7c">Fluentd 亦可，按已有技术栈选一</text>
  <line x1="554" y1="396" x2="584" y2="396" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="590" y="358" width="270" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="606" y="388" font-size="12" font-weight="700" fill="#1f2b38">Elasticsearch ／ Kafka</text>
  <text x="606" y="410" font-size="11" fill="#5b6b7c">秒级，与日志管道共用</text>

  <text x="40" y="472" font-size="12" fill="#1f2b38">先做全量快照、再从位点接增量；行数、位点、延迟、重试次数四个指标缺一不可。</text>
</svg>
