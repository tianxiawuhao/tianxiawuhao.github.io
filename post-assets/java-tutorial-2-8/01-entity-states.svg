<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JPA 实体的四种状态与状态转换</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">JPA 实体的四种状态与状态转换</text>

  <rect x="45" y="90" width="180" height="64" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="135" y="118" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">瞬时态 (New)</text>
  <text x="135" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">new 出来的普通对象</text>

  <line x1="225" y1="122" x2="354" y2="122" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="290" y="112" font-size="11" fill="#5b6b7c" text-anchor="middle">persist()</text>

  <rect x="360" y="90" width="180" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="118" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">持久化态 (Managed)</text>
  <text x="450" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">进入一级缓存，可脏检查</text>

  <line x1="540" y1="108" x2="669" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="605" y="99" font-size="11" fill="#5b6b7c" text-anchor="middle">close() / clear()</text>

  <rect x="675" y="90" width="180" height="64" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="118" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">游离态 (Detached)</text>
  <text x="765" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">em 关闭或 clear 之后</text>

  <line x1="675" y1="142" x2="546" y2="142" stroke="#7a5bd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="610" y="176" font-size="11" fill="#7a5bd0" text-anchor="middle">merge()：改动复制回托管实例</text>

  <line x1="450" y1="154" x2="450" y2="234" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="462" y="200" font-size="11" fill="#e08a1e">remove()</text>

  <rect x="360" y="240" width="180" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="268" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">删除态 (Removed)</text>
  <text x="450" y="290" font-size="11" fill="#5b6b7c" text-anchor="middle">remove() 之后、提交前</text>

  <line x1="450" y1="304" x2="450" y2="324" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="340" y="330" width="220" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="355" font-size="12" fill="#2e9e5b" text-anchor="middle">commit 后表里的行被真正删除</text>

  <text x="45" y="344" font-size="11" fill="#5b6b7c">脏检查：持久化态改字段无需 update()</text>
  <text x="45" y="366" font-size="11" fill="#5b6b7c">回滚 rollback 则退回持久化态</text>
  <text x="675" y="344" font-size="11" fill="#5b6b7c">写操作必须在活动事务中</text>
  <text x="675" y="366" font-size="11" fill="#5b6b7c">同一 em 二次 find 走一级缓存</text>
</svg>
