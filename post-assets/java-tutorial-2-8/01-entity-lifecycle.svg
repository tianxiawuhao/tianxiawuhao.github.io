<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JPA 实体四种状态与流转关系</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">JPA 实体四态：persist、remove、close 与 merge 怎么流转</text>

  <rect x="60" y="130" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="145" y="158" font-size="13.5" font-weight="700" fill="#1f2b38" text-anchor="middle">瞬时态 New</text>
  <text x="145" y="180" font-size="11.5" fill="#5b6b7c" text-anchor="middle">new 出来的对象</text>

  <rect x="365" y="70" width="180" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="455" y="100" font-size="13.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">持久化态 Managed</text>
  <text x="455" y="122" font-size="11.5" fill="#5b6b7c" text-anchor="middle">persist 或查询之后</text>
  <text x="455" y="140" font-size="11.5" fill="#5b6b7c" text-anchor="middle">脏检查自动同步</text>

  <rect x="365" y="240" width="180" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="455" y="268" font-size="13.5" font-weight="700" fill="#e08a1e" text-anchor="middle">删除态 Removed</text>
  <text x="455" y="290" font-size="11.5" fill="#5b6b7c" text-anchor="middle">remove 后，提交时删行</text>

  <rect x="670" y="170" width="180" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="760" y="198" font-size="13.5" font-weight="700" fill="#2e9e5b" text-anchor="middle">游离态 Detached</text>
  <text x="760" y="220" font-size="11.5" fill="#5b6b7c" text-anchor="middle">close 或 clear 之后</text>

  <line x1="232" y1="168" x2="358" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="240" y="150" font-size="11.5" fill="#5b6b7c">persist()</text>

  <line x1="420" y1="152" x2="420" y2="236" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="430" y="200" font-size="11.5" fill="#5b6b7c">remove()</text>

  <line x1="547" y1="108" x2="664" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="556" y="160" font-size="11.5" fill="#5b6b7c">close() / clear()</text>

  <path d="M 760 242 L 760 330 L 480 330 L 480 154" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="492" y="322" font-size="11.5" fill="#5b6b7c">merge()：把游离对象的改动复制回托管实例并返回它</text>

  <text x="60" y="364" font-size="12" fill="#5b6b7c">持久化态：字段改动在 flush 时自动 UPDATE，不需要调用 update()；同一个 EntityManager 内同主键只查一次</text>
  <text x="60" y="386" font-size="12" fill="#5b6b7c">写操作必须包在活动事务里，否则不落库；EntityManager 非线程安全，用完必须 close</text>
</svg>
