<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>窗口 TVF 的三种窗口：TUMBLE、HOP、CUMULATE</title>
  <desc>示意图：滚动窗口 TUMBLE 只给一个窗口大小参数，窗口等长且互不重叠，每条数据只属于一个窗口；滑动窗口 HOP 给出滑动步长和窗口大小，窗口相互重叠，一条数据会属于多个窗口；累积窗口 CUMULATE 给出步长和最大窗口大小，窗口从起点逐步扩大，适合结果持续更新的累计统计。底部给出三种窗口 TVF 的 SQL 调用形式。</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">窗口 TVF：TUMBLE / HOP / CUMULATE</text>

  <rect x="30" y="55" width="260" height="245" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">TUMBLE 滚动窗口</text>
  <text x="160" y="105" font-size="11" fill="#5b6b7c" text-anchor="middle">size = 10s</text>
  <rect x="60" y="120" width="60" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="142" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">W1</text>
  <text x="90" y="160" font-size="11" fill="#5b6b7c" text-anchor="middle">0-10s</text>
  <rect x="130" y="120" width="60" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="142" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">W2</text>
  <text x="160" y="160" font-size="11" fill="#5b6b7c" text-anchor="middle">10-20s</text>
  <rect x="200" y="120" width="60" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="142" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">W3</text>
  <text x="230" y="160" font-size="11" fill="#5b6b7c" text-anchor="middle">20-30s</text>
  <line x1="50" y1="195" x2="268" y2="195" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="250" y="186" font-size="11" fill="#5b6b7c" text-anchor="end">时间</text>
  <text x="160" y="228" font-size="11" fill="#5b6b7c" text-anchor="middle">窗口等长、互不重叠</text>
  <text x="160" y="252" font-size="11" fill="#5b6b7c" text-anchor="middle">每条数据只属于一个窗口</text>

  <rect x="320" y="55" width="260" height="245" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">HOP 滑动窗口</text>
  <text x="450" y="105" font-size="11" fill="#5b6b7c" text-anchor="middle">size = 10s，slide = 5s</text>
  <rect x="350" y="120" width="100" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="400" y="146" font-size="12" fill="#1f2b38" text-anchor="middle">W1 0-10s</text>
  <rect x="450" y="120" width="100" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="500" y="146" font-size="12" fill="#1f2b38" text-anchor="middle">W3 10-20s</text>
  <rect x="400" y="167" width="100" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="193" font-size="12" fill="#1f2b38" text-anchor="middle">W2 5-15s</text>
  <line x1="340" y1="225" x2="558" y2="225" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="540" y="216" font-size="11" fill="#5b6b7c" text-anchor="end">时间</text>
  <text x="450" y="252" font-size="11" fill="#5b6b7c" text-anchor="middle">窗口重叠，一条数据属于多个窗口</text>

  <rect x="610" y="55" width="260" height="245" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">CUMULATE 累积窗口</text>
  <text x="740" y="105" font-size="11" fill="#5b6b7c" text-anchor="middle">step = 5s，size = 15s</text>
  <rect x="640" y="120" width="60" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="142" font-size="12" fill="#1f2b38" text-anchor="middle">0-5s</text>
  <rect x="640" y="160" width="120" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="700" y="182" font-size="12" fill="#1f2b38" text-anchor="middle">0-10s</text>
  <rect x="640" y="200" width="220" height="34" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="750" y="222" font-size="12" fill="#1f2b38" text-anchor="middle">0-15s</text>
  <text x="740" y="252" font-size="11" fill="#5b6b7c" text-anchor="middle">窗口逐步累积扩大</text>

  <rect x="30" y="315" width="840" height="75" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="45" y="340" font-size="11" fill="#1f2b38">TUMBLE(TABLE t, DESCRIPTOR(ts), INTERVAL '10' SECOND)</text>
  <text x="45" y="362" font-size="11" fill="#1f2b38">HOP(TABLE t, DESCRIPTOR(ts), INTERVAL '5' SECOND, INTERVAL '10' SECOND)</text>
  <text x="45" y="384" font-size="11" fill="#1f2b38">CUMULATE(TABLE t, DESCRIPTOR(ts), INTERVAL '5' SECOND, INTERVAL '15' SECOND)</text>
</svg>
