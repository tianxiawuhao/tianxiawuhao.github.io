<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Table API 与 SQL 程序的执行链路</title>
  <desc>示意图：SQL 文本或 Table API 调用交给 TableEnvironment（Catalog + Planner），先生成逻辑计划 RelNode，再经优化器（规则与代价模型）得到物理执行计划 ExecNode，最后落到 Flink Runtime 的 DataStream 算子上运行，结果以 Changelog 流的形式输出（+I 插入、-U 更新前、+U 更新后、-D 删除）。Table API 与 SQL 共用同一套 Planner 与 Runtime。</desc>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Table API / SQL 程序的执行链路</text>

  <rect x="42" y="60" width="185" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="134" y="84" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">SQL 文本 / Table API</text>
  <text x="134" y="104" font-size="11" fill="#5b6b7c" text-anchor="middle">声明式调用</text>

  <rect x="252" y="60" width="185" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="344" y="84" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">TableEnvironment</text>
  <text x="344" y="104" font-size="11" fill="#5b6b7c" text-anchor="middle">Catalog + Planner</text>

  <rect x="462" y="60" width="185" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="554" y="84" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">逻辑计划（RelNode）</text>
  <text x="554" y="104" font-size="11" fill="#5b6b7c" text-anchor="middle">语法校验 + 关系代数</text>

  <rect x="672" y="60" width="185" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="764" y="84" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">优化器</text>
  <text x="764" y="104" font-size="11" fill="#5b6b7c" text-anchor="middle">规则 + 代价模型</text>

  <line x1="228" y1="89" x2="249" y2="89" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="438" y1="89" x2="459" y2="89" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="648" y1="89" x2="669" y2="89" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <path d="M 764 118 L 764 148 L 720 148 L 720 186" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="595" y="190" width="250" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="720" y="214" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">物理执行计划（ExecNode）</text>
  <text x="720" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">算子链 + 代码生成</text>

  <rect x="325" y="190" width="250" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="214" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Flink Runtime</text>
  <text x="450" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">DataStream 算子 + State</text>

  <rect x="55" y="190" width="250" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="180" y="214" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">结果表 / Changelog 流</text>
  <text x="180" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">+I  -U  +U  -D</text>

  <line x1="593" y1="219" x2="577" y2="219" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="323" y1="219" x2="307" y2="219" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="275" font-size="12" fill="#5b6b7c" text-anchor="middle">Table API 与 SQL 共用同一套 Planner 与 Runtime（约 80% 代码公用）</text>
</svg>
