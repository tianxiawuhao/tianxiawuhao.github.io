<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>动态表与连续查询</title>
  <desc>示意图：无界数据流（只追加的 Source）被映射为动态表，动态表是逻辑表，会随每条流入数据持续变化；针对动态表的连续查询（Continuous Query）长期运行，中间结果保存在 State 中，查询结果同样是一张不断变化的动态表，最终按操作类型编码成 Changelog 流输出（+I 插入、-U 更新前、+U 更新后、-D 删除），对外部系统表现为 Append-only、Retract 或 Upsert 编码。</desc>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">动态表（Dynamic Table）与连续查询（Continuous Query）</text>

  <rect x="290" y="55" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="78" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">无界数据流 Source</text>
  <text x="450" y="96" font-size="11" fill="#5b6b7c" text-anchor="middle">只有追加（+I），永不更新</text>

  <line x1="450" y1="105" x2="450" y2="121" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="190" y="125" width="520" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="150" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">动态表 Dynamic Table（逻辑表）</text>
  <text x="450" y="169" font-size="11" fill="#5b6b7c" text-anchor="middle">每次流入数据都相当于对表的一次修改，表内容持续变化</text>

  <line x1="450" y1="179" x2="450" y2="201" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="205" width="560" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="230" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">连续查询 Continuous Query</text>
  <text x="340" y="249" font-size="11" fill="#5b6b7c" text-anchor="middle">SQL 长期运行、不断执行，结果表被持续更新，而不是执行一次就结束</text>

  <rect x="650" y="205" width="200" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="750" y="230" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">State</text>
  <text x="750" y="249" font-size="11" fill="#5b6b7c" text-anchor="middle">保存中间结果</text>

  <line x1="648" y1="231" x2="624" y2="231" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="340" y1="259" x2="340" y2="279" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="190" y="283" width="520" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="308" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">结果动态表按操作类型编码为 Changelog 流</text>
  <text x="450" y="328" font-size="11" fill="#5b6b7c" text-anchor="middle">+I 插入　-U 更新前旧值　+U 更新后新值　-D 删除</text>

  <text x="450" y="372" font-size="12" fill="#5b6b7c" text-anchor="middle">对外输出时按编码方式分为 Append-only 流、Retract 流、Upsert 流</text>
</svg>
