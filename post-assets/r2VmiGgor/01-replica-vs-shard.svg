<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>副本与分片的区别</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">副本与分片的区别</text>

  <rect x="25" y="52" width="410" height="270" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">副本：每台节点都保存全量数据</text>
  <rect x="45" y="100" width="110" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck101</text>
  <text x="100" y="156" text-anchor="middle" font-size="12" fill="#5b6b7c">全量数据</text>
  <text x="100" y="180" text-anchor="middle" font-size="12" fill="#5b6b7c">A B C D</text>
  <text x="100" y="204" text-anchor="middle" font-size="12" fill="#5b6b7c">数据一致</text>
  <rect x="175" y="100" width="110" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck102</text>
  <text x="230" y="156" text-anchor="middle" font-size="12" fill="#5b6b7c">全量数据</text>
  <text x="230" y="180" text-anchor="middle" font-size="12" fill="#5b6b7c">A B C D</text>
  <text x="230" y="204" text-anchor="middle" font-size="12" fill="#5b6b7c">数据一致</text>
  <rect x="305" y="100" width="110" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="360" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck103</text>
  <text x="360" y="156" text-anchor="middle" font-size="12" fill="#5b6b7c">全量数据</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#5b6b7c">A B C D</text>
  <text x="360" y="204" text-anchor="middle" font-size="12" fill="#5b6b7c">数据一致</text>
  <text x="45" y="252" font-size="12" fill="#1f2b38">• 提高可用性，单节点宕机不丢数据</text>
  <text x="45" y="278" font-size="12" fill="#1f2b38">• 每台仍存全量数据，容量无法横向扩展</text>
  <text x="45" y="304" font-size="12" fill="#1f2b38">• 写入靠 ZooKeeper 协调副本同步</text>

  <rect x="465" y="52" width="410" height="270" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">分片：数据被切分到不同节点</text>
  <rect x="485" y="100" width="110" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="540" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck101</text>
  <text x="540" y="150" text-anchor="middle" font-size="12" fill="#5b6b7c">shard01</text>
  <text x="540" y="172" text-anchor="middle" font-size="12" fill="#5b6b7c">数据 A、B</text>
  <text x="540" y="194" text-anchor="middle" font-size="12" fill="#5b6b7c">rep_1_1</text>
  <rect x="615" y="100" width="110" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck102</text>
  <text x="670" y="150" text-anchor="middle" font-size="12" fill="#5b6b7c">shard01</text>
  <text x="670" y="172" text-anchor="middle" font-size="12" fill="#5b6b7c">数据 A、B</text>
  <text x="670" y="194" text-anchor="middle" font-size="12" fill="#5b6b7c">rep_1_2</text>
  <rect x="745" y="100" width="110" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="800" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck103</text>
  <text x="800" y="150" text-anchor="middle" font-size="12" fill="#5b6b7c">shard02</text>
  <text x="800" y="172" text-anchor="middle" font-size="12" fill="#5b6b7c">数据 C、D</text>
  <text x="800" y="194" text-anchor="middle" font-size="12" fill="#5b6b7c">rep_2_1</text>
  <text x="485" y="252" font-size="12" fill="#1f2b38">• 单机数据量与查询压力下降</text>
  <text x="485" y="278" font-size="12" fill="#1f2b38">• 由 Distributed 表拼接各分片结果</text>
  <text x="485" y="304" font-size="12" fill="#1f2b38">• 跨分片聚合与网络开销增加</text>
</svg>
