<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三节点两分片集群拓扑</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">三节点、两分片（shard01 双副本）集群拓扑</text>

  <rect x="350" y="52" width="200" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">客户端 clickhouse-client</text>
  <line x1="450" y1="96" x2="450" y2="114" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="310" y="118" width="280" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">分布式表 st_order_mt_all</text>
  <text x="450" y="160" text-anchor="middle" font-size="12" fill="#5b6b7c">Distributed 引擎按分片键路由</text>

  <path d="M 450 168 V 192 H 250 V 206" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 168 V 192 H 655 V 206" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="210" width="380" height="170" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="250" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">分片 1（shard=01，2 个副本）</text>
  <rect x="80" y="252" width="160" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="160" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck101</text>
  <text x="160" y="306" text-anchor="middle" font-size="12" fill="#5b6b7c">replica = rep_1_1</text>
  <text x="160" y="330" text-anchor="middle" font-size="12" fill="#5b6b7c">本地表 st_order_mt</text>
  <text x="160" y="354" text-anchor="middle" font-size="12" fill="#5b6b7c">分片 1 全量数据</text>
  <rect x="260" y="252" width="160" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck102</text>
  <text x="340" y="306" text-anchor="middle" font-size="12" fill="#5b6b7c">replica = rep_1_2</text>
  <text x="340" y="330" text-anchor="middle" font-size="12" fill="#5b6b7c">本地表 st_order_mt</text>
  <text x="340" y="354" text-anchor="middle" font-size="12" fill="#5b6b7c">分片 1 全量数据</text>

  <rect x="470" y="210" width="370" height="170" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="655" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">分片 2（shard=02，1 个副本）</text>
  <rect x="560" y="252" width="190" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="655" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ck103</text>
  <text x="655" y="306" text-anchor="middle" font-size="12" fill="#5b6b7c">replica = rep_2_1</text>
  <text x="655" y="330" text-anchor="middle" font-size="12" fill="#5b6b7c">本地表 st_order_mt</text>
  <text x="655" y="354" text-anchor="middle" font-size="12" fill="#5b6b7c">分片 2 全量数据</text>

  <line x1="160" y1="362" x2="160" y2="400" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="340" y1="362" x2="340" y2="400" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="655" y1="362" x2="655" y2="400" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="60" y="400" width="780" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ZooKeeper 集群（ck101 / ck102 / ck103:2181）</text>
  <text x="450" y="444" text-anchor="middle" font-size="12" fill="#5b6b7c">协调副本日志同步、分布式 DDL 与宏配置</text>
</svg>
