<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>类的生命周期五个阶段</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">类的生命周期：加载 → 链接 → 初始化 → 使用 → 卸载</text>

  <text x="30" y="76" font-size="11" fill="#5b6b7c">字节流可来自文件、网络、JAR、动态代理</text>
  <text x="870" y="76" text-anchor="end" font-size="11" fill="#5b6b7c">卸载：加载器被回收时类才可能被卸载</text>

  <rect x="30" y="100" width="140" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fd0">加载</text>
  <rect x="205" y="100" width="140" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="275" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fd0">链接</text>
  <rect x="380" y="100" width="140" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#e08a1e">初始化</text>
  <rect x="555" y="100" width="140" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="625" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#5b6b7c">使用</text>
  <rect x="730" y="100" width="140" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="800" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#5b6b7c">卸载</text>

  <line x1="170" y1="130" x2="203" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="345" y1="130" x2="378" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="520" y1="130" x2="553" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="695" y1="130" x2="728" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="275" y1="160" x2="275" y2="184" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="150" y="185" width="250" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="207" text-anchor="middle" font-size="11" fill="#5b6b7c">链接 = 验证 + 准备 + 解析</text>
  <rect x="160" y="216" width="70" height="27" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="195" y="234" text-anchor="middle" font-size="11.5" fill="#1f2b38">验证</text>
  <rect x="240" y="216" width="70" height="27" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="234" text-anchor="middle" font-size="11.5" fill="#1f2b38">准备</text>
  <rect x="320" y="216" width="70" height="27" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="355" y="234" text-anchor="middle" font-size="11.5" fill="#1f2b38">解析</text>
  <text x="412" y="224" font-size="11" fill="#5b6b7c">解析可延后到初始化之后（支持动态绑定）</text>

  <text x="450" y="280" text-anchor="middle" font-size="12" fill="#1f2b38">准备阶段只赋零值：static int a = 10 在准备后仍是 0，赋 10 与静态块都在初始化时由 clinit() 执行</text>
</svg>
