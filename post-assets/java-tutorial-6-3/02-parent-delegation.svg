<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>双亲委派模型</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/></marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">双亲委派：先向上委派，父加载器加载不到才自己 findClass</text>
  <text x="450" y="58" text-anchor="middle" font-size="11.5" fill="#5b6b7c">左侧蓝线 = 委派 parent.loadClass（有缓存直接返回）　　右侧橙线 = 回退，调用自己的 findClass</text>

  <rect x="250" y="80" width="400" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f6fd0">启动类加载器 Bootstrap</text>
  <text x="450" y="127" text-anchor="middle" font-size="11" fill="#5b6b7c">加载 JAVA_HOME/lib 核心类库；在 Java 代码里表现为 null</text>

  <rect x="250" y="178" width="400" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">平台类加载器 Platform（JDK 9+）</text>
  <text x="450" y="225" text-anchor="middle" font-size="11" fill="#5b6b7c">取代扩展类加载器，加载平台模块；ext 目录与 java.ext.dirs 不再生效</text>

  <rect x="250" y="276" width="400" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="301" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2e9e5b">应用程序类加载器 App</text>
  <text x="450" y="323" text-anchor="middle" font-size="11" fill="#5b6b7c">加载 classpath 上的类，通常是程序中的默认加载器</text>

  <line x1="330" y1="178" x2="330" y2="142" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="330" y1="276" x2="330" y2="240" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="142" x2="570" y2="176" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah2)"/>
  <line x1="570" y1="240" x2="570" y2="274" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah2)"/>

  <text x="450" y="372" text-anchor="middle" font-size="11.5" fill="#1f2b38">自定义加载器挂在 App 之下：覆盖 findClass 是遵守双亲委派，覆盖 loadClass 才是打破它</text>
</svg>
