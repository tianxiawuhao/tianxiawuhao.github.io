<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MySQL 引擎外部表：数据留在 MySQL，查询时回源读取</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">MySQL 引擎外部表：数据留在 MySQL，查询时回源读取</text>

  <rect x="30" y="70" width="270" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="100" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">MySQL 源库</text>
  <text x="165" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">真实数据只存这一份</text>
  <text x="165" y="148" font-size="11" fill="#5b6b7c" text-anchor="middle">增删改在这里做</text>
  <text x="165" y="182" font-size="11" fill="#2e9e5b" text-anchor="middle">MySQL 里怎么变，查询结果就怎么变</text>

  <rect x="600" y="70" width="270" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="735" y="100" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">ClickHouse 外表</text>
  <text x="735" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">ENGINE = MySQL(…)</text>
  <text x="735" y="148" font-size="11" fill="#5b6b7c" text-anchor="middle">本地不落数据、不占存储</text>
  <text x="735" y="182" font-size="11" fill="#e08a1e" text-anchor="middle">查询走 MySQL，性能受源库限制</text>

  <line x1="306" y1="120" x2="594" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="112" font-size="11" fill="#5b6b7c" text-anchor="middle">每次查询都读远端</text>
  <line x1="594" y1="175" x2="306" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="167" font-size="11" fill="#5b6b7c" text-anchor="middle">返回结果集</text>

  <rect x="30" y="250" width="840" height="65" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="50" y="275" font-size="12" font-weight="700" fill="#1f2b38">注意</text>
  <text x="50" y="298" font-size="11" fill="#1f2b38">外表适合偶发查询或小结果集；频繁全表扫描会把压力打回 MySQL，这种场景请先同步到本地表。</text>
</svg>
