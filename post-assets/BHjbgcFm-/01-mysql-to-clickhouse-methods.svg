<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MySQL 数据导入 ClickHouse 的三种方式</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">MySQL 数据导入 ClickHouse 的三种方式</text>

  <rect x="30" y="65" width="140" height="160" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="100" y="135" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">MySQL</text>
  <text x="100" y="158" font-size="11" fill="#5b6b7c" text-anchor="middle">数据源头</text>

  <rect x="730" y="65" width="140" height="160" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="800" y="135" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">ClickHouse</text>
  <text x="800" y="158" font-size="11" fill="#5b6b7c" text-anchor="middle">查询分析端</text>

  <rect x="220" y="60" width="460" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="80" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">1. ENGINE = MySQL 外部表</text>
  <text x="450" y="99" font-size="11" fill="#5b6b7c" text-anchor="middle">实时读取 · 不落地 · 每次查询都回源</text>

  <rect x="220" y="169" width="460" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="189" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">2. INSERT INTO … SELECT FROM mysql()</text>
  <text x="450" y="208" font-size="11" fill="#5b6b7c" text-anchor="middle">批量同步 · 数据落在 ClickHouse · 可改列与类型</text>

  <rect x="220" y="278" width="460" height="52" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="298" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">3. CREATE TABLE … AS SELECT FROM mysql()</text>
  <text x="450" y="317" font-size="11" fill="#5b6b7c" text-anchor="middle">先建表后灌数 · 列结构必须与源表一致</text>

  <line x1="172" y1="96" x2="216" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="684" y1="96" x2="728" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="680" y1="225" x2="610" y2="225" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="220" y1="304" x2="150" y2="304" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 600 221 L 600 199 L 450 199 L 450 187" fill="none" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 300 304 L 300 317 L 450 317 L 450 330" fill="none" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="360" width="840" height="115" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="386" font-size="13" font-weight="700" fill="#1f2b38">怎么选</text>
  <text x="50" y="411" font-size="11" fill="#1f2b38">只要实时看数据，不想在 ClickHouse 里存一份：用方式 1；数据量大、要反复分析，就把数据搬进来。</text>
  <text x="50" y="433" font-size="11" fill="#1f2b38">能接受列结构和源表一致，用方式 3，一句 SQL 建表带灌数；需要改列名、改类型或过滤，用方式 2。</text>
  <text x="50" y="455" font-size="11" fill="#5b6b7c">三种方式都用 mysql() 表函数或 MySQL 引擎连接远端，区别在于数据最终是否落在 ClickHouse 本地。</text>
</svg>
