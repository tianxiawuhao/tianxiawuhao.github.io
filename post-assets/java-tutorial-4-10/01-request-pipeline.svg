<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring MVC 请求管线与统一错误契约</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">请求管线：从 Filter 到统一错误契约</text>

  <rect x="45" y="76" width="140" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">请求进入</text>
  <text x="115" y="122" font-size="11" fill="#5b6b7c" text-anchor="middle">Filter 链</text>
  <text x="115" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">Servlet 层</text>

  <line x1="187" y1="116" x2="206" y2="116" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="210" y="76" width="140" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="280" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">DispatcherServlet</text>
  <text x="280" y="122" font-size="11" fill="#5b6b7c" text-anchor="middle">HandlerMapping</text>
  <text x="280" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">找到 Handler</text>

  <line x1="352" y1="116" x2="371" y2="116" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="375" y="76" width="140" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="445" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Interceptor</text>
  <text x="445" y="122" font-size="11" fill="#5b6b7c" text-anchor="middle">preHandle</text>
  <text x="445" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">false 即中断</text>

  <line x1="517" y1="116" x2="536" y2="116" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="540" y="76" width="140" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="610" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Controller</text>
  <text x="610" y="122" font-size="11" fill="#5b6b7c" text-anchor="middle">@Valid 校验</text>
  <text x="610" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">业务处理</text>

  <line x1="682" y1="116" x2="701" y2="116" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="705" y="76" width="140" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="775" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">响应返回</text>
  <text x="775" y="122" font-size="11" fill="#5b6b7c" text-anchor="middle">postHandle</text>
  <text x="775" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">afterCompletion</text>

  <line x1="610" y1="156" x2="610" y2="190" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="622" y="178" font-size="11" fill="#5b6b7c">校验失败 / 抛异常</text>
  <rect x="45" y="192" width="800" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="445" y="216" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">@RestControllerAdvice 统一处理</text>
  <text x="445" y="236" font-size="11" fill="#5b6b7c" text-anchor="middle">匹配最具体的 @ExceptionHandler，返回稳定的 code + message + fields</text>

  <rect x="45" y="282" width="253" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="172" y="306" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">参数校验前置</text>
  <text x="172" y="326" font-size="11" fill="#5b6b7c" text-anchor="middle">Bean Validation 绑定阶段</text>
  <rect x="323" y="282" width="253" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="306" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">登录鉴权</text>
  <text x="450" y="326" font-size="11" fill="#5b6b7c" text-anchor="middle">preHandle 挡在 Controller 前</text>
  <rect x="601" y="282" width="244" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="723" y="306" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">错误契约统一</text>
  <text x="723" y="326" font-size="11" fill="#5b6b7c" text-anchor="middle">异常处理集中到一处</text>

  <text x="450" y="375" font-size="12" fill="#5b6b7c" text-anchor="middle">共同思路：把与业务无关的关注点移出 Controller</text>
</svg>
