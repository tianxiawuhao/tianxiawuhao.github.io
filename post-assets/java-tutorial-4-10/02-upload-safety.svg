<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>文件上传：从原始文件名到安全落盘</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">文件上传：从原始文件名到安全落盘</text>

  <rect x="45" y="76" width="185" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="138" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">① 接收文件</text>
  <text x="138" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">MultipartFile</text>
  <text x="138" y="144" font-size="11" fill="#5b6b7c" text-anchor="middle">getOriginalFilename()</text>
  <text x="138" y="162" font-size="11" fill="#5b6b7c" text-anchor="middle">不可信，含路径片段</text>

  <line x1="232" y1="131" x2="249" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="253" y="76" width="185" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="346" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">② 归一化路径</text>
  <text x="346" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">StringUtils.cleanPath</text>
  <text x="346" y="144" font-size="11" fill="#5b6b7c" text-anchor="middle">拒绝含 .. 的名字</text>
  <text x="346" y="162" font-size="11" fill="#5b6b7c" text-anchor="middle">挡住路径穿越</text>

  <line x1="440" y1="131" x2="457" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="461" y="76" width="185" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="554" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">③ 白名单校验</text>
  <text x="554" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">只放行图片扩展名</text>
  <text x="554" y="144" font-size="11" fill="#5b6b7c" text-anchor="middle">getContentType 仅粗筛</text>
  <text x="554" y="162" font-size="11" fill="#5b6b7c" text-anchor="middle">不匹配直接 400</text>

  <line x1="648" y1="131" x2="665" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="669" y="76" width="185" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="762" y="102" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">④ 重命名落盘</text>
  <text x="762" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle">UUID + 扩展名</text>
  <text x="762" y="144" font-size="11" fill="#5b6b7c" text-anchor="middle">transferTo(target)</text>
  <text x="762" y="162" font-size="11" fill="#5b6b7c" text-anchor="middle">原名只用于展示</text>

  <line x1="554" y1="188" x2="400" y2="222" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="45" y="226" width="380" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="235" y="252" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">校验失败 → 400 只允许上传图片</text>
  <text x="235" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">含 .. 或扩展名不在白名单一律拒绝</text>

  <rect x="475" y="226" width="379" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="664" y="252" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">multipart.location 指向源码目录之外</text>
  <text x="664" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">max-file-size 限体积，超限需单独处理异常</text>

  <text x="450" y="345" font-size="12" fill="#5b6b7c" text-anchor="middle">落盘名与展示名分离：绝不能拿用户传来的文件名直接拼路径</text>
</svg>
