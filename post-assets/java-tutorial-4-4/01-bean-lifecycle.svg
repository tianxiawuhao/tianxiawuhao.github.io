<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring 单例 Bean 的生命周期</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Spring 单例 Bean 的生命周期：从 BeanDefinition 到销毁</text>

  <rect x="26" y="80" width="156" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="104" y="108" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">① 读取 BeanDefinition</text>
  <text x="104" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">配置类 / XML 元数据</text>
  <text x="104" y="148" font-size="11" fill="#5b6b7c" text-anchor="middle">Bean 定义就绪</text>

  <rect x="199" y="80" width="156" height="78" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="277" y="108" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">② 工厂后处理器</text>
  <text x="277" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">BeanFactory</text>
  <text x="277" y="148" font-size="11" fill="#5b6b7c" text-anchor="middle">PostProcessor 改元数据</text>

  <rect x="372" y="80" width="156" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="108" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">③ 实例化</text>
  <text x="450" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">构造器 / 静态工厂方法</text>
  <text x="450" y="148" font-size="11" fill="#5b6b7c" text-anchor="middle">此时依赖还都是 null</text>

  <rect x="545" y="80" width="156" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="623" y="108" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">④ 属性注入</text>
  <text x="623" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">@Autowired / @Resource</text>
  <text x="623" y="148" font-size="11" fill="#5b6b7c" text-anchor="middle">填充依赖与配置值</text>

  <rect x="718" y="80" width="156" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="796" y="108" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">⑤ Aware 回调</text>
  <text x="796" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">BeanName、BeanFactory</text>
  <text x="796" y="148" font-size="11" fill="#5b6b7c" text-anchor="middle">ApplicationContext</text>

  <line x1="182" y1="119" x2="195" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="119" x2="368" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="528" y1="119" x2="541" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="701" y1="119" x2="714" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <path d="M874 119 L888 119 L888 196 L104 196 L104 226" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="26" y="232" width="156" height="78" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="104" y="260" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">⑥ 初始化前回调</text>
  <text x="104" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">BeanPostProcessor</text>
  <text x="104" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">postProcessBefore…</text>

  <rect x="199" y="232" width="156" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="277" y="260" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">⑦ 初始化方法</text>
  <text x="277" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">@PostConstruct</text>
  <text x="277" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">afterPropertiesSet</text>

  <rect x="372" y="232" width="156" height="78" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="260" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">⑧ 初始化后回调</text>
  <text x="450" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">postProcessAfter…</text>
  <text x="450" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">AOP 代理多在此生成</text>

  <rect x="545" y="232" width="156" height="78" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="623" y="260" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">⑨ Bean 就绪</text>
  <text x="623" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">进入单例池，可被注入</text>
  <text x="623" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">singletonObjects</text>

  <rect x="718" y="232" width="156" height="78" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="796" y="260" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">⑩ 容器关闭销毁</text>
  <text x="796" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">@PreDestroy → destroy()</text>
  <text x="796" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">→ destroy-method</text>

  <line x1="182" y1="271" x2="195" y2="271" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="271" x2="368" y2="271" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="528" y1="271" x2="541" y2="271" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="701" y1="271" x2="714" y2="271" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="26" y="334" width="848" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="358" font-size="12" fill="#1f2b38">顺序固定：注解 → InitializingBean → init-method；销毁同理。prototype 的 Bean 容器只创建与装配，销毁回调不再触发。</text>
  <text x="44" y="380" font-size="12" fill="#1f2b38">BeanPostProcessor 是容器级扩展点，作用于几乎所有 Bean；Aware、InitializingBean 只作用于实现它们的那个 Bean。</text>
</svg>
