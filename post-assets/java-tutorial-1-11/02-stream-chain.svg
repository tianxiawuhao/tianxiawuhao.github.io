<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>缓冲流与转换流的层层包装</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">缓冲流与转换流：一条流一条流地套上去</text>
  <text x="40" y="66" font-size="12" font-weight="700" fill="#2e9e5b">读入方向（文件 → 内存）</text>
  <rect x="40" y="78" width="150" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">磁盘文件</text>
  <text x="115" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">src.txt</text>
  <path d="M 190 104 L 222 104" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="224" y="78" width="150" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="299" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">FileInputStream</text>
  <text x="299" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">按字节读</text>
  <path d="M 374 104 L 406 104" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="408" y="78" width="180" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="498" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">InputStreamReader</text>
  <text x="498" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">按指定编码表解码</text>
  <path d="M 588 104 L 620 104" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="622" y="78" width="150" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="697" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">BufferedReader</text>
  <text x="697" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">内存缓冲 + readLine()</text>
  <path d="M 772 104 L 804 104" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="806" y="78" width="64" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="838" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">内存</text>
  <text x="838" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">String</text>
  <text x="40" y="182" font-size="12" font-weight="700" fill="#2f6fd0">写出方向（内存 → 文件）</text>
  <rect x="622" y="194" width="150" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="697" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">BufferedWriter</text>
  <text x="697" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">缓冲 + newLine()</text>
  <path d="M 622 220 L 590 220" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="408" y="194" width="180" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="498" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">OutputStreamWriter</text>
  <text x="498" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">按指定编码表编码</text>
  <path d="M 408 220 L 376 220" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="224" y="194" width="150" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="299" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">FileOutputStream</text>
  <text x="299" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">按字节写</text>
  <path d="M 224 220 L 192 220" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="194" width="150" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">磁盘文件</text>
  <text x="115" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">dest.txt</text>
  <rect x="40" y="272" width="270" height="128" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="175" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">乱码的根源</text>
  <text x="175" y="314" text-anchor="middle" font-size="11" fill="#1f2b38">写文件用编码 A，读文件用编码 B</text>
  <text x="175" y="332" text-anchor="middle" font-size="11" fill="#1f2b38">FileReader / FileWriter 只能用</text>
  <text x="175" y="348" text-anchor="middle" font-size="11" fill="#1f2b38">平台默认编码，无法指定</text>
  <text x="175" y="366" text-anchor="middle" font-size="11" fill="#2e9e5b">要指定编码只能用转换流</text>
  <text x="175" y="386" text-anchor="middle" font-size="11" fill="#1f2b38">new InputStreamReader(in, "UTF-8")</text>
  <rect x="330" y="272" width="270" height="128" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="465" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">缓冲流带来的两个方法</text>
  <text x="465" y="314" text-anchor="middle" font-size="11" fill="#1f2b38">readLine() 一次读一行</text>
  <text x="465" y="332" text-anchor="middle" font-size="11" fill="#1f2b38">返回结果不含换行符，读完为 null</text>
  <text x="465" y="350" text-anchor="middle" font-size="11" fill="#1f2b38">newLine() 写出系统换行符</text>
  <text x="465" y="368" text-anchor="middle" font-size="11" fill="#1f2b38">可移植，优于手写换行符</text>
  <text x="465" y="386" text-anchor="middle" font-size="11" fill="#5b6b7c">缓冲流在内存维护数组，减少磁盘访问</text>
  <rect x="620" y="272" width="250" height="128" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="745" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">写出的四步与两个方法</text>
  <text x="745" y="314" text-anchor="middle" font-size="11" fill="#1f2b38">关联文件 → 写数据 → 刷新 → 关闭</text>
  <text x="745" y="332" text-anchor="middle" font-size="11" fill="#2e9e5b">flush() 刷到磁盘后可继续写</text>
  <text x="745" y="350" text-anchor="middle" font-size="11" fill="#e08a1e">close() 关闭后再写抛 IOException</text>
  <text x="745" y="368" text-anchor="middle" font-size="11" fill="#1f2b38">BufferedWriter 写 long 时</text>
  <text x="745" y="386" text-anchor="middle" font-size="11" fill="#1f2b38">注意 flush 时机，避免数据滞留</text>
  <rect x="40" y="410" width="830" height="26" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1"/>
  <text x="455" y="428" text-anchor="middle" font-size="11" fill="#1f2b38">字符流 = 字节流 + 编码表：转换流负责搭桥与编码，缓冲流负责效率，两者可叠加成一条处理链</text>
</svg>
