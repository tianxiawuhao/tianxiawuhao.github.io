<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>字节流与字符流的分工</title>
<rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">字节流与字符流：字符流 = 字节流 + 编码表</text>
<rect x="40" y="55" width="820" height="26" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="73" font-size="12" fill="#5b6b7c" text-anchor="middle">纯文本用字符流，图片 / 音频 / 视频等二进制数据必须用字节流</text>
<text x="230" y="100" font-size="12" font-weight="700" fill="#5b6b7c" text-anchor="middle">字节流：以 byte 为单位</text>
<rect x="90" y="108" width="280" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="230" y="131" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">InputStream / OutputStream</text>
<rect x="250" y="156" width="24" height="24" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<rect x="276" y="156" width="24" height="24" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<rect x="302" y="156" width="24" height="24" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="230" y="200" font-size="11" fill="#5b6b7c" text-anchor="middle">不知道哪几个字节该拼成一个字</text>
<text x="230" y="218" font-size="11" fill="#5b6b7c" text-anchor="middle">强行 (char) 转换只会得到乱码</text>
<text x="524" y="200" font-size="11" fill="#5b6b7c" text-anchor="middle">FileInputStream / FileOutputStream</text>
<text x="524" y="218" font-size="11" fill="#5b6b7c" text-anchor="middle">ObjectInputStream / ObjectOutputStream</text>
<line x1="386" y1="126" x2="456" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="470" y="108" width="170" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="555" y="126" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">按编码表组装</text>
<text x="555" y="140" font-size="11" fill="#e08a1e" text-anchor="middle">GBK 2 字节 / UTF-8 3 字节</text>
<line x1="640" y1="126" x2="690" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="700" y="108" width="160" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="780" y="131" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">Reader / Writer</text>
<text x="780" y="164" font-size="11" fill="#5b6b7c" text-anchor="middle">以 char 为单位读写文本</text>
<text x="780" y="182" font-size="11" fill="#5b6b7c" text-anchor="middle">FileReader / FileWriter 是便捷类</text>
<text x="450" y="248" font-size="11" fill="#5b6b7c" text-anchor="middle">编码与解码必须使用同一张编码表，否则乱码</text>
<line x1="450" y1="256" x2="450" y2="272" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="300" y="278" width="300" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="450" y="300" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">乱码 = 用一种编码表编码、用另一种解码</text>
<text x="450" y="332" font-size="11" fill="#5b6b7c" text-anchor="middle">FileReader / FileWriter 无法指定编码；需要指定编码表时必须用转换流</text>
<text x="450" y="350" font-size="11" fill="#5b6b7c" text-anchor="middle">new InputStreamReader(new FileInputStream("a.txt"), "UTF-8")</text>
</svg>
