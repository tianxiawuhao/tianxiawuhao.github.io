<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>IO 流的两条主线：字节流与字符流</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">IO 流谱系：按处理单位分两条主线</text>
  <rect x="60" y="52" width="360" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">字节流</text>
  <text x="240" y="91" text-anchor="middle" font-size="11" fill="#5b6b7c">处理二进制：图片、音频、视频</text>
  <rect x="480" y="52" width="360" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">字符流</text>
  <text x="660" y="91" text-anchor="middle" font-size="11" fill="#5b6b7c">处理纯文本：字符流 = 字节流 + 编码表</text>
  <path d="M 240 102 L 240 120 L 150 120 L 150 140" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 240 102 L 240 120 L 330 120 L 330 140" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 660 102 L 660 120 L 570 120 L 570 140" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 660 102 L 660 120 L 750 120 L 750 140" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="50" y="142" width="200" height="50" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="150" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">InputStream</text>
  <text x="150" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">输入：设备 → 内存</text>
  <rect x="260" y="142" width="200" height="50" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="360" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">OutputStream</text>
  <text x="360" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">输出：内存 → 设备</text>
  <rect x="470" y="142" width="200" height="50" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="570" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Reader</text>
  <text x="570" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">输入：按字符读</text>
  <rect x="680" y="142" width="200" height="50" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="780" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Writer</text>
  <text x="780" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">输出：按字符写</text>
  <path d="M 150 192 L 150 214" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 360 192 L 360 214" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 570 192 L 570 214" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 780 192 L 780 214" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="50" y="216" width="200" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="#1f2b38">FileInputStream</text>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#5b6b7c">BufferedInputStream</text>
  <text x="150" y="274" text-anchor="middle" font-size="11" fill="#5b6b7c">ObjectInputStream</text>
  <rect x="260" y="216" width="200" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#1f2b38">FileOutputStream</text>
  <text x="360" y="258" text-anchor="middle" font-size="11" fill="#5b6b7c">BufferedOutputStream</text>
  <text x="360" y="274" text-anchor="middle" font-size="11" fill="#5b6b7c">ObjectOutputStream</text>
  <rect x="470" y="216" width="200" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="570" y="240" text-anchor="middle" font-size="12" fill="#1f2b38">FileReader</text>
  <text x="570" y="258" text-anchor="middle" font-size="11" fill="#5b6b7c">BufferedReader</text>
  <text x="570" y="274" text-anchor="middle" font-size="11" fill="#5b6b7c">InputStreamReader</text>
  <rect x="680" y="216" width="200" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="780" y="240" text-anchor="middle" font-size="12" fill="#1f2b38">FileWriter</text>
  <text x="780" y="258" text-anchor="middle" font-size="11" fill="#5b6b7c">BufferedWriter</text>
  <text x="780" y="274" text-anchor="middle" font-size="11" fill="#5b6b7c">OutputStreamWriter</text>
  <rect x="30" y="302" width="260" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">字节流 · 输入流</text>
  <text x="160" y="346" text-anchor="middle" font-size="11" fill="#1f2b38">数据单位：byte</text>
  <text x="160" y="366" text-anchor="middle" font-size="11" fill="#1f2b38">对象：图片 / 音频 / 视频</text>
  <text x="160" y="386" text-anchor="middle" font-size="11" fill="#1f2b38">不认编码，直接搬字节</text>
  <text x="160" y="404" text-anchor="middle" font-size="11" fill="#5b6b7c">FileInputStream / FileOutputStream</text>
  <rect x="320" y="302" width="260" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">字符流 · 面向文本</text>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#1f2b38">数据单位：char</text>
  <text x="450" y="366" text-anchor="middle" font-size="11" fill="#1f2b38">对象：纯文本 / 配置文件</text>
  <text x="450" y="386" text-anchor="middle" font-size="11" fill="#1f2b38">读字节后按编码表组装成字符</text>
  <text x="450" y="404" text-anchor="middle" font-size="11" fill="#5b6b7c">FileReader / FileWriter</text>
  <rect x="610" y="302" width="260" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">为什么不能全用字节流</text>
  <text x="740" y="346" text-anchor="middle" font-size="11" fill="#1f2b38">汉字 GBK 占 2 字节，UTF-8 占 3 字节</text>
  <text x="740" y="366" text-anchor="middle" font-size="11" fill="#1f2b38">字节流不知道哪几个字节拼成一个字</text>
  <text x="740" y="386" text-anchor="middle" font-size="11" fill="#1f2b38">强行 (char) 转换只会得到乱码</text>
  <text x="740" y="404" text-anchor="middle" font-size="11" fill="#5b6b7c">纯文本用字符流，二进制用字节流</text>
  <rect x="30" y="426" width="840" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="448" text-anchor="middle" font-size="11" fill="#5b6b7c">按方向分输入流 / 输出流，按处理单位分字节流 / 字符流；上下两条主线可以组合使用</text>
</svg>
