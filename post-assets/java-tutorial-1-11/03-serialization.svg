<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>对象序列化与反序列化</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">序列化与反序列化：对象与字节序列之间</text>
  <rect x="30" y="60" width="240" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">内存中的 Java 对象</text>
  <rect x="50" y="96" width="200" height="102" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="150" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">FlyPig</text>
  <text x="150" y="136" text-anchor="middle" font-size="11" fill="#1f2b38">name / color</text>
  <text x="150" y="154" text-anchor="middle" font-size="11" fill="#e08a1e">static AGE 不参与</text>
  <text x="150" y="172" text-anchor="middle" font-size="11" fill="#e08a1e">transient car 不参与</text>
  <text x="150" y="190" text-anchor="middle" font-size="11" fill="#2e9e5b">implements Serializable</text>
  <path d="M 270 112 L 384 112" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="327" y="104" text-anchor="middle" font-size="11" fill="#2f6fd0">writeObject 序列化</text>
  <path d="M 384 160 L 270 160" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="327" y="178" text-anchor="middle" font-size="11" fill="#2e9e5b">readObject 反序列化</text>
  <rect x="386" y="60" width="200" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="486" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">字节序列</text>
  <text x="486" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">ObjectOutputStream</text>
  <text x="486" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">ObjectInputStream</text>
  <text x="486" y="174" text-anchor="middle" font-size="11" fill="#5b6b7c">二进制，人不可读</text>
  <path d="M 586 112 L 700 112" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="702" y="60" width="168" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="786" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">持久化目的地</text>
  <text x="786" y="114" text-anchor="middle" font-size="11" fill="#1f2b38">本地文件</text>
  <text x="786" y="136" text-anchor="middle" font-size="11" fill="#1f2b38">数据库</text>
  <text x="786" y="158" text-anchor="middle" font-size="11" fill="#1f2b38">网络传输 / RMI</text>
  <text x="786" y="182" text-anchor="middle" font-size="11" fill="#5b6b7c">用完记得关闭流</text>
  <rect x="30" y="228" width="840" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">Serializable 是标记接口</text>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#1f2b38">接口里没有任何方法和字段，只用来告诉 JVM「这个类允许被序列化」；未实现它的对象写入对象流会抛 NotSerializableException</text>
  <rect x="30" y="300" width="840" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">三个必须记住的细节</text>
  <text x="450" y="344" text-anchor="middle" font-size="11" fill="#1f2b38">static 字段属于类，不参与序列化，读回来是当前类的值</text>
  <text x="450" y="364" text-anchor="middle" font-size="11" fill="#1f2b38">transient 字段被跳过，读回来是 null 或默认值</text>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#1f2b38">serialVersionUID 不一致会抛 InvalidClassException，因此所有可序列化类都应显式声明 = 1L</text>
</svg>
