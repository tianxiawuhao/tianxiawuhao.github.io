<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" role="img" aria-label="Spring Boot 请求参数校验链路">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f6fd0"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e08a1e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="36" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring Boot 请求参数校验链路</text>
  <text x="450" y="60" font-size="12" fill="#5b6b7c" text-anchor="middle">入口校验失败即中断请求，由全局异常处理器统一转换成可读的错误响应</text>

  <rect x="40" y="104" width="180" height="88" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="130" y="140" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">① HTTP 请求</text>
  <text x="130" y="164" font-size="11" fill="#5b6b7c" text-anchor="middle">JSON 请求体 / 表单 / 单参数</text>

  <rect x="300" y="104" width="200" height="88" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="400" y="134" font-size="13.5" font-weight="700" fill="#1f2b38" text-anchor="middle">② Validator 校验</text>
  <text x="400" y="156" font-size="11" fill="#5b6b7c" text-anchor="middle">JSR-303 / Jakarta 约束注解</text>
  <text x="400" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">@Valid、@Validated 触发，支持分组</text>

  <rect x="580" y="104" width="200" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="680" y="134" font-size="13.5" font-weight="700" fill="#1f2b38" text-anchor="middle">③ Controller</text>
  <text x="680" y="156" font-size="11" fill="#5b6b7c" text-anchor="middle">校验通过，执行业务逻辑</text>
  <text x="680" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">返回正常业务数据</text>

  <line x1="222" y1="148" x2="294" y2="148" stroke="#2f6fd0" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="502" y1="148" x2="574" y2="148" stroke="#2f6fd0" stroke-width="2" marker-end="url(#arr-blue)"/>

  <path d="M 400 192 V 236 H 155 V 274" fill="none" stroke="#e08a1e" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="286" y="228" font-size="12" fill="#e08a1e" text-anchor="middle">校验失败，抛出异常</text>

  <rect x="40" y="278" width="230" height="98" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="155" y="308" font-size="13.5" font-weight="700" fill="#1f2b38" text-anchor="middle">④ 全局异常处理器</text>
  <text x="155" y="330" font-size="11" fill="#5b6b7c" text-anchor="middle">@RestControllerAdvice</text>
  <text x="155" y="348" font-size="11" fill="#5b6b7c" text-anchor="middle">MethodArgumentNotValidException</text>
  <text x="155" y="366" font-size="11" fill="#5b6b7c" text-anchor="middle">BindException / ConstraintViolationException</text>

  <line x1="270" y1="327" x2="574" y2="327" stroke="#e08a1e" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="424" y="317" font-size="12" fill="#e08a1e" text-anchor="middle">拼接错误信息后统一封装</text>

  <rect x="580" y="278" width="230" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="695" y="308" font-size="13.5" font-weight="700" fill="#1f2b38" text-anchor="middle">⑤ 统一错误响应</text>
  <text x="695" y="330" font-size="11" fill="#5b6b7c" text-anchor="middle">HTTP 400 + 可读的错误提示</text>
  <text x="695" y="350" font-size="11" fill="#5b6b7c" text-anchor="middle">ResultData.fail(400, message)</text>

  <rect x="40" y="396" width="820" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="450" y="416" font-size="11.5" fill="#5b6b7c" text-anchor="middle">图例：蓝色为主链路（校验通过）　橙色为校验失败后的异常处理链路　绿色为业务正常返回</text>
</svg>
