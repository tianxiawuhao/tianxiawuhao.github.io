<svg xmlns="http://www.w3.org/2000/svg" width="900" height="568" viewBox="0 0 900 568" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="568" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java 集合线程安全方案对比</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#5b6b7c">List / Set / Map 的常见替代实现与适用取舍</text>

  <rect x="25" y="78" width="850" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <rect x="37" y="88" width="162" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="118" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Vector / Hashtable</text>
  <text x="118" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">方法级 synchronized</text>
  <text x="216" y="106" font-size="12.5" fill="#1f2b38">所有方法都加同一把锁，单次操作安全。</text>
  <text x="216" y="128" font-size="12.5" fill="#5b6b7c">锁粒度最粗、并发吞吐最低，属于遗留类，新代码不推荐。</text>

  <rect x="25" y="158" width="850" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <rect x="37" y="168" width="162" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="118" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">synchronized 包装</text>
  <text x="118" y="208" text-anchor="middle" font-size="11" fill="#5b6b7c">Collections 工具类</text>
  <text x="216" y="186" font-size="12.5" fill="#1f2b38">对单次操作加同一把互斥锁，改造存量代码成本最低。</text>
  <text x="216" y="208" font-size="12.5" fill="#5b6b7c">遍历必须自己 synchronized (list)，复合操作也不安全。</text>

  <rect x="25" y="238" width="850" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <rect x="37" y="248" width="162" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="118" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">CopyOnWriteArrayList</text>
  <text x="118" y="288" text-anchor="middle" font-size="11" fill="#5b6b7c">写时复制 + 读写分离</text>
  <text x="216" y="266" font-size="12.5" fill="#1f2b38">读操作完全无锁，适合读多写少（监听器列表、白名单）。</text>
  <text x="216" y="288" font-size="12.5" fill="#5b6b7c">每次写都复制整个数组，迭代器弱一致、看不到最新元素。</text>

  <rect x="25" y="318" width="850" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <rect x="37" y="328" width="162" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="118" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">ConcurrentHashMap</text>
  <text x="118" y="368" text-anchor="middle" font-size="11" fill="#5b6b7c">CAS + 桶级同步</text>
  <text x="216" y="346" font-size="12.5" fill="#1f2b38">Map 首选：并发度高，读基本无锁，支持复合原子操作。</text>
  <text x="216" y="368" font-size="12.5" fill="#5b6b7c">不允许 null 键值；size 是瞬时估计值，迭代弱一致。</text>

  <rect x="25" y="398" width="850" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <rect x="37" y="408" width="162" height="50" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="118" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5bd0">ConcurrentSkipListMap</text>
  <text x="118" y="448" text-anchor="middle" font-size="11" fill="#5b6b7c">跳表实现的有序 Map</text>
  <text x="216" y="426" font-size="12.5" fill="#1f2b38">需要按 key 排序的并发场景，替代 TreeMap。</text>
  <text x="216" y="448" font-size="12.5" fill="#5b6b7c">支持范围查询与有序遍历，读无锁、写平均 O(log n)。</text>

  <rect x="25" y="482" width="850" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="45" y="506" font-size="13" font-weight="700" fill="#2f6fd0">注意：线程安全集合只保证单次操作原子性</text>
  <text x="45" y="530" font-size="12.5" fill="#1f2b38">check-then-act 等复合操作仍需加锁，或改用 putIfAbsent / computeIfAbsent 等原子方法；</text>
</svg>
