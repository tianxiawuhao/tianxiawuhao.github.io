<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>DefaultProcessorSlotChain 的构建过程与九个插槽的 order 顺序</title>
  <rect width="900" height="700" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">DefaultProcessorSlotChain 的构建与九个插槽顺序（1.8.x）</text>

  <rect x="30" y="55" width="500" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="50" y="80" font-size="12.5" font-weight="700" fill="#1f2b38">SphU.entry(resourceName, 1, EntryType.IN)</text>
  <text x="50" y="100" font-size="11.5" fill="#5b6b7c">① CtSph.entryWithPriority()：拿到 Context 后调用 lookProcessChain()</text>
  <text x="50" y="117" font-size="11.5" fill="#5b6b7c">② lookProcessChain()：以 ResourceWrapper（按 name 比较）为 key 缓存 chainMap</text>

  <line x1="280" y1="125" x2="280" y2="148" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="168" width="500" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="50" y="208" font-size="12.5" font-weight="700" fill="#1f2b38">③ SlotChainProvider.newSlotChain()</text>
  <text x="50" y="172" font-size="11.5" fill="#5b6b7c">SPI 取 SlotChainBuilder，默认实现 DefaultSlotChainBuilder</text>

  <line x1="280" y1="220" x2="280" y2="243" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="245" width="500" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="50" y="285" font-size="12.5" font-weight="700" fill="#1f2b38">④ loadPrototypeInstanceListSorted(ProcessorSlot.class)</text>
  <text x="50" y="286" font-size="11.5" fill="#5b6b7c">按 META-INF/services/ 逐行读取实现类，解析 order 后插入排序</text>
  <text x="50" y="301" font-size="11.5" fill="#5b6b7c">每个插槽都是独立实例（prototype），再 addLast 串成链表</text>

  <line x1="280" y1="307" x2="280" y2="330" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="332" width="500" height="44" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="50" y="359" font-size="12" fill="#1f2b38">chain.addLast(slot) → next 指针串成单向链表</text>

  <rect x="30" y="398" width="500" height="100" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="424" font-size="11.5" fill="#5b6b7c">写入 chainMap：双重检测锁 + CopyOnWrite 保证并发安全</text>
  <text x="50" y="444" font-size="11.5" fill="#5b6b7c">chainMap 以 resourceName 为维度缓存，应用级有效</text>
  <text x="50" y="464" font-size="11.5" fill="#5b6b7c">同一资源的所有请求复用同一条责任链，逐个 Entry 串起来</text>
  <text x="50" y="484" font-size="11.5" fill="#5b6b7c">若 chainMap 超过 MAX_SLOT_CHAIN_SIZE 则不再创建新链</text>

  <rect x="560" y="55" width="310" height="611" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="715" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">9 个 ProcessorSlot（按 order 升序）</text>
  <rect x="580" y="95" width="270" height="27" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="592" y="113" font-size="11.5" fill="#2f6fd0">1. NodeSelectorSlot</text>
  <text x="840" y="113" text-anchor="end" font-size="11" fill="#5b6b7c">构建 DefaultNode</text>
  <rect x="580" y="129" width="270" height="27" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="592" y="147" font-size="11.5" fill="#2f6fd0">2. ClusterBuilderSlot</text>
  <text x="840" y="147" text-anchor="end" font-size="11" fill="#5b6b7c">构建 ClusterNode</text>
  <rect x="580" y="163" width="270" height="27" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="592" y="181" font-size="11.5" fill="#2f6fd0">3. LogSlot</text>
  <text x="840" y="181" text-anchor="end" font-size="11" fill="#5b6b7c">记录拦截日志</text>
  <rect x="580" y="197" width="270" height="27" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="592" y="215" font-size="11.5" fill="#2f6fd0">4. StatisticSlot</text>
  <text x="840" y="215" text-anchor="end" font-size="11" fill="#5b6b7c">实时统计</text>
  <rect x="580" y="231" width="270" height="27" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="592" y="249" font-size="11.5" fill="#e08a1e">5. AuthoritySlot</text>
  <text x="840" y="249" text-anchor="end" font-size="11" fill="#5b6b7c">授权规则</text>
  <rect x="580" y="265" width="270" height="27" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="592" y="283" font-size="11.5" fill="#e08a1e">6. SystemSlot</text>
  <text x="840" y="283" text-anchor="end" font-size="11" fill="#5b6b7c">系统保护规则</text>
  <rect x="580" y="299" width="270" height="27" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="592" y="317" font-size="11.5" fill="#e08a1e">7. FlowSlot</text>
  <text x="840" y="317" text-anchor="end" font-size="11" fill="#5b6b7c">普通限流规则</text>
  <rect x="580" y="333" width="270" height="27" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="592" y="351" font-size="11.5" fill="#e08a1e">8. DegradeSlot</text>
  <text x="840" y="351" text-anchor="end" font-size="11" fill="#5b6b7c">熔断降级规则</text>
  <rect x="580" y="367" width="270" height="27" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="592" y="385" font-size="11.5" fill="#2e9e5b">9. ParamFlowSlot</text>
  <text x="840" y="385" text-anchor="end" font-size="11" fill="#5b6b7c">热点参数限流</text>
  <line x1="715" y1="398" x2="715" y2="412" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="715" y="450" text-anchor="middle" font-size="11.5" fill="#5b6b7c">以上 9 个是 sentinel-core 内置的默认插槽；</text>
  <text x="715" y="470" text-anchor="middle" font-size="11.5" fill="#5b6b7c">引入集群流控等模块后还会追加插槽，</text>
  <text x="715" y="490" text-anchor="middle" font-size="11.5" fill="#5b6b7c">位置同样由各自的 order 决定。</text>
  <text x="715" y="528" text-anchor="middle" font-size="11.5" fill="#1f2b38">责任链的入口永远是 order 最小的</text>
  <text x="715" y="546" text-anchor="middle" font-size="11.5" fill="#1f2b38">NodeSelectorSlot，请求沿 next 单向传递。</text>
  <text x="715" y="586" text-anchor="middle" font-size="11" fill="#5b6b7c">自定义插槽时，只要实现 ProcessorSlot</text>
  <text x="715" y="604" text-anchor="middle" font-size="11" fill="#5b6b7c">并通过 SPI 注册，指定 order 即可插入链中。</text>
  <text x="715" y="640" text-anchor="middle" font-size="11" fill="#2e9e5b">DefaultSlotChainBuilder 中若插槽未继承</text>
  <text x="715" y="656" text-anchor="middle" font-size="11" fill="#2e9e5b">AbstractLinkedProcessorSlot 会被跳过。</text>
</svg>
