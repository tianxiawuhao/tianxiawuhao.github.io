<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>镜像的只读层与容器的可写层</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" text-anchor="middle" font-size="17" fill="#1f2b38" font-weight="700">镜像 = 只读层叠加；容器 = 镜像 + 一层可写层</text>
<rect x="60" y="88" width="360" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="240" y="116" text-anchor="middle" font-size="13.5" fill="#1f2b38" font-weight="700">镜像：一堆只读层（overlay2 挂载）</text>
<rect x="80" y="132" width="320" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="240" y="155" text-anchor="middle" font-size="12.5" fill="#1f2b38">应用层：COPY app.jar</text>
<rect x="80" y="176" width="320" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="240" y="199" text-anchor="middle" font-size="12.5" fill="#1f2b38">依赖与配置层：RUN / ENV</text>
<rect x="80" y="220" width="320" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="240" y="243" text-anchor="middle" font-size="12.5" fill="#1f2b38">基础镜像层：eclipse-temurin:17-jre</text>
<rect x="480" y="88" width="360" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="660" y="116" text-anchor="middle" font-size="13.5" fill="#1f2b38" font-weight="700">容器：镜像 + 一层可写层</text>
<rect x="500" y="132" width="320" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="660" y="155" text-anchor="middle" font-size="12.5" fill="#1f2b38">可写层：容器运行期的所有写入</text>
<rect x="500" y="176" width="320" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="660" y="222" text-anchor="middle" font-size="12.5" fill="#1f2b38">镜像的只读层（与左图完全相同）</text>
<line x1="428" y1="196" x2="472" y2="196" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="450" y="186" text-anchor="middle" font-size="11" fill="#5b6b7c">docker run</text>
<rect x="60" y="292" width="780" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="320" text-anchor="start" font-size="12.5" fill="#e08a1e">docker rm 删容器连可写层，数据不可恢复（仅非运行态可删）；docker rmi 只删镜像只读层</text>
<text x="80" y="350" text-anchor="start" font-size="12.5" fill="#2e9e5b">docker commit 把可写层固化为只读层（调试可用）；正式交付应用 Dockerfile 重建</text>
</svg>
