<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>UML 类图六种关系与 Java 代码的对应</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">UML 类图六种关系：符号、含义与 Java 写法</text>
  <rect x="40" y="46" width="820" height="1.6" fill="#c8d3e0"/>

  <text x="52" y="70" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">符号</text>
  <text x="150" y="70" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">关系</text>
  <text x="290" y="70" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">代码里的落地方式</text>
  <text x="700" y="70" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">耦合强度</text>
  <rect x="40" y="78" width="820" height="1.6" fill="#c8d3e0"/>

  <line x1="58" y1="106" x2="104" y2="106" stroke="#2f6fd0" stroke-width="1.6"/>
  <polygon points="104,106 92,100 92,112" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="104" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">继承 / 泛化</text>
  <text x="150" y="122" font-size="11" fill="#5b6b7c" text-anchor="start">Generalization</text>
  <text x="290" y="111" font-size="12.5" fill="#1f2b38" text-anchor="start">子类 extends 父类，箭头指向父类</text>
  <text x="700" y="111" font-size="12" fill="#2e9e5b" text-anchor="start">强 · is-a</text>
  <rect x="40" y="132" width="820" height="1" fill="#eef4ff"/>

  <line x1="58" y1="160" x2="104" y2="160" stroke="#7a5bd0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="104,160 92,154 92,166" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="150" y="158" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">实现</text>
  <text x="150" y="176" font-size="11" fill="#5b6b7c" text-anchor="start">Realization</text>
  <text x="290" y="165" font-size="12.5" fill="#1f2b38" text-anchor="start">类 implements 接口，箭头指向接口</text>
  <text x="700" y="165" font-size="12" fill="#2e9e5b" text-anchor="start">强 · can-do</text>
  <rect x="40" y="186" width="820" height="1" fill="#eef4ff"/>

  <line x1="58" y1="214" x2="76" y2="214" stroke="#2f6fd0" stroke-width="1.6"/>
  <polygon points="76,214 88,209 88,219" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <line x1="88" y1="214" x2="104" y2="214" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="150" y="212" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">关联 / 聚合</text>
  <text x="150" y="230" font-size="11" fill="#5b6b7c" text-anchor="start">Association / Aggregation</text>
  <text x="290" y="219" font-size="12.5" fill="#1f2b38" text-anchor="start">字段持有对方引用（成员变量）；聚合用空心菱形</text>
  <text x="700" y="219" font-size="12" fill="#e08a1e" text-anchor="start">中 · has-a</text>
  <rect x="40" y="240" width="820" height="1" fill="#eef4ff"/>

  <line x1="58" y1="268" x2="104" y2="268" stroke="#2f6fd0" stroke-width="1.6"/>
  <polygon points="58,268 70,262 70,274" fill="#2f6fd0"/>
  <circle cx="64" cy="268" r="4.5" fill="#1f2b38"/>
  <text x="150" y="266" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">组合</text>
  <text x="150" y="284" font-size="11" fill="#5b6b7c" text-anchor="start">Composition</text>
  <text x="290" y="273" font-size="12.5" fill="#1f2b38" text-anchor="start">整体创建并销毁部分，生命周期同步</text>
  <text x="700" y="273" font-size="12" fill="#e08a1e" text-anchor="start">中强 · owns-a</text>
  <rect x="40" y="294" width="820" height="1" fill="#eef4ff"/>

  <line x1="58" y1="322" x2="104" y2="322" stroke="#5b6b7c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="104,322 92,316 92,328" fill="#5b6b7c"/>
  <text x="150" y="320" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">依赖</text>
  <text x="150" y="338" font-size="11" fill="#5b6b7c" text-anchor="start">Dependency</text>
  <text x="290" y="327" font-size="12.5" fill="#1f2b38" text-anchor="start">方法参数、局部变量、静态方法调用</text>
  <text x="700" y="327" font-size="12" fill="#2f6fd0" text-anchor="start">弱 · use-a</text>
  <rect x="40" y="348" width="820" height="1" fill="#c8d3e0"/>

  <text x="40" y="374" font-size="11.5" fill="#5b6b7c" text-anchor="start">读图口诀：空心三角看继承实现（实线 extends、虚线 implements），</text>
  <text x="40" y="395" font-size="11.5" fill="#5b6b7c" text-anchor="start">菱形看整体与部分（空心聚合、实心组合），箭尾带数字看多重度，虚线箭头是方法级别的临时依赖。</text>
  <text x="40" y="420" font-size="11.5" fill="#2f6fd0" text-anchor="start" font-weight="700">面试常问：依赖、关联、聚合、组合的耦合强度依次增强，区分的核心是「谁拥有谁、生命周期是否同步」。</text>
</svg>
