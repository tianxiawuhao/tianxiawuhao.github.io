<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三类设计模式的落点：遇到什么变化，先看哪一类</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">设计模式选型第一步：先判断变化发生在哪一侧</text>

  <rect x="330" y="50" width="240" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="450" y="78" font-size="13.5" fill="#1f2b38" text-anchor="middle" font-weight="700">这段代码的变化点在哪？</text>

  <line x1="450" y1="94" x2="170" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="94" x2="450" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="94" x2="730" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="130" width="220" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="170" y="155" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">对象的产生方式会变</text>
  <rect x="340" y="130" width="220" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="155" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">对象之间怎么拼装会变</text>
  <rect x="620" y="130" width="220" height="40" rx="8" fill="#eef4ff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="730" y="155" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">对象之间怎么交互会变</text>

  <rect x="40" y="186" width="260" height="186" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="210" font-size="13" fill="#2e9e5b" text-anchor="start" font-weight="700">创建型（5）</text>
  <text x="60" y="234" font-size="11.5" fill="#1f2b38" text-anchor="start">单例 — 全局唯一实例</text>
  <text x="60" y="256" font-size="11.5" fill="#1f2b38" text-anchor="start">工厂方法 — 每种产品一个工厂</text>
  <text x="60" y="278" font-size="11.5" fill="#1f2b38" text-anchor="start">抽象工厂 — 整族产品一起换</text>
  <text x="60" y="300" font-size="11.5" fill="#1f2b38" text-anchor="start">建造者 — 分步装配复杂对象</text>
  <text x="60" y="322" font-size="11.5" fill="#1f2b38" text-anchor="start">原型 — 用拷贝代替重建</text>
  <text x="60" y="350" font-size="11" fill="#5b6b7c" text-anchor="start">关键词：new、构造、唯一、拷贝</text>

  <rect x="320" y="186" width="260" height="186" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="340" y="210" font-size="13" fill="#e08a1e" text-anchor="start" font-weight="700">结构型（7）</text>
  <text x="340" y="234" font-size="11.5" fill="#1f2b38" text-anchor="start">适配器 — 接口对不上</text>
  <text x="340" y="256" font-size="11.5" fill="#1f2b38" text-anchor="start">桥接 — 两个维度独立变化</text>
  <text x="340" y="278" font-size="11.5" fill="#1f2b38" text-anchor="start">组合 — 整体与部分一视同仁</text>
  <text x="340" y="300" font-size="11.5" fill="#1f2b38" text-anchor="start">装饰器 / 代理 / 外观 / 享元</text>
  <text x="340" y="322" font-size="11.5" fill="#1f2b38" text-anchor="start">过滤器 — 多条件筛选可组合</text>
  <text x="340" y="350" font-size="11" fill="#5b6b7c" text-anchor="start">关键词：接口、继承层次、访问控制</text>

  <rect x="600" y="186" width="260" height="186" rx="8" fill="#eef4ff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="620" y="210" font-size="13" fill="#7a5bd0" text-anchor="start" font-weight="700">行为型（11）</text>
  <text x="620" y="234" font-size="11.5" fill="#1f2b38" text-anchor="start">策略 / 模板方法 / 观察者</text>
  <text x="620" y="256" font-size="11.5" fill="#1f2b38" text-anchor="start">责任链 / 命令 / 状态 / 迭代器</text>
  <text x="620" y="278" font-size="11.5" fill="#1f2b38" text-anchor="start">备忘录 — 可回滚的存档</text>
  <text x="620" y="300" font-size="11.5" fill="#1f2b38" text-anchor="start">中介者 — 网状变星型</text>
  <text x="620" y="322" font-size="11.5" fill="#1f2b38" text-anchor="start">访问者 / 解释器 / 空对象</text>
  <text x="620" y="350" font-size="11" fill="#5b6b7c" text-anchor="start">关键词：if-else、通知、顺序、算法</text>

  <rect x="40" y="392" width="820" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="416" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">先守住原则，再挑模式（本教程 5-4 / 5-5 / 5-6 分别展开）</text>
  <text x="60" y="440" font-size="11.5" fill="#5b6b7c" text-anchor="start">变化点只有一个 → 先用多态或策略，别急着堆模式类；变化点有两个以上维度 → 桥接、抽象工厂才划算。</text>
  <text x="60" y="462" font-size="11.5" fill="#5b6b7c" text-anchor="start">永远不变的部分不要抽象：拒绝不成熟的抽象，和抽象本身一样重要。</text>
</svg>
