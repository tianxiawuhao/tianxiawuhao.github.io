<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>六大设计原则：从代码坏味道倒推该守哪条原则</title>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">六大设计原则：从代码坏味道倒推该守哪条原则</text>
  <text x="40" y="54" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="700">代码里的坏味道</text>
  <text x="392" y="54" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="700">对应的原则</text>
  <text x="620" y="54" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="700">判断信号</text>

  <rect x="40" y="66" width="320" height="62" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="92" font-size="12.5" fill="#1f2b38" text-anchor="start">一个类又管订单、又发短信、又写日志</text>
  <text x="60" y="113" font-size="11.5" fill="#5b6b7c" text-anchor="start">换个需求就要动它一次</text>
  <line x1="368" y1="97" x2="384" y2="97" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="392" y="66" width="200" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="492" y="92" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">单一职责 SRP</text>
  <text x="492" y="113" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">一个类只有一个变化原因</text>
  <rect x="620" y="66" width="240" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="92" font-size="11.5" fill="#1f2b38" text-anchor="middle">改动前先问：这些职责</text>
  <text x="740" y="113" font-size="11.5" fill="#1f2b38" text-anchor="middle">会因同一原因变化吗</text>

  <rect x="40" y="144" width="320" height="62" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="170" font-size="12.5" fill="#1f2b38" text-anchor="start">加一种支付方式就要回头改老代码</text>
  <text x="60" y="191" font-size="11.5" fill="#5b6b7c" text-anchor="start">需求一变就得动已经稳定的类</text>
  <line x1="368" y1="175" x2="384" y2="175" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="392" y="144" width="200" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="492" y="170" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">开闭原则 OCP</text>
  <text x="492" y="191" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">对扩展开放，对修改关闭</text>
  <rect x="620" y="144" width="240" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="170" font-size="11.5" fill="#1f2b38" text-anchor="middle">新增功能能否只靠</text>
  <text x="740" y="191" font-size="11.5" fill="#1f2b38" text-anchor="middle">加类而不是改 if-else</text>

  <rect x="40" y="222" width="320" height="62" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="248" font-size="12.5" fill="#1f2b38" text-anchor="start">子类偷偷改掉父类的语义</text>
  <text x="60" y="269" font-size="11.5" fill="#5b6b7c" text-anchor="start">调用方拿到子类结果就不对了</text>
  <line x1="368" y1="253" x2="384" y2="253" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="392" y="222" width="200" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="492" y="248" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">里氏代换 LSP</text>
  <text x="492" y="269" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">子类型必须能替换父类型</text>
  <rect x="620" y="222" width="240" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="248" font-size="11.5" fill="#1f2b38" text-anchor="middle">把父类换成子类后</text>
  <text x="740" y="269" font-size="11.5" fill="#1f2b38" text-anchor="middle">调用方行为会被改变吗</text>

  <rect x="40" y="300" width="320" height="62" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="326" font-size="12.5" fill="#1f2b38" text-anchor="start">业务类直接 new 具体实现、连数据库</text>
  <text x="60" y="347" font-size="11.5" fill="#5b6b7c" text-anchor="start">换实现要改高层代码，没法单测</text>
  <line x1="368" y1="331" x2="384" y2="331" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="392" y="300" width="200" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="492" y="326" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">依赖倒转 DIP</text>
  <text x="492" y="347" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">依赖抽象，不依赖具体</text>
  <rect x="620" y="300" width="240" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="326" font-size="11.5" fill="#1f2b38" text-anchor="middle">高层模块的字段类型</text>
  <text x="740" y="347" font-size="11.5" fill="#1f2b38" text-anchor="middle">是接口还是具体类</text>

  <rect x="40" y="378" width="320" height="62" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="404" font-size="12.5" fill="#1f2b38" text-anchor="start">实现一个接口却要写一堆空方法</text>
  <text x="60" y="425" font-size="11.5" fill="#5b6b7c" text-anchor="start">胖接口把无关的方法绑在一起</text>
  <line x1="368" y1="409" x2="384" y2="409" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="392" y="378" width="200" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="492" y="404" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">接口隔离 ISP</text>
  <text x="492" y="425" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">不强迫客户依赖不用的方法</text>
  <rect x="620" y="378" width="240" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="404" font-size="11.5" fill="#1f2b38" text-anchor="middle">接口里的方法</text>
  <text x="740" y="425" font-size="11.5" fill="#1f2b38" text-anchor="middle">是否每个实现者都要用</text>

  <rect x="40" y="456" width="320" height="62" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="482" font-size="12.5" fill="#1f2b38" text-anchor="start">一长串 a.getB().getC().doD() 调用</text>
  <text x="60" y="503" font-size="11.5" fill="#5b6b7c" text-anchor="start">改一个中间类就牵动整条链</text>
  <line x1="368" y1="487" x2="384" y2="487" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="392" y="456" width="200" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="492" y="482" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">迪米特法则 LoD</text>
  <text x="492" y="503" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">只和直接朋友通信</text>
  <rect x="620" y="456" width="240" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="482" font-size="11.5" fill="#1f2b38" text-anchor="middle">这条链是否可以</text>
  <text x="740" y="503" font-size="11.5" fill="#1f2b38" text-anchor="middle">收敛成一个方法调用</text>

  <text x="40" y="546" font-size="11.5" fill="#5b6b7c" text-anchor="start">还有一条合成复用原则（CRP）：优先用组合/聚合复用，少用继承——它和上面六条一起构成设计模式的判断依据。</text>
</svg>
