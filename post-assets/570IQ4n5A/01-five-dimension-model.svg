<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>数字孪生五维模型：物理实体、虚拟实体、服务、孪生数据与连接</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5bd0"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">数字孪生五维模型 M_DT = (PE, VE, Ss, DD, CN)</text>

  <!-- 物理实体 -->
  <rect x="60" y="55" width="240" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="180" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">物理实体 PE</text>
  <text x="180" y="114" text-anchor="middle" font-size="11.5" fill="#5b6b7c">物理空间中的设备、产线</text>
  <text x="180" y="134" text-anchor="middle" font-size="11.5" fill="#5b6b7c">与系统，靠传感器采集</text>
  <text x="180" y="154" text-anchor="middle" font-size="11.5" fill="#5b6b7c">运行状态与环境数据</text>

  <!-- 实时交互双向箭头 -->
  <line x1="312" y1="262" x2="588" y2="262" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="450" y="251" text-anchor="middle" font-size="11" fill="#5b6b7c">实时交互</text>

  <!-- 虚拟实体 -->
  <rect x="600" y="55" width="240" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">虚拟实体 VE</text>
  <text x="720" y="114" text-anchor="middle" font-size="11.5" fill="#5b6b7c">几何模型 · 物理模型</text>
  <text x="720" y="134" text-anchor="middle" font-size="11.5" fill="#5b6b7c">行为模型 · 规则模型</text>
  <text x="720" y="154" text-anchor="middle" font-size="11.5" fill="#5b6b7c">多时空尺度刻画物理实体</text>

  <!-- 服务 -->
  <rect x="60" y="200" width="240" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="180" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">服务 Ss</text>
  <text x="180" y="254" text-anchor="middle" font-size="11.5" fill="#5b6b7c">功能服务 · 业务服务 · 知识服务</text>
  <text x="180" y="272" text-anchor="middle" font-size="11.5" fill="#5b6b7c">按需封装给不同层次用户</text>

  <!-- 孪生数据 -->
  <rect x="600" y="200" width="240" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="720" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">孪生数据 DD</text>
  <text x="720" y="254" text-anchor="middle" font-size="11.5" fill="#5b6b7c">物理数据 · 信息数据融合</text>
  <text x="720" y="272" text-anchor="middle" font-size="11.5" fill="#5b6b7c">全要素 / 全流程 / 全业务</text>

  <!-- 连接 -->
  <rect x="180" y="310" width="540" height="86" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">连接 CN</text>
  <text x="450" y="364" text-anchor="middle" font-size="11.5" fill="#5b6b7c">连接 PE、VE、Ss、DD 四个维度，保障各部分之间</text>
  <text x="450" y="384" text-anchor="middle" font-size="11.5" fill="#5b6b7c">实时交互、一致与同步，是五维模型运转的枢纽</text>

  <!-- 连接线：PE -> DD -->
  <line x1="300" y1="178" x2="300" y2="196" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#aho)"/>
  <line x1="600" y1="196" x2="600" y2="178" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#aho)"/>
  <text x="318" y="190" font-size="11" fill="#5b6b7c">采集</text>
  <text x="582" y="190" text-anchor="end" font-size="11" fill="#5b6b7c">驱动</text>

  <!-- 连接线：VE/DD -> Ss -->
  <line x1="588" y1="220" x2="312" y2="220" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahr)"/>
  <text x="450" y="239" text-anchor="middle" font-size="11" fill="#5b6b7c">模型与数据支撑服务</text>

  <!-- 连接线：Ss -> CN -->
  <line x1="180" y1="282" x2="180" y2="306" stroke="#7a5bd0" stroke-width="1.4" marker-end="url(#ahp)"/>
  <text x="192" y="298" font-size="11" fill="#5b6b7c">反馈</text>
</svg>
