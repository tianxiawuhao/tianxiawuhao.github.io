<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>数字孪生成熟度六个等级：从以虚仿实到虚实共生</title>
  <rect width="900" height="590" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">数字孪生成熟度六个等级（L0 → L5）</text>

  <rect x="85" y="145" width="560" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="105" y="178" font-size="13" font-weight="700" fill="#1f2b38">L0 以虚仿实</text>
  <text x="625" y="178" text-anchor="end" font-size="11.5" fill="#5b6b7c">模型刻画实体，可仿真分析，虚实无实时数据交换</text>

  <rect x="135" y="215" width="560" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="155" y="248" font-size="13" font-weight="700" fill="#1f2b38">L1 以虚映实</text>
  <text x="675" y="248" text-anchor="end" font-size="11.5" fill="#5b6b7c">数据实时驱动模型，同步复现实体状态，只监不控</text>

  <rect x="185" y="285" width="560" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="205" y="318" font-size="13" font-weight="700" fill="#1f2b38">L2 以虚控实</text>
  <text x="725" y="318" text-anchor="end" font-size="11.5" fill="#5b6b7c">增设模型到实体的下行通道，虚实双向闭环，可远程操控</text>

  <rect x="235" y="355" width="560" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="255" y="388" font-size="13" font-weight="700" fill="#1f2b38">L3 以虚预实</text>
  <text x="775" y="388" text-anchor="end" font-size="11.5" fill="#5b6b7c">在线预演未来运行过程与结果，把未知转化为预知</text>

  <rect x="285" y="425" width="560" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="305" y="458" font-size="13" font-weight="700" fill="#1f2b38">L4 以虚优实</text>
  <text x="825" y="458" text-anchor="end" font-size="11.5" fill="#5b6b7c">用策略、算法与知识做智能决策优化，并智能管控实体</text>

  <rect x="235" y="495" width="610" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="255" y="528" font-size="13" font-weight="700" fill="#1f2b38">L5 虚实共生</text>
  <text x="825" y="528" text-anchor="end" font-size="11.5" fill="#5b6b7c">双向感知差异，自主构建 / 动态重构，全生命周期动态一致</text>

  <line x1="40" y1="495" x2="40" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="30" y="340" font-size="12" fill="#5b6b7c" transform="rotate(-90 30 340)" text-anchor="middle">成熟度升高</text>

  <rect x="105" y="60" width="740" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="125" y="84" font-size="12" font-weight="700" fill="#1f2b38">评估的五个细分维度</text>
  <text x="125" y="106" font-size="11.5" fill="#5b6b7c">物理实体 PE · 数字孪生模型 DM · 数字孪生数据 DD · 连接交互 CI · 功能服务 FS</text>
</svg>
