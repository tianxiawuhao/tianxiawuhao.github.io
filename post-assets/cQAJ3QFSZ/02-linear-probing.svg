<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ThreadLocalMap 线性探测解决 Hash 冲突</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ThreadLocalMap 线性探测解决 Hash 冲突</text>

  <text x="130" y="105" text-anchor="middle" font-size="11" fill="#5b6b7c">i=0</text>
  <text x="258" y="105" text-anchor="middle" font-size="11" fill="#5b6b7c">i=1</text>
  <text x="386" y="105" text-anchor="middle" font-size="11" fill="#5b6b7c">i=2</text>
  <text x="514" y="105" text-anchor="middle" font-size="11" fill="#5b6b7c">i=3</text>
  <text x="642" y="105" text-anchor="middle" font-size="11" fill="#5b6b7c">i=4</text>
  <text x="770" y="105" text-anchor="middle" font-size="11" fill="#5b6b7c">i=5</text>

  <rect x="70" y="120" width="120" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="130" y="163" text-anchor="middle" font-size="12" fill="#5b6b7c">空</text>

  <rect x="198" y="120" width="120" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="258" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">key B</text>
  <text x="258" y="174" text-anchor="middle" font-size="11" fill="#5b6b7c">hash 命中，占用</text>

  <rect x="326" y="120" width="120" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="386" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">key D</text>
  <text x="386" y="174" text-anchor="middle" font-size="11" fill="#5b6b7c">探测 +1，占用</text>

  <rect x="454" y="120" width="120" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="514" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">key C</text>
  <text x="514" y="174" text-anchor="middle" font-size="11" fill="#2e9e5b">空槽，落位</text>

  <rect x="582" y="120" width="120" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="642" y="163" text-anchor="middle" font-size="12" fill="#5b6b7c">空</text>

  <rect x="710" y="120" width="120" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="770" y="163" text-anchor="middle" font-size="12" fill="#5b6b7c">空</text>

  <path d="M 258 198 L 258 218 L 514 218 L 514 200" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="386" y="242" text-anchor="middle" font-size="11" fill="#5b6b7c">nextIndex：i+1 已被占用，就继续 +1，直到遇到空槽</text>
  <text x="450" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2b38">hash(key C) = 1 与 key B 冲突，探测后落在 i=3；不用链表，省去 next 指针</text>
</svg>
