<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ThreadLocal 内部结构：变量副本随线程存放</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ThreadLocal 内部结构：变量副本随线程存放</text>

  <rect x="40" y="70" width="250" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="165" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Thread A</text>
  <rect x="56" y="110" width="228" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">ThreadLocalMap</text>
  <rect x="56" y="170" width="228" height="188" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">Entry[] table</text>
  <rect x="68" y="204" width="204" height="52" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="170" y="226" text-anchor="middle" font-size="11" fill="#1f2b38">key：ThreadLocal（弱引用）</text>
  <text x="170" y="246" text-anchor="middle" font-size="11" fill="#5b6b7c">value：A 线程的副本</text>
  <rect x="68" y="266" width="204" height="52" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="170" y="288" text-anchor="middle" font-size="11" fill="#1f2b38">key：ThreadLocal2（弱引用）</text>
  <text x="170" y="308" text-anchor="middle" font-size="11" fill="#5b6b7c">value：另一个副本</text>

  <rect x="340" y="160" width="220" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">ThreadLocal 实例</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#5b6b7c">全局唯一，作为各线程 Map 的 key</text>
  <path d="M 340 195 L 318 195 L 318 133 L 288 133" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 560 195 L 582 195 L 582 133 L 612 133" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="610" y="70" width="250" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Thread B</text>
  <rect x="626" y="110" width="228" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="740" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">ThreadLocalMap</text>
  <rect x="626" y="170" width="228" height="188" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">Entry[] table</text>
  <rect x="638" y="204" width="204" height="52" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="740" y="226" text-anchor="middle" font-size="11" fill="#1f2b38">key：ThreadLocal（弱引用）</text>
  <text x="740" y="246" text-anchor="middle" font-size="11" fill="#5b6b7c">value：B 线程的副本</text>
  <rect x="638" y="266" width="204" height="52" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="740" y="288" text-anchor="middle" font-size="11" fill="#1f2b38">key：ThreadLocal2（弱引用）</text>
  <text x="740" y="308" text-anchor="middle" font-size="11" fill="#5b6b7c">value：另一个副本</text>

  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">同一个 ThreadLocal 实例作为各线程 Map 的 key</text>
  <text x="450" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2b38">value 存放在各自线程的 Map 中，线程之间互不可见 → 副本隔离</text>
</svg>
