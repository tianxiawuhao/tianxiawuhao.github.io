<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Hive 架构：HQL 编译成执行计划，元数据放 Metastore，数据存 HDFS</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Hive 架构：SQL 翻译层 + 元数据 + HDFS 存储</text>

  <!-- A: entry -->
  <rect x="40" y="55" width="820" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="60" y="70" width="230" height="36" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="175" y="93" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">CLI / Beeline / JDBC</text>
  <rect x="310" y="70" width="230" height="36" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="425" y="93" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Thrift Server（可选）</text>
  <rect x="560" y="70" width="280" height="36" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="700" y="93" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">作业提交入口（HQL 文本）</text>

  <line x1="220" y1="121" x2="220" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- B: hive services -->
  <rect x="40" y="146" width="820" height="228" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="58" y="168" font-size="12" font-weight="700" fill="#5b6b7c">Hive 服务层</text>

  <rect x="60" y="176" width="520" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="320" y="198" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Driver 编译器</text>
  <text x="320" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">解析语法树 → 语义分析 → 逻辑计划 → 优化</text>
  <text x="320" y="238" font-size="11" fill="#5b6b7c" text-anchor="middle">→ 物理计划（谓词下推 / 分区裁剪 / join 重排）</text>

  <rect x="600" y="176" width="240" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="720" y="198" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Metastore 元数据</text>
  <text x="720" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">库表定义 · 分区信息 · 存储位置</text>
  <line x1="592" y1="214" x2="548" y2="214" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="262" width="520" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="320" y="286" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">执行引擎（hive.execution.engine）</text>
  <text x="320" y="308" font-size="11" fill="#5b6b7c" text-anchor="middle">mr（默认）/ tez / spark，编译结果交给集群跑</text>
  <text x="320" y="326" font-size="11" fill="#5b6b7c" text-anchor="middle">换 Tez 或 Spark 可省掉大量中间落盘</text>

  <rect x="600" y="262" width="240" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="720" y="284" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">元数据落库</text>
  <text x="720" y="304" font-size="11" fill="#5b6b7c" text-anchor="middle">默认 Derby（单会话）</text>
  <text x="720" y="321" font-size="11" fill="#5b6b7c" text-anchor="middle">生产改用 MySQL 独立库</text>

  <line x1="320" y1="252" x2="320" y2="274" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- C: storage -->
  <rect x="40" y="394" width="820" height="96" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="58" y="416" font-size="12" font-weight="700" fill="#5b6b7c">HDFS 存储（数据本体）</text>
  <text x="70" y="442" font-size="13" font-weight="700" fill="#1f2b38">/warehouse/dwd.db/dwd_order_detail/</text>
  <text x="120" y="464" font-size="12" fill="#2f6fd0">dt=2024-06-29/000000_0</text>
  <text x="120" y="482" font-size="12" fill="#2f6fd0">dt=2024-06-30/000000_0</text>
  <text x="470" y="442" font-size="12" fill="#5b6b7c">表 = 目录</text>
  <text x="470" y="464" font-size="12" fill="#5b6b7c">分区 = 子目录</text>
  <text x="470" y="482" font-size="12" fill="#5b6b7c">数据 = 目录下的文件（ORC / Parquet）</text>
  <line x1="320" y1="338" x2="320" y2="386" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
