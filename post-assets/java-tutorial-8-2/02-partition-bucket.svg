<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Hive 分区与分桶：分区裁剪跳读目录，分桶哈希定位文件</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">分区与分桶：两种不同的「少读一点」</text>

  <!-- left: partition -->
  <rect x="40" y="55" width="400" height="290" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="80" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">分区：按列值切成子目录</text>
  <text x="240" y="103" font-size="11" fill="#5b6b7c" text-anchor="middle">PARTITIONED BY (dt STRING)</text>

  <rect x="70" y="118" width="340" height="30" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="138" font-size="12" fill="#1f2b38" text-anchor="middle">dwd_order_detail/</text>

  <rect x="90" y="158" width="300" height="28" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="240" y="177" font-size="12" fill="#1f2b38" text-anchor="middle">dt=2024-06-30/（命中分区）</text>
  <line x1="240" y1="148" x2="240" y2="154" stroke="#5b6b7c" stroke-width="1.4"/>

  <rect x="90" y="194" width="300" height="28" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="213" font-size="12" fill="#5b6b7c" text-anchor="middle">dt=2024-06-29/</text>
  <rect x="90" y="230" width="300" height="28" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="249" font-size="12" fill="#5b6b7c" text-anchor="middle">dt=2024-06-28/</text>

  <text x="240" y="284" font-size="11" fill="#5b6b7c" text-anchor="middle">WHERE 带分区条件 → 分区裁剪</text>
  <text x="240" y="304" font-size="11" fill="#5b6b7c" text-anchor="middle">未命中的目录连打开都不打开</text>
  <text x="240" y="324" font-size="11" fill="#5b6b7c" text-anchor="middle">分区列不存于文件，从路径解析而来</text>

  <!-- right: bucket -->
  <rect x="460" y="55" width="400" height="290" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="660" y="80" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">分桶：按哈希取模切成文件</text>
  <text x="660" y="103" font-size="11" fill="#5b6b7c" text-anchor="middle">CLUSTERED BY (user_id) INTO 4 BUCKETS</text>

  <rect x="490" y="120" width="340" height="26" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="660" y="138" font-size="12" fill="#1f2b38" text-anchor="middle">hash(user_id) mod 4</text>
  <line x1="660" y1="146" x2="660" y2="158" stroke="#5b6b7c" stroke-width="1.4"/>

  <rect x="490" y="162" width="78" height="40" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="529" y="180" font-size="11" fill="#1f2b38" text-anchor="middle">桶 0</text>
  <text x="529" y="195" font-size="10" fill="#5b6b7c" text-anchor="middle">000000_0</text>
  <rect x="578" y="162" width="78" height="40" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="617" y="180" font-size="11" fill="#1f2b38" text-anchor="middle">桶 1</text>
  <text x="617" y="195" font-size="10" fill="#5b6b7c" text-anchor="middle">000001_0</text>
  <rect x="666" y="162" width="78" height="40" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="705" y="180" font-size="11" fill="#1f2b38" text-anchor="middle">桶 2</text>
  <text x="705" y="195" font-size="10" fill="#5b6b7c" text-anchor="middle">000002_0</text>
  <rect x="754" y="162" width="78" height="40" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="793" y="180" font-size="11" fill="#1f2b38" text-anchor="middle">桶 3</text>
  <text x="793" y="195" font-size="10" fill="#5b6b7c" text-anchor="middle">000003_0</text>

  <text x="660" y="230" font-size="11" fill="#5b6b7c" text-anchor="middle">用途一：TABLESAMPLE(BUCKET x OUT OF 4) 低成本抽样</text>
  <text x="660" y="252" font-size="11" fill="#5b6b7c" text-anchor="middle">用途二：同列同桶数 → 桶对桶 SMB Join，省掉 shuffle</text>
  <text x="660" y="282" font-size="11" fill="#5b6b7c" text-anchor="middle">写入需 hive.enforce.bucketing=true（2.x 起默认）</text>
  <text x="660" y="304" font-size="11" fill="#5b6b7c" text-anchor="middle">数据太小、桶数太多 → 退化成大量小文件</text>

  <!-- bottom note -->
  <rect x="40" y="360" width="820" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="390" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">收益排序：分区裁剪 &gt; 列裁剪（ORC / Parquet）&gt; 分桶 &gt; 调参数</text>
</svg>
