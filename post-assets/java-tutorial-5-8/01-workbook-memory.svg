<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>POI 三种 Workbook 的格式上限与内存模型</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">POI 三种 Workbook：格式上限与内存模型</text>
<rect x="40" y="55" width="260" height="38" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="170" y="79" font-size="13.5" fill="#1f2b38" text-anchor="middle" font-weight="700">HSSFWorkbook</text>
<rect x="40" y="93" width="260" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="54" y="119" font-size="11.5" fill="#5b6b7c" text-anchor="start">格式：.xls（BIFF8）</text>
<text x="54" y="145" font-size="11.5" fill="#5b6b7c" text-anchor="start">上限 65536 行 / 256 列</text>
<text x="54" y="171" font-size="11.5" fill="#5b6b7c" text-anchor="start">全量对象模型，常驻堆</text>
<text x="54" y="197" font-size="11.5" fill="#5b6b7c" text-anchor="start">超上限即行号越界异常</text>
<rect x="320" y="55" width="260" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="79" font-size="13.5" fill="#1f2b38" text-anchor="middle" font-weight="700">XSSFWorkbook</text>
<rect x="320" y="93" width="260" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="334" y="119" font-size="11.5" fill="#5b6b7c" text-anchor="start">格式：.xlsx（OOXML）</text>
<text x="334" y="145" font-size="11.5" fill="#5b6b7c" text-anchor="start">上限 1048576 行</text>
<text x="334" y="171" font-size="11.5" fill="#5b6b7c" text-anchor="start">全量 DOM 全建在堆里</text>
<text x="334" y="197" font-size="11.5" fill="#5b6b7c" text-anchor="start">百万行导出会 OOM</text>
<rect x="600" y="55" width="260" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="730" y="79" font-size="13.5" fill="#1f2b38" text-anchor="middle" font-weight="700">SXSSFWorkbook</text>
<rect x="600" y="93" width="260" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="614" y="119" font-size="11.5" fill="#5b6b7c" text-anchor="start">XSSF 之上的滑动窗口</text>
<text x="614" y="145" font-size="11.5" fill="#5b6b7c" text-anchor="start">默认窗口 100 行</text>
<text x="614" y="171" font-size="11.5" fill="#5b6b7c" text-anchor="start">超窗刷盘，对象被回收</text>
<text x="614" y="197" font-size="11.5" fill="#5b6b7c" text-anchor="start">内存与总行数无关</text>
<text x="40" y="246" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">大数据量导入：事件模式逐行解析，内存里只留当前行</text>
<rect x="40" y="262" width="180" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="130" y="286" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">OPCPackage.open</text>
<text x="130" y="306" font-size="11" fill="#5b6b7c" text-anchor="middle">只读打开 zip 包</text>
<line x1="223" y1="290" x2="246" y2="290" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="250" y="262" width="180" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="340" y="286" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">XSSFReader</text>
<text x="340" y="306" font-size="11" fill="#5b6b7c" text-anchor="middle">取 sheet 流与共享字符串</text>
<line x1="433" y1="290" x2="456" y2="290" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="460" y="262" width="180" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="550" y="286" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">XMLReader + Handler</text>
<text x="550" y="306" font-size="11" fill="#5b6b7c" text-anchor="middle">SAX 逐行回调，读完即丢</text>
<line x1="643" y1="290" x2="666" y2="290" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="670" y="262" width="180" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="760" y="286" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">SheetHandler</text>
<text x="760" y="306" font-size="11" fill="#5b6b7c" text-anchor="middle">CellReference 定位列号</text>
<text x="40" y="350" font-size="12" fill="#5b6b7c" text-anchor="start">列定位别用 substring(0,1)：第 27 列（AA）会错位，空单元格也不会被回调</text>
<text x="40" y="376" font-size="12" fill="#e08a1e" text-anchor="start">导出侧：SXSSF 用完必须 dispose() 清掉 /tmp 下的 poi-sxssf 临时文件，并放进 finally</text>
<text x="40" y="402" font-size="12" fill="#5b6b7c" text-anchor="start">CellStyle 由工作簿统一管理且有数量上限，循环里不要重复 createCellStyle()</text>
  <!-- 制图说明：本图遵循站内自制示意图规范，白底卡片、纯矢量、无外链与脚本；内容要点：上部对比 HSSF、XSSF、SXSSF 的格式上限与内存模型，下部给出大数据量导入的 SAX 事件模式流程与三条实践提醒。 -->
</svg>
