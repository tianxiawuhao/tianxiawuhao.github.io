<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>消息队列六大典型应用场景</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">消息队列的六大典型应用场景</text>

  <rect x="345" y="60" width="210" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fd0">消息队列 MQ</text>

  <path d="M 345 85 L 155 85 L 155 341" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="155" y1="181" x2="300" y2="181" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="155" y1="261" x2="300" y2="261" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="155" y1="341" x2="300" y2="341" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <path d="M 555 85 L 745 85 L 745 341" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="745" y1="181" x2="600" y2="181" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="745" y1="261" x2="600" y2="261" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="745" y1="341" x2="600" y2="341" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="16" y="150" width="250" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="141" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">应用解耦</text>
  <text x="141" y="196" text-anchor="middle" font-size="11" fill="#5b6b7c">服务之间通过消息通信</text>

  <rect x="16" y="230" width="250" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="141" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">异步处理</text>
  <text x="141" y="276" text-anchor="middle" font-size="11" fill="#5b6b7c">发送与消费解耦，缩短响应时间</text>

  <rect x="16" y="310" width="250" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="141" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">流量削峰</text>
  <text x="141" y="356" text-anchor="middle" font-size="11" fill="#5b6b7c">峰值请求先入队，下游按能力消费</text>

  <rect x="634" y="150" width="250" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="759" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">日志处理</text>
  <text x="759" y="196" text-anchor="middle" font-size="11" fill="#5b6b7c">Kafka 承接海量日志传输</text>

  <rect x="634" y="230" width="250" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="759" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">消息通讯</text>
  <text x="759" y="276" text-anchor="middle" font-size="11" fill="#5b6b7c">点对点聊天、群聊等即时通信</text>

  <rect x="634" y="310" width="250" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="759" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">消息广播</text>
  <text x="759" y="356" text-anchor="middle" font-size="11" fill="#5b6b7c">新业务方订阅即可接入，免改接口</text>
</svg>
