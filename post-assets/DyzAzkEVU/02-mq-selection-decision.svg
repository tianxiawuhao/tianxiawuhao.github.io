<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>消息队列选型决策路径</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">消息队列选型决策路径</text>

  <!-- 起点 -->
  <rect x="330" y="58" width="240" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">业务主要诉求是什么？</text>

  <!-- 三条分支连线 -->
  <path d="M 450 104 L 450 128" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M 150 128 L 750 128" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M 150 128 L 150 152" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 128 L 450 152" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 750 128 L 750 152" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 分支一：Kafka -->
  <rect x="30" y="152" width="240" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="150" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">海量日志采集与传输</text>
  <text x="150" y="195" text-anchor="middle" font-size="11" fill="#5b6b7c">追求极高吞吐量</text>
  <line x1="150" y1="206" x2="150" y2="264" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="30" y="266" width="240" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Kafka</text>
  <text x="150" y="313" text-anchor="middle" font-size="11" fill="#5b6b7c">日志采集场景的首选</text>
  <text x="150" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">大型公司数据管道</text>

  <!-- 分支二：RocketMQ -->
  <rect x="330" y="152" width="240" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">订单、扣款等金融级交易</text>
  <text x="450" y="195" text-anchor="middle" font-size="11" fill="#5b6b7c">可靠性优先，需削峰</text>
  <line x1="450" y1="206" x2="450" y2="264" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="266" width="240" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">RocketMQ</text>
  <text x="450" y="313" text-anchor="middle" font-size="11" fill="#5b6b7c">消息可靠、事务消息</text>
  <text x="450" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">经受过双 11 考验</text>

  <!-- 分支三：RabbitMQ -->
  <rect x="630" y="152" width="240" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="750" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">数据量适中，要功能完备</text>
  <text x="750" y="195" text-anchor="middle" font-size="11" fill="#5b6b7c">需要灵活的消息路由</text>
  <line x1="750" y1="206" x2="750" y2="264" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="630" y="266" width="240" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="750" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">RabbitMQ</text>
  <text x="750" y="313" text-anchor="middle" font-size="11" fill="#5b6b7c">社区活跃、界面易用</text>
  <text x="750" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">小公司优先选择</text>

  <!-- 底部说明 -->
  <rect x="30" y="376" width="840" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="58" y="404" font-size="12" font-weight="700" fill="#1f2b38">补充说明</text>
  <text x="58" y="426" font-size="11" fill="#5b6b7c">ActiveMQ 5.x 的官方社区维护力度持续下降，已较少用于大规模吞吐场景，新项目一般不再作为首选。</text>
  <text x="58" y="444" font-size="11" fill="#5b6b7c">选型时除了吞吐与可靠性，还应同时评估：消息顺序、延迟消息、事务消息、运维成本和团队技术栈。</text>
</svg>
