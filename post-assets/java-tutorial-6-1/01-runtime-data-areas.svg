<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>运行时数据区：三块线程私有内存与两块线程共享内存</title>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">运行时数据区：三块线程私有，两块线程共享</text>

  <rect x="30" y="58" width="400" height="232" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="84" font-size="13" font-weight="700" fill="#2f6fd0">线程私有 · 生命周期与线程一致</text>

  <rect x="48" y="100" width="364" height="48" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="64" y="120" font-size="12.5" font-weight="700" fill="#1f2b38">程序计数器</text>
  <text x="64" y="138" font-size="11" fill="#5b6b7c">当前线程的字节码行号；唯一不抛 OOM 的区域</text>

  <rect x="48" y="160" width="364" height="48" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="64" y="180" font-size="12.5" font-weight="700" fill="#1f2b38">虚拟机栈</text>
  <text x="64" y="198" font-size="11" fill="#5b6b7c">栈帧：局部变量表、操作数栈、动态链接、返回地址</text>

  <rect x="48" y="220" width="364" height="48" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="64" y="240" font-size="12.5" font-weight="700" fill="#1f2b38">本地方法栈</text>
  <text x="64" y="258" font-size="11" fill="#5b6b7c">为 native 方法服务；HotSpot 中与虚拟机栈合并实现</text>

  <rect x="470" y="58" width="400" height="232" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="84" font-size="13" font-weight="700" fill="#2e9e5b">线程共享 · 随虚拟机启动与退出</text>

  <rect x="488" y="100" width="364" height="70" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="504" y="122" font-size="12.5" font-weight="700" fill="#1f2b38">堆（Heap）· GC 主战场</text>
  <text x="504" y="142" font-size="11" fill="#5b6b7c">存放对象实例与数组，按分代划分新生代与老年代</text>
  <text x="504" y="160" font-size="11" fill="#5b6b7c">堆无法再扩展时抛 OutOfMemoryError</text>

  <rect x="488" y="182" width="364" height="86" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="504" y="204" font-size="12.5" font-weight="700" fill="#1f2b38">方法区（JDK 8 起为元空间）</text>
  <text x="504" y="224" font-size="11" fill="#5b6b7c">类信息、运行时常量池；JDK 7 及以前由永久代实现</text>
  <text x="504" y="242" font-size="11" fill="#5b6b7c">JDK 8 起改用本地内存，受 MaxMetaspaceSize 约束</text>
  <text x="504" y="260" font-size="11" fill="#5b6b7c">字符串常量池自 JDK 7 起已挪进堆</text>

  <rect x="30" y="308" width="840" height="72" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="50" y="336" font-size="12.5" font-weight="700" fill="#e08a1e">直接内存（不属于运行时数据区）</text>
  <text x="50" y="358" font-size="11.5" fill="#5b6b7c">NIO 的 DirectByteBuffer 大量使用，受本机总内存限制，是“堆没满却 OOM”的常见来源</text>
</svg>
