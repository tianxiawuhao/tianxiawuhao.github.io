<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>请求穿过网关的灰度与限流链路</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一次请求穿过网关：限流、路由与灰度分流</text>
  <rect x="40" y="90" width="140" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="110" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">客户端</text>
  <text x="110" y="152" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">HTTP 请求</text>
  <rect x="230" y="70" width="200" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="330" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Spring Cloud Gateway</text>
  <text x="330" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">路由 lb://order-service</text>
  <text x="330" y="153" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">RequestRateLimiter 限流</text>
  <text x="330" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">鉴权 · 访问日志</text>
  <rect x="480" y="70" width="180" height="130" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="570" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务发现与负载均衡</text>
  <text x="570" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Nacos 实例列表</text>
  <text x="570" y="153" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">按 version 标签筛选</text>
  <text x="570" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">灰度：先放 5% 流量</text>
  <rect x="710" y="60" width="170" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="795" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">order-service v1</text>
  <text x="795" y="125" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">稳定版本 · 95% 流量</text>
  <rect x="710" y="230" width="170" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="795" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">order-service v2</text>
  <text x="795" y="295" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">灰度版本 · 5% 流量</text>
  <path d="M 180 135 H 230" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 430 135 H 480" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 660 115 H 690 V 105 H 710" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 660 155 H 685 V 275 H 710" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 330 200 V 345" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 795 320 V 345" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="345" width="840" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="455" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">TraceId 全链路透传：网关生成 → 服务间透传 → 上报 Zipkin / SkyWalking</text>
  <text x="455" y="395" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Micrometer Tracing + Brave / OTel（Sleuth 已停止演进）</text>
</svg>
