<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>服务分发与治理的四类核心能力</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">服务分发与治理：把四件事从业务代码里抽出来</text>
  <rect x="20" y="60" width="190" height="240" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务发现</text>
  <text x="115" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">实例注册 + 心跳</text>
  <text x="115" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">健康检查与失效剔除</text>
  <text x="115" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Nacos / Eureka</text>
  <text x="115" y="215" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">调用方只依赖服务名</text>
  <rect x="243" y="60" width="190" height="240" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="338" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务路由</text>
  <text x="338" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">客户端负载均衡</text>
  <text x="338" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">权重 · 灰度标签</text>
  <text x="338" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Spring Cloud Gateway</text>
  <text x="338" y="215" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">入口统一转发</text>
  <rect x="466" y="60" width="190" height="240" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="561" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">流量防护</text>
  <text x="561" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">入口限流（QPS）</text>
  <text x="561" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">熔断快速失败</text>
  <text x="561" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">降级兜底响应</text>
  <text x="561" y="215" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Sentinel / Resilience4j</text>
  <rect x="689" y="60" width="190" height="240" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="784" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">可观测与一致性</text>
  <text x="784" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">TraceId 全链路追踪</text>
  <text x="784" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Micrometer Tracing</text>
  <text x="784" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">TCC 两阶段提交</text>
  <text x="784" y="215" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">消息最终一致 / Seata</text>
  <rect x="20" y="330" width="859" height="45" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">地址可管理 · 流量可分配 · 故障可隔离 · 问题可定位</text>
</svg>
