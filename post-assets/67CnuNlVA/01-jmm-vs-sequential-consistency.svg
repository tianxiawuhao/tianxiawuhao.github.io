<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>顺序一致性内存模型与 JMM 本地内存的结构对比</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">顺序一致性内存模型 vs JMM 本地内存</text>
  <text x="225" y="72" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">顺序一致性模型</text>
  <rect x="45" y="86" width="360" height="264" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="70" y="100" width="310" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="127" font-size="12" fill="#1f2b38" text-anchor="middle">全局内存（单一）</text>
  <rect x="212" y="156" width="26" height="26" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="174" font-size="11" fill="#1f2b38" text-anchor="middle">开关</text>
  <rect x="90" y="202" width="270" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="232" font-size="12" fill="#1f2b38" text-anchor="middle">线程</text>
  <line x1="225" y1="202" x2="225" y2="186" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="90" y="266" width="270" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="296" font-size="12" fill="#1f2b38" text-anchor="middle">线程</text>
  <line x1="225" y1="266" x2="225" y2="186" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="225" y="340" font-size="10.5" fill="#5b6b7c" text-anchor="middle">任意时刻只有一个线程连到内存，所有读写在全局串行化</text>
  <text x="225" y="356" font-size="10.5" fill="#5b6b7c" text-anchor="middle">每个操作原子且立即对所有线程可见</text>
  <text x="675" y="72" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">JMM（Java 内存模型）</text>
  <rect x="495" y="86" width="360" height="264" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="540" y="100" width="270" height="40" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="675" y="125" font-size="12" fill="#1f2b38" text-anchor="middle">主内存（共享变量）</text>
  <rect x="520" y="168" width="310" height="46" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="675" y="196" font-size="12" fill="#1f2b38" text-anchor="middle">线程本地内存</text>
  <text x="675" y="210" font-size="10.5" fill="#5b6b7c" text-anchor="middle">缓存 · 写缓冲 · 寄存器</text>
  <line x1="675" y1="140" x2="675" y2="168" stroke="#5b6b7c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="520" y="248" width="310" height="46" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="675" y="276" font-size="12" fill="#1f2b38" text-anchor="middle">线程本地内存</text>
  <text x="675" y="290" font-size="10.5" fill="#5b6b7c" text-anchor="middle">缓存 · 写缓冲 · 寄存器</text>
  <line x1="675" y1="220" x2="675" y2="248" stroke="#5b6b7c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <line x1="640" y1="214" x2="560" y2="168" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="710" y1="214" x2="790" y2="168" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="675" y="318" font-size="10.5" fill="#5b6b7c" text-anchor="middle">各线程持有私有副本，写操作先落本地内存</text>
  <text x="675" y="336" font-size="10.5" fill="#5b6b7c" text-anchor="middle">未同步时副本过期 → 可见性问题与指令重排序</text></svg>
