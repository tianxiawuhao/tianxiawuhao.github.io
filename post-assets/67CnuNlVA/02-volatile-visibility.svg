<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>普通变量与 volatile 变量的读写路径和内存屏障语义</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">普通变量与 volatile 变量的内存语义</text>
  <text x="225" y="72" font-size="13" fill="#5b6b7c" text-anchor="middle" font-weight="700">普通变量</text>
  <rect x="45" y="86" width="360" height="240" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="160" y="100" width="130" height="38" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="124" font-size="12" fill="#1f2b38" text-anchor="middle">CPU 缓存</text>
  <rect x="160" y="190" width="130" height="38" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="214" font-size="12" fill="#1f2b38" text-anchor="middle">主内存</text>
  <line x1="225" y1="190" x2="225" y2="140" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="225" y1="138" x2="225" y2="188" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="255" y="168" font-size="10.5" fill="#5b6b7c">读写可能命中缓存，其他线程不可见</text>
  <text x="225" y="260" font-size="11" fill="#5b6b7c" text-anchor="middle">其他线程读到的副本可能已经过期</text>
  <text x="225" y="286" font-size="11" fill="#1f2b38" text-anchor="middle">不保证可见性，也不阻止重排序</text>
  <text x="675" y="72" font-size="13" fill="#2e9e5b" text-anchor="middle" font-weight="700">volatile 变量</text>
  <rect x="495" y="86" width="360" height="240" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="610" y="100" width="130" height="38" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="675" y="124" font-size="11" fill="#5b6b7c" text-anchor="middle">CPU 缓存（被跳过）</text>
  <rect x="610" y="190" width="130" height="38" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="675" y="214" font-size="12" fill="#1f2b38" text-anchor="middle">主内存</text>
  <line x1="675" y1="190" x2="675" y2="140" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="675" y1="138" x2="675" y2="188" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="675" y="260" font-size="11" fill="#1f2b38" text-anchor="middle">读：每次从主内存取最新值</text>
  <text x="675" y="286" font-size="11" fill="#1f2b38" text-anchor="middle">写：插入内存屏障，禁止重排序</text>
  <rect x="45" y="342" width="810" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="368" font-size="11" fill="#1f2b38" text-anchor="middle">volatile 只保证可见性与有序性，不保证复合操作的原子性；计数场景仍需 synchronized 或原子类</text></svg>
