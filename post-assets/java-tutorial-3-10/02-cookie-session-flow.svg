<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Cookie 与 Session：在无状态协议上维持会话</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Cookie 与 Session：在无状态协议上维持会话</text>

  <rect x="50" y="75" width="200" height="170" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">浏览器</text>
  <text x="150" y="180" text-anchor="middle" font-size="12" fill="#5b6b7c">保存 Cookie</text>

  <rect x="650" y="75" width="200" height="170" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="750" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">服务端</text>
  <text x="750" y="180" text-anchor="middle" font-size="12" fill="#5b6b7c">创建 / 读取 Session</text>

  <line x1="252" y1="110" x2="646" y2="110" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="450" y="101" text-anchor="middle" font-size="12" fill="#2f6fd0">① 首次请求：不带 Cookie</text>
  <line x1="648" y1="160" x2="258" y2="160" stroke="#e08a1e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="450" y="181" text-anchor="middle" font-size="12" fill="#e08a1e">② 响应 Set-Cookie: JSESSIONID=…</text>
  <line x1="252" y1="210" x2="646" y2="210" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="450" y="231" text-anchor="middle" font-size="12" fill="#2e9e5b">③ 后续请求自动带回 Cookie → 认出会话</text>

  <line x1="750" y1="245" x2="750" y2="286" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="600" y="290" width="250" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="725" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务端 Session 池</text>
  <text x="725" y="344" text-anchor="middle" font-size="12" fill="#5b6b7c">JSESSIONID → 会话数据</text>

  <rect x="50" y="290" width="510" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="316" font-size="12" fill="#1f2b38">Cookie：由 Set-Cookie 下发，浏览器保存并在后续请求自动带回</text>
  <text x="70" y="340" font-size="12" fill="#1f2b38">Session：会话数据留在服务端，Cookie 里只放一个会话 ID</text>
  <text x="70" y="362" font-size="11" fill="#5b6b7c">maxAge / Path / HttpOnly / Secure 控制作用范围与安全性</text>
</svg>
