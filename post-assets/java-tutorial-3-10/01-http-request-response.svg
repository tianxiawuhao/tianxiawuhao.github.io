<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>一次 HTTP 交互：请求与响应的对称结构</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一次 HTTP 交互：请求与响应的对称结构</text>

  <rect x="50" y="60" width="350" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">请求（浏览器 → 服务端）</text>
  <rect x="50" y="116" width="350" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="147" text-anchor="middle" font-size="12" fill="#1f2b38">请求行：GET /books/java.html HTTP/1.1</text>
  <rect x="50" y="180" width="350" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="211" text-anchor="middle" font-size="12" fill="#1f2b38">请求头：Host / User-Agent / Cookie</text>
  <rect x="50" y="244" width="350" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="275" text-anchor="middle" font-size="12" fill="#1f2b38">请求体：name=abc&amp;password=xyz（可选）</text>

  <rect x="500" y="60" width="350" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="675" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">响应（服务端 → 客户端）</text>
  <rect x="500" y="116" width="350" height="52" rx="8" fill="#eaf7ef" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="675" y="147" text-anchor="middle" font-size="12" fill="#1f2b38">状态行：HTTP/1.1 200 OK</text>
  <rect x="500" y="180" width="350" height="52" rx="8" fill="#eaf7ef" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="675" y="211" text-anchor="middle" font-size="12" fill="#1f2b38">响应头：Content-Type / Set-Cookie</text>
  <rect x="500" y="244" width="350" height="52" rx="8" fill="#eaf7ef" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="675" y="275" text-anchor="middle" font-size="12" fill="#1f2b38">响应体：&lt;html&gt; 页面内容（可选）</text>

  <line x1="408" y1="140" x2="492" y2="140" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="492" y1="256" x2="408" y2="256" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="412" y="178" width="76" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="207" text-anchor="middle" font-size="12" fill="#1f2b38">无状态</text>

  <rect x="50" y="316" width="800" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="342" text-anchor="middle" font-size="12" fill="#1f2b38">HTTP 是无状态协议：每个请求独立，服务端处理完就「忘记」你是谁</text>
  <text x="450" y="366" text-anchor="middle" font-size="12" fill="#5b6b7c">Cookie 与 Session 就是在这层无状态之上补出「记住我」</text>
</svg>
