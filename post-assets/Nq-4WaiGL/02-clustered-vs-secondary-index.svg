<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>InnoDB 聚簇索引与 MyISAM 非聚簇索引的结构对比</title>
  <rect width="900" height="310" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">InnoDB 聚簇索引与 MyISAM 非聚簇索引的结构对比</text>

  <rect x="25" y="50" width="420" height="240" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">InnoDB：聚簇索引（索引组织表）</text>

  <rect x="45" y="92" width="170" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="116" text-anchor="middle" font-size="13" fill="#1f2b38">主键索引 B+ 树</text>
  <text x="130" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">叶子节点存整行数据</text>

  <rect x="255" y="92" width="170" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="116" text-anchor="middle" font-size="13" fill="#1f2b38">二级索引 B+ 树</text>
  <text x="340" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">叶子节点存主键值</text>

  <path d="M340 148 V178 H130 V152" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="235" y="196" text-anchor="middle" font-size="11" fill="#5b6b7c">回表：用主键再查主键索引</text>

  <rect x="45" y="208" width="380" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="235" y="240" text-anchor="middle" font-size="12" fill="#1f2b38">覆盖索引：所需列都在二级索引中，无需回表</text>

  <rect x="455" y="50" width="420" height="240" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">MyISAM：非聚簇索引（堆表）</text>

  <rect x="475" y="92" width="180" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="565" y="116" text-anchor="middle" font-size="13" fill="#1f2b38">索引文件 .MYI</text>
  <text x="565" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">叶子节点存行地址</text>

  <rect x="675" y="92" width="180" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="116" text-anchor="middle" font-size="13" fill="#1f2b38">数据文件 .MYD</text>
  <text x="765" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">按插入顺序存放</text>

  <line x1="655" y1="120" x2="671" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="665" y="196" text-anchor="middle" font-size="11" fill="#5b6b7c">按行地址再寻址一次才能取到整行</text>

  <rect x="475" y="208" width="380" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="665" y="240" text-anchor="middle" font-size="12" fill="#1f2b38">索引与数据分开存放，主键索引不存整行</text>
</svg>
