<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>InnoDB doublewrite 二次写：写入路径与崩溃恢复流程</title>
  <rect width="900" height="290" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">InnoDB doublewrite（二次写）：写入路径与崩溃恢复</text>

  <rect x="25" y="58" width="185" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="117" y="83" text-anchor="middle" font-size="13" fill="#1f2b38">缓冲池中的脏页</text>
  <text x="117" y="103" text-anchor="middle" font-size="11" fill="#5b6b7c">刷脏页时触发</text>

  <rect x="240" y="58" width="200" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="83" text-anchor="middle" font-size="13" fill="#1f2b38">内存 doublewrite buffer</text>
  <text x="340" y="103" text-anchor="middle" font-size="11" fill="#5b6b7c">memcpy 拷贝，大小 2MB</text>

  <rect x="470" y="58" width="190" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="565" y="83" text-anchor="middle" font-size="12" fill="#1f2b38">共享表空间 doublewrite 区</text>
  <text x="565" y="103" text-anchor="middle" font-size="11" fill="#5b6b7c">128 页 = 2MB，顺序写</text>

  <rect x="690" y="58" width="185" height="60" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="782" y="83" text-anchor="middle" font-size="13" fill="#1f2b38">各表空间文件 .ibd</text>
  <text x="782" y="103" text-anchor="middle" font-size="11" fill="#5b6b7c">离散写入（页不连续）</text>

  <line x1="210" y1="88" x2="236" y2="88" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="440" y1="88" x2="466" y2="88" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="660" y1="88" x2="686" y2="88" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="25" y1="158" x2="875" y2="158" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#5b6b7c">写入数据文件的过程中崩溃 → 崩溃恢复路径</text>

  <rect x="25" y="200" width="250" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="150" y="226" text-anchor="middle" font-size="13" fill="#1f2b38">写入数据文件时崩溃</text>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#5b6b7c">doublewrite 区保留完整页副本</text>

  <rect x="320" y="200" width="250" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="445" y="226" text-anchor="middle" font-size="13" fill="#1f2b38">从副本还原被写坏的页</text>
  <text x="445" y="246" text-anchor="middle" font-size="11" fill="#5b6b7c">复制回对应表空间文件</text>

  <rect x="615" y="200" width="260" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="745" y="226" text-anchor="middle" font-size="13" fill="#1f2b38">应用 redo log 完成恢复</text>
  <text x="745" y="246" text-anchor="middle" font-size="11" fill="#5b6b7c">先还原页，再重做日志</text>

  <line x1="275" y1="231" x2="316" y2="231" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="231" x2="611" y2="231" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
