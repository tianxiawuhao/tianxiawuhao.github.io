<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>二叉查找树每个节点最多两个孩子</title>
  <rect width="900" height="350" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">二叉查找树：每个节点最多两个孩子</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#5b6b7c">节点分支因子只有 2，元素越多树越高，查找经过的节点（磁盘页）也越多。</text>
  <rect x="420" y="80" width="60" height="32" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="101" text-anchor="middle" font-size="14" fill="#1f2b38">9</text>
  <rect x="220" y="164" width="60" height="32" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="250" y="185" text-anchor="middle" font-size="14" fill="#1f2b38">5</text>
  <rect x="620" y="164" width="60" height="32" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="650" y="185" text-anchor="middle" font-size="14" fill="#1f2b38">13</text>
  <rect x="100" y="248" width="60" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="130" y="269" text-anchor="middle" font-size="14" fill="#1f2b38">2</text>
  <rect x="340" y="248" width="60" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="370" y="269" text-anchor="middle" font-size="14" fill="#1f2b38">7</text>
  <rect x="500" y="248" width="60" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="530" y="269" text-anchor="middle" font-size="14" fill="#1f2b38">11</text>
  <rect x="740" y="248" width="60" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="770" y="269" text-anchor="middle" font-size="14" fill="#1f2b38">15</text>
  <line x1="432" y1="112" x2="266" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="468" y1="112" x2="634" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="232" y1="196" x2="146" y2="244" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="268" y1="196" x2="354" y2="244" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="632" y1="196" x2="546" y2="244" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="668" y1="196" x2="754" y2="244" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="316" text-anchor="middle" font-size="12" fill="#5b6b7c">每下降一层就多一次磁盘IO：查找 15 要依次访问 3 层节点。</text>
</svg>
