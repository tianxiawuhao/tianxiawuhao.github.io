<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>B树节点结构：k-1 个 key 把值域分成 k 段</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">B树的节点：多 key、多孩子</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#5b6b7c">一个含 k 个孩子的节点有 k-1 个 key，把值域切成 k 段，每段对应一个孩子。</text>
  <rect x="120" y="90" width="660" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="253" y="107" width="64" height="36" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="285" y="131" text-anchor="middle" font-size="14" fill="#1f2b38">K1</text>
  <rect x="418" y="107" width="64" height="36" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="131" text-anchor="middle" font-size="14" fill="#1f2b38">K2</text>
  <rect x="583" y="107" width="64" height="36" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="615" y="131" text-anchor="middle" font-size="14" fill="#1f2b38">K3</text>
  <line x1="202" y1="160" x2="202" y2="207" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="367" y1="160" x2="367" y2="207" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="532" y1="160" x2="532" y2="207" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="697" y1="160" x2="697" y2="207" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="142" y="211" width="120" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="202" y="233" text-anchor="middle" font-size="12" fill="#1f2b38">P0 子树</text>
  <rect x="307" y="211" width="120" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="367" y="233" text-anchor="middle" font-size="12" fill="#1f2b38">P1 子树</text>
  <rect x="472" y="211" width="120" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="532" y="233" text-anchor="middle" font-size="12" fill="#1f2b38">P2 子树</text>
  <rect x="637" y="211" width="120" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="697" y="233" text-anchor="middle" font-size="12" fill="#1f2b38">P3 子树</text>
  <text x="450" y="292" text-anchor="middle" font-size="12" fill="#5b6b7c">同一层的 key 越多、分支越多，一次磁盘IO能排除的区间就越大。</text>
</svg>
