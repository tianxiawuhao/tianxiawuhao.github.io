<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>磁盘按页读取，一次IO读入一个节点</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">磁盘按页读取：一次IO读入一个节点</text>
  <rect x="40" y="80" width="340" height="220" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">磁盘（以页为单位）</text>
  <rect x="70" y="124" width="280" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="86" y="151" font-size="12" fill="#1f2b38">页 1 · 根节点 [6, 15]</text>
  <rect x="70" y="180" width="280" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="86" y="207" font-size="12" fill="#1f2b38">页 2 · 中间节点 [3, 6]</text>
  <rect x="70" y="236" width="280" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="86" y="263" font-size="12" fill="#1f2b38">页 3 · 叶子节点 [4, 5, 6]</text>
  <line x1="386" y1="190" x2="514" y2="190" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#5b6b7c">1 次 IO</text>
  <rect x="520" y="80" width="340" height="220" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">内存</text>
  <rect x="550" y="124" width="280" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="690" y="151" text-anchor="middle" font-size="13" fill="#1f2b38">节点 [6, 15]</text>
  <text x="690" y="200" text-anchor="middle" font-size="12" fill="#1f2b38">在内存中比较 key：5 &lt; 6</text>
  <text x="690" y="228" text-anchor="middle" font-size="12" fill="#2f6fd0">→ 继续读第 1 个孩子</text>
  <text x="690" y="264" text-anchor="middle" font-size="12" fill="#5b6b7c">节点内的比较不产生磁盘IO</text>
</svg>
