<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>B树用多路分支降低树高</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">B树用多路分支降低树高</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#5b6b7c">3 阶 B树：每个节点最多 2 个 key、3 个孩子，同样的元素只需更少的层数。</text>
  <rect x="390" y="78" width="120" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="100" text-anchor="middle" font-size="14" fill="#1f2b38">4 | 8</text>
  <rect x="145" y="166" width="70" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="180" y="188" text-anchor="middle" font-size="14" fill="#1f2b38">2</text>
  <rect x="415" y="166" width="70" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="188" text-anchor="middle" font-size="14" fill="#1f2b38">6</text>
  <rect x="685" y="166" width="70" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="188" text-anchor="middle" font-size="14" fill="#1f2b38">10</text>
  <rect x="55" y="250" width="110" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="110" y="272" text-anchor="middle" font-size="13" fill="#1f2b38">1, 2</text>
  <rect x="195" y="250" width="110" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="250" y="272" text-anchor="middle" font-size="13" fill="#1f2b38">3, 4</text>
  <rect x="325" y="250" width="110" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="380" y="272" text-anchor="middle" font-size="13" fill="#1f2b38">5, 6</text>
  <rect x="465" y="250" width="110" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="520" y="272" text-anchor="middle" font-size="13" fill="#1f2b38">7, 8</text>
  <rect x="595" y="250" width="110" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="650" y="272" text-anchor="middle" font-size="13" fill="#1f2b38">9, 10</text>
  <rect x="735" y="250" width="110" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="790" y="272" text-anchor="middle" font-size="13" fill="#1f2b38">11, 12</text>
  <line x1="420" y1="112" x2="190" y2="162" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="112" x2="450" y2="162" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="480" y1="112" x2="710" y2="162" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="170" y1="200" x2="120" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="190" y1="200" x2="240" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="440" y1="200" x2="390" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="460" y1="200" x2="510" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="710" y1="200" x2="660" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="730" y1="200" x2="780" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="326" text-anchor="middle" font-size="12" fill="#5b6b7c">同样 12 个元素：二叉查找树最少 4 层，3 阶 B树只要 3 层，磁盘IO次数随之减少。</text>
</svg>
