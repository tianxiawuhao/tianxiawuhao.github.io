<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>基本数据类型的自动提升与强制转换方向</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">自动类型提升：从小到大，无需写代码</text>

  <rect x="27" y="75" width="150" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="102" y="105" text-anchor="middle" font-size="13" fill="#1f2b38">byte / short / char</text>
  <line x1="181" y1="99" x2="217" y2="99" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="221" y="75" width="110" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="276" y="105" text-anchor="middle" font-size="13" fill="#1f2b38">int</text>
  <line x1="335" y1="99" x2="371" y2="99" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="375" y="75" width="110" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="430" y="105" text-anchor="middle" font-size="13" fill="#1f2b38">long</text>
  <line x1="489" y1="99" x2="525" y2="99" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="529" y="75" width="110" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="584" y="105" text-anchor="middle" font-size="13" fill="#1f2b38">float</text>
  <line x1="643" y1="99" x2="679" y2="99" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="683" y="75" width="190" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="778" y="105" text-anchor="middle" font-size="13" fill="#1f2b38">double</text>

  <text x="27" y="150" font-size="12" fill="#5b6b7c">运算时 byte、short、char 先各自提升为 int；boolean 不参与任何数值转换。</text>

  <text x="450" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">强制类型转换：从大到小，必须显式写出</text>

  <rect x="27" y="218" width="230" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="142" y="250" text-anchor="middle" font-size="13" fill="#1f2b38">double d = 3.99;</text>
  <line x1="261" y1="244" x2="317" y2="244" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="321" y="218" width="230" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="436" y="250" text-anchor="middle" font-size="13" fill="#1f2b38">int i = (int) d;</text>
  <rect x="575" y="218" width="298" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="724" y="250" text-anchor="middle" font-size="12" fill="#1f2b38">被截断：i 得到 3，小数部分直接丢弃</text>
</svg>
