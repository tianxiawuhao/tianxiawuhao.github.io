<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>左移、有符号右移与无符号右移的补位规则</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">三种移位运算符的补位规则（示意为 8 位）</text>

  <text x="20" y="95" font-size="14" font-weight="700" fill="#2f6fd0">左移 &lt;&lt;</text>
  <text x="20" y="145" font-size="14" font-weight="700" fill="#2e9e5b">右移 &gt;&gt;</text>
  <text x="20" y="195" font-size="14" font-weight="700" fill="#e08a1e">无符号右移 &gt;&gt;&gt;</text>

  <rect x="150" y="68" width="200" height="36" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="250" y="92" text-anchor="middle" font-size="14" fill="#1f2b38">0 0 0 0 0 1 0 1</text>
  <text x="366" y="92" font-size="14" fill="#5b6b7c">左移 2 位</text>
  <line x1="482" y1="86" x2="528" y2="86" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="536" y="68" width="200" height="36" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="636" y="92" text-anchor="middle" font-size="14" fill="#1f2b38">0 0 0 1 0 1 0 0</text>
  <text x="750" y="92" font-size="12" fill="#5b6b7c">低位补 0，值 ×4</text>

  <rect x="150" y="118" width="200" height="36" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="250" y="142" text-anchor="middle" font-size="14" fill="#1f2b38">1 1 1 1 1 0 1 1</text>
  <text x="366" y="142" font-size="14" fill="#5b6b7c">右移 2 位</text>
  <line x1="482" y1="136" x2="528" y2="136" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="536" y="118" width="200" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="636" y="142" text-anchor="middle" font-size="14" fill="#1f2b38">1 1 1 1 1 1 1 0</text>
  <text x="750" y="142" font-size="12" fill="#5b6b7c">高位补符号位 1</text>

  <rect x="150" y="168" width="200" height="36" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="250" y="192" text-anchor="middle" font-size="14" fill="#1f2b38">1 1 1 1 1 0 1 1</text>
  <text x="366" y="192" font-size="14" fill="#5b6b7c">右移 2 位</text>
  <line x1="482" y1="186" x2="528" y2="186" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="536" y="168" width="200" height="36" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="636" y="192" text-anchor="middle" font-size="14" fill="#1f2b38">0 0 1 1 1 1 1 0</text>
  <text x="750" y="192" font-size="12" fill="#5b6b7c">高位一律补 0</text>

  <text x="450" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">同一份二进制，三种移位得到三种结果</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#5b6b7c">右移示例以 -5 的低 8 位（补码 11111011）演示；左移示例以 5 演示</text>

  <rect x="120" y="292" width="660" height="36" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="150" y="316" font-size="13" fill="#1f2b38">-5 &gt;&gt; 3 = -1　　-5 &gt;&gt;&gt; 3 = 536870911　　&gt;&gt;&gt; 会把负数变成很大的正数</text>

  <rect x="120" y="342" width="660" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="150" y="366" font-size="13" fill="#1f2b38">左移 n 位近似 ×2ⁿ；右移 n 位近似 ÷2ⁿ；n 超过位宽时会被取模</text>
</svg>
