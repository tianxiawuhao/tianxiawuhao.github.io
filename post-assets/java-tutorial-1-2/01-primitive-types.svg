<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 四类八种基本数据类型、占用字节与取值范围</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java 的四类八种基本数据类型</text>

  <rect x="25" y="55" width="130" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">byte</text>
  <text x="90" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">1 字节</text>
  <text x="90" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">-128 ~ 127</text>

  <rect x="171" y="55" width="130" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="236" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">short</text>
  <text x="236" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">2 字节</text>
  <text x="236" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">-32768 ~ 32767</text>

  <rect x="317" y="55" width="130" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="382" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">int</text>
  <text x="382" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">4 字节</text>
  <text x="382" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">约 ±21 亿</text>

  <rect x="463" y="55" width="130" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="528" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">long</text>
  <text x="528" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">8 字节</text>
  <text x="528" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">约 ±9.2×10¹⁸</text>

  <rect x="609" y="55" width="130" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="674" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">float</text>
  <text x="674" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">4 字节</text>
  <text x="674" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">约 ±3.4×10³⁸</text>

  <rect x="755" y="55" width="130" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="820" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">double</text>
  <text x="820" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">8 字节</text>
  <text x="820" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">约 ±1.8×10³⁰⁸</text>

  <rect x="25" y="195" width="560" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="45" y="223" font-size="13" font-weight="700" fill="#1f2b38">char：2 字节　范围 0 ~ 65535（UTF-16 码元，无符号）</text>
  <text x="45" y="251" font-size="12" fill="#5b6b7c">boolean：1 字节（JVM 实现相关）　取值只有 true / false</text>

  <rect x="609" y="195" width="276" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="747" y="223" text-anchor="middle" font-size="12" fill="#1f2b38">整数字面量默认 int，加 L 才是 long</text>
  <text x="747" y="251" text-anchor="middle" font-size="12" fill="#1f2b38">小数字面量默认 double，加 F 才是 float</text>
</svg>
