<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>读懂 ls -l 第一列：九个权限字符与数字换算</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">读懂 ls -l 第一列：九个字符与数字权限</text>

  <rect x="200" y="52" width="46" height="46" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <rect x="250" y="52" width="46" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="300" y="52" width="46" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="350" y="52" width="46" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="400" y="52" width="46" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="450" y="52" width="46" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="500" y="52" width="46" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="550" y="52" width="46" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="600" y="52" width="46" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="650" y="52" width="46" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="223" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">-</text>
  <text x="273" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">r</text>
  <text x="323" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">w</text>
  <text x="373" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">x</text>
  <text x="423" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">r</text>
  <text x="473" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">-</text>
  <text x="523" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">x</text>
  <text x="573" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">r</text>
  <text x="623" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">-</text>
  <text x="673" y="82" font-size="19" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">-</text>

  <line x1="200" y1="106" x2="246" y2="106" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="250" y1="106" x2="396" y2="106" stroke="#2e9e5b" stroke-width="1.4"/>
  <line x1="400" y1="106" x2="546" y2="106" stroke="#2f6fd0" stroke-width="1.4"/>
  <line x1="550" y1="106" x2="696" y2="106" stroke="#e08a1e" stroke-width="1.4"/>

  <text x="223" y="124" font-size="12.5" fill="#5b6b7c" text-anchor="middle">类型</text>
  <text x="323" y="124" font-size="12.5" fill="#5b6b7c" text-anchor="middle">属主 u</text>
  <text x="473" y="124" font-size="12.5" fill="#5b6b7c" text-anchor="middle">属组 g</text>
  <text x="623" y="124" font-size="12.5" fill="#5b6b7c" text-anchor="middle">其他 o</text>

  <text x="450" y="152" font-size="12" fill="#1f2b38" text-anchor="middle">r 读 = 4  |  w 写 = 2  |  x 执行 = 1  |  - 无权限 = 0</text>
  <line x1="60" y1="172" x2="840" y2="172" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="196" font-size="13" font-weight="700" fill="#1f2b38">数字设定法：每组三位相加，依次是属主 / 属组 / 其他</text>

  <rect x="60" y="212" width="170" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="145" y="242" font-size="16" font-weight="700" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">7 = rwx</text>
  <text x="145" y="262" font-size="11.5" fill="#5b6b7c" text-anchor="middle">读 + 写 + 执行</text>

  <rect x="263" y="212" width="170" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="348" y="242" font-size="16" font-weight="700" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">6 = rw-</text>
  <text x="348" y="262" font-size="11.5" fill="#5b6b7c" text-anchor="middle">读 + 写</text>

  <rect x="466" y="212" width="170" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="551" y="242" font-size="16" font-weight="700" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">5 = r-x</text>
  <text x="551" y="262" font-size="11.5" fill="#5b6b7c" text-anchor="middle">读 + 执行</text>

  <rect x="669" y="212" width="170" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="754" y="242" font-size="16" font-weight="700" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">4 = r--</text>
  <text x="754" y="262" font-size="11.5" fill="#5b6b7c" text-anchor="middle">只读</text>

  <rect x="60" y="292" width="780" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="316" font-size="12.5" fill="#1f2b38" text-anchor="middle">常用：755 可执行脚本 | 644 普通文件 | 600 私钥</text>
  <text x="450" y="338" font-size="12.5" fill="#1f2b38" text-anchor="middle">删除、重命名看所在目录的 w 权限；能否进入目录看目录的 x 权限</text>
</svg>
