<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392">
<rect width="900" height="392" fill="#ffffff"/>
<defs>
<marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2f6fd0"/></marker>
</defs>
<g font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">值传递：基本类型参数在两个栈帧中的副本</text>
<rect x="40" y="60" width="310" height="260" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="195" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">main() 方法栈帧</text>
<rect x="64" y="106" width="262" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="80" y="128" font-size="12" fill="#5b6b7c">局部变量 a</text>
<text x="80" y="150" font-size="15" font-weight="700" fill="#1f2b38">25</text>
<rect x="64" y="172" width="262" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="80" y="194" font-size="12" fill="#5b6b7c">局部变量 w</text>
<text x="80" y="216" font-size="15" font-weight="700" fill="#1f2b38">77.5f</text>
<rect x="64" y="238" width="262" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="80" y="262" font-size="12" font-weight="700" fill="#2e9e5b">方法执行结束后</text>
<text x="80" y="284" font-size="11.5" fill="#1f2b38">a = 25，w = 77.5f 保持不变</text>
<rect x="550" y="60" width="310" height="260" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="705" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">valueCrossTest() 方法栈帧</text>
<rect x="574" y="106" width="262" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="590" y="128" font-size="12" fill="#5b6b7c">形参 age（a 的副本）</text>
<text x="590" y="150" font-size="15" font-weight="700" fill="#1f2b38">25 → 33</text>
<rect x="574" y="172" width="262" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="590" y="194" font-size="12" fill="#5b6b7c">形参 weight（w 的副本）</text>
<text x="590" y="216" font-size="15" font-weight="700" fill="#1f2b38">77.5f → 89.5f</text>
<rect x="574" y="238" width="262" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="590" y="262" font-size="12" font-weight="700" fill="#e08a1e">赋值只修改副本</text>
<text x="590" y="284" font-size="11.5" fill="#1f2b38">方法返回后副本随栈帧销毁</text>
<line x1="352" y1="190" x2="544" y2="190" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ab)"/>
<text x="448" y="178" text-anchor="middle" font-size="12" fill="#2f6fd0">值传递：复制一份副本</text>
<text x="450" y="356" text-anchor="middle" font-size="12" fill="#5b6b7c">实参与形参位于不同栈帧，方法内重新赋值只改变副本，实参的值不变</text>
</g>
</svg>
