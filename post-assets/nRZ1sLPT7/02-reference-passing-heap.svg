<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" fill="#ffffff"/>
<defs>
<marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2f6fd0"/></marker>
<marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e08a1e"/></marker>
</defs>
<g font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">引用类型传递：形参改指新对象后与实参无关</text>
<rect x="40" y="60" width="260" height="280" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="170" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f6fd0">虚拟机栈（main 栈帧）</text>
<rect x="60" y="106" width="220" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="76" y="128" font-size="12" fill="#5b6b7c">实参 p</text>
<text x="76" y="150" font-size="14" font-weight="700" fill="#2f6fd0">地址 → 对象 A</text>
<rect x="60" y="176" width="220" height="84" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="76" y="198" font-size="12" fill="#5b6b7c">形参 person</text>
<text x="76" y="220" font-size="12" fill="#5b6b7c">传入时 → 对象 A</text>
<text x="76" y="242" font-size="12" font-weight="700" fill="#e08a1e">new 后 → 对象 B</text>
<text x="76" y="288" font-size="11.5" fill="#5b6b7c">方法结束后 person 副本销毁</text>
<text x="76" y="310" font-size="11.5" fill="#5b6b7c">p 仍指向对象 A</text>
<text x="665" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">堆（所有线程共享）</text>
<rect x="470" y="100" width="390" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="665" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Person 对象 A（原对象）</text>
<text x="665" y="152" text-anchor="middle" font-size="12.5" fill="#2f6fd0">name = 我是李四</text>
<text x="665" y="174" text-anchor="middle" font-size="12.5" fill="#5b6b7c">age = 45</text>
<rect x="470" y="240" width="390" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="665" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Person 对象 B（方法内 new）</text>
<text x="665" y="292" text-anchor="middle" font-size="12.5" fill="#e08a1e">name = 我是张三</text>
<text x="665" y="314" text-anchor="middle" font-size="12.5" fill="#5b6b7c">age = 0</text>
<line x1="282" y1="133" x2="466" y2="133" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ab)"/>
<text x="374" y="122" text-anchor="middle" font-size="11.5" fill="#2f6fd0">p 与 person 都指向 A</text>
<line x1="282" y1="235" x2="466" y2="285" stroke="#e08a1e" stroke-width="2" marker-end="url(#ao)"/>
<text x="374" y="246" text-anchor="middle" font-size="11.5" fill="#e08a1e">重新赋值后改指 B</text>
<rect x="40" y="352" width="820" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="450" y="386" text-anchor="middle" font-size="12" fill="#1f2b38">结论：Java 中只有值传递，引用类型传递的也是地址值的副本，形参与实参是两个独立的引用变量</text>
</g>
</svg>
