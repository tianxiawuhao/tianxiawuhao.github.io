<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>YARN 集群角色与资源分层</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">YARN 集群角色与资源分层</text>
  <rect x="30" y="60" width="160" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="110" y="88" font-size="13" fill="#1f2b38" text-anchor="middle">Client</text>
  <text x="110" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">提交应用（作业/脚本）</text>
  <line x1="195" y1="95" x2="243" y2="95" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="250" y="55" width="620" height="95" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="560" y="80" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">ResourceManager：集群资源总控</text>
  <rect x="275" y="95" width="250" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="400" y="113" font-size="12" fill="#1f2b38" text-anchor="middle">调度器 Scheduler</text>
  <text x="400" y="129" font-size="11" fill="#5b6b7c" text-anchor="middle">FIFO / 容量 / 公平</text>
  <rect x="545" y="95" width="300" height="42" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="695" y="113" font-size="12" fill="#1f2b38" text-anchor="middle">队列 Queue</text>
  <text x="695" y="129" font-size="11" fill="#5b6b7c" text-anchor="middle">容量下限 / 使用上限（弹性借用）</text>
  <line x1="560" y1="150" x2="560" y2="190" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="155" y1="190" x2="715" y2="190" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="155" y1="190" x2="155" y2="224" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="435" y1="190" x2="435" y2="224" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="715" y1="190" x2="715" y2="224" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="295" y="215" font-size="11" fill="#5b6b7c" text-anchor="middle">调度器按队列容量分配容器</text>
  <rect x="30" y="230" width="250" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="155" y="256" font-size="13" fill="#1f2b38" text-anchor="middle">NodeManager 1（单机资源）</text>
  <rect x="45" y="272" width="220" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="155" y="296" font-size="11" fill="#1f2b38" text-anchor="middle">Container（内存 + vCore）</text>
  <text x="155" y="316" font-size="11" fill="#5b6b7c" text-anchor="middle">AM 与任务都跑在容器里</text>
  <rect x="310" y="230" width="250" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="435" y="256" font-size="13" fill="#1f2b38" text-anchor="middle">NodeManager 2（单机资源）</text>
  <rect x="325" y="272" width="220" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="435" y="296" font-size="11" fill="#1f2b38" text-anchor="middle">Container（内存 + vCore）</text>
  <text x="435" y="316" font-size="11" fill="#5b6b7c" text-anchor="middle">AM 与任务都跑在容器里</text>
  <rect x="590" y="230" width="250" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="715" y="256" font-size="13" fill="#1f2b38" text-anchor="middle">NodeManager 3（单机资源）</text>
  <rect x="605" y="272" width="220" height="56" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="715" y="296" font-size="11" fill="#1f2b38" text-anchor="middle">Container（内存 + vCore）</text>
  <text x="715" y="316" font-size="11" fill="#5b6b7c" text-anchor="middle">AM 与任务都跑在容器里</text>
  <text x="450" y="372" font-size="12" fill="#5b6b7c" text-anchor="middle">上线前显式写死 memory-mb 与 cpu-vcores，并关闭硬件自动探测，否则容量规划失去意义</text>
</svg>
