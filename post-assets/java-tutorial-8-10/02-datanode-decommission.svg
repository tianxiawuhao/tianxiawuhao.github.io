<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>DataNode 退役流程与常见卡点</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">DataNode 退役（缩容）流程与常见卡点</text>
  <rect x="30" y="55" width="840" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="84" font-size="12" fill="#1f2b38" text-anchor="middle">扩容（服役）：主机名写入 whitelist → dfs.hosts 指向 → refreshNodes → 启动新节点进程 → 数据均衡</text>
  <rect x="30" y="130" width="180" height="85" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="158" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">① 写入黑名单</text>
  <text x="120" y="180" font-size="11" fill="#5b6b7c" text-anchor="middle">dfs.hosts.exclude</text>
  <text x="120" y="198" font-size="11" fill="#5b6b7c" text-anchor="middle">指向 blacklist 文件</text>
  <rect x="240" y="130" width="180" height="85" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="330" y="158" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">② 刷新 NameNode</text>
  <text x="330" y="180" font-size="11" fill="#5b6b7c" text-anchor="middle">hdfs dfsadmin</text>
  <text x="330" y="198" font-size="11" fill="#5b6b7c" text-anchor="middle">-refreshNodes</text>
  <rect x="450" y="130" width="180" height="85" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="540" y="158" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">③ 迁移副本</text>
  <text x="540" y="180" font-size="11" fill="#5b6b7c" text-anchor="middle">状态变为</text>
  <text x="540" y="198" font-size="11" fill="#5b6b7c" text-anchor="middle">decommission in progress</text>
  <rect x="660" y="130" width="210" height="85" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="765" y="158" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">④ 下线完成</text>
  <text x="765" y="180" font-size="11" fill="#5b6b7c" text-anchor="middle">状态变为 decommissioned</text>
  <text x="765" y="198" font-size="11" fill="#5b6b7c" text-anchor="middle">然后停进程、关机</text>
  <line x1="210" y1="172" x2="236" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="420" y1="172" x2="446" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="630" y1="172" x2="656" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="30" y="248" width="840" height="104" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="278" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">卡点：副本数为 3 且服役 DataNode 数 ≤ 3 时，退役一直停在 decommission in progress</text>
  <text x="450" y="306" font-size="11" fill="#5b6b7c" text-anchor="middle">原因是没有节点能接收副本 → 先增加节点，或先调小副本数，再执行退役。</text>
  <text x="450" y="332" font-size="11" fill="#5b6b7c" text-anchor="middle">另外：白名单与黑名单文件都要存在（内容为空也保留），改完必须 refreshNodes 才生效。</text>
</svg>
