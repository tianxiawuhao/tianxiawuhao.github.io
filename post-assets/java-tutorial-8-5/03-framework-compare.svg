<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Storm、Spark Streaming、Flink 对比与选型</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">三种流处理框架：模型、语义与选型</text>

  <rect x="30" y="52" width="840" height="290" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="230" y1="90" x2="860" y2="90" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="230" y1="150" x2="860" y2="150" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="230" y1="210" x2="860" y2="210" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="230" y1="270" x2="860" y2="270" stroke="#c8d3e0" stroke-width="1.2"/>

  <text x="45" y="80" font-size="11.5" fill="#5b6b7c">对比维度</text>
  <text x="365" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">Storm</text>
  <text x="540" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">Spark Streaming</text>
  <text x="715" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">Flink</text>
  <line x1="230" y1="52" x2="230" y2="342" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="450" y1="52" x2="450" y2="342" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="630" y1="52" x2="630" y2="342" stroke="#c8d3e0" stroke-width="1.2"/>

  <text x="45" y="112" font-size="12" fill="#1f2b38">计算模型</text>
  <text x="365" y="112" text-anchor="middle" font-size="11.5" fill="#1f2b38">逐条处理，真流系统</text>
  <text x="540" y="112" text-anchor="middle" font-size="11.5" fill="#1f2b38">微批，按批间隔切 RDD</text>
  <text x="715" y="112" text-anchor="middle" font-size="11.5" fill="#1f2b38">真流，批流一体 API</text>

  <text x="45" y="142" font-size="12" fill="#1f2b38">延迟</text>
  <text x="365" y="142" text-anchor="middle" font-size="11.5" fill="#2e9e5b">毫秒级，最低</text>
  <text x="540" y="142" text-anchor="middle" font-size="11.5" fill="#e08a1e">下限是批间隔，通常秒级</text>
  <text x="715" y="142" text-anchor="middle" font-size="11.5" fill="#2e9e5b">毫秒到秒级</text>

  <text x="45" y="180" font-size="12" fill="#1f2b38">事件时间与水位线</text>
  <text x="365" y="180" text-anchor="middle" font-size="11.5" fill="#1f2b38">需自行实现</text>
  <text x="540" y="180" text-anchor="middle" font-size="11.5" fill="#1f2b38">能力有限</text>
  <text x="715" y="180" text-anchor="middle" font-size="11.5" fill="#2e9e5b">原生支持</text>

  <text x="45" y="240" font-size="12" fill="#1f2b38">状态与容错</text>
  <text x="365" y="240" text-anchor="middle" font-size="11.5" fill="#1f2b38">状态自己维护，默认</text>
  <text x="365" y="258" text-anchor="middle" font-size="11.5" fill="#e08a1e">at-least-once</text>
  <text x="540" y="240" text-anchor="middle" font-size="11.5" fill="#1f2b38">RDD 血缘重算，可做到</text>
  <text x="540" y="258" text-anchor="middle" font-size="11.5" fill="#1f2b38">精确一次</text>
  <text x="715" y="240" text-anchor="middle" font-size="11.5" fill="#2e9e5b">状态 + Checkpoint 原生</text>
  <text x="715" y="258" text-anchor="middle" font-size="11.5" fill="#2e9e5b">exactly-once</text>

  <text x="45" y="305" font-size="12" fill="#1f2b38">典型场景</text>
  <text x="365" y="305" text-anchor="middle" font-size="11.5" fill="#1f2b38">存量系统，简单低延迟管道</text>
  <text x="540" y="305" text-anchor="middle" font-size="11.5" fill="#1f2b38">复用 Spark 生态与 SQL</text>
  <text x="715" y="305" text-anchor="middle" font-size="11.5" fill="#2e9e5b">新项目实时计算的默认选择</text>

  <rect x="30" y="362" width="840" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">选型建议</text>
  <text x="450" y="414" text-anchor="middle" font-size="11.5" fill="#1f2b38">新项目优先 Flink；Kafka 到 Kafka 的轻量转换用 Kafka Streams；Storm 只在存量维护或极简低延迟管道上仍合理</text>

  <text x="450" y="460" text-anchor="middle" font-size="11.5" fill="#5b6b7c">Spark 2.0 后官方主推 Structured Streaming，DStream API 已进入维护状态</text>
</svg>
