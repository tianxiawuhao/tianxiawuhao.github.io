<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MinIO 三种部署模式对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">MinIO 三种部署模式对比</text>

  <rect x="30" y="55" width="260" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#2f6fd0">单机模式（单盘）</text>
  <rect x="30" y="103" width="260" height="225" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="131" font-size="12" fill="#1f2b38">数据目录：/mnt/data</text>
  <text x="46" y="161" font-size="12" fill="#5b6b7c">不建副本、不启用纠删码</text>
  <text x="46" y="191" font-size="12" fill="#5b6b7c">对象直接落盘，读写路径最短</text>
  <text x="46" y="221" font-size="12" fill="#5b6b7c">存在单点故障风险</text>
  <text x="46" y="251" font-size="12" fill="#5b6b7c">仅用于开发与测试验证</text>

  <rect x="320" y="55" width="260" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#2e9e5b">纠删码模式（单机多盘）</text>
  <rect x="320" y="103" width="260" height="225" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="336" y="131" font-size="12" fill="#1f2b38">数据目录：/data{1...8}</text>
  <text x="336" y="161" font-size="12" fill="#5b6b7c">默认 4 数据块 + 4 校验块</text>
  <text x="336" y="191" font-size="12" fill="#5b6b7c">最多容忍同时损坏 4 块盘</text>
  <text x="336" y="221" font-size="12" fill="#5b6b7c">丢失一半以内数据仍可恢复</text>
  <text x="336" y="251" font-size="12" fill="#5b6b7c">可用容量约为总容量的一半</text>

  <rect x="610" y="55" width="260" height="38" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#e08a1e">分布式集群（多节点多盘）</text>
  <rect x="610" y="103" width="260" height="225" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="626" y="131" font-size="12" fill="#1f2b38">每个节点挂载多块数据盘</text>
  <text x="626" y="161" font-size="12" fill="#5b6b7c">各节点密钥与时间必须一致</text>
  <text x="626" y="191" font-size="12" fill="#5b6b7c">节点时间差须小于 3 秒</text>
  <text x="626" y="221" font-size="12" fill="#5b6b7c">数据盘必须是空盘</text>
  <text x="626" y="251" font-size="12" fill="#5b6b7c">生产推荐至少 4 个节点</text>

  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#5b6b7c">单机模式只用于功能验证；生产环境应使用纠删码模式或分布式集群。</text>
</svg>
