<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MinIO 分布式集群部署架构</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">MinIO 分布式集群部署架构</text>

  <rect x="40" y="100" width="150" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6fd0">应用 / S3 SDK</text>
  <text x="115" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">读写对象</text>

  <rect x="225" y="100" width="150" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="300" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6fd0">负载均衡 / 代理</text>
  <text x="300" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">:9000（可选）</text>

  <rect x="40" y="200" width="150" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="115" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#e08a1e">浏览器控制台</text>
  <text x="115" y="239" text-anchor="middle" font-size="11" fill="#5b6b7c">:9001</text>

  <rect x="450" y="60" width="420" height="250" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="660" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2b38">MinIO 集群：每个节点执行同一条启动命令</text>

  <rect x="470" y="100" width="380" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="486" y="120" font-size="12" font-weight="600" fill="#2f6fd0">节点 1　10.206.73.154</text>
  <text x="486" y="138" font-size="11" fill="#5b6b7c">/minio/data1　/minio/data2</text>

  <rect x="470" y="160" width="380" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="486" y="180" font-size="12" font-weight="600" fill="#2f6fd0">节点 2　10.206.73.155</text>
  <text x="486" y="198" font-size="11" fill="#5b6b7c">/minio/data1　/minio/data2</text>

  <rect x="470" y="220" width="380" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="486" y="240" font-size="12" font-weight="600" fill="#2f6fd0">节点 3　10.206.73.156</text>
  <text x="486" y="258" font-size="11" fill="#5b6b7c">/minio/data1　/minio/data2</text>

  <line x1="190" y1="125" x2="221" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="375" y1="125" x2="446" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="190" y1="225" x2="446" y2="225" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#5b6b7c">所有节点使用相同的 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD，且节点时间差须小于 3 秒（建议配置 NTP）。</text>
</svg>
