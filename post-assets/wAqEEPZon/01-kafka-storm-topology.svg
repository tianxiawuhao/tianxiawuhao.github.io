<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Kafka 与 Storm 集成的拓扑结构：从 Kafka 主题经 KafkaSpout 到 Bolt 再到偏移量提交</title>
  <rect width="900" height="600" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Kafka 与 Storm 集成的拓扑结构</text>

  <rect x="50" y="55" width="800" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="70" y="80" font-size="13" font-weight="700" fill="#1f2b38">Kafka 集群</text>
  <text x="70" y="100" font-size="11" fill="#5b6b7c">Broker 列表由 ZkHosts 从 ZooKeeper（brokerZkStr + brokerZkPath）动态读取</text>
  <rect x="80" y="112" width="160" height="30" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="131" text-anchor="middle" font-size="11" fill="#1f2b38">my-first-topic P0</text>
  <rect x="260" y="112" width="160" height="30" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="131" text-anchor="middle" font-size="11" fill="#1f2b38">my-first-topic P1</text>
  <rect x="440" y="112" width="160" height="30" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="520" y="131" text-anchor="middle" font-size="11" fill="#1f2b38">my-first-topic P2</text>

  <line x1="450" y1="155" x2="450" y2="189" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="650" y="177" text-anchor="middle" font-size="11" fill="#5b6b7c">按 offset 顺序拉取（pull）</text>

  <rect x="300" y="190" width="300" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">KafkaSpout（Spout，数据源）</text>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="#5b6b7c">由 SpoutConfig 提供配置：hosts / topic / zkRoot / id</text>

  <line x1="450" y1="260" x2="450" y2="299" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="650" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">emit 元组（Tuple）</text>

  <rect x="300" y="300" width="300" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">SplitBolt（分词）</text>
  <text x="450" y="348" text-anchor="middle" font-size="11" fill="#5b6b7c">IRichBolt：prepare / execute / cleanup / declare</text>

  <line x1="450" y1="370" x2="450" y2="409" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="650" y="394" text-anchor="middle" font-size="11" fill="#5b6b7c">shuffleGrouping 重分区</text>

  <rect x="300" y="410" width="300" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">CountBolt（计数）</text>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#5b6b7c">ack(input) 确认处理完成</text>

  <path d="M 600 445 L 800 445 L 800 315 L 604 315" fill="none" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="810" y="380" text-anchor="middle" font-size="11" fill="#1f2b38" transform="rotate(-90 810 380)">ack 回传确认</text>

  <rect x="40" y="500" width="820" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="524" font-size="12" font-weight="700" fill="#1f2b38">至少一次（at-least-once）语义</text>
  <text x="60" y="546" font-size="11" fill="#5b6b7c">Storm 保证每条元组都被完整处理：未被 ack 的元组会重放，代价是可能重复处理；处理逻辑需要幂等。</text>
  <text x="60" y="566" font-size="11" fill="#5b6b7c">storm-kafka 0.9.5 把消费偏移量保存在 ZooKeeper 的 zkRoot/id 下，提交是周期性的，失败时按 offset 重放。</text>
</svg>
