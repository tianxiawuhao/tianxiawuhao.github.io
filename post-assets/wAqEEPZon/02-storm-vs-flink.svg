<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Storm 与 Flink 流处理模型对照</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Storm 与 Flink 流处理模型对照</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#5b6b7c">两侧术语一一对应，但并行度、时间语义与一致性保证的实现方式不同</text>

  <rect x="40" y="62" width="400" height="336" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="90" font-size="14" font-weight="700" fill="#1f2b38">Apache Storm（本教程）</text>
  <rect x="60" y="104" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="76" y="121" font-size="11" fill="#1f2b38">运行单元</text>
  <text x="180" y="121" font-size="13" font-weight="700" fill="#1f2b38">Topology</text>
  <text x="76" y="137" font-size="11" fill="#5b6b7c">数据源 / 处理节点 / 分组方式</text>
  <rect x="60" y="154" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="76" y="171" font-size="11" fill="#1f2b38">数据源</text>
  <text x="180" y="171" font-size="13" font-weight="700" fill="#1f2b38">Spout</text>
  <text x="76" y="187" font-size="11" fill="#5b6b7c">KafkaSpout 从 Kafka 主题拉取元组</text>
  <rect x="60" y="204" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="76" y="221" font-size="11" fill="#1f2b38">处理节点</text>
  <text x="180" y="221" font-size="13" font-weight="700" fill="#1f2b38">Bolt</text>
  <text x="76" y="237" font-size="11" fill="#5b6b7c">IRichBolt 实现 execute 与 ack</text>
  <rect x="60" y="254" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="76" y="271" font-size="11" fill="#1f2b38">并行度</text>
  <text x="180" y="271" font-size="13" font-weight="700" fill="#1f2b38">executor / task</text>
  <text x="76" y="287" font-size="11" fill="#5b6b7c">setSpout / setBolt 的并行度提示</text>
  <rect x="60" y="304" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="76" y="321" font-size="11" fill="#1f2b38">一致性</text>
  <text x="180" y="321" font-size="13" font-weight="700" fill="#1f2b38">at-least-once</text>
  <text x="76" y="337" font-size="11" fill="#5b6b7c">ack / fail 重放，可能重复</text>
  <text x="60" y="368" font-size="11" fill="#5b6b7c">合流：shuffleGrouping / fieldsGrouping 等分组策略</text>
  <text x="60" y="386" font-size="11" fill="#5b6b7c">状态与偏移量：ZooKeeper（storm-kafka 0.9.x）</text>

  <rect x="460" y="62" width="400" height="336" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="480" y="90" font-size="14" font-weight="700" fill="#1f2b38">Apache Flink</text>
  <rect x="480" y="104" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="496" y="121" font-size="11" fill="#1f2b38">运行单元</text>
  <text x="600" y="121" font-size="13" font-weight="700" fill="#1f2b38">Job（DataStream 图）</text>
  <text x="496" y="137" font-size="11" fill="#5b6b7c">一条流上的转换与聚合</text>
  <rect x="480" y="154" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="496" y="171" font-size="11" fill="#1f2b38">数据源</text>
  <text x="600" y="171" font-size="13" font-weight="700" fill="#1f2b38">Source</text>
  <text x="496" y="187" font-size="11" fill="#5b6b7c">Kafka connector 从主题读取记录</text>
  <rect x="480" y="204" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="496" y="221" font-size="11" fill="#1f2b38">处理节点</text>
  <text x="600" y="221" font-size="13" font-weight="700" fill="#1f2b38">算子 Operator</text>
  <text x="496" y="237" font-size="11" fill="#5b6b7c">map / process / join / coGroup 等</text>
  <rect x="480" y="254" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="496" y="271" font-size="11" fill="#1f2b38">并行度</text>
  <text x="600" y="271" font-size="13" font-weight="700" fill="#1f2b38">parallelism</text>
  <text x="496" y="287" font-size="11" fill="#5b6b7c">setParallelism 按算子或全局设置</text>
  <rect x="480" y="304" width="360" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="496" y="321" font-size="11" fill="#1f2b38">一致性</text>
  <text x="600" y="321" font-size="13" font-weight="700" fill="#1f2b38">checkpoint</text>
  <text x="496" y="337" font-size="11" fill="#5b6b7c">可做到 exactly-once（两阶段提交）</text>
  <text x="480" y="368" font-size="11" fill="#5b6b7c">合流：union / connect / join / coGroup</text>
  <text x="480" y="386" font-size="11" fill="#5b6b7c">时间语义：事件时间 + Watermark 驱动</text>

  <rect x="40" y="410" width="820" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="437" font-size="11" fill="#1f2b38">共同点：都用有向无环图描述计算链路，都按 key 做分组、按分组维护状态；差异在于时间语义与一致性保证的落地方式。</text>
</svg>
