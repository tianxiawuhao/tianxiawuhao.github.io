<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四类窗口、状态分类与 Checkpoint 屏障</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">窗口类型、状态分类与 Checkpoint 屏障</text>

  <line x1="250" y1="75" x2="870" y2="75" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="79" font-size="12" fill="#1f2b38">滚动 Tumbling</text>
  <rect x="250" y="65" width="200" height="20" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="450" y="65" width="200" height="20" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="650" y="65" width="200" height="20" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="350" y="80" text-anchor="middle" font-size="11" fill="#2f6fd0">w1</text>
  <text x="550" y="80" text-anchor="middle" font-size="11" fill="#2f6fd0">w2</text>
  <text x="750" y="80" text-anchor="middle" font-size="11" fill="#2f6fd0">w3</text>

  <line x1="250" y1="140" x2="870" y2="140" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="144" font-size="12" fill="#1f2b38">滑动 Sliding</text>
  <rect x="250" y="118" width="200" height="10" rx="3" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="316" y="130" width="200" height="10" rx="3" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="382" y="142" width="200" height="10" rx="3" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#5b6b7c">长度 5 分钟、步长 1 分钟，窗口互相重叠</text>

  <line x1="250" y1="205" x2="870" y2="205" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="209" font-size="12" fill="#1f2b38">会话 Session</text>
  <rect x="250" y="195" width="120" height="20" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="390" y="195" width="180" height="20" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="590" y="195" width="150" height="20" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="370" y="230" text-anchor="middle" font-size="11" fill="#5b6b7c">活动间隙超时即关闭窗口</text>

  <line x1="250" y1="270" x2="870" y2="270" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="274" font-size="12" fill="#1f2b38">全局 Global</text>
  <rect x="250" y="260" width="490" height="20" rx="4" fill="#f7f9fc" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="495" y="275" text-anchor="middle" font-size="11" fill="#e08a1e">全部数据进同一个窗口，必须自定义触发器</text>
  <text x="495" y="298" text-anchor="middle" font-size="11" fill="#5b6b7c">keyBy 之后的窗口是「每个 key 一份」实例</text>

  <rect x="30" y="320" width="270" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">Keyed State</text>
  <text x="165" y="372" text-anchor="middle" font-size="11.5" fill="#1f2b38">ValueState / ListState / MapState</text>
  <text x="165" y="393" text-anchor="middle" font-size="11" fill="#5b6b7c">只能用于 keyBy 之后，按 key 隔离</text>

  <rect x="315" y="320" width="270" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">Operator State</text>
  <text x="450" y="372" text-anchor="middle" font-size="11.5" fill="#1f2b38">Kafka Source 的分区偏移量</text>
  <text x="450" y="393" text-anchor="middle" font-size="11" fill="#5b6b7c">按算子并行子任务分配</text>

  <line x1="625" y1="365" x2="600" y2="365" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="600" y="418" width="270" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="735" y="436" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2e9e5b">Checkpoint：注入屏障、上传状态快照</text>
  <text x="735" y="452" text-anchor="middle" font-size="11" fill="#5b6b7c">所有算子都完成，这次 Checkpoint 才算成功</text>

  <text x="240" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">间隔决定故障重算量，状态大小决定快照耗时</text>
  <text x="240" y="456" text-anchor="middle" font-size="11.5" fill="#5b6b7c">反压是自我保护，治理要找准根源算子</text>
</svg>
