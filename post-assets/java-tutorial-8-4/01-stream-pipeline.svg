<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 作业骨架与水位线推进</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Flink 作业骨架：Source → Transformation → Sink</text>

  <rect x="30" y="60" width="180" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Source</text>
  <text x="120" y="120" text-anchor="middle" font-size="11.5" fill="#1f2b38">Kafka / 文件 / Socket</text>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">长期运行，持续读入</text>

  <rect x="255" y="60" width="390" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Transformation（算子）</text>
  <text x="450" y="118" text-anchor="middle" font-size="11.5" fill="#1f2b38">keyBy → window → aggregate / reduce</text>
  <text x="450" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">默认有状态、并行执行，靠数据流传递记录</text>

  <rect x="690" y="60" width="180" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="780" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Sink</text>
  <text x="780" y="120" text-anchor="middle" font-size="11.5" fill="#1f2b38">Kafka / JDBC / 文件</text>
  <text x="780" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">端到端语义由它决定</text>

  <line x1="210" y1="105" x2="253" y2="105" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="645" y1="105" x2="688" y2="105" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="180" width="840" height="170" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="208" font-size="13" font-weight="700" fill="#1f2b38">事件时间线上的乱序记录与水位线（容忍乱序 5 秒）</text>
  <text x="60" y="228" font-size="11" fill="#5b6b7c">水位线含义：事件时间小于该值的记录应已全部到齐</text>

  <line x1="230" y1="265" x2="700" y2="265" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="230" y1="259" x2="230" y2="271" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="395" y1="259" x2="395" y2="271" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="560" y1="259" x2="560" y2="271" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="700" y1="259" x2="700" y2="271" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="288" text-anchor="middle" font-size="11" fill="#5b6b7c">10:00</text>
  <text x="395" y="288" text-anchor="middle" font-size="11" fill="#5b6b7c">10:01</text>
  <text x="560" y="288" text-anchor="middle" font-size="11" fill="#5b6b7c">10:02</text>
  <text x="682" y="288" text-anchor="middle" font-size="11" fill="#5b6b7c">事件时间</text>

  <circle cx="300" cy="265" r="5" fill="#2f6fd0"/>
  <circle cx="360" cy="265" r="5" fill="#2f6fd0"/>
  <circle cx="400" cy="265" r="5" fill="#2f6fd0"/>
  <circle cx="480" cy="265" r="5" fill="#2f6fd0"/>
  <circle cx="610" cy="265" r="5" fill="#2f6fd0"/>
  <circle cx="320" cy="283" r="4" fill="#e08a1e"/>
  <text x="320" y="300" text-anchor="middle" font-size="11" fill="#e08a1e">迟到的记录</text>

  <text x="242" y="248" font-size="11" fill="#2f6fd0">● 正常到达的记录</text>

  <line x1="450" y1="238" x2="450" y2="296" stroke="#7a5bd0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#7a5bd0">水位线 W1 到达，10:00–10:01 窗口触发并输出结果</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#5b6b7c">窗口由水位线推进触发；容忍时长越大结果越准、延迟越高，分区无数据时水位线会卡住</text>

  <text x="450" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">时间归属靠事件时间 + 水位线，跨事件记忆靠状态，状态不丢靠 Checkpoint</text>
  <text x="450" y="412" text-anchor="middle" font-size="11.5" fill="#5b6b7c">三种时间语义中只有事件时间可复现；全局 TimeCharacteristic 自 1.12 起废弃、1.14 移除</text>
</svg>
