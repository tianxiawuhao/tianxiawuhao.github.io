<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Vue 2 生命周期钩子的执行顺序与三个高频节点</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Vue 2 生命周期：八个钩子与三个高频节点</text>

  <rect x="50" y="80" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="135" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">beforeCreate</text>
  <text x="135" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">实例刚创建</text>
  <line x1="220" y1="115" x2="254" y2="115" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="260" y="80" width="170" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="345" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">created</text>
  <text x="345" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">已建实例，无 DOM</text>
  <line x1="430" y1="115" x2="464" y2="115" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="80" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="555" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">beforeMount</text>
  <text x="555" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">模板已编译</text>
  <line x1="640" y1="115" x2="674" y2="115" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="680" y="80" width="170" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="765" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">mounted</text>
  <text x="765" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">已挂载，可用 $refs</text>

  <text x="450" y="184" text-anchor="middle" font-size="11" fill="#5b6b7c">数据变化后进入更新流程</text>
  <path d="M 765 150 V 194 H 135 V 234" fill="none" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="50" y="240" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="135" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">beforeUpdate</text>
  <text x="135" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">数据变，DOM 未更新</text>
  <line x1="220" y1="275" x2="254" y2="275" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="260" y="240" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="345" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">updated</text>
  <text x="345" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">DOM 已更新</text>
  <line x1="430" y1="275" x2="464" y2="275" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="240" width="170" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="555" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">beforeDestroy</text>
  <text x="555" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">销毁前，清理副作用</text>
  <line x1="640" y1="275" x2="674" y2="275" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="680" y="240" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">destroyed</text>
  <text x="765" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">实例已销毁</text>

  <rect x="50" y="330" width="800" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="352" font-size="12" fill="#1f2b38">created：有 data/methods，拿不到 DOM，适合发初始请求　｜　mounted：模板已挂载，可访问 this.$refs</text>
  <text x="70" y="372" font-size="12" fill="#5b6b7c">beforeDestroy：销毁前清理定时器与全局事件　｜　DOM 更新是异步批量的，要等更新完成用 this.$nextTick()</text>
</svg>
