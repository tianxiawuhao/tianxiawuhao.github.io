<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>最大化偏差：取最大值的期望不小于期望的最大值</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">最大化偏差：取最大值会让估计系统性偏高</text>
  <rect x="40" y="55" width="390" height="250" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="82" font-size="13" font-weight="700" fill="#1f2b38">真实动作价值 x(a)</text>
  <line x1="60" y1="275" x2="410" y2="275" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="75" y="215" width="44" height="60" rx="8" fill="#2f6fd0"/>
  <rect x="145" y="165" width="44" height="110" rx="8" fill="#2f6fd0"/>
  <rect x="215" y="190" width="44" height="85" rx="8" fill="#2f6fd0"/>
  <rect x="285" y="145" width="44" height="130" rx="8" fill="#2e9e5b"/>
  <text x="97" y="205" text-anchor="middle" font-size="11" fill="#5b6b7c">0.6</text>
  <text x="167" y="155" text-anchor="middle" font-size="11" fill="#5b6b7c">1.1</text>
  <text x="237" y="180" text-anchor="middle" font-size="11" fill="#5b6b7c">0.85</text>
  <text x="307" y="135" text-anchor="middle" font-size="11" fill="#2e9e5b">1.3</text>
  <text x="97" y="292" text-anchor="middle" font-size="11" fill="#1f2b38">a1</text>
  <text x="167" y="292" text-anchor="middle" font-size="11" fill="#1f2b38">a2</text>
  <text x="237" y="292" text-anchor="middle" font-size="11" fill="#1f2b38">a3</text>
  <text x="307" y="292" text-anchor="middle" font-size="11" fill="#2e9e5b">a4</text>
  <rect x="470" y="55" width="390" height="250" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="490" y="82" font-size="13" font-weight="700" fill="#1f2b38">带噪声的估计 Q(a) = x(a) + 噪声</text>
  <line x1="490" y1="275" x2="840" y2="275" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="505" y="200" width="44" height="75" rx="8" fill="#2f6fd0"/>
  <rect x="575" y="180" width="44" height="95" rx="8" fill="#2f6fd0"/>
  <rect x="645" y="125" width="44" height="150" rx="8" fill="#e08a1e"/>
  <rect x="715" y="150" width="44" height="125" rx="8" fill="#2f6fd0"/>
  <text x="527" y="190" text-anchor="middle" font-size="11" fill="#5b6b7c">1.1</text>
  <text x="597" y="170" text-anchor="middle" font-size="11" fill="#5b6b7c">1.3</text>
  <text x="667" y="115" text-anchor="middle" font-size="11" fill="#e08a1e">1.8</text>
  <text x="737" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">1.6</text>
  <text x="527" y="292" text-anchor="middle" font-size="11" fill="#1f2b38">a1</text>
  <text x="597" y="292" text-anchor="middle" font-size="11" fill="#1f2b38">a2</text>
  <text x="667" y="292" text-anchor="middle" font-size="11" fill="#e08a1e">a3</text>
  <text x="737" y="292" text-anchor="middle" font-size="11" fill="#1f2b38">a4</text>
  <text x="60" y="335" font-size="13" fill="#1f2b38">噪声均值为 0 时 E[Q(a)] = x(a)：平均来看，估计并没有偏高。</text>
  <text x="60" y="362" font-size="12" fill="#5b6b7c">但取最大值只挑中上偏的噪声，于是 E[max Q] 不小于 max E[Q]，q = max Q(s,a;w) 系统性高估真实价值。</text>
</svg>
