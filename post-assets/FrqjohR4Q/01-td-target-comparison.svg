<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三种方法计算 TD Target 的对比</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">三种方法计算 TD Target 的对比</text>

  <rect x="30" y="55" width="260" height="295" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="30" y="55" width="260" height="36" rx="8" fill="#e08a1e"/>
  <text x="160" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">原始 DQN（自举）</text>
  <rect x="46" y="105" width="228" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">① 选择动作</text>
  <text x="160" y="149" text-anchor="middle" font-size="11" fill="#5b6b7c">a<tspan dy="-4">*</tspan><tspan dy="4">&#160;= argmax Q(s', a; w)</tspan></text>
  <line x1="160" y1="167" x2="160" y2="181" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="46" y="183" width="228" height="76" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">② 计算 TD target</text>
  <text x="160" y="231" text-anchor="middle" font-size="11" fill="#1f2b38">y = r + γ · max Q(s', a; w)</text>
  <rect x="46" y="275" width="228" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="160" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">高估最严重</text>

  <rect x="320" y="55" width="260" height="295" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="320" y="55" width="260" height="36" rx="8" fill="#2f6fd0"/>
  <text x="450" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">目标网络 Target Network</text>
  <rect x="336" y="105" width="228" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">① 选择动作</text>
  <text x="450" y="149" text-anchor="middle" font-size="11" fill="#5b6b7c">a<tspan dy="-4">*</tspan><tspan dy="4">&#160;= argmax Q(s', a; w−)</tspan></text>
  <line x1="450" y1="167" x2="450" y2="181" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="336" y="183" width="228" height="76" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">② 计算 TD target</text>
  <text x="450" y="231" text-anchor="middle" font-size="11" fill="#1f2b38">y = r + γ · max Q(s', a; w−)</text>
  <rect x="336" y="275" width="228" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">缓解高估，但未根除</text>

  <rect x="610" y="55" width="260" height="295" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="610" y="55" width="260" height="36" rx="8" fill="#2e9e5b"/>
  <text x="740" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">双 DQN（DDQN）</text>
  <rect x="626" y="105" width="228" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="740" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">① 用 DQN 选动作</text>
  <text x="740" y="149" text-anchor="middle" font-size="11" fill="#5b6b7c">a<tspan dy="-4">*</tspan><tspan dy="4">&#160;= argmax Q(s', a; w)</tspan></text>
  <line x1="740" y1="167" x2="740" y2="181" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="626" y="183" width="228" height="76" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">② 用目标网络算目标</text>
  <text x="740" y="231" text-anchor="middle" font-size="11" fill="#1f2b38">y = r + γ · Q(s', a<tspan dy="-4">*</tspan><tspan dy="4">; w−)</tspan></text>
  <rect x="626" y="275" width="228" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="740" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">更好地抑制高估</text>
</svg>
