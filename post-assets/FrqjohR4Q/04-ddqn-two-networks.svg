<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>DDQN 用两个网络分离选动作与算目标</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">DDQN：用两个网络把“选动作”和“算目标”分开</text>
  <rect x="40" y="50" width="820" height="115" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="74" font-size="13" font-weight="700" fill="#1f2b38">同一个网络（传统 DQN / 仅目标网络）</text>
  <rect x="60" y="86" width="340" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">选动作：a* = argmax Q(s,a;w)</text>
  <line x1="408" y1="108" x2="452" y2="108" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="460" y="86" width="380" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="650" y="113" text-anchor="middle" font-size="12" fill="#1f2b38">算目标：y = r + γ · Q(s,a*;w)</text>
  <text x="60" y="155" font-size="12" fill="#5b6b7c">两步共用一套参数，最大化造成的正偏差原封不动地写进 TD target。</text>
  <rect x="40" y="180" width="820" height="115" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="204" font-size="13" font-weight="700" fill="#1f2b38">两个网络（DDQN）</text>
  <rect x="60" y="216" width="340" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="243" text-anchor="middle" font-size="12" fill="#1f2b38">选动作：a* = argmax Q(s,a;w)（DQN）</text>
  <line x1="408" y1="238" x2="452" y2="238" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="460" y="216" width="380" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="650" y="243" text-anchor="middle" font-size="12" fill="#1f2b38">算目标：y = r + γ · Q(s,a*;w′)（目标网络）</text>
  <text x="60" y="285" font-size="12" fill="#5b6b7c">选动作与算目标彻底分开，目标值只反映目标网络在 a* 上的估值。</text>
  <rect x="40" y="310" width="820" height="65" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">max Q(s,a;w) ≥ Q(s,a*;w′)</text>
  <text x="450" y="362" text-anchor="middle" font-size="12" fill="#5b6b7c">DDQN 的 TD target 不会大于传统 DQN，从源头抑制高估。</text>
</svg>
