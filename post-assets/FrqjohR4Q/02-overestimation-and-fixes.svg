<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>高估的成因与两种缓解方法</title>
  <rect width="900" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">高估的成因与两种缓解方法</text>
  <text x="40" y="58" font-size="13" font-weight="700" fill="#1f2b38">高估如何产生并被放大</text>

  <rect x="40" y="70" width="250" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="165" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">① TD target 里取最大化</text>
  <text x="165" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">max 容易挑中偏高的估计</text>
  <line x1="292" y1="108" x2="320" y2="108" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="325" y="70" width="250" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">② TD target 偏高</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">y 大于真实动作价值</text>
  <line x1="577" y1="108" x2="605" y2="108" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="610" y="70" width="250" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="735" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">③ 参数 w 被更新得偏高</text>
  <text x="735" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">高估写进网络参数</text>

  <path d="M 735 146 L 735 200 L 165 200 L 165 150" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="285" y="176" width="330" height="24" fill="#ffffff"/>
  <text x="450" y="193" text-anchor="middle" font-size="12" fill="#5b6b7c">④ 自举：偏高的估计又拿去更新自己</text>

  <text x="40" y="247" font-size="13" font-weight="700" fill="#1f2b38">用目标网络或双 DQN 打断这个循环</text>

  <rect x="40" y="262" width="400" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">目标网络（Target Network）</text>
  <text x="240" y="318" text-anchor="middle" font-size="11" fill="#1f2b38">计算 TD target 改用 Q(s, a; w−)</text>
  <text x="240" y="342" text-anchor="middle" font-size="11" fill="#5b6b7c">只对 w 做梯度下降，w− 定期从 w 同步</text>

  <rect x="460" y="262" width="400" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">双 DQN（DDQN）</text>
  <text x="660" y="318" text-anchor="middle" font-size="11" fill="#1f2b38">选动作：a* = argmax Q(s, a; w)</text>
  <text x="660" y="342" text-anchor="middle" font-size="11" fill="#5b6b7c">算目标：y = r + γ · Q(s, a*; w−)</text>
</svg>
