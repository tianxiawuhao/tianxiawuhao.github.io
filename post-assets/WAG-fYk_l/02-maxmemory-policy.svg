<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Redis 内存淘汰策略分类</title>
  <rect width="900" height="424" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Redis 内存淘汰策略分类（maxmemory-policy）</text>

  <rect x="30" y="58" width="840" height="138" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="84" font-size="13" font-weight="700" fill="#2f6fd0">allkeys-*：从全部键中淘汰</text>
  <rect x="50" y="100" width="253" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="176" y="126" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">allkeys-lru</text>
  <text x="176" y="150" font-size="11" fill="#5b6b7c" text-anchor="middle">淘汰最近最少使用的键</text>
  <text x="176" y="170" font-size="11" fill="#e08a1e" text-anchor="middle">（最常用）</text>
  <rect x="323" y="100" width="253" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="449" y="126" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">allkeys-lfu</text>
  <text x="449" y="150" font-size="11" fill="#5b6b7c" text-anchor="middle">淘汰使用频率最低的键</text>
  <text x="449" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">（Redis 4.0 起支持）</text>
  <rect x="596" y="100" width="253" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="722" y="126" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">allkeys-random</text>
  <text x="722" y="150" font-size="11" fill="#5b6b7c" text-anchor="middle">随机淘汰任意键</text>

  <rect x="30" y="208" width="840" height="138" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="234" font-size="13" font-weight="700" fill="#7a5bd0">volatile-*：只淘汰设置了过期时间的键</text>
  <rect x="50" y="250" width="185" height="78" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="142" y="276" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">volatile-lru</text>
  <text x="142" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">淘汰最近最少</text>
  <text x="142" y="320" font-size="11" fill="#5b6b7c" text-anchor="middle">使用的键</text>
  <rect x="255" y="250" width="185" height="78" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="347" y="276" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">volatile-lfu</text>
  <text x="347" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">淘汰使用频率</text>
  <text x="347" y="320" font-size="11" fill="#5b6b7c" text-anchor="middle">最低的键</text>
  <rect x="460" y="250" width="185" height="78" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="552" y="276" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">volatile-ttl</text>
  <text x="552" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">优先淘汰更早</text>
  <text x="552" y="320" font-size="11" fill="#5b6b7c" text-anchor="middle">过期的键</text>
  <rect x="665" y="250" width="185" height="78" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="757" y="276" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">volatile-random</text>
  <text x="757" y="300" font-size="11" fill="#5b6b7c" text-anchor="middle">随机淘汰任意键</text>

  <rect x="30" y="356" width="840" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="50" y="383" font-size="12" fill="#1f2b38">noeviction（默认）：不淘汰任何键，内存不足时写命令直接报错，读命令不受影响</text>
</svg>
