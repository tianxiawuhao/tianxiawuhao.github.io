<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Redis 三种过期键删除策略对比</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Redis 三种过期键删除策略对比</text>

  <rect x="30" y="60" width="250" height="215" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="155" y="90" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">定时过期</text>
  <text x="48" y="122" font-size="11.5" fill="#5b6b7c">为每个键创建定时器</text>
  <text x="48" y="144" font-size="11.5" fill="#5b6b7c">到期立即清除</text>
  <line x1="48" y1="164" x2="262" y2="164" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="48" y="188" font-size="11.5" fill="#2e9e5b">优：内存最友好</text>
  <text x="48" y="212" font-size="11.5" fill="#e08a1e">缺：CPU 开销大</text>
  <text x="48" y="234" font-size="11.5" fill="#e08a1e">影响响应时间和吞吐</text>

  <rect x="325" y="60" width="250" height="215" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="90" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">惰性过期</text>
  <text x="343" y="122" font-size="11.5" fill="#5b6b7c">只在访问 key 时判断</text>
  <text x="343" y="144" font-size="11.5" fill="#5b6b7c">已过期则立即删除</text>
  <line x1="343" y1="164" x2="557" y2="164" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="343" y="188" font-size="11.5" fill="#2e9e5b">优：最省 CPU</text>
  <text x="343" y="212" font-size="11.5" fill="#e08a1e">缺：过期键长期</text>
  <text x="343" y="234" font-size="11.5" fill="#e08a1e">占用内存不释放</text>

  <rect x="620" y="60" width="250" height="215" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="745" y="90" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">定期过期</text>
  <text x="638" y="122" font-size="11.5" fill="#5b6b7c">每隔一段时间扫描</text>
  <text x="638" y="144" font-size="11.5" fill="#5b6b7c">从 expires 字典抽查</text>
  <line x1="638" y1="164" x2="852" y2="164" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="638" y="188" font-size="11.5" fill="#2e9e5b">优：CPU 与内存折中</text>
  <text x="638" y="212" font-size="11.5" fill="#e08a1e">缺：删除存在延迟</text>

  <rect x="30" y="295" width="840" height="65" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="50" y="322" font-size="13" font-weight="700" fill="#1f2b38">Redis 实际同时使用：惰性过期 + 定期过期</text>
  <text x="50" y="344" font-size="11.5" fill="#5b6b7c">默认每秒 10 次，每次从 expires 字典随机抽查 20 个键；若过期键比例超过 25% 则继续抽查</text>
</svg>
