<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ByteBuffer 的 position、limit、capacity 状态流转</title>
  <rect width="900" height="350" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ByteBuffer 的 position / limit / capacity 状态流转</text>

  <rect x="30" y="100" width="240" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">① 写模式（put 之后）</text>
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#1f2b38">position = 已写入字节数</text>
  <text x="150" y="194" text-anchor="middle" font-size="12" fill="#1f2b38">limit = capacity</text>
  <text x="150" y="222" text-anchor="middle" font-size="12" fill="#5b6b7c">capacity = 1024（固定）</text>

  <rect x="330" y="100" width="240" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">② 读模式（flip 之后）</text>
  <text x="450" y="166" text-anchor="middle" font-size="12" fill="#1f2b38">position = 已读取字节数</text>
  <text x="450" y="194" text-anchor="middle" font-size="12" fill="#1f2b38">limit = 已写入字节数</text>
  <text x="450" y="222" text-anchor="middle" font-size="12" fill="#5b6b7c">capacity = 1024（固定）</text>

  <rect x="630" y="100" width="240" height="150" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="750" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">③ 复位</text>
  <text x="750" y="166" text-anchor="middle" font-size="12" fill="#1f2b38">clear()：position=0，</text>
  <text x="750" y="194" text-anchor="middle" font-size="12" fill="#1f2b38">limit=capacity</text>
  <text x="750" y="222" text-anchor="middle" font-size="12" fill="#1f2b38">rewind()：只把 position 归 0</text>

  <line x1="272" y1="175" x2="322" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="297" y="166" text-anchor="middle" font-size="11" fill="#5b6b7c">flip()</text>
  <line x1="572" y1="175" x2="622" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="597" y="166" text-anchor="middle" font-size="11" fill="#5b6b7c">clear()</text>

  <path d="M 750 250 L 750 300 L 150 300 L 150 254" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">继续 put 写入，再 flip() 读</text>
</svg>
