<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>NIO 三大核心组件与数据流向</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">NIO 三大核心组件与数据流向</text>

  <rect x="40" y="80" width="160" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="120" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">应用程序</text>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">Java 代码</text>

  <rect x="250" y="80" width="170" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="335" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Buffer 缓冲区</text>
  <text x="335" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">负责存储数据</text>

  <rect x="470" y="80" width="180" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="560" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Channel 通道</text>
  <text x="560" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">负责传输数据</text>

  <rect x="700" y="80" width="160" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="780" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">IO 设备</text>
  <text x="780" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">文件 / 套接字</text>

  <line x1="202" y1="106" x2="246" y2="106" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="246" y1="130" x2="202" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="422" y1="106" x2="466" y2="106" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="466" y1="130" x2="422" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="652" y1="106" x2="696" y2="106" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="696" y1="130" x2="652" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="360" y="250" width="260" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="490" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Selector 选择器</text>
  <text x="490" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">一个线程监听多个 Channel 的事件</text>
  <line x1="560" y1="248" x2="560" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="574" y="212" font-size="11" fill="#5b6b7c">注册 OP_READ / OP_WRITE</text>
  <text x="450" y="358" text-anchor="middle" font-size="11" fill="#5b6b7c">Stream 面向流、单向读写；Channel 面向缓冲区、可双向传输，两者都必须配合 Buffer</text>
</svg>
