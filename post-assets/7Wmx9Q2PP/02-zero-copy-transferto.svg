<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>传统 IO 与 transferTo 零拷贝的数据拷贝次数对比</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">传统 IO 拷贝 vs transferTo 零拷贝</text>

  <rect x="30" y="55" width="840" height="130" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">传统方式：read() + write()</text>

  <rect x="35" y="95" width="130" height="55" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="100" y="128" text-anchor="middle" font-size="12" fill="#1f2b38">磁盘文件</text>
  <rect x="210" y="95" width="130" height="55" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="275" y="128" text-anchor="middle" font-size="12" fill="#1f2b38">内核缓冲区</text>
  <rect x="385" y="95" width="130" height="55" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="128" text-anchor="middle" font-size="12" fill="#1f2b38">用户缓冲区</text>
  <rect x="560" y="95" width="130" height="55" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="625" y="128" text-anchor="middle" font-size="12" fill="#1f2b38">socket 缓冲区</text>
  <rect x="735" y="95" width="130" height="55" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="800" y="128" text-anchor="middle" font-size="12" fill="#1f2b38">网卡</text>

  <line x1="167" y1="123" x2="206" y2="123" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="187" y="113" text-anchor="middle" font-size="11" fill="#5b6b7c">DMA</text>
  <line x1="342" y1="123" x2="381" y2="123" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="362" y="113" text-anchor="middle" font-size="11" fill="#5b6b7c">拷贝</text>
  <line x1="517" y1="123" x2="556" y2="123" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="537" y="113" text-anchor="middle" font-size="11" fill="#5b6b7c">拷贝</text>
  <line x1="692" y1="123" x2="731" y2="123" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="712" y="113" text-anchor="middle" font-size="11" fill="#5b6b7c">DMA</text>

  <text x="450" y="172" text-anchor="middle" font-size="12" fill="#1f2b38">4 次数据拷贝（2 次 DMA + 2 次 CPU 拷贝）、4 次用户态/内核态上下文切换</text>

  <rect x="30" y="205" width="840" height="145" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">零拷贝：transferTo() / transferFrom()（Linux 上通常由 sendfile 实现）</text>

  <rect x="90" y="245" width="180" height="55" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#1f2b38">磁盘文件</text>
  <rect x="360" y="245" width="180" height="55" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="278" text-anchor="middle" font-size="12" fill="#1f2b38">内核缓冲区</text>
  <rect x="630" y="245" width="180" height="55" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="720" y="278" text-anchor="middle" font-size="12" fill="#1f2b38">网卡</text>

  <line x1="272" y1="272" x2="356" y2="272" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="314" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">DMA 拷贝</text>
  <line x1="542" y1="272" x2="626" y2="272" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="584" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">SG-DMA 拷贝</text>

  <text x="450" y="322" text-anchor="middle" font-size="12" fill="#1f2b38">2 次数据拷贝、2 次上下文切换：数据不再经过用户空间</text>
  <text x="450" y="342" text-anchor="middle" font-size="12" fill="#5b6b7c">具体次数取决于操作系统与 JDK 实现；SG-DMA 只把缓冲区描述符传给网卡</text>
</svg>
