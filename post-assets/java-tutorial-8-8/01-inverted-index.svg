<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>正排索引与倒排索引的对比：文档到词，以及词到文档列表</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">从正排到倒排：把「文档 → 词」翻转成「词 → 文档列表」</text>

  <rect x="40" y="70" width="270" height="270" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="96" font-size="12.5" font-weight="700" fill="#1f2b38">正排：按文档存（MySQL 索引）</text>
  <rect x="56" y="110" width="238" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="132" font-size="12" font-weight="700" fill="#1f2b38">doc1</text>
  <text x="70" y="152" font-size="11" fill="#5b6b7c">Spring 实战 分布式搜索</text>
  <rect x="56" y="182" width="238" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="204" font-size="12" font-weight="700" fill="#1f2b38">doc2</text>
  <text x="70" y="224" font-size="11" fill="#5b6b7c">Elasticsearch 入门 分布式</text>
  <rect x="56" y="254" width="238" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="276" font-size="12" font-weight="700" fill="#1f2b38">doc3</text>
  <text x="70" y="296" font-size="11" fill="#5b6b7c">Kafka 实战 消息队列</text>

  <line x1="314" y1="200" x2="372" y2="200" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="343" y="190" text-anchor="middle" font-size="11" fill="#5b6b7c">分词后</text>
  <text x="343" y="220" text-anchor="middle" font-size="11" fill="#5b6b7c">翻转方向</text>

  <rect x="380" y="70" width="480" height="270" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="396" y="96" font-size="12.5" font-weight="700" fill="#1f2b38">倒排：按词存（term dictionary + posting list）</text>
  <rect x="396" y="116" width="150" height="36" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="471" y="139" text-anchor="middle" font-size="11.5" fill="#1f2b38">spring</text>
  <text x="566" y="139" font-size="11.5" fill="#5b6b7c">→ doc1</text>
  <rect x="396" y="160" width="150" height="36" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="471" y="183" text-anchor="middle" font-size="11.5" fill="#1f2b38">分布式</text>
  <text x="566" y="183" font-size="11.5" fill="#5b6b7c">→ doc1, doc2</text>
  <rect x="396" y="204" width="150" height="36" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="471" y="227" text-anchor="middle" font-size="11.5" fill="#1f2b38">实战</text>
  <text x="566" y="227" font-size="11.5" fill="#5b6b7c">→ doc1, doc3</text>
  <rect x="396" y="248" width="150" height="36" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="471" y="271" text-anchor="middle" font-size="11.5" fill="#1f2b38">kafka</text>
  <text x="566" y="271" font-size="11.5" fill="#5b6b7c">→ doc3</text>
  <text x="396" y="310" font-size="11" fill="#5b6b7c">posting list 里还带词频与位置，供 BM25 打分与短语匹配使用</text>

  <text x="40" y="372" font-size="12" fill="#1f2b38">搜得准不准取决于分词，搜得快不快取决于词表与 posting list 的组织方式。</text>
</svg>
