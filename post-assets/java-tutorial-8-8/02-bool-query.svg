<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>bool 查询的结构：must 打分、filter 过滤、must_not 排除、should 加分</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">bool 查询：打分条件进 must，精确过滤进 filter</text>

  <rect x="36" y="176" width="96" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="84" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">客户端</text>
  <text x="84" y="218" text-anchor="middle" font-size="11" fill="#5b6b7c">查询 DSL</text>
  <line x1="132" y1="204" x2="172" y2="204" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="176" y="74" width="440" height="280" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="196" y="100" font-size="12.5" font-weight="700" fill="#1f2b38">bool 查询：四类子句并列</text>

  <rect x="192" y="112" width="408" height="46" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="206" y="132" font-size="12" fill="#1f2b38">must：参与 BM25 打分</text>
  <text x="206" y="150" font-size="11" fill="#5b6b7c">match name = “spring 实战”</text>

  <rect x="192" y="166" width="408" height="46" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="206" y="186" font-size="12" fill="#1f2b38">filter：只判断是／否，不打分（可缓存）</text>
  <text x="206" y="204" font-size="11" fill="#5b6b7c">term studymodel=201001 ／ range price 50–200</text>

  <rect x="192" y="220" width="408" height="46" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="206" y="240" font-size="12" fill="#1f2b38">must_not：排除命中的文档</text>
  <text x="206" y="258" font-size="11" fill="#5b6b7c">term status = deleted</text>

  <rect x="192" y="274" width="408" height="46" rx="6" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.2"/>
  <text x="206" y="294" font-size="12" fill="#1f2b38">should：命中则加分</text>
  <text x="206" y="312" font-size="11" fill="#5b6b7c">match_phrase 分布式搜索</text>

  <line x1="616" y1="204" x2="642" y2="204" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="646" y="74" width="218" height="280" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="100" font-size="12.5" font-weight="700" fill="#1f2b38">返回结果</text>
  <rect x="660" y="112" width="190" height="48" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="755" y="134" text-anchor="middle" font-size="11.5" fill="#1f2b38">hits</text>
  <text x="755" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">_source 精简、highlight</text>
  <rect x="660" y="170" width="190" height="48" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="755" y="192" text-anchor="middle" font-size="11.5" fill="#1f2b38">sort 覆盖 _score</text>
  <text x="755" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">深分页用 search_after</text>
  <rect x="660" y="228" width="190" height="48" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="755" y="250" text-anchor="middle" font-size="11.5" fill="#1f2b38">aggs 聚合</text>
  <text x="755" y="268" text-anchor="middle" font-size="11" fill="#5b6b7c">size:0 关掉 hits</text>
  <rect x="660" y="286" width="190" height="48" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="755" y="308" text-anchor="middle" font-size="11.5" fill="#1f2b38">track_total_hits</text>
  <text x="755" y="326" text-anchor="middle" font-size="11" fill="#5b6b7c">hits.total 是对象</text>

  <text x="40" y="396" font-size="12" fill="#1f2b38">能用 filter 的精确条件不要放进 must；显式指定 sort 后 _score 通常为 null。</text>
</svg>
