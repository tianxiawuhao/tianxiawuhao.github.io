<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>RestTemplate 常用方法按 HTTP 方法分类</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">RestTemplate：11 个独立方法，共 36 个重载</text>

  <rect x="20" y="50" width="860" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">按 HTTP 方法分组：GET/HEAD、POST、PUT/DELETE、OPTIONS，以及可执行任意方法的 exchange/execute</text>

  <rect x="20" y="112" width="156" height="140" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="98" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6fd0">GET / HEAD</text>
  <text x="32" y="170" font-size="11.5" fill="#1f2b38">getForEntity</text>
  <text x="32" y="196" font-size="11.5" fill="#1f2b38">getForObject</text>
  <text x="32" y="222" font-size="11.5" fill="#1f2b38">headForHeaders</text>

  <rect x="196" y="112" width="156" height="140" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="274" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e9e5b">POST</text>
  <text x="208" y="170" font-size="11.5" fill="#1f2b38">postForEntity</text>
  <text x="208" y="196" font-size="11.5" fill="#1f2b38">postForObject</text>
  <text x="208" y="222" font-size="11.5" fill="#1f2b38">postForLocation</text>

  <rect x="372" y="112" width="156" height="140" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e08a1e">PUT / DELETE</text>
  <text x="384" y="170" font-size="11.5" fill="#1f2b38">put</text>
  <text x="384" y="196" font-size="11.5" fill="#1f2b38">delete</text>

  <rect x="548" y="112" width="156" height="140" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="626" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5bd0">OPTIONS</text>
  <text x="560" y="170" font-size="11.5" fill="#1f2b38">optionsForAllow</text>

  <rect x="724" y="112" width="156" height="140" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="802" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b6b7c">任意方法</text>
  <text x="736" y="170" font-size="11.5" fill="#1f2b38">exchange</text>
  <text x="736" y="196" font-size="11.5" fill="#1f2b38">execute</text>

  <text x="450" y="288" text-anchor="middle" font-size="11.5" fill="#5b6b7c">十个方法各有 3 种重载形式，第 11 个方法重载 6 次；URL 参数可用占位符 {1} 或 Map 传入</text>
</svg>
