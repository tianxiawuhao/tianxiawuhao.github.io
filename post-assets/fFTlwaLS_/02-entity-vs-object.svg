<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Entity 系列与 Object 系列取返回值的差别</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Entity 系列与 Object 系列：返回值不同，取数据方式也不同</text>

  <rect x="30" y="70" width="230" height="84" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">getForEntity</text>
  <text x="145" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">postForEntity</text>
  <line x1="262" y1="112" x2="296" y2="112" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="70" width="280" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="440" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ResponseEntity&lt;T&gt;</text>
  <text x="440" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">含状态码、响应头、响应体</text>
  <line x1="582" y1="112" x2="616" y2="112" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="620" y="70" width="250" height="84" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="745" y="104" text-anchor="middle" font-size="12.5" fill="#1f2b38">需再调用 getBody()</text>
  <text x="745" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">才能取出目标对象</text>

  <rect x="30" y="176" width="230" height="84" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="145" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">getForObject</text>
  <text x="145" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">postForObject</text>
  <line x1="262" y1="218" x2="296" y2="218" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="176" width="280" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="440" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">T（反序列化后的对象）</text>
  <text x="440" y="232" text-anchor="middle" font-size="11" fill="#5b6b7c">响应体直接映射为对象</text>
  <line x1="582" y1="218" x2="616" y2="218" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="620" y="176" width="250" height="84" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="745" y="210" text-anchor="middle" font-size="12.5" fill="#1f2b38">直接拿到对象</text>
  <text x="745" y="232" text-anchor="middle" font-size="11" fill="#5b6b7c">无需调用 getBody()</text>

  <rect x="30" y="282" width="230" height="84" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="145" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5bd0">exchange / execute</text>
  <line x1="262" y1="324" x2="296" y2="324" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="282" width="280" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="440" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">可指定任意 HTTP 方法</text>
  <text x="440" y="338" text-anchor="middle" font-size="11" fill="#5b6b7c">支持泛型：ParameterizedTypeReference</text>
  <line x1="582" y1="324" x2="616" y2="324" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="620" y="282" width="250" height="84" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="745" y="316" text-anchor="middle" font-size="12.5" fill="#1f2b38">返回 ResponseEntity&lt;T&gt;</text>
  <text x="745" y="338" text-anchor="middle" font-size="11" fill="#5b6b7c">或直接返回映射对象</text>
</svg>
