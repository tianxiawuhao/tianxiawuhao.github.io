<svg xmlns="http://www.w3.org/2000/svg" width="900" height="516" viewBox="0 0 900 516" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="516" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">静态代码块 / 非静态代码块 / 构造函数的执行顺序</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#5b6b7c">示例：class ClassB extends ClassA，main 中连续 new ClassB() 两次</text>

  <text x="25" y="81" font-size="13" font-weight="700" fill="#2f6fd0">类加载阶段：只执行一次</text>
  <line x1="45" y1="132" x2="230" y2="132" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="250" y1="132" x2="435" y2="132" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="455" y1="132" x2="640" y2="132" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="660" y1="132" x2="845" y2="132" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="45" cy="132" r="5" fill="#2f6fd0"/>
  <circle cx="250" cy="132" r="5" fill="#2f6fd0"/>
  <circle cx="455" cy="132" r="5" fill="#2f6fd0"/>
  <circle cx="660" cy="132" r="5" fill="#2f6fd0"/>
  <text x="45" y="115" text-anchor="middle" font-size="12" fill="#1f2b38">① 父类静态块</text>
  <text x="250" y="115" text-anchor="middle" font-size="12" fill="#1f2b38">② 父类静态块</text>
  <text x="455" y="115" text-anchor="middle" font-size="12" fill="#1f2b38">③ 子类静态块</text>
  <text x="660" y="115" text-anchor="middle" font-size="12" fill="#1f2b38">④ 子类静态块</text>
  <text x="45" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">按源码顺序</text>
  <text x="250" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">按源码顺序</text>
  <text x="455" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">按源码顺序</text>
  <text x="660" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">按源码顺序</text>
  <text x="25" y="176" font-size="12" fill="#1f2b38">输出：父类静态代码块 1 → 父类静态代码块 2 → 子类静态代码块 2 → 子类静态代码块 1（父类优先，且只此一次）</text>

  <line x1="25" y1="190" x2="875" y2="190" stroke="#c8d3e0" stroke-width="1"/>

  <text x="25" y="213" font-size="13" font-weight="700" fill="#e08a1e">实例化阶段：每 new 一次就重复一遍</text>

  <text x="200" y="237" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">第 1 次 new ClassB()</text>
  <rect x="30" y="248" width="340" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="200" y="270" text-anchor="middle" font-size="12" fill="#1f2b38">父类非静态代码块 1 → 父类非静态代码块 2</text>
  <line x1="200" y1="282" x2="200" y2="299" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="30" y="301" width="340" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="200" y="323" text-anchor="middle" font-size="12" fill="#1f2b38">父类构造函数</text>
  <line x1="200" y1="335" x2="200" y2="352" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="30" y="354" width="340" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="200" y="376" text-anchor="middle" font-size="12" fill="#1f2b38">子类非静态代码块 2 → 子类非静态代码块 1</text>
  <line x1="200" y1="388" x2="200" y2="405" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="30" y="407" width="340" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="200" y="429" text-anchor="middle" font-size="12" fill="#1f2b38">子类构造函数</text>

  <text x="570" y="237" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">第 2 次 new ClassB()</text>
  <rect x="400" y="256" width="340" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="570" y="278" text-anchor="middle" font-size="12" fill="#1f2b38">父类非静态块 → 父类构造函数</text>
  <line x1="570" y1="290" x2="570" y2="309" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="400" y="311" width="340" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="570" y="333" text-anchor="middle" font-size="12" fill="#1f2b38">子类非静态块 → 子类构造函数</text>
  <text x="570" y="372" text-anchor="middle" font-size="11.5" fill="#5b6b7c">静态代码块不再执行，</text>
  <text x="570" y="390" text-anchor="middle" font-size="11.5" fill="#5b6b7c">实例化阶段完整重复一遍</text>

  <line x1="390" y1="248" x2="390" y2="441" stroke="#c8d3e0" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="25" y="458" width="850" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="45" y="484" font-size="12.5" fill="#1f2b38">顺序口诀：父静态 → 子静态 →（每次 new：父非静态 → 父构造 → 子非静态 → 子构造）；同类多个代码块按源码先后。</text>
</svg>
