<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>传统请求与 Ajax 的页面更新方式对比</title>
  <rect width="900" height="370" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">传统请求 vs Ajax：页面更新方式对比</text>

  <text x="30" y="84" font-size="12" fill="#5b6b7c">传统：提交 — 跳转 — 整页重渲染</text>
  <rect x="30" y="94" width="170" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="119" text-anchor="middle" font-size="13" fill="#1f2b38">浏览器页面</text>
  <text x="115" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">（表单提交）</text>
  <line x1="200" y1="126" x2="286" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="243" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">整页请求</text>
  <rect x="290" y="94" width="180" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="380" y="119" text-anchor="middle" font-size="13" fill="#1f2b38">服务器</text>
  <text x="380" y="139" text-anchor="middle" font-size="11" fill="#5b6b7c">返回完整 HTML</text>
  <line x1="470" y1="126" x2="556" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="513" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">替换整个文档</text>
  <rect x="560" y="94" width="310" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="578" y="119" font-size="12" fill="#1f2b38">整页重绘：白屏闪烁、上下文丢失</text>
  <text x="578" y="139" font-size="12" fill="#5b6b7c">导航栏、页脚、CSS 重复传输</text>

  <text x="30" y="194" font-size="12" fill="#5b6b7c">Ajax：用 JavaScript 发请求，只更新一小块</text>
  <rect x="30" y="204" width="170" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="229" text-anchor="middle" font-size="13" fill="#1f2b38">浏览器页面 JS</text>
  <text x="115" y="249" text-anchor="middle" font-size="11" fill="#5b6b7c">（XHR / fetch）</text>
  <line x1="200" y1="236" x2="286" y2="236" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="243" y="228" text-anchor="middle" font-size="11" fill="#5b6b7c">异步请求</text>
  <rect x="290" y="204" width="180" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="380" y="229" text-anchor="middle" font-size="13" fill="#1f2b38">服务器</text>
  <text x="380" y="249" text-anchor="middle" font-size="11" fill="#5b6b7c">只返回数据 JSON</text>
  <line x1="470" y1="236" x2="556" y2="236" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="513" y="228" text-anchor="middle" font-size="11" fill="#5b6b7c">交给回调函数</text>
  <rect x="560" y="204" width="310" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="578" y="229" font-size="12" fill="#1f2b38">局部更新：地址栏不动、页面不闪</text>
  <text x="578" y="249" font-size="12" fill="#5b6b7c">回调只改目标 DOM 节点</text>

  <rect x="30" y="298" width="840" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="327" font-size="12" fill="#5b6b7c">三个角色：请求由 XMLHttpRequest 发出 → 服务器处理并返回数据 → 回调函数决定数据落到哪个 DOM 节点</text>
</svg>
