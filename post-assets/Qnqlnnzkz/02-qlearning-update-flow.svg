<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Q-Learning 的更新流程：表格版与 DQN 版</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Q-Learning 的更新流程（表格版与 DQN 版）</text>

  <rect x="30" y="60" width="240" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">① 观测一个 transition</text>
  <text x="150" y="118" text-anchor="middle" font-size="12" fill="#5b6b7c">（s_t, a_t, r_t, s_{t+1}）</text>

  <line x1="274" y1="100" x2="326" y2="100" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="330" y="60" width="240" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">② 计算 TD Target</text>
  <text x="450" y="118" text-anchor="middle" font-size="11.5" fill="#5b6b7c">y_t = r_t + γ · max_a Q(s_{t+1}, a)</text>

  <line x1="574" y1="100" x2="626" y2="100" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="630" y="60" width="240" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="750" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">③ 计算 TD error</text>
  <text x="750" y="118" text-anchor="middle" font-size="11.5" fill="#5b6b7c">δ_t = Q(s_t, a_t) − y_t</text>

  <path d="M 750 140 L 750 170 L 225 170" fill="none" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="225" y1="170" x2="225" y2="194" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="675" y1="170" x2="675" y2="194" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="200" width="330" height="95" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="225" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">④ 表格版：更新 Q 表</text>
  <text x="225" y="256" text-anchor="middle" font-size="11.5" fill="#1f2b38">Q(s_t, a_t) ← Q(s_t, a_t) − α · δ_t</text>
  <text x="225" y="280" text-anchor="middle" font-size="11" fill="#5b6b7c">Q 是一张 |S| × |A| 的表，学习率 α &gt; 0</text>

  <rect x="510" y="200" width="330" height="95" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="675" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5bd0">④ DQN 版：更新网络参数 w</text>
  <text x="675" y="256" text-anchor="middle" font-size="11.5" fill="#1f2b38">w ← w − α · δ_t · ∇_w Q(s_t, a_t; w)</text>
  <text x="675" y="280" text-anchor="middle" font-size="11" fill="#5b6b7c">对 δ_t 的平方做梯度下降，即让 Q 逼近 y_t</text>
</svg>
