<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>表格形式 Q-Learning 的四步更新流程</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">表格形式 Q-Learning 的四步更新流程</text>
  <rect x="60" y="52" width="780" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="76" font-size="13" font-weight="700" fill="#1f2b38">① 观测一个 transition</text>
  <text x="80" y="98" font-size="11.5" fill="#5b6b7c">从环境中得到四元组 (s, a, r, s′)：当前状态、动作、奖励、下一状态</text>
  <line x1="450" y1="114" x2="450" y2="132" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="136" width="780" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="160" font-size="13" font-weight="700" fill="#1f2b38">② 计算 TD Target</text>
  <text x="80" y="182" font-size="11.5" fill="#5b6b7c">y = r + γ · max_a Q(s′, a)：在表格中查 s′ 一行，取最大的动作价值</text>
  <line x1="450" y1="198" x2="450" y2="216" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="220" width="780" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="80" y="244" font-size="13" font-weight="700" fill="#1f2b38">③ 计算 TD error</text>
  <text x="80" y="266" font-size="11.5" fill="#5b6b7c">δ = y − Q(s, a)：衡量当前估计与 TD Target 之间的差距</text>
  <line x1="450" y1="282" x2="450" y2="300" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="304" width="780" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="80" y="328" font-size="13" font-weight="700" fill="#1f2b38">④ 更新表格中的 Q(s, a)</text>
  <text x="80" y="350" font-size="11.5" fill="#5b6b7c">Q(s, a) ← Q(s, a) + α · δ，α 为学习率；每一步只更新被访问的那一格</text>
</svg>
