<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Sarsa 与 Q-Learning 的 TD Target 对比</title>
  <desc>左侧 Sarsa 用下一状态、下一动作的价值，右侧 Q-Learning 用下一状态的最大动作价值</desc>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Sarsa 与 Q-Learning：TD Target 的区别</text>

  <rect x="40" y="55" width="380" height="245" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="85" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">Sarsa：学习 Qπ(s, a)</text>
  <text x="230" y="120" font-size="13" fill="#1f2b38" text-anchor="middle">y = r + γ · Qπ(s', a')</text>
  <text x="230" y="152" font-size="12" fill="#5b6b7c" text-anchor="middle">a' 由当前策略 π 采样得到</text>
  <text x="230" y="178" font-size="12" fill="#5b6b7c" text-anchor="middle">用「实际要执行的下一步动作」</text>
  <rect x="70" y="200" width="320" height="72" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="228" font-size="12" fill="#1f2b38" text-anchor="middle">评估当前策略 π 的价值</text>
  <text x="230" y="252" font-size="12" fill="#5b6b7c" text-anchor="middle">on-policy：策略变了要重学</text>

  <rect x="480" y="55" width="380" height="245" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="670" y="85" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="middle">Q-Learning：学习 Q*(s, a)</text>
  <text x="670" y="120" font-size="13" fill="#1f2b38" text-anchor="middle">y = r + γ · max Q*(s', a)</text>
  <text x="670" y="152" font-size="12" fill="#5b6b7c" text-anchor="middle">对下一步所有动作取最大值</text>
  <text x="670" y="178" font-size="12" fill="#5b6b7c" text-anchor="middle">不管下一步实际执行哪个动作</text>
  <rect x="510" y="200" width="320" height="72" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="228" font-size="12" fill="#1f2b38" text-anchor="middle">直接逼近最优动作价值</text>
  <text x="670" y="252" font-size="12" fill="#5b6b7c" text-anchor="middle">off-policy：数据可来自任意策略</text>

  <line x1="428" y1="177" x2="472" y2="177" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="167" font-size="11" fill="#5b6b7c" text-anchor="middle">对比</text>

  <rect x="40" y="322" width="820" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="346" font-size="13" fill="#1f2b38" text-anchor="middle">共同点：先算 TD Target y，再算 TD error δ = y − Q(s, a)</text>
  <text x="450" y="367" font-size="12" fill="#5b6b7c" text-anchor="middle">Sarsa 用它更新 Critic 网络，Q-Learning 用它更新 Q 表格或 DQN</text>
</svg>
