<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Q-Learning 的一次迭代：从 transition 到更新价值</title>
  <desc>观测四元组、计算 TD Target、计算 TD error、更新 Q 表格或 DQN 参数，循环往复</desc>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Q-Learning 的一次迭代：从 transition 到更新价值</text>

  <rect x="35" y="105" width="185" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="127" y="135" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">① 观测 transition</text>
  <text x="127" y="170" font-size="12" fill="#1f2b38" text-anchor="middle">(s, a, r, s')</text>
  <text x="127" y="196" font-size="11" fill="#5b6b7c" text-anchor="middle">与环境的</text>
  <text x="127" y="214" font-size="11" fill="#5b6b7c" text-anchor="middle">一次交互</text>

  <rect x="250" y="105" width="185" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="342" y="135" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">② 计算 TD Target</text>
  <text x="342" y="170" font-size="12" fill="#1f2b38" text-anchor="middle">y = r + γ · max Q(s', a)</text>
  <text x="342" y="196" font-size="11" fill="#5b6b7c" text-anchor="middle">取下一状态</text>
  <text x="342" y="214" font-size="11" fill="#5b6b7c" text-anchor="middle">最大的动作价值</text>

  <rect x="465" y="105" width="185" height="150" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="557" y="135" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">③ 计算 TD error</text>
  <text x="557" y="170" font-size="12" fill="#1f2b38" text-anchor="middle">δ = y − Q(s, a)</text>
  <text x="557" y="196" font-size="11" fill="#5b6b7c" text-anchor="middle">衡量当前预测</text>
  <text x="557" y="214" font-size="11" fill="#5b6b7c" text-anchor="middle">与目标的偏差</text>

  <rect x="680" y="105" width="185" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="772" y="135" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">④ 更新价值</text>
  <text x="772" y="170" font-size="12" fill="#1f2b38" text-anchor="middle">Q ← Q + α δ</text>
  <text x="772" y="196" font-size="11" fill="#5b6b7c" text-anchor="middle">DQN：</text>
  <text x="772" y="214" font-size="11" fill="#5b6b7c" text-anchor="middle">w ← w − α δ ∇Q</text>

  <line x1="222" y1="180" x2="248" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="437" y1="180" x2="463" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="652" y1="180" x2="678" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="772" y1="255" x2="772" y2="300" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="772" y1="300" x2="127" y2="300" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="127" y1="300" x2="127" y2="263" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="325" font-size="12" fill="#5b6b7c" text-anchor="middle">重复采样 transition 并更新，直到 Q 收敛</text>
  <rect x="35" y="345" width="830" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="370" font-size="12" fill="#1f2b38" text-anchor="middle">表格版直接改 Q 表格中的一项；DQN 版把 Q(s, a) 换成 Q(s, a; w)，用梯度下降改参数 w</text>
</svg>
