<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Sarsa 与 Q-Learning 的对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Sarsa 与 Q-Learning 的对比</text>
  <rect x="25" y="55" width="400" height="160" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Sarsa（On-Policy 同策略）</text>
  <text x="45" y="112" font-size="12.5" fill="#1f2b38">学习目标：动作价值函数 Qπ(s, a)</text>
  <text x="45" y="138" font-size="12.5" fill="#1f2b38">TD Target：y = r + γ · Q(s′, a′)</text>
  <text x="45" y="164" font-size="12" fill="#5b6b7c">a′ 取下一步实际执行的动作</text>
  <text x="45" y="190" font-size="12" fill="#5b6b7c">采样与更新使用同一个策略</text>
  <rect x="475" y="55" width="400" height="160" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="675" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">Q-Learning（Off-Policy 异策略）</text>
  <text x="495" y="112" font-size="12.5" fill="#1f2b38">学习目标：最优动作价值函数 Q*(s, a)</text>
  <text x="495" y="138" font-size="12.5" fill="#1f2b38">TD Target：y = r + γ · max_a Q(s′, a)</text>
  <text x="495" y="164" font-size="12" fill="#5b6b7c">取 s′ 一行中最大的动作价值</text>
  <text x="495" y="190" font-size="12" fill="#5b6b7c">更新目标与行为策略无关</text>
  <line x1="225" y1="215" x2="225" y2="252" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="675" y1="215" x2="675" y2="252" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="25" y="257" width="850" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="45" y="287" font-size="13.5" font-weight="700" fill="#1f2b38">关键差异：TD Target 中「下一状态动作价值」的取法不同</text>
  <text x="45" y="317" font-size="12.5" fill="#2f6fd0">Sarsa：用实际执行的下一个动作 a′ → 同策略，估计 Qπ</text>
  <text x="45" y="346" font-size="12.5" fill="#e08a1e">Q-Learning：用 max_a Q(s′, a) → 异策略，直接逼近 Q*</text>
</svg>
