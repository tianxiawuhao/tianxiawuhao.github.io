<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="360" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/></marker>
</defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">插件 jar 的类加载、资源读取与卸载条件</text>

<rect x="10" y="60" width="160" height="86" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<text x="90" y="84" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">① 拼装 jar 路径</text>
<text x="90" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">app.home +</text>
<text x="90" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">cmpt.location + 版本</text>

<rect x="190" y="60" width="160" height="86" rx="8" fill="#fff6e8" stroke="#c8d3e0"/>
<text x="270" y="84" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">② 创建类加载器</text>
<text x="270" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">URLClassLoader 子类</text>
<text x="270" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">parent = App 加载器</text>

<rect x="370" y="60" width="160" height="86" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<text x="450" y="84" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">③ 加载目标类</text>
<text x="450" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">Class.forName(name,</text>
<text x="450" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">true, loader)</text>

<rect x="550" y="60" width="160" height="86" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<text x="630" y="84" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">④ 实例化并强转</text>
<text x="630" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">(ICmpt) newInstance()</text>
<text x="630" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">接口须由父加载器加载</text>

<rect x="730" y="60" width="160" height="86" rx="8" fill="#eaf7ef" stroke="#c8d3e0"/>
<text x="810" y="84" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">⑤ 缓存实例</text>
<text x="810" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">静态 Map 强引用</text>
<text x="810" y="130" font-size="11" fill="#5b6b7c" text-anchor="middle">显式移除才能卸载</text>

<line x1="172" y1="103" x2="186" y2="103" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="352" y1="103" x2="366" y2="103" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="532" y1="103" x2="546" y2="103" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="712" y1="103" x2="726" y2="103" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="30" y="176" width="400" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="50" y="202" font-size="14" font-weight="700" fill="#1f2b38">类卸载的三个前提（同时满足才回收）</text>
<text x="50" y="230" font-size="12" fill="#5b6b7c">① 该 Class 的所有实例都已不可达</text>
<text x="50" y="254" font-size="12" fill="#5b6b7c">② 加载它的 ClassLoader 已不可达</text>
<text x="50" y="278" font-size="12" fill="#5b6b7c">③ 该 Class 未被强引用持有（ThreadLocal、线程）</text>
<text x="50" y="306" font-size="12" fill="#5b6b7c">满足后 Metaspace 才会释放，jar 句柄靠 close() 释放</text>

<rect x="470" y="176" width="400" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="490" y="202" font-size="14" font-weight="700" fill="#1f2b38">常见泄漏源（卸载失败 → Metaspace 增长）</text>
<text x="490" y="230" font-size="12" fill="#5b6b7c">静态 Map 长期持有 ClassLoader 或插件实例</text>
<text x="490" y="254" font-size="12" fill="#5b6b7c">JDBC DriverManager、ThreadLocal 残留</text>
<text x="490" y="278" font-size="12" fill="#5b6b7c">线程上下文类加载器（TCCL）未恢复</text>
<text x="490" y="306" font-size="12" fill="#5b6b7c">未停止的线程 / 定时任务仍引用插件类</text>
</svg>
