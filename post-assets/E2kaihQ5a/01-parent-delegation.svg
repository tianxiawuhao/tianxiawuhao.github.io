<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
<marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/></marker>
<marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker>
</defs>
<text x="450" y="32" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">双亲委派模型与三类典型的“打破”场景</text>

<rect x="30" y="56" width="390" height="384" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="225" y="84" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">class 文件：向上委派，向下查找</text>

<rect x="80" y="100" width="290" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<text x="225" y="122" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">启动类加载器 Bootstrap</text>
<text x="225" y="141" font-size="11" fill="#5b6b7c" text-anchor="middle">parent = null，加载 java.base 等核心模块</text>

<rect x="80" y="176" width="290" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<text x="225" y="198" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">平台类加载器 Platform</text>
<text x="225" y="217" font-size="11" fill="#5b6b7c" text-anchor="middle">JDK 9 起取代 JDK 8 的 ExtClassLoader</text>

<rect x="80" y="252" width="290" height="52" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<text x="225" y="274" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">应用类加载器 App / System</text>
<text x="225" y="293" font-size="11" fill="#5b6b7c" text-anchor="middle">加载 classpath 上的类与资源</text>

<rect x="80" y="328" width="290" height="52" rx="8" fill="#eaf7ef" stroke="#c8d3e0"/>
<text x="225" y="350" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">自定义 CmptClassLoader</text>
<text x="225" y="369" font-size="11" fill="#5b6b7c" text-anchor="middle">extends URLClassLoader，加载插件 jar</text>

<line x1="104" y1="326" x2="104" y2="306" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#up)"/>
<line x1="104" y1="250" x2="104" y2="230" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#up)"/>
<line x1="104" y1="174" x2="104" y2="154" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#up)"/>
<line x1="346" y1="306" x2="346" y2="326" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#dn)"/>
<line x1="346" y1="230" x2="346" y2="250" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#dn)"/>
<line x1="346" y1="154" x2="346" y2="174" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#dn)"/>

<line x1="60" y1="400" x2="98" y2="400" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#up)"/>
<text x="108" y="404" font-size="12" fill="#5b6b7c">① 委派：先把加载请求交给父加载器</text>
<line x1="60" y1="424" x2="98" y2="424" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#dn)"/>
<text x="108" y="428" font-size="12" fill="#5b6b7c">② 回落：父加载器找不到，子加载器自己 findClass</text>

<rect x="450" y="56" width="420" height="384" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="660" y="84" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">三类典型的“打破”场景</text>

<rect x="470" y="100" width="380" height="104" rx="8" fill="#fff6e8" stroke="#c8d3e0"/>
<text x="486" y="124" font-size="13" font-weight="700" fill="#1f2b38">① 线程上下文类加载器（TCCL）</text>
<text x="486" y="148" font-size="12" fill="#5b6b7c">父加载器（Bootstrap）看不到子加载器上的实现类</text>
<text x="486" y="170" font-size="12" fill="#5b6b7c">setContextClassLoader(loader) 作为委派桥梁</text>
<text x="486" y="192" font-size="12" fill="#5b6b7c">JDBC 驱动、JNDI、ServiceLoader 都依赖它</text>

<rect x="470" y="212" width="380" height="104" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<text x="486" y="236" font-size="13" font-weight="700" fill="#1f2b38">② Tomcat WebappClassLoader：应用类优先</text>
<text x="486" y="260" font-size="12" fill="#5b6b7c">先自己 findClass，最后才委派父加载器</text>
<text x="486" y="282" font-size="12" fill="#5b6b7c">JDK 类与 Java EE API 类仍由父加载器优先加载</text>
<text x="486" y="304" font-size="12" fill="#5b6b7c">每个 webapp 一个加载器，互相隔离、可独立重部署</text>

<rect x="470" y="324" width="380" height="104" rx="8" fill="#eaf7ef" stroke="#c8d3e0"/>
<text x="486" y="348" font-size="13" font-weight="700" fill="#1f2b38">③ Spring Boot LaunchedURLClassLoader</text>
<text x="486" y="372" font-size="12" fill="#5b6b7c">加载 BOOT-INF/classes 与 BOOT-INF/lib/*.jar</text>
<text x="486" y="394" font-size="12" fill="#5b6b7c">registerAsParallelCapable() 支持并行加载</text>
<text x="486" y="416" font-size="12" fill="#5b6b7c">loader 自身的类由父加载器加载，避免重复加载</text>
</svg>
