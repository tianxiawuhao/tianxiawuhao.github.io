<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>事务传播行为对比图：REQUIRED 加入当前事务、REQUIRES_NEW 另开独立事务、NESTED 使用保存点</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">事务传播：加入、独立、嵌套三种边界的差别</text>

  <text x="30" y="90" font-size="12" font-weight="700" fill="#1f2b38">REQUIRED</text>
  <text x="30" y="107" font-size="11" fill="#5b6b7c">默认值</text>
  <rect x="200" y="70" width="660" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="530" y="97" text-anchor="middle" font-size="11.5" fill="#1f2b38">方法 B 加入当前事务：与外层一起提交，也一起回滚</text>

  <text x="30" y="160" font-size="12" font-weight="700" fill="#1f2b38">REQUIRES_NEW</text>
  <text x="30" y="177" font-size="11" fill="#5b6b7c">独立事务</text>
  <rect x="200" y="140" width="180" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="290" y="167" text-anchor="middle" font-size="11.5" fill="#1f2b38">外层事务挂起</text>
  <rect x="390" y="140" width="240" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="510" y="160" text-anchor="middle" font-size="11.5" fill="#2e9e5b">B 新开独立事务</text>
  <text x="510" y="177" text-anchor="middle" font-size="11" fill="#5b6b7c">写完立即提交</text>
  <rect x="640" y="140" width="220" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="750" y="167" text-anchor="middle" font-size="11.5" fill="#1f2b38">外层事务恢复</text>

  <text x="30" y="230" font-size="12" font-weight="700" fill="#1f2b38">NESTED</text>
  <text x="30" y="247" font-size="11" fill="#5b6b7c">保存点</text>
  <rect x="200" y="210" width="660" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="295" y="237" text-anchor="middle" font-size="11.5" fill="#1f2b38">外层事务</text>
  <text x="515" y="237" text-anchor="middle" font-size="11.5" fill="#1f2b38">B 内层子事务：回滚只到保存点</text>
  <text x="750" y="237" text-anchor="middle" font-size="11.5" fill="#1f2b38">外层继续</text>
  <line x1="390" y1="202" x2="390" y2="262" stroke="#7a5bd0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="390" y="197" text-anchor="middle" font-size="11" fill="#7a5bd0">保存点</text>

  <rect x="30" y="310" width="840" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="336" font-size="11.5" fill="#1f2b38">SUPPORTS 有则加入、无则非事务；NOT_SUPPORTED 挂起当前事务；MANDATORY / NEVER 分别要求必须有、必须无事务。</text>
  <text x="50" y="360" font-size="11.5" fill="#5b6b7c">NESTED 依赖 JDBC 保存点：DataSourceTransactionManager 支持，JpaTransactionManager 不支持。</text>
</svg>
