<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>AOP 动态代理织入示意图：调用方经代理对象的通知链，再调用目标对象的纯业务方法</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">AOP 织入：横切逻辑包在代理里，业务代码不动</text>

  <rect x="30" y="150" width="125" height="72" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="92" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">调用方</text>
  <text x="92" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">userService</text>
  <line x1="155" y1="186" x2="200" y2="186" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="205" y="60" width="330" height="252" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="370" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">代理对象（Spring 运行期生成）</text>
  <rect x="222" y="94" width="296" height="44" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="370" y="113" text-anchor="middle" font-size="11.5" fill="#1f2b38">@Before 前置通知 / @Around 开始计时</text>
  <text x="370" y="130" text-anchor="middle" font-size="11" fill="#5b6b7c">execution(* com.demo.service..*.*(..))</text>
  <rect x="222" y="148" width="296" height="40" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="370" y="173" text-anchor="middle" font-size="11.5" fill="#1f2b38">pjp.proceed() 调用目标方法</text>
  <rect x="222" y="198" width="296" height="44" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="370" y="217" text-anchor="middle" font-size="11.5" fill="#1f2b38">@AfterReturning / @AfterThrowing</text>
  <text x="370" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">正常返回取返回值，抛异常取异常对象</text>
  <rect x="222" y="252" width="296" height="44" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="370" y="271" text-anchor="middle" font-size="11.5" fill="#1f2b38">@After 最终通知 / @Around 结束计时</text>
  <text x="370" y="288" text-anchor="middle" font-size="11" fill="#5b6b7c">等价 finally，抛异常也会执行</text>

  <line x1="535" y1="168" x2="610" y2="168" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="572" y="158" text-anchor="middle" font-size="11" fill="#5b6b7c">proceed()</text>
  <rect x="615" y="120" width="255" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="742" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">目标对象 UserServiceImpl</text>
  <text x="742" y="170" text-anchor="middle" font-size="11.5" fill="#1f2b38">transfer() 纯业务代码</text>
  <text x="742" y="192" text-anchor="middle" font-size="11" fill="#5b6b7c">不含日志、权限、事务等横切逻辑</text>

  <text x="30" y="348" font-size="12" font-weight="700" fill="#1f2b38">两条实现路径</text>
  <rect x="205" y="324" width="330" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="370" y="345" text-anchor="middle" font-size="11.5" fill="#1f2b38">JDK 动态代理：基于接口生成</text>
  <text x="370" y="364" text-anchor="middle" font-size="11" fill="#5b6b7c">代理与目标是兄弟，须用接口类型接收</text>
  <rect x="615" y="324" width="255" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="742" y="345" text-anchor="middle" font-size="11.5" fill="#1f2b38">CGLIB：生成目标类的子类</text>
  <text x="742" y="364" text-anchor="middle" font-size="11" fill="#5b6b7c">final 类 / final 方法增强不了</text>
</svg>
