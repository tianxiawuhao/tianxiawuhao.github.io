<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>CountDownLatch、CyclicBarrier、Semaphore 的对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">CountDownLatch / CyclicBarrier / Semaphore 对比</text>

  <rect x="25" y="55" width="120" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="155" y="55" width="240" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="275" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">CountDownLatch</text>
  <rect x="405" y="55" width="240" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="525" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">CyclicBarrier</text>
  <rect x="655" y="55" width="220" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="765" y="80" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Semaphore</text>

  <rect x="25" y="95" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="85" y="125" font-size="12" fill="#5b6b7c" text-anchor="middle">核心语义</text>
  <rect x="155" y="95" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="125" font-size="12" fill="#1f2b38" text-anchor="middle">一次性的倒计数闭锁</text>
  <rect x="405" y="95" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="525" y="125" font-size="12" fill="#1f2b38" text-anchor="middle">可循环使用的同步栅栏</text>
  <rect x="655" y="95" width="220" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="125" font-size="12" fill="#1f2b38" text-anchor="middle">许可计数的信号量</text>

  <rect x="25" y="147" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="85" y="177" font-size="12" fill="#5b6b7c" text-anchor="middle">谁等谁</text>
  <rect x="155" y="147" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="177" font-size="12" fill="#1f2b38" text-anchor="middle">一个线程等一组线程完成</text>
  <rect x="405" y="147" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="525" y="177" font-size="12" fill="#1f2b38" text-anchor="middle">一组线程互相等待</text>
  <rect x="655" y="147" width="220" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="177" font-size="12" fill="#1f2b38" text-anchor="middle">线程竞争有限许可</text>

  <rect x="25" y="199" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="85" y="229" font-size="12" fill="#5b6b7c" text-anchor="middle">复用性</text>
  <rect x="155" y="199" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="229" font-size="12" fill="#1f2b38" text-anchor="middle">不可重用，到 0 即结束</text>
  <rect x="405" y="199" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="525" y="229" font-size="12" fill="#1f2b38" text-anchor="middle">可重用，reset() 后重来</text>
  <rect x="655" y="199" width="220" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="229" font-size="12" fill="#1f2b38" text-anchor="middle">许可可借可还，长期可用</text>

  <rect x="25" y="251" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="85" y="281" font-size="12" fill="#5b6b7c" text-anchor="middle">底层实现</text>
  <rect x="155" y="251" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="281" font-size="12" fill="#1f2b38" text-anchor="middle">AQS 共享模式</text>
  <rect x="405" y="251" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="525" y="281" font-size="12" fill="#1f2b38" text-anchor="middle">ReentrantLock + Condition</text>
  <rect x="655" y="251" width="220" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="281" font-size="12" fill="#1f2b38" text-anchor="middle">AQS 共享模式</text>

  <rect x="25" y="303" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="85" y="333" font-size="12" fill="#5b6b7c" text-anchor="middle">典型场景</text>
  <rect x="155" y="303" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="275" y="333" font-size="12" fill="#1f2b38" text-anchor="middle">起跑门、结果汇总</text>
  <rect x="405" y="303" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="525" y="333" font-size="12" fill="#1f2b38" text-anchor="middle">分阶段计算、多轮汇合</text>
  <rect x="655" y="303" width="220" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="333" font-size="12" fill="#1f2b38" text-anchor="middle">限流、资源池并发控制</text>
</svg>
