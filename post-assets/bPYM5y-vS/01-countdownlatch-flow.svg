<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>CountDownLatch 计数递减到 0 后释放所有等待线程</title>
  <rect width="900" height="260" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">CountDownLatch：计数递减到 0，释放所有等待线程</text>

  <rect x="40" y="70" width="200" height="160" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="102" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">主线程</text>
  <text x="140" y="132" font-size="12" fill="#5b6b7c" text-anchor="middle">await() 阻塞</text>
  <text x="140" y="154" font-size="12" fill="#5b6b7c" text-anchor="middle">等待 count 归零</text>
  <text x="140" y="196" font-size="12" fill="#2e9e5b" text-anchor="middle">计数为 0 后被唤醒</text>

  <rect x="380" y="110" width="150" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="455" y="143" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">count 计数器</text>
  <text x="455" y="167" font-size="13" fill="#e08a1e" text-anchor="middle">3 → 2 → 1 → 0</text>

  <line x1="590" y1="81" x2="590" y2="201" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="630" y1="81" x2="590" y2="81" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="630" y1="141" x2="590" y2="141" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="630" y1="201" x2="590" y2="201" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="590" y1="150" x2="538" y2="150" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="630" y="60" width="240" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="750" y="86" font-size="12" fill="#1f2b38" text-anchor="middle">工作线程 A：countDown()</text>
  <rect x="630" y="120" width="240" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="750" y="146" font-size="12" fill="#1f2b38" text-anchor="middle">工作线程 B：countDown()</text>
  <rect x="630" y="180" width="240" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="750" y="206" font-size="12" fill="#1f2b38" text-anchor="middle">工作线程 C：countDown()</text>

  <line x1="380" y1="150" x2="248" y2="150" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="314" y="140" font-size="11" fill="#2e9e5b" text-anchor="middle">唤醒</text>
</svg>
