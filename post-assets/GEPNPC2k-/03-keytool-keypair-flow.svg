<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>keytool 三步生成密钥对：命令、产物与交付归属</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">keytool 三步生成密钥对：命令、产物与交付归属</text>

  <rect x="40" y="58" width="220" height="84" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">① keytool -genkeypair</text>
  <text x="150" y="110" text-anchor="middle" font-size="12" fill="#1f2b38">生成私钥库</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#1f2b38">privateKeys.store</text>

  <rect x="340" y="58" width="220" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">② keytool -export</text>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#1f2b38">从私钥库导出证书</text>
  <text x="450" y="130" text-anchor="middle" font-size="12" fill="#1f2b38">certfile.cer</text>

  <rect x="640" y="58" width="220" height="84" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">③ keytool -import</text>
  <text x="750" y="110" text-anchor="middle" font-size="12" fill="#1f2b38">导入公钥库</text>
  <text x="750" y="130" text-anchor="middle" font-size="12" fill="#1f2b38">publicCerts.store</text>

  <line x1="262" y1="100" x2="336" y2="100" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="562" y1="100" x2="636" y2="100" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="150" y1="142" x2="150" y2="168" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="450" y1="142" x2="450" y2="168" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="750" y1="142" x2="750" y2="168" stroke="#c8d3e0" stroke-width="1.4"/>

  <rect x="40" y="170" width="220" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="150" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">归属：签发方</text>
  <text x="150" y="216" text-anchor="middle" font-size="11" fill="#5b6b7c">离线保存，绝不随产品交付</text>

  <rect x="340" y="170" width="220" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">中间产物</text>
  <text x="450" y="216" text-anchor="middle" font-size="11" fill="#5b6b7c">导入公钥库之后即可删除</text>

  <rect x="640" y="170" width="220" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">归属：使用方</text>
  <text x="750" y="216" text-anchor="middle" font-size="11" fill="#5b6b7c">随程序交付，用于验签</text>

  <rect x="40" y="250" width="820" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="278" font-size="12" fill="#1f2b38">口令必须一致：客户端的 storePass 要与签发端相同，否则解不开 license.lic 外层的 PBE 保护。</text>
  <text x="60" y="302" font-size="12" fill="#1f2b38">JDK 9+ 默认密钥库类型是 PKCS12，不支持库口令与密钥口令不同；需要两个不同口令时请显式加 -storetype JKS。</text>
</svg>
