  <text x="215.0" y="189" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">key2cert() → cert2key() 的映射单元</text>
  <line x1="215" y1="202" x2="215" y2="226" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="50" y="228" width="330" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="215.0" y="244" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">Base64(XML 序列化 LicenseContent)</text>
  <text x="215.0" y="261" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">holder / issuer / subject / issued</text>
  <text x="215.0" y="278" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">notBefore / notAfter / consumerAmount</text>
