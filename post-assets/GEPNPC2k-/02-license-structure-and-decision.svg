  <text x="505" y="422" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#e08a1e">否</text>
  <rect x="360" y="404" width="110" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
