  <text x="660" y="130" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7c">Preferences 中能否取到 key</text>
