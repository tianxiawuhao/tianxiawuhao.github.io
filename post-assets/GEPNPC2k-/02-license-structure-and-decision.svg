  <text x="215.0" y="349" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">机器码 / MAC / IP / 项目标识</text>
