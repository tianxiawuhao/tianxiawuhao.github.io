  <text x="215.0" y="425" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">私钥签名，公钥验签，防篡改</text>
  <rect x="50" y="458" width="330" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="215.0" y="475" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#5b6b7c">注意：签名保证完整性与来源可信，</text>
  <text x="215.0" y="492" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#5b6b7c">并不隐藏内容；授权信息本身不是机密，</text>
  <text x="215.0" y="509" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#5b6b7c">无需也不应依赖「加密」来实现授权。</text>
  <text x="470" y="62" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1f2b38">B. 校验决策流程</text>
