  <text x="660" y="218" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11.5" font-weight="400" fill="#1f2b38">公钥验签是否通过？</text>
  <text x="660" y="234" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7c">notary.verify(certificate)</text>
  <line x1="540" y1="222" x2="470" y2="222" stroke="#e08a1e" stroke-width="1.6" marker-end="url(#arwr)"/>
  <text x="505" y="214" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#e08a1e">否</text>
  <rect x="360" y="196" width="110" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="415.0" y="217" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#1f2b38">签名无效</text>
  <text x="415.0" y="234" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#1f2b38">文件被篡改</text>
  <line x1="660" y1="262" x2="660" y2="286" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#arwg)"/>
  <text x="672" y="278" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2e9e5b">是</text>
  <path d="M660,286 L780,326 L660,366 L540,326 z" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="660" y="322" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11.5" font-weight="400" fill="#1f2b38">当前时间在有效期内？</text>
  <text x="660" y="338" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7c">notBefore ≤ now ≤ notAfter</text>
  <line x1="540" y1="326" x2="470" y2="326" stroke="#e08a1e" stroke-width="1.6" marker-end="url(#arwr)"/>
  <text x="505" y="318" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#e08a1e">否</text>
  <rect x="360" y="300" width="110" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="415.0" y="321" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#1f2b38">已过期</text>
  <text x="415.0" y="338" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#1f2b38">或尚未生效</text>
  <line x1="660" y1="366" x2="660" y2="390" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#arwg)"/>
  <text x="672" y="382" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2e9e5b">是</text>
  <path d="M660,390 L780,430 L660,470 L540,430 z" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="660" y="426" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11.5" font-weight="400" fill="#1f2b38">extra 机器码与当前主机一致？</text>
  <text x="660" y="442" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7c">自定义 validate() 扩展校验</text>
