  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1f2b38">图 2　许可文件结构与校验决策流程</text>
  <text x="50" y="62" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1f2b38">A. license.lic 的逻辑结构</text>
  <rect x="50" y="74" width="330" height="52" rx="8" fill="#f7f9fc" stroke="#5b6b7c"/>
  <text x="215.0" y="95" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">license.lic（ZIP 容器）</text>
  <text x="215.0" y="112" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1f2b38">整包由 PBE 口令保护，仅为防误改</text>
