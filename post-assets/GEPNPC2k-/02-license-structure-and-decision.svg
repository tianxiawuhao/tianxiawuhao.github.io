  <text x="415.0" y="130" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#1f2b38">NoLicenseInstalled</text>
