  <text x="415.0" y="442" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="10.5" font-weight="400" fill="#1f2b38">机器码不匹配</text>
  <line x1="660" y1="470" x2="660" y2="494" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#arwg)"/>
  <text x="672" y="486" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2e9e5b">是</text>
  <rect x="520" y="496" width="280" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="660.0" y="526" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#2e9e5b">校验通过，授权的功能模块正常启用</text>
  <text x="50" y="556" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#5b6b7c">任一环节失败都应直接拒绝启动，不要只打印日志后继续运行。</text>
</svg>
