<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>无界流与有界流对比及 Flink 与 Spark 的世界观差异</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">无界流与有界流：Flink 的流世界观</text>
  <text x="225" y="74" font-size="13" fill="#2e9e5b" text-anchor="middle" font-weight="700">无界数据流（实时）</text>
  <rect x="45" y="88" width="360" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <circle cx="80" cy="128" r="9" fill="#2e9e5b"/>
  <line x1="89" y1="128" x2="139" y2="128" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="148" cy="128" r="9" fill="#2e9e5b"/>
  <line x1="157" y1="128" x2="207" y2="128" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="216" cy="128" r="9" fill="#2e9e5b"/>
  <line x1="225" y1="128" x2="275" y2="128" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="284" cy="128" r="9" fill="#2e9e5b"/>
  <line x1="293" y1="128" x2="343" y2="128" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="352" cy="128" r="9" fill="#2e9e5b"/>
  <line x1="361" y1="128" x2="411" y2="128" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="225" y="166" font-size="11" fill="#1f2b38" text-anchor="middle">只有开始、没有结束；事件到达即处理</text>
  <text x="225" y="184" font-size="11" fill="#5b6b7c" text-anchor="middle">无法等待全部数据到达，延迟最低</text>
  <text x="675" y="74" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">有界数据流（批）</text>
  <rect x="495" y="88" width="360" height="104" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="545" y="112" width="90" height="32" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="590.0" y="133" font-size="11" fill="#1f2b38" text-anchor="middle">分块 1</text>
  <rect x="655" y="112" width="90" height="32" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="700.0" y="133" font-size="11" fill="#1f2b38" text-anchor="middle">分块 2</text>
  <rect x="765" y="112" width="60" height="32" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="795.0" y="133" font-size="11" fill="#1f2b38" text-anchor="middle">…</text>
  <text x="675" y="166" font-size="11" fill="#1f2b38" text-anchor="middle">有明确的开始与结束，可先排序再计算</text>
  <text x="675" y="184" font-size="11" fill="#5b6b7c" text-anchor="middle">处理有界流即批处理，吞吐优先</text>
  <rect x="45" y="212" width="810" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="233" font-size="12" fill="#1f2b38" text-anchor="middle">Flink 用同一套运行时处理两种流：批只是有界流的特例</text>
  <text x="450" y="252" font-size="11" fill="#5b6b7c" text-anchor="middle">而 Spark 把一切拆成微批次，实时数据由无限小批次拼成</text></svg>
