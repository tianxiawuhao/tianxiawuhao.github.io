<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 分层 API 抽象层级与运行时模块组成</title>
  <rect width="900" height="370" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Flink 分层 API 与模块构成</text>
  <text x="30" y="80" font-size="12" fill="#1f2b38" font-weight="700">API 抽象层级（越靠上越易用）</text>
  <rect x="30" y="196" width="520" height="40" rx="8" fill="#7a5bd0" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="290" y="221" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">SQL / Table API</text>
  <text x="560" y="221" font-size="11" fill="#5b6b7c">声明式：关系表、动态表，适合 SQL 与 BI 场景</text>
  <rect x="30" y="148" width="520" height="40" rx="8" fill="#2f6fd0" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="290" y="173" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">DataStream / DataSet API</text>
  <text x="560" y="173" font-size="11" fill="#5b6b7c">核心 API：map / filter / join / window / 聚合</text>
  <rect x="30" y="100" width="520" height="40" rx="8" fill="#1f2b38" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="290" y="125" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">ProcessFunction（有状态流）</text>
  <text x="560" y="125" font-size="11" fill="#5b6b7c">底层抽象：事件时间、定时器、容错状态</text>
  <text x="30" y="268" font-size="12" fill="#1f2b38" font-weight="700">运行时模块</text>
  <rect x="30" y="282" width="185" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="122" y="308" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">Deployment</text>
  <text x="122" y="330" font-size="11" fill="#5b6b7c" text-anchor="middle">本地 / 集群 / 云</text>
  <rect x="235" y="282" width="185" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="327" y="308" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">Core</text>
  <text x="327" y="330" font-size="11" fill="#5b6b7c" text-anchor="middle">分布式流式引擎</text>
  <rect x="440" y="282" width="185" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="532" y="308" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">API</text>
  <text x="532" y="330" font-size="11" fill="#5b6b7c" text-anchor="middle">DataStream / Table</text>
  <rect x="645" y="282" width="185" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="737" y="308" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">Libs</text>
  <text x="737" y="330" font-size="11" fill="#5b6b7c" text-anchor="middle">CEP · ML · Gelly</text></svg>
