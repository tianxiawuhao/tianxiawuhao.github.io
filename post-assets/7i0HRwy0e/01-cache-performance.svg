<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>引入缓存前后的读写路径对比</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">缓存为什么能提升性能</text>

  <rect x="28" y="55" width="844" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="48" y="82" font-size="14" font-weight="700" fill="#e08a1e">第一次访问：数据不在缓存中</text>
  <rect x="56" y="102" width="130" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="121" y="131" text-anchor="middle" font-size="13" fill="#1f2b38">客户端请求</text>
  <line x1="186" y1="126" x2="258" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="264" y="102" width="160" height="48" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="344" y="123" text-anchor="middle" font-size="13" fill="#1f2b38">查询缓存</text>
  <text x="344" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">未命中</text>
  <line x1="424" y1="126" x2="496" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="502" y="102" width="150" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="577" y="123" text-anchor="middle" font-size="13" fill="#1f2b38">查询数据库</text>
  <text x="577" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">读磁盘，比较慢</text>
  <line x1="652" y1="126" x2="724" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="730" y="102" width="130" height="48" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="795" y="131" text-anchor="middle" font-size="13" fill="#1f2b38">返回结果</text>
  <text x="56" y="178" font-size="11.5" fill="#5b6b7c">把这次读到的数据写进缓存，供后续请求直接复用。</text>
  <path d="M 577 102 C 577 86 121 86 121 98" fill="none" stroke="#2f6fd0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="349" y="80" text-anchor="middle" font-size="11" fill="#2f6fd0">写入缓存</text>

  <rect x="28" y="220" width="844" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="48" y="247" font-size="14" font-weight="700" fill="#2e9e5b">第二次访问：数据已在缓存中</text>
  <rect x="56" y="267" width="130" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="121" y="296" text-anchor="middle" font-size="13" fill="#1f2b38">客户端请求</text>
  <line x1="186" y1="291" x2="258" y2="291" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="264" y="267" width="160" height="48" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="344" y="288" text-anchor="middle" font-size="13" fill="#1f2b38">查询缓存</text>
  <text x="344" y="305" text-anchor="middle" font-size="11" fill="#2e9e5b">命中</text>
  <line x1="424" y1="291" x2="496" y2="291" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="502" y="267" width="150" height="48" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="577" y="296" text-anchor="middle" font-size="13" fill="#1f2b38">直接返回结果</text>
  <rect x="730" y="267" width="130" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="795" y="288" text-anchor="middle" font-size="12.5" fill="#5b6b7c">不查数据库</text>
  <text x="795" y="305" text-anchor="middle" font-size="11" fill="#5b6b7c">省下一次 IO</text>
  <text x="56" y="343" font-size="11.5" fill="#1f2b38">缓存位于内存，读写远快于磁盘；数据库数据变更时同步更新缓存即可。</text>

  <rect x="28" y="392" width="844" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="424" text-anchor="middle" font-size="13" fill="#1f2b38">高性能的本质：把「读磁盘」换成「读内存」，并让结果被反复复用</text>
</svg>
