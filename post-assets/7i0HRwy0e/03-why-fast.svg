<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Redis 高性能的五个主要原因</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Redis 为什么这么快</text>

  <rect x="30" y="58" width="156" height="112" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="108" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">基于内存</text>
  <text x="108" y="104" text-anchor="middle" font-size="11" fill="#5b6b7c">数据存内存</text>
  <text x="108" y="121" text-anchor="middle" font-size="11" fill="#5b6b7c">无磁盘 IO</text>
  <text x="108" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">近似 O(1)</text>

  <rect x="202" y="58" width="156" height="112" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="280" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">结构专为设计</text>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#5b6b7c">数据结构简单</text>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#5b6b7c">操作路径短</text>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">类型按需选</text>

  <rect x="374" y="58" width="156" height="112" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="452" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">单线程模型</text>
  <text x="452" y="104" text-anchor="middle" font-size="11" fill="#5b6b7c">无上下文切换</text>
  <text x="452" y="121" text-anchor="middle" font-size="11" fill="#5b6b7c">无锁竞争与死锁</text>
  <text x="452" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">命令串行执行</text>

  <rect x="546" y="58" width="156" height="112" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="624" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">多路 IO 复用</text>
  <text x="624" y="104" text-anchor="middle" font-size="11" fill="#5b6b7c">一个线程管多连接</text>
  <text x="624" y="121" text-anchor="middle" font-size="11" fill="#5b6b7c">非阻塞 IO</text>
  <text x="624" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">空闲连接不空转</text>

  <rect x="718" y="58" width="152" height="112" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="794" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">自建通信机制</text>
  <text x="794" y="104" text-anchor="middle" font-size="11" fill="#5b6b7c">不套用通用协议</text>
  <text x="794" y="121" text-anchor="middle" font-size="11" fill="#5b6b7c">自有序列化方式</text>
  <text x="794" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">减少额外开销</text>

  <rect x="30" y="200" width="840" height="112" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="226" font-size="12.5" font-weight="700" fill="#1f2b38">多路 IO 复用：单线程如何同时服务成千上万个连接</text>
  <rect x="56" y="240" width="140" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="126" y="262" text-anchor="middle" font-size="12" fill="#1f2b38">大量客户端</text>
  <text x="126" y="279" text-anchor="middle" font-size="11" fill="#5b6b7c">连接与请求</text>
  <line x1="196" y1="263" x2="300" y2="263" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="306" y="240" width="170" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="391" y="262" text-anchor="middle" font-size="12" fill="#1f2b38">IO 多路复用器</text>
  <text x="391" y="279" text-anchor="middle" font-size="11" fill="#5b6b7c">就绪事件统一上报</text>
  <line x1="476" y1="263" x2="580" y2="263" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="586" y="240" width="150" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="661" y="262" text-anchor="middle" font-size="12" fill="#1f2b38">单线程事件循环</text>
  <text x="661" y="279" text-anchor="middle" font-size="11" fill="#5b6b7c">逐个执行命令</text>
  <path d="M 736 286 L 736 302 L 126 302 L 126 289" fill="none" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="431" y="296" text-anchor="middle" font-size="11" fill="#5b6b7c">执行结果沿连接返回客户端</text>

  <rect x="30" y="336" width="840" height="108" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="50" y="362" font-size="13" font-weight="700" fill="#1f2b38">一句话总结</text>
  <text x="50" y="386" font-size="11.5" fill="#1f2b38">· 数据全部放在内存，绝大多数请求是纯内存操作，不需要访问磁盘。</text>
  <text x="50" y="408" font-size="11.5" fill="#1f2b38">· 命令在单线程中串行执行，省掉锁与线程切换，再把网络 IO 交给多路复用统一调度。</text>
  <text x="50" y="430" font-size="11.5" fill="#1f2b38">· 以上几点叠加，使 Redis 的读写延迟稳定在内存级别，适合做缓存与高频计数等场景。</text>
</svg>
