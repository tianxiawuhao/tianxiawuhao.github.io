<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>直接访问数据库与引入缓存后的并发压力对比</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">缓存如何分担高并发压力</text>

  <rect x="28" y="55" width="402" height="45" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="229" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">未使用缓存：请求全部落库</text>
  <rect x="470" y="55" width="402" height="45" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="671" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">使用缓存：请求先走缓存</text>

  <rect x="40" y="118" width="110" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="95" y="143" text-anchor="middle" font-size="12.5" fill="#1f2b38">应用 A</text>
  <rect x="40" y="172" width="110" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="95" y="197" text-anchor="middle" font-size="12.5" fill="#1f2b38">应用 B</text>
  <rect x="40" y="226" width="110" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="95" y="251" text-anchor="middle" font-size="12.5" fill="#1f2b38">应用 C</text>
  <path d="M 150 138 L 258 186" fill="none" stroke="#e08a1e" stroke-width="2"/>
  <path d="M 150 192 L 258 192" fill="none" stroke="#e08a1e" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 150 246 L 258 198" fill="none" stroke="#e08a1e" stroke-width="2"/>
  <rect x="266" y="156" width="128" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="330" y="186" text-anchor="middle" font-size="13" fill="#1f2b38">数据库</text>
  <text x="330" y="206" text-anchor="middle" font-size="11" fill="#1f2b38">读写全部命中</text>
  <text x="229" y="292" text-anchor="middle" font-size="11.5" fill="#1f2b38">每个请求都要查磁盘，连接数与磁盘 IO 成为瓶颈。</text>

  <rect x="466" y="118" width="110" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="521" y="143" text-anchor="middle" font-size="12.5" fill="#1f2b38">应用 A</text>
  <rect x="466" y="172" width="110" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="521" y="197" text-anchor="middle" font-size="12.5" fill="#1f2b38">应用 B</text>
  <rect x="466" y="226" width="110" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="521" y="251" text-anchor="middle" font-size="12.5" fill="#1f2b38">应用 C</text>
  <line x1="576" y1="138" x2="664" y2="178" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="576" y1="192" x2="664" y2="192" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="576" y1="246" x2="664" y2="206" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="670" y="150" width="126" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="733" y="176" text-anchor="middle" font-size="13" fill="#1f2b38">Redis 缓存</text>
  <text x="733" y="196" text-anchor="middle" font-size="11" fill="#2e9e5b">内存直读</text>
  <text x="733" y="213" text-anchor="middle" font-size="11" fill="#5b6b7c">承担绝大部分读</text>
  <line x1="798" y1="180" x2="810" y2="180" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="803" y="232" text-anchor="middle" font-size="10.5" fill="#5b6b7c">回源/同步</text>
  <rect x="812" y="150" width="56" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="840" y="180" text-anchor="middle" font-size="12.5" fill="#1f2b38">数据库</text>
  <text x="840" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">压力大减</text>
  <text x="671" y="292" text-anchor="middle" font-size="11.5" fill="#1f2b38">绝大部分请求在缓存处返回，只有少量回源落到数据库。</text>

  <rect x="28" y="304" width="844" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="48" y="332" font-size="13" font-weight="700" fill="#1f2b38">要点</text>
  <text x="48" y="354" font-size="11.5" fill="#1f2b38">· 缓存直接操作内存，能承受的请求量远大于直接访问数据库。</text>
  <text x="48" y="375" font-size="11.5" fill="#1f2b38">· 把数据库中的热点数据转移到缓存，部分请求就不再经过数据库。</text>
</svg>
