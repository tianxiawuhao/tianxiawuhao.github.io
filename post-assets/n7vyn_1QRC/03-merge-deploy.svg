<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="c1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="570" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">LoRA 合并与两种部署形态</text>

  <rect x="30" y="70" width="250" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="155" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">对话数据集 jsonl</text>
  <text x="155" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">医疗 / 自我认知等领域样本</text>

  <path d="M280,102 H321" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="325" y="70" width="250" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">LoRA / QLoRA 训练</text>
  <text x="450" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">train_lora.py 或 peft + Trainer</text>

  <path d="M575,102 H616" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="620" y="70" width="250" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="745" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">LoRA 适配器（几十 MB）</text>
  <text x="745" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">adapter_model + adapter_config</text>

  <path d="M745,134 V176 H235 V210" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>
  <path d="M745,134 V176 H685 V210" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>

  <path d="M470,196 V540" fill="none" stroke="#c8d3e0" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="40" y="214" width="390" height="76" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.5"/>
  <text x="235" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">① 合并部署 · merge_and_unload()</text>
  <text x="235" y="266" text-anchor="middle" font-size="11" fill="#5b6b7c">把 (α/r)·B·A 加回 W₀，移除旁路</text>
  <path d="M235,290 V326" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="40" y="330" width="390" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="235" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">完整模型权重</text>
  <text x="235" y="382" text-anchor="middle" font-size="11" fill="#5b6b7c">产物与全参数微调一致，无额外结构</text>
  <path d="M235,406 V442" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="40" y="446" width="390" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="235" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">单任务推理，零额外延迟</text>
  <text x="235" y="498" text-anchor="middle" font-size="11" fill="#5b6b7c">适合任务固定、追求低延迟的生产环境</text>

  <rect x="510" y="214" width="350" height="76" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.5"/>
  <text x="685" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">② 动态服务 · 基座常驻显存</text>
  <text x="685" y="266" text-anchor="middle" font-size="11" fill="#5b6b7c">一份基座 + N 个适配器</text>
  <path d="M685,290 V326" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="510" y="330" width="350" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="685" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">按请求切换适配器</text>
  <text x="685" y="382" text-anchor="middle" font-size="11" fill="#5b6b7c">适配器 1 / 2 / … / N 热插拔</text>
  <path d="M685,406 V442" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="510" y="446" width="350" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="685" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">vLLM / S-LoRA 多适配器并发</text>
  <text x="685" y="498" text-anchor="middle" font-size="11" fill="#5b6b7c">显存利用率高于「一任务一模型」</text>
</svg>
