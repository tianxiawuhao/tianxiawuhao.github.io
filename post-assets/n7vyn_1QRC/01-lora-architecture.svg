<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#5b6b7c"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">LoRA 低秩旁路结构：W₀ 冻结 + BA 低秩增量</text>

  <rect x="24" y="190" width="96" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="72" y="216" text-anchor="middle" font-size="14" fill="#1f2b38">输入 x</text>
  <text x="72" y="236" text-anchor="middle" font-size="11" fill="#5b6b7c">k 维</text>

  <rect x="150" y="220" width="0" height="0" fill="none"/>
  <path d="M120,220 H150" fill="none" stroke="#5b6b7c" stroke-width="1.5"/>

  <rect x="160" y="48" width="270" height="104" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="295" y="68" text-anchor="middle" font-size="11" fill="#5b6b7c">预训练权重（冻结，不更新）</text>
  <rect x="185" y="78" width="220" height="58" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="295" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">W₀ (d × k)</text>
  <text x="295" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">requires_grad = False</text>

  <rect x="140" y="250" width="380" height="128" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="330" y="270" text-anchor="middle" font-size="11" fill="#2f6fd0">可训练低秩旁路：ΔW = B · A</text>
  <rect x="160" y="282" width="140" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="230" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">A (r × k)</text>
  <text x="230" y="328" text-anchor="middle" font-size="11" fill="#5b6b7c">高斯随机初始化</text>
  <rect x="350" y="282" width="140" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="420" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">B (d × r)</text>
  <text x="420" y="328" text-anchor="middle" font-size="11" fill="#5b6b7c">全零初始化</text>
  <path d="M300,314 H346" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#a2)"/>

  <path d="M150,220 V107 H181" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M150,220 V314 H156" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#a2)"/>

  <circle cx="560" cy="220" r="24" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="560" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2b38">+</text>
  <path d="M405,107 H530 V192" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M490,314 H530 V248" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#a2)"/>

  <path d="M584,220 H636" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="610" y="211" text-anchor="middle" font-size="11" fill="#e08a1e">α / r</text>

  <rect x="640" y="190" width="110" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="695" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">输出 h</text>
  <text x="695" y="236" text-anchor="middle" font-size="11" fill="#5b6b7c">d 维</text>

  <rect x="620" y="292" width="250" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="745" y="318" text-anchor="middle" font-size="12" fill="#1f2b38">合并后：W = W₀ + (α/r)·B·A</text>
  <text x="745" y="342" text-anchor="middle" font-size="11" fill="#5b6b7c">推理阶段零额外延迟</text>

  <rect x="140" y="404" width="620" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="450" y="428" text-anchor="middle" font-size="13" fill="#1f2b38">h = W₀x + (α/r)·B·A·x　（W₀ 冻结，只有 A、B 可训练）</text>
  <text x="450" y="448" text-anchor="middle" font-size="11" fill="#5b6b7c">B 零初始化 ⇒ 训练起点 ΔW = 0，模型行为与预训练模型完全一致</text>
</svg>
