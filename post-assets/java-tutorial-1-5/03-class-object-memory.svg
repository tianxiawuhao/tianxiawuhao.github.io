<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>类、对象与 static 成员的内存分布</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">new 出来的对象在堆里，static 成员在类里只有一份</text>

  <rect x="45" y="55" width="270" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="65" y="80" font-size="13" font-weight="700" fill="#1f2b38">方法区：Student 类</text>
  <text x="65" y="108" font-size="12" fill="#1f2b38">类信息（字段、方法表）</text>
  <text x="65" y="136" font-size="12" fill="#1f2b38">静态成员区（只有一份）</text>
  <rect x="65" y="150" width="230" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="85" y="176" font-size="12" font-weight="700" fill="#1f2b38">static int count</text>
  <text x="85" y="198" font-size="12" fill="#1f2b38">被所有对象共享</text>

  <text x="362" y="78" text-anchor="middle" font-size="11" fill="#5b6b7c">通过 new 在堆中创建</text>
  <line x1="328" y1="95" x2="410" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="330" y="110" font-size="11" fill="#5b6b7c">生成对象</text>

  <rect x="420" y="60" width="200" height="140" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="440" y="84" font-size="12" font-weight="700" fill="#1f2b38">堆：s1</text>
  <text x="440" y="108" font-size="11" fill="#5b6b7c">name（私有）</text>
  <text x="600" y="108" text-anchor="end" font-size="11" fill="#1f2b38">"小明"</text>
  <text x="440" y="132" font-size="11" fill="#5b6b7c">age（私有）</text>
  <text x="600" y="132" text-anchor="end" font-size="11" fill="#1f2b38">18</text>
  <text x="440" y="164" font-size="11" fill="#2f6fd0">每个对象各一份</text>
  <text x="440" y="186" font-size="11" fill="#2f6fd0">数据（实例变量）</text>

  <rect x="660" y="60" width="200" height="140" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="680" y="84" font-size="12" font-weight="700" fill="#1f2b38">堆：s2</text>
  <text x="680" y="108" font-size="11" fill="#5b6b7c">name（私有）</text>
  <text x="840" y="108" text-anchor="end" font-size="11" fill="#1f2b38">"小红"</text>
  <text x="680" y="132" font-size="11" fill="#5b6b7c">age（私有）</text>
  <text x="840" y="132" text-anchor="end" font-size="11" fill="#1f2b38">19</text>
  <text x="680" y="164" font-size="11" fill="#2f6fd0">每个对象各一份</text>
  <text x="680" y="186" font-size="11" fill="#2f6fd0">数据（实例变量）</text>

  <rect x="420" y="230" width="440" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="440" y="256" font-size="12" font-weight="700" fill="#1f2b38">成员变量堆中各一份，方法代码只有一份</text>
  <text x="440" y="282" font-size="11" fill="#5b6b7c">方法内的 this 指向"正在调用它的那个对象"</text>

  <rect x="45" y="320" width="815" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="65" y="346" font-size="12" font-weight="700" fill="#1f2b38">常用做法：字段私有 + 公有 get/set，构造方法初始化</text>
  <text x="65" y="372" font-size="11" fill="#5b6b7c">static 修饰的成员属于类，用 Student.count 访问；静态方法里没有 this，只能直接访问静态成员</text>
</svg>
