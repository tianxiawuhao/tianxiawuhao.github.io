<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 参数传递：基本类型传值副本，引用类型传地址副本</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">参数传递：一律传副本，区别在副本是值还是地址</text>

  <rect x="40" y="55" width="820" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="80" font-size="12" font-weight="700" fill="#2e9e5b">基本类型：改副本，不影响实参</text>
  <rect x="70" y="98" width="220" height="44" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="90" y="126" font-size="12" fill="#1f2b38">实参变量 a</text>
  <text x="240" y="126" text-anchor="end" font-size="12" font-weight="700" fill="#1f2b38">10</text>
  <rect x="400" y="98" width="220" height="44" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="420" y="126" font-size="12" fill="#1f2b38">形参副本 x</text>
  <text x="570" y="126" text-anchor="end" font-size="12" font-weight="700" fill="#1f2b38">100</text>
  <line x1="300" y1="120" x2="390" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="700" y="126" font-size="11" fill="#5b6b7c">把 10 抄一份给 x</text>
  <text x="70" y="176" font-size="11" fill="#5b6b7c">方法里写 x = 100，只改了副本；方法返回后 main 中的 a 仍是 10</text>

  <rect x="40" y="220" width="820" height="200" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="245" font-size="12" font-weight="700" fill="#2f6fd0">引用类型：副本是地址，两个引用指向同一个对象</text>

  <rect x="70" y="262" width="200" height="44" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="290" font-size="12" fill="#1f2b38">实参变量 arr</text>
  <text x="250" y="290" text-anchor="end" font-size="11" font-weight="700" fill="#5b6b7c">0x7a1</text>

  <rect x="70" y="330" width="200" height="44" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="358" font-size="12" fill="#1f2b38">形参副本 a</text>
  <text x="250" y="358" text-anchor="end" font-size="11" font-weight="700" fill="#5b6b7c">0x7a1</text>

  <line x1="270" y1="284" x2="440" y2="300" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="270" y1="352" x2="440" y2="330" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="450" y="290" width="330" height="92" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="470" y="316" font-size="12" font-weight="700" fill="#1f2b38">堆中的数组对象</text>
  <text x="470" y="342" font-size="12" fill="#1f2b38" font-family="DejaVu Sans Mono, monospace">[1, 4, 3, 8, 5]</text>
  <text x="470" y="366" font-size="11" fill="#2e9e5b">内容被改：实参看到的结果变了</text>

  <text x="70" y="404" font-size="11" fill="#5b6b7c">在方法里写 a = new int[]{9}，只改副本的指向，实参 arr 仍指向原对象——Java 只有值传递。</text>
</svg>
