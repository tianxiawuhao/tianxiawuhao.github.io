<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>方法调用时栈帧的入栈与出栈流程</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">方法调用：栈帧先入栈，返回后出栈</text>

  <rect x="180" y="55" width="560" height="220" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="200" y="78" font-size="12" fill="#5b6b7c">虚拟机栈（每个方法对应一个栈帧）</text>

  <rect x="200" y="92" width="520" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="220" y="116" font-size="13" font-weight="700" fill="#1f2b38">① main 栈帧</text>
  <text x="220" y="136" font-size="11" fill="#5b6b7c">局部变量 a = 10，b = 20；执行到 int r = add(a, b);</text>

  <rect x="200" y="154" width="520" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="220" y="178" font-size="13" font-weight="700" fill="#1f2b38">② add 栈帧（第 1 次调用）</text>
  <text x="220" y="198" font-size="11" fill="#5b6b7c">形参 x = 10，y = 20；计算得 30，遇到 return 立即出栈</text>

  <rect x="200" y="216" width="520" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="220" y="243" font-size="13" font-weight="700" fill="#1f2b38">③ 返回值 30 交给调用处，赋给变量 r</text>

  <rect x="770" y="150" width="70" height="120" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="805" y1="230" x2="805" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="805" y="250" text-anchor="middle" font-size="11" fill="#5b6b7c">栈顶方向</text>

  <rect x="60" y="320" width="780" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="346" font-size="13" font-weight="700" fill="#1f2b38">main 方法里的调用语句</text>
  <text x="80" y="372" font-size="12" fill="#1f2b38" font-family="DejaVu Sans Mono, monospace">int r = add(10, 20);  // 先压入 add 的栈帧，计算完弹出，回到下一行继续执行</text>
</svg>
