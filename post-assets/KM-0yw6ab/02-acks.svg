<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">acks 三种级别的可靠性与风险</text>
<rect x="40" y="60" width="260" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="170" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">acks = 0</text>
<rect x="40" y="104" width="260" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="56" y="134" font-size="12.5" fill="#1f2b38">Producer 不等待确认</text>
<text x="56" y="164" font-size="12.5" fill="#1f2b38">延迟最低</text>
<text x="56" y="194" font-size="12.5" fill="#1f2b38">Broker 未落盘即返回</text>
<text x="56" y="224" font-size="12.5" fill="#1f2b38">故障时可能丢数据</text>
<rect x="320" y="60" width="260" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="450" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">acks = 1</text>
<rect x="320" y="104" width="260" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="336" y="134" font-size="12.5" fill="#1f2b38">等待 leader 落盘后返回</text>
<text x="336" y="164" font-size="12.5" fill="#1f2b38">延迟较低</text>
<text x="336" y="194" font-size="12.5" fill="#1f2b38">leader 故障且未同步</text>
<text x="336" y="224" font-size="12.5" fill="#1f2b38">可能丢数据</text>
<rect x="600" y="60" width="260" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="730" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">acks = -1（all）</text>
<rect x="600" y="104" width="260" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="616" y="134" font-size="12.5" fill="#1f2b38">leader 与 ISR 全部落盘</text>
<text x="616" y="164" font-size="12.5" fill="#1f2b38">可靠性最高</text>
<text x="616" y="194" font-size="12.5" fill="#1f2b38">延迟最高</text>
<text x="616" y="224" font-size="12.5" fill="#1f2b38">重试可能造成重复</text>
<rect x="40" y="306" width="820" height="96" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="60" y="336" font-size="13" fill="#1f2b38">可靠性：acks = -1 &gt; acks = 1 &gt; acks = 0；延迟顺序则相反</text>
<text x="60" y="364" font-size="13" fill="#1f2b38">Exactly Once = At Least Once + 幂等性（enable.idempotence=true）</text>
<text x="60" y="392" font-size="13" fill="#5b6b7c">要求 acks=-1、retries&gt;0 且 max.in.flight.requests.per.connection ≤ 5</text>
</svg>
