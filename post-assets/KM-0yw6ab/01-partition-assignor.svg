<svg xmlns="http://www.w3.org/2000/svg" width="900" height="386" viewBox="0 0 900 386" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="386" fill="#ffffff"/>
<text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">RoundRobin 与 Range 分区分配策略对比</text>
<rect x="40" y="58" width="400" height="214" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="56" y="86" font-size="13.5" font-weight="700" fill="#1f2b38">RoundRobin：10 分区 / 4 个消费线程</text>
<text x="56" y="122" font-size="13" fill="#1f2b38">C1-0 消费 T1-5, T1-2, T1-6</text>
<text x="56" y="152" font-size="13" fill="#1f2b38">C1-1 消费 T1-3, T1-1, T1-9</text>
<text x="56" y="182" font-size="13" fill="#1f2b38">C2-0 消费 T1-0, T1-4</text>
<text x="56" y="212" font-size="13" fill="#1f2b38">C2-1 消费 T1-8, T1-7</text>
<text x="56" y="250" font-size="12" fill="#5b6b7c">所有 topic 的分区按字典序排序后逐个轮询分配</text>
<rect x="460" y="58" width="400" height="214" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="476" y="86" font-size="13.5" font-weight="700" fill="#1f2b38">Range（默认）：10 分区 / 3 个消费线程</text>
<text x="476" y="122" font-size="13" fill="#1f2b38">C1-0 消费分区 0, 1, 2, 3</text>
<text x="476" y="152" font-size="13" fill="#1f2b38">C2-0 消费分区 4, 5, 6</text>
<text x="476" y="182" font-size="13" fill="#1f2b38">C2-1 消费分区 7, 8, 9</text>
<text x="476" y="212" font-size="12" fill="#5b6b7c">n = 10 ÷ 3 = 3，m = 1，前 m 个消费者各多分 1 个分区</text>
<text x="476" y="240" font-size="12" fill="#5b6b7c">按 Topic 单独分配，消费者按字母顺序排序</text>
<text x="50" y="298" font-size="12.5" fill="#5b6b7c">Range 分配结果（分区 0–9 → C1-0 / C2-0 / C2-1）</text>
<rect x="50" y="308" width="76" height="44" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="88" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">0</text>
<rect x="130" y="308" width="76" height="44" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="168" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">1</text>
<rect x="210" y="308" width="76" height="44" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="248" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">2</text>
<rect x="290" y="308" width="76" height="44" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
<text x="328" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">3</text>
<rect x="370" y="308" width="76" height="44" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="408" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">4</text>
<rect x="450" y="308" width="76" height="44" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="488" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">5</text>
<rect x="530" y="308" width="76" height="44" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
<text x="568" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">6</text>
<rect x="610" y="308" width="76" height="44" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="648" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">7</text>
<rect x="690" y="308" width="76" height="44" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="728" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">8</text>
<rect x="770" y="308" width="76" height="44" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
<text x="808" y="336" text-anchor="middle" font-size="14" fill="#1f2b38">9</text>
<line x1="50" y1="360" x2="366" y2="360" stroke="#2f6fd0" stroke-width="1.5"/>
<line x1="370" y1="360" x2="606" y2="360" stroke="#2e9e5b" stroke-width="1.5"/>
<line x1="610" y1="360" x2="846" y2="360" stroke="#e08a1e" stroke-width="1.5"/>
<text x="208" y="378" text-anchor="middle" font-size="12.5" fill="#5b6b7c">C1-0（4 个分区）</text>
<text x="488" y="378" text-anchor="middle" font-size="12.5" fill="#5b6b7c">C2-0（3 个分区）</text>
<text x="728" y="378" text-anchor="middle" font-size="12.5" fill="#5b6b7c">C2-1（3 个分区）</text>
</svg>
