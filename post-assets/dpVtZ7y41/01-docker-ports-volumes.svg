<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>GitLab 容器端口映射与数据卷挂载关系</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">docker run 的三组端口映射与三个数据卷</text>

  <rect x="30" y="60" width="260" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">宿主机端口</text>
  <text x="160" y="116" text-anchor="middle" font-size="13" fill="#1f2b38">80</text>
  <text x="160" y="146" text-anchor="middle" font-size="13" fill="#1f2b38">443</text>
  <text x="160" y="176" text-anchor="middle" font-size="13" fill="#1f2b38">222</text>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">--publish 宿主端口:容器端口</text>

  <rect x="610" y="60" width="260" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="740" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">容器内端口</text>
  <text x="740" y="116" text-anchor="middle" font-size="13" fill="#1f2b38">80（HTTP 网页入口）</text>
  <text x="740" y="146" text-anchor="middle" font-size="13" fill="#1f2b38">443（HTTPS）</text>
  <text x="740" y="176" text-anchor="middle" font-size="13" fill="#1f2b38">22（容器内 SSH）</text>
  <text x="740" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">git push 时要写宿主机的 222 端口</text>

  <line x1="296" y1="92" x2="604" y2="92" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="296" y1="122" x2="604" y2="122" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="296" y1="152" x2="604" y2="152" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="360" y="212" width="520" height="28" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="376" y="231" font-size="12" fill="#1f2b38">容器内 SSH 固定为 22，宿主机改用 222 以避免与本机 sshd 冲突</text>

  <text x="330" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">宿主机目录</text>
  <text x="570" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">容器内目录</text>
  <text x="810" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">存放内容</text>

  <rect x="30" y="290" width="600" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="330" y="312" text-anchor="middle" font-size="12" fill="#1f2b38">/home/gitlab/config  →  /etc/gitlab</text>
  <text x="810" y="312" text-anchor="middle" font-size="12" fill="#5b6b7c">配置文件、初始密码</text>

  <rect x="30" y="330" width="600" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="330" y="352" text-anchor="middle" font-size="12" fill="#1f2b38">/home/gitlab/logs  →  /var/log/gitlab</text>
  <text x="810" y="352" text-anchor="middle" font-size="12" fill="#5b6b7c">运行日志</text>

  <rect x="30" y="370" width="600" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="330" y="392" text-anchor="middle" font-size="12" fill="#1f2b38">/home/gitlab/data  →  /var/opt/gitlab</text>
  <text x="810" y="392" text-anchor="middle" font-size="12" fill="#5b6b7c">仓库数据，删除容器不丢</text>
</svg>
