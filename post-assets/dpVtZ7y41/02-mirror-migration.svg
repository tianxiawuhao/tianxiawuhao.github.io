<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>使用镜像克隆迁移 Git 仓库全部分支的步骤</title>
  <rect width="900" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5bd0"/></marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">git clone --mirror：一次搬走全部分支与标签</text>

  <rect x="30" y="55" width="200" height="86" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">旧仓库</text>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">含全部分支、标签</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">作为克隆来源</text>

  <line x1="236" y1="98" x2="334" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="285" y="86" text-anchor="middle" font-size="11" fill="#5b6b7c">--mirror</text>

  <rect x="340" y="55" width="220" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">本地裸镜像</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">带全部 refs 的完整副本</text>
  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">包含远程跟踪分支</text>

  <line x1="566" y1="98" x2="664" y2="98" stroke="#7a5bd0" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="615" y="86" text-anchor="middle" font-size="11" fill="#7a5bd0">改 origin</text>

  <rect x="670" y="55" width="200" height="86" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="770" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">新仓库</text>
  <text x="770" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">接收推送的目标</text>
  <text x="770" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">origin 已指向这里</text>

  <rect x="30" y="175" width="840" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="204" font-size="13" font-weight="700" fill="#1f2b38">三条命令的顺序</text>

  <circle cx="66" cy="234" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="66" y="239" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">1</text>
  <text x="92" y="239" font-size="12" fill="#1f2b38">git clone --mirror &lt;旧仓库地址&gt; —— 得到裸镜像仓库</text>

  <circle cx="66" cy="284" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="66" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">2</text>
  <text x="92" y="289" font-size="12" fill="#1f2b38">进入克隆出的目录，git remote set-url origin &lt;新仓库地址&gt;</text>

  <circle cx="66" cy="334" r="13" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="66" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">3</text>
  <text x="92" y="339" font-size="12" fill="#1f2b38">git push -f origin —— 把镜像里的全部 refs 推到新仓库</text>
</svg>
