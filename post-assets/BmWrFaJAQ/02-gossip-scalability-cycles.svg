<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gossip 可扩展性：节点数翻倍，收敛所需循环次数只小幅增加（fanout=4）</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">可扩展性：节点数成倍增长，收敛循环次数只小幅增加（fanout=4）</text>
  <text x="40" y="63" font-size="12" fill="#1f2b38">循环次数</text>
  <text x="27" y="77" text-anchor="end" font-size="11" fill="#5b6b7c">5</text>
  <text x="27" y="135" text-anchor="end" font-size="11" fill="#5b6b7c">4</text>
  <text x="27" y="193" text-anchor="end" font-size="11" fill="#5b6b7c">3</text>
  <text x="27" y="251" text-anchor="end" font-size="11" fill="#5b6b7c">2</text>
  <text x="27" y="309" text-anchor="end" font-size="11" fill="#5b6b7c">1</text>
  <line x1="40" y1="75" x2="860" y2="75" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="40" y1="133" x2="860" y2="133" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="40" y1="191" x2="860" y2="191" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="40" y1="249" x2="860" y2="249" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="40" y1="307" x2="860" y2="307" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="40" y1="304" x2="860" y2="304" stroke="#5b6b7c" stroke-width="1.4"/>
  <rect x="70" y="182" width="110" height="125" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="230" y="153" width="110" height="154" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="390" y="124" width="110" height="183" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="550" y="107" width="110" height="200" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="710" y="86" width="110" height="221" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">2.16</text>
  <text x="285" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">2.66</text>
  <text x="445" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">3.16</text>
  <text x="605" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">3.44</text>
  <text x="765" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">4.16</text>
  <text x="125" y="325" text-anchor="middle" font-size="12" fill="#1f2b38">20 节点</text>
  <text x="285" y="325" text-anchor="middle" font-size="12" fill="#1f2b38">40 节点</text>
  <text x="445" y="325" text-anchor="middle" font-size="12" fill="#1f2b38">80 节点</text>
  <text x="605" y="325" text-anchor="middle" font-size="12" fill="#1f2b38">160 节点</text>
  <text x="765" y="325" text-anchor="middle" font-size="12" fill="#1f2b38">320 节点</text>
  <text x="450" y="347" text-anchor="middle" font-size="11" fill="#5b6b7c">柱高为传播到全部节点所需的循环次数（近似值）：节点数翻 4 倍，循环次数仅由 2.16 增至 3.44，约等于 O(log N)</text>
</svg>
