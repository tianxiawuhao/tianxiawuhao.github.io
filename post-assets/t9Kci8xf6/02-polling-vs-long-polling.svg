<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>轮询与长轮询的延迟对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">轮询与长轮询的延迟对比</text>
  <rect x="30" y="50" width="840" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="72" font-size="12" fill="#1f2b38">轮询 Polling：固定间隔 5s 拉取，与配置是否变更无关</text>
  <line x1="70" y1="120" x2="830" y2="120" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="120" y1="120" x2="120" y2="104" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="330" y1="120" x2="330" y2="104" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="540" y1="120" x2="540" y2="104" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="750" y1="120" x2="750" y2="104" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="120" y="142" font-size="11" fill="#5b6b7c" text-anchor="middle">0s</text>
  <text x="330" y="142" font-size="11" fill="#5b6b7c" text-anchor="middle">5s</text>
  <text x="540" y="142" font-size="11" fill="#5b6b7c" text-anchor="middle">10s</text>
  <text x="750" y="142" font-size="11" fill="#5b6b7c" text-anchor="middle">15s</text>
  <line x1="372" y1="96" x2="372" y2="152" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="372" y="90" font-size="11" fill="#e08a1e" text-anchor="middle">配置变更 6s</text>
  <circle cx="540" cy="120" r="5" fill="#e08a1e"/>
  <text x="540" y="172" font-size="11" fill="#e08a1e" text-anchor="middle">10s 才感知，延迟 4s</text>
  <rect x="30" y="220" width="840" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="242" font-size="12" fill="#1f2b38">长轮询 Long Polling：hold 住请求，配置变更或超时才返回</text>
  <line x1="70" y1="290" x2="830" y2="290" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="120" y1="275" x2="372" y2="275" stroke="#2e9e5b" stroke-width="3"/>
  <line x1="120" y1="304" x2="120" y2="288" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="400" y1="304" x2="400" y2="288" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="372" y1="266" x2="372" y2="322" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="372" y="260" font-size="11" fill="#e08a1e" text-anchor="middle">配置变更 6s</text>
  <text x="600" y="260" font-size="11" fill="#2e9e5b" text-anchor="middle">6s 立即返回 200，延迟 ≈ 0</text>
  <text x="120" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">0s</text>
  <text x="372" y="338" font-size="11" fill="#5b6b7c" text-anchor="middle">6s</text>
  <text x="624" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">12s</text>
  <text x="450" y="358" font-size="11" fill="#5b6b7c" text-anchor="middle">若 30s 内始终没有变更，则返回 304，客户端收到后立即重新发起长轮询</text>
</svg>
