<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>配置中心长轮询推送流程</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">配置中心长轮询推送流程</text>
  <rect x="100" y="55" width="160" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="180" y="78" font-size="13" fill="#1f2b38" text-anchor="middle">客户端</text>
  <rect x="640" y="55" width="160" height="36" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="78" font-size="13" fill="#1f2b38" text-anchor="middle">配置中心服务端</text>
  <line x1="180" y1="91" x2="180" y2="415" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="720" y1="91" x2="720" y2="415" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="190" y1="130" x2="710" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="122" font-size="12" fill="#1f2b38" text-anchor="middle">① 发起长轮询请求（dataId=user）</text>
  <rect x="300" y="146" width="300" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="167" font-size="12" fill="#1f2b38" text-anchor="middle">服务端 hold 住请求</text>
  <text x="450" y="184" font-size="11" fill="#5b6b7c" text-anchor="middle">最长等待 30s，不占用 Tomcat 业务线程</text>
  <line x1="710" y1="250" x2="190" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="242" font-size="12" fill="#1f2b38" text-anchor="middle">② 超时仍未变更，返回 304</text>
  <line x1="190" y1="300" x2="710" y2="300" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="292" font-size="12" fill="#1f2b38" text-anchor="middle">③ 客户端立即再次发起长轮询</text>
  <line x1="710" y1="350" x2="190" y2="350" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="450" y="342" font-size="12" fill="#e08a1e" text-anchor="middle">④ 配置变更，返回 200 与新配置</text>
  <line x1="190" y1="400" x2="710" y2="400" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="392" font-size="12" fill="#1f2b38" text-anchor="middle">⑤ 触发配置回调，并继续下一次长轮询</text>
  <rect x="100" y="425" width="700" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="455" font-size="12" fill="#1f2b38" text-anchor="middle">配置变更即时感知；空闲时服务端几乎不产生额外请求</text>
</svg>
