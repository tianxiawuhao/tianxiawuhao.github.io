<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>结构体匿名嵌入与方法提升</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">结构体匿名嵌入：字段与方法的提升</text>

  <rect x="60" y="60" width="320" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="220" y="86" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">Animal（内层结构体）</text>
  <rect x="80" y="100" width="280" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="220" y="124" font-size="13" fill="#1f2b38" text-anchor="middle">字段：name / age</text>
  <text x="220" y="146" font-size="13" fill="#1f2b38" text-anchor="middle">height / weight</text>
  <rect x="80" y="172" width="280" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="220" y="200" font-size="13" fill="#1f2b38" text-anchor="middle">方法：func (u Animal) run()</text>

  <rect x="520" y="60" width="320" height="180" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="680" y="86" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">Dog（外层结构体）</text>
  <rect x="540" y="100" width="280" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="680" y="128" font-size="13" fill="#1f2b38" text-anchor="middle">Animal（匿名嵌入）</text>
  <rect x="540" y="156" width="280" height="28" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="680" y="175" font-size="13" fill="#1f2b38" text-anchor="middle">color string</text>
  <rect x="540" y="194" width="280" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="680" y="215" font-size="13" fill="#1f2b38" text-anchor="middle">方法：func (d Dog) sleep()</text>

  <line x1="384" y1="150" x2="516" y2="150" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="140" font-size="12" fill="#5b6b7c" text-anchor="middle">匿名嵌入</text>

  <line x1="680" y1="244" x2="680" y2="268" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="120" y="272" width="660" height="96" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="296" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Dog 实例可直接访问被提升的成员</text>
  <rect x="140" y="310" width="190" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="330" font-size="13" fill="#1f2b38" text-anchor="middle">dog.name</text>
  <text x="235" y="348" font-size="11" fill="#5b6b7c" text-anchor="middle">来自 Animal</text>
  <rect x="355" y="310" width="190" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="330" font-size="13" fill="#1f2b38" text-anchor="middle">dog.run()</text>
  <text x="450" y="348" font-size="11" fill="#5b6b7c" text-anchor="middle">来自 Animal</text>
  <rect x="570" y="310" width="190" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="330" font-size="13" fill="#1f2b38" text-anchor="middle">dog.sleep()</text>
  <text x="665" y="348" font-size="11" fill="#5b6b7c" text-anchor="middle">Dog 自身</text>
</svg>
