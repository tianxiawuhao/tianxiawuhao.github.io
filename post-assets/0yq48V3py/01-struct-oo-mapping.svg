<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Go 结构体与面向对象概念的对应关系</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Go 结构体与面向对象概念的对应关系</text>
  <text x="210" y="62" font-size="14" font-weight="700" fill="#5b6b7c" text-anchor="middle">Go 结构体</text>
  <text x="690" y="62" font-size="14" font-weight="700" fill="#5b6b7c" text-anchor="middle">面向对象</text>

  <rect x="40" y="78" width="340" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="106" font-size="13" fill="#1f2b38" text-anchor="middle">type Animal struct { … }</text>
  <rect x="520" y="78" width="340" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="106" font-size="13" fill="#1f2b38" text-anchor="middle">类：class Animal { … }</text>
  <line x1="384" y1="101" x2="516" y2="101" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <rect x="40" y="132" width="340" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="160" font-size="13" fill="#1f2b38" text-anchor="middle">字段：name / age / height / weight</text>
  <rect x="520" y="132" width="340" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="160" font-size="13" fill="#1f2b38" text-anchor="middle">属性（成员变量）</text>
  <line x1="384" y1="155" x2="516" y2="155" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <rect x="40" y="186" width="340" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="214" font-size="13" fill="#1f2b38" text-anchor="middle">方法：func (u Animal) run()</text>
  <rect x="520" y="186" width="340" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="214" font-size="13" fill="#1f2b38" text-anchor="middle">方法（成员函数）</text>
  <line x1="384" y1="209" x2="516" y2="209" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <rect x="40" y="240" width="340" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="268" font-size="13" fill="#1f2b38" text-anchor="middle">实例化：animal1 := &amp;Animal{…}</text>
  <rect x="520" y="240" width="340" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="268" font-size="13" fill="#1f2b38" text-anchor="middle">实例化：new Animal()</text>
  <line x1="384" y1="263" x2="516" y2="263" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <text x="450" y="314" font-size="12" fill="#5b6b7c" text-anchor="middle">左侧的每一行都在右侧面向对象中有一个对应概念</text>
</svg>
