<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>HTML5 文档骨架结构</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">HTML5 文档骨架：四层结构各司其职</text>
  <rect x="300" y="50" width="300" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="70" font-size="15" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;!DOCTYPE html&gt;</text>
  <text x="450" y="87" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">文档类型声明：不是标签，触发标准模式渲染</text>
  <path d="M 450 96 L 450 122" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="122" width="300" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="142" font-size="15" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;html lang="zh-CN"&gt;</text>
  <text x="450" y="157" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">根元素，整棵 DOM 树的容器</text>
  <path d="M 450 164 L 450 190" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="205" font-size="13" fill="#5b6b7c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;head&gt;</text>
  <text x="450" y="224" font-size="13" fill="#5b6b7c" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;body&gt;</text>
  <path d="M 450 190 L 450 212 L 225 212 L 225 232" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 212 L 675 212 L 675 232" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="80" y="232" width="290" height="104" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="225" y="257" font-size="13" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;meta charset="UTF-8"&gt;</text>
  <text x="225" y="279" font-size="13" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;meta name="viewport" ...&gt;</text>
  <text x="225" y="301" font-size="13" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;title&gt;商品列表&lt;/title&gt;</text>
  <text x="225" y="325" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">给浏览器看的元信息：编码、标题、样式、脚本</text>
  <rect x="530" y="232" width="290" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="675" y="257" font-size="13" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;h1&gt;商品列表&lt;/h1&gt;</text>
  <text x="675" y="279" font-size="13" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;p&gt;共 12 件商品。&lt;/p&gt;</text>
  <text x="675" y="301" font-size="12" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;img src="..." alt="..."&gt;</text>
  <text x="675" y="325" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">给用户看的内容：语义标签组织正文</text>
  <rect x="80" y="362" width="740" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="384" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="400">成对标签 <tspan font-family="DejaVu Sans Mono, monospace">&lt;p&gt;…&lt;/p&gt;</tspan> 必须有结束标签；空元素 <tspan font-family="DejaVu Sans Mono, monospace">&lt;br&gt; &lt;hr&gt; &lt;img&gt; &lt;input&gt; &lt;meta&gt;</tspan> 没有</text>
  <text x="450" y="405" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">中文页面务必把 &lt;meta charset="UTF-8"&gt; 放在 &lt;head&gt; 最前面，否则可能整页乱码</text>
</svg>
