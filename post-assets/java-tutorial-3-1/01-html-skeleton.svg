<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>HTML 文档骨架与 DOM 树对照</title>
<rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">HTML 文档骨架与它构建出的 DOM 树</text>
<rect x="370" y="55" width="160" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="77" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">document</text>
<line x1="450" y1="89" x2="450" y2="115" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="370" y="118" width="160" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="140" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">html</text>
<line x1="450" y1="152" x2="450" y2="168" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="300" y1="168" x2="600" y2="168" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="300" y1="168" x2="300" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="600" y1="168" x2="600" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="215" y="183" width="170" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="300" y="205" font-size="12" fill="#1f2b38" text-anchor="middle">head：给浏览器看</text>
<rect x="515" y="183" width="170" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="600" y="205" font-size="12" fill="#1f2b38" text-anchor="middle">body：给用户看</text>
<line x1="300" y1="217" x2="300" y2="237" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="145" y1="237" x2="335" y2="237" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="145" y1="237" x2="145" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="335" y1="237" x2="335" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="60" y="253" width="170" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="145" y="275" font-size="11.5" fill="#1f2b38" text-anchor="middle">meta charset=UTF-8</text>
<rect x="250" y="253" width="170" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="335" y="275" font-size="12" fill="#1f2b38" text-anchor="middle">title 商品列表</text>
<line x1="600" y1="217" x2="600" y2="237" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="560" y1="237" x2="740" y2="237" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="560" y1="237" x2="560" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="740" y1="237" x2="740" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="480" y="253" width="160" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="560" y="275" font-size="12" fill="#1f2b38" text-anchor="middle">h1 商品列表</text>
<rect x="660" y="253" width="160" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="740" y="275" font-size="12" fill="#1f2b38" text-anchor="middle">p 共 12 件商品</text>
<text x="450" y="330" font-size="12" fill="#5b6b7c" text-anchor="middle">标准模式渲染：DOCTYPE 声明 + html / head / body 三层骨架</text>
<text x="450" y="354" font-size="12" fill="#5b6b7c" text-anchor="middle">head 放编码、标题、样式与脚本，body 放用户可见内容；标签成对，br / img 等空元素除外</text>
<!-- 设计说明：左侧源码骨架与右侧 DOM 节点树一一对应：document 为根，html 下分 head 与 body。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
</svg>
