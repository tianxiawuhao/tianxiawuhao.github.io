<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>表单提交与编码方式对比</title>
  <rect width="900" height="540" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">表单：method 与 enctype 决定数据怎么交给服务器</text>
  <text x="450" y="54" font-size="14" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;form action="/user/register" method="post"&gt;</text>
  <path d="M 450 66 L 450 90" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="90" width="300" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="110" font-size="14" fill="#1f2b38" text-anchor="middle" font-weight="700">带 name 的控件</text>
  <text x="450" y="126" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">值被收集成键值对；没有 name 不提交</text>
  <path d="M 450 132 L 450 156" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 156 L 230 156 L 230 182" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 156 L 670 156 L 670 182" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="182" width="340" height="300" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="230" y="208" font-size="14" fill="#2e9e5b" text-anchor="middle" font-weight="700">GET：参数拼在 URL 后面</text>
  <rect x="80" y="222" width="300" height="40" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="247" font-size="12" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">/search?kw=java&amp;page=2</text>
  <text x="230" y="286" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">长度有限、留在浏览器历史与日志里</text>
  <text x="230" y="304" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">适合查询、可被收藏与分享</text>
  <text x="230" y="342" font-size="13" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;form method="get"&gt;</text>
  <text x="230" y="378" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="400">⚠ 不要提交密码等敏感信息</text>
  <text x="230" y="406" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="400">⚠ 有文件上传时不可用</text>
  <text x="230" y="456" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">查询类表单</text>
  <rect x="500" y="182" width="340" height="300" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="208" font-size="14" fill="#2f6fd0" text-anchor="middle" font-weight="700">POST：数据放在请求体里</text>
  <rect x="520" y="222" width="300" height="40" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="247" font-size="12" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">POST /user/register</text>
  <text x="670" y="286" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">不出现在 URL，不进历史记录</text>
  <text x="670" y="304" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">适合新增、修改与敏感数据</text>
  <text x="670" y="342" font-size="13" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">enctype="multipart/form-data"</text>
  <text x="670" y="378" font-size="12" fill="#2e9e5b" text-anchor="middle" font-weight="400">✓ 文件上传的唯一正确组合</text>
  <text x="670" y="406" font-size="12" fill="#2e9e5b" text-anchor="middle" font-weight="400">method 必须是 post</text>
  <text x="670" y="456" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">提交类表单 / 含文件上传</text>
  <line x1="400" y1="332" x2="500" y2="332" stroke="#c8d3e0" stroke-width="1.4"/>
</svg>
