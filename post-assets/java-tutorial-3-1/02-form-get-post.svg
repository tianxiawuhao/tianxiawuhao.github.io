<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>表单 GET 与 POST 提交路径对比</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">表单提交：控件、name 与 GET / POST 的分工</text>
<rect x="200" y="55" width="500" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="80" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">点击 submit：浏览器收集所有带 name 的控件值</text>
<text x="450" y="100" font-size="11.5" fill="#5b6b7c" text-anchor="middle">没有 name 的控件不会被提交，disabled 的值也不会</text>
<line x1="350" y1="111" x2="258" y2="158" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="550" y1="111" x2="642" y2="158" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="60" y="160" width="360" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="240" y="186" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">GET  method="get"</text>
<text x="240" y="208" font-size="11.5" fill="#5b6b7c" text-anchor="middle">参数拼在 URL 后面</text>
<text x="240" y="230" font-size="12" fill="#1f2b38" text-anchor="middle">/search?q=java&amp;page=2</text>
<text x="240" y="254" font-size="11.5" fill="#5b6b7c" text-anchor="middle">地址栏可见、长度有限、适合查询</text>
<rect x="480" y="160" width="360" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="660" y="186" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">POST  method="post"</text>
<text x="660" y="208" font-size="11.5" fill="#5b6b7c" text-anchor="middle">参数放在请求体里</text>
<text x="660" y="230" font-size="12" fill="#1f2b38" text-anchor="middle">q=java&amp;page=2</text>
<text x="660" y="254" font-size="11.5" fill="#5b6b7c" text-anchor="middle">不显示在 URL，适合新增与敏感数据</text>
<line x1="240" y1="280" x2="352" y2="318" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="660" y1="280" x2="548" y2="318" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="200" y="320" width="500" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="344" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">含文件上传：必须 method="post"</text>
<text x="450" y="366" font-size="11.5" fill="#5b6b7c" text-anchor="middle">且 enctype="multipart/form-data"，否则后端收不到任何文件</text>
<!-- 设计说明：上半部分说明控件 name 的作用，下半部分对比 GET 与 POST 的取值位置，底部橙色为文件上传硬性要求。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
</svg>
