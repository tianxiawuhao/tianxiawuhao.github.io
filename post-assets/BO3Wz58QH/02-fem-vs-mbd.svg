<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>有限元与多体动力学的理论基础、擅长问题与选型对比</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">有限元与多体动力学：理论基础、擅长问题与选型</text>

  <rect x="60" y="52" width="360" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="82" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">有限元（FEM）</text>
  <rect x="480" y="52" width="360" height="48" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="82" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">多体动力学（MBD）</text>

  <line x1="450" y1="52" x2="450" y2="405" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 5"/>

  <rect x="60" y="125" width="360" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="159" font-size="12" fill="#1f2b38" text-anchor="middle">理论基础：弹性力学</text>
  <rect x="480" y="125" width="360" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="159" font-size="12" fill="#1f2b38" text-anchor="middle">理论基础：分析力学</text>

  <rect x="60" y="199" width="360" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="233" font-size="12" fill="#1f2b38" text-anchor="middle">基本方程：内力与外力的平衡</text>
  <rect x="480" y="199" width="360" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="233" font-size="12" fill="#1f2b38" text-anchor="middle">基本方程：运动参数与受力的关系</text>

  <rect x="60" y="273" width="360" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="307" font-size="12" fill="#1f2b38" text-anchor="middle">擅长：变形、应力、应变、接触与多物理场</text>
  <rect x="480" y="273" width="360" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="307" font-size="12" fill="#1f2b38" text-anchor="middle">擅长：速度、加速度、受力与复杂运动</text>

  <rect x="60" y="347" width="360" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="381" font-size="12" fill="#1f2b38" text-anchor="middle">典型工具：ANSYS、Abaqus、LS-DYNA</text>
  <rect x="480" y="347" width="360" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="660" y="381" font-size="12" fill="#1f2b38" text-anchor="middle">典型工具：ADAMS、Simpack、RecurDyn</text>

  <rect x="60" y="421" width="780" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="446" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">选型：关心运动 → 多体动力学；关心变形 → 有限元</text>
  <text x="450" y="465" font-size="11" fill="#5b6b7c" text-anchor="middle">运动关系复杂、非线性机构、机-控联合仿真优先多体动力学；材料失效、非线性变形、多物理场耦合优先有限元</text>
</svg>
