<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>多体系统动力学的研究对象与两类建模方法</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">多体系统动力学：研究对象与两类建模方法</text>

  <rect x="290" y="52" width="320" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="77" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">多体系统动力学</text>
  <text x="450" y="98" font-size="11" fill="#5b6b7c" text-anchor="middle">研究运动与受力之间的关系</text>

  <rect x="60" y="175" width="360" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="201" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">多刚体系统动力学</text>
  <rect x="85" y="215" width="310" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="243" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">拉格朗日法（相对坐标）</text>
  <text x="240" y="264" font-size="11" fill="#5b6b7c" text-anchor="middle">以相邻刚体与铰为单元，取相对转角/位移</text>
  <rect x="85" y="295" width="310" height="68" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="240" y="323" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">笛卡尔法（绝对坐标）</text>
  <text x="240" y="344" font-size="11" fill="#5b6b7c" text-anchor="middle">以每个物体为单元，方位用欧拉角/欧拉参数</text>

  <rect x="480" y="175" width="360" height="200" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="660" y="201" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">多柔体系统动力学</text>
  <rect x="505" y="215" width="310" height="68" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="660" y="243" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">浮动坐标系</text>
  <text x="660" y="264" font-size="11" fill="#5b6b7c" text-anchor="middle">大范围运动由浮动坐标系描述</text>
  <rect x="505" y="295" width="310" height="68" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="323" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">弹性体离散</text>
  <text x="660" y="344" font-size="11" fill="#5b6b7c" text-anchor="middle">有限单元法或模态综合分析法</text>

  <line x1="450" y1="112" x2="248" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="112" x2="652" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="405" font-size="11" fill="#5b6b7c" text-anchor="middle">两类系统的动力学方程形式相同，柔性多体系统与多刚体系统具有类同的数学模型</text>
</svg>
