<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>条件筛选的三种组织方式：if 链、过滤器组合、Predicate 组合</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">过滤器模式：把筛选条件变成可组合的零件</text>

  <rect x="40" y="52" width="420" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="76" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">改造前：条件写在方法里</text>
  <text x="60" y="100" font-size="11.5" fill="#1f2b38" text-anchor="start">if (gender != null &amp;&amp; !gender.isEmpty()) { ... }</text>
  <text x="60" y="122" font-size="11.5" fill="#1f2b38" text-anchor="start">if (married != null) { ... }</text>
  <text x="60" y="144" font-size="11.5" fill="#1f2b38" text-anchor="start">if (keyword != null) { ... }</text>
  <text x="60" y="170" font-size="11.5" fill="#e08a1e" text-anchor="start">每加一个条件，方法就多一层嵌套；</text>
  <text x="60" y="190" font-size="11.5" fill="#e08a1e" text-anchor="start">「或」逻辑更是要靠布尔标记绕出来</text>

  <rect x="480" y="52" width="380" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="500" y="76" font-size="13" fill="#2e9e5b" text-anchor="start" font-weight="700">改造后：条件即对象</text>
  <text x="500" y="100" font-size="11.5" fill="#1f2b38" text-anchor="start">Criteria male = new MaleCriteria();</text>
  <text x="500" y="122" font-size="11.5" fill="#1f2b38" text-anchor="start">Criteria single = new SingleCriteria();</text>
  <text x="500" y="144" font-size="11.5" fill="#1f2b38" text-anchor="start">Criteria rule = new OrCriteria(male, single);</text>
  <text x="500" y="170" font-size="11.5" fill="#1f2b38" text-anchor="start">rule.meetCriteria(persons);</text>
  <text x="500" y="190" font-size="11.5" fill="#2e9e5b" text-anchor="start">组合条件本身也是条件，可继续嵌套</text>

  <text x="450" y="230" font-size="12" fill="#5b6b7c" text-anchor="middle">条件表达式树：先筛性别，再按「与 / 或」组合——结构等同于 SQL 的 WHERE (a AND b) OR c</text>

  <rect x="120" y="248" width="180" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="273" font-size="12" fill="#1f2b38" text-anchor="middle">MaleCriteria</text>
  <rect x="340" y="248" width="180" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="430" y="273" font-size="12" fill="#1f2b38" text-anchor="middle">SingleCriteria</text>
  <line x1="210" y1="290" x2="290" y2="318" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="430" y1="290" x2="350" y2="318" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="280" y="320" width="120" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="340" y="345" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">OrCriteria</text>
  <line x1="402" y1="340" x2="476" y2="340" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="480" y="320" width="220" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="590" y="345" font-size="12" fill="#1f2b38" text-anchor="middle">满足任一条件的人员列表</text>

  <rect x="40" y="376" width="820" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="398" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">与责任链的区别：</text>
  <text x="150" y="398" font-size="11.5" fill="#5b6b7c" text-anchor="start">责任链是请求沿处理者传递、有人接手就停；过滤器是对同一批数据反复筛选、逐步收窄。</text>
  <text x="60" y="416" font-size="11.5" fill="#5b6b7c" text-anchor="start">Java 实践：能用 Predicate 的 and/or/negate 表达条件组合时，不必手写一套 Criteria 类层次。</text>
</svg>
