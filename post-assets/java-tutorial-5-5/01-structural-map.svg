<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>结构型模式七种：接口转换、结构复用、层次表达三组</title>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">结构型模式：管的是「类与对象怎么组装」</text>

  <text x="30" y="90" font-size="12.5" font-weight="700" fill="#2f6fd0">接口转换</text>
  <text x="30" y="108" font-size="11" fill="#5b6b7c">与解耦</text>
  <rect x="185" y="50" width="215" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="292" y="79" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">适配器 Adapter</text>
  <text x="292" y="105" font-size="10.5" fill="#5b6b7c" text-anchor="middle">接口对不上，救火改造</text>
  <rect x="418" y="50" width="215" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="525" y="79" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">桥接 Bridge</text>
  <text x="525" y="105" font-size="10.5" fill="#5b6b7c" text-anchor="middle">抽象与实现各自变化</text>
  <rect x="651" y="50" width="215" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="758" y="79" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">外观 Facade</text>
  <text x="758" y="105" font-size="10.5" fill="#5b6b7c" text-anchor="middle">子系统太多，给统一入口</text>

  <text x="30" y="184" font-size="12.5" font-weight="700" fill="#7a5bd0">结构复用</text>
  <text x="30" y="202" font-size="11" fill="#5b6b7c">不改原类加职责</text>
  <rect x="185" y="144" width="215" height="72" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="292" y="173" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">装饰器 Decorator</text>
  <text x="292" y="199" font-size="10.5" fill="#5b6b7c" text-anchor="middle">不改原类，动态叠加职责</text>
  <rect x="418" y="144" width="215" height="72" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="525" y="173" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">代理 Proxy</text>
  <text x="525" y="199" font-size="10.5" fill="#5b6b7c" text-anchor="middle">访问前后插入控制逻辑</text>
  <rect x="651" y="144" width="215" height="72" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="758" y="173" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">享元 Flyweight</text>
  <text x="758" y="199" font-size="10.5" fill="#5b6b7c" text-anchor="middle">共享不可变对象省内存</text>

  <text x="30" y="278" font-size="12.5" font-weight="700" fill="#2e9e5b">层次表达</text>
  <text x="30" y="296" font-size="11" fill="#5b6b7c">整体与部分一致</text>
  <rect x="185" y="238" width="215" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="292" y="267" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">组合 Composite</text>
  <text x="292" y="293" font-size="10.5" fill="#5b6b7c" text-anchor="middle">树形结构，叶与容器一致</text>

  <rect x="30" y="330" width="840" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="360" font-size="11.5" fill="#1f2b38" text-anchor="middle">选型先问一句：接口对不上？维度太多？访问要受控？功能要叠加？整体与部分要一视同仁？</text>
</svg>
