<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>7 种消息推送方案在通信方向、实时性、服务端压力和典型场景上的对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">7 种消息推送方案对比</text>

  <rect x="20" y="60" width="860" height="312" rx="8" fill="#f7f9fc"/>
  <rect x="20" y="60" width="860" height="32" rx="8" fill="#eef4ff"/>
  <rect x="20" y="78" width="860" height="14" fill="#eef4ff"/>

  <rect x="20" y="132" width="860" height="40" fill="#ffffff"/>
  <rect x="20" y="212" width="860" height="40" fill="#ffffff"/>
  <rect x="20" y="292" width="860" height="40" fill="#ffffff"/>

  <line x1="170" y1="60" x2="170" y2="372" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="340" y1="60" x2="340" y2="372" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="490" y1="60" x2="490" y2="372" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="660" y1="60" x2="660" y2="372" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="20" y1="92" x2="880" y2="92" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="20" y1="132" x2="880" y2="132" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="20" y1="172" x2="880" y2="172" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="20" y1="212" x2="880" y2="212" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="20" y1="252" x2="880" y2="252" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="20" y1="292" x2="880" y2="292" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="20" y1="332" x2="880" y2="332" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="20" y="60" width="860" height="312" rx="8" fill="none" stroke="#c8d3e0" stroke-width="1.4"/>

  <text x="95" y="81" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">方案</text>
  <text x="255" y="81" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">通信方向</text>
  <text x="415" y="81" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">实时性</text>
  <text x="575" y="81" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">服务端压力</text>
  <text x="770" y="81" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">典型场景</text>

  <text x="95" y="117" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">短轮询</text>
  <text x="255" y="117" font-size="12" fill="#1f2b38" text-anchor="middle">客户端拉</text>
  <text x="415" y="117" font-size="12" fill="#e08a1e" text-anchor="middle">差</text>
  <text x="575" y="117" font-size="12" fill="#e08a1e" text-anchor="middle">高</text>
  <text x="770" y="117" font-size="12" fill="#5b6b7c" text-anchor="middle">未读数等低频变化</text>

  <text x="95" y="157" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">长轮询</text>
  <text x="255" y="157" font-size="12" fill="#1f2b38" text-anchor="middle">客户端拉</text>
  <text x="415" y="157" font-size="12" fill="#2f6fd0" text-anchor="middle">较好</text>
  <text x="575" y="157" font-size="12" fill="#2f6fd0" text-anchor="middle">中</text>
  <text x="770" y="157" font-size="12" fill="#5b6b7c" text-anchor="middle">配置中心、MQ 消费</text>

  <text x="95" y="197" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">iframe 流</text>
  <text x="255" y="197" font-size="12" fill="#1f2b38" text-anchor="middle">服务端推（单向）</text>
  <text x="415" y="197" font-size="12" fill="#2f6fd0" text-anchor="middle">较好</text>
  <text x="575" y="197" font-size="12" fill="#2f6fd0" text-anchor="middle">中</text>
  <text x="770" y="197" font-size="12" fill="#5b6b7c" text-anchor="middle">兼容老旧浏览器</text>

  <text x="95" y="237" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">SSE</text>
  <text x="255" y="237" font-size="12" fill="#1f2b38" text-anchor="middle">服务端推（单向）</text>
  <text x="415" y="237" font-size="12" fill="#2e9e5b" text-anchor="middle">好</text>
  <text x="575" y="237" font-size="12" fill="#2e9e5b" text-anchor="middle">低</text>
  <text x="770" y="237" font-size="12" fill="#5b6b7c" text-anchor="middle">站内信、行情、监控</text>

  <text x="95" y="277" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">MQTT</text>
  <text x="255" y="277" font-size="12" fill="#1f2b38" text-anchor="middle">发布 / 订阅</text>
  <text x="415" y="277" font-size="12" fill="#2e9e5b" text-anchor="middle">好</text>
  <text x="575" y="277" font-size="12" fill="#2e9e5b" text-anchor="middle">低</text>
  <text x="770" y="277" font-size="12" fill="#5b6b7c" text-anchor="middle">物联网设备</text>

  <text x="95" y="317" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">WebSocket</text>
  <text x="255" y="317" font-size="12" fill="#1f2b38" text-anchor="middle">全双工</text>
  <text x="415" y="317" font-size="12" fill="#2e9e5b" text-anchor="middle">好</text>
  <text x="575" y="317" font-size="12" fill="#2e9e5b" text-anchor="middle">低</text>
  <text x="770" y="317" font-size="12" fill="#5b6b7c" text-anchor="middle">即时通信、游戏</text>

  <text x="95" y="357" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">第三方推送</text>
  <text x="255" y="357" font-size="12" fill="#1f2b38" text-anchor="middle">平台代发</text>
  <text x="415" y="357" font-size="12" fill="#2e9e5b" text-anchor="middle">好</text>
  <text x="575" y="357" font-size="12" fill="#2e9e5b" text-anchor="middle">低（托管）</text>
  <text x="770" y="357" font-size="12" fill="#5b6b7c" text-anchor="middle">短信、App 推送</text>
</svg>
