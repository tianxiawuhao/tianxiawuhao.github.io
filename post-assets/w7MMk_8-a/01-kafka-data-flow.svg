<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Kafka 生产者、Broker 与消费者组的数据流</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Kafka 生产者、Broker 与消费者组的数据流</text>

  <rect x="30" y="100" width="150" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="105" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2b38">Producer</text>
  <text x="105" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">按 topic/partition/key</text>
  <text x="105" y="164" text-anchor="middle" font-size="11" fill="#5b6b7c">序列化后批量发送</text>

  <line x1="180" y1="140" x2="216" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="220" y="60" width="400" height="210" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="242" y="84" font-size="12.5" font-weight="600" fill="#1f2b38">Broker 集群</text>

  <rect x="245" y="98" width="110" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="300" y="122" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2b38">Partition 0</text>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#2e9e5b">leader</text>

  <rect x="365" y="98" width="110" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="420" y="122" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2b38">Partition 1</text>
  <text x="420" y="140" text-anchor="middle" font-size="11" fill="#2e9e5b">leader</text>

  <rect x="485" y="98" width="110" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="540" y="122" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2b38">Partition 2</text>
  <text x="540" y="140" text-anchor="middle" font-size="11" fill="#2e9e5b">leader</text>

  <text x="420" y="184" text-anchor="middle" font-size="11" fill="#5b6b7c">一个 topic 划分为多个分区，分散在不同 broker</text>
  <text x="420" y="204" text-anchor="middle" font-size="11" fill="#5b6b7c">每个分区有副本：leader 负责读写，follower 同步</text>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#5b6b7c">ZooKeeper 选出 Controller，负责分区分配与 leader 选举</text>
  <text x="420" y="252" text-anchor="middle" font-size="11" fill="#5b6b7c">（2.x 及更早版本）</text>

  <line x1="620" y1="140" x2="656" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="660" y="60" width="210" height="210" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="678" y="84" font-size="12.5" font-weight="600" fill="#1f2b38">Consumer Group A</text>
  <rect x="678" y="98" width="174" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="765" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2b38">Consumer 1</text>
  <rect x="678" y="158" width="174" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="765" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2b38">Consumer 2</text>
  <text x="765" y="230" text-anchor="middle" font-size="11" fill="#5b6b7c">组内一个分区同一时刻</text>
  <text x="765" y="248" text-anchor="middle" font-size="11" fill="#5b6b7c">只被一个消费者消费</text>
</svg>
