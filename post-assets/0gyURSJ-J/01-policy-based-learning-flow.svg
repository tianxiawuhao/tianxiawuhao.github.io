<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>策略学习闭环流程图</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">策略学习：用策略梯度更新策略网络</text>
  <rect x="40" y="75" width="160" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="103" text-anchor="middle" font-size="13" fill="#1f2b38">状态 s_t</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">Agent 观察到的环境</text>
  <rect x="260" y="75" width="250" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="385" y="103" text-anchor="middle" font-size="13" fill="#1f2b38">策略网络 π(a|s;θ)</text>
  <text x="385" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">末层 Softmax 输出动作概率</text>
  <rect x="570" y="75" width="250" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="695" y="103" text-anchor="middle" font-size="13" fill="#1f2b38">动作概率分布 π(·|s_t)</text>
  <text x="695" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">各候选动作概率之和为 1</text>
  <line x1="200" y1="107" x2="254" y2="107" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="510" y1="107" x2="564" y2="107" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="200" width="200" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="140" y="228" text-anchor="middle" font-size="13" fill="#1f2b38">随机抽样动作 a_t</text>
  <text x="140" y="247" text-anchor="middle" font-size="11" fill="#5b6b7c">按概率采样后执行</text>
  <rect x="300" y="200" width="220" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="410" y="228" text-anchor="middle" font-size="13" fill="#1f2b38">环境返回回报</text>
  <text x="410" y="247" text-anchor="middle" font-size="11" fill="#5b6b7c">奖励与新状态 s_{t+1}</text>
  <rect x="580" y="200" width="240" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="700" y="228" text-anchor="middle" font-size="13" fill="#1f2b38">状态价值 V(s;θ)</text>
  <text x="700" y="247" text-anchor="middle" font-size="11" fill="#5b6b7c">衡量策略网络的好坏</text>
  <line x1="240" y1="232" x2="294" y2="232" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="520" y1="232" x2="574" y2="232" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 695 139 V 194" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="180" y="310" width="540" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="338" text-anchor="middle" font-size="13" fill="#1f2b38">策略梯度上升：θ ← θ + β · ∇θ V(s;θ)</text>
  <text x="450" y="357" text-anchor="middle" font-size="11" fill="#5b6b7c">沿策略梯度方向更新参数，让 V 越来越大</text>
  <path d="M 700 264 V 304" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 180 341 H 20 V 107 H 36" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="40" y="292" font-size="11" fill="#5b6b7c">更新后的 θ 用于下一轮决策，策略逐步变好</text>
</svg>
