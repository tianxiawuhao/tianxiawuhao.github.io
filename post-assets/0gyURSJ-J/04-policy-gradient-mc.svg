<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>策略梯度的两种等价形式与蒙特卡洛近似</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">策略梯度的两种等价形式与蒙特卡洛近似</text>
  <rect x="40" y="65" width="380" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">形式一：离散动作逐个求和</text>
  <text x="230" y="125" text-anchor="middle" font-size="11" fill="#1f2b38">∇θ J(θ) = Σa ∇θ π(a|s; θ) · Qπ(s, a)</text>
  <text x="230" y="158" text-anchor="middle" font-size="11" fill="#5b6b7c">只适用于离散动作空间</text>
  <rect x="480" y="65" width="380" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">形式二：写成策略分布的期望</text>
  <text x="670" y="125" text-anchor="middle" font-size="11" fill="#1f2b38">∇θ J(θ) = E[ ∇θ log π(A|s; θ) · Qπ(s, A) ]</text>
  <text x="670" y="158" text-anchor="middle" font-size="11" fill="#5b6b7c">离散、连续动作都适用，因此更常用</text>
  <path d="M 230 185 V 215 H 350 V 241" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 670 185 V 215 H 550 V 241" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="280" y="245" width="340" height="95" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">蒙特卡洛近似：按策略抽样一次 a_t</text>
  <text x="450" y="303" text-anchor="middle" font-size="11" fill="#1f2b38">g(a_t, θ) = ∇θ log π(a_t|s; θ) · Qπ(s_t, a_t)</text>
  <text x="450" y="327" text-anchor="middle" font-size="11" fill="#5b6b7c">E[g] 就是策略梯度：g 是无偏估计</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#5b6b7c">一次抽样即可算出 g，因此实践中几乎都用形式二加蒙特卡洛近似</text>
</svg>
