<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>REINFORCE 与 Actor-Critic 对比图</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">估计动作价值 Qπ 的两条路线</text>
  <rect x="40" y="60" width="390" height="270" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="65" y="80" width="340" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">REINFORCE：蒙特卡洛</text>
  <text x="70" y="155" font-size="12" fill="#1f2b38">· 用整条轨迹的实际回报估计 Qπ</text>
  <text x="70" y="190" font-size="12" fill="#1f2b38">· 需跑完一条 trajectory 才能更新一次</text>
  <text x="70" y="225" font-size="12" fill="#1f2b38">· 无偏估计，但方差大、收敛慢</text>
  <text x="70" y="260" font-size="12" fill="#1f2b38">· 不需要额外的价值网络，实现简单</text>
  <text x="70" y="300" font-size="11" fill="#5b6b7c">Q 的估计来自采样回报，不依赖 θ</text>
  <rect x="470" y="60" width="390" height="270" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="495" y="80" width="340" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Actor-Critic：价值网络</text>
  <text x="500" y="155" font-size="12" fill="#1f2b38">· 用另一个网络 Q(s,a;w) 近似 Qπ</text>
  <text x="500" y="190" font-size="12" fill="#1f2b38">· 单步即可更新，可在线学习</text>
  <text x="500" y="225" font-size="12" fill="#1f2b38">· 方差小、学习快，但存在偏差</text>
  <text x="500" y="260" font-size="12" fill="#1f2b38">· 需要额外训练 Critic 网络</text>
  <text x="500" y="300" font-size="11" fill="#5b6b7c">Critic 提供 Q，Actor 负责更新策略</text>
  <circle cx="450" cy="195" r="24" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">VS</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#5b6b7c">两种方法都用 g(a,θ)=∇θ log π(a|s;θ) · Q 更新策略网络，差别只在 Q 的估计方式</text>
</svg>
