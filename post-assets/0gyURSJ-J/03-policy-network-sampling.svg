<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>策略网络输出动作概率并随机抽样</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">策略网络的输出与随机抽样</text>
  <rect x="25" y="105" width="130" height="85" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">状态 s</text>
  <text x="90" y="165" text-anchor="middle" font-size="11" fill="#5b6b7c">如棋盘画面</text>
  <line x1="155" y1="147" x2="203" y2="147" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="205" y="105" width="215" height="85" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="312" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">策略网络 π(a|s; θ)</text>
  <text x="312" y="165" text-anchor="middle" font-size="11" fill="#5b6b7c">参数 θ 可训练</text>
  <line x1="420" y1="147" x2="468" y2="147" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="470" y="90" width="205" height="115" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="572" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Softmax 输出概率</text>
  <rect x="500" y="171" width="30" height="14" fill="#2f6fd0"/>
  <rect x="545" y="139" width="30" height="46" fill="#2f6fd0"/>
  <rect x="590" y="161" width="30" height="24" fill="#2f6fd0"/>
  <text x="515" y="199" text-anchor="middle" font-size="11" fill="#5b6b7c">a1 0.1</text>
  <text x="560" y="199" text-anchor="middle" font-size="11" fill="#5b6b7c">a2 0.6</text>
  <text x="605" y="199" text-anchor="middle" font-size="11" fill="#5b6b7c">a3 0.3</text>
  <line x1="675" y1="147" x2="723" y2="147" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="725" y="105" width="150" height="85" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="800" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">随机抽样</text>
  <text x="800" y="165" text-anchor="middle" font-size="12" fill="#5b6b7c">执行动作 a2</text>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#5b6b7c">离散动作：最后一层用 Softmax，各概率之和为 1；连续动作：输出高斯分布的 μ 与 σ 后采样</text>
</svg>
