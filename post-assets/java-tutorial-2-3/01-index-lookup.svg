<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>InnoDB 二级索引查询时的回表与覆盖索引</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">InnoDB 二级索引查询：回表与覆盖索引</text>

  <rect x="40" y="70" width="300" height="180" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">二级索引 idx_name（name, id）</text>
  <rect x="60" y="115" width="260" height="42" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="190" y="141" text-anchor="middle" font-size="12" fill="#1f2b38">叶子：tom → id = 1001</text>
  <rect x="60" y="175" width="260" height="42" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="190" y="201" text-anchor="middle" font-size="12" fill="#1f2b38">叶子：jerry → id = 1002</text>

  <rect x="560" y="70" width="300" height="180" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="710" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">聚簇索引（主键，叶子存整行）</text>
  <rect x="580" y="115" width="260" height="42" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="710" y="141" text-anchor="middle" font-size="12" fill="#1f2b38">id = 1001 → 整行数据</text>
  <rect x="580" y="175" width="260" height="42" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="710" y="201" text-anchor="middle" font-size="12" fill="#1f2b38">id = 1002 → 整行数据</text>

  <line x1="345" y1="160" x2="552" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="448" y="150" text-anchor="middle" font-size="12" fill="#5b6b7c">回表：拿 id 再查一次</text>

  <line x1="40" y1="285" x2="860" y2="285" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="315" text-anchor="middle" font-size="12" fill="#1f2b38">二级索引叶子只存索引列 + 主键，取其他列必须回聚簇索引再查一次，共 2 次查找</text>
  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#1f2b38">覆盖索引：SELECT 的列全在索引里就不用回表，EXPLAIN 的 Extra 显示 Using index</text>
  <text x="450" y="375" text-anchor="middle" font-size="12" fill="#e08a1e">组合索引不满足最左前缀时可能完全用不上，仍会退化成全表扫描</text>
</svg>
