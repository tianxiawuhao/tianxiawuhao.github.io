<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四种事务隔离级别与三类并发读问题</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">四种隔离级别与三类并发读问题</text>

  <rect x="40" y="55" width="820" height="40" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">隔离级别</text>
  <text x="380" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">脏读</text>
  <text x="540" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">不可重复读</text>
  <text x="700" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">幻读</text>
  <text x="820" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">谁在用</text>

  <rect x="40" y="95" width="820" height="55" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="118" text-anchor="middle" font-size="11" fill="#1f2b38">READ UNCOMMITTED</text>
  <text x="170" y="138" text-anchor="middle" font-size="12" fill="#5b6b7c">读未提交</text>
  <text x="380" y="128" text-anchor="middle" font-size="12" fill="#e08a1e">可能</text>
  <text x="540" y="128" text-anchor="middle" font-size="12" fill="#e08a1e">可能</text>
  <text x="700" y="128" text-anchor="middle" font-size="12" fill="#e08a1e">可能</text>
  <text x="820" y="128" text-anchor="middle" font-size="12" fill="#5b6b7c">—</text>

  <rect x="40" y="150" width="820" height="55" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="173" text-anchor="middle" font-size="11" fill="#1f2b38">READ COMMITTED</text>
  <text x="170" y="193" text-anchor="middle" font-size="12" fill="#5b6b7c">读已提交</text>
  <text x="380" y="183" text-anchor="middle" font-size="12" fill="#2e9e5b">避免</text>
  <text x="540" y="183" text-anchor="middle" font-size="12" fill="#e08a1e">可能</text>
  <text x="700" y="183" text-anchor="middle" font-size="12" fill="#e08a1e">可能</text>
  <text x="820" y="183" text-anchor="middle" font-size="12" fill="#5b6b7c">Oracle</text>

  <rect x="40" y="205" width="820" height="55" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="228" text-anchor="middle" font-size="11" fill="#1f2b38">REPEATABLE READ</text>
  <text x="170" y="248" text-anchor="middle" font-size="12" fill="#5b6b7c">可重复读</text>
  <text x="380" y="238" text-anchor="middle" font-size="12" fill="#2e9e5b">避免</text>
  <text x="540" y="238" text-anchor="middle" font-size="12" fill="#2e9e5b">避免</text>
  <text x="700" y="238" text-anchor="middle" font-size="12" fill="#2e9e5b">避免 *</text>
  <text x="820" y="238" text-anchor="middle" font-size="12" fill="#5b6b7c">MySQL</text>

  <rect x="40" y="260" width="820" height="55" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="283" text-anchor="middle" font-size="11" fill="#1f2b38">SERIALIZABLE</text>
  <text x="170" y="303" text-anchor="middle" font-size="12" fill="#5b6b7c">串行化</text>
  <text x="380" y="293" text-anchor="middle" font-size="12" fill="#2e9e5b">避免</text>
  <text x="540" y="293" text-anchor="middle" font-size="12" fill="#2e9e5b">避免</text>
  <text x="700" y="293" text-anchor="middle" font-size="12" fill="#2e9e5b">避免</text>
  <text x="820" y="293" text-anchor="middle" font-size="12" fill="#7a5bd0">事务排队</text>

  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#5b6b7c">* 标准 SQL 允许可重复读出现幻读；InnoDB 用间隙锁挡住了它，代价是更容易死锁</text>
  <text x="450" y="378" text-anchor="middle" font-size="12" fill="#5b6b7c">级别越低并发越好、隔离越弱：串行化最安全但最慢，读未提交最快但会脏读</text>
</svg>
