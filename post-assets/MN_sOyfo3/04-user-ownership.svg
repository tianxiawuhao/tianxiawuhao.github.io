<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>jenkins 服务用户与三个数据目录的属主关系</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">服务用户与数据目录的归属关系</text>

  <rect x="60" y="120" width="220" height="96" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="152" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">jenkins 用户</text>
  <text x="170" y="174" font-size="11" fill="#5b6b7c" text-anchor="middle">安装时由 RPM 自动创建</text>
  <text x="170" y="194" font-size="11" fill="#5b6b7c" text-anchor="middle">守护进程以该身份运行</text>

  <rect x="470" y="70" width="380" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="486" y="92" font-size="13" font-weight="700" fill="#1f2b38">/var/lib/jenkins</text>
  <text x="486" y="111" font-size="11" fill="#5b6b7c">任务配置、插件、初始密码文件</text>

  <rect x="470" y="142" width="380" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="486" y="164" font-size="13" font-weight="700" fill="#1f2b38">/var/log/jenkins</text>
  <text x="486" y="183" font-size="11" fill="#5b6b7c">运行日志与构建输出</text>

  <rect x="470" y="214" width="380" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="486" y="236" font-size="13" font-weight="700" fill="#1f2b38">/var/cache/jenkins</text>
  <text x="486" y="255" font-size="11" fill="#5b6b7c">运行缓存</text>

  <rect x="470" y="284" width="380" height="26" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="660" y="302" font-size="11" fill="#1f2b38" text-anchor="middle">改变服务所有者时，这三处目录属主需同步修改</text>

  <path d="M 280 168 H 360" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M 360 96 V 240" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M 360 96 H 464" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 360 168 H 464" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 360 240 H 464" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
