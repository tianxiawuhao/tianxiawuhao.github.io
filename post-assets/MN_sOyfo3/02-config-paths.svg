<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Jenkins 服务单元与配置文件目录对应关系</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Jenkins 服务单元与配置文件、目录速查</text>

  <rect x="50" y="150" width="240" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="182" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">jenkins.service</text>
  <text x="170" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">systemd 服务单元</text>
  <text x="170" y="226" font-size="11" fill="#5b6b7c" text-anchor="middle">systemctl start / stop / status</text>

  <rect x="470" y="80" width="380" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="486" y="104" font-size="13" font-weight="700" fill="#1f2b38">/etc/sysconfig/jenkins</text>
  <text x="486" y="124" font-size="11" fill="#5b6b7c">JENKINS_PORT：服务监听端口</text>

  <rect x="470" y="154" width="380" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="486" y="178" font-size="13" font-weight="700" fill="#1f2b38">/var/lib/jenkins</text>
  <text x="486" y="198" font-size="11" fill="#5b6b7c">JENKINS_HOME：任务、插件、secrets/initialAdminPassword</text>

  <rect x="470" y="228" width="380" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="486" y="252" font-size="13" font-weight="700" fill="#1f2b38">/var/log/jenkins</text>
  <text x="486" y="272" font-size="11" fill="#5b6b7c">运行日志与构建输出</text>

  <rect x="470" y="302" width="380" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="486" y="326" font-size="13" font-weight="700" fill="#1f2b38">/var/cache/jenkins</text>
  <text x="486" y="346" font-size="11" fill="#5b6b7c">运行缓存，可安全清理但会拖慢首次启动</text>

  <path d="M 290 200 H 380" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M 380 108 V 330" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M 380 108 H 466" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 380 182 H 466" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 380 256 H 466" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 380 330 H 466" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
