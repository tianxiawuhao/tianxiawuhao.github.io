<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Jenkins yum 安装部署流程</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Jenkins（yum 安装）部署流程</text>

  <rect x="40" y="100" width="140" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="110" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">① 安装 JDK</text>
  <text x="110" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">yum install -y java</text>

  <rect x="210" y="100" width="140" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="280" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">② 添加 yum 源</text>
  <text x="280" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">安装 jenkins 包</text>

  <rect x="380" y="100" width="140" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">③ 修改端口</text>
  <text x="450" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">JENKINS_PORT</text>

  <rect x="550" y="100" width="140" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="620" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">④ 启动服务</text>
  <text x="620" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">systemctl start</text>

  <rect x="720" y="100" width="140" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="790" y="130" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">⑤ 解锁初始化</text>
  <text x="790" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">输入初始密码</text>

  <line x1="182" y1="136" x2="206" y2="136" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="352" y1="136" x2="376" y2="136" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="522" y1="136" x2="546" y2="136" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="692" y1="136" x2="716" y2="136" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="206" width="820" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="234" font-size="12" fill="#5b6b7c">默认监听端口为 8080，本文改为 9000；启动后用浏览器访问 http://服务器IP:9000/ 进行解锁。</text>
  <text x="60" y="256" font-size="12" fill="#5b6b7c">初始密码位于 /var/lib/jenkins/secrets/initialAdminPassword，解锁后按提示安装插件并创建管理员账号。</text>
</svg>
