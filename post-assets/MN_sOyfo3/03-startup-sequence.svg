<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Jenkins 启动到初始化的五个状态</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">从启动服务到完成初始化的状态顺序</text>

  <rect x="60" y="80" width="200" height="86" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="112" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">启动服务</text>
  <text x="160" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">systemctl start jenkins</text>
  <text x="160" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">systemctl enable jenkins</text>

  <rect x="350" y="80" width="200" height="86" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="112" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">确认监听端口</text>
  <text x="450" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">netstat -nultp</text>
  <text x="450" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">或 ss -nultp</text>

  <rect x="640" y="80" width="200" height="86" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="740" y="112" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">浏览器访问</text>
  <text x="740" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">http://服务器IP:9000/</text>
  <text x="740" y="152" font-size="11" fill="#5b6b7c" text-anchor="middle">页面提示需要解锁</text>

  <rect x="350" y="230" width="200" height="86" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="262" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">读取初始密码</text>
  <text x="450" y="284" font-size="11" fill="#5b6b7c" text-anchor="middle">/var/lib/jenkins/secrets/</text>
  <text x="450" y="302" font-size="11" fill="#5b6b7c" text-anchor="middle">initialAdminPassword</text>

  <rect x="640" y="230" width="200" height="86" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="740" y="262" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">安装插件建管理员</text>
  <text x="740" y="284" font-size="11" fill="#5b6b7c" text-anchor="middle">选择推荐插件</text>
  <text x="740" y="302" font-size="11" fill="#5b6b7c" text-anchor="middle">创建管理员账号后即可使用</text>

  <path d="M 260 123 H 344" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 550 123 H 634" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 740 166 V 224" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 634 273 H 556" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
