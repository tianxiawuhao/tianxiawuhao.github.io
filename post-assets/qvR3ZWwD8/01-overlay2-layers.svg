<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">overlay2 分层结构与磁盘空间占用来源</text>

  <rect x="36" y="60" width="400" height="460" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="236" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">容器看到的联合挂载视图</text>

  <rect x="66" y="104" width="340" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="236" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">merged 联合挂载视图</text>
  <text x="236" y="147" text-anchor="middle" font-size="11" fill="#5b6b7c">容器内的 / 由各层合并而成，本身不额外占用空间</text>

  <rect x="66" y="174" width="340" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="236" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">容器可写层（rw / upperdir）</text>
  <text x="236" y="217" text-anchor="middle" font-size="11" fill="#5b6b7c">落盘在 overlay2/&lt;id&gt;/diff，容器所有写入都在这里</text>

  <rect x="66" y="244" width="340" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="236" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">镜像层 N（只读 lowerdir）</text>
  <text x="236" y="287" text-anchor="middle" font-size="11" fill="#5b6b7c">共享给所有使用该镜像的容器，只存一份</text>

  <rect x="66" y="314" width="340" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="236" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">…… 更多只读镜像层 ……</text>
  <text x="236" y="357" text-anchor="middle" font-size="11" fill="#5b6b7c">每一层对应 overlay2/&lt;layer-id&gt;/diff 一个目录</text>

  <rect x="66" y="384" width="340" height="54" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="236" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">基础镜像层（FROM，只读）</text>
  <text x="236" y="427" text-anchor="middle" font-size="11" fill="#5b6b7c">上层改动以增量方式叠加，不修改下层</text>

  <text x="66" y="466" font-size="11" fill="#5b6b7c">• 每层一个目录：overlay2/&lt;id&gt;/{diff, link, lower, merged}</text>
  <text x="66" y="488" font-size="11" fill="#5b6b7c">• 删除文件只在当前层打白障标记，下层数据仍占空间</text>

  <rect x="464" y="60" width="400" height="460" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="664" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">磁盘空间占用来源</text>

  <rect x="484" y="104" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="500" y="125" font-size="12" font-weight="700" fill="#1f2b38">容器日志 containers/&lt;id&gt;/&lt;id&gt;-json.log</text>
  <text x="500" y="144" font-size="11" fill="#5b6b7c">json-file 默认不轮转，可涨到几十 GB</text>

  <rect x="484" y="166" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="500" y="187" font-size="12" font-weight="700" fill="#1f2b38">停止的容器与悬空镜像</text>
  <text x="500" y="206" font-size="11" fill="#5b6b7c">docker system prune / image prune</text>

  <rect x="484" y="228" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="500" y="249" font-size="12" font-weight="700" fill="#1f2b38">构建缓存 Build Cache</text>
  <text x="500" y="268" font-size="11" fill="#5b6b7c">docker builder prune 回收</text>

  <rect x="484" y="290" width="360" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="500" y="311" font-size="12" font-weight="700" fill="#1f2b38">容器可写层写放大</text>
  <text x="500" y="330" font-size="11" fill="#5b6b7c">docker ps -s 查看每个容器 SIZE</text>

  <rect x="484" y="352" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="500" y="373" font-size="12" font-weight="700" fill="#1f2b38">数据卷 volumes/</text>
  <text x="500" y="392" font-size="11" fill="#5b6b7c">docker volume prune 前务必确认无业务数据</text>

  <rect x="484" y="414" width="360" height="50" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="500" y="435" font-size="12" font-weight="700" fill="#1f2b38">已删除但被进程持有的文件</text>
  <text x="500" y="454" font-size="11" fill="#5b6b7c">lsof +L1 可见 deleted 记录，需重启进程</text>

  <text x="484" y="488" font-size="11" fill="#5b6b7c">• docker system df -v 列出每类资源明细</text>
  <text x="484" y="508" font-size="11" fill="#5b6b7c">• du -sh /var/lib/docker/* 快速定位大头</text>

  <polyline points="406,201 446,201 446,315 478,315" fill="none" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="36" y="536" width="828" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="450" y="561" text-anchor="middle" font-size="12" fill="#1f2b38">以上数据默认都写在 data-root（默认 /var/lib/docker）所在分区，把 data-root 迁到数据盘即可整体换盘</text>
</svg>
