<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>大文件切片上传与断点续传的五个环节</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">大文件切片上传与断点续传</text>
  <g fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4">
    <rect x="26" y="90" width="152" height="100" rx="8"/>
    <rect x="200" y="90" width="152" height="100" rx="8"/>
    <rect x="374" y="90" width="152" height="100" rx="8"/>
  </g>
  <g fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4">
    <rect x="548" y="90" width="152" height="100" rx="8"/>
    <rect x="722" y="90" width="152" height="100" rx="8"/>
  </g>
  <g fill="#1f2b38" font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="102" y="122">① slice 切片</text>
    <text x="276" y="122">② 断点记录</text>
    <text x="450" y="122">③ 分片上传</text>
    <text x="624" y="122">④ 服务端落盘</text>
    <text x="798" y="122">⑤ merge 合并</text>
  </g>
  <g fill="#1f2b38" font-size="11" text-anchor="middle">
    <text x="102" y="150">file.slice()</text><text x="102" y="170">每片 5MB</text>
    <text x="276" y="150">读已传分片集合</text><text x="276" y="170">localStorage / 服务端</text>
    <text x="450" y="150">POST /upload/chunk</text><text x="450" y="170">context + 序号 + 总数</text>
    <text x="624" y="150">按 context 建目录</text><text x="624" y="170">分片独立落文件</text>
    <text x="798" y="150">按序号排序后追加</text><text x="798" y="170">输出文件并清分片</text>
  </g>
  <g stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="182" y1="140" x2="196" y2="140"/>
    <line x1="356" y1="140" x2="370" y2="140"/>
    <line x1="530" y1="140" x2="544" y2="140"/>
    <line x1="704" y1="140" x2="718" y2="140"/>
  </g>
  <rect x="26" y="240" width="410" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="231" y="272" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">坑 1：合并不能依赖到达顺序</text>
  <text x="231" y="302" font-size="11.5" fill="#1f2b38" text-anchor="middle">并发上传时请求到达顺序本来就是乱的，</text>
  <text x="231" y="324" font-size="11.5" fill="#1f2b38" text-anchor="middle">必须先按分片序号排序，再顺序追加。</text>
  <rect x="464" y="240" width="410" height="96" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="669" y="272" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">坑 2：分片必须有有效期</text>
  <text x="669" y="302" font-size="11.5" fill="#1f2b38" text-anchor="middle">客户端迟迟不调 merge 时，定时任务要清理碎片，</text>
  <text x="669" y="324" font-size="11.5" fill="#1f2b38" text-anchor="middle">否则磁盘会被垃圾分片慢慢吃满。</text>
  <text x="450" y="372" font-size="12" fill="#5b6b7c" text-anchor="middle">断点续传 = 记录已成功的分片，下次只传没传过的</text>
</svg>
