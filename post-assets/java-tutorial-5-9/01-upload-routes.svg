<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>文件上传的三条技术路线：表单直传、切片续传与对象存储</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">文件上传的三条技术路线</text>
  <rect x="50" y="70" width="250" height="170" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="175" y="102" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">小文件：表单直传</text>
  <text x="175" y="138" font-size="12" fill="#1f2b38" text-anchor="middle">POST + multipart/form-data</text>
  <text x="175" y="166" font-size="12" fill="#1f2b38" text-anchor="middle">MultipartFile / FileItem 解析</text>
  <text x="175" y="194" font-size="12" fill="#1f2b38" text-anchor="middle">sizeThreshold 决定落盘时机</text>
  <text x="175" y="222" font-size="11.5" fill="#5b6b7c" text-anchor="middle">适合 10MB 以内的文件</text>
  <rect x="325" y="70" width="250" height="170" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="102" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">大文件：切片续传</text>
  <text x="450" y="138" font-size="12" fill="#1f2b38" text-anchor="middle">Blob.slice() 切成固定分片</text>
  <text x="450" y="166" font-size="12" fill="#1f2b38" text-anchor="middle">context + 分片序号 + 总数</text>
  <text x="450" y="194" font-size="12" fill="#1f2b38" text-anchor="middle">失败只重传单片，按序合并</text>
  <text x="450" y="222" font-size="11.5" fill="#5b6b7c" text-anchor="middle">适合百 MB 级大文件</text>
  <rect x="600" y="70" width="250" height="170" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="725" y="102" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="middle">海量 / 多机：对象存储</text>
  <text x="725" y="138" font-size="12" fill="#1f2b38" text-anchor="middle">MinIO / OSS / 七牛云</text>
  <text x="725" y="166" font-size="12" fill="#1f2b38" text-anchor="middle">putObject 内部自动分片</text>
  <text x="725" y="194" font-size="12" fill="#1f2b38" text-anchor="middle">库里只存 object key</text>
  <text x="725" y="222" font-size="11.5" fill="#5b6b7c" text-anchor="middle">多台应用服务器必选</text>
  <rect x="50" y="272" width="800" height="78" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="304" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">共同底线：限制大小 · 类型白名单 · 文件名唯一 · 存储目录不可直接访问</text>
  <text x="450" y="332" font-size="12" fill="#5b6b7c" text-anchor="middle">AK/SK、uploadToken 属于密钥，必须外置配置；新项目优先云存储 + 临时凭证直传</text>
</svg>
