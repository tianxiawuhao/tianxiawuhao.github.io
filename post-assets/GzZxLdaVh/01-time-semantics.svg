<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 中的三种时间语义</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Flink 中的三种时间语义</text>

  <line x1="60" y1="112" x2="850" y2="112" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="800" y="96" text-anchor="middle" font-size="11" fill="#5b6b7c">真实时间</text>

  <circle cx="180" cy="112" r="6" fill="#2f6fd0"/>
  <text x="180" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">① 事件产生</text>
  <circle cx="430" cy="112" r="6" fill="#7a5bd0"/>
  <text x="430" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5bd0">② 进入 Flink</text>
  <circle cx="680" cy="112" r="6" fill="#e08a1e"/>
  <text x="680" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">③ 算子处理</text>

  <line x1="180" y1="118" x2="180" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="430" y1="118" x2="430" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="680" y1="118" x2="680" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="162" width="260" height="144" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Event Time（事件时间）</text>
  <text x="60" y="216" font-size="11" fill="#5b6b7c">事件创建的时间，由数据的时间戳描述</text>
  <text x="60" y="240" font-size="11" fill="#5b6b7c">与机器、到达顺序无关，结果可重现</text>
  <text x="60" y="264" font-size="11" fill="#5b6b7c">乱序数据需配合 Watermark 使用</text>
  <text x="60" y="288" font-size="11" fill="#5b6b7c">Flink 1.12 起为默认时间语义</text>

  <rect x="320" y="162" width="260" height="144" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Ingestion Time（摄入时间）</text>
  <text x="340" y="216" font-size="11" fill="#5b6b7c">数据进入 Flink 时打上的时间戳</text>
  <text x="340" y="240" font-size="11" fill="#5b6b7c">比处理时间稳定，无法反映真实顺序</text>
  <text x="340" y="264" font-size="11" fill="#5b6b7c">介于事件时间与处理时间之间</text>
  <text x="340" y="288" font-size="11" fill="#5b6b7c">实际业务中使用较少</text>

  <rect x="600" y="162" width="260" height="144" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="730" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Processing Time（处理时间）</text>
  <text x="620" y="216" font-size="11" fill="#5b6b7c">执行算子的机器本地系统时间</text>
  <text x="620" y="240" font-size="11" fill="#5b6b7c">实现简单、延迟最低</text>
  <text x="620" y="264" font-size="11" fill="#5b6b7c">结果不可重现，无法处理历史数据</text>
  <text x="620" y="288" font-size="11" fill="#5b6b7c">Flink 1.12 之前为默认时间语义</text>
</svg>
