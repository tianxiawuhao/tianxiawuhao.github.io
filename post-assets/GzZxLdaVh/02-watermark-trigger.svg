<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Watermark 触发窗口示意</title>
  <rect width="900" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Watermark 触发窗口示意（允许延迟 2s）</text>
  <text x="740" y="48" text-anchor="end" font-size="11" fill="#5b6b7c">圆点 = 数据事件（数字为事件时间戳）</text>

  <rect x="80" y="60" width="279" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="219" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">窗口1 [0s, 5s)</text>
  <rect x="359" y="60" width="278" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="498" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">窗口2 [5s, 10s)</text>

  <line x1="359" y1="52" x2="359" y2="232" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="637" y1="52" x2="637" y2="232" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>

  <line x1="70" y1="200" x2="860" y2="200" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="80" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">0s</text>
  <text x="856" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">14s</text>

  <circle cx="136" cy="200" r="5" fill="#2f6fd0"/>
  <text x="136" y="186" text-anchor="middle" font-size="11" fill="#1f2b38">1s</text>
  <circle cx="247" cy="200" r="5" fill="#2f6fd0"/>
  <text x="247" y="186" text-anchor="middle" font-size="11" fill="#1f2b38">3s</text>
  <circle cx="470" cy="200" r="5" fill="#e08a1e"/>
  <text x="470" y="186" text-anchor="middle" font-size="11" fill="#1f2b38">7s</text>
  <circle cx="526" cy="200" r="5" fill="#2f6fd0"/>
  <text x="526" y="186" text-anchor="middle" font-size="11" fill="#1f2b38">8s</text>
  <circle cx="749" cy="200" r="5" fill="#2e9e5b"/>
  <text x="749" y="186" text-anchor="middle" font-size="11" fill="#1f2b38">12s</text>

  <line x1="470" y1="208" x2="470" y2="256" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="749" y1="208" x2="749" y2="256" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="270" y="258" width="330" height="68" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="435" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">事件 7s 到达</text>
  <text x="435" y="298" text-anchor="middle" font-size="11" fill="#5b6b7c">WM = 7s - 2s = 5s</text>
  <text x="435" y="316" text-anchor="middle" font-size="11" fill="#5b6b7c">WM=5s 触发窗口1 [0s,5s)</text>

  <rect x="620" y="258" width="260" height="68" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">事件 12s 到达</text>
  <text x="750" y="298" text-anchor="middle" font-size="11" fill="#5b6b7c">WM = 12s - 2s = 10s</text>
  <text x="750" y="316" text-anchor="middle" font-size="11" fill="#5b6b7c">WM=10s 触发窗口2 [5s,10s)</text>

  <text x="450" y="350" text-anchor="middle" font-size="11" fill="#5b6b7c">水位线单调递增：只有新的 Watermark 大于旧值，才会被插入到流中</text>
</svg>
