<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>BeanUtils.copyProperties 浅拷贝陷阱：参数顺序、日期类型转换失败与嵌套对象共享引用</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">BeanUtils.copyProperties 浅拷贝与嵌套对象陷阱</text>

  <rect x="40" y="60" width="330" height="112" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="86" font-size="12" font-weight="700" fill="#2f6fd0">源对象 source</text>
  <text x="60" y="110" font-size="12" fill="#1f2b38">name = "张三"</text>
  <text x="60" y="132" font-size="12" fill="#1f2b38">address → 堆上 Address 实例 A</text>
  <text x="60" y="154" font-size="11" fill="#5b6b7c">address 字段本身只是一个引用</text>

  <rect x="530" y="60" width="330" height="112" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="550" y="86" font-size="12" font-weight="700" fill="#2e9e5b">目标对象 target</text>
  <text x="550" y="110" font-size="12" fill="#1f2b38">name = "张三"（值拷贝，安全）</text>
  <text x="550" y="132" font-size="12" fill="#1f2b38">address → 同一个实例 A</text>
  <text x="550" y="154" font-size="11" fill="#5b6b7c">两个对象共用一份嵌套数据</text>

  <line x1="370" y1="112" x2="524" y2="112" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="447" y="102" text-anchor="middle" font-size="11" fill="#2f6fd0">只复制引用</text>
  <text x="447" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">不新建嵌套对象</text>

  <rect x="180" y="196" width="540" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="200" y="222" font-size="12" font-weight="700" fill="#e08a1e">后果</text>
  <text x="200" y="246" font-size="12" fill="#1f2b38">target.getAddress().setCity("上海") 之后，source 的 address 也跟着变成「上海」</text>
  <text x="200" y="268" font-size="12" fill="#1f2b38">传给下游方法后如果被修改，源对象会被「隔空篡改」，排查成本很高</text>

  <rect x="40" y="304" width="400" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="330" font-size="13" font-weight="700" fill="#1f2b38">易错点一：参数顺序</text>
  <text x="60" y="356" font-size="12" fill="#1f2b38">Spring：copyProperties(源, 目标)</text>
  <text x="60" y="378" font-size="12" fill="#2e9e5b">Apache Commons：copyProperties(目标, 源)</text>
  <text x="60" y="400" font-size="11" fill="#5b6b7c">两者参数顺序相反，写反会静默失败：</text>
  <text x="60" y="420" font-size="11" fill="#5b6b7c">目标里没有对应可写属性时不会报错，</text>
  <text x="60" y="440" font-size="11" fill="#5b6b7c">只是复制不出来，务必单元测试断言字段值</text>

  <rect x="460" y="304" width="400" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="330" font-size="13" font-weight="700" fill="#1f2b38">易错点二：类型不匹配与 null</text>
  <text x="480" y="356" font-size="12" fill="#1f2b38">名称相同但类型不同 → 抛异常并中止</text>
  <text x="480" y="378" font-size="11" fill="#5b6b7c">典型场景：String 与 Date 同名字段，</text>
  <text x="480" y="398" font-size="11" fill="#5b6b7c">FatalBeanException 包装 TypeMismatchException</text>
  <text x="480" y="420" font-size="11" fill="#5b6b7c">源属性为 null 时覆盖目标原值（JDK 字段也会被写）</text>
  <text x="480" y="440" font-size="11" fill="#5b6b7c">需要跳过 null 时用自定义 ignoreProperties 或手写赋值</text>
</svg>
