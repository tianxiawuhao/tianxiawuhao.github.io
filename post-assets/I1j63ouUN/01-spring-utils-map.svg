<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring 自带工具类按用途分类：校验断言、对象与集合、资源与 IO、反射与 AOP、属性拷贝、计时与编码</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Spring 自带工具类速查（按用途分类）</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#5b6b7c">全部位于 org.springframework.util 与 org.springframework.beans 包下，无需额外依赖</text>

  <rect x="40" y="96" width="250" height="128" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="124" font-size="13" font-weight="700" fill="#2f6fd0">校验与断言</text>
  <text x="60" y="150" font-size="12" fill="#1f2b38">Assert</text>
  <text x="60" y="172" font-size="11" fill="#5b6b7c">参数合法性检查</text>
  <text x="60" y="194" font-size="11" fill="#5b6b7c">抛 IllegalArgumentException</text>
  <text x="60" y="214" font-size="11" fill="#5b6b7c">与 JDK 的 assert 关键字不同</text>

  <rect x="325" y="96" width="250" height="128" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="345" y="124" font-size="13" font-weight="700" fill="#2e9e5b">对象、数组、集合</text>
  <text x="345" y="150" font-size="12" fill="#1f2b38">ObjectUtils / StringUtils</text>
  <text x="345" y="172" font-size="12" fill="#1f2b38">CollectionUtils / ClassUtils</text>
  <text x="345" y="194" font-size="11" fill="#5b6b7c">判空、取值、类型与属性查询</text>
  <text x="345" y="214" font-size="11" fill="#5b6b7c">空值安全的写法优先选它们</text>

  <rect x="610" y="96" width="250" height="128" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="630" y="124" font-size="13" font-weight="700" fill="#e08a1e">资源与 IO 流</text>
  <text x="630" y="150" font-size="12" fill="#1f2b38">ResourceUtils / FileCopyUtils</text>
  <text x="630" y="172" font-size="12" fill="#1f2b38">StreamUtils</text>
  <text x="630" y="194" font-size="11" fill="#5b6b7c">读写文件、流拷贝与排空</text>
  <text x="630" y="214" font-size="11" fill="#5b6b7c">jar 包内资源不要用 getFile</text>

  <rect x="40" y="252" width="250" height="128" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="60" y="256" font-size="13" font-weight="700" fill="#7a5bd0">反射与 AOP</text>
  <text x="60" y="282" font-size="12" fill="#1f2b38">ReflectionUtils / AopUtils</text>
  <text x="60" y="304" font-size="12" fill="#1f2b38">AopContext</text>
  <text x="60" y="326" font-size="11" fill="#5b6b7c">查找并调用方法、读写字段</text>
  <text x="60" y="346" font-size="11" fill="#5b6b7c">判断代理类型与目标类</text>

  <rect x="325" y="252" width="250" height="128" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="345" y="256" font-size="13" font-weight="700" fill="#2f6fd0">属性拷贝</text>
  <text x="345" y="282" font-size="12" fill="#1f2b38">BeanUtils</text>
  <text x="345" y="304" font-size="11" fill="#5b6b7c">copyProperties(源, 目标)</text>
  <text x="345" y="326" font-size="11" fill="#5b6b7c">浅拷贝：嵌套对象仍共用引用</text>
  <text x="345" y="346" font-size="11" fill="#5b6b7c">见后文陷阱示意图</text>

  <rect x="610" y="252" width="250" height="128" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="630" y="256" font-size="13" font-weight="700" fill="#2e9e5b">计时与注解</text>
  <text x="630" y="282" font-size="12" fill="#1f2b38">StopWatch</text>
  <text x="630" y="304" font-size="12" fill="#1f2b38">AnnotationUtils</text>
  <text x="630" y="326" font-size="11" fill="#5b6b7c">多段耗时统计，输出可读报表</text>
  <text x="630" y="346" font-size="11" fill="#5b6b7c">查找合并注解与元注解属性</text>

  <rect x="40" y="404" width="820" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="432" font-size="13" font-weight="700" fill="#2f6fd0">选择建议</text>
  <text x="60" y="458" font-size="12" fill="#1f2b38">参数校验 / 快速失败用 Assert，对象判空优先 ObjectUtils.isEmpty，字符串判空优先 StringUtils.hasText</text>
  <text x="60" y="482" font-size="12" fill="#1f2b38">同一对象内的属性复制用 BeanUtils.copyProperties，深度拷贝请显式 clone 或序列化，不要依赖工具类</text>
</svg>
