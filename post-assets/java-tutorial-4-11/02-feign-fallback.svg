<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Feign 声明式调用的链路与熔断降级</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Feign 把远程调用写成接口：代理 → 负载均衡 → 熔断降级</text>
  <rect x="55" y="85" width="160" height="105" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="135" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">消费方 Controller</text>
  <text x="135" y="145" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">调用接口方法</text>
  <text x="135" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">orderService.getById</text>
  <rect x="265" y="85" width="160" height="105" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="345" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Feign 动态代理</text>
  <text x="345" y="145" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">扫描 @FeignClient 接口</text>
  <text x="345" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">按注解拼出请求地址</text>
  <rect x="475" y="85" width="160" height="105" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="555" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">负载均衡选实例</text>
  <text x="555" y="145" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">Ribbon / LoadBalancer</text>
  <text x="555" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">从注册中心取列表</text>
  <rect x="685" y="85" width="160" height="105" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="765" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">提供者实例</text>
  <text x="765" y="145" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">8081 · 8082 · 8083</text>
  <text x="765" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">执行并返回结果</text>
  <path d="M 215 137 H 265" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 425 137 H 475" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 635 137 H 685" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="265" y="265" width="400" height="95" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="465" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">熔断降级 fallback</text>
  <text x="465" y="323" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">失败率超阈值 → 断路器打开，不再发起真实调用</text>
  <text x="465" y="346" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">返回兜底值，恢复后进入半开状态试探</text>
  <path d="M 765 190 V 312 H 665" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="715" y="302" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">失败 / 超时</text>
</svg>
