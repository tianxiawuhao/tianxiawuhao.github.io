<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>注册中心与配置中心的分工</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">注册中心管「人在哪」，配置中心管「怎么干活」</text>
  <rect x="30" y="95" width="210" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="135" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务提供者 Provider</text>
  <text x="135" y="152" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">启动即注册 · 每 30 秒心跳</text>
  <text x="135" y="175" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">实例 192.168.1.10:8081</text>
  <rect x="345" y="80" width="210" height="140" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">注册中心</text>
  <text x="450" y="137" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Eureka Server / Nacos</text>
  <text x="450" y="160" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">维护服务注册表</text>
  <text x="450" y="183" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">90 秒无心跳即剔除</text>
  <rect x="660" y="95" width="210" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="765" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务消费者 Consumer</text>
  <text x="765" y="152" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">拉取实例列表并本地缓存</text>
  <text x="765" y="175" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">按服务名寻址调用</text>
  <rect x="345" y="270" width="210" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">配置中心 Nacos Config</text>
  <text x="450" y="325" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">bootstrap.yml 优先加载</text>
  <text x="450" y="348" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">@RefreshScope 动态刷新</text>
  <path d="M 240 150 H 345" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 555 150 H 660" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="292" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">(1) 注册与心跳</text>
  <text x="607" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">(2) 订阅与推送</text>
  <path d="M 135 205 V 320 H 345" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 765 205 V 320 H 555" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="240" y="310" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">(3) 启动拉取配置</text>
  <text x="660" y="310" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">(4) 配置热更新</text>
</svg>
