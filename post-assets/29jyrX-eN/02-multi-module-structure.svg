<line x1="355" y1="200" x2="355" y2="216" stroke="#2f6fd0" stroke-width="2" marker-end="url(#mB)"/>
<rect x="265" y="216" width="180" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="355" y="240" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">openfeign</text>
<text x="355" y="260" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">build.gradle</text>
<line x1="320" y1="158" x2="320" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="320" y1="200" x2="560" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="450" y1="158" x2="450" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="560" y1="200" x2="560" y2="216" stroke="#2f6fd0" stroke-width="2" marker-end="url(#mB)"/>
<rect x="470" y="216" width="180" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="560" y="240" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">gateway</text>
<text x="560" y="260" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">build.gradle</text>
<line x1="320" y1="158" x2="320" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="320" y1="200" x2="765" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="450" y1="158" x2="450" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="765" y1="200" x2="765" y2="216" stroke="#2f6fd0" stroke-width="2" marker-end="url(#mB)"/>
<rect x="675" y="216" width="180" height="58" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="765" y="240" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">user-center</text>
<text x="765" y="260" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">build.gradle</text>
<rect x="60" y="302" width="780" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="450" y="326" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">subprojects { } —— 统一注入全部子项目的公共配置</text>
<text x="450" y="350" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">apply plugin: 'java-library' / 'org.springframework.boot'</text>
<text x="450" y="370" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">repositories { mavenLocal(); maven { url '…aliyun…' }; mavenCentral() }</text>
<text x="450" y="390" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">dependencies { implementation …; compileOnly lombok; annotationProcessor lombok }</text>
<line x1="700" y1="302" x2="700" y2="276" stroke="#7a5bd0" stroke-width="2" marker-end="url(#mP)" stroke-dasharray="6 4"/>
<text x="706" y="294" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#7a5bd0" text-anchor="start" font-weight="400">配置继承</text>
<text x="60" y="424" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">allprojects { } 覆盖根项目与所有子项目，适合放 group / version / 编码等全局属性；</text>
<text x="60" y="444" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">buildscript { } 只服务于构建脚本自身（classpath 中的插件依赖），与各模块业务依赖无关；</text>
<text x="60" y="464" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">子项目自己的 build.gradle 只声明本模块独需的依赖，例如 gateway 的 spring-cloud-starter-gateway。</text>
<rect x="40" y="538" width="820" height="84" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="60" y="562" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">构建生命周期</text>
<rect x="200" y="546" width="150" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="275" y="572" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">初始化</text>
<line x1="350" y1="567" x2="386" y2="567" stroke="#2f6fd0" stroke-width="2" marker-end="url(#mB)"/>
<rect x="390" y="546" width="150" height="42" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="465" y="572" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">配置</text>
<line x1="540" y1="567" x2="576" y2="567" stroke="#2f6fd0" stroke-width="2" marker-end="url(#mB)"/>
<rect x="580" y="546" width="150" height="42" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="655" y="572" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">执行</text>
<text x="60" y="610" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">settings.gradle 在初始化阶段被读取，因此 include 决定项目树；根与子项目的 build.gradle 在配置阶段执行。</text>
</svg>