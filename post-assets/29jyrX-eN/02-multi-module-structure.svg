<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Gradle 多模块构建结构图">
<defs><marker id="mB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#2f6fd0"/></marker><marker id="mP" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#7a5bd0"/></marker></defs>
<rect x="0" y="0" width="900" height="640" rx="0" fill="#ffffff" stroke="none"/>
<text x="450" y="32" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Gradle 多模块构建结构（settings.gradle 与配置继承）</text>
<text x="450" y="52" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">settings.gradle 在初始化阶段执行并实例化项目树；build.gradle 在配置阶段逐项目执行</text>
<rect x="40" y="70" width="820" height="452" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="300" y="96" width="300" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="450" y="121" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">根项目 root : nacos</text>
<text x="450" y="143" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">settings.gradle / build.gradle</text>
<line x1="320" y1="158" x2="320" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="320" y1="200" x2="150" y2="200" stroke="#2f6fd0" stroke-width="2"/>
