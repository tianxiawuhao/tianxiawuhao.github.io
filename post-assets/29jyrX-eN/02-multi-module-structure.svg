<text x="150" y="240" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">sentinel</text>
<text x="150" y="260" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">build.gradle</text>
<line x1="320" y1="158" x2="320" y2="200" stroke="#2f6fd0" stroke-width="2"/>
<line x1="320" y1="200" x2="355" y2="200" stroke="#2f6fd0" stroke-width="2"/>
