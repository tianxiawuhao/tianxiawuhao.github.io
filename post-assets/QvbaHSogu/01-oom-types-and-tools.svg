<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">OOM 家族分类与定位路径</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#5b6b7c">按“先看异常关键字，再选工具，最后改参数”的顺序排查</text>

  <rect x="40" y="78" width="250" height="200" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="165" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">堆内与 GC 相关</text>
  <text x="58" y="130" font-size="12" fill="#1f2b38">• Java heap space</text>
  <text x="58" y="152" font-size="12" fill="#5b6b7c">大对象 / 内存泄漏 / 堆太小</text>
  <text x="58" y="182" font-size="12" fill="#1f2b38">• GC overhead limit exceeded</text>
  <text x="58" y="204" font-size="12" fill="#5b6b7c">98% 时间在 GC，回收 &lt; 2%</text>
  <text x="58" y="234" font-size="12" fill="#1f2b38">• StackOverflowError</text>
  <text x="58" y="256" font-size="12" fill="#5b6b7c">栈帧过深，线程栈溢出</text>

  <rect x="325" y="78" width="250" height="200" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="450" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">堆外与元数据相关</text>
  <text x="343" y="130" font-size="12" fill="#1f2b38">• Direct buffer memory</text>
  <text x="343" y="152" font-size="12" fill="#5b6b7c">allocateDirect 超 MaxDirectMemorySize</text>
  <text x="343" y="182" font-size="12" fill="#1f2b38">• Metaspace</text>
  <text x="343" y="204" font-size="12" fill="#5b6b7c">类动态生成过多，类元数据撑满</text>
  <text x="343" y="234" font-size="12" fill="#1f2b38">• PermGen space（JDK 7 及以前）</text>
  <text x="343" y="256" font-size="12" fill="#5b6b7c">JDK 8 起被 Metaspace 取代</text>

  <rect x="610" y="78" width="250" height="200" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="735" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">操作系统资源相关</text>
  <text x="628" y="130" font-size="12" fill="#1f2b38">• Unable to create new native thread</text>
  <text x="628" y="152" font-size="12" fill="#5b6b7c">线程数触顶：ulimit / 内核 pid 上限</text>
  <text x="628" y="182" font-size="12" fill="#1f2b38">• Out of swap space？</text>
  <text x="628" y="204" font-size="12" fill="#5b6b7c">物理内存 + swap 耗尽</text>
  <text x="628" y="234" font-size="12" fill="#1f2b38">• Requested array size exceeds VM limit</text>
  <text x="628" y="256" font-size="12" fill="#5b6b7c">数组长度超过虚拟机上限</text>

  <path d="M 165 278 L 165 320" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 450 278 L 450 320" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 735 278 L 735 320" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="328" width="820" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="60" y="354" font-size="14" font-weight="700" fill="#1f2b38">定位工具</text>
  <text x="60" y="382" font-size="12" fill="#1f2b38">jps / jstat -gcutil：先确认进程与 GC 频率、各分区占用</text>
  <text x="60" y="404" font-size="12" fill="#1f2b38">jmap -histo:live / -dump:format=b：直方图看“谁在涨”，堆转储交 MAT 找支配树与泄漏点</text>
  <text x="60" y="426" font-size="12" fill="#1f2b38">jstack -l：线程数、死锁与阻塞；jinfo -flags：核对生效参数；Arthas dashboard / heapdump / thread 更快</text>

  <rect x="40" y="470" width="820" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="60" y="496" font-size="13" font-weight="700" fill="#2f6fd0">结论</text>
  <text x="60" y="518" font-size="12" fill="#1f2b38">先区分“堆内 / 堆外 / 元空间 / 线程”，再决定是扩容、限流，还是修泄漏；盲目加 -Xmx 只能推迟崩溃。</text>
</svg>
