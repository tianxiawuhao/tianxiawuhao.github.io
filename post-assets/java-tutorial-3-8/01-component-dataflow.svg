<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Vue 组件通信：props 向下、事件向上与插槽</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Vue 组件通信：props 向下、事件向上、插槽传结构</text>

  <rect x="50" y="80" width="230" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">父组件</text>
  <text x="165" y="142" text-anchor="middle" font-size="12" fill="#5b6b7c">data: { post: {...} }</text>
  <text x="165" y="168" text-anchor="middle" font-size="12" fill="#5b6b7c">method: onLike(id)</text>
  <text x="165" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">填 template #meta</text>

  <rect x="620" y="80" width="230" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="735" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">子组件 PostCard</text>
  <text x="735" y="142" text-anchor="middle" font-size="12" fill="#5b6b7c">props: { title, post }</text>
  <text x="735" y="168" text-anchor="middle" font-size="12" fill="#5b6b7c">$emit('like', id)</text>
  <text x="735" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">slot :post="post"</text>

  <line x1="282" y1="125" x2="612" y2="125" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="447" y="114" text-anchor="middle" font-size="12" fill="#2f6fd0">props：数据向下</text>
  <line x1="618" y1="185" x2="288" y2="185" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="447" y="207" text-anchor="middle" font-size="12" fill="#2e9e5b">事件向上：$emit('like', id)</text>

  <rect x="180" y="265" width="540" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">插槽：子组件留出口，父组件填结构</text>
  <rect x="205" y="305" width="150" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#1f2b38">默认插槽</text>
  <rect x="375" y="305" width="150" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#1f2b38">具名插槽 #meta</text>
  <rect x="545" y="305" width="150" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="620" y="332" text-anchor="middle" font-size="12" fill="#1f2b38">作用域插槽</text>
</svg>
