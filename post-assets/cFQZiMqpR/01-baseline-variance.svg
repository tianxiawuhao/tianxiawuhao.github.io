<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>基线降低策略梯度估计的方差</title>
<rect width="900" height="360" fill="#ffffff"/>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">基线降低方差：Qπ 加权 vs 优势 A = Qπ − Vπ 加权</text>
<rect x="40" y="60" width="380" height="230" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="230" y="88" font-size="14" font-weight="600" fill="#e08a1e" text-anchor="middle">不用基线：权重 = Qπ(s,a)</text>
<text x="230" y="110" font-size="11.5" fill="#5b6b7c" text-anchor="middle">数值大且分散（如 8~14），采样波动大 → 方差大</text>
<line x1="80" y1="200" x2="380" y2="200" stroke="#c8d3e0" stroke-width="1.4"/>
<circle cx="120" cy="200" r="6" fill="#e08a1e"/><circle cx="170" cy="200" r="6" fill="#e08a1e"/>
<circle cx="250" cy="200" r="6" fill="#e08a1e"/><circle cx="300" cy="200" r="6" fill="#e08a1e"/>
<circle cx="355" cy="200" r="6" fill="#e08a1e"/>
<line x1="120" y1="190" x2="120" y2="150" stroke="#e08a1e" stroke-width="1.2"/><line x1="355" y1="190" x2="355" y2="150" stroke="#e08a1e" stroke-width="1.2"/>
<line x1="120" y1="150" x2="355" y2="150" stroke="#e08a1e" stroke-width="1.2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="238" y="142" font-size="11" fill="#e08a1e" text-anchor="middle">分布宽 → 梯度噪声大</text>
<text x="230" y="240" font-size="11.5" fill="#1f2b38" text-anchor="middle">θ ← θ + α · ∇lnπ(a|s) · Qπ(s,a)</text>
<text x="230" y="262" font-size="11" fill="#5b6b7c" text-anchor="middle">同一状态下所有动作都被「正值」加权，大小差别被淹没</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/></marker></defs>
<rect x="480" y="60" width="380" height="230" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="670" y="88" font-size="14" font-weight="600" fill="#2e9e5b" text-anchor="middle">用基线：权重 = Qπ(s,a) − Vπ(s)</text>
<text x="670" y="110" font-size="11.5" fill="#5b6b7c" text-anchor="middle">有正有负、接近 0，采样波动小 → 方差小</text>
<line x1="520" y1="200" x2="820" y2="200" stroke="#c8d3e0" stroke-width="1.4"/>
<circle cx="600" cy="200" r="6" fill="#2e9e5b"/><circle cx="645" cy="200" r="6" fill="#2e9e5b"/>
<circle cx="670" cy="200" r="6" fill="#2e9e5b"/><circle cx="700" cy="200" r="6" fill="#2e9e5b"/>
<circle cx="745" cy="200" r="6" fill="#2e9e5b"/>
<line x1="600" y1="190" x2="600" y2="168" stroke="#2e9e5b" stroke-width="1.2"/><line x1="745" y1="190" x2="745" y2="168" stroke="#2e9e5b" stroke-width="1.2"/>
<line x1="600" y1="168" x2="745" y2="168" stroke="#2e9e5b" stroke-width="1.2" marker-end="url(#ah2)" marker-start="url(#ah2)"/>
<text x="672" y="160" font-size="11" fill="#2e9e5b" text-anchor="middle">分布窄 → 梯度噪声小</text>
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9e5b"/></marker></defs>
<text x="670" y="240" font-size="11.5" fill="#1f2b38" text-anchor="middle">θ ← θ + α · ∇lnπ(a|s) · (Qπ(s,a) − Vπ(s))</text>
<text x="670" y="262" font-size="11" fill="#5b6b7c" text-anchor="middle">「比平均好」的动作才被正向加权，优势符号有意义</text>
<text x="450" y="325" font-size="11.5" fill="#1f2b38" text-anchor="middle">两者期望相同（都无偏），差别只在方差：基线越接近 Qπ，优势越集中在 0 附近</text>
</svg>
