<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Kafka 分区副本的位移与高水位</title>
  <rect width="900" height="300" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Kafka 分区：位移、高水位与消息可见性</text>

  <text x="364" y="62" text-anchor="middle" font-size="12" fill="#2e9e5b">已提交消息（消费者可见）</text>
  <text x="709" y="62" text-anchor="middle" font-size="12" fill="#e08a1e">未提交消息（不可见）</text>

  <text x="166" y="105" text-anchor="end" font-size="12" font-weight="700" fill="#1f2b38">Leader 副本日志</text>

  <rect x="180" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="226" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="272" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="318" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="364" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="410" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="456" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="502" y="76" width="46" height="44" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="548" y="76" width="46" height="44" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="594" y="76" width="46" height="44" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="640" y="76" width="46" height="44" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="686" y="76" width="46" height="44" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="732" y="76" width="46" height="44" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="778" y="76" width="46" height="44" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="824" y="76" width="46" height="44" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>

  <text x="203" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">0</text>
  <text x="249" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">1</text>
  <text x="295" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">2</text>
  <text x="341" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">3</text>
  <text x="387" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">4</text>
  <text x="433" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">5</text>
  <text x="479" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">6</text>
  <text x="525" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">7</text>
  <text x="571" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">8</text>
  <text x="617" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">9</text>
  <text x="663" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">10</text>
  <text x="709" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">11</text>
  <text x="755" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">12</text>
  <text x="801" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">13</text>
  <text x="847" y="104" text-anchor="middle" font-size="12" fill="#1f2b38">14</text>

  <line x1="180" y1="120" x2="180" y2="136" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="548" y1="120" x2="548" y2="136" stroke="#2f6fd0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="870" y1="120" x2="870" y2="136" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="180" y="152" text-anchor="start" font-size="12" fill="#5b6b7c">起始位移 = 0</text>
  <text x="548" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">HW = 8（高水位）</text>
  <text x="870" y="152" text-anchor="end" font-size="12" font-weight="700" fill="#e08a1e">LEO = 15</text>

  <rect x="30" y="180" width="400" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="50" y="206" text-anchor="start" font-size="13" font-weight="700" fill="#2f6fd0">HW（High Watermark，高水位）</text>
  <text x="50" y="230" text-anchor="start" font-size="12" fill="#1f2b38">位移 &lt; HW 的消息视为已提交，消费者可见；</text>
  <text x="50" y="252" text-anchor="start" font-size="12" fill="#1f2b38">位移 ≥ HW 的消息（含位移 = HW）不可见；</text>
  <text x="50" y="272" text-anchor="start" font-size="12" fill="#1f2b38">分区高水位就是 Leader 副本的高水位。</text>

  <rect x="470" y="180" width="400" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="490" y="206" text-anchor="start" font-size="13" font-weight="700" fill="#e08a1e">LEO（Log End Offset）</text>
  <text x="490" y="230" text-anchor="start" font-size="12" fill="#1f2b38">下一条待写入消息的位移，已有 15 条消息；</text>
  <text x="490" y="252" text-anchor="start" font-size="12" fill="#1f2b38">同一副本的高水位不会大于它的 LEO；</text>
  <text x="490" y="272" text-anchor="start" font-size="12" fill="#1f2b38">关系：起始位移 ≤ HW ≤ LEO。</text>
</svg>
