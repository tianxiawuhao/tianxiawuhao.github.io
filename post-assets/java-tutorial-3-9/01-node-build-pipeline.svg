<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>前端工程化链路：Node 运行时、npm 依赖与构建产物</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">前端工程化链路：Node 运行时、npm 依赖、构建产物</text>

  <rect x="40" y="52" width="820" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="76" text-anchor="middle" font-size="12" fill="#1f2b38">npm：package.json 声明依赖，下载到 node_modules</text>
  <text x="450" y="96" text-anchor="middle" font-size="12" fill="#5b6b7c">dependencies 运行时依赖 / devDependencies 开发期依赖</text>

  <line x1="340" y1="110" x2="340" y2="136" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="352" y="128" font-size="11" fill="#5b6b7c">npm i / npm ci</text>

  <rect x="40" y="140" width="170" height="140" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="125" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">源代码</text>
  <text x="125" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">.vue / .ts / .less</text>
  <text x="125" y="224" text-anchor="middle" font-size="12" fill="#5b6b7c">ES Modules 拆分</text>
  <text x="125" y="248" text-anchor="middle" font-size="12" fill="#5b6b7c">浏览器不认</text>

  <line x1="212" y1="210" x2="246" y2="210" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="250" y="140" width="180" height="140" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Node.js 运行时</text>
  <text x="340" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">webpack / Vite</text>
  <text x="340" y="224" text-anchor="middle" font-size="12" fill="#5b6b7c">loader 翻译语法</text>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#5b6b7c">plugin 优化资源</text>

  <line x1="432" y1="210" x2="466" y2="210" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="140" width="170" height="140" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="555" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">构建产物</text>
  <text x="555" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">bundle.js</text>
  <text x="555" y="224" text-anchor="middle" font-size="12" fill="#5b6b7c">index.html + 资源</text>
  <text x="555" y="248" text-anchor="middle" font-size="12" fill="#5b6b7c">chunk 按需加载</text>

  <line x1="642" y1="210" x2="676" y2="210" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="680" y="140" width="180" height="140" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="770" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">浏览器</text>
  <text x="770" y="215" text-anchor="middle" font-size="12" fill="#5b6b7c">直接运行业务代码</text>
  <text x="770" y="239" text-anchor="middle" font-size="12" fill="#5b6b7c">不再关心模块规范</text>

  <rect x="40" y="305" width="820" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="330" text-anchor="middle" font-size="12" fill="#5b6b7c">局部安装的工具（webpack）要用 npm run 或 npx 调用，直接敲命令会报找不到</text>
  <text x="450" y="354" text-anchor="middle" font-size="12" fill="#5b6b7c">国内镜像改用 registry.npmmirror.com（registry.npm.taobao.org 已于 2022 年停服）</text>
</svg>
