<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Dockerfile 分层构建与缓存复用</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Dockerfile 分层构建与缓存复用</text>
  <text x="40" y="58" font-size="12" fill="#5b6b7c">Dockerfile 指令（自上而下）</text>
  <text x="400" y="58" font-size="12" fill="#5b6b7c">构建出的镜像层（自下而上叠加）</text>
  <rect x="40" y="72" width="250" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="99" text-anchor="middle" font-size="13" fill="#1f2b38">FROM ubuntu:22.04</text>
  <rect x="40" y="126" width="250" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="153" text-anchor="middle" font-size="13" fill="#1f2b38">RUN apt-get install -y ...</text>
  <rect x="40" y="180" width="250" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="207" text-anchor="middle" font-size="13" fill="#1f2b38">COPY app.jar /app/</text>
  <rect x="40" y="234" width="250" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="261" text-anchor="middle" font-size="13" fill="#1f2b38">CMD ["java","-jar",...]</text>
  <line x1="298" y1="175" x2="390" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="344" y="166" text-anchor="middle" font-size="11" fill="#5b6b7c">docker build</text>
  <rect x="400" y="72" width="470" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="420" y="99" font-size="13" fill="#1f2b38">第 4 层：CMD —— 启动命令（元数据，几乎不占空间）</text>
  <rect x="400" y="126" width="470" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="420" y="153" font-size="13" fill="#1f2b38">第 3 层：COPY app.jar /app/</text>
  <rect x="400" y="180" width="470" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="420" y="207" font-size="13" fill="#1f2b38">第 2 层：RUN apt-get install -y ...（安装依赖）</text>
  <rect x="400" y="234" width="470" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="420" y="261" font-size="13" fill="#1f2b38">第 1 层：FROM ubuntu:22.04（基础镜像层）</text>
  <rect x="40" y="300" width="830" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="328" font-size="13" fill="#1f2b38">缓存规则：任一指令的内容发生变化，它和它之后所有层的缓存全部失效，必须重新构建。</text>
  <text x="60" y="352" font-size="13" fill="#1f2b38">所以把不常变的指令放前面（装依赖），经常变的放后面（复制源码），能明显加快构建。</text>
</svg>
