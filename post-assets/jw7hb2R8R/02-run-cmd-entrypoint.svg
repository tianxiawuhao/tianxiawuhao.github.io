<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>RUN、CMD、ENTRYPOINT 执行时机与覆盖规则</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">RUN、CMD、ENTRYPOINT 执行时机与覆盖规则</text>
  <rect x="30" y="60" width="840" height="40" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.2"/>
  <rect x="30" y="100" width="840" height="56" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.2"/>
  <rect x="30" y="156" width="840" height="56" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <rect x="30" y="212" width="840" height="56" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="180" y1="60" x2="180" y2="268" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="410" y1="60" x2="410" y2="268" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="670" y1="60" x2="670" y2="268" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="105" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">指令</text>
  <text x="295" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">执行时机</text>
  <text x="540" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">能否被 docker run 覆盖</text>
  <text x="770" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">建议用法</text>
  <text x="105" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">RUN</text>
  <text x="295" y="134" text-anchor="middle" font-size="12" fill="#1f2b38">docker build 构建镜像时</text>
  <text x="540" y="134" text-anchor="middle" font-size="12" fill="#1f2b38">不可覆盖，结果已固化进镜像</text>
  <text x="770" y="134" text-anchor="middle" font-size="12" fill="#1f2b38">安装依赖、编译、生成文件</text>
  <text x="105" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">CMD</text>
  <text x="295" y="190" text-anchor="middle" font-size="12" fill="#1f2b38">docker run 启动容器时</text>
  <text x="540" y="190" text-anchor="middle" font-size="12" fill="#1f2b38">可被 run 后跟的命令整体覆盖</text>
  <text x="770" y="190" text-anchor="middle" font-size="12" fill="#1f2b38">提供默认启动命令或默认参数</text>
  <text x="105" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ENTRYPOINT</text>
  <text x="295" y="246" text-anchor="middle" font-size="12" fill="#1f2b38">docker run 启动容器时</text>
  <text x="540" y="246" text-anchor="middle" font-size="12" fill="#1f2b38">不会被覆盖，参数会追加到其后</text>
  <text x="770" y="246" text-anchor="middle" font-size="12" fill="#1f2b38">固定主程序，CMD 传默认参数</text>
  <rect x="30" y="288" width="840" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="50" y="316" font-size="13" fill="#1f2b38">组合规则：ENTRYPOINT（exec 形式）与 CMD 同时存在时，CMD 的内容会作为参数追加到 ENTRYPOINT 之后。</text>
  <text x="50" y="344" font-size="13" fill="#1f2b38">例：ENTRYPOINT ["top","-b"] 配 CMD ls -al，实际执行 top -b /bin/sh -c "ls -al"，top 仍会启动。</text>
</svg>
