<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ctx.close() 与 ctx.channel().close() 的遍历范围对比</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ctx.close() 与 ctx.channel().close() 的遍历范围对比</text>

  <!-- 面板一 -->
  <rect x="30" y="52" width="840" height="160" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="76" font-size="13" font-weight="700" fill="#2f6fd0">ctx.close()：从当前 Handler B 出发，只朝 head 方向经过出站 Handler</text>

  <rect x="46" y="98" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="96" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">head</text>
  <text x="96" y="135" text-anchor="middle" font-size="11" fill="#5b6b7c">头节点</text>

  <rect x="164" y="98" width="100" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="214" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">decoder</text>
  <text x="214" y="135" text-anchor="middle" font-size="11" fill="#5b6b7c">入站解码器</text>

  <rect x="282" y="98" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="332" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">encoder</text>
  <text x="332" y="135" text-anchor="middle" font-size="11" fill="#5b6b7c">出站编码器</text>

  <rect x="400" y="98" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">A</text>
  <text x="450" y="135" text-anchor="middle" font-size="11" fill="#5b6b7c">双向处理器</text>

  <rect x="518" y="98" width="100" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="568" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">B</text>
  <text x="568" y="135" text-anchor="middle" font-size="11" fill="#e08a1e">调用起点</text>

  <rect x="636" y="98" width="100" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="686" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">C</text>
  <text x="686" y="135" text-anchor="middle" font-size="11" fill="#5b6b7c">双向处理器</text>

  <rect x="754" y="98" width="100" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="804" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">tail</text>
  <text x="804" y="135" text-anchor="middle" font-size="11" fill="#5b6b7c">尾节点</text>

  <line x1="518" y1="176" x2="100" y2="176" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="198" text-anchor="middle" font-size="11" fill="#5b6b7c">close 事件只沿 prev 方向找下一批出站 Handler：入口是 B，途中经过 A 与 encoder，decoder 属入站被跳过</text>

  <!-- 面板二 -->
  <rect x="30" y="232" width="840" height="168" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="256" font-size="13" font-weight="700" fill="#e08a1e">ctx.channel().close()：从 pipeline 尾部 tail 出发，朝 head 方向经过所有出站 Handler</text>

  <rect x="46" y="278" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="96" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">head</text>
  <text x="96" y="315" text-anchor="middle" font-size="11" fill="#5b6b7c">头节点</text>

  <rect x="164" y="278" width="100" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="214" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">decoder</text>
  <text x="214" y="315" text-anchor="middle" font-size="11" fill="#5b6b7c">入站解码器</text>

  <rect x="282" y="278" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="332" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">encoder</text>
  <text x="332" y="315" text-anchor="middle" font-size="11" fill="#5b6b7c">出站编码器</text>

  <rect x="400" y="278" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">A</text>
  <text x="450" y="315" text-anchor="middle" font-size="11" fill="#5b6b7c">双向处理器</text>

  <rect x="518" y="278" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="568" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">B</text>
  <text x="568" y="315" text-anchor="middle" font-size="11" fill="#5b6b7c">双向处理器</text>

  <rect x="636" y="278" width="100" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="686" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">C</text>
  <text x="686" y="315" text-anchor="middle" font-size="11" fill="#5b6b7c">双向处理器</text>

  <rect x="754" y="278" width="100" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="804" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">tail</text>
  <text x="804" y="315" text-anchor="middle" font-size="11" fill="#e08a1e">调用起点</text>

  <line x1="754" y1="356" x2="100" y2="356" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b7c">入口换成 tail，因此 C、B、A 等所有出站 Handler 的 close() 都会被调用；两条路径最终都由 head 真正关闭 Channel</text>
</svg>
