<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gitee + Jenkins Blue Ocean + Docker 流水线总览</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Gitee + Jenkins（Blue Ocean）+ Docker 流水线总览</text>

  <rect x="65" y="70" width="230" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="180" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Gitee 仓库</text>
  <text x="180" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">代码 + Jenkinsfile + Dockerfile</text>

  <rect x="335" y="70" width="230" height="80" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Webhook / 远程触发</text>
  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">构建 URL + 身份验证令牌</text>

  <rect x="605" y="70" width="230" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="720" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Jenkins（Blue Ocean）</text>
  <text x="720" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">挂载 docker.sock 调宿主机</text>

  <line x1="295" y1="110" x2="331" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="565" y1="110" x2="601" y2="110" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 720 150 L 720 178 L 450 178 L 450 200" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="65" y="205" width="770" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">Jenkinsfile：pipeline → agent any → stages（按序执行）</text>

  <rect x="71" y="245" width="170" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="156" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">1 环境检查</text>
  <text x="156" y="294" text-anchor="middle" font-size="11" fill="#5b6b7c">版本与变量探测</text>

  <rect x="267" y="245" width="170" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="352" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">2 编译</text>
  <text x="352" y="294" text-anchor="middle" font-size="11" fill="#5b6b7c">maven 容器内编译</text>

  <rect x="463" y="245" width="170" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="548" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">3 打包</text>
  <text x="548" y="294" text-anchor="middle" font-size="11" fill="#5b6b7c">docker build 构建镜像</text>

  <rect x="659" y="245" width="170" height="68" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="744" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">4 部署</text>
  <text x="744" y="294" text-anchor="middle" font-size="11" fill="#5b6b7c">docker run 替换旧容器</text>

  <line x1="243" y1="279" x2="263" y2="279" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="439" y1="279" x2="459" y2="279" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="635" y1="279" x2="655" y2="279" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="450" y1="325" x2="450" y2="358" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="362" width="300" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">容器 java-devops-demo</text>
  <text x="450" y="407" text-anchor="middle" font-size="11" fill="#5b6b7c">宿主机 8888 → 容器 8080</text>
</svg>
