<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>微信小程序授权登录时序图</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">微信小程序授权登录时序图</text>

  <rect x="30" y="55" width="200" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" fill="#1f2b38">小程序客户端</text>
  <rect x="350" y="55" width="200" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="78" text-anchor="middle" font-size="13" fill="#1f2b38">Spring Boot 服务端</text>
  <rect x="670" y="55" width="200" height="36" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="770" y="78" text-anchor="middle" font-size="13" fill="#1f2b38">微信接口服务</text>

  <line x1="130" y1="91" x2="130" y2="470" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 6"/>
  <line x1="450" y1="91" x2="450" y2="470" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 6"/>
  <line x1="770" y1="91" x2="770" y2="470" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 6"/>

  <line x1="130" y1="135" x2="440" y2="135" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="285" y="126" text-anchor="middle" font-size="11" fill="#1f2b38">① wx.login() 获取临时 code</text>

  <line x1="458" y1="200" x2="760" y2="200" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="609" y="191" text-anchor="middle" font-size="11" fill="#1f2b38">② auth.code2Session 校验凭证</text>

  <line x1="762" y1="255" x2="458" y2="255" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="610" y="246" text-anchor="middle" font-size="11" fill="#1f2b38">③ 返回 openid 与 session_key</text>

  <rect x="270" y="285" width="360" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="310" text-anchor="middle" font-size="12" fill="#1f2b38">④ 查询或新增用户记录</text>
  <text x="450" y="331" text-anchor="middle" font-size="12" fill="#1f2b38">签发 JWT，并把 token 与 session_key 存入 Redis</text>

  <line x1="458" y1="375" x2="142" y2="375" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#1f2b38">⑤ 下发自定义登录态 token</text>

  <rect x="30" y="400" width="230" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="145" y="425" text-anchor="middle" font-size="12" fill="#1f2b38">⑥ token 存入本地 storage</text>

  <line x1="130" y1="470" x2="440" y2="470" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="285" y="461" text-anchor="middle" font-size="11" fill="#1f2b38">⑦ 业务请求 Header 携带 Authorization</text>
</svg>
