<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ClickHouse 分片集群写入流程：Distributed 表按分片键路由并写入分片副本</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">ClickHouse 分片集群写入流程（3 分片 2 副本）</text>

  <rect x="30" y="92" width="150" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="105" y="115" font-size="13" fill="#1f2b38" text-anchor="middle">客户端</text>
  <text x="105" y="135" font-size="11" fill="#5b6b7c" text-anchor="middle">INSERT 语句</text>

  <line x1="180" y1="120" x2="224" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="228" y="84" width="170" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="313" y="108" font-size="13" fill="#1f2b38" text-anchor="middle">Distributed 表</text>
  <text x="313" y="127" font-size="11" fill="#5b6b7c" text-anchor="middle">st_fz_order_mt_all2</text>
  <text x="313" y="145" font-size="11" fill="#5b6b7c" text-anchor="middle">不存储数据，只负责路由</text>

  <line x1="398" y1="120" x2="486" y2="120" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="442" y="110" font-size="11" fill="#5b6b7c" text-anchor="middle">按分片键</text>
  <text x="442" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">hiveHash</text>
  <line x1="486" y1="98" x2="486" y2="238" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="486" y1="98" x2="516" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="486" y1="168" x2="516" y2="168" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="486" y1="238" x2="516" y2="238" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="520" y="70" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="695" y="92" font-size="13" fill="#1f2b38" text-anchor="middle">分片 01 · 主副本 rep_1_1（写入点）</text>
  <text x="695" y="110" font-size="11" fill="#5b6b7c" text-anchor="middle">副本 rep_1_2 由分片内部同步</text>

  <rect x="520" y="140" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="695" y="162" font-size="13" fill="#1f2b38" text-anchor="middle">分片 02 · 主副本 rep_2_1（写入点）</text>
  <text x="695" y="180" font-size="11" fill="#5b6b7c" text-anchor="middle">副本 rep_2_2 由分片内部同步</text>

  <rect x="520" y="210" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="695" y="232" font-size="13" fill="#1f2b38" text-anchor="middle">分片 03 · 主副本 rep_3_1（写入点）</text>
  <text x="695" y="250" font-size="11" fill="#5b6b7c" text-anchor="middle">副本 rep_3_2 由分片内部同步</text>

  <rect x="30" y="290" width="840" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="314" font-size="12" fill="#1f2b38" text-anchor="middle">internal_replication=true：Distributed 表按分片键选中一个分片后，只写入该分片的一个副本；</text>
  <text x="450" y="334" font-size="12" fill="#1f2b38" text-anchor="middle">其余副本由 ReplicatedMergeTree 在分片内部自动同步，因此写入压力更小。</text>
</svg>
