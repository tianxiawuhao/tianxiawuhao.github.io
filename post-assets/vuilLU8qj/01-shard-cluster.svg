<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ClickHouse 3 分片 2 副本集群的读写架构</title>
  <rect width="900" height="580" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ClickHouse 3 分片 2 副本集群的读写架构</text>
  <rect x="310" y="55" width="280" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="86" text-anchor="middle" font-size="13" fill="#1f2b38">应用 / 客户端（写入与查询）</text>
  <line x1="450" y1="105" x2="450" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="290" y="135" width="320" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="163" text-anchor="middle" font-size="14" fill="#1f2b38">Distributed 表（逻辑表）</text>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#5b6b7c">不存储数据，负责路由与结果汇总</text>
  <line x1="450" y1="207" x2="450" y2="233" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="462" y="226" font-size="11" fill="#5b6b7c">按分片键路由</text>
  <line x1="180" y1="235" x2="720" y2="235" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="180" y1="235" x2="180" y2="266" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="235" x2="450" y2="266" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="720" y1="235" x2="720" y2="266" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="270" width="240" height="230" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="180" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">分片 01</text>
  <rect x="80" y="308" width="200" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="180" y="334" text-anchor="middle" font-size="12" fill="#1f2b38">node01（rep_1_1）</text>
  <text x="180" y="354" text-anchor="middle" font-size="11" fill="#5b6b7c">ReplicatedMergeTree</text>
  <line x1="180" y1="372" x2="180" y2="396" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <rect x="80" y="400" width="200" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="180" y="426" text-anchor="middle" font-size="12" fill="#1f2b38">node02（rep_1_2）</text>
  <text x="180" y="446" text-anchor="middle" font-size="11" fill="#5b6b7c">ReplicatedMergeTree</text>
  <text x="180" y="484" text-anchor="middle" font-size="11" fill="#5b6b7c">副本间通过 ZooKeeper 同步</text>
  <rect x="330" y="270" width="240" height="230" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">分片 02</text>
  <rect x="350" y="308" width="200" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="334" text-anchor="middle" font-size="12" fill="#1f2b38">node03（rep_2_1）</text>
  <text x="450" y="354" text-anchor="middle" font-size="11" fill="#5b6b7c">ReplicatedMergeTree</text>
  <line x1="450" y1="372" x2="450" y2="396" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <rect x="350" y="400" width="200" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="426" text-anchor="middle" font-size="12" fill="#1f2b38">node04（rep_2_2）</text>
  <text x="450" y="446" text-anchor="middle" font-size="11" fill="#5b6b7c">ReplicatedMergeTree</text>
  <text x="450" y="484" text-anchor="middle" font-size="11" fill="#5b6b7c">副本间通过 ZooKeeper 同步</text>
  <rect x="600" y="270" width="240" height="230" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="720" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">分片 03</text>
  <rect x="620" y="308" width="200" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="334" text-anchor="middle" font-size="12" fill="#1f2b38">node05（rep_3_1）</text>
  <text x="720" y="354" text-anchor="middle" font-size="11" fill="#5b6b7c">ReplicatedMergeTree</text>
  <line x1="720" y1="372" x2="720" y2="396" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <rect x="620" y="400" width="200" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="426" text-anchor="middle" font-size="12" fill="#1f2b38">node06（rep_3_2）</text>
  <text x="720" y="446" text-anchor="middle" font-size="11" fill="#5b6b7c">ReplicatedMergeTree</text>
  <text x="720" y="484" text-anchor="middle" font-size="11" fill="#5b6b7c">副本间通过 ZooKeeper 同步</text>
  <text x="450" y="525" text-anchor="middle" font-size="11" fill="#5b6b7c">写入：Distributed 表按分片键把数据路由到某个分片，再由该分片同步到自己的副本</text>
  <text x="450" y="548" text-anchor="middle" font-size="11" fill="#5b6b7c">查询：Distributed 表汇总各分片结果后返回；副本只提高可用性，不做水平扩容</text>
</svg>
