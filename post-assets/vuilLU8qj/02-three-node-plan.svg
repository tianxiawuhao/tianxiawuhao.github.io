<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三节点两分片集群与副本规划：Node01/Node02 互为分片一分片副本，Node03 为分片二</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">三节点 2 分片集群与副本规划（gmall_cluster）</text>

  <rect x="26" y="62" width="488" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="270" y="84" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">分片 01（2 副本）</text>
  <rect x="546" y="62" width="248" height="150" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="670" y="84" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">分片 02（1 副本）</text>

  <rect x="40" y="100" width="220" height="100" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="128" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Node01</text>
  <text x="150" y="152" font-size="12" fill="#1f2b38" text-anchor="middle">分片 01 · 副本 rep_1_1</text>
  <text x="150" y="174" font-size="11" fill="#5b6b7c" text-anchor="middle">ClickHouse + ZooKeeper</text>

  <rect x="280" y="100" width="220" height="100" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="390" y="128" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Node02</text>
  <text x="390" y="152" font-size="12" fill="#1f2b38" text-anchor="middle">分片 01 · 副本 rep_1_2</text>
  <text x="390" y="174" font-size="11" fill="#5b6b7c" text-anchor="middle">ClickHouse + ZooKeeper</text>

  <rect x="560" y="100" width="220" height="100" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="128" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Node03</text>
  <text x="670" y="152" font-size="12" fill="#1f2b38" text-anchor="middle">分片 02 · 副本 rep_2_1</text>
  <text x="670" y="174" font-size="11" fill="#5b6b7c" text-anchor="middle">ClickHouse + ZooKeeper</text>

  <line x1="150" y1="262" x2="150" y2="206" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="390" y1="262" x2="390" y2="206" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="262" x2="670" y2="206" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="106" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">读/写</text>
  <text x="346" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">读/写</text>
  <text x="626" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle">读/写</text>

  <rect x="60" y="262" width="780" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="286" font-size="13" fill="#1f2b38" text-anchor="middle">Distributed 表 st_fz_order_mt_all2（集群 gmall_cluster）</text>
  <text x="450" y="306" font-size="11" fill="#5b6b7c" text-anchor="middle">写入时按分片键路由，查询时汇总各分片数据</text>

  <text x="60" y="352" font-size="12" fill="#5b6b7c">分片 01 由 Node01、Node02 互为副本，分片 02 只有 Node03 一个副本；</text>
  <text x="60" y="374" font-size="12" fill="#5b6b7c">三台节点同时充当 ZooKeeper 集群（2181），建表用 ON CLUSTER 自动同步到各节点。</text>
</svg>
