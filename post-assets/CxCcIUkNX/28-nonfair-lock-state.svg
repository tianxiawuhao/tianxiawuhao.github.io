<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ReentrantLock 非公平模式加锁的两次抢占与 state 语义</title>
  <rect width="900" height="310" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">非公平锁的两次抢占捷径与 state 语义</text>
  <rect x="20" y="60" width="250" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="85" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">第一次抢占（lock 入口）</text>
  <text x="145" y="107" font-size="13" fill="#1f2b38" text-anchor="middle">compareAndSetState(0,1)</text>
  <text x="145" y="129" font-size="13" fill="#1f2b38" text-anchor="middle">成功：独占标记 + 返回</text>
  <text x="145" y="151" font-size="13" fill="#5b6b7c" text-anchor="middle">无须入队，零阻塞开销</text>
  <rect x="325" y="60" width="250" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="85" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">第二次抢占（tryAcquire）</text>
  <text x="450" y="107" font-size="13" fill="#1f2b38" text-anchor="middle">nonfairTryAcquire</text>
  <text x="450" y="129" font-size="13" fill="#1f2b38" text-anchor="middle">state=0 再 CAS，或重入累加</text>
  <text x="450" y="151" font-size="13" fill="#5b6b7c" text-anchor="middle">成功仍无须入队</text>
  <rect x="630" y="60" width="250" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="755" y="85" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">两次均失败</text>
  <text x="755" y="107" font-size="13" fill="#1f2b38" text-anchor="middle">addWaiter 构造结点入队</text>
  <text x="755" y="129" font-size="13" fill="#1f2b38" text-anchor="middle">acquireQueued 自旋 + park</text>
  <text x="755" y="151" font-size="13" fill="#5b6b7c" text-anchor="middle">等待前驱释放时唤醒</text>
  <line x1="272" y1="120" x2="322" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="577" y1="120" x2="627" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="20" y="205" width="860" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="230" font-size="12" font-weight="700" fill="#5b6b7c">AQS 中的两个关键字段</text>
  <rect x="40" y="240" width="380" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="230" y="262" font-size="12" fill="#1f2b38" text-anchor="middle">state：0 表示未持有，&gt;0 为重入次数</text>
  <rect x="460" y="240" width="400" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="660" y="262" font-size="12" fill="#1f2b38" text-anchor="middle">exclusiveOwnerThread：当前持有锁的线程</text>
</svg>
