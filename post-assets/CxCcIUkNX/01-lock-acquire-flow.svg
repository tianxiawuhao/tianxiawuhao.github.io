<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ReentrantLock 非公平模式加锁流程</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ReentrantLock 非公平模式加锁流程</text>

  <rect x="300" y="55" width="300" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" fill="#1f2b38">lock() 入口：CAS state 0→1</text>

  <line x1="450" y1="95" x2="450" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="462" y="115" font-size="11" fill="#5b6b7c">失败</text>

  <rect x="300" y="128" width="300" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="153" text-anchor="middle" font-size="13" fill="#1f2b38">acquire(1) → tryAcquire(1)</text>

  <line x1="450" y1="168" x2="450" y2="198" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="462" y="188" font-size="11" fill="#5b6b7c">失败</text>

  <rect x="300" y="200" width="300" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="220" text-anchor="middle" font-size="14" fill="#1f2b38">addWaiter(Node.EXCLUSIVE)</text>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="#5b6b7c">构造结点并 CAS 入队（队空先造虚拟头结点）</text>

  <line x1="450" y1="246" x2="450" y2="274" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="300" y="277" width="300" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="302" text-anchor="middle" font-size="13" fill="#1f2b38">acquireQueued(node, 1) 死循环</text>

  <text x="330" y="342" text-anchor="middle" font-size="12" fill="#1f2b38">p == head 且 tryAcquire 成功</text>
  <line x1="450" y1="317" x2="450" y2="347" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="340" y="350" width="220" height="32" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="371" text-anchor="middle" font-size="12" fill="#1f2b38">setHead(node) → 持有锁</text>

  <path d="M 600 297 L 700 297 L 700 420 L 540 420" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="712" y="360" font-size="11" fill="#5b6b7c">未轮到自己</text>

  <rect x="110" y="403" width="430" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="325" y="424" text-anchor="middle" font-size="12" fill="#1f2b38">shouldParkAfterFailedAcquire → LockSupport.park 阻塞</text>

  <path d="M 110 420 L 70 420 L 70 297 L 300 297" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="78" y="360" font-size="11" fill="#5b6b7c">被唤醒后重新检查</text>

  <text x="450" y="456" text-anchor="middle" font-size="11" fill="#5b6b7c">非公平体现在：入队前有两次抢占机会（lock 入口 CAS 与 tryAcquire）</text>
</svg>
