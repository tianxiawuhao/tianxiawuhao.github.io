<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>公平锁与非公平锁的加锁路径对比</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">公平锁与非公平锁的加锁路径对比</text>
  <rect x="30" y="52" width="390" height="240" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="76" font-size="14" font-weight="700" fill="#7a5bd0" text-anchor="middle">非公平锁（默认）</text>
  <rect x="60" y="92" width="330" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="117" font-size="12" fill="#1f2b38" text-anchor="middle">lock()：直接 compareAndSetState(0,1)</text>
  <line x1="225" y1="134" x2="225" y2="154" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="156" width="330" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="181" font-size="12" fill="#1f2b38" text-anchor="middle">nonfairTryAcquire：不检查队列直接 CAS</text>
  <line x1="225" y1="198" x2="225" y2="218" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="220" width="330" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="225" y="245" font-size="12" fill="#1f2b38" text-anchor="middle">插队成功：吞吐量高，可能饥饿</text>
  <rect x="480" y="52" width="390" height="240" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="675" y="76" font-size="14" font-weight="700" fill="#7a5bd0" text-anchor="middle">公平锁</text>
  <rect x="510" y="92" width="330" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="675" y="117" font-size="12" fill="#1f2b38" text-anchor="middle">lock()：直接调用 acquire(1)</text>
  <line x1="675" y1="134" x2="675" y2="154" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="510" y="156" width="330" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="675" y="181" font-size="12" fill="#1f2b38" text-anchor="middle">tryAcquire：先 hasQueuedPredecessors()</text>
  <line x1="675" y1="198" x2="675" y2="218" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="510" y="220" width="330" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="675" y="245" font-size="12" fill="#1f2b38" text-anchor="middle">队列有人就排队：严格 FIFO，吞吐量低</text>
</svg>
