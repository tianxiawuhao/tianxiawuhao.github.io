<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Linux 内存口径：total、free、buff/cache 与 available 的关系</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Linux 内存口径：free 与 available 的关系</text>

  <text x="60" y="76" font-size="13" font-weight="700" fill="#1f2b38">total：物理内存总量</text>
  <rect x="60" y="88" width="780" height="60" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="60" y="88" width="312" height="60" rx="8" fill="#2f6fd0"/>
  <rect x="372" y="88" width="273" height="60" fill="#e08a1e"/>
  <rect x="645" y="88" width="195" height="60" rx="8" fill="#eef4ff"/>
  <text x="216" y="125" text-anchor="middle" font-size="12.5" fill="#ffffff">used 已用</text>
  <text x="508" y="125" text-anchor="middle" font-size="12.5" fill="#1f2b38">buff/cache 缓存</text>
  <text x="742" y="125" text-anchor="middle" font-size="12.5" fill="#1f2b38">free 空闲</text>

  <text x="60" y="196" font-size="13" font-weight="700" fill="#1f2b38">available：可被应用程序使用的内存</text>
  <rect x="60" y="208" width="780" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="245" text-anchor="middle" font-size="13" fill="#1f2b38">available ≈ free + 大部分可回收的 buff/cache</text>

  <rect x="60" y="300" width="780" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="331" text-anchor="middle" font-size="12.5" fill="#1f2b38">判断内存是否紧张看 available；buff/cache 占用高属于正常现象，不等于内存不足</text>
</svg>
