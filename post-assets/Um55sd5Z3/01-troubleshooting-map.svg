<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>服务器变慢的四维排查路径</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">服务器变慢的四维排查路径</text>

  <rect x="330" y="52" width="240" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" fill="#1f2b38">服务器变慢 / 响应卡顿</text>

  <line x1="450" y1="96" x2="450" y2="150" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="127" y1="150" x2="772" y2="150" stroke="#5b6b7c" stroke-width="1.4"/>

  <line x1="127" y1="150" x2="127" y2="188" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="30" y="190" width="195" height="180" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="127" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">CPU 繁忙</text>
  <text x="127" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">top / vmstat</text>
  <text x="127" y="284" text-anchor="middle" font-size="11.5" fill="#5b6b7c">us + sy 高、id 低</text>
  <text x="127" y="310" text-anchor="middle" font-size="11.5" fill="#5b6b7c">r 列大于逻辑核数</text>
  <text x="127" y="336" text-anchor="middle" font-size="11.5" fill="#5b6b7c">load 负载持续升高</text>

  <line x1="342" y1="150" x2="342" y2="188" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="245" y="190" width="195" height="180" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="342" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">内存不足</text>
  <text x="342" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">free -h / vmstat</text>
  <text x="342" y="284" text-anchor="middle" font-size="11.5" fill="#5b6b7c">available 明显偏小</text>
  <text x="342" y="310" text-anchor="middle" font-size="11.5" fill="#5b6b7c">si / so 持续非 0</text>
  <text x="342" y="336" text-anchor="middle" font-size="11.5" fill="#5b6b7c">swpd 不断增长</text>

  <line x1="557" y1="150" x2="557" y2="188" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="460" y="190" width="195" height="180" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="557" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">磁盘 IO 忙</text>
  <text x="557" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">iostat -x -k 1</text>
  <text x="557" y="284" text-anchor="middle" font-size="11.5" fill="#5b6b7c">%util 长期高于 80%</text>
  <text x="557" y="310" text-anchor="middle" font-size="11.5" fill="#5b6b7c">await 明显增大</text>
  <text x="557" y="336" text-anchor="middle" font-size="11.5" fill="#5b6b7c">avgqu-sz 队列变长</text>

  <line x1="772" y1="150" x2="772" y2="188" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="675" y="190" width="195" height="180" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="772" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5bd0">网络异常</text>
  <text x="772" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">ifstat -tT</text>
  <text x="772" y="284" text-anchor="middle" font-size="11.5" fill="#5b6b7c">KB/s 入出流量突增</text>
  <text x="772" y="310" text-anchor="middle" font-size="11.5" fill="#5b6b7c">带宽被占满</text>
  <text x="772" y="336" text-anchor="middle" font-size="11.5" fill="#5b6b7c">丢包 / 重传增多</text>

  <line x1="127" y1="370" x2="127" y2="382" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="772" y1="370" x2="772" y2="382" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="127" y1="382" x2="772" y2="382" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="450" y1="382" x2="450" y2="400" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="200" y="402" width="500" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="430" text-anchor="middle" font-size="12.5" fill="#1f2b38">定位到具体进程：pidstat -u -r -d -w -p PID（-t 可看线程）</text>
</svg>
