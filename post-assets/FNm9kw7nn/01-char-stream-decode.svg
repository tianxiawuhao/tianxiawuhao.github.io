<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>字符流如何解决字节流读取字符的乱码问题</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">字符流如何解决字节流的乱码问题</text>
  <rect x="40" y="70" width="200" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">文件 / 网络</text>
  <text x="140" y="124" text-anchor="middle" font-size="12" fill="#5b6b7c">字节序列</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#5b6b7c">E4 B8 AD ...</text>
  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">读取字节</text>
  <line x1="242" y1="120" x2="296" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="300" y="70" width="230" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="415" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">编码表</text>
  <text x="415" y="124" text-anchor="middle" font-size="12" fill="#5b6b7c">字节与字符的转换规则</text>
  <text x="415" y="146" text-anchor="middle" font-size="12" fill="#5b6b7c">GBK / UTF-8</text>
  <text x="560" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">按规则转换</text>
  <line x1="532" y1="120" x2="586" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="590" y="70" width="270" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="725" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">字符流 Reader / Writer</text>
  <text x="725" y="124" text-anchor="middle" font-size="12" fill="#5b6b7c">自动拼字节、按表转字符</text>
  <text x="725" y="146" text-anchor="middle" font-size="12" fill="#5b6b7c">中文不再乱码</text>
  <rect x="40" y="190" width="820" height="100" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="216" font-size="12" fill="#5b6b7c">字节流只按字节读取，不知道几个字节拼成一个汉字，手动转字符容易因规则不一致而乱码。</text>
  <text x="60" y="242" font-size="12" fill="#5b6b7c">字符流底层仍是字节流，只是多查了一张编码表：字符流 = 字节流 + 编码表。</text>
  <text x="60" y="268" font-size="12" fill="#5b6b7c">写出时由 Writer 反过来编码：字符按编码表转成字节，所以读写两端必须使用同一种编码。</text>
</svg>
