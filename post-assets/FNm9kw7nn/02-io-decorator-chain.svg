<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java IO 流的分层与装饰关系</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java IO 流的分层与装饰关系</text>
  <rect x="40" y="70" width="195" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="137" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">节点流</text>
  <text x="137" y="124" text-anchor="middle" font-size="11" fill="#5b6b7c">直接连接数据源</text>
  <rect x="255" y="70" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="327" y="115" text-anchor="middle" font-size="11" fill="#1f2b38">FileInputStream</text>
  <rect x="408" y="70" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="115" text-anchor="middle" font-size="11" fill="#1f2b38">FileOutputStream</text>
  <rect x="561" y="70" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="633" y="115" text-anchor="middle" font-size="11" fill="#1f2b38">FileReader</text>
  <rect x="714" y="70" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="786" y="115" text-anchor="middle" font-size="11" fill="#1f2b38">FileWriter</text>
  <line x1="137" y1="152" x2="137" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="152" y="168" font-size="11" fill="#5b6b7c">包装加强</text>
  <rect x="40" y="175" width="195" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="137" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">缓冲流</text>
  <text x="137" y="229" text-anchor="middle" font-size="11" fill="#5b6b7c">提高读写效率</text>
  <rect x="255" y="175" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="327" y="215" text-anchor="middle" font-size="11" fill="#1f2b38">Buffered</text>
  <text x="327" y="233" text-anchor="middle" font-size="11" fill="#1f2b38">InputStream</text>
  <rect x="408" y="175" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="215" text-anchor="middle" font-size="11" fill="#1f2b38">Buffered</text>
  <text x="480" y="233" text-anchor="middle" font-size="11" fill="#1f2b38">OutputStream</text>
  <rect x="561" y="175" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="633" y="215" text-anchor="middle" font-size="11" fill="#1f2b38">Buffered</text>
  <text x="633" y="233" text-anchor="middle" font-size="11" fill="#1f2b38">Reader</text>
  <rect x="714" y="175" width="145" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="786" y="215" text-anchor="middle" font-size="11" fill="#1f2b38">Buffered</text>
  <text x="786" y="233" text-anchor="middle" font-size="11" fill="#1f2b38">Writer</text>
  <line x1="137" y1="257" x2="137" y2="277" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="152" y="273" font-size="11" fill="#5b6b7c">字节转字符</text>
  <rect x="40" y="280" width="195" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="137" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">转换流</text>
  <text x="137" y="334" text-anchor="middle" font-size="11" fill="#5b6b7c">指定编码表</text>
  <rect x="255" y="280" width="290" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="400" y="325" text-anchor="middle" font-size="11" fill="#1f2b38">InputStreamReader（字节 转 字符）</text>
  <rect x="561" y="280" width="298" height="80" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="710" y="325" text-anchor="middle" font-size="11" fill="#1f2b38">OutputStreamWriter（字符 转 字节）</text>
</svg>
