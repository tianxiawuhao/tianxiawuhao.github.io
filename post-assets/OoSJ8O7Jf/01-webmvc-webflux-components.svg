<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>WebMVC 与 WebFlux 核心组件对照</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">WebMVC 与 WebFlux 核心组件对照</text>
  <rect x="45" y="62" width="350" height="353" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="505" y="62" width="350" height="353" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="220" y="90" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring WebMVC（Servlet 阻塞式）</text>
  <text x="680" y="90" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Spring WebFlux（响应式非阻塞）</text>
  <rect x="60" y="105" width="320" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="220" y="134" font-size="13" fill="#1f2b38" text-anchor="middle">FilterChain 过滤器链</text>
  <rect x="520" y="105" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="680" y="134" font-size="13" fill="#1f2b38" text-anchor="middle">WebFilterChain（Mono&lt;Void&gt;）</text>
  <rect x="60" y="167" width="320" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="220" y="196" font-size="13" fill="#1f2b38" text-anchor="middle">ServletRequest / ServletResponse</text>
  <rect x="520" y="167" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="680" y="196" font-size="13" fill="#1f2b38" text-anchor="middle">ServerHttpRequest / ServerHttpResponse</text>
  <rect x="60" y="229" width="320" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="220" y="258" font-size="13" fill="#1f2b38" text-anchor="middle">DispatcherServlet（前端控制器）</text>
  <rect x="520" y="229" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="680" y="258" font-size="13" fill="#1f2b38" text-anchor="middle">DispatcherHandler（前端控制器）</text>
  <rect x="60" y="291" width="320" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="220" y="320" font-size="13" fill="#1f2b38" text-anchor="middle">HandlerMapping / HandlerAdapter</text>
  <rect x="520" y="291" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="680" y="320" font-size="13" fill="#1f2b38" text-anchor="middle">响应式 HandlerMapping / HandlerAdapter</text>
  <rect x="60" y="353" width="320" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="220" y="382" font-size="13" fill="#1f2b38" text-anchor="middle">RequestMappingHandlerMapping</text>
  <rect x="520" y="353" width="320" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="680" y="382" font-size="13" fill="#1f2b38" text-anchor="middle">RouterFunctionMapping（函数式路由）</text>
  <line x1="384" y1="129" x2="516" y2="129" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="384" y1="191" x2="516" y2="191" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="384" y1="253" x2="516" y2="253" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="384" y1="315" x2="516" y2="315" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="384" y1="377" x2="516" y2="377" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
