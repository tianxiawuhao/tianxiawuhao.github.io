<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>HDFS 主从架构：NameNode 管元数据，DataNode 存块，Client 读写</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">HDFS 主从架构与元数据 / 数据分工</text>

  <!-- Client -->
  <rect x="40" y="170" width="160" height="84" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="202" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Client 客户端</text>
  <text x="120" y="224" font-size="11" fill="#5b6b7c" text-anchor="middle">切分 Block · 发起读写</text>
  <text x="120" y="241" font-size="11" fill="#5b6b7c" text-anchor="middle">提供命令行与 API</text>

  <!-- NameNode -->
  <rect x="370" y="70" width="180" height="84" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="460" y="102" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">NameNode 主节点</text>
  <text x="460" y="124" font-size="11" fill="#5b6b7c" text-anchor="middle">命名空间 / 目录树 / 权限</text>
  <text x="460" y="141" font-size="11" fill="#5b6b7c" text-anchor="middle">块到 DataNode 的映射</text>

  <!-- DataNode -->
  <rect x="370" y="248" width="180" height="84" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="280" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">DataNode 从节点</text>
  <text x="460" y="302" font-size="11" fill="#5b6b7c" text-anchor="middle">存储真实数据块</text>
  <text x="460" y="319" font-size="11" fill="#5b6b7c" text-anchor="middle">定期向 NameNode 汇报</text>

  <!-- Client -> NameNode -->
  <line x1="200" y1="190" x2="358" y2="118" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="286" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">请求元数据 / 上报</text>
  <!-- Client -> DataNode -->
  <line x1="200" y1="234" x2="358" y2="284" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="286" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle">读写数据块</text>
  <!-- NameNode -> DataNode -->
  <line x1="460" y1="154" x2="460" y2="240" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="474" y="201" font-size="11" fill="#5b6b7c">块汇报与副本指令</text>

  <!-- Secondary NameNode -->
  <rect x="680" y="140" width="180" height="84" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="770" y="167" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Secondary NameNode</text>
  <text x="770" y="187" font-size="11" fill="#5b6b7c" text-anchor="middle">定期合并 Fsimage 与 Edits</text>
  <text x="770" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">辅助恢复，不是热备</text>
  <line x1="556" y1="112" x2="672" y2="168" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- block / replica strip -->
  <rect x="40" y="300" width="270" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="175" y="326" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">文件按块切分（默认 128MB）</text>
  <rect x="66" y="338" width="66" height="22" rx="5" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="136" y="338" width="66" height="22" rx="5" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="206" y="338" width="66" height="22" rx="5" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="99" y="354" font-size="11" fill="#1f2b38" text-anchor="middle">Block 0</text>
  <text x="169" y="354" font-size="11" fill="#1f2b38" text-anchor="middle">Block 1</text>
  <text x="239" y="354" font-size="11" fill="#1f2b38" text-anchor="middle">Block 2</text>
</svg>
