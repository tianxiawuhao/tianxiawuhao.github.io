<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>HDFS 写数据流程与三副本流水线</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">HDFS 写数据流程：NameNode 定位 + DataNode 三副本流水线</text>

  <!-- Client -->
  <rect x="30" y="70" width="150" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="105" y="100" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Client</text>
  <text x="105" y="120" font-size="11" fill="#5b6b7c" text-anchor="middle">请求上传文件</text>

  <!-- NameNode -->
  <rect x="240" y="70" width="160" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="320" y="100" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">NameNode</text>
  <text x="320" y="120" font-size="11" fill="#5b6b7c" text-anchor="middle">校验权限 · 返回可用节点</text>

  <line x1="180" y1="98" x2="232" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="232" y1="114" x2="180" y2="114" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="206" y="92" font-size="11" fill="#5b6b7c" text-anchor="middle">①</text>
  <text x="206" y="132" font-size="11" fill="#5b6b7c" text-anchor="middle">②</text>

  <line x1="400" y1="105" x2="450" y2="105" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="425" y="96" font-size="11" fill="#5b6b7c" text-anchor="middle">③</text>

  <!-- pipeline -->
  <rect x="458" y="70" width="130" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="523" y="98" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">DN 1（同节点）</text>
  <text x="523" y="118" font-size="11" fill="#5b6b7c" text-anchor="middle">副本 1</text>

  <line x1="588" y1="105" x2="626" y2="105" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="634" y="70" width="120" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="694" y="98" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">DN 2（异机架）</text>
  <text x="694" y="118" font-size="11" fill="#5b6b7c" text-anchor="middle">副本 2</text>

  <line x1="754" y1="105" x2="792" y2="105" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="800" y="70" width="70" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="835" y="98" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">DN 3</text>
  <text x="835" y="118" font-size="11" fill="#5b6b7c" text-anchor="middle">副本 3</text>

  <text x="450" y="172" font-size="11" fill="#5b6b7c" text-anchor="middle">④ 以 packet 为单位沿 Pipeline 逐级复制，写完最后一个 Block 后通知 NameNode 关闭文件</text>
  <line x1="523" y1="140" x2="523" y2="166" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="694" y1="140" x2="694" y2="166" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- ack back -->
  <line x1="835" y1="200" x2="105" y2="200" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="470" y="216" font-size="11" fill="#5b6b7c" text-anchor="middle">⑤ ACK 应答沿流水线逐级回传，任一副本失败则剔除该节点重建流水线</text>
  <line x1="105" y1="200" x2="105" y2="150" stroke="#c8d3e0" stroke-width="1.4"/>

  <!-- note -->
  <rect x="200" y="240" width="500" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="266" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">一次写入、多次读取（追加写，不支持随机改）</text>
  <text x="450" y="288" font-size="11" fill="#5b6b7c" text-anchor="middle">副本越多越可靠，但跨机架写入会放大网络流量</text>
</svg>
