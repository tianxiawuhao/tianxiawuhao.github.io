<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
<rect width="900" height="480" fill="#ffffff"/>
<text x="450" y="30" font-size="17" fill="#1f2b38" font-weight="700" text-anchor="middle" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">Gradle 日志级别与命令行选项</text>
<text x="30" y="62" font-size="13" fill="#5b6b7c" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">日志级别（重要程度自上而下递减）</text>
<text x="470" y="62" font-size="13" fill="#5b6b7c" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">命令行选项与输出范围</text>
<rect x="30" y="74" width="400" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="470" y="74" width="400" height="330" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="44" y="86" width="372" height="44" rx="8" fill="#fff6e8" stroke="#c8d3e0"/>
<rect x="44" y="86" width="6" height="44" rx="3" fill="#e08a1e"/>
<text x="62" y="114" font-size="14" fill="#1f2b38" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">ERROR</text>
<text x="175" y="113" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">错误消息</text>
<rect x="44" y="138" width="372" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<rect x="44" y="138" width="6" height="44" rx="3" fill="#5b6b7c"/>
<text x="62" y="166" font-size="14" fill="#1f2b38" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">QUIET</text>
<text x="175" y="165" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">重要信息消息</text>
<rect x="44" y="190" width="372" height="44" rx="8" fill="#fff6e8" stroke="#c8d3e0"/>
<rect x="44" y="190" width="6" height="44" rx="3" fill="#e08a1e"/>
<text x="62" y="218" font-size="14" fill="#1f2b38" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">WARNING</text>
<text x="175" y="217" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">警告消息</text>
<rect x="44" y="242" width="372" height="44" rx="8" fill="#eaf7ef" stroke="#c8d3e0"/>
<rect x="44" y="242" width="6" height="44" rx="3" fill="#2e9e5b"/>
<text x="62" y="270" font-size="14" fill="#1f2b38" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">LIFECYCLE</text>
<text x="175" y="269" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">进度信息消息</text>
<text x="404" y="270" font-size="12" fill="#2e9e5b" font-weight="700" text-anchor="end" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">默认输出</text>
<rect x="44" y="294" width="372" height="44" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
<rect x="44" y="294" width="6" height="44" rx="3" fill="#2f6fd0"/>
<text x="62" y="322" font-size="14" fill="#1f2b38" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">INFO</text>
<text x="175" y="321" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">信息消息</text>
<rect x="44" y="346" width="372" height="44" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="44" y="346" width="6" height="44" rx="3" fill="#5b6b7c"/>
<text x="62" y="374" font-size="14" fill="#1f2b38" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">DEBUG</text>
<text x="175" y="373" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">调试消息（最详细）</text>
<rect x="484" y="86" width="372" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="500" y="114" font-size="13" fill="#2f6fd0" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">（无选项）</text>
<text x="844" y="114" font-size="12" fill="#1f2b38" font-weight="normal" text-anchor="end" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">LIFECYCLE 及更高</text>
<rect x="484" y="138" width="372" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="500" y="166" font-size="13" fill="#2f6fd0" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">-q / --quiet</text>
<text x="844" y="166" font-size="12" fill="#1f2b38" font-weight="normal" text-anchor="end" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">QUIET 及更高</text>
<rect x="484" y="190" width="372" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="500" y="218" font-size="13" fill="#2f6fd0" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">-w / --warn</text>
<text x="844" y="218" font-size="12" fill="#1f2b38" font-weight="normal" text-anchor="end" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">WARNING 及更高</text>
<rect x="484" y="242" width="372" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="500" y="270" font-size="13" fill="#2f6fd0" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">-i / --info</text>
<text x="844" y="270" font-size="12" fill="#1f2b38" font-weight="normal" text-anchor="end" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">INFO 及更高</text>
<rect x="484" y="294" width="372" height="44" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="500" y="322" font-size="13" fill="#2f6fd0" font-weight="700" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">-d / --debug</text>
<text x="844" y="322" font-size="12" fill="#1f2b38" font-weight="normal" text-anchor="end" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">DEBUG 及更高（全部日志）</text>
<text x="30" y="436" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">说明：「X 及更高」表示输出该级别，以及表中位于其上方、重要程度更高的级别。</text>
<text x="30" y="458" font-size="12" fill="#5b6b7c" font-weight="normal" text-anchor="start" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">因此默认输出 ERROR、QUIET、WARNING、LIFECYCLE；-d（--debug）输出全部日志。</text>
</svg>
