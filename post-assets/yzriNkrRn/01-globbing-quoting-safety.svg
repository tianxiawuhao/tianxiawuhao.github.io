<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>通配符展开、引号转义与危险安全写法对照</title>
<rect width="900" height="490" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">通配符展开、引号转义与危险/安全写法</text>
<rect x="20" y="50" width="280" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="160" y="74" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">单引号 '...'</text>
<text x="34" y="96" font-size="12" fill="#1f2b38">完全字面量：通配符、$变量</text>
<text x="34" y="112" font-size="12" fill="#1f2b38">都不展开，原样交给命令</text>
<rect x="310" y="50" width="280" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="74" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">双引号 "..."</text>
<text x="324" y="96" font-size="12" fill="#1f2b38">阻止通配符展开；</text>
<text x="324" y="112" font-size="12" fill="#1f2b38">$变量、$(命令) 仍会替换</text>
<rect x="600" y="50" width="280" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="740" y="74" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">不加引号</text>
<text x="614" y="96" font-size="12" fill="#1f2b38">shell 先展开通配符，</text>
<text x="614" y="112" font-size="12" fill="#1f2b38">命令只收到展开后的文件名</text>
<rect x="20" y="146" width="156" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="98" y="178" font-size="12" fill="#1f2b38" text-anchor="middle">① 读取整行</text>
<line x1="178" y1="174" x2="193" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="196" y="146" width="156" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="274" y="178" font-size="12" fill="#1f2b38" text-anchor="middle">② 引号与转义</text>
<line x1="354" y1="174" x2="369" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="372" y="146" width="156" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="178" font-size="12" fill="#1f2b38" text-anchor="middle">③ 变量/命令替换</text>
<line x1="530" y1="174" x2="545" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="548" y="146" width="156" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="626" y="178" font-size="12" fill="#1f2b38" text-anchor="middle">④ 通配符展开</text>
<line x1="706" y1="174" x2="721" y2="174" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="724" y="146" width="156" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="802" y="178" font-size="12" fill="#1f2b38" text-anchor="middle">⑤ 执行命令</text>
<text x="20" y="230" font-size="11.5" fill="#5b6b7c">所以 -name、-path 这类模式要写成 'nginx*'：加引号才是交给命令自己匹配，不加引号则由 shell 先展开。</text>
<rect x="20" y="248" width="860" height="30" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="110" y="268" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">场景</text>
<text x="380" y="268" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">危险写法</text>
<text x="720" y="268" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">安全写法</text>
<rect x="20" y="278" width="860" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="110" y="300" font-size="12" fill="#1f2b38" text-anchor="middle">删除目录内容</text>
<text x="380" y="300" font-size="12" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">rm -rf /tmp/dir *</text>
<text x="720" y="300" font-size="12" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">rm -rf /tmp/dir/*</text>
<rect x="20" y="312" width="860" height="34" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="110" y="334" font-size="12" fill="#1f2b38" text-anchor="middle">find 名称匹配</text>
<text x="380" y="334" font-size="12" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">find . -name *.log</text>
<text x="720" y="334" font-size="12" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">find . -name '*.log'</text>
<rect x="20" y="346" width="860" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="110" y="368" font-size="12" fill="#1f2b38" text-anchor="middle">改写日志文件</text>
<text x="380" y="368" font-size="12" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">echo x &gt; app.log</text>
<text x="720" y="368" font-size="12" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">echo x &gt;&gt; app.log</text>
<rect x="20" y="380" width="860" height="34" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="110" y="402" font-size="12" fill="#1f2b38" text-anchor="middle">文件名含空格</text>
<text x="380" y="402" font-size="12" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">rm $(find . -name '*.log')</text>
<text x="720" y="402" font-size="12" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">find . -print0 | xargs -0 rm -f</text>
<text x="20" y="440" font-size="11" fill="#5b6b7c">退出码：0 表示成功、非 0 表示失败；cmd1 &amp;&amp; cmd2 表示前者成功才执行后者，cmd1 || cmd2 表示前者失败才执行后者。</text>
<text x="20" y="460" font-size="11" fill="#5b6b7c">管道默认只返回最后一个命令的退出码，加 set -o pipefail 才能传播失败；查看管道各段状态用 ${PIPESTATUS[@]}。</text>
</svg>
