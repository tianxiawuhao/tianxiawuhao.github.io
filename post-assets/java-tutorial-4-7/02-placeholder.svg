<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>对比图：井号花括号生成预编译占位符可防注入，美元花括号是字符串替换只能拼表名列名</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">预编译 #{} 与字符串替换 ${}：默认只该用前者</text>

  <rect x="40" y="58" width="400" height="236" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="240" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">#{}：预编译占位符</text>
  <text x="62" y="114" font-size="11.5" fill="#1f2b38">生成 JDBC 的 ? 占位符，参数不参与 SQL 语法解析</text>
  <text x="62" y="140" font-size="11.5" fill="#1f2b38">能防 SQL 注入，应作为默认选择</text>
  <rect x="62" y="158" width="356" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="82" y="182" font-size="11" fill="#1f2b38">select * from tb_user</text>
  <text x="82" y="202" font-size="11" fill="#1f2b38">where user_name = ?</text>
  <text x="62" y="248" font-size="11" fill="#5b6b7c">例：where user_name = #{userName}</text>

  <rect x="460" y="58" width="400" height="236" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="660" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">${}：字符串直接替换</text>
  <text x="482" y="114" font-size="11.5" fill="#1f2b38">把参数原样拼进 SQL 文本，可被注入</text>
  <text x="482" y="140" font-size="11.5" fill="#1f2b38">只适合表名、列名、排序字段等结构位置</text>
  <rect x="482" y="158" width="356" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="502" y="182" font-size="11" fill="#1f2b38">select * from tb_user</text>
  <text x="502" y="202" font-size="11" fill="#1f2b38">order by ${sortColumn}</text>
  <text x="482" y="248" font-size="11" fill="#5b6b7c">接用户输入就等于打开注入口子</text>

  <rect x="40" y="316" width="820" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="340" font-size="11.5" fill="#1f2b38">单参数：#{} 里的名字可以随便写；多参数：被放进 Map，默认键为 arg0/arg1 与 param1/param2。</text>
  <text x="60" y="362" font-size="11.5" fill="#1f2b38">稳妥做法：给每个参数都加 @Param("userName")，否则报 Parameter 'userName' not found。</text>
</svg>
