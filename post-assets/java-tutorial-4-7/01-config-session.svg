<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MyBatis 启动与调用链示意图：两份配置文件经 SqlSessionFactoryBuilder 构建工厂，再由此开出 SqlSession 调用 Mapper 动态代理</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">两份配置文件，一条 SqlSession 调用链</text>

  <rect x="40" y="80" width="210" height="130" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="145" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">配置文件（两份）</text>
  <rect x="55" y="112" width="180" height="42" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f6fd0">mybatis-config.xml</text>
  <text x="145" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">数据源 / 事务 / settings</text>
  <rect x="55" y="160" width="180" height="42" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f6fd0">UserMapper.xml</text>
  <text x="145" y="194" text-anchor="middle" font-size="11" fill="#5b6b7c">SQL、参数类型、结果类型</text>
  <line x1="250" y1="145" x2="286" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="292" y="112" width="196" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="390" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">SqlSessionFactoryBuilder</text>
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="#5b6b7c">读全局配置，构建工厂</text>
  <line x1="488" y1="145" x2="524" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="530" y="112" width="190" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="625" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">SqlSessionFactory</text>
  <text x="625" y="158" text-anchor="middle" font-size="11" fill="#5b6b7c">长期存活，应用内一个</text>
  <path d="M 625 178 L 625 216 L 285 216 L 285 242" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="190" y="246" width="190" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="285" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">SqlSession</text>
  <text x="285" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">每次操作开一个，用完 close</text>
  <line x1="380" y1="278" x2="416" y2="278" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="422" y="246" width="220" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="532" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Mapper 接口（动态代理）</text>
  <text x="532" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">无实现类，getMapper 生成</text>
  <line x1="642" y1="278" x2="678" y2="278" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="684" y="246" width="176" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="772" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">数据库 tb_user</text>
  <text x="772" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">SQL 写在映射文件里</text>

  <rect x="40" y="330" width="820" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="352" text-anchor="middle" font-size="11.5" fill="#1f2b38">四条约定：namespace = 接口全限定名；statement 的 id = 方法名；</text>
  <text x="450" y="370" text-anchor="middle" font-size="11.5" fill="#1f2b38">resultType 与返回元素类型一致；参数类型与接口方法一致（parameterType 可省略）</text>
</svg>
