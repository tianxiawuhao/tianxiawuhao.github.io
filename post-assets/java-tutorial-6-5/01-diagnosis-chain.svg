<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>线上问题排查链路</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">线上排查链路：先看态势，再看细节</text>

  <rect x="30" y="60" width="415" height="24" rx="12" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="237" y="77" text-anchor="middle" font-size="11.5" fill="#2f6fd0">流程视角：隔一段时间看一眼，回答「哪里在涨」</text>
  <rect x="460" y="60" width="400" height="24" rx="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="77" text-anchor="middle" font-size="11.5" fill="#2e9e5b">快照视角：冻住瞬间状态，回答「谁占着资源」</text>

  <rect x="30" y="100" width="185" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="122" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">jps</text>
  <text x="122" y="158" text-anchor="middle" font-size="11" fill="#1f2b38">列出所有 Java 进程与 PID</text>
  <text x="122" y="180" text-anchor="middle" font-size="11" fill="#1f2b38">替代 ps -ef | grep java</text>
  <text x="122" y="206" text-anchor="middle" font-size="11" fill="#5b6b7c">入口：先拿到进程号</text>

  <rect x="245" y="100" width="185" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="337" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">jstat</text>
  <text x="337" y="158" text-anchor="middle" font-size="11" fill="#1f2b38">堆各区使用量、GC 次数</text>
  <text x="337" y="180" text-anchor="middle" font-size="11" fill="#1f2b38">与累计耗时（时间单位是秒）</text>
  <text x="337" y="206" text-anchor="middle" font-size="11" fill="#5b6b7c">看趋势：是不是 GC 的锅</text>

  <rect x="460" y="100" width="185" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="552" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">jmap + MAT</text>
  <text x="552" y="158" text-anchor="middle" font-size="11" fill="#1f2b38">对象直方图、导出堆 dump</text>
  <text x="552" y="180" text-anchor="middle" font-size="11" fill="#1f2b38">MAT 支配树找支配对象</text>
  <text x="552" y="206" text-anchor="middle" font-size="11" fill="#5b6b7c">抓内存：谁占着不放</text>

  <rect x="675" y="100" width="185" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="767" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">jstack</text>
  <text x="767" y="158" text-anchor="middle" font-size="11" fill="#1f2b38">打印所有线程调用栈</text>
  <text x="767" y="180" text-anchor="middle" font-size="11" fill="#1f2b38">含 nid 与线程状态</text>
  <text x="767" y="206" text-anchor="middle" font-size="11" fill="#5b6b7c">抓线程：谁卡住了</text>

  <line x1="215" y1="160" x2="243" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="430" y1="160" x2="458" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="645" y1="160" x2="673" y2="160" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">jps 找进程 → jstat 看趋势 → jmap/MAT 抓内存 → jstack 抓线程</text>
  <text x="450" y="284" text-anchor="middle" font-size="11.5" fill="#5b6b7c">工具都在 $JAVA_HOME/bin；需与目标进程 JDK 版本一致，导堆与线程快照会造成短暂停顿</text>
</svg>
