<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>一行 GC 日志的四个信息点</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一行 GC 日志的四个信息点</text>

  <text x="40" y="92" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1f2b38">[GC (Allocation Failure) [ParNew: 4416K-&gt;512K(4928K), 0.0032 secs] 4416K-&gt;1988K(15872K), 0.0033 secs]</text>

  <line x1="40" y1="102" x2="235" y2="102" stroke="#e08a1e" stroke-width="3"/>
  <line x1="235" y1="102" x2="558" y2="102" stroke="#2f6fd0" stroke-width="3"/>
  <line x1="558" y1="102" x2="723" y2="102" stroke="#2e9e5b" stroke-width="3"/>
  <line x1="723" y1="102" x2="813" y2="102" stroke="#7a5bd0" stroke-width="3"/>

  <line x1="137" y1="106" x2="120" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="396" y1="106" x2="330" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="640" y1="106" x2="545" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="768" y1="106" x2="760" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="25" y="150" width="190" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="120" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">触发原因</text>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#1f2b38">Allocation Failure</text>
  <text x="120" y="222" text-anchor="middle" font-size="11" fill="#1f2b38">新生代分配失败触发</text>
  <text x="120" y="244" text-anchor="middle" font-size="11" fill="#5b6b7c">正常现象，不是报错</text>

  <rect x="235" y="150" width="190" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="330" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">新生代回收</text>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#1f2b38">ParNew 收集器</text>
  <text x="330" y="222" text-anchor="middle" font-size="11" fill="#1f2b38">4416K-&gt;512K(4928K)</text>
  <text x="330" y="244" text-anchor="middle" font-size="11" fill="#5b6b7c">回收前后与总容量</text>

  <rect x="445" y="150" width="190" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="540" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">整堆变化</text>
  <text x="540" y="200" text-anchor="middle" font-size="11" fill="#1f2b38">4416K-&gt;1988K(15872K)</text>
  <text x="540" y="222" text-anchor="middle" font-size="11" fill="#1f2b38">整个堆回收前后与总量</text>
  <text x="540" y="244" text-anchor="middle" font-size="11" fill="#5b6b7c">对照 jstat 的 OU 一起看</text>

  <rect x="655" y="150" width="190" height="120" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="750" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5bd0">停顿耗时</text>
  <text x="750" y="200" text-anchor="middle" font-size="11" fill="#1f2b38">0.0033 secs</text>
  <text x="750" y="222" text-anchor="middle" font-size="11" fill="#1f2b38">本次 GC 的 STW 时长</text>
  <text x="750" y="244" text-anchor="middle" font-size="11" fill="#5b6b7c">Full GC 表示整堆回收</text>

  <text x="450" y="302" text-anchor="middle" font-size="12" fill="#1f2b38">单次日志只说明这一次发生了什么，趋势要靠隔一段时间的采样</text>
</svg>
