<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>稀疏求解器与迭代求解器对比</title>
<rect width="900" height="300" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">稀疏求解器与迭代求解器对比</text>
<rect x="60" y="52" width="360" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="240" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">稀疏求解器（直接法）</text>
<rect x="480" y="52" width="360" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="660" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">迭代求解器（间接法）</text>
<rect x="60" y="108" width="360" height="148" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="480" y="108" width="360" height="148" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="80" y="132" font-size="11" fill="#1f2b38">• 直接求解，一次分解得到结果</text>
<text x="80" y="156" font-size="11" fill="#1f2b38">• 仅存储非零项，省去带宽优化</text>
<text x="80" y="180" font-size="11" fill="#1f2b38">• 需记录非零项位置，内存占用较大</text>
<text x="80" y="204" font-size="11" fill="#1f2b38">• 中小型模型求解速度通常最快</text>
<text x="500" y="132" font-size="11" fill="#1f2b38">• 间接求解，需设定最大迭代次数</text>
<text x="500" y="156" font-size="11" fill="#1f2b38">• 需给出收敛准则，不保证一定收敛</text>
<text x="500" y="180" font-size="11" fill="#1f2b38">• 从初始猜测出发，常配合预条件器</text>
<text x="500" y="204" font-size="11" fill="#1f2b38">• 内存占用比稀疏求解器更少</text>
<text x="500" y="228" font-size="11" fill="#1f2b38">• 大型模型收敛时速度通常最快</text>
</svg>
