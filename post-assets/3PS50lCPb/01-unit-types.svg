<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>有限元单元的分类：按维度与按阶次</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
</defs>
<text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">有限元单元的分类</text>
<rect x="30" y="56" width="840" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="52" y="80" font-size="13" font-weight="700" fill="#2f6fd0">按维度划分</text>
<rect x="52" y="94" width="250" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="177" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">一维单元</text>
<text x="177" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">杆单元、梁单元</text>
<text x="177" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">模拟拉压、弯曲与扭转</text>
<rect x="325" y="94" width="250" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">二维单元</text>
<text x="450" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">三角形、四边形单元</text>
<text x="450" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">模拟板、壳等平面结构</text>
<rect x="598" y="94" width="250" height="68" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="723" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">三维单元</text>
<text x="723" y="136" text-anchor="middle" font-size="11" fill="#5b6b7c">四面体、六面体、棱柱</text>
<text x="723" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">模拟实体结构的应力与变形</text>
<rect x="30" y="196" width="840" height="176" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="52" y="220" font-size="13" font-weight="700" fill="#e08a1e">按阶次划分</text>
<rect x="52" y="234" width="250" height="78" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="177" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">一阶单元（Linear）</text>
<text x="177" y="281" text-anchor="middle" font-size="11" fill="#5b6b7c">线性插值函数</text>
<text x="177" y="299" text-anchor="middle" font-size="11" fill="#5b6b7c">计算快、精度较低</text>
<rect x="325" y="234" width="250" height="78" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">二阶单元（Quadratic）</text>
<text x="450" y="281" text-anchor="middle" font-size="11" fill="#5b6b7c">二次插值函数</text>
<text x="450" y="299" text-anchor="middle" font-size="11" fill="#5b6b7c">精度较高、成本中等</text>
<rect x="598" y="234" width="250" height="78" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="723" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">三阶单元（Cubic）</text>
<text x="723" y="281" text-anchor="middle" font-size="11" fill="#5b6b7c">三次插值函数</text>
<text x="723" y="299" text-anchor="middle" font-size="11" fill="#5b6b7c">逼近更精确、成本更高</text>
<text x="450" y="332" text-anchor="middle" font-size="11" fill="#5b6b7c">插值阶次提高 → 精度提高，计算成本增加</text>
<line x1="60" y1="344" x2="840" y2="344" stroke="#c8d3e0" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
