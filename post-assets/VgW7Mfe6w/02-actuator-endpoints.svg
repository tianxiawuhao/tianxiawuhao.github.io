<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Boot Actuator 常用监控端点与暴露配置</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Actuator 常用监控端点</text>
  <rect x="45" y="80" width="150" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">/actuator/</text>
  <text x="120" y="150" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">health</text>
  <text x="120" y="168" font-size="11" fill="#5b6b7c" text-anchor="middle">健康检查</text>
  <rect x="205" y="80" width="150" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="280" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">/actuator/</text>
  <text x="280" y="150" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">info</text>
  <text x="280" y="168" font-size="11" fill="#5b6b7c" text-anchor="middle">应用信息</text>
  <rect x="365" y="80" width="150" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="440" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">/actuator/</text>
  <text x="440" y="150" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">metrics</text>
  <text x="440" y="168" font-size="11" fill="#5b6b7c" text-anchor="middle">指标明细</text>
  <rect x="525" y="80" width="150" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="600" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">/actuator/</text>
  <text x="600" y="150" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">env</text>
  <text x="600" y="168" font-size="11" fill="#5b6b7c" text-anchor="middle">环境变量</text>
  <rect x="685" y="80" width="150" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="760" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">/actuator/</text>
  <text x="760" y="150" font-size="15" fill="#2f6fd0" text-anchor="middle" font-weight="700">beans</text>
  <text x="760" y="168" font-size="11" fill="#5b6b7c" text-anchor="middle">Bean 列表</text>
  <rect x="45" y="204" width="810" height="96" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="230" font-size="13" fill="#1f2b38" font-weight="700">配置要点</text>
  <text x="60" y="254" font-size="11" fill="#5b6b7c">management.endpoints.web.exposure.include 控制暴露哪些端点，生产环境只暴露 health、info、metrics。</text>
  <text x="60" y="274" font-size="11" fill="#5b6b7c">management.endpoint.health.show-details 决定是否展示组件明细，对外网开放时应保持 never。</text>
  <text x="60" y="294" font-size="11" fill="#5b6b7c">通过 HealthIndicator 可自定义业务健康状态，返回 UP / DOWN 再由 /actuator/health 汇总。</text></svg>
