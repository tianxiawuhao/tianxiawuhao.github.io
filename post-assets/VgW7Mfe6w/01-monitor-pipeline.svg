<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Boot Actuator 接入 Prometheus 与 Grafana 的整体链路</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Spring Boot 监控链路：Actuator → Prometheus → Grafana</text>
  <rect x="45" y="80" width="230" height="96" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.6"/>
  <rect x="45" y="80" width="230" height="30" rx="8" fill="#eef4ff"/>
  <text x="160" y="100" font-size="14" fill="#2f6fd0" text-anchor="middle" font-weight="700">Spring Boot 应用</text>
  <text x="160" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">/actuator/health｜info</text>
  <rect x="335" y="80" width="230" height="96" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.6"/>
  <rect x="335" y="80" width="230" height="30" rx="8" fill="#fff6e8"/>
  <text x="450" y="100" font-size="14" fill="#e08a1e" text-anchor="middle" font-weight="700">Prometheus</text>
  <text x="450" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">抓取 / 存储 / 告警</text>
  <rect x="625" y="80" width="230" height="96" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.6"/>
  <rect x="625" y="80" width="230" height="30" rx="8" fill="#eaf7ef"/>
  <text x="740" y="100" font-size="14" fill="#2e9e5b" text-anchor="middle" font-weight="700">Grafana</text>
  <text x="740" y="134" font-size="11" fill="#5b6b7c" text-anchor="middle">查询 / 可视化 / 告警</text>
  <line x1="275" y1="128" x2="330" y2="128" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="565" y1="128" x2="620" y2="128" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="302" y="118" font-size="11" fill="#5b6b7c" text-anchor="middle">HTTP 抓取</text>
  <text x="592" y="118" font-size="11" fill="#5b6b7c" text-anchor="middle">PromQL 查询</text>
  <text x="450" y="204" font-size="11" fill="#5b6b7c" text-anchor="middle">micrometer-registry-prometheus 把指标转换成 Prometheus 可抓取的文本格式</text>
  <rect x="45" y="240" width="230" height="106" rx="8" fill="none" stroke="#c8d3e0" stroke-width="1.2"/>
  <rect x="45" y="240" width="230" height="22" rx="8" fill="#eef4ff"/>
  <text x="160" y="255" font-size="12" fill="#2f6fd0" text-anchor="middle" font-weight="700">应用侧</text>
  <text x="53" y="282" font-size="11" fill="#1f2b38">1. 引入 Actuator 与 micrometer 依赖</text>
  <text x="53" y="302" font-size="11" fill="#1f2b38">2. 暴露并访问 /actuator 端点</text>
  <text x="53" y="322" font-size="11" fill="#1f2b38">3. 编写自定义 HealthIndicator</text>
  <rect x="335" y="240" width="230" height="106" rx="8" fill="none" stroke="#c8d3e0" stroke-width="1.2"/>
  <rect x="335" y="240" width="230" height="22" rx="8" fill="#fff6e8"/>
  <text x="450" y="255" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700">Prometheus 侧</text>
  <text x="343" y="282" font-size="11" fill="#1f2b38">1. 配置 prometheus.yml 的 targets</text>
  <text x="343" y="302" font-size="11" fill="#1f2b38">2. 启动并确认 targets 为 UP</text>
  <text x="343" y="322" font-size="11" fill="#1f2b38">3. 在 Graph 页验证指标</text>
  <rect x="625" y="240" width="230" height="106" rx="8" fill="none" stroke="#c8d3e0" stroke-width="1.2"/>
  <rect x="625" y="240" width="230" height="22" rx="8" fill="#eaf7ef"/>
  <text x="740" y="255" font-size="12" fill="#2e9e5b" text-anchor="middle" font-weight="700">Grafana 侧</text>
  <text x="633" y="282" font-size="11" fill="#1f2b38">1. 添加 Prometheus 数据源</text>
  <text x="633" y="302" font-size="11" fill="#1f2b38">2. 导入 Dashboard 12900</text>
  <text x="633" y="322" font-size="11" fill="#1f2b38">3. 按需调整面板与告警</text></svg>
