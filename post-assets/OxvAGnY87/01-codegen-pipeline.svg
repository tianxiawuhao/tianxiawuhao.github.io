<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>easeCode 代码生成链路：元数据采集 → 模板渲染 → 产物落盘</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">easeCode 代码生成链路</text>

  <!-- 1 元数据采集 -->
  <rect x="30" y="55" width="840" height="95" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="79" font-size="13" font-weight="700" fill="#2f6fd0">① 元数据采集</text>
  <rect x="50" y="90" width="215" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="157" y="110" text-anchor="middle" font-size="12" fill="#1f2b38">数据库表结构</text>
  <text x="157" y="127" text-anchor="middle" font-size="11" fill="#5b6b7c">列名 / 类型 / 主键 / 注释</text>
  <rect x="342" y="90" width="215" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="449" y="110" text-anchor="middle" font-size="12" fill="#1f2b38">TableInfo 元数据对象</text>
  <text x="449" y="127" text-anchor="middle" font-size="11" fill="#5b6b7c">pkColumn / fullColumn / otherColumn</text>
  <rect x="634" y="90" width="215" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="741" y="110" text-anchor="middle" font-size="12" fill="#1f2b38">全局配置注入</text>
  <text x="741" y="127" text-anchor="middle" font-size="11" fill="#5b6b7c">savePath / savePackageName / 作者</text>
  <line x1="267" y1="113" x2="336" y2="113" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="559" y1="113" x2="628" y2="113" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 2 模板渲染 -->
  <rect x="30" y="170" width="840" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="194" font-size="13" font-weight="700" fill="#2f6fd0">② 模板渲染</text>
  <rect x="50" y="205" width="215" height="71" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="157" y="226" text-anchor="middle" font-size="12" fill="#1f2b38">Velocity 模板引擎</text>
  <text x="157" y="244" text-anchor="middle" font-size="11" fill="#5b6b7c">#foreach / #if / #set</text>
  <text x="157" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">$!{tableInfo.name} 取变量</text>
  <rect x="342" y="205" width="215" height="71" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="449" y="226" text-anchor="middle" font-size="12" fill="#5b6b7c">Freemarker 引擎</text>
  <text x="449" y="244" text-anchor="middle" font-size="11" fill="#5b6b7c">另一套模板语法</text>
  <text x="449" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">与 .vm 模板不可混用</text>
  <rect x="634" y="205" width="215" height="71" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="741" y="226" text-anchor="middle" font-size="12" fill="#1f2b38">工具类与宏定义</text>
  <text x="741" y="244" text-anchor="middle" font-size="11" fill="#5b6b7c">tool / define.vm / autoImport.vm</text>
  <text x="741" y="262" text-anchor="middle" font-size="11" fill="#5b6b7c">callback.setFileName / setSavePath</text>
  <line x1="267" y1="240" x2="336" y2="240" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="449" y1="170" x2="449" y2="200" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="628" y1="240" x2="563" y2="240" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 3 产物 -->
  <rect x="30" y="305" width="840" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="329" font-size="13" font-weight="700" fill="#2f6fd0">③ 产物分层落盘</text>
  <rect x="50" y="340" width="192" height="71" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="146" y="362" text-anchor="middle" font-size="12" fill="#1f2b38">entity / to / vo</text>
  <text x="146" y="380" text-anchor="middle" font-size="11" fill="#5b6b7c">实体、查询 TO、视图 VO</text>
  <text x="146" y="398" text-anchor="middle" font-size="11" fill="#5b6b7c">.java</text>
  <rect x="260" y="340" width="192" height="71" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="356" y="362" text-anchor="middle" font-size="12" fill="#1f2b38">mapper 接口 + XML</text>
  <text x="356" y="380" text-anchor="middle" font-size="11" fill="#5b6b7c">resultMap / 批量 SQL</text>
  <text x="356" y="398" text-anchor="middle" font-size="11" fill="#5b6b7c">resources/mapper</text>
  <rect x="470" y="340" width="192" height="71" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="566" y="362" text-anchor="middle" font-size="12" fill="#1f2b38">service + impl</text>
  <text x="566" y="380" text-anchor="middle" font-size="11" fill="#5b6b7c">分页与条件查询</text>
  <text x="566" y="398" text-anchor="middle" font-size="11" fill="#5b6b7c">LambdaQueryWrapper</text>
  <rect x="680" y="340" width="169" height="71" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="764" y="362" text-anchor="middle" font-size="12" fill="#1f2b38">controller</text>
  <text x="764" y="380" text-anchor="middle" font-size="11" fill="#5b6b7c">REST 接口</text>
  <text x="764" y="398" text-anchor="middle" font-size="11" fill="#5b6b7c">Swagger 注解</text>

  <!-- 4 预览下载 -->
  <rect x="30" y="440" width="840" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#1f2b38">④ 预览与下载：引擎渲染结果先写入内存，供在线预览；确认后打包为 zip 下载，前端手动落盘到工程目录</text>

  <line x1="450" y1="425" x2="450" y2="436" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="220" y1="168" x2="220" y2="303" stroke="#c8d3e0" stroke-width="1.4"/>
</svg>
