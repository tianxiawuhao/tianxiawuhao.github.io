<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>元数据 → 模板 → 代码产物的字段映射结构</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">元数据 → 模板 → 代码产物：字段映射结构</text>

  <!-- 列头 -->
  <rect x="30" y="50" width="240" height="30" rx="8" fill="#1f2b38"/>
  <text x="150" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">元数据（TableInfo）</text>
  <rect x="340" y="50" width="220" height="30" rx="8" fill="#2f6fd0"/>
  <text x="450" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">模板语法（.vm）</text>
  <rect x="630" y="50" width="240" height="30" rx="8" fill="#2e9e5b"/>
  <text x="750" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">产物片段</text>

  <!-- 行1 -->
  <rect x="30" y="95" width="240" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="115" text-anchor="middle" font-size="12" fill="#1f2b38">tableInfo.name</text>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">表名转成的驼峰类名</text>
  <rect x="340" y="95" width="220" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="115" text-anchor="middle" font-size="12" fill="#1f2b38">$!{tableInfo.name}</text>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">$tool.append(名字, &quot;Controller&quot;)</text>
  <rect x="630" y="95" width="240" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="115" text-anchor="middle" font-size="12" fill="#1f2b38">UserController.java</text>
  <text x="750" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">$!callback.setFileName(...)</text>
  <line x1="274" y1="118" x2="334" y2="118" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="118" x2="624" y2="118" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 行2 -->
  <rect x="30" y="155" width="240" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="175" text-anchor="middle" font-size="12" fill="#1f2b38">tableInfo.comment</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#5b6b7c">表注释</text>
  <rect x="340" y="155" width="220" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="175" text-anchor="middle" font-size="12" fill="#1f2b38">#tableComment(&quot;实体类&quot;)</text>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#5b6b7c">define.vm 中定义的宏</text>
  <rect x="630" y="155" width="240" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="175" text-anchor="middle" font-size="12" fill="#1f2b38">类注释与 Swagger 描述</text>
  <text x="750" y="192" text-anchor="middle" font-size="11" fill="#5b6b7c">@Tag / @Schema(title=…)</text>
  <line x1="274" y1="178" x2="334" y2="178" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="178" x2="624" y2="178" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 行3 -->
  <rect x="30" y="215" width="240" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="235" text-anchor="middle" font-size="12" fill="#1f2b38">pkColumn.get(0)</text>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#5b6b7c">主键列，pk.shortType / pk.name</text>
  <rect x="340" y="215" width="220" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="235" text-anchor="middle" font-size="12" fill="#1f2b38">#if(!$tableInfo.pkColumn.isEmpty())</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#5b6b7c">#set($pk = …)</text>
  <rect x="630" y="215" width="240" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="235" text-anchor="middle" font-size="12" fill="#1f2b38">@TableId(type = IdType.AUTO)</text>
  <text x="750" y="252" text-anchor="middle" font-size="11" fill="#5b6b7c">where id = #{id}</text>
  <line x1="274" y1="238" x2="334" y2="238" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="238" x2="624" y2="238" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 行4 -->
  <rect x="30" y="275" width="240" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="295" text-anchor="middle" font-size="12" fill="#1f2b38">#foreach($column in fullColumn)</text>
  <text x="150" y="312" text-anchor="middle" font-size="11" fill="#5b6b7c">column.name / column.obj.name</text>
  <text x="150" y="328" text-anchor="middle" font-size="11" fill="#5b6b7c">column.comment / column.ext.jdbcType</text>
  <rect x="340" y="275" width="220" height="60" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="295" text-anchor="middle" font-size="12" fill="#1f2b38">$!{tool.getClsNameByFullName(</text>
  <text x="450" y="312" text-anchor="middle" font-size="12" fill="#1f2b38">$column.type)}</text>
  <text x="450" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">$!{tool.hump2Underline($column.name)}</text>
  <rect x="630" y="275" width="240" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="295" text-anchor="middle" font-size="12" fill="#1f2b38">private String userName;</text>
  <text x="750" y="312" text-anchor="middle" font-size="11" fill="#5b6b7c">@Column(name = &quot;user_name&quot;)</text>
  <text x="750" y="329" text-anchor="middle" font-size="11" fill="#5b6b7c">&lt;result property column jdbcType/&gt;</text>
  <line x1="274" y1="305" x2="334" y2="305" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="305" x2="624" y2="305" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 行5 -->
  <rect x="30" y="350" width="240" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="370" text-anchor="middle" font-size="12" fill="#1f2b38">otherColumn</text>
  <text x="150" y="387" text-anchor="middle" font-size="11" fill="#5b6b7c">排除主键后的列集合</text>
  <rect x="340" y="350" width="220" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#1f2b38">#foreach($column in otherColumn)</text>
  <text x="450" y="387" text-anchor="middle" font-size="11" fill="#5b6b7c">#if($velocityHasNext), #end</text>
  <rect x="630" y="350" width="240" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="370" text-anchor="middle" font-size="12" fill="#1f2b38">insert into t_user(…)</text>
  <text x="750" y="387" text-anchor="middle" font-size="11" fill="#5b6b7c">values (#{entity.userName}, …)</text>
  <line x1="274" y1="373" x2="334" y2="373" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="373" x2="624" y2="373" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 行6 -->
  <rect x="30" y="410" width="240" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="430" text-anchor="middle" font-size="12" fill="#1f2b38">savePath / savePackageName</text>
  <text x="150" y="447" text-anchor="middle" font-size="11" fill="#5b6b7c">输出目录与基础包名</text>
  <rect x="340" y="410" width="220" height="46" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#1f2b38">#save(&quot;/entity&quot;, &quot;.java&quot;)</text>
  <text x="450" y="447" text-anchor="middle" font-size="11" fill="#5b6b7c">#setPackageSuffix(&quot;entity&quot;)</text>
  <rect x="630" y="410" width="240" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="430" text-anchor="middle" font-size="12" fill="#1f2b38">entity/User.java</text>
  <text x="750" y="447" text-anchor="middle" font-size="11" fill="#5b6b7c">package …entity;</text>
  <line x1="274" y1="433" x2="334" y2="433" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="433" x2="624" y2="433" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="486" text-anchor="middle" font-size="11" fill="#5b6b7c">注：column.shortType（简类名）与 column.type（全限定类名）在模板中用途不同，混用会导致类型判断与导入不一致。</text>
  <text x="450" y="506" text-anchor="middle" font-size="11" fill="#5b6b7c">column.obj.name 取数据库原始列名/表名，直接写库；驼峰名用于 Java 属性，二者不能互换。</text>
</svg>
