<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>七大查找算法前提条件、复杂度与适用场景对照表</title>
<rect width="900" height="450" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">七大查找算法前提条件、复杂度与适用场景对照表</text>
<rect x="20" y="52" width="860" height="30" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">算法</text>
<text x="237" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">前提条件</text>
<text x="397" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">平均时间</text>
<text x="505" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">最坏时间</text>
<text x="607" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">辅助空间</text>
<text x="767" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">适用场景</text>
<rect x="20" y="86" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="106" font-size="11.5" fill="#1f2b38" text-anchor="middle">顺序查找</text>
<text x="237" y="106" font-size="11.5" fill="#1f2b38" text-anchor="middle">无（表可以无序）</text>
<text x="397" y="106" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="505" y="106" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="607" y="106" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="767" y="106" font-size="11.5" fill="#1f2b38" text-anchor="middle">无序表、小规模、链表</text>
<rect x="20" y="120" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="140" font-size="11.5" fill="#1f2b38" text-anchor="middle">二分查找</text>
<text x="237" y="140" font-size="11.5" fill="#1f2b38" text-anchor="middle">顺序存储且按关键字有序</text>
<text x="397" y="140" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(log n)</text>
<text x="505" y="140" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(log n)</text>
<text x="607" y="140" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="767" y="140" font-size="11.5" fill="#1f2b38" text-anchor="middle">静态有序数组，查多改少</text>
<rect x="20" y="154" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="174" font-size="11.5" fill="#1f2b38" text-anchor="middle">插值查找</text>
<text x="237" y="174" font-size="11.5" fill="#1f2b38" text-anchor="middle">有序且关键字近似均匀分布</text>
<text x="397" y="174" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(log log n)</text>
<text x="505" y="174" font-size="11.5" fill="#e08a1e" text-anchor="middle">O(n)</text>
<text x="607" y="174" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="767" y="174" font-size="11.5" fill="#1f2b38" text-anchor="middle">数据量大且分布均匀</text>
<rect x="20" y="188" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="208" font-size="11.5" fill="#1f2b38" text-anchor="middle">斐波那契查找</text>
<text x="237" y="208" font-size="11.5" fill="#1f2b38" text-anchor="middle">顺序存储且按关键字有序</text>
<text x="397" y="208" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(log n)</text>
<text x="505" y="208" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(log n)</text>
<text x="607" y="208" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(1)</text>
<text x="767" y="208" font-size="11.5" fill="#1f2b38" text-anchor="middle">只允许加减运算的场合</text>
<rect x="20" y="222" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="242" font-size="11.5" fill="#1f2b38" text-anchor="middle">分块查找</text>
<text x="237" y="242" font-size="11.5" fill="#1f2b38" text-anchor="middle">块间有序，索引表有序</text>
<text x="397" y="242" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(√n)</text>
<text x="505" y="242" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(√n)</text>
<text x="607" y="242" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(b + n/b)</text>
<text x="767" y="242" font-size="11.5" fill="#1f2b38" text-anchor="middle">分块存储、插入较频繁</text>
<rect x="20" y="256" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="276" font-size="11.5" fill="#1f2b38" text-anchor="middle">哈希查找</text>
<text x="237" y="276" font-size="11.5" fill="#1f2b38" text-anchor="middle">哈希函数均匀、冲突可处理</text>
<text x="397" y="276" font-size="11.5" fill="#2e9e5b" text-anchor="middle">O(1)</text>
<text x="505" y="276" font-size="11.5" fill="#e08a1e" text-anchor="middle">O(n)</text>
<text x="607" y="276" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="767" y="276" font-size="11.5" fill="#1f2b38" text-anchor="middle">等值查询、字典与缓存</text>
<rect x="20" y="290" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="310" font-size="11.5" fill="#1f2b38" text-anchor="middle">二叉排序树</text>
<text x="237" y="310" font-size="11.5" fill="#1f2b38" text-anchor="middle">无需平衡，形态取决于插入顺序</text>
<text x="397" y="310" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(log n)</text>
<text x="505" y="310" font-size="11.5" fill="#e08a1e" text-anchor="middle">O(n)（单支）</text>
<text x="607" y="310" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="767" y="310" font-size="11.5" fill="#1f2b38" text-anchor="middle">动态查找表、随机插入</text>
<rect x="20" y="324" width="860" height="30" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="344" font-size="11.5" fill="#1f2b38" text-anchor="middle">平衡二叉树</text>
<text x="237" y="344" font-size="11.5" fill="#1f2b38" text-anchor="middle">严格平衡，平衡因子绝对值 ≤ 1</text>
<text x="397" y="344" font-size="11.5" fill="#2e9e5b" text-anchor="middle">O(log n)</text>
<text x="505" y="344" font-size="11.5" fill="#2e9e5b" text-anchor="middle">O(log n)</text>
<text x="607" y="344" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="767" y="344" font-size="11.5" fill="#1f2b38" text-anchor="middle">查找远多于插入删除</text>
<rect x="20" y="358" width="860" height="30" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="75" y="378" font-size="11.5" fill="#1f2b38" text-anchor="middle">B 树 / B+ 树</text>
<text x="237" y="378" font-size="11.5" fill="#1f2b38" text-anchor="middle">多路平衡，结点大小适配磁盘页</text>
<text x="397" y="378" font-size="11.5" fill="#2e9e5b" text-anchor="middle">O(log n)</text>
<text x="505" y="378" font-size="11.5" fill="#2e9e5b" text-anchor="middle">O(log n)</text>
<text x="607" y="378" font-size="11.5" fill="#1f2b38" text-anchor="middle">O(n)</text>
<text x="767" y="378" font-size="11.5" fill="#1f2b38" text-anchor="middle">数据库与文件系统索引</text>
<text x="20" y="412" font-size="11" fill="#5b6b7c">n：元素个数　b：块（桶）的个数　哈希查找的 O(1) 是平均情况，冲突严重时最坏退化为 O(n)。</text>
<text x="20" y="432" font-size="11" fill="#5b6b7c">二叉排序树依次插入有序序列会退化成单支树（等价链表），因此工程上多用平衡树（AVL / 红黑树）或 B 树家族。</text>
</svg>
