<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>二分查找闭区间与半开区间两种边界写法的对比</title>
<rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="28" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">二分查找的两种区间写法（闭区间 / 半开区间）</text>
<rect x="20" y="48" width="420" height="200" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="36" y="74" font-size="13" font-weight="700" fill="#2f6fd0">① 闭区间 [left, right]</text>
<text x="36" y="96" font-size="11" fill="#5b6b7c">right 指向最后一个元素，终止条件用 ≤</text>
<text x="36" y="122" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">int left = 0, right = n - 1;</text>
<text x="36" y="141" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">while (left &lt;= right) {</text>
<text x="36" y="160" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">    int mid = left + (right - left) / 2;</text>
<text x="36" y="179" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">    if (a[mid] == target) return mid;</text>
<text x="36" y="198" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">    if (a[mid] &lt; target) left  = mid + 1;</text>
<text x="36" y="217" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">    else                 right = mid - 1;</text>
<text x="36" y="236" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">}  // 区间为空时 left &gt; right，返回 -1</text>
<rect x="460" y="48" width="420" height="200" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
<text x="476" y="74" font-size="13" font-weight="700" fill="#7a5bd0">② 半开区间 [left, right)</text>
<text x="476" y="96" font-size="11" fill="#5b6b7c">right 指向「最后一个元素的后面」，用 &lt;</text>
<text x="476" y="122" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">int left = 0, right = n;   // 右端不可达</text>
<text x="476" y="141" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">while (left &lt; right) {</text>
<text x="476" y="160" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">    int mid = left + (right - left) / 2;</text>
<text x="476" y="179" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">    if (a[mid] &lt; target) left  = mid + 1;</text>
<text x="476" y="198" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">    else                 right = mid;  // 不是 mid-1</text>
<text x="476" y="217" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">}   // left 是第一个 ≥ target 的位置</text>
<text x="476" y="236" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#1f2b38">return left &lt; n &amp;&amp; a[left] == target ? left : -1;</text>
<rect x="20" y="266" width="860" height="132" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="36" y="290" font-size="13" font-weight="700" fill="#e08a1e">三个必须记住的配套关系与陷阱</text>
<text x="36" y="314" font-size="11.5" fill="#1f2b38">① 循环条件与边界收缩必须配套：闭区间用 left &lt;= right 配 mid ± 1；半开区间用 left &lt; right 配 right = mid 与 left = mid + 1。</text>
<text x="36" y="338" font-size="11.5" fill="#1f2b38">② 死循环陷阱：半开区间里若写 left = mid，向下取整的 mid 可能永远等于 left，区间不再缩小，程序卡死；此时应取上中位数</text>
<text x="36" y="358" font-size="11.5" fill="#1f2b38">    mid = left + (right - left + 1) / 2，或者改用闭区间写法。</text>
<text x="36" y="382" font-size="11.5" fill="#1f2b38">③ 溢出陷阱：mid = (left + right) / 2 在 left、right 很大时会整数溢出，建议写 left + (right - left) / 2 或 (left + right) &gt;&gt;&gt; 1。</text>
</svg>
