<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>分层职责：异常向上转换，日志只落一次</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">分层职责：异常向上转换，日志只落一次</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#5b6b7c">异常沿调用链向上转换，每层只做自己该做的事，不在多层重复打印</text>

  <rect x="30" y="80" width="180" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">DAO 层</text>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">转 DAOException 抛出</text>
  <text x="120" y="156" text-anchor="middle" font-size="11" fill="#5b6b7c">不打印日志</text>

  <line x1="214" y1="132" x2="246" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="250" y="80" width="180" height="104" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="340" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Service 层</text>
  <text x="340" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">捕获并记录出错日志</text>
  <text x="340" y="156" text-anchor="middle" font-size="11" fill="#5b6b7c">尽量带上参数</text>

  <line x1="434" y1="132" x2="466" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="80" width="180" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="560" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Web 层</text>
  <text x="560" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">不继续向上抛异常</text>
  <text x="560" y="156" text-anchor="middle" font-size="11" fill="#5b6b7c">转友好错误页与提示</text>

  <line x1="654" y1="132" x2="686" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="690" y="80" width="180" height="104" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="780" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">开放接口层</text>
  <text x="780" y="134" text-anchor="middle" font-size="11" fill="#5b6b7c">转错误码与错误信息</text>
  <text x="780" y="156" text-anchor="middle" font-size="11" fill="#5b6b7c">返回给调用方</text>

  <rect x="30" y="212" width="840" height="168" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="52" y="242" font-size="13" font-weight="700" fill="#1f2b38">异常与日志的四条底线</text>
  <text x="52" y="272" font-size="12" fill="#5b6b7c"><tspan font-weight="700" fill="#1f2b38">不吞异常</tspan>：catch 后至少记日志或转业务异常，并保留原始 cause</text>
  <text x="52" y="300" font-size="12" fill="#5b6b7c"><tspan font-weight="700" fill="#1f2b38">小范围捕获</tspan>：只包住 IO、网络、数据库等非稳定代码，不要大段 try-catch</text>
  <text x="52" y="328" font-size="12" fill="#5b6b7c"><tspan font-weight="700" fill="#1f2b38">不做流程控制</tspan>：异常构造要填充堆栈信息，当 if-else 用既慢又难读</text>
  <text x="52" y="356" font-size="12" fill="#5b6b7c"><tspan font-weight="700" fill="#1f2b38">资源必须释放</tspan>：优先 try-with-resources；finally 里不要 return，会吞掉异常</text>
</svg>
