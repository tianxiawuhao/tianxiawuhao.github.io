<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
<marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6b7c"/></marker>
<marker id="abr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e9e5b"/></marker>
<marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e08a1e"/></marker>
</defs>
<g font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">FutureTask 状态流转与 get() 行为</text>
<rect x="60" y="110" width="190" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="155" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">未启动</text>
<text x="155" y="164" text-anchor="middle" font-size="11.5" fill="#5b6b7c">new FutureTask(...)</text>
<line x1="252" y1="145" x2="306" y2="145" stroke="#5b6b7c" stroke-width="2" marker-end="url(#ag)"/>
<rect x="310" y="110" width="190" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="405" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">运行中</text>
<text x="405" y="164" text-anchor="middle" font-size="11.5" fill="#5b6b7c">call() 正在执行</text>
<line x1="502" y1="130" x2="596" y2="95" stroke="#2e9e5b" stroke-width="2" marker-end="url(#abr)"/>
<line x1="502" y1="162" x2="596" y2="215" stroke="#e08a1e" stroke-width="2" marker-end="url(#ao)"/>
<rect x="600" y="60" width="250" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="725" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2e9e5b">正常结束</text>
<text x="725" y="114" text-anchor="middle" font-size="11.5" fill="#1f2b38">get() 立即返回结果</text>
<rect x="600" y="190" width="250" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="725" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e08a1e">异常结束</text>
<text x="725" y="244" text-anchor="middle" font-size="11.5" fill="#1f2b38">get() 抛 ExecutionException</text>
<rect x="60" y="290" width="380" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="80" y="316" font-size="13" font-weight="700" fill="#2f6fd0">get() 的两种行为</text>
<text x="80" y="342" font-size="12" fill="#1f2b38">运算还没结束 → 阻塞等待</text>
<text x="80" y="364" font-size="12" fill="#1f2b38">运算已经结束 → 立即返回结果</text>
<text x="80" y="384" font-size="11.5" fill="#5b6b7c">带超时的重载：get(timeout, unit)</text>
<rect x="460" y="290" width="380" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="480" y="316" font-size="13" font-weight="700" fill="#e08a1e">cancel() 取消任务</text>
<text x="480" y="342" font-size="12" fill="#1f2b38">未启动的任务不会再执行</text>
<text x="480" y="364" font-size="12" fill="#1f2b38">运行中的任务置中断标志，由任务自行响应</text>
<text x="480" y="384" font-size="11.5" fill="#5b6b7c">取消后 get() 抛 CancellationException</text>
</g>
</svg>
