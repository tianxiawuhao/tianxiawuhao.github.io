<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>HotSpot 中对象的创建流程</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">HotSpot 中对象的创建流程（一条 new 指令的六个步骤）</text>

  <rect x="60" y="55" width="560" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="75" font-size="13" font-weight="700" fill="#1f2b38">1. 类加载检查</text>
  <text x="80" y="93" font-size="11" fill="#5b6b7c">常量池中能否定位到该类的符号引用，且该类已被加载、解析、初始化</text>

  <line x1="340" y1="102" x2="340" y2="119" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="121" width="560" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="141" font-size="13" font-weight="700" fill="#1f2b38">2. 分配内存</text>
  <text x="80" y="159" font-size="11" fill="#5b6b7c">对象所需大小在类加载完成后已确定，从 Java 堆中划出一块内存</text>

  <line x1="340" y1="168" x2="340" y2="185" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="187" width="560" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="207" font-size="13" font-weight="700" fill="#1f2b38">3. 处理并发分配</text>
  <text x="80" y="225" font-size="11" fill="#5b6b7c">CAS 加失败重试保证指针更新原子性，或先在 TLAB 中分配</text>

  <line x1="340" y1="234" x2="340" y2="251" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="253" width="560" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="273" font-size="13" font-weight="700" fill="#1f2b38">4. 内存空间初始化零值</text>
  <text x="80" y="291" font-size="11" fill="#5b6b7c">保证实例字段不显式赋值也能直接使用，取到各自类型的零值</text>

  <line x1="340" y1="300" x2="340" y2="317" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="319" width="560" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="80" y="339" font-size="13" font-weight="700" fill="#1f2b38">5. 设置对象头</text>
  <text x="80" y="357" font-size="11" fill="#5b6b7c">写入类型指针，以及哈希码、GC 分代年龄、锁状态等 Mark Word 信息</text>

  <line x1="340" y1="366" x2="340" y2="383" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="385" width="560" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="80" y="405" font-size="13" font-weight="700" fill="#1f2b38">6. 执行 init 方法</text>
  <text x="80" y="423" font-size="11" fill="#5b6b7c">成员变量赋值、普通语句块、构造函数依次执行，对象才真正可用</text>

  <rect x="640" y="121" width="232" height="112" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="756" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">第 2 步怎么分配</text>
  <text x="660" y="172" font-size="11" fill="#1f2b38">堆规整：指针碰撞</text>
  <text x="660" y="196" font-size="11" fill="#1f2b38">堆交错：空闲列表</text>
  <text x="660" y="220" font-size="11" fill="#5b6b7c">由 GC 算法决定堆是否规整</text>
</svg>
