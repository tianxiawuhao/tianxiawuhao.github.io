<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>Gradle 构建生命周期与任务图</title>
<rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Gradle 构建生命周期与任务图（./gradlew build）</text>

<rect x="30" y="60" width="260" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="160" y="86" font-size="14" font-weight="600" fill="#2f6fd0" text-anchor="middle">① 初始化 Initialization</text>
<text x="160" y="110" font-size="11.5" fill="#1f2b38" text-anchor="middle">解析 settings.gradle(.kts)</text>
<text x="160" y="130" font-size="11.5" fill="#1f2b38" text-anchor="middle">决定参与构建的 Project</text>
<text x="160" y="150" font-size="11.5" fill="#5b6b7c" text-anchor="middle">生成 Project 树（多模块入口）</text>
<text x="160" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">只执行一次，与要跑的 task 无关</text>

<line x1="295" y1="120" x2="320" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="325" y="60" width="250" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="450" y="86" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">② 配置 Configuration</text>
<text x="450" y="110" font-size="11.5" fill="#1f2b38" text-anchor="middle">求值 build.gradle 的脚本体</text>
<text x="450" y="130" font-size="11.5" fill="#1f2b38" text-anchor="middle">创建 Task、连依赖、算输入输出</text>
<text x="450" y="150" font-size="11.5" fill="#5b6b7c" text-anchor="middle">只有被请求 task 所在子图会配置</text>
<text x="450" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">Configuration Cache 可跳过本阶段</text>

<line x1="580" y1="120" x2="605" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="610" y="60" width="260" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="740" y="86" font-size="14" font-weight="600" fill="#2e9e5b" text-anchor="middle">③ 执行 Execution</text>
<text x="740" y="110" font-size="11.5" fill="#1f2b38" text-anchor="middle">按依赖拓扑序执行 Task</text>
<text x="740" y="130" font-size="11.5" fill="#1f2b38" text-anchor="middle">输入未变则 UP-TO-DATE 跳过</text>
<text x="740" y="150" font-size="11.5" fill="#5b6b7c" text-anchor="middle">可并行（--parallel）、可缓存</text>
<text x="740" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">build cache 命中则 FROM-CACHE</text>

<text x="30" y="215" font-size="13" font-weight="600" fill="#1f2b38">build 任务依赖图（节选）</text>

<rect x="40" y="240" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="100" y="262" font-size="12.5" font-weight="600" fill="#1f2b38" text-anchor="middle">compileJava</text>
<text x="100" y="280" font-size="10.5" fill="#5b6b7c" text-anchor="middle">编译主源码</text>

<line x1="165" y1="266" x2="190" y2="266" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="195" y="240" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="255" y="262" font-size="12.5" font-weight="600" fill="#1f2b38" text-anchor="middle">classes</text>
<text x="255" y="280" font-size="10.5" fill="#5b6b7c" text-anchor="middle">主 class 产物</text>

<line x1="320" y1="266" x2="345" y2="266" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="350" y="240" width="120" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="410" y="262" font-size="12.5" font-weight="600" fill="#1f2b38" text-anchor="middle">jar</text>
<text x="410" y="280" font-size="10.5" fill="#5b6b7c" text-anchor="middle">打包</text>

<line x1="475" y1="266" x2="500" y2="266" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="505" y="240" width="120" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="565" y="262" font-size="12.5" font-weight="600" fill="#2f6fd0" text-anchor="middle">assemble</text>
<text x="565" y="280" font-size="10.5" fill="#5b6b7c" text-anchor="middle">产出所有制品</text>

<rect x="505" y="330" width="120" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="565" y="352" font-size="12.5" font-weight="600" fill="#2f6fd0" text-anchor="middle">check</text>
<text x="565" y="370" font-size="10.5" fill="#5b6b7c" text-anchor="middle">test + 静态检查</text>

<rect x="700" y="285" width="150" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.6"/>
<text x="775" y="307" font-size="13.5" font-weight="700" fill="#e08a1e" text-anchor="middle">build</text>
<text x="775" y="325" font-size="10.5" fill="#5b6b7c" text-anchor="middle">= assemble + check</text>

<line x1="630" y1="266" x2="695" y2="300" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="630" y1="356" x2="695" y2="322" stroke="#e08a1e" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="40" y="316" width="430" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
<text x="56" y="340" font-size="11.5" fill="#1f2b38">tasks.register("hello") { doLast { println("Hi") } } —— 惰性注册，配置阶段只建对象</text>
<text x="56" y="362" font-size="11.5" fill="#5b6b7c">dependsOn / mustRunAfter / finalizedBy 决定拓扑序；--dry-run 只打印要执行的任务</text>
</svg>
