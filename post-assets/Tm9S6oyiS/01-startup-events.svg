<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Boot 启动事件顺序与扩展点</title>
  <rect width="900" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Spring Boot 启动事件顺序与扩展点</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#5b6b7c">SpringApplication.run() 主流程，2.x 与 3.x 的顺序一致</text>

  <rect x="40" y="76" width="6" height="46" rx="3" fill="#2f6fd0"/>
  <rect x="40" y="76" width="560" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="62" y="96" font-size="13" font-weight="700" fill="#1f2b38">ApplicationStartingEvent</text>
  <text x="62" y="113" font-size="11.5" fill="#5b6b7c">run() 一开始就发布，此时 Environment 还没准备</text>
  <rect x="616" y="76" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="96" font-size="11.5" fill="#5b6b7c">监听器在构造阶段已加载</text>
  <text x="632" y="113" font-size="11.5" fill="#5b6b7c">（SpringApplication 构造器）</text>

  <line x1="320" y1="122" x2="320" y2="134" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="134" width="6" height="46" rx="3" fill="#2f6fd0"/>
  <rect x="40" y="134" width="560" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="62" y="154" font-size="13" font-weight="700" fill="#1f2b38">ApplicationEnvironmentPreparedEvent</text>
  <text x="62" y="171" font-size="11.5" fill="#5b6b7c">Environment 已创建，配置文件在这一步被加载</text>
  <rect x="616" y="134" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="154" font-size="11.5" fill="#5b6b7c">EnvironmentPostProcessor</text>
  <text x="632" y="171" font-size="11.5" fill="#5b6b7c">ConfigData / ConfigFile</text>

  <line x1="320" y1="180" x2="320" y2="192" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="192" width="6" height="46" rx="3" fill="#7a5bd0"/>
  <rect x="40" y="192" width="560" height="46" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="62" y="212" font-size="13" font-weight="700" fill="#1f2b38">ApplicationContextInitializedEvent</text>
  <text x="62" y="229" font-size="11.5" fill="#5b6b7c">ApplicationContext 已创建，Initializer 已执行</text>
  <rect x="616" y="192" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="212" font-size="11.5" fill="#5b6b7c">ApplicationContextInitializer</text>
  <text x="632" y="229" font-size="11.5" fill="#5b6b7c">（applyInitializers）</text>

  <line x1="320" y1="238" x2="320" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="250" width="6" height="46" rx="3" fill="#7a5bd0"/>
  <rect x="40" y="250" width="560" height="46" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="62" y="270" font-size="13" font-weight="700" fill="#1f2b38">ApplicationPreparedEvent</text>
  <text x="62" y="287" font-size="11.5" fill="#5b6b7c">BeanDefinition 已加载，refresh 之前</text>
  <rect x="616" y="250" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="270" font-size="11.5" fill="#5b6b7c">BeanFactoryPostProcessor</text>
  <text x="632" y="287" font-size="11.5" fill="#5b6b7c">在此阶段可介入</text>

  <line x1="320" y1="296" x2="320" y2="308" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="308" width="6" height="46" rx="3" fill="#7a5bd0"/>
  <rect x="40" y="308" width="560" height="46" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="62" y="328" font-size="13" font-weight="700" fill="#1f2b38">ContextRefreshedEvent</text>
  <text x="62" y="345" font-size="11.5" fill="#5b6b7c">容器 refresh 完成（Spring 框架事件）</text>
  <rect x="616" y="308" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="328" font-size="11.5" fill="#5b6b7c">单例 Bean 已实例化</text>
  <text x="632" y="345" font-size="11.5" fill="#5b6b7c">onRefresh 创建了 WebServer</text>

  <line x1="320" y1="354" x2="320" y2="366" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="366" width="6" height="46" rx="3" fill="#2e9e5b"/>
  <rect x="40" y="366" width="560" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="62" y="386" font-size="13" font-weight="700" fill="#1f2b38">ApplicationStartedEvent</text>
  <text x="62" y="403" font-size="11.5" fill="#5b6b7c">refresh 完成、内嵌 WebServer 已启动</text>
  <rect x="616" y="366" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="386" font-size="11.5" fill="#5b6b7c">端口已绑定，Runner 还没跑</text>
  <text x="632" y="403" font-size="11.5" fill="#5b6b7c">finishRefresh 之后发布</text>

  <line x1="320" y1="412" x2="320" y2="424" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="424" width="6" height="46" rx="3" fill="#e08a1e"/>
  <rect x="40" y="424" width="560" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="62" y="444" font-size="13" font-weight="700" fill="#1f2b38">ApplicationRunner / CommandLineRunner</text>
  <text x="62" y="461" font-size="11.5" fill="#5b6b7c">启动后回调，按 @Order / Ordered 排序混排</text>
  <rect x="616" y="424" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="444" font-size="11.5" fill="#5b6b7c">预热缓存、初始化数据</text>
  <text x="632" y="461" font-size="11.5" fill="#5b6b7c">callRunners 统一调用</text>

  <line x1="320" y1="470" x2="320" y2="482" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="482" width="6" height="46" rx="3" fill="#2e9e5b"/>
  <rect x="40" y="482" width="560" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="62" y="502" font-size="13" font-weight="700" fill="#1f2b38">ApplicationReadyEvent</text>
  <text x="62" y="519" font-size="11.5" fill="#5b6b7c">应用已经可以对外提供服务</text>
  <rect x="616" y="482" width="248" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="632" y="502" font-size="11.5" fill="#5b6b7c">注册中心、预热完成的信号</text>
  <text x="632" y="519" font-size="11.5" fill="#5b6b7c">listeners.running(context)</text>

  <rect x="40" y="552" width="6" height="46" rx="3" fill="#e08a1e"/>
  <rect x="40" y="552" width="824" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="62" y="572" font-size="13" font-weight="700" fill="#1f2b38">ApplicationFailedEvent</text>
  <text x="62" y="589" font-size="11.5" fill="#5b6b7c">任一阶段抛异常：handleRunFailure → SpringBootExceptionReporter 打印失败分析报告 → 发布失败事件并关闭上下文</text>
</svg>
