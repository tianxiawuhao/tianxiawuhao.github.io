<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>GitLab 502 常见原因与排查路径</title>
  <rect width="900" height="550" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">GitLab 502 常见原因与排查路径</text>

  <rect x="280" y="55" width="340" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="85" font-size="14" fill="#1f2b38" text-anchor="middle">访问 GitLab 页面返回 502</text>
  <line x1="450" y1="103" x2="450" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="80" y="135" width="330" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="245" y="160" font-size="13.5" font-weight="700" fill="#1f2b38" text-anchor="middle">原因一：组件还在启动中</text>
  <text x="245" y="181" font-size="11.5" fill="#5b6b7c" text-anchor="middle">首次 reconfigure 后需要等待数分钟</text>

  <rect x="490" y="135" width="330" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="655" y="160" font-size="13.5" font-weight="700" fill="#1f2b38" text-anchor="middle">原因二：端口被占用（最常见）</text>
  <text x="655" y="181" font-size="11.5" fill="#5b6b7c" text-anchor="middle">puma 默认需要 127.0.0.1:8080</text>

  <line x1="245" y1="195" x2="245" y2="223" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="655" y1="195" x2="655" y2="223" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="80" y="227" width="330" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="245" y="252" font-size="12.5" fill="#1f2b38" text-anchor="middle">等组件就绪后重新访问即可</text>
  <text x="245" y="271" font-size="11.5" fill="#5b6b7c" text-anchor="middle">gitlab-ctl status 看各组件是否 run</text>

  <rect x="490" y="227" width="330" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="655" y="252" font-size="12.5" fill="#1f2b38" text-anchor="middle">gitlab-ctl tail puma 看日志</text>
  <text x="655" y="271" font-size="11.5" fill="#5b6b7c" text-anchor="middle">定位具体报错与冲突端口</text>

  <line x1="655" y1="283" x2="655" y2="307" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="311" width="470" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="565" y="334" font-size="12.5" fill="#1f2b38" text-anchor="middle">日志出现 Errno::EADDRINUSE</text>
  <text x="565" y="352" font-size="11.5" fill="#5b6b7c" text-anchor="middle">Address already in use - bind(2) for "127.0.0.1" port 8080</text>

  <line x1="565" y1="363" x2="565" y2="381" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M245 381 H 655" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="245" y1="381" x2="245" y2="393" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="655" y1="381" x2="655" y2="393" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="80" y="397" width="330" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="245" y="422" font-size="12.5" fill="#1f2b38" text-anchor="middle">占用端口的进程可以停：先停掉它</text>
  <text x="245" y="441" font-size="11.5" fill="#5b6b7c" text-anchor="middle">ss -lntp | grep 8080 定位进程</text>

  <rect x="490" y="397" width="330" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="655" y="422" font-size="12.5" fill="#1f2b38" text-anchor="middle">不能停就换端口</text>
  <text x="655" y="441" font-size="11.5" fill="#5b6b7c" text-anchor="middle">puma['port'] = 8090</text>

  <line x1="245" y1="453" x2="245" y2="475" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="655" y1="453" x2="655" y2="475" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M245 475 H 655" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="450" y1="475" x2="450" y2="489" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="270" y="493" width="360" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="521" font-size="13" fill="#1f2b38" text-anchor="middle">gitlab-ctl reconfigure 后重新访问</text>
</svg>
