<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Git LFS 大文件的存储与拉取流程</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Git LFS 大文件的存储与拉取流程</text>

  <text x="40" y="60" font-size="13" font-weight="700" fill="#1f2b38">① 提交（push）</text>

  <rect x="40" y="72" width="210" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="96" font-size="13" fill="#1f2b38" text-anchor="middle">本地工作区</text>
  <text x="145" y="116" font-size="11.5" fill="#5b6b7c" text-anchor="middle">big-file.vep（大文件）</text>

  <line x1="250" y1="101" x2="286" y2="101" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="290" y="72" width="230" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="405" y="96" font-size="12.5" fill="#1f2b38" text-anchor="middle">git add / commit</text>
  <text x="405" y="116" font-size="12.5" fill="#1f2b38" text-anchor="middle">git push origin main</text>

  <line x1="520" y1="101" x2="556" y2="101" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="560" y="72" width="320" height="190" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="720" y="94" font-size="12.5" font-weight="700" fill="#5b6b7c" text-anchor="middle">GitLab 服务端</text>
  <rect x="580" y="106" width="280" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="139" font-size="12" fill="#1f2b38" text-anchor="middle">Git 仓库：只保存 LFS 指针</text>
  <rect x="580" y="176" width="280" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="199" font-size="12" fill="#1f2b38" text-anchor="middle">LFS 存储：保存大文件实体</text>
  <text x="720" y="218" font-size="11" fill="#5b6b7c" text-anchor="middle">/data/gitlab/lfs-objects/a9/d3/…</text>

  <text x="40" y="300" font-size="13" font-weight="700" fill="#1f2b38">② 拉取（clone）</text>

  <rect x="40" y="312" width="210" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="336" font-size="13" fill="#1f2b38" text-anchor="middle">git clone 项目</text>
  <text x="145" y="356" font-size="11.5" fill="#5b6b7c" text-anchor="middle">由 git-lfs 自动接管</text>

  <line x1="250" y1="341" x2="286" y2="341" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="290" y="312" width="230" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="405" y="336" font-size="12.5" fill="#1f2b38" text-anchor="middle">Git 仓库</text>
  <text x="405" y="356" font-size="11.5" fill="#5b6b7c" text-anchor="middle">返回 LFS 指针文件</text>

  <line x1="520" y1="341" x2="556" y2="341" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="560" y="312" width="320" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="720" y="336" font-size="12.5" fill="#1f2b38" text-anchor="middle">LFS 存储</text>
  <text x="720" y="356" font-size="11.5" fill="#5b6b7c" text-anchor="middle">下载大文件实体（1.3 GB）</text>

  <path d="M720 370 V 429 H 524" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="290" y="400" width="230" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="405" y="424" font-size="12.5" fill="#1f2b38" text-anchor="middle">本地工作区</text>
  <text x="405" y="444" font-size="11.5" fill="#5b6b7c" text-anchor="middle">大文件完整可用</text>
</svg>
