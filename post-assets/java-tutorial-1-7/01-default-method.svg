<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>接口默认方法冲突的判定顺序</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">默认方法冲突：三级判定顺序</text>

  <rect x="40" y="60" width="470" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="62" y="90" font-size="14" font-weight="700" fill="#1f2b38">① 本类重写最优先</text>
  <text x="62" y="116" font-size="12" fill="#5b6b7c">类自己写了同名方法，接口默认版本全部被覆盖</text>

  <rect x="40" y="164" width="470" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="62" y="194" font-size="14" font-weight="700" fill="#1f2b38">② 更具体的子接口优先</text>
  <text x="62" y="220" font-size="12" fill="#5b6b7c">B 继承 A 且 B 重写了默认方法，取 B 的版本</text>

  <rect x="40" y="268" width="470" height="72" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="62" y="296" font-size="14" font-weight="700" fill="#1f2b38">③ 互不相干则编译报错</text>
  <text x="62" y="322" font-size="12" fill="#5b6b7c">实现类必须重写，用 接口名.super.方法名() 指定</text>

  <line x1="275" y1="136" x2="275" y2="160" stroke="#c8d3e0" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="275" y1="240" x2="275" y2="264" stroke="#c8d3e0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="546" y="60" width="314" height="280" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="566" y="88" font-size="13" font-weight="700" fill="#1f2b38">典型场景：两条支路互不相干</text>

  <rect x="586" y="106" width="76" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="624" y="128" font-size="13" fill="#1f2b38" text-anchor="middle">A</text>
  <rect x="746" y="106" width="76" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="784" y="128" font-size="13" fill="#1f2b38" text-anchor="middle">B</text>
  <rect x="666" y="196" width="76" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="704" y="218" font-size="13" fill="#1f2b38" text-anchor="middle">C</text>

  <line x1="624" y1="140" x2="690" y2="192" stroke="#c8d3e0" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="784" y1="140" x2="718" y2="192" stroke="#c8d3e0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="704" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">implements A, B</text>

  <text x="566" y="262" font-size="12" fill="#5b6b7c">A 与 B 都定义了 hello() 的默认实现，</text>
  <text x="566" y="284" font-size="12" fill="#5b6b7c">两者没有继承关系：C 不重写就编译失败</text>
  <text x="566" y="306" font-size="12" fill="#5b6b7c">重写后可写 A.super.hello() 调用指定版本</text>
</svg>
