<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>枚举的类型结构</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">枚举：常量即实例，构造方法私有</text>

  <rect x="40" y="60" width="820" height="180" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="88" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">enum OrderStatus { CREATED, PAID, SHIPPED }</text>
  <line x1="70" y1="102" x2="830" y2="102" stroke="#c8d3e0" stroke-width="1.2"/>

  <rect x="70" y="120" width="150" height="44" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="147" font-size="12" fill="#1f2b38" text-anchor="middle">CREATED</text>
  <rect x="240" y="120" width="150" height="44" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="315" y="147" font-size="12" fill="#1f2b38" text-anchor="middle">PAID</text>
  <rect x="410" y="120" width="150" height="44" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="485" y="147" font-size="12" fill="#1f2b38" text-anchor="middle">SHIPPED</text>
  <text x="600" y="147" font-size="12" fill="#5b6b7c">每个常量 = 一个</text>
  <text x="600" y="166" font-size="12" fill="#5b6b7c">public static final 实例</text>

  <text x="70" y="196" font-size="12" fill="#1f2b38">编译后：public final class OrderStatus extends Enum&lt;OrderStatus&gt;，不可被继承</text>
  <text x="70" y="220" font-size="12" fill="#5b6b7c">可带字段（如 code、label）、普通方法、抽象方法与常量级方法体；构造方法只能私有</text>

  <line x1="450" y1="244" x2="450" y2="268" stroke="#c8d3e0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="468" y="262" font-size="11" fill="#5b6b7c">自带 API 与用法</text>

  <rect x="40" y="272" width="260" height="104" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="62" y="298" font-size="13" font-weight="700" fill="#1f2b38">查询</text>
  <text x="62" y="322" font-size="12" fill="#5b6b7c">values() 遍历</text>
  <text x="62" y="344" font-size="12" fill="#5b6b7c">valueOf("PAID") 按名取</text>
  <text x="62" y="366" font-size="12" fill="#5b6b7c">name() / ordinal() 慎用</text>

  <rect x="320" y="272" width="260" height="104" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="342" y="298" font-size="13" font-weight="700" fill="#1f2b38">比较与判等</text>
  <text x="342" y="322" font-size="12" fill="#5b6b7c">用 == 而非 equals</text>
  <text x="342" y="344" font-size="12" fill="#5b6b7c">实现 Comparable</text>
  <text x="342" y="366" font-size="12" fill="#5b6b7c">switch case 直接写常量名</text>

  <rect x="600" y="272" width="260" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="622" y="298" font-size="13" font-weight="700" fill="#1f2b38">类型安全收益</text>
  <text x="622" y="322" font-size="12" fill="#5b6b7c">取值收敛，编译期校验</text>
  <text x="622" y="344" font-size="12" fill="#5b6b7c">可携带字段与行为</text>
  <text x="622" y="366" font-size="12" fill="#5b6b7c">天然单例，防反射破坏</text>
</svg>
