<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>成员内部类的两种形态对比</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">成员内部类的两种形态</text>

  <rect x="40" y="60" width="390" height="240" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="90" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">静态嵌套类 static class Nested</text>
  <line x1="70" y1="104" x2="400" y2="104" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="70" y="132" font-size="12" fill="#5b6b7c">不持有外部类实例引用</text>
  <text x="70" y="158" font-size="12" fill="#5b6b7c">只能访问外部类的静态成员</text>
  <text x="70" y="184" font-size="12" fill="#5b6b7c">创建只需外部类名：Outer.Nested</text>
  <text x="70" y="210" font-size="12" fill="#5b6b7c">定义与使用与普通类基本一致</text>
  <text x="70" y="236" font-size="12" fill="#2e9e5b">适合：与外部实例无关的工具型嵌套</text>
  <text x="70" y="262" font-size="12" fill="#5b6b7c">生命周期不绑定任何外部对象</text>
  <text x="70" y="286" font-size="11" fill="#5b6b7c">本质上只是一个挂在命名空间里的类</text>

  <rect x="470" y="60" width="390" height="240" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="665" y="90" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">非静态内部类 class Inner</text>
  <line x1="500" y1="104" x2="830" y2="104" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="500" y="132" font-size="12" fill="#5b6b7c">隐含持有外部类对象引用（Outer.this）</text>
  <text x="500" y="158" font-size="12" fill="#5b6b7c">可直接访问外部类的私有实例成员</text>
  <text x="500" y="184" font-size="12" fill="#5b6b7c">创建需先有对象：outer.new Inner()</text>
  <text x="500" y="210" font-size="12" fill="#5b6b7c">不能脱离外部实例单独存在</text>
  <text x="500" y="236" font-size="12" fill="#e08a1e">适合：与外部实例强耦合的从属结构</text>
  <text x="500" y="262" font-size="12" fill="#5b6b7c">生命周期跟随外部对象，易造成内存滞留</text>
  <text x="500" y="286" font-size="11" fill="#5b6b7c">JDK 16 起才允许声明静态成员</text>

  <line x1="434" y1="180" x2="466" y2="180" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="450" y="168" font-size="11" fill="#5b6b7c" text-anchor="middle">依赖</text>

  <rect x="40" y="332" width="820" height="58" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="64" y="356" font-size="12" fill="#1f2b38">共同点：都能访问外部类的私有成员，都编译为独立的 .class 文件（Outer$Inner.class）。</text>
  <text x="64" y="378" font-size="12" fill="#5b6b7c">区别只在一点：这个内部类要不要绑定一个外部类对象。</text>
</svg>
