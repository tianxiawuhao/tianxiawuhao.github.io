<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JWT 的三段结构与服务端校验方式</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">JWT 的三段结构与校验方式</text>
  <g font-size="11.5" fill="#5b6b7c" text-anchor="middle">
    <text x="174" y="58">① Header（算法与类型）</text>
    <text x="450" y="58">② Payload（声明与自定义字段）</text>
    <text x="726" y="58">③ Signature（签名）</text>
  </g>
  <g stroke-width="1.4">
    <rect x="48" y="68" width="252" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
    <rect x="324" y="68" width="252" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
    <rect x="600" y="68" width="252" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  </g>
  <g font-size="12" fill="#1f2b38" text-anchor="middle">
    <text x="174" y="97">eyJhbGciOiJIUzI1NiJ9</text>
    <text x="450" y="97">eyJzdWIiOiIxMjM0NTY3ODkwIn0</text>
    <text x="726" y="97">dBjftJeZ4CVP-mB92K27uhbUJU1p</text>
  </g>
  <g font-size="18" font-weight="700" fill="#5b6b7c" text-anchor="middle">
    <text x="312" y="99">.</text><text x="588" y="99">.</text>
  </g>
  <g stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="174" y1="116" x2="174" y2="130"/>
    <line x1="450" y1="116" x2="450" y2="130"/>
    <line x1="726" y1="116" x2="726" y2="130"/>
  </g>
  <g stroke-width="1.4">
    <rect x="48" y="134" width="252" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
    <rect x="324" y="134" width="252" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
    <rect x="600" y="134" width="252" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  </g>
  <g font-size="12" fill="#1f2b38" text-anchor="middle">
    <text x="174" y="166">alg = HS256</text><text x="174" y="192">typ = JWT</text>
    <text x="450" y="166">sub / name / roles</text><text x="450" y="192">exp / iat / iss</text>
    <text x="726" y="166">对前两段串做签名</text><text x="726" y="192">只防篡改，不负责保密</text>
  </g>
  <rect x="48" y="238" width="804" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="266" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">服务端：固定期望算法（拒绝 alg=none）→ 用密钥或公钥验签 → 校验 exp</text>
  <text x="450" y="290" font-size="12" fill="#5b6b7c" text-anchor="middle">HS256 同一密钥签名与验签；RS256 认证服务私钥签发、资源服务公钥验签</text>
  <rect x="48" y="316" width="804" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="342" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">注意：Header 与 Payload 只做 Base64Url 编码，任何人都能还原</text>
  <text x="450" y="364" font-size="12" fill="#5b6b7c" text-anchor="middle">绝不放入密码、手机号、身份证号；过期时间要短，并保留吊销手段</text>
</svg>
