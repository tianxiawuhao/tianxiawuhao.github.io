<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三类安全需求与各自对应的密码学手段</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">三类安全需求与对应的技术手段</text>
  <rect x="50" y="70" width="240" height="190" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="102" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">保密性：别人看不懂</text>
  <line x1="66" y1="118" x2="274" y2="118" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="170" y="152" font-size="11.5" fill="#1f2b38" text-anchor="middle">对称：AES-256 + GCM</text>
  <text x="170" y="186" font-size="11.5" fill="#1f2b38" text-anchor="middle">非对称：RSA-2048 + OAEP</text>
  <text x="170" y="220" font-size="11.5" fill="#1f2b38" text-anchor="middle">组合：RSA 传密钥、AES 传数据</text>
  <rect x="330" y="70" width="240" height="190" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="102" font-size="14" font-weight="700" fill="#2e9e5b" text-anchor="middle">完整性：别人改不了</text>
  <line x1="346" y1="118" x2="554" y2="118" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="450" y="152" font-size="11.5" fill="#1f2b38" text-anchor="middle">摘要：SHA-256（勿用 MD5）</text>
  <text x="450" y="186" font-size="11.5" fill="#1f2b38" text-anchor="middle">签名：SHA256withRSA</text>
  <text x="450" y="220" font-size="11.5" fill="#1f2b38" text-anchor="middle">私钥签名、公钥验签</text>
  <rect x="610" y="70" width="240" height="190" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="730" y="102" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="middle">身份认证：你是谁</text>
  <line x1="626" y1="118" x2="834" y2="118" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="730" y="152" font-size="11.5" fill="#1f2b38" text-anchor="middle">JWT：自包含、资源服务自验</text>
  <text x="730" y="186" font-size="11.5" fill="#1f2b38" text-anchor="middle">签名 + 证书 + 令牌组合</text>
  <text x="730" y="220" font-size="11.5" fill="#1f2b38" text-anchor="middle">短过期 + 黑名单可撤销</text>
  <rect x="50" y="290" width="800" height="72" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="320" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">三者互不替代：加密后的报文仍可能被整段替换，摘要也隐藏不了原文</text>
  <text x="450" y="348" font-size="12" fill="#5b6b7c" text-anchor="middle">共同底线：密钥不进代码库（环境变量 / 配置中心 / KMS），并且必须可轮换</text>
</svg>
