<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>K8s 存储分层：Pod、PVC、StorageClass 与 PV 的关系</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">K8s 存储分层：Pod、PVC、StorageClass 与 PV 的关系</text>

  <rect x="40" y="70" width="170" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="95" text-anchor="middle" font-size="14" fill="#1f2b38">Pod</text>
  <text x="125" y="114" text-anchor="middle" font-size="11" fill="#5b6b7c">开发者编写</text>

  <line x1="210" y1="98" x2="258" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="234" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">引用</text>

  <rect x="260" y="70" width="170" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="345" y="95" text-anchor="middle" font-size="14" fill="#1f2b38">PVC</text>
  <text x="345" y="114" text-anchor="middle" font-size="11" fill="#5b6b7c">声明容量与访问模式</text>

  <line x1="430" y1="98" x2="478" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="454" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">绑定</text>

  <rect x="480" y="70" width="180" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="570" y="95" text-anchor="middle" font-size="14" fill="#1f2b38">PV（持久卷）</text>
  <text x="570" y="114" text-anchor="middle" font-size="11" fill="#5b6b7c">集群级资源，真正存储</text>

  <line x1="660" y1="98" x2="708" y2="98" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="684" y="88" text-anchor="middle" font-size="11" fill="#5b6b7c">落地</text>

  <rect x="710" y="70" width="150" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="785" y="95" text-anchor="middle" font-size="14" fill="#1f2b38">NFS / 云盘</text>
  <text x="785" y="114" text-anchor="middle" font-size="11" fill="#5b6b7c">真实后端存储</text>

  <line x1="440" y1="205" x2="340" y2="129" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="215" font-size="11" fill="#5b6b7c">无合适 PV 时</text>

  <rect x="340" y="180" width="220" height="56" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="205" text-anchor="middle" font-size="14" fill="#1f2b38">StorageClass</text>
  <text x="450" y="224" text-anchor="middle" font-size="11" fill="#5b6b7c">provisioner + parameters</text>

  <line x1="560" y1="208" x2="610" y2="208" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="585" y="198" text-anchor="middle" font-size="11" fill="#5b6b7c">动态创建</text>

  <rect x="612" y="180" width="248" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="736" y="205" text-anchor="middle" font-size="13" fill="#1f2b38">由 StorageClass 自动创建 PV</text>
  <text x="736" y="224" text-anchor="middle" font-size="11" fill="#5b6b7c">无需管理员手工准备</text>

  <path d="M 780 129 L 780 240 L 620 240 L 340 240 L 340 207" fill="none" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>

  <text x="40" y="285" font-size="12" fill="#1f2b38">静态供应：管理员先创建 PV，PVC 在有合适 PV 时绑定成功，否则一直 Pending。</text>
  <text x="40" y="308" font-size="12" fill="#1f2b38">动态供应：没有合适 PV 时，K8s 依据 PVC 指定的 storageClassName 调用对应 provisioner 自动创建 PV。</text>
  <text x="40" y="330" font-size="11" fill="#5b6b7c">PVC 与 PV 的匹配条件：storageClassName 相同、容量不小于 requests.storage、访问模式兼容。</text>
</svg>
