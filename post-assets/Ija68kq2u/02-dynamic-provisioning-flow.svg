<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>NFS 动态供应流程：从 PVC 到自动创建 PV</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">NFS 动态供应流程：从 PVC 到自动创建 PV</text>

  <rect x="40" y="70" width="150" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="92" text-anchor="middle" font-size="13" fill="#1f2b38">创建 PVC</text>
  <text x="115" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">30m / RWO</text>

  <line x1="190" y1="96" x2="244" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="217" y="86" text-anchor="middle" font-size="11" fill="#5b6b7c">1</text>

  <rect x="246" y="70" width="180" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="336" y="92" text-anchor="middle" font-size="13" fill="#1f2b38">PVC Pending</text>
  <text x="336" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">没有可匹配的 PV</text>

  <line x1="426" y1="96" x2="480" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="453" y="86" text-anchor="middle" font-size="11" fill="#5b6b7c">2</text>

  <rect x="482" y="70" width="180" height="52" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="572" y="92" text-anchor="middle" font-size="13" fill="#1f2b38">StorageClass</text>
  <text x="572" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">nfs-subdir-external-provisioner</text>

  <line x1="662" y1="96" x2="716" y2="96" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="689" y="86" text-anchor="middle" font-size="11" fill="#5b6b7c">3</text>

  <rect x="718" y="70" width="142" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="789" y="92" text-anchor="middle" font-size="13" fill="#1f2b38">NFS 共享目录</text>
  <text x="789" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">自动建子目录</text>

  <path d="M 789 122 L 789 170 L 660 170" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="800" y="150" font-size="11" fill="#2e9e5b">4</text>

  <rect x="466" y="144" width="190" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="561" y="166" text-anchor="middle" font-size="13" fill="#1f2b38">自动创建 PV</text>
  <text x="561" y="184" text-anchor="middle" font-size="11" fill="#5b6b7c">容量 30m，回收策略 Delete</text>

  <line x1="466" y1="170" x2="420" y2="170" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="443" y="160" text-anchor="middle" font-size="11" fill="#2e9e5b">5</text>

  <rect x="230" y="144" width="188" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="324" y="166" text-anchor="middle" font-size="13" fill="#1f2b38">PV 与 PVC 绑定</text>
  <text x="324" y="184" text-anchor="middle" font-size="11" fill="#5b6b7c">PVC 变为 Bound，Pod 可挂载</text>

  <line x1="230" y1="170" x2="170" y2="170" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="200" y="160" text-anchor="middle" font-size="11" fill="#2e9e5b">6</text>

  <rect x="40" y="144" width="128" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="104" y="166" text-anchor="middle" font-size="13" fill="#1f2b38">Pod 挂载</text>
  <text x="104" y="184" text-anchor="middle" font-size="11" fill="#5b6b7c">使用 NFS 目录</text>

  <text x="40" y="240" font-size="12" fill="#1f2b38">步骤说明：1 开发者提交 PVC；2 PVC 无可用 PV，保持 Pending；3 K8s 找到 PVC 指定的 StorageClass；</text>
  <text x="40" y="263" font-size="12" fill="#1f2b38">4 provisioner 在 NFS 共享目录下创建子目录；5 provisioner 创建对应 PV 并完成绑定；6 Pod 通过 PVC 挂载使用。</text>
  <text x="40" y="292" font-size="11" fill="#5b6b7c">删除 PVC 时：reclaimPolicy=Delete 会删除 PV；archiveOnDelete: "true" 会把 NFS 目录重命名为 archived- 前缀保留数据。</text>
  <text x="40" y="315" font-size="11" fill="#5b6b7c">PVC 未写 storageClassName 时，才会使用带 is-default-class 注解的默认 StorageClass。</text>
</svg>
