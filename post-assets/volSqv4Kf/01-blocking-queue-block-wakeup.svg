<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>阻塞队列的阻塞与唤醒流程</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">阻塞队列的阻塞与唤醒流程</text>

  <rect x="60" y="75" width="180" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="108" font-size="14" text-anchor="middle" fill="#1f2b38">生产者线程</text>
  <text x="150" y="132" font-size="12" text-anchor="middle" fill="#5b6b7c">put(e) / offer(e)</text>

  <rect x="360" y="62" width="180" height="106" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2b38">阻塞队列</text>
  <text x="450" y="116" font-size="12" text-anchor="middle" fill="#5b6b7c">数组 / 链表 / 堆</text>
  <text x="450" y="140" font-size="12" text-anchor="middle" fill="#5b6b7c">满、空、未满未空</text>

  <rect x="660" y="75" width="180" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="108" font-size="14" text-anchor="middle" fill="#1f2b38">消费者线程</text>
  <text x="750" y="132" font-size="12" text-anchor="middle" fill="#5b6b7c">take() / poll()</text>

  <line x1="242" y1="112" x2="354" y2="112" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="298" y="103" font-size="12" text-anchor="middle" fill="#2f6fd0">入队</text>
  <line x1="546" y1="112" x2="656" y2="112" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="601" y="103" font-size="12" text-anchor="middle" fill="#2e9e5b">出队</text>

  <rect x="60" y="200" width="370" height="168" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="80" y="230" font-size="14" font-weight="700" fill="#e08a1e">队列已满：put 被阻塞</text>
  <text x="80" y="262" font-size="12" fill="#1f2b38">生产者线程被挂起，等待空位出现</text>
  <text x="80" y="292" font-size="12" fill="#1f2b38">消费者 take() 取走一个元素</text>
  <text x="80" y="322" font-size="12" fill="#2e9e5b">队列有空位 → 自动唤醒生产者</text>
  <text x="80" y="348" font-size="11" fill="#5b6b7c">阻塞与唤醒都由队列完成，业务代码无需感知</text>

  <rect x="470" y="200" width="370" height="168" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="490" y="230" font-size="14" font-weight="700" fill="#e08a1e">队列已空：take 被阻塞</text>
  <text x="490" y="262" font-size="12" fill="#1f2b38">消费者线程被挂起，等待元素入队</text>
  <text x="490" y="292" font-size="12" fill="#1f2b38">生产者 put(e) 放入一个元素</text>
  <text x="490" y="322" font-size="12" fill="#2e9e5b">队列有数据 → 自动唤醒消费者</text>
  <text x="490" y="348" font-size="11" fill="#5b6b7c">唤醒后继续执行 take() 并返回元素</text>
</svg>
