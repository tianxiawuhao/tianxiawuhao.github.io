<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>五种常用阻塞队列对比</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">五种常用阻塞队列对比</text>

  <rect x="40" y="55" width="820" height="395" rx="8" fill="none" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="41" y="56" width="818" height="34" fill="#f7f9fc"/>
  <text x="120" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2b38">队列</text>
  <text x="265" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2b38">底层结构</text>
  <text x="420" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2b38">容量</text>
  <text x="620" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2b38">并发与锁</text>
  <text x="795" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2b38">典型场景</text>
  <line x1="40" y1="90" x2="860" y2="90" stroke="#c8d3e0" stroke-width="1.4"/>

  <text x="120" y="131" font-size="12" text-anchor="middle" fill="#1f2b38">ArrayBlockingQueue</text>
  <text x="265" y="131" font-size="12" text-anchor="middle" fill="#1f2b38">数组</text>
  <text x="420" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">有界</text>
  <text x="420" y="142" font-size="11" text-anchor="middle" fill="#5b6b7c">构造时必须指定容量</text>
  <text x="620" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">一把 ReentrantLock</text>
  <text x="620" y="142" font-size="11" text-anchor="middle" fill="#5b6b7c">读写共用同一把锁，可设公平</text>
  <text x="795" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">容量固定</text>
  <text x="795" y="142" font-size="11" text-anchor="middle" fill="#5b6b7c">生产消费速度均衡</text>
  <line x1="40" y1="162" x2="860" y2="162" stroke="#c8d3e0" stroke-width="1"/>

  <text x="120" y="203" font-size="12" text-anchor="middle" fill="#1f2b38">LinkedBlockingQueue</text>
  <text x="265" y="203" font-size="12" text-anchor="middle" fill="#1f2b38">单向链表</text>
  <text x="420" y="194" font-size="12" text-anchor="middle" fill="#1f2b38">可选，默认</text>
  <text x="420" y="214" font-size="11" text-anchor="middle" fill="#5b6b7c">Integer.MAX_VALUE</text>
  <text x="620" y="194" font-size="12" text-anchor="middle" fill="#1f2b38">两把锁：putLock / takeLock</text>
  <text x="620" y="214" font-size="11" text-anchor="middle" fill="#5b6b7c">读写分离，吞吐更高</text>
  <text x="795" y="194" font-size="12" text-anchor="middle" fill="#1f2b38">高并发</text>
  <text x="795" y="214" font-size="11" text-anchor="middle" fill="#5b6b7c">吞吐优先</text>
  <line x1="40" y1="234" x2="860" y2="234" stroke="#c8d3e0" stroke-width="1"/>

  <text x="120" y="275" font-size="12" text-anchor="middle" fill="#1f2b38">SynchronousQueue</text>
  <text x="265" y="275" font-size="12" text-anchor="middle" fill="#1f2b38">不存储元素</text>
  <text x="420" y="266" font-size="12" text-anchor="middle" fill="#1f2b38">无容量</text>
  <text x="420" y="286" font-size="11" text-anchor="middle" fill="#5b6b7c">size() 恒为 0</text>
  <text x="620" y="266" font-size="12" text-anchor="middle" fill="#1f2b38">公平 / 非公平匹配</text>
  <text x="620" y="286" font-size="11" text-anchor="middle" fill="#5b6b7c">CAS 实现，不依赖内部锁</text>
  <text x="795" y="266" font-size="12" text-anchor="middle" fill="#1f2b38">任务直接交接</text>
  <text x="795" y="286" font-size="11" text-anchor="middle" fill="#5b6b7c">newCachedThreadPool</text>
  <line x1="40" y1="306" x2="860" y2="306" stroke="#c8d3e0" stroke-width="1"/>

  <text x="120" y="347" font-size="12" text-anchor="middle" fill="#1f2b38">PriorityBlockingQueue</text>
  <text x="265" y="347" font-size="12" text-anchor="middle" fill="#1f2b38">二叉堆（数组）</text>
  <text x="420" y="338" font-size="12" text-anchor="middle" fill="#1f2b38">无界</text>
  <text x="420" y="358" font-size="11" text-anchor="middle" fill="#5b6b7c">初始容量默认 11</text>
  <text x="620" y="338" font-size="12" text-anchor="middle" fill="#1f2b38">一把 ReentrantLock</text>
  <text x="620" y="358" font-size="11" text-anchor="middle" fill="#5b6b7c">扩容时用 CAS 自旋</text>
  <text x="795" y="338" font-size="12" text-anchor="middle" fill="#1f2b38">按优先级出队</text>
  <text x="795" y="358" font-size="11" text-anchor="middle" fill="#5b6b7c">任务分级调度</text>
  <line x1="40" y1="378" x2="860" y2="378" stroke="#c8d3e0" stroke-width="1"/>

  <text x="120" y="419" font-size="12" text-anchor="middle" fill="#1f2b38">DelayQueue</text>
  <text x="265" y="419" font-size="12" text-anchor="middle" fill="#1f2b38">二叉堆 + 延迟</text>
  <text x="420" y="410" font-size="12" text-anchor="middle" fill="#1f2b38">无界</text>
  <text x="420" y="430" font-size="11" text-anchor="middle" fill="#5b6b7c">元素到期才能取出</text>
  <text x="620" y="410" font-size="12" text-anchor="middle" fill="#1f2b38">一把 ReentrantLock</text>
  <text x="620" y="430" font-size="11" text-anchor="middle" fill="#5b6b7c">leader 线程避免无效唤醒</text>
  <text x="795" y="410" font-size="12" text-anchor="middle" fill="#1f2b38">定时任务</text>
  <text x="795" y="430" font-size="11" text-anchor="middle" fill="#5b6b7c">过期数据清理</text>
  <line x1="40" y1="450" x2="860" y2="450" stroke="#c8d3e0" stroke-width="1.4"/>

  <text x="60" y="478" font-size="12" fill="#5b6b7c">共同点：都不允许插入 null；插入 / 取出失败时按「抛异常 / 特殊值 / 阻塞 / 超时」四种方式处理</text>
</svg>
