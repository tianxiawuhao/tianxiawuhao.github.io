<svg xmlns="http://www.w3.org/2000/svg" width="900" height="644" viewBox="0 0 900 644" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="644" fill="#ffffff"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">窗口的生命周期与迟到数据的三种处理</text>
  <text x="450" y="54" font-size="12" fill="#5b6b7c" text-anchor="middle">事件时间语义下：创建 → 收集聚合 → 触发计算 → 销毁，以及迟到数据的三重保障</text>

  <text x="30" y="84" font-size="13" font-weight="700" fill="#1f2b38">① 窗口生命周期时间轴（事件时间）</text>
  <rect x="110" y="96" width="360" height="28" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="290" y="115" font-size="12" fill="#1f2b38" text-anchor="middle">收集数据 + 增量聚合 / 全窗口缓存</text>
  <rect x="470" y="96" width="290" height="28" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="615" y="115" font-size="12" fill="#1f2b38" text-anchor="middle">允许延迟期（窗口不销毁）</text>
  <line x1="110" y1="90" x2="110" y2="162" stroke="#c8d3e0" stroke-dasharray="4 4"/>
  <line x1="470" y1="90" x2="470" y2="162" stroke="#c8d3e0" stroke-dasharray="4 4"/>
  <line x1="760" y1="90" x2="760" y2="162" stroke="#c8d3e0" stroke-dasharray="4 4"/>
  <line x1="60" y1="132" x2="860" y2="132" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="110" cy="132" r="4.5" fill="#2f6fd0"/>
  <circle cx="470" cy="132" r="4.5" fill="#2e9e5b"/>
  <circle cx="760" cy="132" r="4.5" fill="#e08a1e"/>
  <text x="70" y="182" font-size="11" fill="#5b6b7c">创建：第一条数据到达</text>
  <text x="300" y="182" font-size="11" fill="#5b6b7c">触发 FIRE：水位线到达窗口结束时间，输出近似结果</text>
  <text x="600" y="182" font-size="11" fill="#5b6b7c">销毁 PURGE：水位线 ≥ 结束 + 延迟，清空状态</text>

  <text x="30" y="246" font-size="13" font-weight="700" fill="#1f2b38">② 窗口的四个阶段</text>
  <rect x="40" y="258" width="190" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="52" y="281" font-size="12" font-weight="700" fill="#1f2b38">创建</text>
  <text x="52" y="299" font-size="11" fill="#5b6b7c">第一条属于该窗口的数据</text>
  <text x="52" y="315" font-size="11" fill="#5b6b7c">到达时由分配器创建</text>
  <rect x="250" y="258" width="190" height="64" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="262" y="281" font-size="12" font-weight="700" fill="#1f2b38">收集与聚合</text>
  <text x="262" y="299" font-size="11" fill="#5b6b7c">增量聚合：每条数据更新</text>
  <text x="262" y="315" font-size="11" fill="#5b6b7c">全窗口：缓存全部数据</text>
  <rect x="460" y="258" width="190" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="472" y="281" font-size="12" font-weight="700" fill="#1f2b38">触发（FIRE）</text>
  <text x="472" y="299" font-size="11" fill="#5b6b7c">水位线到达窗口结束时间</text>
  <text x="472" y="315" font-size="11" fill="#5b6b7c">或计数达到 size</text>
  <rect x="670" y="258" width="190" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="682" y="281" font-size="12" font-weight="700" fill="#1f2b38">销毁（PURGE）</text>
  <text x="682" y="299" font-size="11" fill="#5b6b7c">水位线 ≥ 结束 + 允许延迟</text>
  <text x="682" y="315" font-size="11" fill="#5b6b7c">计数窗口不会自动销毁</text>
  <line x1="230" y1="290" x2="246" y2="290" stroke="#5b6b7c" marker-end="url(#ah)"/>
  <line x1="440" y1="290" x2="456" y2="290" stroke="#5b6b7c" marker-end="url(#ah)"/>
  <line x1="650" y1="290" x2="666" y2="290" stroke="#5b6b7c" marker-end="url(#ah)"/>

  <text x="30" y="356" font-size="13" font-weight="700" fill="#1f2b38">③ 迟到数据的三重保障</text>
  <rect x="40" y="368" width="210" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="145" y="390" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">方式一：水位线延迟</text>
  <text x="145" y="409" font-size="11" fill="#5b6b7c" text-anchor="middle">forBoundedOutOfOrderness</text>
  <rect x="266" y="368" width="594" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="280" y="390" font-size="12" fill="#1f2b38">在乱序流上为水位线设置延迟，让事件时间时钟整体滞后，大多数乱序数据不再算作迟到。</text>
  <text x="280" y="410" font-size="12" fill="#5b6b7c">特点：全局生效、实现简单；但延迟越大，实时性越差。</text>
  <rect x="40" y="434" width="210" height="54" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="145" y="456" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">方式二：窗口允许延迟</text>
  <text x="145" y="475" font-size="11" fill="#5b6b7c" text-anchor="middle">allowedLateness</text>
  <rect x="266" y="434" width="594" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="280" y="456" font-size="12" fill="#1f2b38">窗口结束时间之后继续保留状态，在水位线达到“结束时间 + 允许延迟”之前，</text>
  <text x="280" y="476" font-size="12" fill="#5b6b7c">迟到的数据会重新触发计算，输出更新后的结果（可能重复输出）。</text>
  <rect x="40" y="500" width="210" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="145" y="522" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">方式三：侧输出流</text>
  <text x="145" y="541" font-size="11" fill="#5b6b7c" text-anchor="middle">sideOutputLateData</text>
  <rect x="266" y="500" width="594" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="280" y="522" font-size="12" fill="#1f2b38">用 .sideOutputLateData(OutputTag) 兜底收集关窗后的迟到数据，</text>
  <text x="280" y="542" font-size="12" fill="#5b6b7c">再用 .getSideOutput() 取出；保证数据不丢失，但需手动合并修正结果。</text>

  <rect x="30" y="572" width="840" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="46" y="596" font-size="12" fill="#1f2b38">只有事件时间语义才需要讨论迟到数据：处理时间窗口不存在迟到，计数窗口 / 全局窗口不会自动销毁。</text>
  <text x="46" y="618" font-size="12" fill="#1f2b38">三种方式可以叠加：水位线延迟（防患于未然）+ allowedLateness（快速修正）+ 侧输出流（兜底不丢）。</text>
</svg>
