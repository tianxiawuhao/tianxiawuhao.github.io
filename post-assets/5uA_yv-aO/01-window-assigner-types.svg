<svg xmlns="http://www.w3.org/2000/svg" width="900" height="712" viewBox="0 0 900 712" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/>
    </marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/>
    </marker>
  </defs>
  <rect width="900" height="712" fill="#ffffff"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Flink 窗口分配器：滚动 / 滑动 / 会话 / 全局</text>
  <text x="450" y="54" font-size="12" fill="#5b6b7c" text-anchor="middle">同一个 key 的数据被切分进有界窗口；窗口是否重叠、如何划分，由窗口分配器决定</text>

  <rect x="30" y="66" width="840" height="134" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="46" y="90" font-size="13" font-weight="700" fill="#1f2b38">① 滚动窗口（Tumbling，size = 5s）：首尾相接、互不重叠，每条数据只属于一个窗口</text>
  <rect x="70" y="100" width="250" height="30" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="195" y="120" font-size="12" fill="#1f2b38" text-anchor="middle">W1 [0, 5)</text>
  <rect x="320" y="100" width="250" height="30" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="445" y="120" font-size="12" fill="#1f2b38" text-anchor="middle">W2 [5, 10)</text>
  <rect x="570" y="100" width="250" height="30" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="695" y="120" font-size="12" fill="#1f2b38" text-anchor="middle">W3 [10, 15)</text>
  <line x1="60" y1="150" x2="860" y2="150" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="70" y1="146" x2="70" y2="154" stroke="#c8d3e0"/>
  <line x1="320" y1="146" x2="320" y2="154" stroke="#c8d3e0"/>
  <line x1="570" y1="146" x2="570" y2="154" stroke="#c8d3e0"/>
  <line x1="820" y1="146" x2="820" y2="154" stroke="#c8d3e0"/>
  <text x="70" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">0s</text>
  <text x="320" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">5s</text>
  <text x="570" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">10s</text>
  <text x="820" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">15s</text>
  <text x="120" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">1</text>
  <text x="170" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">2</text>
  <text x="245" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">3.5</text>
  <text x="370" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">6</text>
  <text x="445" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">7.5</text>
  <text x="620" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">11</text>
  <text x="720" y="143" font-size="11" fill="#5b6b7c" text-anchor="middle">13</text>
  <circle cx="120" cy="150" r="5" fill="#2f6fd0"/>
  <circle cx="170" cy="150" r="5" fill="#2f6fd0"/>
  <circle cx="245" cy="150" r="5" fill="#2f6fd0"/>
  <circle cx="370" cy="150" r="5" fill="#2f6fd0"/>
  <circle cx="445" cy="150" r="5" fill="#2f6fd0"/>
  <circle cx="620" cy="150" r="5" fill="#2f6fd0"/>
  <circle cx="720" cy="150" r="5" fill="#2f6fd0"/>

  <rect x="30" y="208" width="840" height="134" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="46" y="232" font-size="13" font-weight="700" fill="#1f2b38">② 滑动窗口（Sliding，size = 5s，slide = 2s）：窗口可以重叠，一条数据可能属于多个窗口</text>
  <rect x="70" y="242" width="250" height="24" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="78" y="258" font-size="11" fill="#1f2b38">W1 [0, 5)</text>
  <rect x="170" y="252" width="250" height="24" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="178" y="268" font-size="11" fill="#1f2b38">W2 [2, 7)</text>
  <rect x="270" y="262" width="250" height="24" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="278" y="278" font-size="11" fill="#1f2b38">W3 [4, 9)</text>
  <text x="540" y="248" font-size="12" fill="#5b6b7c">slide = 2s &lt; size = 5s</text>
  <text x="540" y="266" font-size="12" fill="#5b6b7c">→ 窗口相互重叠，一条数据</text>
  <text x="540" y="284" font-size="12" fill="#5b6b7c">可同时进入多个窗口</text>
  <line x1="60" y1="302" x2="860" y2="302" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="70" y1="298" x2="70" y2="306" stroke="#c8d3e0"/>
  <line x1="270" y1="298" x2="270" y2="306" stroke="#c8d3e0"/>
  <line x1="470" y1="298" x2="470" y2="306" stroke="#c8d3e0"/>
  <line x1="670" y1="298" x2="670" y2="306" stroke="#c8d3e0"/>
  <text x="70" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">0s</text>
  <text x="270" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">4s</text>
  <text x="470" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">8s</text>
  <text x="670" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">12s</text>
  <circle cx="120" cy="302" r="5" fill="#2f6fd0"/>
  <circle cx="220" cy="302" r="5" fill="#2f6fd0"/>
  <circle cx="270" cy="302" r="5" fill="#2f6fd0"/>
  <circle cx="370" cy="302" r="5" fill="#2f6fd0"/>
  <circle cx="470" cy="302" r="5" fill="#2f6fd0"/>
  <circle cx="520" cy="302" r="5" fill="#2f6fd0"/>
  <circle cx="670" cy="302" r="5" fill="#2f6fd0"/>
  <circle cx="770" cy="302" r="5" fill="#2f6fd0"/>

  <rect x="30" y="350" width="840" height="134" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="46" y="374" font-size="13" font-weight="700" fill="#1f2b38">③ 会话窗口（Session，gap = 3s）：按活跃间隔切分，间隔超过 gap 即分成不同会话</text>
  <rect x="70" y="384" width="210" height="30" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="175" y="404" font-size="12" fill="#1f2b38" text-anchor="middle">会话 1</text>
  <rect x="400" y="384" width="190" height="30" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="495" y="404" font-size="12" fill="#1f2b38" text-anchor="middle">会话 2</text>
  <rect x="700" y="384" width="140" height="30" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="770" y="404" font-size="12" fill="#1f2b38" text-anchor="middle">会话 3</text>
  <line x1="290" y1="399" x2="390" y2="399" stroke="#2e9e5b" stroke-width="1.5" marker-start="url(#ah3)" marker-end="url(#ah3)"/>
  <text x="340" y="392" font-size="11" fill="#5b6b7c" text-anchor="middle">gap 超时</text>
  <line x1="60" y1="444" x2="860" y2="444" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="70" y1="440" x2="70" y2="448" stroke="#c8d3e0"/>
  <line x1="280" y1="440" x2="280" y2="448" stroke="#c8d3e0"/>
  <line x1="400" y1="440" x2="400" y2="448" stroke="#c8d3e0"/>
  <line x1="590" y1="440" x2="590" y2="448" stroke="#c8d3e0"/>
  <line x1="700" y1="440" x2="700" y2="448" stroke="#c8d3e0"/>
  <line x1="840" y1="440" x2="840" y2="448" stroke="#c8d3e0"/>
  <circle cx="110" cy="444" r="5" fill="#2f6fd0"/>
  <circle cx="160" cy="444" r="5" fill="#2f6fd0"/>
  <circle cx="210" cy="444" r="5" fill="#2f6fd0"/>
  <circle cx="440" cy="444" r="5" fill="#2f6fd0"/>
  <circle cx="500" cy="444" r="5" fill="#2f6fd0"/>
  <circle cx="740" cy="444" r="5" fill="#2f6fd0"/>
  <circle cx="790" cy="444" r="5" fill="#2f6fd0"/>
  <text x="46" y="474" font-size="11" fill="#5b6b7c">相邻数据间隔 ≥ gap（3s）即切开；会话窗口会在运行时合并重叠窗口，因此聚合函数需要实现 merge()</text>

  <rect x="30" y="492" width="840" height="134" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="46" y="516" font-size="13" font-weight="700" fill="#1f2b38">④ 全局窗口（Global，GlobalWindows）：所有数据进同一个窗口，不自带触发与清理机制</text>
  <rect x="70" y="526" width="760" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="450" y="546" font-size="12" fill="#1f2b38" text-anchor="middle">GlobalWindow：永不自动触发、永不自动销毁</text>
  <line x1="60" y1="586" x2="860" y2="586" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="70" y1="582" x2="70" y2="590" stroke="#c8d3e0"/>
  <line x1="830" y1="582" x2="830" y2="590" stroke="#c8d3e0"/>
  <circle cx="110" cy="586" r="5" fill="#2f6fd0"/>
  <circle cx="260" cy="586" r="5" fill="#2f6fd0"/>
  <circle cx="410" cy="586" r="5" fill="#2f6fd0"/>
  <circle cx="560" cy="586" r="5" fill="#2f6fd0"/>
  <circle cx="710" cy="586" r="5" fill="#2f6fd0"/>
  <text x="46" y="616" font-size="11" fill="#5b6b7c">计数窗口 = GlobalWindow + CountTrigger，元素个数达标即触发（countWindow）</text>

  <rect x="30" y="636" width="840" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="46" y="662" font-size="12" fill="#1f2b38">时间窗口（Time Window）：以时间戳为边界，由水位线（事件时间）或系统时钟（处理时间）驱动触发；</text>
  <text x="46" y="686" font-size="12" fill="#1f2b38">计数窗口（Count Window）：以元素个数为边界，基于 GlobalWindow + CountTrigger 实现，数量达标即触发。</text>
</svg>
