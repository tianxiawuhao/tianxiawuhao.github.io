<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Kubernetes 高可用集群架构图</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Kubernetes 高可用集群架构</text>

  <rect x="350" y="52" width="200" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="75" text-anchor="middle" font-size="13" fill="#1f2b38">kubectl / 业务流量</text>

  <line x1="450" y1="88" x2="450" y2="128" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="295" y="130" width="310" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="156" text-anchor="middle" font-size="13" fill="#1f2b38">VIP 192.168.40.19:16443（keepalived 漂移）</text>

  <line x1="350" y1="172" x2="160" y2="203" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="172" x2="450" y2="203" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="550" y1="172" x2="740" y2="203" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="25" y="205" width="250" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="150" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">master1（192.168.40.20）</text>
  <text x="150" y="252" text-anchor="middle" font-size="12" fill="#1f2b38">keepalived + HAProxy</text>
  <text x="150" y="274" text-anchor="middle" font-size="12" fill="#1f2b38">kube-apiserver :6443</text>
  <text x="150" y="296" text-anchor="middle" font-size="12" fill="#1f2b38">etcd 成员</text>

  <rect x="325" y="205" width="250" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">master2（192.168.40.21）</text>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#1f2b38">keepalived（BACKUP）</text>
  <text x="450" y="274" text-anchor="middle" font-size="12" fill="#1f2b38">HAProxy → 三个 apiserver</text>
  <text x="450" y="296" text-anchor="middle" font-size="12" fill="#1f2b38">etcd 成员</text>

  <rect x="625" y="205" width="250" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">master3（192.168.40.22）</text>
  <text x="750" y="252" text-anchor="middle" font-size="12" fill="#1f2b38">keepalived（BACKUP）</text>
  <text x="750" y="274" text-anchor="middle" font-size="12" fill="#1f2b38">HAProxy → 三个 apiserver</text>
  <text x="750" y="296" text-anchor="middle" font-size="12" fill="#1f2b38">etcd 成员</text>

  <line x1="150" y1="305" x2="150" y2="343" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="305" x2="450" y2="343" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="750" y1="305" x2="750" y2="343" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="25" y="345" width="250" height="66" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="150" y="371" text-anchor="middle" font-size="12" fill="#1f2b38">node1（192.168.40.23）</text>
  <text x="150" y="393" text-anchor="middle" font-size="12" fill="#1f2b38">kubelet + kube-proxy</text>

  <rect x="325" y="345" width="250" height="66" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="450" y="371" text-anchor="middle" font-size="12" fill="#1f2b38">node2（192.168.40.24）</text>
  <text x="450" y="393" text-anchor="middle" font-size="12" fill="#1f2b38">kubelet + kube-proxy</text>

  <rect x="625" y="345" width="250" height="66" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="750" y="371" text-anchor="middle" font-size="12" fill="#1f2b38">node3（192.168.40.25）</text>
  <text x="750" y="393" text-anchor="middle" font-size="12" fill="#1f2b38">kubelet + kube-proxy</text>

  <text x="450" y="443" text-anchor="middle" font-size="12" fill="#5b6b7c">三台 master 同时承载 keepalived、HAProxy、apiserver 与 etcd</text>
  <text x="450" y="467" text-anchor="middle" font-size="12" fill="#5b6b7c">主节点故障时 VIP 漂移到备用节点，HAProxy 继续把请求转发到存活的 apiserver</text>
</svg>
