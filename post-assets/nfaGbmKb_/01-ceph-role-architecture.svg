<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker></defs>
<rect width="900" height="620" fill="#ffffff"/>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Ceph 集群角色与 RADOS 数据分布</text>
<text x="450" y="52" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">以 Rook v1.11.2 + Ceph Quincy 17.2.x 为例：mon/mgr/mds 管集群，osd 存数据</text>
<rect x="40" y="72" width="820" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="56" y="92" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400">① 客户端 / 接口层</text>
<rect x="48" y="100" width="186" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="141" y="125" font-size="11" fill="#1f2b38" text-anchor="middle" font-weight="400">RBD 块设备（krbd）</text>
<rect x="250" y="100" width="186" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="343" y="125" font-size="11" fill="#1f2b38" text-anchor="middle" font-weight="400">CephFS 共享文件系统</text>
<rect x="452" y="100" width="186" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="545" y="125" font-size="11" fill="#1f2b38" text-anchor="middle" font-weight="400">RGW 对象存储 S3/Swift</text>
<rect x="654" y="100" width="186" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="747" y="125" font-size="11" fill="#1f2b38" text-anchor="middle" font-weight="400">librados 应用直连</text>
<rect x="40" y="164" width="820" height="148" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="56" y="184" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400">② 集群守护进程（角色）</text>
<rect x="48" y="192" width="186" height="104" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="141" y="214" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">MON ×3 / ×5</text>
<text x="141" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">Paxos 仲裁 cluster map</text>
<text x="141" y="254" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">至少 3 个组成 quorum</text>
<text x="141" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">少于半数即不可用</text>
<rect x="250" y="192" width="186" height="104" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="343" y="214" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">MGR（active+standby）</text>
<text x="343" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">Dashboard :8443</text>
<text x="343" y="254" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">指标导出 :9283</text>
<text x="343" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">负载均衡与自动扩缩</text>
<rect x="452" y="192" width="186" height="104" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="545" y="214" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">MDS（仅 CephFS 需要）</text>
<text x="545" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">文件元数据与目录锁</text>
<text x="545" y="254" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">active + standby</text>
<text x="545" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">块/对象存储不需要</text>
<rect x="654" y="192" width="186" height="104" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="747" y="214" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">OSD（每块盘一个）</text>
<text x="747" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">BlueStore 直接管裸盘</text>
<text x="747" y="254" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">承载 PG 与副本</text>
<text x="747" y="274" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">至少 3 个才有冗余</text>
<rect x="40" y="328" width="820" height="148" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="56" y="348" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400">③ RADOS 数据路径：对象 → 归置组 → OSD</text>
<rect x="60" y="364" width="200" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="160" y="386" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">对象 Object</text>
<text x="160" y="406" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">hash(对象名) 决定 PG</text>
<rect x="320" y="364" width="200" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="420" y="386" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">归置组 PG</text>
<text x="420" y="406" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">pg_num / pgp_num</text>
<rect x="580" y="364" width="200" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="680" y="386" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">OSD 集合</text>
<text x="680" y="406" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">CRUSH 计算，故障域 host</text>
<line x1="260" y1="392" x2="316" y2="392" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="520" y1="392" x2="576" y2="392" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="450" y="450" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">同一 PG 的副本由 CRUSH 分散到不同 host：单台主机宕机，数据仍可从其他主机读出</text>
<rect x="40" y="492" width="820" height="104" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="56" y="512" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="400">④ OSD 与 BlueStore（数据落盘）</text>
<rect x="48" y="520" width="256" height="64" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="176" y="542" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">host1 · OSD.0</text>
<text x="176" y="562" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">裸盘 + RocksDB/WAL</text>
<rect x="320" y="520" width="256" height="64" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="448" y="542" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">host2 · OSD.1</text>
<text x="448" y="562" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">承载同一 PG 的副本 2</text>
<rect x="592" y="520" width="256" height="64" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
<text x="720" y="542" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">host3 · OSD.2</text>
<text x="720" y="562" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">承载同一 PG 的副本 3</text>
<text x="450" y="614" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">Rook v1.11.2 默认 Ceph Quincy 17.2.x（quay.io/ceph/ceph:v17.2.5）；生产至少 3 个 MON + 3 个 OSD</text>
</svg>
