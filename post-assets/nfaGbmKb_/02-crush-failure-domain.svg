<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker></defs>
<rect width="900" height="560" fill="#ffffff"/>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Ceph 副本与纠删码：故障域与容量开销</text>
<text x="450" y="52" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">同一 PG 的副本或分片必须落在不同故障域（failureDomain 可为 host 或 rack）</text>
<rect x="40" y="72" width="400" height="272" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="60" y="98" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">副本池 replicated：size=3，host 故障域</text>
<rect x="60" y="112" width="360" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="240" y="137" font-size="11" fill="#1f2b38" text-anchor="middle" font-weight="400">host1：OSD.0 → 副本 1</text>
<rect x="60" y="164" width="360" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="240" y="189" font-size="11" fill="#1f2b38" text-anchor="middle" font-weight="400">host2：OSD.1 → 副本 2</text>
<rect x="60" y="216" width="360" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="240" y="241" font-size="11" fill="#1f2b38" text-anchor="middle" font-weight="400">host3：OSD.2 → 副本 3</text>
<text x="60" y="278" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">容量开销 3×，可用率约 33%</text>
<text x="60" y="298" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">可容忍 2 个故障域失效</text>
<text x="60" y="318" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">3 副本是生产环境的默认选择</text>
<rect x="460" y="72" width="400" height="272" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="480" y="98" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">纠删码池 erasure coded：k=4，m=2</text>
<text x="480" y="126" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">容量开销 1.5×，可用率约 67%</text>
<text x="480" y="150" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">可容忍 m=2 个分片/故障域失效</text>
<text x="480" y="174" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">写入需要全部 k+m 块，读取只需 k 块</text>
<text x="480" y="198" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">适合对象存储、大文件、顺序读写</text>
<text x="480" y="222" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">RBD 元数据必须放在副本池</text>
<text x="480" y="252" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">ceph osd erasure-code-profile set myprofile</text>
<text x="480" y="274" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">   k=4 m=2 crush-failure-domain=host</text>
<rect x="40" y="364" width="820" height="150" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="60" y="388" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">CRUSH 故障域与规则（在 toolbox 或 cephadm 节点执行）</text>
<text x="60" y="414" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">ceph osd crush rule create-replicated hdd-rule default host hdd</text>
<text x="60" y="436" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">ceph osd crush rule create-erasure ec-rule myprofile</text>
<text x="60" y="458" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">ceph osd crush rule dump      # 查看规则细节；ceph osd tree 查看层级</text>
<text x="60" y="480" font-size="11" fill="#1f2b38" text-anchor="start" font-weight="400">3 副本 + rack 故障域至少需要 3 个机架，否则 PG 会长期 undersized</text>
<text x="450" y="540" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">健康检查：ceph -s / ceph health detail / ceph osd df tree / ceph pg dump_stuck inactive</text>
</svg>
