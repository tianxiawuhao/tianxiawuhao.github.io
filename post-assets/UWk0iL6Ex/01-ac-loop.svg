<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Actor-Critic 结构与训练回路：Actor 采样动作，Critic 打分用 TD 误差更新，并把误差交给 Actor 做策略梯度</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9e5b"/></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5bd0"/></marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Actor-Critic：策略网络与价值网络的训练回路</text>
  <rect x="330" y="60" width="240" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">环境 Environment</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#5b6b7c">执行动作 a，返回奖励 r 与新状态 s′</text>
  <rect x="40" y="190" width="250" height="104" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="165" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Actor：策略网络 π(a|s;θ)</text>
  <text x="165" y="240" text-anchor="middle" font-size="11" fill="#5b6b7c">输入：状态 s</text>
  <text x="165" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">输出：动作概率分布，采样得到 a</text>
  <text x="165" y="280" text-anchor="middle" font-size="11" fill="#2e9e5b">用 δ 做策略梯度上升更新 θ</text>
  <rect x="610" y="190" width="250" height="104" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="735" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Critic：价值网络 q(s,a;w)</text>
  <text x="735" y="240" text-anchor="middle" font-size="11" fill="#5b6b7c">输入：状态 s 与动作 a</text>
  <text x="735" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">输出：对 (s,a) 的打分</text>
  <text x="735" y="280" text-anchor="middle" font-size="11" fill="#e08a1e">用 TD 目标更新 w</text>
  <line x1="240" y1="188" x2="498" y2="136" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ahg)"/>
  <text x="396" y="150" text-anchor="middle" font-size="11" fill="#2e9e5b">动作 a</text>
  <line x1="380" y1="136" x2="130" y2="186" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="228" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">状态 s</text>
  <line x1="540" y1="136" x2="700" y2="186" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="648" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">奖励 r、新状态 s′</text>
  <line x1="610" y1="242" x2="296" y2="242" stroke="#7a5bd0" stroke-width="1.4" marker-end="url(#ahp)"/>
  <text x="452" y="232" text-anchor="middle" font-size="11" fill="#7a5bd0">TD 误差 δ → 策略梯度上升</text>
  <rect x="40" y="322" width="820" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="348" font-size="11" fill="#1f2b38">① Critic：TD 目标 y = r + γ·q(s′, a′; w)，误差 δ = q(s, a; w) − y，更新 w ← w − α·δ·∂q/∂w</text>
  <text x="60" y="372" font-size="11" fill="#1f2b38">② Actor：θ ← θ + β·δ·∂ln π(a|s; θ)/∂θ；δ 正是优势函数 A(s,a) = Q(s,a) − V(s) 的单步估计</text>
  <text x="60" y="396" font-size="11" fill="#1f2b38">③ a′ 是 Actor 在 s′ 处采样出来的，仅用于构造 TD 目标，Agent 不会真正执行它</text>
</svg>
