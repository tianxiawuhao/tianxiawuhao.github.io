<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>传统令牌校验与 JWT 校验的流程对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">传统令牌校验与 JWT 校验的流程对比</text>

  <rect x="40" y="55" width="390" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">传统令牌校验</text>
  <text x="235" y="100" text-anchor="middle" font-size="11" fill="#5b6b7c">每次请求都要访问认证服务</text>

  <rect x="165" y="112" width="140" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">客户端</text>

  <line x1="235" y1="156" x2="235" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="245" y="172" font-size="11" fill="#5b6b7c">① 请求 + 令牌</text>

  <rect x="165" y="182" width="140" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">资源服务器</text>

  <line x1="235" y1="226" x2="235" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="245" y="242" font-size="11" fill="#5b6b7c">② 校验令牌</text>

  <rect x="165" y="252" width="140" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="235" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">认证服务</text>

  <path d="M 305 274 L 355 274 L 355 204 L 307 204" fill="none" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="395" y="238" text-anchor="middle" font-size="11" fill="#5b6b7c">③ 校验结果</text>
  <text x="395" y="255" text-anchor="middle" font-size="11" fill="#5b6b7c">用户信息</text>

  <text x="235" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#e08a1e">每次请求多一次远程调用，认证服务压力大</text>

  <rect x="470" y="55" width="390" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">JWT 校验</text>
  <text x="665" y="100" text-anchor="middle" font-size="11" fill="#5b6b7c">资源服务本地验签，不再访问认证服务</text>

  <rect x="595" y="112" width="140" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="665" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">客户端</text>

  <line x1="665" y1="156" x2="665" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="675" y="172" font-size="11" fill="#5b6b7c">① 请求 + JWT</text>

  <rect x="595" y="182" width="140" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="665" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">资源服务器</text>

  <line x1="665" y1="226" x2="665" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="675" y="242" font-size="11" fill="#5b6b7c">② 本地验签</text>

  <rect x="575" y="252" width="180" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="665" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2b38">公钥验签 + 解析 claims</text>

  <path d="M 735 204 L 780 204 L 780 134 L 737 134" fill="none" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="820" y="173" text-anchor="middle" font-size="11" fill="#5b6b7c">③ 返回资源</text>

  <text x="665" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#2e9e5b">验签在本地完成，易水平扩展且无单点压力</text>
</svg>
