<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JWT 令牌的三段结构与签名生成</title>
  <rect width="900" height="350" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">JWT 令牌的三段结构：Header.Payload.Signature</text>

  <rect x="45" y="70" width="250" height="115" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">第一段 Header（头部）</text>
  <text x="170" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b38">xxxxx</text>
  <text x="170" y="151" text-anchor="middle" font-size="11" fill="#5b6b7c">Base64Url 编码后的 JSON</text>
  <text x="170" y="171" text-anchor="middle" font-size="11" fill="#5b6b7c">{&quot;alg&quot;:&quot;HS256&quot;,&quot;typ&quot;:&quot;JWT&quot;}</text>

  <text x="310" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2b38">.</text>

  <rect x="325" y="70" width="250" height="115" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">第二段 Payload（负载）</text>
  <text x="450" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b38">yyyyy</text>
  <text x="450" y="151" text-anchor="middle" font-size="11" fill="#5b6b7c">Base64Url 编码后的 JSON</text>
  <text x="450" y="171" text-anchor="middle" font-size="11" fill="#5b6b7c">{&quot;sub&quot;:&quot;123&quot;,&quot;name&quot;:&quot;mrt&quot;}</text>

  <text x="590" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2b38">.</text>

  <rect x="605" y="70" width="250" height="115" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="730" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">第三段 Signature（签名）</text>
  <text x="730" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b38">zzzzz</text>
  <text x="730" y="151" text-anchor="middle" font-size="11" fill="#5b6b7c">用 Header 声明的 alg 签名</text>
  <text x="730" y="171" text-anchor="middle" font-size="11" fill="#5b6b7c">签名不匹配即视为被篡改</text>

  <line x1="170" y1="185" x2="170" y2="203" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="185" x2="450" y2="203" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="730" y1="185" x2="730" y2="203" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="45" y="205" width="530" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="310" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">前两段只做 Base64Url 编码，它不是加密</text>
  <text x="310" y="255" text-anchor="middle" font-size="11" fill="#5b6b7c">任何人都能解码还原明文，禁止存放密码、身份证号等敏感信息</text>
  <text x="310" y="275" text-anchor="middle" font-size="11" fill="#5b6b7c">编码规则：Base64 的 + / 换成 - _，并去掉末尾的 = 补位</text>

  <line x1="575" y1="245" x2="603" y2="245" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="605" y="205" width="250" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="730" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">第三段由前两段和密钥算出</text>
  <text x="730" y="255" text-anchor="middle" font-size="11" fill="#5b6b7c">HMACSHA256(前两段, 密钥)</text>
  <text x="730" y="275" text-anchor="middle" font-size="11" fill="#5b6b7c">或 RSA 私钥签名、公钥验签</text>

  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#5b6b7c">客户端携带完整 JWT 访问资源服务，资源服务用事先约定的密钥或公钥自行验签，无需再请求认证服务</text>
</svg>
