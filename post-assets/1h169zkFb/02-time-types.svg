<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ClickHouse 时间类型的精度与范围</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ClickHouse 时间类型的精度与范围</text>

  <text x="230" y="72" text-anchor="middle" font-size="12" fill="#5b6b7c">精度：天</text>
  <text x="410" y="72" text-anchor="middle" font-size="12" fill="#5b6b7c">精度：秒</text>
  <text x="600" y="72" text-anchor="middle" font-size="12" fill="#5b6b7c">精度：亚秒（0 ~ 9 位）</text>
  <text x="800" y="72" text-anchor="middle" font-size="12" fill="#5b6b7c">范围与存储</text>
  <line x1="40" y1="84" x2="860" y2="84" stroke="#c8d3e0" stroke-width="1.4"/>

  <line x1="40" y1="126" x2="860" y2="126" stroke="#c8d3e0" stroke-width="1"/>
  <text x="60" y="106" font-size="14" font-weight="700" fill="#1f2b38">Date</text>
  <text x="230" y="106" text-anchor="middle" font-size="12" fill="#1f2b38">2019-12-16</text>
  <text x="410" y="106" text-anchor="middle" font-size="12" fill="#c8d3e0">—</text>
  <text x="600" y="106" text-anchor="middle" font-size="12" fill="#c8d3e0">—</text>
  <text x="800" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">1970-01-01 ~ 2149-06-06 · 2 字节</text>

  <line x1="40" y1="192" x2="860" y2="192" stroke="#c8d3e0" stroke-width="1"/>
  <text x="60" y="152" font-size="14" font-weight="700" fill="#1f2b38">Date32</text>
  <text x="230" y="152" text-anchor="middle" font-size="12" fill="#1f2b38">2019-12-16</text>
  <text x="410" y="152" text-anchor="middle" font-size="12" fill="#c8d3e0">—</text>
  <text x="600" y="152" text-anchor="middle" font-size="12" fill="#c8d3e0">—</text>
  <text x="800" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">1900-01-01 ~ 2299-12-31 · 4 字节</text>
  <text x="60" y="172" font-size="11" fill="#5b6b7c">扩展日期范围</text>

  <line x1="40" y1="238" x2="860" y2="238" stroke="#c8d3e0" stroke-width="1"/>
  <text x="60" y="218" font-size="14" font-weight="700" fill="#1f2b38">DateTime</text>
  <text x="230" y="218" text-anchor="middle" font-size="12" fill="#c8d3e0">—</text>
  <text x="410" y="218" text-anchor="middle" font-size="12" fill="#1f2b38">2019-12-16 20:50:10</text>
  <text x="600" y="218" text-anchor="middle" font-size="12" fill="#c8d3e0">—</text>
  <text x="800" y="218" text-anchor="middle" font-size="11" fill="#5b6b7c">1970-01-01 ~ 2106-02-07 · 4 字节</text>

  <line x1="40" y1="304" x2="860" y2="304" stroke="#c8d3e0" stroke-width="1"/>
  <text x="60" y="264" font-size="14" font-weight="700" fill="#2f6fd0">DateTime64</text>
  <text x="230" y="264" text-anchor="middle" font-size="12" fill="#c8d3e0">—</text>
  <text x="410" y="264" text-anchor="middle" font-size="12" fill="#1f2b38">2019-12-16 20:50:10</text>
  <text x="600" y="264" text-anchor="middle" font-size="12" fill="#1f2b38">2019-12-16 20:50:10.660</text>
  <text x="800" y="264" text-anchor="middle" font-size="11" fill="#5b6b7c">同 DateTime · 8 字节</text>
  <text x="60" y="284" font-size="11" fill="#2f6fd0">precision=3 毫秒、6 微秒</text>

  <text x="60" y="340" font-size="12" fill="#5b6b7c">带时区写法：DateTime('Asia/Shanghai')、DateTime64(3, 'Asia/Shanghai')</text>
  <text x="60" y="360" font-size="12" fill="#5b6b7c">不带时区时按服务器时区解释字面量，跨时区展示建议显式指定 tz。</text>
</svg>
