<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ClickHouse 整型的位宽与数值范围对照</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ClickHouse 整型：位宽决定范围，范围决定能装下的 Java 类型</text>

  <rect x="30" y="46" width="840" height="24" rx="4" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="120" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">CH 类型</text>
  <text x="250" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">位宽</text>
  <text x="530" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">取值范围</text>
  <text x="780" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Java 类型</text>

  <line x1="30" y1="78" x2="870" y2="78" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="185" y1="46" x2="185" y2="468" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="315" y1="46" x2="315" y2="468" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="700" y1="46" x2="700" y2="468" stroke="#c8d3e0" stroke-width="1.2"/>

  <rect x="30" y="78" width="840" height="26" fill="#eef4ff"/>
  <text x="45" y="96" font-size="12" font-weight="700" fill="#2f6fd0">有符号（含负数与 0）</text>

  <rect x="30" y="104" width="840" height="88" fill="#ffffff"/>
  <text x="120" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Int8</text>
  <text x="250" y="138" text-anchor="middle" font-size="12" fill="#1f2b38">8 位</text>
  <text x="530" y="138" text-anchor="middle" font-size="12" fill="#1f2b38">-128 ~ 127</text>
  <text x="780" y="138" text-anchor="middle" font-size="12" fill="#1f2b38">Byte</text>
  <line x1="30" y1="148" x2="870" y2="148" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="120" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Int16</text>
  <text x="250" y="180" text-anchor="middle" font-size="12" fill="#1f2b38">16 位</text>
  <text x="530" y="180" text-anchor="middle" font-size="12" fill="#1f2b38">-32768 ~ 32767</text>
  <text x="780" y="180" text-anchor="middle" font-size="12" fill="#1f2b38">Short</text>

  <line x1="30" y1="192" x2="870" y2="192" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="120" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Int32</text>
  <text x="250" y="224" text-anchor="middle" font-size="12" fill="#1f2b38">32 位</text>
  <text x="530" y="224" text-anchor="middle" font-size="12" fill="#1f2b38">-2147483648 ~ 2147483647</text>
  <text x="780" y="224" text-anchor="middle" font-size="12" fill="#1f2b38">Int</text>
  <line x1="30" y1="236" x2="870" y2="236" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="120" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Int64</text>
  <text x="250" y="268" text-anchor="middle" font-size="12" fill="#1f2b38">64 位</text>
  <text x="530" y="268" text-anchor="middle" font-size="12" fill="#1f2b38">-9223372036854775808 ~ 9223372036854775807</text>
  <text x="780" y="268" text-anchor="middle" font-size="12" fill="#1f2b38">Long</text>

  <rect x="30" y="280" width="840" height="26" fill="#fff6e8"/>
  <text x="45" y="298" font-size="12" font-weight="700" fill="#e08a1e">无符号（只表示 0 与正数，Java 没有对应原生类型）</text>

  <rect x="30" y="306" width="840" height="84" fill="#ffffff"/>
  <text x="120" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">UInt8</text>
  <text x="250" y="338" text-anchor="middle" font-size="12" fill="#1f2b38">8 位</text>
  <text x="530" y="338" text-anchor="middle" font-size="12" fill="#1f2b38">0 ~ 255</text>
  <text x="780" y="338" text-anchor="middle" font-size="12" fill="#5b6b7c">需用更大类型承载</text>
  <line x1="30" y1="348" x2="870" y2="348" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="120" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">UInt16</text>
  <text x="250" y="380" text-anchor="middle" font-size="12" fill="#1f2b38">16 位</text>
  <text x="530" y="380" text-anchor="middle" font-size="12" fill="#1f2b38">0 ~ 65535</text>
  <text x="780" y="380" text-anchor="middle" font-size="12" fill="#5b6b7c">需用更大类型承载</text>

  <line x1="30" y1="390" x2="870" y2="390" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="120" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">UInt32</text>
  <text x="250" y="420" text-anchor="middle" font-size="12" fill="#1f2b38">32 位</text>
  <text x="530" y="420" text-anchor="middle" font-size="12" fill="#1f2b38">0 ~ 4294967295</text>
  <text x="780" y="420" text-anchor="middle" font-size="12" fill="#5b6b7c">需用更大类型承载</text>
  <line x1="30" y1="432" x2="870" y2="432" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="120" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">UInt64</text>
  <text x="250" y="462" text-anchor="middle" font-size="12" fill="#1f2b38">64 位</text>
  <text x="530" y="462" text-anchor="middle" font-size="12" fill="#1f2b38">0 ~ 18446744073709551615</text>
  <text x="780" y="462" text-anchor="middle" font-size="12" fill="#5b6b7c">需用更大类型承载</text>

  <rect x="30" y="46" width="840" height="420" rx="8" fill="none" stroke="#c8d3e0" stroke-width="1.4"/>
</svg>
