<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ClickHouse 常用数据类型总览</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ClickHouse 常用数据类型总览</text>

  <rect x="40" y="52" width="820" height="88" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="86" font-size="14" font-weight="700" fill="#2f6fd0">数值类型</text>
  <line x1="150" y1="66" x2="150" y2="126" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="86" font-size="13" fill="#1f2b38">整型：Int8 / Int16 / Int32 / Int64 与无符号 UInt8 ~ UInt64</text>
  <text x="170" y="106" font-size="12" fill="#5b6b7c">后缀数字即位数；范围：有符号 -2^(n-1) ~ 2^(n-1)-1，无符号 0 ~ 2^n-1</text>
  <text x="170" y="126" font-size="12" fill="#5b6b7c">浮点：Float32 / Float64；定点：Decimal32(s) / Decimal64(s) / Decimal128(s)</text>

  <rect x="40" y="152" width="820" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="186" font-size="14" font-weight="700" fill="#2e9e5b">字符串类型</text>
  <line x1="150" y1="166" x2="150" y2="226" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="186" font-size="13" fill="#1f2b38">String：变长，可存任意字节集（含空字节），对应 MySQL 的 Varchar</text>
  <text x="170" y="206" font-size="12" fill="#5b6b7c">FixedString(N)：定长 N 字节，不足补空字节，超长直接报错</text>
  <text x="170" y="226" font-size="12" fill="#5b6b7c">Enum8 / Enum16：字符串与整数建立映射，写入未定义值会抛异常</text>

  <rect x="40" y="252" width="820" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="286" font-size="14" font-weight="700" fill="#e08a1e">时间类型</text>
  <line x1="150" y1="266" x2="150" y2="326" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="286" font-size="13" fill="#1f2b38">Date（2 字节，到天） / Date32（4 字节，1900—2299）</text>
  <text x="170" y="306" font-size="12" fill="#5b6b7c">DateTime（4 字节，到秒，1970—2106）</text>
  <text x="170" y="326" font-size="12" fill="#5b6b7c">DateTime64(precision, tz)（8 字节，亚秒精度 0 ~ 9，可带时区）</text>

  <rect x="40" y="352" width="820" height="88" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="386" font-size="14" font-weight="700" fill="#7a5bd0">复合与特殊类型</text>
  <line x1="150" y1="366" x2="150" y2="426" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="386" font-size="13" fill="#1f2b38">Array(T)：元素类型 T 的数组，可用 array(1,2) 或 [1,2] 构造</text>
  <text x="170" y="406" font-size="12" fill="#5b6b7c">Nullable(T) / LowCardinality(T) / UUID / IPv4 / IPv6 / Map / Tuple</text>
  <text x="170" y="426" font-size="12" fill="#5b6b7c">Integer = Int32，Float = Float32；布尔值用 UInt8 的 0 / 1 表示</text>
</svg>
