<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Decimal 的 s 与总位数关系，以及 Array(T) 的类型标定</title>
  <rect width="900" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Decimal(s) 的总位数固定，Array(T) 的类型由元素标定</text>

  <rect x="30" y="50" width="410" height="310" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="235" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Decimal：总位数固定，s 只切分位置</text>

  <text x="55" y="110" font-size="12" font-weight="700" fill="#1f2b38">Decimal32(s)</text>
  <text x="415" y="110" text-anchor="end" font-size="12" fill="#5b6b7c">8 位</text>
  <rect x="55" y="120" width="360" height="28" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="139" text-anchor="middle" font-size="12" fill="#1f2b38">8 位 = 整数部分 (8 − s) + 小数部分 s</text>

  <text x="55" y="182" font-size="12" font-weight="700" fill="#1f2b38">Decimal64(s)</text>
  <text x="415" y="182" text-anchor="end" font-size="12" fill="#5b6b7c">18 位</text>
  <rect x="55" y="192" width="360" height="28" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="235" y="211" text-anchor="middle" font-size="12" fill="#1f2b38">18 位 = 整数部分 (18 − s) + 小数部分 s</text>

  <text x="55" y="254" font-size="12" font-weight="700" fill="#1f2b38">Decimal128(s)</text>
  <text x="415" y="254" text-anchor="end" font-size="12" fill="#5b6b7c">38 位</text>
  <rect x="55" y="264" width="360" height="28" rx="4" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="235" y="283" text-anchor="middle" font-size="12" fill="#1f2b38">38 位 = 整数部分 (38 − s) + 小数部分 s</text>

  <text x="55" y="322" font-size="11" fill="#5b6b7c">同一个数，s 越大，小数越精确，整数部分能放下的位数越少</text>
  <text x="55" y="342" font-size="11" fill="#5b6b7c">除法只丢弃最低有效位，不四舍五入</text>

  <rect x="460" y="50" width="410" height="310" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Array(T)：T 是元素类型</text>

  <text x="485" y="110" font-size="12" font-weight="700" fill="#1f2b38">写法一：array(1, 2)</text>
  <rect x="485" y="120" width="360" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="505" y="151" font-size="13" font-weight="700" fill="#1f2b38">Array(UInt8)</text>
  <text x="830" y="151" text-anchor="end" font-size="12" fill="#5b6b7c">元素均为 1 字节无符号整数</text>

  <text x="485" y="205" font-size="12" font-weight="700" fill="#1f2b38">写法二：[1, 2]</text>
  <rect x="485" y="215" width="360" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="505" y="246" font-size="13" font-weight="700" fill="#1f2b38">Array(UInt8)</text>
  <text x="830" y="246" text-anchor="end" font-size="12" fill="#5b6b7c">方括号是 array 的语法糖</text>

  <rect x="485" y="285" width="360" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="505" y="306" font-size="13" font-weight="700" fill="#2e9e5b">两种写法结果完全一致</text>
  <text x="505" y="326" font-size="12" fill="#1f2b38">元素类型不同则判为不同类型，例如 Array(Int8)</text>
</svg>
