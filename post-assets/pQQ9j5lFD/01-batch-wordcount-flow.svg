<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 批处理 WordCount 执行流程</title>
  <rect width="900" height="240" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">批处理 WordCount 执行流程</text>

  <rect x="36" y="88" width="148" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="110" y="116" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">fromElements</text>
  <text x="110" y="136" font-size="11" fill="#5b6b7c" text-anchor="middle">构造 DataSet 输入</text>

  <rect x="206" y="88" width="148" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="280" y="116" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">flatMap</text>
  <text x="280" y="136" font-size="11" fill="#5b6b7c" text-anchor="middle">拆词为 (word, 1)</text>

  <rect x="376" y="88" width="148" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="116" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">groupBy(0)</text>
  <text x="450" y="136" font-size="11" fill="#5b6b7c" text-anchor="middle">按单词分组</text>

  <rect x="546" y="88" width="148" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="620" y="116" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">sum(1)</text>
  <text x="620" y="136" font-size="11" fill="#5b6b7c" text-anchor="middle">累加出现次数</text>

  <rect x="716" y="88" width="148" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="790" y="116" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">printToErr</text>
  <text x="790" y="136" font-size="11" fill="#5b6b7c" text-anchor="middle">控制台输出结果</text>

  <line x1="186" y1="121" x2="202" y2="121" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="356" y1="121" x2="372" y2="121" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="526" y1="121" x2="542" y2="121" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="696" y1="121" x2="712" y2="121" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="36" y="182" width="828" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="204" font-size="12" fill="#5b6b7c" text-anchor="middle">DataSet 批处理：一次性读入全部数据，计算完成后统一输出结果</text>
</svg>
