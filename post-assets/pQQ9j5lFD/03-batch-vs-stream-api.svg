<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 批处理与流处理 API 对照</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="32" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">批处理与流处理 API 对照</text>

  <rect x="36" y="60" width="390" height="336" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="474" y="60" width="390" height="336" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>

  <text x="231" y="88" font-size="15" font-weight="700" fill="#1f2b38" text-anchor="middle">批处理：DataSet API</text>
  <text x="669" y="88" font-size="15" font-weight="700" fill="#1f2b38" text-anchor="middle">流处理：DataStream API</text>
  <line x1="36" y1="102" x2="426" y2="102" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="474" y1="102" x2="864" y2="102" stroke="#c8d3e0" stroke-width="1.2"/>

  <line x1="36" y1="160" x2="426" y2="160" stroke="#eef4ff" stroke-width="1.2"/>
  <line x1="36" y1="218" x2="426" y2="218" stroke="#eef4ff" stroke-width="1.2"/>
  <line x1="36" y1="276" x2="426" y2="276" stroke="#eef4ff" stroke-width="1.2"/>
  <line x1="36" y1="334" x2="426" y2="334" stroke="#eef4ff" stroke-width="1.2"/>
  <line x1="474" y1="160" x2="864" y2="160" stroke="#eef4ff" stroke-width="1.2"/>
  <line x1="474" y1="218" x2="864" y2="218" stroke="#eef4ff" stroke-width="1.2"/>
  <line x1="474" y1="276" x2="864" y2="276" stroke="#eef4ff" stroke-width="1.2"/>
  <line x1="474" y1="334" x2="864" y2="334" stroke="#eef4ff" stroke-width="1.2"/>

  <text x="56" y="123" font-size="12" fill="#5b6b7c">执行环境</text>
  <text x="56" y="144" font-size="13" fill="#1f2b38">ExecutionEnvironment</text>
  <text x="494" y="123" font-size="12" fill="#5b6b7c">执行环境</text>
  <text x="494" y="144" font-size="13" fill="#1f2b38">StreamExecutionEnvironment</text>

  <text x="56" y="181" font-size="12" fill="#5b6b7c">数据源</text>
  <text x="56" y="202" font-size="13" fill="#1f2b38">fromElements / readTextFile</text>
  <text x="494" y="181" font-size="12" fill="#5b6b7c">数据源</text>
  <text x="494" y="202" font-size="13" fill="#1f2b38">socketTextStream(host, port, "\n")</text>

  <text x="56" y="239" font-size="12" fill="#5b6b7c">数据抽象</text>
  <text x="56" y="260" font-size="13" fill="#1f2b38">DataSet&lt;T&gt;</text>
  <text x="494" y="239" font-size="12" fill="#5b6b7c">数据抽象</text>
  <text x="494" y="260" font-size="13" fill="#1f2b38">DataStream&lt;T&gt;</text>

  <text x="56" y="297" font-size="12" fill="#5b6b7c">分组与计算</text>
  <text x="56" y="318" font-size="13" fill="#1f2b38">groupBy(0).sum(1)</text>
  <text x="494" y="297" font-size="12" fill="#5b6b7c">分组与计算</text>
  <text x="494" y="318" font-size="13" fill="#1f2b38">keyBy("word").timeWindow(5s, 1s)</text>

  <text x="56" y="355" font-size="12" fill="#5b6b7c">输出与提交</text>
  <text x="56" y="376" font-size="13" fill="#1f2b38">printToErr()</text>
  <text x="494" y="355" font-size="12" fill="#5b6b7c">输出与提交</text>
  <text x="494" y="376" font-size="13" fill="#1f2b38">print().setParallelism(1)</text>

  <line x1="430" y1="131" x2="470" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="430" y1="189" x2="470" y2="189" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="430" y1="247" x2="470" y2="247" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="430" y1="305" x2="470" y2="305" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="430" y1="363" x2="470" y2="363" stroke="#5b6b7c" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <rect x="36" y="412" width="828" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="435" font-size="12" fill="#1f2b38" text-anchor="middle">两者共享同一套运行时：批处理面向有界数据集，流处理面向无界数据流，窗口把无界流切分为有界片段</text>
</svg>
