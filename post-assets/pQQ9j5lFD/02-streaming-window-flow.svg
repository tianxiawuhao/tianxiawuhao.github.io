<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>流处理 WordCount 处理链路与滑动窗口</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">流处理 WordCount 处理链路与滑动窗口</text>

  <rect x="36" y="60" width="148" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="110" y="88" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">socketTextStream</text>
  <text x="110" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">监听 9000 端口</text>

  <rect x="206" y="60" width="148" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="280" y="88" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">flatMap</text>
  <text x="280" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">拆分为 (word, 1L)</text>

  <rect x="376" y="60" width="148" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="88" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">keyBy("word")</text>
  <text x="450" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">按单词分组</text>

  <rect x="546" y="60" width="148" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="620" y="88" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">timeWindow(5s, 1s)</text>
  <text x="620" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">窗口 5 秒，滑动 1 秒</text>

  <rect x="716" y="60" width="148" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="790" y="88" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">reduce + print</text>
  <text x="790" y="108" font-size="11" fill="#5b6b7c" text-anchor="middle">聚合后打印结果</text>

  <line x1="186" y1="93" x2="202" y2="93" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="356" y1="93" x2="372" y2="93" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="526" y1="93" x2="542" y2="93" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="696" y1="93" x2="712" y2="93" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="172" font-size="13" fill="#1f2b38" text-anchor="middle">滑动窗口：长度 5 秒、步长 1 秒，相邻窗口相互重叠，每秒输出一次</text>

  <rect x="60" y="195" width="487.5" height="22" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="74" y="210" font-size="11" fill="#1f2b38">窗口 1：0–5 秒</text>
  <rect x="157.5" y="235" width="487.5" height="22" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="171.5" y="250" font-size="11" fill="#1f2b38">窗口 2：1–6 秒</text>
  <rect x="255" y="275" width="487.5" height="22" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="269" y="290" font-size="11" fill="#1f2b38">窗口 3：2–7 秒</text>

  <line x1="60" y1="320" x2="840" y2="320" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="60" y1="316" x2="60" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="157.5" y1="316" x2="157.5" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="255" y1="316" x2="255" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="352.5" y1="316" x2="352.5" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="450" y1="316" x2="450" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="547.5" y1="316" x2="547.5" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="645" y1="316" x2="645" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="742.5" y1="316" x2="742.5" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="840" y1="316" x2="840" y2="324" stroke="#c8d3e0" stroke-width="1.4"/>

  <text x="60" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">0s</text>
  <text x="157.5" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">1s</text>
  <text x="255" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">2s</text>
  <text x="352.5" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">3s</text>
  <text x="450" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">4s</text>
  <text x="547.5" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">5s</text>
  <text x="645" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">6s</text>
  <text x="742.5" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">7s</text>
  <text x="840" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">8s</text>
</svg>
