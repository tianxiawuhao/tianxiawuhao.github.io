<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif" role="img" aria-label="Lambda 与函数式接口、方法引用映射">
  <defs>
    <marker id="impl-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f6fd0"/>
    </marker>
    <marker id="same-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a5bd0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Lambda、函数式接口与方法引用映射</text>
  <text x="450" y="58" font-size="12" fill="#5b6b7c" text-anchor="middle">函数式接口规定「做什么」，Lambda 与方法引用给出「怎么做」，三者可以互相替换</text>

  <rect x="30" y="76" width="840" height="38" rx="8" fill="#1f2b38"/>
  <text x="144" y="101" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">函数式接口 / 抽象方法</text>
  <text x="415" y="101" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Lambda 写法</text>
  <text x="721" y="101" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">方法引用写法</text>

  <rect x="30" y="122" width="840" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <line x1="258" y1="122" x2="258" y2="178" stroke="#c8d3e0"/>
  <line x1="572" y1="122" x2="572" y2="178" stroke="#c8d3e0"/>
  <text x="44" y="146" font-size="13" font-weight="700" fill="#2f6fd0">Predicate&lt;T&gt;</text>
  <text x="44" y="165" font-size="11" fill="#5b6b7c">test(T t) → boolean，判断真假</text>
  <text x="288" y="146" font-size="12.5" fill="#7a5bd0" font-family="DejaVu Sans Mono, monospace">s -&gt; s.isEmpty()</text>
  <text x="288" y="165" font-size="11" fill="#5b6b7c">抽象方法有 1 个参数</text>
  <text x="602" y="146" font-size="12.5" fill="#2e9e5b" font-family="DejaVu Sans Mono, monospace">String::isEmpty</text>
  <text x="602" y="165" font-size="11" fill="#5b6b7c">未绑定实例方法引用（任意对象）</text>
  <line x1="242" y1="150" x2="272" y2="150" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#impl-blue)"/>
  <line x1="557" y1="150" x2="587" y2="150" stroke="#7a5bd0" stroke-width="1.6" marker-end="url(#same-purple)"/>

  <rect x="30" y="186" width="840" height="56" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
  <line x1="258" y1="186" x2="258" y2="242" stroke="#c8d3e0"/>
  <line x1="572" y1="186" x2="572" y2="242" stroke="#c8d3e0"/>
  <text x="44" y="210" font-size="13" font-weight="700" fill="#2f6fd0">Function&lt;T, R&gt;</text>
  <text x="44" y="229" font-size="11" fill="#5b6b7c">apply(T t) → R，把 T 映射为 R</text>
  <text x="288" y="210" font-size="12.5" fill="#7a5bd0" font-family="DejaVu Sans Mono, monospace">s -&gt; s.getName()</text>
  <text x="288" y="229" font-size="11" fill="#5b6b7c">Stream.map 内部就是它</text>
  <text x="602" y="210" font-size="12.5" fill="#2e9e5b" font-family="DejaVu Sans Mono, monospace">Student::getName</text>
  <text x="602" y="229" font-size="11" fill="#5b6b7c">第一个参数作为调用者</text>
  <line x1="242" y1="214" x2="272" y2="214" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#impl-blue)"/>
  <line x1="557" y1="214" x2="587" y2="214" stroke="#7a5bd0" stroke-width="1.6" marker-end="url(#same-purple)"/>

  <rect x="30" y="250" width="840" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <line x1="258" y1="250" x2="258" y2="306" stroke="#c8d3e0"/>
  <line x1="572" y1="250" x2="572" y2="306" stroke="#c8d3e0"/>
  <text x="44" y="274" font-size="13" font-weight="700" fill="#2f6fd0">Supplier&lt;T&gt;</text>
  <text x="44" y="293" font-size="11" fill="#5b6b7c">get() → T，生产一个值</text>
  <text x="288" y="274" font-size="12.5" fill="#7a5bd0" font-family="DejaVu Sans Mono, monospace">() -&gt; new Student()</text>
  <text x="288" y="293" font-size="11" fill="#5b6b7c">无参数，不能省略括号</text>
  <text x="602" y="274" font-size="12.5" fill="#2e9e5b" font-family="DejaVu Sans Mono, monospace">Student::new</text>
  <text x="602" y="293" font-size="11" fill="#5b6b7c">构造方法引用</text>
  <line x1="242" y1="278" x2="272" y2="278" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#impl-blue)"/>
  <line x1="557" y1="278" x2="587" y2="278" stroke="#7a5bd0" stroke-width="1.6" marker-end="url(#same-purple)"/>

  <rect x="30" y="314" width="840" height="56" rx="8" fill="#eef4ff" stroke="#c8d3e0"/>
  <line x1="258" y1="314" x2="258" y2="370" stroke="#c8d3e0"/>
  <line x1="572" y1="314" x2="572" y2="370" stroke="#c8d3e0"/>
  <text x="44" y="338" font-size="13" font-weight="700" fill="#2f6fd0">Consumer&lt;T&gt;</text>
  <text x="44" y="357" font-size="11" fill="#5b6b7c">accept(T t) → void，消费一个值</text>
  <text x="288" y="338" font-size="12.5" fill="#7a5bd0" font-family="DejaVu Sans Mono, monospace">s -&gt; System.out.println(s)</text>
  <text x="288" y="357" font-size="11" fill="#5b6b7c">Stream.forEach 内部就是它</text>
  <text x="602" y="338" font-size="12.5" fill="#2e9e5b" font-family="DejaVu Sans Mono, monospace">System.out::println</text>
  <text x="602" y="357" font-size="11" fill="#5b6b7c">绑定实例方法引用（特定对象）</text>
  <line x1="242" y1="342" x2="272" y2="342" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#impl-blue)"/>
  <line x1="557" y1="342" x2="587" y2="342" stroke="#7a5bd0" stroke-width="1.6" marker-end="url(#same-purple)"/>

  <rect x="30" y="388" width="840" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="46" y="408" font-size="11.5" fill="#1f2b38">静态方法引用：Integer::parseInt　等价于　x -&gt; Integer.parseInt(x)　蓝色箭头＝Lambda 实现接口，紫色箭头＝方法引用等价替换</text>
  <text x="46" y="426" font-size="11.5" fill="#5b6b7c">口诀：接口抽象方法有几个参数，Lambda 就有几个参数；「::」左边是方法所属者，右边是方法名，后面不加括号</text>
</svg>
