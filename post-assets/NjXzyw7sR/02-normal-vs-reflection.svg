<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>正常调用与反射调用的差别</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">正常调用与反射调用的差别</text>
  <rect x="35" y="70" width="390" height="170" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="55" y="100" font-size="14" font-weight="700" fill="#1f2b38">正常调用：编译期确定</text>
  <text x="55" y="134" font-size="12" fill="#1f2b38">Student s = new Student();</text>
  <text x="55" y="160" font-size="12" fill="#1f2b38">s.show();</text>
  <text x="55" y="200" font-size="11" fill="#5b6b7c">类名、方法名写死在源码里，</text>
  <text x="55" y="220" font-size="11" fill="#5b6b7c">编译后无法更改，但类型安全、速度快</text>
  <rect x="475" y="70" width="390" height="170" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="495" y="100" font-size="14" font-weight="700" fill="#1f2b38">反射调用：运行期确定</text>
  <text x="495" y="134" font-size="12" fill="#1f2b38">Class c = Class.forName(全类名);</text>
  <text x="495" y="160" font-size="12" fill="#1f2b38">Method m = c.getMethod(方法名);</text>
  <text x="495" y="186" font-size="12" fill="#1f2b38">m.invoke(c.newInstance());</text>
  <text x="495" y="220" font-size="11" fill="#5b6b7c">类名与方法名可来自配置文件，改配置即可切换实现</text>
  <rect x="35" y="262" width="830" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="289" text-anchor="middle" font-size="12" fill="#1f2b38">代价：绕过编译期检查，性能低于直接调用，报错时间更晚，并需要处理受检异常</text>
</svg>
