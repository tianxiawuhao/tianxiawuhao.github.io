<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>反射整体脉络：获取 Class 对象的三种方式与解剖结果</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">反射的整体脉络：先拿 Class 对象，再解剖出成员</text>
  <rect x="35" y="70" width="250" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="100" text-anchor="middle" font-size="13" fill="#1f2b38">① 对象.getClass()</text>
  <rect x="35" y="128" width="250" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="158" text-anchor="middle" font-size="13" fill="#1f2b38">② 类名.class</text>
  <rect x="35" y="186" width="250" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="216" text-anchor="middle" font-size="13" fill="#1f2b38">③ Class.forName(全类名)</text>
  <rect x="345" y="110" width="200" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="445" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Class 对象</text>
  <text x="445" y="168" text-anchor="middle" font-size="11" fill="#5b6b7c">一个类只有一个实例</text>
  <rect x="605" y="70" width="260" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="100" text-anchor="middle" font-size="13" fill="#1f2b38">Constructor 构造方法</text>
  <rect x="605" y="128" width="260" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="158" text-anchor="middle" font-size="13" fill="#1f2b38">Field 成员变量</text>
  <rect x="605" y="186" width="260" height="48" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="735" y="216" text-anchor="middle" font-size="13" fill="#1f2b38">Method 成员方法</text>
  <line x1="287" y1="94" x2="343" y2="130" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="287" y1="152" x2="343" y2="152" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="287" y1="210" x2="343" y2="176" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="547" y1="130" x2="603" y2="94" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="547" y1="152" x2="603" y2="152" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="547" y1="176" x2="603" y2="210" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="35" y="286" width="830" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="312" text-anchor="middle" font-size="12" fill="#1f2b38">拿到成员对象后：newInstance() 创建实例 · set() 读写字段 · invoke() 调用方法</text>
  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#1f2b38">访问私有成员前需要 setAccessible(true) 解除访问限制</text>
</svg>
