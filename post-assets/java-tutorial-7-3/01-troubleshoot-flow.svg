<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>性能排查的逐层收敛路径与三条常见误区</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">性能排查：从系统指标逐层收敛到代码</text>

  <rect x="30" y="70" width="180" height="122" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">① 系统整体指标</text>
  <text x="120" y="126" text-anchor="middle" font-size="11.5" fill="#5b6b7c">top -bn1</text>
  <text x="120" y="148" text-anchor="middle" font-size="11.5" fill="#5b6b7c">free -h / df -h</text>
  <text x="120" y="170" text-anchor="middle" font-size="11.5" fill="#5b6b7c">先判断瓶颈类型</text>

  <line x1="212" y1="131" x2="246" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="250" y="70" width="180" height="122" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">② 进程与线程</text>
  <text x="340" y="126" text-anchor="middle" font-size="11.5" fill="#5b6b7c">ps aux / ps -ef</text>
  <text x="340" y="148" text-anchor="middle" font-size="11.5" fill="#5b6b7c">top -Hp &lt;pid&gt;</text>
  <text x="340" y="170" text-anchor="middle" font-size="11.5" fill="#5b6b7c">锁定最忙的线程</text>

  <line x1="432" y1="131" x2="466" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="70" width="180" height="122" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="560" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">③ 进程内部资源</text>
  <text x="560" y="126" text-anchor="middle" font-size="11.5" fill="#5b6b7c">cgroup 限额文件</text>
  <text x="560" y="148" text-anchor="middle" font-size="11.5" fill="#5b6b7c">jstat / jcmd</text>
  <text x="560" y="170" text-anchor="middle" font-size="11.5" fill="#5b6b7c">确认容器视角</text>

  <line x1="652" y1="131" x2="686" y2="131" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="690" y="70" width="180" height="122" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="780" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">④ 代码</text>
  <text x="780" y="126" text-anchor="middle" font-size="11.5" fill="#5b6b7c">jstack 线程栈</text>
  <text x="780" y="148" text-anchor="middle" font-size="11.5" fill="#5b6b7c">jmap 堆转储</text>
  <text x="780" y="170" text-anchor="middle" font-size="11.5" fill="#5b6b7c">定位到具体方法</text>

  <rect x="30" y="225" width="840" height="105" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="250" font-size="12.5" font-weight="700" fill="#1f2b38">三条最容易踩的坑</text>

  <rect x="50" y="260" width="250" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="175" y="283" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2b38">ps -aux 是错误语法</text>
  <text x="175" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">应写 ps aux 或 ps -ef</text>

  <rect x="325" y="260" width="250" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="283" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2b38">容器 /proc 是宿主机视角</text>
  <text x="450" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">用 MaxRAMPercentage 修正</text>

  <rect x="600" y="260" width="250" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="725" y="283" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2b38">CLOSE_WAIT 大量堆积</text>
  <text x="725" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">是连接泄漏，要改代码</text>
</svg>
