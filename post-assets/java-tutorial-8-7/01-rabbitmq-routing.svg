<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>RabbitMQ 交换机路由模型：生产者发到 Exchange，由绑定与路由键投递到队列</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">生产者不写队列：Exchange 按绑定与路由键投递</text>

  <rect x="40" y="160" width="118" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="99" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">生产者</text>
  <text x="99" y="199" text-anchor="middle" font-size="11" fill="#5b6b7c">Producer</text>
  <line x1="158" y1="185" x2="234" y2="185" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="196" y="177" text-anchor="middle" font-size="11" fill="#5b6b7c">publish</text>

  <rect x="240" y="88" width="180" height="178" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="330" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">Exchange 交换机</text>
  <rect x="258" y="122" width="144" height="34" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="330" y="143" text-anchor="middle" font-size="11.5" fill="#1f2b38">direct 全匹配</text>
  <rect x="258" y="168" width="144" height="34" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="330" y="189" text-anchor="middle" font-size="11.5" fill="#1f2b38">fanout 广播</text>
  <rect x="258" y="214" width="144" height="34" rx="6" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="330" y="235" text-anchor="middle" font-size="11.5" fill="#1f2b38">topic 通配符</text>

  <line x1="420" y1="139" x2="626" y2="139" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="523" y="131" text-anchor="middle" font-size="11" fill="#5b6b7c">order.pay</text>
  <line x1="420" y1="185" x2="626" y2="185" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="523" y="177" text-anchor="middle" font-size="11" fill="#5b6b7c">忽略路由键</text>
  <line x1="420" y1="231" x2="626" y2="231" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="523" y="223" text-anchor="middle" font-size="11" fill="#5b6b7c">order.#</text>

  <rect x="632" y="114" width="228" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="746" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">order.pay.queue</text>
  <text x="746" y="153" text-anchor="middle" font-size="11" fill="#5b6b7c">单队列单消费者 → 有序</text>
  <rect x="632" y="160" width="228" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="746" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">sms.queue</text>
  <text x="746" y="199" text-anchor="middle" font-size="11" fill="#5b6b7c">多消费者并发消费</text>
  <rect x="632" y="206" width="228" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="746" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">search.queue</text>
  <text x="746" y="245" text-anchor="middle" font-size="11" fill="#5b6b7c">basicQos 预取限流</text>

  <text x="40" y="304" font-size="12" fill="#1f2b38">生产者对队列无感知，路由规则全部写在 Exchange 类型 + Binding + Routing Key 三件套上。</text>
  <text x="40" y="328" font-size="12" fill="#5b6b7c">可靠投递要三端设防：confirm、durable + 持久化、手动 ack（失败转死信交换机）。</text>
</svg>
