<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Docker 版 FastDFS 中 tracker、storage 与客户端容器的关系</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Docker 版 FastDFS：客户端、tracker 与 storage 容器的关系</text>

  <rect x="330" y="70" width="280" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="470" y="92" font-size="13" fill="#1f2b38" text-anchor="middle">客户端容器</text>
  <text x="470" y="111" font-size="11" fill="#5b6b7c" text-anchor="middle">fdfs_sh（fdfs_upload_file）</text>

  <rect x="120" y="190" width="280" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="260" y="215" font-size="13" fill="#1f2b38" text-anchor="middle">Tracker 容器</text>
  <text x="260" y="235" font-size="11" fill="#5b6b7c" text-anchor="middle">tracker｜端口 22122（调度）</text>

  <rect x="500" y="190" width="280" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="640" y="215" font-size="13" fill="#1f2b38" text-anchor="middle">Storage 容器</text>
  <text x="640" y="235" font-size="11" fill="#5b6b7c" text-anchor="middle">storage / group1｜端口 23000</text>

  <line x1="350" y1="124" x2="265" y2="186" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="180" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">① 查询可用的 storage</text>
  <line x1="590" y1="124" x2="675" y2="186" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="770" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">② 上传 / 下载文件</text>
  <line x1="400" y1="220" x2="500" y2="220" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="450" y="210" font-size="11" fill="#5b6b7c" text-anchor="middle">③ 注册与心跳</text>
  <line x1="640" y1="252" x2="640" y2="296" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="500" y="300" width="380" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="322" font-size="11" fill="#1f2b38" text-anchor="middle">卷 ~/storage_data → /fastdfs/storage/data</text>
  <text x="690" y="342" font-size="11" fill="#1f2b38" text-anchor="middle">卷 ~/store_path → /fastdfs/store_path</text>

  <rect x="40" y="300" width="420" height="60" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="250" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">本机演示使用 --net=host，容器直接复用宿主机 IP 与端口</text>
  <text x="250" y="342" font-size="11" fill="#5b6b7c" text-anchor="middle">上传成功后文件按 data/00/00 目录规则落盘</text>
</svg>
