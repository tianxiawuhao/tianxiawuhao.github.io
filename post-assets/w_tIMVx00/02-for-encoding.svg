<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Frame Of Reference 增量编码的三个步骤</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Frame Of Reference（FOR）：倒排表的增量编码三步</text>
  <rect x="40" y="60" width="820" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="88" font-size="13" font-weight="700" fill="#1f2b38">Step 1  Delta-encode 增量编码</text>
  <text x="60" y="114" font-size="12" fill="#5b6b7c">只记录相邻元素的差值：[73, 300, 302, 332, 343, 372] 变为 [73, 227, 2, 30, 11, 29]</text>
  <line x1="450" y1="140" x2="450" y2="170" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="175" width="820" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="203" font-size="13" font-weight="700" fill="#1f2b38">Step 2  Split into blocks 分块</text>
  <text x="60" y="229" font-size="12" fill="#5b6b7c">每 256 个文档 ID 一块，块内增量小于 256：[73, 227, 2] | [30, 11, 29]</text>
  <line x1="450" y1="255" x2="450" y2="285" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="290" width="820" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="60" y="316" font-size="13" font-weight="700" fill="#1f2b38">Step 3  Bit packing 按需分配位宽</text>
  <text x="60" y="340" font-size="12" fill="#5b6b7c">每块取块内最大值的位宽，块内所有元素统一按该位宽存储</text>
  <rect x="60" y="352" width="380" height="32" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="250" y="373" text-anchor="middle" font-size="12" fill="#1f2b38">块一 最大 227，每元素 8 bits（3 x 8 = 24 bits）</text>
  <rect x="460" y="352" width="380" height="32" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="650" y="373" text-anchor="middle" font-size="12" fill="#1f2b38">块二 最大 30，每元素 5 bits（3 x 5 = 15 bits）</text>
</svg>
