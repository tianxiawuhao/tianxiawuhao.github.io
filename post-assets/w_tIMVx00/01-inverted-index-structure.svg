<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Lucene 倒排索引的三层结构</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Lucene 倒排索引的三层结构</text>
  <rect x="40" y="80" width="220" height="96" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Term Index</text>
  <text x="150" y="134" text-anchor="middle" font-size="12" fill="#5b6b7c">字典树 / FST 前缀</text>
  <text x="150" y="156" text-anchor="middle" font-size="12" fill="#5b6b7c">常驻内存，省空间</text>
  <rect x="330" y="80" width="220" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="440" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Term Dictionary</text>
  <text x="440" y="134" text-anchor="middle" font-size="12" fill="#5b6b7c">全部单词，有序排列</text>
  <text x="440" y="156" text-anchor="middle" font-size="12" fill="#5b6b7c">块内二分查找</text>
  <rect x="620" y="80" width="220" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="730" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Posting List</text>
  <text x="730" y="134" text-anchor="middle" font-size="12" fill="#5b6b7c">文档 ID 列表</text>
  <text x="730" y="156" text-anchor="middle" font-size="12" fill="#5b6b7c">FOR 压缩 / 位图</text>
  <text x="295" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">前缀定位块</text>
  <line x1="262" y1="132" x2="324" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="585" y="118" text-anchor="middle" font-size="11" fill="#5b6b7c">精确定位</text>
  <line x1="552" y1="132" x2="614" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="200" width="800" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="226" font-size="12" fill="#5b6b7c">Term Index 只存前缀，不必把所有单词放进内存；Term Dictionary 有序，可在块内二分查找。</text>
  <text x="60" y="252" font-size="12" fill="#5b6b7c">Posting List 是文档 ID 数组：磁盘上用 FOR 压缩，内存中用 Roaring Bitmaps 快速求交并集。</text>
</svg>
