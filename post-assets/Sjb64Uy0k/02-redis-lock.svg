<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Redis 分布式锁：单节点实现与 RedLock 多数派</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Redis 分布式锁：单节点实现与 RedLock 多数派</text>

  <rect x="30" y="52" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">单节点：SET NX PX + Lua 解锁</text>
  <rect x="50" y="94" width="360" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="119" text-anchor="middle" font-size="12" fill="#1f2b38">SET lock_key token NX PX 30000</text>
  <line x1="230" y1="134" x2="230" y2="152" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="240" y="148" font-size="11" fill="#2e9e5b">返回 OK</text>
  <rect x="50" y="156" width="360" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="230" y="181" text-anchor="middle" font-size="12" fill="#1f2b38">加锁成功，执行业务逻辑</text>
  <line x1="230" y1="196" x2="230" y2="214" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="50" y="218" width="360" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="230" y="243" text-anchor="middle" font-size="12" fill="#1f2b38">看门狗按 TTL/3 自动续期</text>
  <line x1="230" y1="258" x2="230" y2="276" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="50" y="280" width="360" height="40" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="305" text-anchor="middle" font-size="12" fill="#1f2b38">Lua：GET 比对 token，相等才 DEL</text>
  <text x="230" y="340" text-anchor="middle" font-size="11" fill="#5b6b7c">返回 nil 即加锁失败：重试或等待</text>

  <rect x="470" y="52" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5bd0">RedLock：N 个独立节点多数派</text>
  <rect x="590" y="94" width="160" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="670" y="116" text-anchor="middle" font-size="12" fill="#1f2b38">客户端</text>
  <line x1="670" y1="128" x2="522" y2="164" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="128" x2="596" y2="164" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="128" x2="670" y2="164" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="128" x2="744" y2="164" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="670" y1="128" x2="818" y2="164" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="490" y="170" width="64" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="522" y="195" text-anchor="middle" font-size="12" fill="#1f2b38">R1</text>
  <rect x="564" y="170" width="64" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="596" y="195" text-anchor="middle" font-size="12" fill="#1f2b38">R2</text>
  <rect x="638" y="170" width="64" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="195" text-anchor="middle" font-size="12" fill="#1f2b38">R3</text>
  <rect x="712" y="170" width="64" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="744" y="195" text-anchor="middle" font-size="12" fill="#1f2b38">R4</text>
  <rect x="786" y="170" width="64" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="818" y="195" text-anchor="middle" font-size="12" fill="#1f2b38">R5</text>
  <text x="522" y="230" text-anchor="middle" font-size="11" fill="#2e9e5b">成功</text>
  <text x="596" y="230" text-anchor="middle" font-size="11" fill="#2e9e5b">成功</text>
  <text x="670" y="230" text-anchor="middle" font-size="11" fill="#2e9e5b">成功</text>
  <text x="744" y="230" text-anchor="middle" font-size="11" fill="#e08a1e">失败</text>
  <text x="818" y="230" text-anchor="middle" font-size="11" fill="#e08a1e">失败</text>
  <rect x="530" y="248" width="280" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="270" text-anchor="middle" font-size="11" fill="#1f2b38">成功节点数 ≥ N/2+1（多数派）</text>
  <text x="670" y="288" text-anchor="middle" font-size="11" fill="#1f2b38">且加锁总耗时 &lt; TTL → 加锁成功</text>
  <text x="670" y="336" text-anchor="middle" font-size="11" fill="#5b6b7c">N 个节点必须相互独立，不能用主从</text>
</svg>
