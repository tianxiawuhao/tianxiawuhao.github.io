<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>缓存雪崩、缓存击穿、缓存穿透对比与应对</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">缓存雪崩、缓存击穿、缓存穿透对比与应对</text>

  <rect x="30" y="58" width="260" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">缓存雪崩</text>
  <rect x="30" y="102" width="260" height="214" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="128" font-size="12" fill="#1f2b38">现象：大量 key 同时失效</text>
  <text x="44" y="154" font-size="12" fill="#1f2b38">或 Redis 实例整体宕机</text>
  <text x="44" y="180" font-size="12" fill="#1f2b38">结果：请求涌向数据库</text>
  <line x1="42" y1="197" x2="278" y2="197" stroke="#c8d3e0" stroke-width="1"/>
  <text x="44" y="219" font-size="12" font-weight="700" fill="#e08a1e">对策</text>
  <text x="44" y="244" font-size="12" fill="#5b6b7c">1 过期时间加随机抖动</text>
  <text x="44" y="270" font-size="12" fill="#5b6b7c">2 互斥锁排队回源</text>
  <text x="44" y="296" font-size="12" fill="#5b6b7c">3 多级缓存 + 熔断降级</text>

  <rect x="320" y="58" width="260" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">缓存击穿</text>
  <rect x="320" y="102" width="260" height="214" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="334" y="128" font-size="12" fill="#1f2b38">现象：单个热点 key 过期</text>
  <text x="334" y="154" font-size="12" fill="#1f2b38">并发同查这一条数据</text>
  <text x="334" y="180" font-size="12" fill="#1f2b38">结果：数据库压力激增</text>
  <line x1="332" y1="197" x2="568" y2="197" stroke="#c8d3e0" stroke-width="1"/>
  <text x="334" y="219" font-size="12" font-weight="700" fill="#e08a1e">对策</text>
  <text x="334" y="244" font-size="12" fill="#5b6b7c">1 热点 key 逻辑过期</text>
  <text x="334" y="270" font-size="12" fill="#5b6b7c">2 互斥锁，只放一个线程回源</text>
  <text x="334" y="296" font-size="12" fill="#5b6b7c">3 后台异步刷新缓存</text>

  <rect x="610" y="58" width="260" height="36" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="740" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5bd0">缓存穿透</text>
  <rect x="610" y="102" width="260" height="214" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="624" y="128" font-size="12" fill="#1f2b38">现象：缓存和数据库都无此数据</text>
  <text x="624" y="154" font-size="12" fill="#1f2b38">结果：每次请求都查数据库</text>
  <text x="624" y="180" font-size="12" fill="#1f2b38">常见于非法 id 或恶意攻击</text>
  <line x1="622" y1="197" x2="858" y2="197" stroke="#c8d3e0" stroke-width="1"/>
  <text x="624" y="219" font-size="12" font-weight="700" fill="#e08a1e">对策</text>
  <text x="624" y="244" font-size="12" fill="#5b6b7c">1 参数校验，拦截非法 id</text>
  <text x="624" y="270" font-size="12" fill="#5b6b7c">2 缓存空值（短 TTL，如 30s）</text>
  <text x="624" y="296" font-size="12" fill="#5b6b7c">3 布隆过滤器前置过滤</text>

  <text x="450" y="333" text-anchor="middle" font-size="11" fill="#5b6b7c">三者的共同后果都是压力转移到数据库，区别在失效范围，以及数据本身是否存在</text>
</svg>
