<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>FastDFS 三角色架构与上传访问链路</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">FastDFS 三角色架构与上传访问链路</text>

  <rect x="40" y="150" width="180" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="185" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Client 客户端</text>
  <text x="130" y="210" font-size="11" fill="#5b6b7c" text-anchor="middle">项目部署的服务器</text>
  <text x="130" y="232" font-size="11" fill="#5b6b7c" text-anchor="middle">只需配置 Tracker 地址</text>

  <rect x="330" y="120" width="200" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="430" y="152" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Tracker Server</text>
  <text x="430" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">跟踪服务器 · 调度与负载均衡</text>
  <text x="430" y="198" font-size="11" fill="#5b6b7c" text-anchor="middle">默认端口 22122</text>

  <rect x="650" y="120" width="210" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="755" y="152" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">Storage Server</text>
  <text x="755" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">存储服务器，以 group 为单位</text>
  <text x="755" y="198" font-size="11" fill="#5b6b7c" text-anchor="middle">默认端口 23000</text>

  <line x1="224" y1="175" x2="324" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="274" y="163" font-size="11" fill="#5b6b7c" text-anchor="middle">① 上传/下载请求</text>
  <line x1="532" y1="175" x2="644" y2="175" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="588" y="163" font-size="11" fill="#5b6b7c" text-anchor="middle">② 分配 Storage</text>
  <line x1="755" y1="222" x2="755" y2="274" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="742" y="253" font-size="11" fill="#5b6b7c" text-anchor="end">③ 写入 store_path0</text>

  <rect x="650" y="280" width="210" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="755" y="307" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">group1</text>
  <text x="755" y="329" font-size="11" fill="#5b6b7c" text-anchor="middle">多台 Storage 互为备份</text>

  <path d="M 650 315 L 200 315 L 200 274" fill="none" stroke="#7a5bd0" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="340" y="306" font-size="11" fill="#7a5bd0" text-anchor="middle">④ 返回 group1/M00/… 路径，或按路径读取文件</text>

  <text x="450" y="395" font-size="11" fill="#5b6b7c" text-anchor="middle">浏览器访问 http://服务器IP:8888/group1/M00/00/00/xxx.jpg 时，由 Nginx 的 fastdfs-nginx-module 直接读取本地文件</text>
</svg>
