<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四个部署组件的配置文件、关键参数与端口对照</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">四个部署组件的配置文件、关键参数与端口</text>

  <rect x="40" y="60" width="820" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="85" font-size="12" font-weight="700" fill="#1f2b38">组件</text>
  <text x="226" y="85" font-size="12" font-weight="700" fill="#1f2b38">配置文件</text>
  <text x="466" y="85" font-size="12" font-weight="700" fill="#1f2b38">关键配置项</text>
  <text x="740" y="85" font-size="12" font-weight="700" fill="#1f2b38">端口</text>

  <rect x="40" y="120" width="820" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="150" font-size="13" font-weight="700" fill="#1f2b38">Tracker Server</text>
  <text x="226" y="150" font-size="11" fill="#1f2b38">/etc/fdfs/tracker.conf</text>
  <text x="466" y="140" font-size="11" fill="#5b6b7c">port=22122</text>
  <text x="466" y="158" font-size="11" fill="#5b6b7c">base_path=/data/fastdfs</text>
  <text x="740" y="150" font-size="13" font-weight="700" fill="#e08a1e">22122</text>

  <rect x="40" y="190" width="820" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="220" font-size="13" font-weight="700" fill="#1f2b38">Storage Server</text>
  <text x="226" y="220" font-size="11" fill="#1f2b38">/etc/fdfs/storage.conf</text>
  <text x="466" y="210" font-size="11" fill="#5b6b7c">store_path0=/data/fastdfs</text>
  <text x="466" y="228" font-size="11" fill="#5b6b7c">tracker_server=IP:22122</text>
  <text x="740" y="220" font-size="13" font-weight="700" fill="#e08a1e">23000</text>

  <rect x="40" y="260" width="820" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="290" font-size="13" font-weight="700" fill="#1f2b38">Client 工具</text>
  <text x="226" y="290" font-size="11" fill="#1f2b38">/etc/fdfs/client.conf</text>
  <text x="466" y="280" font-size="11" fill="#5b6b7c">base_path=/data/fastdfs</text>
  <text x="466" y="298" font-size="11" fill="#5b6b7c">tracker_server=IP:22122</text>
  <text x="740" y="290" font-size="13" font-weight="700" fill="#e08a1e">无需监听</text>

  <rect x="40" y="330" width="820" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="56" y="360" font-size="13" font-weight="700" fill="#1f2b38">Nginx</text>
  <text x="226" y="350" font-size="11" fill="#1f2b38">/etc/fdfs/mod_fastdfs.conf</text>
  <text x="226" y="368" font-size="11" fill="#1f2b38">加上 nginx.conf</text>
  <text x="466" y="350" font-size="11" fill="#5b6b7c">group_name=group1</text>
  <text x="466" y="368" font-size="11" fill="#5b6b7c">url_have_group_name=true</text>
  <text x="740" y="360" font-size="13" font-weight="700" fill="#e08a1e">8888</text>

  <text x="450" y="405" font-size="11" fill="#5b6b7c" text-anchor="middle">四个配置文件都在 /etc/fdfs 下；Nginx 的 listen 端口必须与 storage.conf 的 http.server_port 保持一致</text>
</svg>
