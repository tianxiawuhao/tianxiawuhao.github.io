<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">多核 CPU 的缓存层次与典型访问耗时</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<rect x="40" y="120" width="130" height="76" rx="8" fill="#f7f9fc" stroke="#5b6b7c"/>
<text x="105" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">CPU Core</text>
<text x="105" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">寄存器 / 执行单元</text>
<rect x="200" y="120" width="130" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="265" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">L1 Cache</text>
<text x="265" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">核心私有</text>
<text x="265" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="#e08a1e">约 1 ns</text>
<rect x="360" y="120" width="130" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="425" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">L2 Cache</text>
<text x="425" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">核心私有</text>
<text x="425" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="#e08a1e">约 4 ns</text>
<rect x="520" y="120" width="130" height="76" rx="8" fill="#f7f9fc" stroke="#5b6b7c"/>
<text x="585" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">L3 Cache</text>
<text x="585" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">插槽内共享</text>
<text x="585" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="#e08a1e">约 13 ns</text>
<rect x="680" y="120" width="180" height="76" rx="8" fill="#f7f9fc" stroke="#5b6b7c"/>
<text x="770" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">主存 DRAM</text>
<text x="770" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">所有 CPU 共享</text>
<text x="770" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="#e08a1e">约 100 ns</text>
<line x1="170" y1="158" x2="196" y2="158" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="330" y1="158" x2="356" y2="158" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="490" y1="158" x2="516" y2="158" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="650" y1="158" x2="676" y2="158" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="437" y1="240" x2="105" y2="240" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="437" y1="240" x2="770" y2="240" stroke="#5b6b7c" marker-end="url(#a)"/>
<text x="437" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#2f6fd0">越往右：容量更大、速度更慢</text>
<text x="40" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">CPU 与主存之间有多级缓存：L1/L2 为每个核心私有，L3 由同一插槽上的所有核心共享，主存由所有 CPU 共享。</text>
<text x="40" y="328" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">缓存以缓存行（cache line，常见 64 字节）为单位加载数据：命中 L1 最快，未命中则逐级向下查找。</text>
<text x="40" y="356" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">图中耗时是业界常引用的近似量级（Martin Thompson 相关分享），只用于比较数量级，不同硬件差异很大。</text>
</svg>
