<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="450" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java 线程的 6 种状态与转换</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<rect x="40" y="90" width="120" height="56" rx="8" fill="#f7f9fc" stroke="#5b6b7c"/>
<text x="100" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">NEW</text>
<text x="100" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">尚未启动</text>
<rect x="250" y="90" width="160" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="330" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">RUNNABLE</text>
<text x="330" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">就绪或运行中</text>
<rect x="690" y="90" width="170" height="56" rx="8" fill="#ffffff" stroke="#1f2b38"/>
<text x="775" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">TERMINATED</text>
<text x="775" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">线程已结束</text>
<line x1="160" y1="118" x2="244" y2="118" stroke="#5b6b7c" marker-end="url(#a)"/>
<text x="205" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">start()</text>
<line x1="410" y1="118" x2="684" y2="118" stroke="#5b6b7c" marker-end="url(#a)"/>
<text x="548" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b7c">run() 正常结束或抛出未捕获异常</text>
<rect x="40" y="250" width="170" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="125" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">BLOCKED</text>
<text x="125" y="296" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">等待 monitor 锁</text>
<rect x="310" y="250" width="170" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="395" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">WAITING</text>
<text x="395" y="296" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">wait() / join() / park()</text>
<rect x="580" y="250" width="220" height="56" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
<text x="690" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">TIMED_WAITING</text>
<text x="690" y="296" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">sleep(ms) / wait(ms) / join(ms)</text>
<line x1="265" y1="146" x2="100" y2="246" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="140" y1="250" x2="295" y2="150" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="325" y1="146" x2="410" y2="246" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="450" y1="250" x2="355" y2="150" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="385" y1="146" x2="650" y2="246" stroke="#5b6b7c" marker-end="url(#a)"/>
<line x1="700" y1="250" x2="408" y2="150" stroke="#5b6b7c" marker-end="url(#a)"/>
<text x="40" y="360" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">NEW：只创建了 Thread 对象，还没有启动线程；直接调用 run() 只是普通方法调用，必须调用 start() 才会真正启动新线程。</text>
<text x="40" y="388" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">成对的双向箭头表示状态可以来回转换：线程进入等待或阻塞，被唤醒、拿到锁或超时后再回到 RUNNABLE。</text>
<text x="40" y="416" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">BLOCKED 等的是 synchronized 的 monitor 锁；WAITING 与 TIMED_WAITING 则由 wait、join、park、sleep 等方法引起。</text>
<text x="40" y="440" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">TERMINATED 是终点：线程一旦结束，就不能再次 start()。</text>
</svg>
