<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="510" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">sleep() 与 wait() 的关键区别</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<rect x="40" y="70" width="170" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="125" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">对比项</text>
<rect x="210" y="70" width="310" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="365" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Thread.sleep(long)</text>
<rect x="520" y="70" width="340" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="690" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Object.wait()</text>
<rect x="40" y="114" width="170" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<rect x="210" y="114" width="310" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<rect x="520" y="114" width="340" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="125" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">所属</text>
<text x="365" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">Thread 的静态方法</text>
<text x="690" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">Object 的实例方法</text>
<rect x="40" y="166" width="170" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="210" y="166" width="310" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="520" y="166" width="340" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="125" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">是否需要持锁</text>
<text x="365" y="201" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">不需要，任何地方都能调用</text>
<text x="690" y="193" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">必须在 synchronized 中调用</text>
<text x="690" y="212" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">否则抛 IllegalMonitorStateException</text>
<rect x="40" y="228" width="170" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<rect x="210" y="228" width="310" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<rect x="520" y="228" width="340" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="125" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">是否释放锁</text>
<text x="365" y="258" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">不释放，锁仍被当前线程持有</text>
<text x="690" y="258" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">释放当前持有的 monitor 锁</text>
<rect x="40" y="280" width="170" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="210" y="280" width="310" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="520" y="280" width="340" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="125" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">如何被唤醒</text>
<text x="365" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">到时间自动返回</text>
<text x="690" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">需要 notify()/notifyAll() 唤醒</text>
<rect x="40" y="332" width="170" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<rect x="210" y="332" width="310" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<rect x="520" y="332" width="340" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
<text x="125" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">中断响应</text>
<text x="365" y="362" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">抛 InterruptedException</text>
<text x="690" y="362" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">抛 InterruptedException 并先释放锁</text>
<rect x="40" y="384" width="170" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="210" y="384" width="310" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<rect x="520" y="384" width="340" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="125" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">典型用途</text>
<text x="365" y="414" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">让出 CPU 一段时间</text>
<text x="690" y="414" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2b38">线程间协作，等待条件成立</text>
<text x="40" y="470" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">两者都会响应中断并抛出 InterruptedException：捕获后应恢复中断标记或向上抛出，不要吞掉异常。</text>
<text x="40" y="496" text-anchor="start" font-size="12" font-weight="400" fill="#5b6b7c">wait() 必须放在 while 循环里判断条件后再调用，以应对虚假唤醒（spurious wakeup）。</text>
</svg>
