<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>TCP 三次握手与四次挥手时序图</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">TCP 建立连接的三次握手与释放连接的四次挥手</text>

  <rect x="40" y="48" width="400" height="284" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="72" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">① 三次握手：建立连接</text>
  <rect x="98" y="84" width="64" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="104" font-size="11" fill="#1f2b38" text-anchor="middle">客户端</text>
  <rect x="318" y="84" width="64" height="30" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="350" y="104" font-size="11" fill="#1f2b38" text-anchor="middle">服务端</text>
  <line x1="130" y1="114" x2="130" y2="240" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="350" y1="114" x2="350" y2="240" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="130" y1="134" x2="350" y2="134" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="240" y="128" font-size="11" fill="#2f6fd0" text-anchor="middle">SYN=1, seq=x</text>
  <line x1="350" y1="180" x2="130" y2="180" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="240" y="174" font-size="11" fill="#2e9e5b" text-anchor="middle">SYN=1, ACK=1, seq=y, ack=x+1</text>
  <line x1="130" y1="226" x2="350" y2="226" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="240" y="220" font-size="11" fill="#2f6fd0" text-anchor="middle">ACK=1, seq=x+1, ack=y+1</text>
  <text x="56" y="268" font-size="11" fill="#5b6b7c">为什么不能只握手两次：网络中可能滞留一个早已失效</text>
  <text x="56" y="284" font-size="11" fill="#5b6b7c">的连接请求，两次握手会让服务端直接建立连接并等待数据；</text>
  <text x="56" y="300" font-size="11" fill="#5b6b7c">有了第三次握手，客户端会忽略这个旧请求，连接不会建立。</text>

  <rect x="470" y="48" width="390" height="284" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="665" y="72" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">② 四次挥手：全双工需双向关闭</text>
  <rect x="528" y="84" width="64" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="560" y="104" font-size="11" fill="#1f2b38" text-anchor="middle">客户端</text>
  <rect x="748" y="84" width="64" height="30" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="780" y="104" font-size="11" fill="#1f2b38" text-anchor="middle">服务端</text>
  <line x1="560" y1="114" x2="560" y2="256" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="780" y1="114" x2="780" y2="256" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="560" y1="134" x2="780" y2="134" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="670" y="128" font-size="11" fill="#2f6fd0" text-anchor="middle">FIN=1, seq=u</text>
  <line x1="780" y1="172" x2="560" y2="172" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="670" y="166" font-size="11" fill="#2e9e5b" text-anchor="middle">ACK=1, ack=u+1（半关闭，仍可发数据）</text>
  <line x1="780" y1="210" x2="560" y2="210" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="670" y="204" font-size="11" fill="#2e9e5b" text-anchor="middle">FIN=1, seq=w</text>
  <line x1="560" y1="248" x2="780" y2="248" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="670" y="242" font-size="11" fill="#2f6fd0" text-anchor="middle">ACK=1, ack=w+1</text>
  <text x="486" y="282" font-size="11" fill="#5b6b7c">客户端进入 TIME-WAIT 等待 2MSL：一是保证最后一个</text>
  <text x="486" y="298" font-size="11" fill="#5b6b7c">确认能到达（否则服务端重发 FIN），二是让本次连接</text>
  <text x="486" y="314" font-size="11" fill="#5b6b7c">产生的旧报文在网络中消失，不影响下一个新连接。</text>
</svg>
