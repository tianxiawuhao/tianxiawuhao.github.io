<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>网络五层模型与逐层封装：一个请求从应用到物理层</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">网络五层模型与逐层封装：一个请求从应用到物理层</text>
  <text x="40" y="52" font-size="12" font-weight="700" fill="#1f2b38">自上而下的五层分工</text>
  <text x="470" y="52" font-size="12" font-weight="700" fill="#1f2b38">封装：每下一层加一个首部</text>

  <rect x="40" y="64" width="380" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="58" y="90" font-size="13" font-weight="700" fill="#1f2b38">应用层</text>
  <text x="142" y="90" font-size="11" fill="#5b6b7c">报文</text>
  <text x="402" y="90" font-size="11" fill="#5b6b7c" text-anchor="end">HTTP · DNS · SMTP</text>

  <rect x="40" y="116" width="380" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="58" y="142" font-size="13" font-weight="700" fill="#1f2b38">传输层</text>
  <text x="142" y="142" font-size="11" fill="#5b6b7c">数据段</text>
  <text x="402" y="142" font-size="11" fill="#5b6b7c" text-anchor="end">TCP · UDP（进程到进程）</text>

  <rect x="40" y="168" width="380" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="58" y="194" font-size="13" font-weight="700" fill="#1f2b38">网络层</text>
  <text x="142" y="194" font-size="11" fill="#5b6b7c">分组</text>
  <text x="402" y="194" font-size="11" fill="#5b6b7c" text-anchor="end">IP · ICMP（主机到主机）</text>

  <rect x="40" y="220" width="380" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="58" y="246" font-size="13" font-weight="700" fill="#1f2b38">数据链路层</text>
  <text x="142" y="246" font-size="11" fill="#5b6b7c">帧</text>
  <text x="402" y="246" font-size="11" fill="#5b6b7c" text-anchor="end">以太网 · ARP（同一链路）</text>

  <rect x="40" y="272" width="380" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="58" y="298" font-size="13" font-weight="700" fill="#1f2b38">物理层</text>
  <text x="142" y="298" font-size="11" fill="#5b6b7c">比特</text>
  <text x="402" y="298" font-size="11" fill="#5b6b7c" text-anchor="end">电信号 · 光信号</text>

  <line x1="452" y1="66" x2="452" y2="272" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="470" y="64" width="130" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="535" y="86" font-size="11" fill="#1f2b38" text-anchor="middle">HTTP 报文</text>

  <rect x="470" y="106" width="70" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="505" y="128" font-size="11" fill="#1f2b38" text-anchor="middle">TCP 首部</text>
  <rect x="540" y="106" width="130" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="605" y="128" font-size="11" fill="#1f2b38" text-anchor="middle">HTTP 报文</text>

  <rect x="470" y="148" width="70" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="505" y="170" font-size="11" fill="#1f2b38" text-anchor="middle">IP 首部</text>
  <rect x="540" y="148" width="70" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="575" y="170" font-size="11" fill="#1f2b38" text-anchor="middle">TCP 首部</text>
  <rect x="610" y="148" width="130" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="675" y="170" font-size="11" fill="#1f2b38" text-anchor="middle">HTTP 报文</text>

  <rect x="470" y="190" width="70" height="34" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="505" y="212" font-size="11" fill="#1f2b38" text-anchor="middle">帧首部</text>
  <rect x="540" y="190" width="70" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="575" y="212" font-size="11" fill="#1f2b38" text-anchor="middle">IP 首部</text>
  <rect x="610" y="190" width="70" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="645" y="212" font-size="11" fill="#1f2b38" text-anchor="middle">TCP 首部</text>
  <rect x="680" y="190" width="130" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="745" y="212" font-size="11" fill="#1f2b38" text-anchor="middle">HTTP 报文</text>
  <rect x="810" y="190" width="40" height="34" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="830" y="212" font-size="11" fill="#1f2b38" text-anchor="middle">帧尾</text>

  <rect x="470" y="232" width="380" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="254" font-size="11" fill="#1f2b38" text-anchor="middle">010110… 比特流（电信号 / 光信号）</text>

  <rect x="470" y="286" width="380" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="486" y="308" font-size="11" fill="#1f2b38">向下逐层加首部（封装），向上逐层拆首部（解封）</text>
  <text x="486" y="324" font-size="11" fill="#1f2b38">路由器只要下三层：网络层、链路层、物理层</text>
  <text x="486" y="340" font-size="11" fill="#1f2b38">所以「ping 通但服务访问不了」多在传输层以上</text>
</svg>
