<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ExecutorCompletionService 结构图</text>
  <text x="450" y="57" text-anchor="middle" font-size="12" fill="#5b6b7c">submit 包装任务，任务结束时 done() 入队，take / poll 按完成顺序取出结果</text>

  <rect x="40" y="74" width="370" height="546" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="58" y="100" font-size="14" font-weight="700" fill="#1f2b38">任务提交与入队</text>

  <rect x="66" y="112" width="318" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="225" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">调用方 submit(Callable)</text>
  <text x="225" y="149" text-anchor="middle" font-size="11.5" fill="#5b6b7c">返回 Future 交给调用方保存</text>
  <line x1="225" y1="158" x2="225" y2="188" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="66" y="192" width="318" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="225" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">newTaskFor(task) → RunnableFuture</text>
  <text x="225" y="231" text-anchor="middle" font-size="11.5" fill="#5b6b7c">executor.execute(new QueueingFuture(f, queue))</text>
  <text x="225" y="247" text-anchor="middle" font-size="11.5" fill="#5b6b7c">交给线程池执行，返回给调用方的是 f</text>
  <line x1="225" y1="252" x2="225" y2="282" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="66" y="286" width="318" height="74" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="225" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">QueueingFuture extends FutureTask</text>
  <text x="225" y="325" text-anchor="middle" font-size="11.5" fill="#5b6b7c">super(task, null)</text>
  <text x="225" y="343" text-anchor="middle" font-size="11.5" fill="#5b6b7c">重写 done() { completionQueue.add(task) }</text>

  <rect x="80" y="376" width="290" height="88" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="225" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">线程池执行 run()</text>
  <text x="225" y="415" text-anchor="middle" font-size="11.5" fill="#5b6b7c">正常结束 → set(result)</text>
  <text x="225" y="433" text-anchor="middle" font-size="11.5" fill="#5b6b7c">抛出异常 → setException(ex)</text>
  <text x="225" y="451" text-anchor="middle" font-size="11.5" fill="#5b6b7c">两条路径都会触发 finishCompletion()</text>
  <line x1="225" y1="464" x2="225" y2="494" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="80" y="498" width="290" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="225" y="518" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">finishCompletion() → done()</text>
  <text x="225" y="537" text-anchor="middle" font-size="11.5" fill="#5b6b7c">唤醒阻塞在 get() 的线程</text>
  <text x="225" y="555" text-anchor="middle" font-size="11.5" fill="#5b6b7c">把已完成任务的 Future 放入队列</text>

  <rect x="445" y="74" width="415" height="546" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="463" y="100" font-size="14" font-weight="700" fill="#1f2b38">完成队列与结果取出</text>

  <rect x="470" y="112" width="365" height="158" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="652" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">completionQueue : BlockingQueue</text>
  <text x="652" y="150" text-anchor="middle" font-size="11.5" fill="#5b6b7c">默认 LinkedBlockingQueue（无界）</text>
  <rect x="486" y="160" width="333" height="30" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="652" y="180" text-anchor="middle" font-size="11.5" fill="#1f2b38">head → 研发 Future（3s，最先完成）</text>
  <rect x="486" y="196" width="333" height="30" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="652" y="216" text-anchor="middle" font-size="11.5" fill="#1f2b38">中层管理 Future（6s）</text>
  <rect x="486" y="232" width="333" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="652" y="252" text-anchor="middle" font-size="11.5" fill="#1f2b38">总裁 Future（10s，最后完成）</text>

  <rect x="470" y="286" width="365" height="176" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="488" y="306" font-size="12.5" font-weight="700" fill="#1f2b38">取结果 API 语义对比</text>
  <text x="488" y="328" font-size="11.5" fill="#2e9e5b">take()</text>
  <text x="560" y="328" font-size="11.5" fill="#1f2b38">阻塞等待，队列空时挂起线程</text>
  <text x="488" y="352" font-size="11.5" fill="#2e9e5b">poll()</text>
  <text x="560" y="352" font-size="11.5" fill="#1f2b38">立即返回，空队列返回 null</text>
  <text x="488" y="376" font-size="11.5" fill="#2e9e5b">poll(t, unit)</text>
  <text x="560" y="376" font-size="11.5" fill="#1f2b38">限时等待，超时返回 null</text>
  <text x="488" y="400" font-size="11.5" fill="#2f6fd0">返回的 Future 就是原任务对象</text>
  <text x="488" y="422" font-size="11.5" fill="#2f6fd0">取到以后仍需 get() 才能拿到值</text>
  <text x="488" y="444" font-size="11.5" fill="#e08a1e">失败的任务同样入队，get() 抛异常</text>

  <rect x="470" y="474" width="365" height="130" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="488" y="494" font-size="12.5" font-weight="700" fill="#1f2b38">两条使用注意</text>
  <text x="488" y="516" font-size="11.5" fill="#1f2b38">1. 提交几次就取几次，否则队列堆积 → OOM</text>
  <text x="488" y="538" font-size="11.5" fill="#1f2b38">2. 只想 get() 不 take()，结果永远留在队列里</text>
  <text x="488" y="564" font-size="11.5" fill="#5b6b7c">对比：invokeAll 等全部完成且按提交顺序；</text>
  <text x="488" y="584" font-size="11.5" fill="#5b6b7c">invokeAny / anyOf 只要最快的一个结果</text>
</svg>
