<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Git 四个区域与常用命令的数据流向</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Git 四个区域：文件怎么从工作区走到远程仓库</text>

  <rect x="40" y="60" width="180" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="88" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">工作区</text>
  <text x="130" y="110" font-size="11" fill="#1f2b38" text-anchor="middle">Working Directory</text>
  <text x="130" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">你正在编辑的文件</text>

  <line x1="224" y1="100" x2="296" y2="100" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="260" y="90" font-size="11" fill="#5b6b7c" text-anchor="middle">git add</text>

  <rect x="300" y="60" width="180" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="390" y="88" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">暂存区</text>
  <text x="390" y="110" font-size="11" fill="#1f2b38" text-anchor="middle">Staging Area（Index）</text>
  <text x="390" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">下一次提交的清单</text>

  <line x1="484" y1="100" x2="556" y2="100" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="520" y="90" font-size="11" fill="#5b6b7c" text-anchor="middle">git commit</text>

  <rect x="560" y="60" width="180" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="650" y="88" font-size="13" fill="#2e9e5b" text-anchor="middle" font-weight="700">本地仓库</text>
  <text x="650" y="110" font-size="11" fill="#1f2b38" text-anchor="middle">Local Repository</text>
  <text x="650" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">.git 目录里的完整历史</text>

  <line x1="744" y1="100" x2="816" y2="100" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="780" y="90" font-size="11" fill="#5b6b7c" text-anchor="middle">git push</text>

  <rect x="680" y="176" width="180" height="70" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="770" y="202" font-size="13" fill="#2f6fd0" text-anchor="middle" font-weight="700">远程仓库</text>
  <text x="770" y="222" font-size="11" fill="#1f2b38" text-anchor="middle">origin（GitHub / GitLab）</text>
  <text x="770" y="238" font-size="11" fill="#5b6b7c" text-anchor="middle">团队共享的唯一副本</text>

  <path d="M 680 211 L 200 211 L 200 148" fill="none" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="430" y="203" font-size="11" fill="#5b6b7c" text-anchor="middle">git pull / fetch：把远程更新取回工作区</text>

  <rect x="40" y="272" width="400" height="128" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="296" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">关键认知一：本地就能提交</text>
  <text x="60" y="320" font-size="11.5" fill="#5b6b7c" text-anchor="start">SVN 的提交必须联网写中央仓库；Git 的 commit 只写本地 .git，</text>
  <text x="60" y="340" font-size="11.5" fill="#5b6b7c" text-anchor="start">push 才是同步给团队。所以断网也能提交、能看历史、能建分支。</text>
  <text x="60" y="366" font-size="11.5" fill="#5b6b7c" text-anchor="start">每个克隆都是完整仓库，这正是「分布式」的含义。</text>
  <text x="60" y="388" font-size="11.5" fill="#e08a1e" text-anchor="start">注意：还没 push 的提交属于「本地历史」，可以放心改。</text>

  <rect x="460" y="272" width="400" height="128" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="296" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">关键认知二：暂存区是「挑选」的地方</text>
  <text x="480" y="320" font-size="11.5" fill="#5b6b7c" text-anchor="start">git add 决定「这次提交包含哪些改动」，与文件保存无关。</text>
  <text x="480" y="340" font-size="11.5" fill="#5b6b7c" text-anchor="start">两个不相关的修改混在一起时，可以用 git add 分开两次提交，</text>
  <text x="480" y="366" font-size="11.5" fill="#5b6b7c" text-anchor="start">历史才读得懂、才容易回滚。</text>
  <text x="480" y="388" font-size="11.5" fill="#e08a1e" text-anchor="start">git diff 看工作区 vs 暂存区，git diff --cached 看暂存区 vs 上次提交。</text>
</svg>
