<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Git 撤销决策树：改错了、提交错了、推错了分别怎么办</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">Git 撤销决策树：先问「推没推出去」</text>

  <rect x="330" y="50" width="240" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="450" y="78" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">改动现在在哪一步？</text>

  <line x1="360" y1="94" x2="160" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="94" x2="450" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="540" y1="94" x2="740" y2="126" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="130" width="200" height="36" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="160" y="153" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">还没 add（工作区）</text>
  <rect x="350" y="130" width="200" height="36" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="153" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">已 add，未 commit</text>
  <rect x="640" y="130" width="200" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="740" y="153" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">已 commit</text>

  <line x1="160" y1="166" x2="160" y2="192" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="166" x2="450" y2="192" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="740" y1="166" x2="740" y2="192" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="196" width="240" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="220" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">git checkout -- file</text>
  <text x="60" y="242" font-size="11" fill="#5b6b7c" text-anchor="start">丢弃单个文件的工作区修改</text>
  <text x="60" y="262" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">git restore file</text>
  <text x="60" y="278" font-size="11" fill="#5b6b7c" text-anchor="start">Git 2.23+ 的新写法，更直观</text>

  <rect x="330" y="196" width="240" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="350" y="220" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">git reset HEAD file</text>
  <text x="350" y="242" font-size="11" fill="#5b6b7c" text-anchor="start">把文件移出暂存区，改动还在</text>
  <text x="350" y="262" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">git restore --staged file</text>
  <text x="350" y="278" font-size="11" fill="#5b6b7c" text-anchor="start">只想撤销 git add 时用这条</text>

  <rect x="620" y="196" width="240" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="640" y="220" font-size="12" fill="#2f6fd0" text-anchor="start" font-weight="700">git commit --amend</text>
  <text x="640" y="242" font-size="11" fill="#5b6b7c" text-anchor="start">改最近一次提交的信息或内容</text>
  <text x="640" y="262" font-size="11" fill="#5b6b7c" text-anchor="start">只适用于「还没 push」的提交</text>

  <rect x="620" y="300" width="240" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="740" y="323" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">这次提交 push 了吗？</text>
  <line x1="740" y1="282" x2="740" y2="300" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="660" y1="336" x2="430" y2="368" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="820" y1="336" x2="820" y2="368" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="530" y="358" font-size="11" fill="#5b6b7c" text-anchor="middle">没 push（本地历史）</text>
  <text x="836" y="358" font-size="11" fill="#5b6b7c" text-anchor="start">已 push</text>

  <rect x="40" y="372" width="380" height="128" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="396" font-size="12.5" fill="#2e9e5b" text-anchor="start" font-weight="700">放心改写历史（已推送则禁做）</text>
  <text x="60" y="420" font-size="11.5" fill="#1f2b38" text-anchor="start">git reset --soft HEAD~1   撤销提交，改动留在暂存区</text>
  <text x="60" y="442" font-size="11.5" fill="#1f2b38" text-anchor="start">git reset --mixed HEAD~1  撤销提交与暂存，改动留在工作区</text>
  <text x="60" y="464" font-size="11.5" fill="#1f2b38" text-anchor="start">git reset --hard HEAD~1   连改动一起丢弃（不可恢复）</text>
  <text x="60" y="488" font-size="11.5" fill="#e08a1e" text-anchor="start">口诀：--soft 留暂存、--mixed 留工作区、--hard 全丢</text>

  <rect x="480" y="372" width="380" height="128" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="500" y="396" font-size="12.5" fill="#e08a1e" text-anchor="start" font-weight="700">只能追加、不能重写</text>
  <text x="500" y="420" font-size="11.5" fill="#1f2b38" text-anchor="start">git revert HEAD</text>
  <text x="500" y="440" font-size="11.5" fill="#5b6b7c" text-anchor="start">生成一个反向提交来抵消原提交，历史仍保留原记录，</text>
  <text x="500" y="458" font-size="11.5" fill="#5b6b7c" text-anchor="start">同事 pull 之后不会出现历史分叉，是团队协作的标准做法。</text>
  <text x="500" y="484" font-size="11.5" fill="#1f2b38" text-anchor="start">场景：上线后发现 bug，需要回退某一版功能</text>
</svg>
