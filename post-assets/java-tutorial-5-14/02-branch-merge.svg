<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Git 分支与合并：指针、分叉与冲突</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">分支只是一枚指针：分叉、并行、合并</text>

  <line x1="80" y1="120" x2="820" y2="120" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="274" y1="120" x2="620" y2="230" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="620" y1="230" x2="646" y2="125" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <circle cx="140" cy="120" r="9" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="140" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">c1</text>
  <circle cx="260" cy="120" r="9" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="260" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">c2</text>
  <circle cx="380" cy="120" r="9" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="380" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">c3</text>
  <circle cx="500" cy="120" r="9" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="500" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">c4</text>
  <circle cx="660" cy="120" r="12" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="2"/>
  <text x="660" y="96" font-size="11" fill="#2e9e5b" text-anchor="middle" font-weight="700">合并提交</text>
  <circle cx="800" cy="120" r="9" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="800" y="100" font-size="11" fill="#5b6b7c" text-anchor="middle">c6</text>

  <circle cx="380" cy="230" r="9" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.6"/>
  <text x="380" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">f1</text>
  <circle cx="500" cy="230" r="9" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.6"/>
  <text x="500" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">f2</text>
  <circle cx="620" cy="230" r="9" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.6"/>
  <text x="620" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">f3</text>

  <rect x="88" y="140" width="120" height="24" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="148" y="156" font-size="11.5" fill="#2f6fd0" text-anchor="middle" font-weight="700">main</text>
  <line x1="148" y1="140" x2="148" y2="130" stroke="#2f6fd0" stroke-width="1.2"/>
  <rect x="668" y="140" width="130" height="24" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="733" y="156" font-size="11.5" fill="#2e9e5b" text-anchor="middle" font-weight="700">main（合并后）</text>
  <line x1="733" y1="140" x2="700" y2="132" stroke="#2e9e5b" stroke-width="1.2"/>

  <rect x="300" y="196" width="150" height="24" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.2"/>
  <text x="375" y="212" font-size="11.5" fill="#e08a1e" text-anchor="middle" font-weight="700">feature/login</text>
  <line x1="375" y1="220" x2="375" y2="230" stroke="#e08a1e" stroke-width="1.2"/>

  <text x="90" y="176" font-size="11.5" fill="#5b6b7c" text-anchor="start">git checkout -b feature/login c2</text>
  <text x="620" y="290" font-size="11.5" fill="#5b6b7c" text-anchor="middle">git checkout main &amp;&amp; git merge feature/login</text>

  <rect x="40" y="300" width="400" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="322" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">分支为什么这么快</text>
  <text x="60" y="344" font-size="11.5" fill="#5b6b7c" text-anchor="start">Git 的分支只是一个指向提交的 41 字节引用文件，不是目录副本；</text>
  <text x="60" y="360" font-size="11.5" fill="#5b6b7c" text-anchor="start">创建与切换几乎零成本——这正是它比 SVN 分支好用的根本原因。</text>

  <rect x="460" y="300" width="400" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="480" y="322" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">什么时候会冲突</text>
  <text x="480" y="344" font-size="11.5" fill="#5b6b7c" text-anchor="start">两条分支改了同一文件的同一区域时，Git 无法自动决定取舍，</text>
  <text x="480" y="360" font-size="11.5" fill="#5b6b7c" text-anchor="start">会停下合并并写入冲突标记，由人工解决后再提交。</text>
</svg>
