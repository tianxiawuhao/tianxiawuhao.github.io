<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>增量聚合函数与全窗口函数对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">增量聚合函数 vs 全窗口函数</text>
  <rect x="40" y="55" width="390" height="305" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="235" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">增量聚合函数</text>
  <text x="235" y="107" text-anchor="middle" font-size="11" fill="#5b6b7c">incremental aggregation functions</text>
  <rect x="60" y="130" width="44" height="36" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="82" y="153" text-anchor="middle" font-size="12" fill="#1f2b38">e1</text>
  <rect x="124" y="130" width="44" height="36" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="146" y="153" text-anchor="middle" font-size="12" fill="#1f2b38">e2</text>
  <rect x="188" y="130" width="44" height="36" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="210" y="153" text-anchor="middle" font-size="12" fill="#1f2b38">e3</text>
  <path d="M 236 148 H 256" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="262" y="128" width="140" height="40" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="332" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">累加状态</text>
  <text x="332" y="162" text-anchor="middle" font-size="11" fill="#5b6b7c">acc</text>
  <text x="235" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">每条数据到来即计算，</text>
  <text x="235" y="228" text-anchor="middle" font-size="11" fill="#5b6b7c">只保留一份简单状态</text>
  <path d="M 332 168 V 240" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="247" y="244" width="170" height="40" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="332" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">结果输出</text>
  <text x="235" y="325" text-anchor="middle" font-size="11" fill="#5b6b7c">代表：ReduceFunction / AggregateFunction</text>
  <rect x="470" y="55" width="390" height="305" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="665" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">全窗口函数</text>
  <text x="665" y="107" text-anchor="middle" font-size="11" fill="#5b6b7c">full window functions</text>
  <rect x="490" y="130" width="44" height="36" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="512" y="153" text-anchor="middle" font-size="12" fill="#1f2b38">e1</text>
  <rect x="554" y="130" width="44" height="36" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="576" y="153" text-anchor="middle" font-size="12" fill="#1f2b38">e2</text>
  <rect x="618" y="130" width="44" height="36" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="640" y="153" text-anchor="middle" font-size="12" fill="#1f2b38">e3</text>
  <path d="M 512 166 V 192" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 576 166 V 192" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 640 166 V 192" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="480" y="196" width="370" height="42" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="665" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">窗口内全部数据（缓存）</text>
  <path d="M 665 238 V 266" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="525" y="270" width="280" height="42" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="665" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">触发时遍历全部数据计算</text>
  <text x="665" y="337" text-anchor="middle" font-size="11" fill="#5b6b7c">代表：ProcessWindowFunction</text>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b7c">增量聚合函数更省内存，全窗口函数可拿到窗口元信息与全部原始数据</text>
</svg>
