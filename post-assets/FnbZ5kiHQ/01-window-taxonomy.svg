<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink Window 分类总览</title>
  <rect width="900" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Flink Window 分类总览</text>
  <rect x="305" y="55" width="300" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="455" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">Window：把无限流切成有限桶</text>
  <path d="M 455 103 V 128 M 260 128 H 650" fill="none" stroke="#c8d3e0" stroke-width="1.4"/>
  <path d="M 260 128 V 146" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 650 128 V 146" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="130" y="150" width="260" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="260" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">CountWindow</text>
  <text x="260" y="191" text-anchor="middle" font-size="11" fill="#5b6b7c">按相同 key 的元素个数触发，与时间无关</text>
  <path d="M 260 202 V 246" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="130" y="248" width="260" height="78" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">滚动窗口（按条数）</text>
  <text x="260" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">滑动窗口（条数 + 步长）</text>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#5b6b7c">countWindow(size[, slide])</text>
  <rect x="520" y="150" width="260" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="650" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">TimeWindow</text>
  <text x="650" y="191" text-anchor="middle" font-size="11" fill="#5b6b7c">按时间划分窗口，分三类实现</text>
  <path d="M 650 202 V 226 M 520 226 H 780" fill="none" stroke="#c8d3e0" stroke-width="1.4"/>
  <path d="M 520 226 V 246" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 650 226 V 246" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 780 226 V 246" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="465" y="248" width="110" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="520" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">滚动窗口</text>
  <text x="520" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">Tumbling</text>
  <text x="520" y="310" text-anchor="middle" font-size="11" fill="#5b6b7c">无重叠</text>
  <rect x="595" y="248" width="110" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="650" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">滑动窗口</text>
  <text x="650" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">Sliding</text>
  <text x="650" y="310" text-anchor="middle" font-size="11" fill="#5b6b7c">有重叠</text>
  <rect x="725" y="248" width="110" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="780" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">会话窗口</text>
  <text x="780" y="292" text-anchor="middle" font-size="11" fill="#5b6b7c">Session</text>
  <text x="780" y="310" text-anchor="middle" font-size="11" fill="#5b6b7c">时间无对齐</text>
  <text x="450" y="348" text-anchor="middle" font-size="11" fill="#5b6b7c">同一 key 的元素才会进入同一个窗口，计数与计时都在各自 key 内独立进行</text>
</svg>
