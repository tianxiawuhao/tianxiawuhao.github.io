<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>git reset 三种模式对 HEAD、暂存区与工作区的影响</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">git reset 三种模式对 HEAD、暂存区与工作区的影响</text>

  <rect x="45" y="60" width="210" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="150" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">命令</text>
  <rect x="255" y="60" width="210" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="360" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">HEAD（提交历史）</text>
  <rect x="465" y="60" width="210" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="570" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">暂存区 Index</text>
  <rect x="675" y="60" width="180" height="40" rx="8" fill="#eef4ff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="765" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">工作区</text>

  <rect x="45" y="105" width="210" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="150" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">--soft</text>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#5b6b7c">只移动 HEAD</text>
  <rect x="261" y="111" width="198" height="38" rx="6" fill="#fff6e8"/>
  <text x="360" y="135" text-anchor="middle" font-size="13" fill="#e08a1e">回退到指定提交</text>
  <rect x="471" y="111" width="198" height="38" rx="6" fill="#eaf7ef"/>
  <text x="570" y="135" text-anchor="middle" font-size="13" fill="#2e9e5b">保留（改动仍在暂存区）</text>
  <rect x="681" y="111" width="168" height="38" rx="6" fill="#eaf7ef"/>
  <text x="765" y="135" text-anchor="middle" font-size="13" fill="#2e9e5b">保留</text>

  <rect x="45" y="160" width="210" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="150" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">--mixed（默认）</text>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">移动 HEAD 并清空暂存区</text>
  <rect x="261" y="166" width="198" height="38" rx="6" fill="#fff6e8"/>
  <text x="360" y="190" text-anchor="middle" font-size="13" fill="#e08a1e">回退到指定提交</text>
  <rect x="471" y="166" width="198" height="38" rx="6" fill="#fff6e8"/>
  <text x="570" y="190" text-anchor="middle" font-size="13" fill="#e08a1e">重置（改动回到工作区）</text>
  <rect x="681" y="166" width="168" height="38" rx="6" fill="#eaf7ef"/>
  <text x="765" y="190" text-anchor="middle" font-size="13" fill="#2e9e5b">保留</text>

  <rect x="45" y="215" width="210" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="150" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">--hard</text>
  <text x="150" y="255" text-anchor="middle" font-size="11" fill="#5b6b7c">三个区域一起重置</text>
  <rect x="261" y="221" width="198" height="38" rx="6" fill="#fff6e8"/>
  <text x="360" y="245" text-anchor="middle" font-size="13" fill="#e08a1e">回退到指定提交</text>
  <rect x="471" y="221" width="198" height="38" rx="6" fill="#fff6e8"/>
  <text x="570" y="245" text-anchor="middle" font-size="13" fill="#e08a1e">重置</text>
  <rect x="681" y="221" width="168" height="38" rx="6" fill="#fff6e8"/>
  <text x="765" y="245" text-anchor="middle" font-size="13" fill="#e08a1e">重置（改动丢失）</text>

  <text x="45" y="292" font-size="12" fill="#5b6b7c">橙色＝被回退或重置，绿色＝原样保留。git reset 不带参数时默认使用 --mixed。</text>
  <text x="45" y="314" font-size="12" fill="#5b6b7c">--hard 会丢弃未提交的改动，执行前请确认没有需要保留的修改。</text>
</svg>
