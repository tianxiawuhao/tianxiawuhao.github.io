<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Git 四大区域与常用命令流转</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Git 四大区域与常用命令流转</text>

  <rect x="45" y="90" width="150" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">工作区</text>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">Workspace</text>

  <rect x="265" y="90" width="150" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="340" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">暂存区</text>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">Index / Stage</text>

  <rect x="485" y="90" width="150" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="560" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">本地仓库</text>
  <text x="560" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">Repository</text>

  <rect x="705" y="90" width="150" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="780" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">远程仓库</text>
  <text x="780" y="140" text-anchor="middle" font-size="11" fill="#5b6b7c">Remote</text>

  <line x1="197" y1="125" x2="260" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="229" y="112" text-anchor="middle" font-size="11" fill="#2f6fd0">git add</text>
  <line x1="417" y1="125" x2="480" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="449" y="112" text-anchor="middle" font-size="11" fill="#2f6fd0">git commit</text>
  <line x1="637" y1="125" x2="700" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="669" y="112" text-anchor="middle" font-size="11" fill="#2f6fd0">git push</text>

  <rect x="45" y="200" width="810" height="100" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="65" y="228" font-size="12" fill="#1f2b38">撤销回退：git restore（旧版 git checkout）撤销工作区改动；git reset 调整暂存区与提交历史；git revert 生成反向提交。</text>
  <text x="65" y="252" font-size="12" fill="#1f2b38">远程协作：git fetch 只下载远程更新；git pull 相当于 fetch 加 merge；git push 把本地提交推送到远程。</text>
  <text x="65" y="276" font-size="12" fill="#1f2b38">分支切换：git switch（旧版 git checkout）切换分支，git switch -c 新建并切换。</text>
</svg>
