<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>五个生产案例：症状、根因与定位方法对照</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">五个生产案例：报错位置往往不是根因</text>

  <text x="45" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">症状 / 报错</text>
  <text x="285" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">真正的根因</text>
  <text x="565" y="60" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">定位关键</text>
  <rect x="40" y="68" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="80" width="820" height="48" fill="#eef4ff"/>
  <text x="45" y="100" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">NPE 报在 if 判断那一行</text>
  <text x="45" y="118" font-size="11" fill="#5b6b7c" text-anchor="start">Integer 字段偶尔为 null</text>
  <text x="285" y="100" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">包装类型与基本类型比较触发自动拆箱</text>
  <text x="285" y="118" font-size="11" fill="#5b6b7c" text-anchor="start">null.intValue() 直接抛异常</text>
  <text x="565" y="100" font-size="11" fill="#1f2b38" text-anchor="start">先判空，或改用 Objects.equals</text>

  <rect x="40" y="128" width="820" height="48" fill="#ffffff"/>
  <text x="45" y="148" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">Set 去重失效、分页顺序错乱</text>
  <text x="45" y="166" font-size="11" fill="#5b6b7c" text-anchor="start">同一份数据每次顺序不同</text>
  <text x="285" y="148" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">只重写了 equals 没写 hashCode</text>
  <text x="285" y="166" font-size="11" fill="#5b6b7c" text-anchor="start">HashSet 的迭代顺序与插入无关</text>
  <text x="565" y="148" font-size="11" fill="#1f2b38" text-anchor="start">保序改用 LinkedHashSet / LinkedHashMap</text>

  <rect x="40" y="176" width="820" height="48" fill="#eef4ff"/>
  <text x="45" y="196" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">少量请求偶发超 1 秒</text>
  <text x="45" y="214" font-size="11" fill="#5b6b7c" text-anchor="start">重放同一报文又是毫秒级</text>
  <text x="285" y="196" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">高峰期数据库资源竞争（写影响读）</text>
  <text x="285" y="214" font-size="11" fill="#5b6b7c" text-anchor="start">不是 SQL 或数据量的问题</text>
  <text x="565" y="196" font-size="11" fill="#1f2b38" text-anchor="start">按读频、写频、一致性容忍度筛选缓存</text>

  <rect x="40" y="224" width="820" height="48" fill="#ffffff"/>
  <text x="45" y="244" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">LazyInitializationException</text>
  <text x="45" y="262" font-size="11" fill="#5b6b7c" text-anchor="start">导出与异步任务必现</text>
  <text x="285" y="244" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">事务结束后 Session 已关闭</text>
  <text x="285" y="262" font-size="11" fill="#5b6b7c" text-anchor="start">在事务边界之外访问了懒加载字段</text>
  <text x="565" y="244" font-size="11" fill="#1f2b38" text-anchor="start">JOIN FETCH 或事务内转 DTO</text>

  <rect x="40" y="272" width="820" height="48" fill="#eef4ff"/>
  <text x="45" y="292" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">登录页反复自动刷新</text>
  <text x="45" y="310" font-size="11" fill="#5b6b7c" text-anchor="start">后端日志显示登录接口被连调多次</text>
  <text x="285" y="292" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">静态资源 404 被统一错误处理误判为登录失效</text>
  <text x="285" y="310" font-size="11" fill="#5b6b7c" text-anchor="start">favicon 加载失败触发跳转循环</text>
  <text x="565" y="292" font-size="11" fill="#1f2b38" text-anchor="start">先看 Network 面板里失败的请求</text>
  <rect x="40" y="320" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="336" width="400" height="118" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="358" font-size="12.5" fill="#2e9e5b" text-anchor="start" font-weight="700">三步定位法</text>
  <text x="60" y="382" font-size="11.5" fill="#1f2b38" text-anchor="start">1　缩小范围：能否稳定复现？换数据/换环境还出现吗</text>
  <text x="60" y="404" font-size="11.5" fill="#1f2b38" text-anchor="start">2　对比变量：出问题时哪个条件与正常时不同</text>
  <text x="60" y="426" font-size="11.5" fill="#1f2b38" text-anchor="start">3　看证据：日志、堆栈、GC、线程栈、Network 面板</text>
  <text x="60" y="448" font-size="11.5" fill="#5b6b7c" text-anchor="start">顺序不能反：先猜后证会浪费大量时间</text>

  <rect x="460" y="336" width="400" height="118" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="480" y="358" font-size="12.5" fill="#e08a1e" text-anchor="start" font-weight="700">五个案例的共同规律</text>
  <text x="480" y="382" font-size="11.5" fill="#5b6b7c" text-anchor="start">报错堆栈指向的是「异常抛出的位置」，</text>
  <text x="480" y="402" font-size="11.5" fill="#5b6b7c" text-anchor="start">而不是「逻辑出错的位置」。</text>
  <text x="480" y="426" font-size="11.5" fill="#1f2b38" text-anchor="start">Java 的语言特性（自动拆箱、哈希契约、懒加载、</text>
  <text x="480" y="446" font-size="11.5" fill="#1f2b38" text-anchor="start">事务边界）是这类「位置错位」故障的高发区。</text>
</svg>
