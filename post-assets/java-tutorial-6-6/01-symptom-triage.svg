<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>线上问题分诊：症状、首选工具与判据</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">线上排查第一步：按症状选工具，再动手定位</text>
  <text x="140" y="56" font-size="13" fill="#5b6b7c" text-anchor="middle">症状</text>
  <text x="410" y="56" font-size="13" fill="#5b6b7c" text-anchor="middle">首选工具</text>
  <text x="710" y="56" font-size="13" fill="#5b6b7c" text-anchor="middle">看什么 / 判据</text>

  <rect x="40" y="68" width="200" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="310" y="68" width="200" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="560" y="68" width="300" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="95" font-size="13" fill="#1f2b38" text-anchor="middle">CPU 飙高</text>
  <text x="410" y="95" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">top -Hp + jstack</text>
  <text x="710" y="95" font-size="12.5" fill="#1f2b38" text-anchor="middle">栈顶业务方法持续为热点</text>
  <line x1="245" y1="90" x2="303" y2="90" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="515" y1="90" x2="553" y2="90" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="126" width="200" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="310" y="126" width="200" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="560" y="126" width="300" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="153" font-size="13" fill="#1f2b38" text-anchor="middle">进程卡死、请求挂起</text>
  <text x="410" y="153" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">jstack</text>
  <text x="710" y="153" font-size="12.5" fill="#1f2b38" text-anchor="middle">deadlock 段 / 大量 BLOCKED</text>
  <line x1="245" y1="148" x2="303" y2="148" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="515" y1="148" x2="553" y2="148" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="184" width="200" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="310" y="184" width="200" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="560" y="184" width="300" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="211" font-size="13" fill="#1f2b38" text-anchor="middle">内存缓涨、频繁 Full GC</text>
  <text x="410" y="211" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">jstat -gc</text>
  <text x="710" y="211" font-size="12.5" fill="#1f2b38" text-anchor="middle">Full GC 后 OU 不回落</text>
  <line x1="245" y1="206" x2="303" y2="206" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="515" y1="206" x2="553" y2="206" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="242" width="200" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="310" y="242" width="200" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="560" y="242" width="300" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="269" font-size="13" fill="#1f2b38" text-anchor="middle">突发 OOM</text>
  <text x="410" y="269" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">错误类型 + HeapDump</text>
  <text x="710" y="269" font-size="12.5" fill="#1f2b38" text-anchor="middle">堆 / Metaspace / 直接内存</text>
  <line x1="245" y1="264" x2="303" y2="264" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="515" y1="264" x2="553" y2="264" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="300" width="200" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="310" y="300" width="200" height="44" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="560" y="300" width="300" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="140" y="327" font-size="13" fill="#1f2b38" text-anchor="middle">接口变慢但 CPU 不高</text>
  <text x="410" y="327" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">jstack 连打三次</text>
  <text x="710" y="327" font-size="12.5" fill="#1f2b38" text-anchor="middle">同一批线程停在同一方法</text>
  <line x1="245" y1="322" x2="303" y2="322" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="515" y1="322" x2="553" y2="322" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
