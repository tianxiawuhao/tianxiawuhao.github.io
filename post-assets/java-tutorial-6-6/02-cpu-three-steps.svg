<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>CPU 飙高定位三步：从线程号到代码行</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">CPU 飙高定位三步：从线程号到代码行</text>

  <rect x="30" y="60" width="240" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="90" font-size="13" fill="#1f2b38" text-anchor="middle">① 找到最耗 CPU 的线程</text>
  <text x="150" y="122" font-size="13" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">top -Hp 6219</text>
  <text x="150" y="166" font-size="12" fill="#5b6b7c" text-anchor="middle">记下线程 ID：6236</text>

  <rect x="330" y="60" width="240" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="90" font-size="13" fill="#1f2b38" text-anchor="middle">② 线程号转成十六进制</text>
  <text x="450" y="122" font-size="13" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">printf '%x\n' 6236</text>
  <text x="450" y="166" font-size="12" fill="#5b6b7c" text-anchor="middle">得到 nid=0x185c</text>

  <rect x="630" y="60" width="240" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="90" font-size="13" fill="#1f2b38" text-anchor="middle">③ 用 nid 搜线程栈</text>
  <text x="750" y="118" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">jstack 6219 | grep -A 20</text>
  <text x="750" y="140" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">nid=0x185c</text>
  <text x="750" y="166" font-size="12" fill="#5b6b7c" text-anchor="middle">栈顶即嫌疑点</text>

  <line x1="278" y1="120" x2="322" y2="120" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="578" y1="120" x2="622" y2="120" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="150" y="205" font-size="12" fill="#5b6b7c" text-anchor="middle">十进制线程号</text>
  <text x="450" y="205" font-size="12" fill="#5b6b7c" text-anchor="middle">十六进制 nid</text>
  <text x="750" y="205" font-size="12" fill="#5b6b7c" text-anchor="middle">业务代码行</text>

  <rect x="60" y="236" width="780" height="42" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="262" font-size="12" fill="#1f2b38" text-anchor="middle">RUNNABLE 不等于在算 CPU：间隔数秒连打 3 次，同一方法稳定在栈顶才算热点</text>
</svg>
