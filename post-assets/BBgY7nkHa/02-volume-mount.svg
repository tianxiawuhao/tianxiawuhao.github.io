<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>宿主机目录与容器路径的挂载对应关系</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">宿主机目录与容器路径的挂载对应关系</text>
  <text x="190" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b7c">宿主机 /app/cloud/clickhouse</text>
  <text x="710" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b7c">容器内路径</text>
  <rect x="40" y="70" width="300" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="190" y="92" text-anchor="middle" font-size="12" fill="#1f2b38">/app/cloud/clickhouse/data</text>
  <text x="190" y="109" text-anchor="middle" font-size="11" fill="#5b6b7c">数据目录（rw）</text>
  <rect x="560" y="70" width="300" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="710" y="92" text-anchor="middle" font-size="12" fill="#1f2b38">/var/lib/clickhouse</text>
  <text x="710" y="109" text-anchor="middle" font-size="11" fill="#5b6b7c">容器数据目录</text>
  <line x1="345" y1="95" x2="553" y2="95" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="126" width="300" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="148" text-anchor="middle" font-size="12" fill="#1f2b38">/app/cloud/clickhouse/conf/config.xml</text>
  <text x="190" y="165" text-anchor="middle" font-size="11" fill="#5b6b7c">服务端主配置</text>
  <rect x="560" y="126" width="300" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="710" y="148" text-anchor="middle" font-size="12" fill="#1f2b38">/etc/clickhouse-server/config.xml</text>
  <text x="710" y="165" text-anchor="middle" font-size="11" fill="#5b6b7c">容器主配置</text>
  <line x1="345" y1="151" x2="553" y2="151" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="182" width="300" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="190" y="204" text-anchor="middle" font-size="12" fill="#1f2b38">/app/cloud/clickhouse/conf/users.xml</text>
  <text x="190" y="221" text-anchor="middle" font-size="11" fill="#5b6b7c">账号与权限配置</text>
  <rect x="560" y="182" width="300" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="710" y="204" text-anchor="middle" font-size="12" fill="#1f2b38">/etc/clickhouse-server/users.xml</text>
  <text x="710" y="221" text-anchor="middle" font-size="11" fill="#5b6b7c">容器账号配置</text>
  <line x1="345" y1="207" x2="553" y2="207" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="238" width="300" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="190" y="260" text-anchor="middle" font-size="12" fill="#1f2b38">/app/cloud/clickhouse/log</text>
  <text x="190" y="277" text-anchor="middle" font-size="11" fill="#5b6b7c">日志目录（rw）</text>
  <rect x="560" y="238" width="300" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="710" y="260" text-anchor="middle" font-size="12" fill="#1f2b38">/var/log/clickhouse-server</text>
  <text x="710" y="277" text-anchor="middle" font-size="11" fill="#5b6b7c">容器日志目录</text>
  <line x1="345" y1="263" x2="553" y2="263" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
