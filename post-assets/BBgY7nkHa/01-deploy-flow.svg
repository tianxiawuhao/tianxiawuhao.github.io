<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Docker 部署 ClickHouse 的六个步骤</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Docker 部署 ClickHouse：先取配置，再挂载启动</text>
  <rect x="40" y="70" width="220" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">1 建目录并授权</text>
  <text x="150" y="120" text-anchor="middle" font-size="11" fill="#5b6b7c">data / conf / log</text>
  <rect x="340" y="70" width="220" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">2 拉取镜像</text>
  <text x="450" y="120" text-anchor="middle" font-size="11" fill="#5b6b7c">固定版本 20.3.5.21</text>
  <rect x="640" y="70" width="220" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="750" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">3 启动临时容器</text>
  <text x="750" y="120" text-anchor="middle" font-size="11" fill="#5b6b7c">映射 9000 / 8123 / 9009</text>
  <line x1="264" y1="105" x2="336" y2="105" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="105" x2="636" y2="105" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 750 144 V 175 H 150 V 206" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="210" width="220" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="150" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">4 复制配置文件</text>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">config.xml、users.xml</text>
  <rect x="340" y="210" width="220" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">5 停止并删除临时容器</text>
  <text x="450" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">改 users.xml 账号密码</text>
  <rect x="640" y="210" width="220" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">6 挂载启动正式容器</text>
  <text x="750" y="260" text-anchor="middle" font-size="11" fill="#5b6b7c">数据与配置持久化</text>
  <line x1="264" y1="245" x2="336" y2="245" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="564" y1="245" x2="636" y2="245" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
