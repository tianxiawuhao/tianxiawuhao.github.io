<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>String 不可变与 StringBuilder 可变的对比</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">String 不可变 vs StringBuilder 可变</text>

  <rect x="30" y="50" width="410" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="78" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">String：内容一旦创建就不变</text>
  <rect x="30" y="112" width="120" height="40" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="137" font-size="11" fill="#1f2b38" text-anchor="middle">"a"</text>
  <line x1="150" y1="132" x2="186" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="168" y="124" font-size="11" fill="#5b6b7c" text-anchor="middle">+=</text>
  <rect x="190" y="112" width="120" height="40" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="250" y="137" font-size="11" fill="#1f2b38" text-anchor="middle">新建 "ab"</text>
  <line x1="310" y1="132" x2="346" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="328" y="124" font-size="11" fill="#5b6b7c" text-anchor="middle">+=</text>
  <rect x="350" y="112" width="90" height="40" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="395" y="137" font-size="11" fill="#1f2b38" text-anchor="middle">新建 "abc"</text>
  <text x="235" y="176" font-size="11" fill="#5b6b7c" text-anchor="middle">每次 += 都新建对象并整体复制旧内容</text>
  <text x="235" y="198" font-size="11" fill="#e08a1e" text-anchor="middle">循环 n 次 → 总代价 O(n²)</text>
  <rect x="30" y="216" width="410" height="114" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="242" font-size="11" fill="#5b6b7c">· replace / substring / toUpperCase 都返回新对象</text>
  <text x="50" y="266" font-size="11" fill="#5b6b7c">· 比较内容用 equals，== 比的是引用地址</text>
  <text x="50" y="290" font-size="11" fill="#5b6b7c">· 字面量进常量池被复用，容易掩盖 == 的问题</text>
  <text x="50" y="314" font-size="11" fill="#5b6b7c">· 单独一句 a + b + c 会被编译成一次拼接</text>

  <rect x="470" y="50" width="400" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="78" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">StringBuilder：同一缓冲区就地修改</text>
  <rect x="520" y="112" width="300" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="140" font-size="12" fill="#1f2b38" text-anchor="middle">char[] 缓冲区（容量不足自动扩容）</text>
  <path d="M 820 148 L 850 170 L 560 170 L 560 160" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="700" y="192" font-size="11" fill="#5b6b7c" text-anchor="middle">append / insert / reverse 改完返回自身</text>
  <text x="670" y="212" font-size="11" fill="#e08a1e" text-anchor="middle">容量不足 → 复制到更大的数组</text>
  <rect x="470" y="216" width="400" height="114" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="242" font-size="11" fill="#5b6b7c">· length() 是已存字符数，capacity() 是容量</text>
  <text x="490" y="266" font-size="11" fill="#5b6b7c">· 能预估长度就 new StringBuilder(1024)</text>
  <text x="490" y="290" font-size="11" fill="#5b6b7c">· StringBuffer 方法加了 synchronized，更慢</text>
  <text x="490" y="314" font-size="11" fill="#5b6b7c">· 单线程一律用 StringBuilder</text>

  <rect x="30" y="352" width="410" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="380" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">内容不变、要当键：用 String</text>
  <text x="235" y="408" font-size="11" fill="#5b6b7c" text-anchor="middle">不可变所以可安全共享，适合做 HashMap 的键</text>
  <rect x="470" y="352" width="400" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="380" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">频繁修改、循环拼接：用 StringBuilder</text>
  <text x="670" y="408" font-size="11" fill="#5b6b7c" text-anchor="middle">sb.append(x).append(y).toString()</text>
</svg>
