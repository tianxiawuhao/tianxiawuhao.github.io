<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>均匀抽样与优先经验回放抽样对比</title>
  <rect width="900" height="410" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">均匀抽样（ER）与非均匀抽样（PER）</text>

  <rect x="50" y="55" width="380" height="285" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">经验回放 ER：均匀抽样</text>
  <text x="240" y="106" text-anchor="middle" font-size="12" fill="#1f2b38">每条 transition 同等重要</text>
  <line x1="80" y1="250" x2="400" y2="250" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="100" y="180" width="34" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="150" y="180" width="34" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="200" y="180" width="34" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="250" y="180" width="34" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="300" y="180" width="34" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="350" y="180" width="34" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="117" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t1</text>
  <text x="167" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t2</text>
  <text x="217" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t3</text>
  <text x="267" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t4</text>
  <text x="317" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t5</text>
  <text x="367" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t6</text>
  <text x="240" y="302" text-anchor="middle" font-size="12" fill="#1f2b38">p_1 = … = p_n = 1/n</text>
  <text x="240" y="324" text-anchor="middle" font-size="12" fill="#1f2b38">学习率 α 对每条 transition 相同</text>

  <rect x="470" y="55" width="380" height="285" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="660" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">优先经验回放 PER：非均匀抽样</text>
  <text x="660" y="106" text-anchor="middle" font-size="12" fill="#1f2b38">|δ_t| 越大，重要性越高</text>
  <line x1="500" y1="250" x2="820" y2="250" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="520" y="210" width="34" height="40" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="570" y="180" width="34" height="70" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="620" y="220" width="34" height="30" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="670" y="155" width="34" height="95" rx="8" fill="#e08a1e" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="720" y="195" width="34" height="55" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="770" y="225" width="34" height="25" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="537" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t1</text>
  <text x="587" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t2</text>
  <text x="637" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t3</text>
  <text x="687" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t4</text>
  <text x="737" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t5</text>
  <text x="787" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">t6</text>
  <text x="660" y="302" text-anchor="middle" font-size="12" fill="#1f2b38">p_t ∝ |δ_t| + ε，或按 |δ_t| 排序</text>
  <text x="660" y="324" text-anchor="middle" font-size="12" fill="#1f2b38">p_t 越大 → 学习率 α_i 越小</text>

  <text x="450" y="375" text-anchor="middle" font-size="12" fill="#5b6b7c">非均匀抽样会让样本分布有偏，必须按 p_t 缩放学习率以补偿</text>
</svg>
