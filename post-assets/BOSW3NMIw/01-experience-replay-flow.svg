<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>经验回放训练流程</title>
  <rect width="900" height="450" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">经验回放（Experience Replay）训练流程</text>

  <rect x="250" y="55" width="400" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">Agent 与环境交互</text>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#1f2b38">得到一条 transition (s_t, a_t, r_t, s_{t+1})</text>

  <line x1="450" y1="131" x2="450" y2="171" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="466" y="155" font-size="11" fill="#5b6b7c">存入</text>

  <rect x="90" y="175" width="720" height="125" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="110" y="199" font-size="13" font-weight="700" fill="#2f6fd0">回放缓冲区 Replay Buffer（容量 n 是超参数）</text>
  <rect x="110" y="215" width="100" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#1f2b38">transition</text>
  <rect x="226" y="215" width="100" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="276" y="240" text-anchor="middle" font-size="11" fill="#1f2b38">transition</text>
  <rect x="342" y="215" width="100" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="392" y="240" text-anchor="middle" font-size="11" fill="#1f2b38">transition</text>
  <rect x="458" y="215" width="100" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="508" y="240" text-anchor="middle" font-size="11" fill="#1f2b38">transition</text>
  <rect x="574" y="215" width="100" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="624" y="240" text-anchor="middle" font-size="11" fill="#1f2b38">transition</text>
  <rect x="690" y="215" width="100" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="740" y="240" text-anchor="middle" font-size="11" fill="#1f2b38">transition</text>
  <text x="160" y="285" text-anchor="middle" font-size="11" fill="#5b6b7c">最旧（先淘汰）</text>
  <text x="740" y="285" text-anchor="middle" font-size="11" fill="#5b6b7c">最新</text>

  <line x1="450" y1="300" x2="450" y2="338" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="466" y="324" font-size="11" fill="#5b6b7c">随机抽取 mini-batch</text>

  <rect x="90" y="344" width="340" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="260" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">随机抽取 mini-batch</text>
  <text x="260" y="399" text-anchor="middle" font-size="12" fill="#1f2b38">每次取多条 transition</text>

  <line x1="430" y1="382" x2="466" y2="382" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="344" width="340" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="640" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">计算 TD error 与随机梯度 g</text>
  <text x="640" y="399" text-anchor="middle" font-size="12" fill="#1f2b38">用 SGD 更新价值网络参数 w</text>

  <line x1="90" y1="382" x2="60" y2="382" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="60" y1="382" x2="60" y2="93" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="60" y1="93" x2="246" y2="93" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="34" y="240" font-size="11" fill="#5b6b7c" text-anchor="middle" transform="rotate(-90 34 240)">更新参数 w 后继续与环境交互</text>
</svg>
