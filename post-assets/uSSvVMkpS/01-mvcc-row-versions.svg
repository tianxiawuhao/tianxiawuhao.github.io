<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>MVCC 行版本与 xmin/xmax：读写互不阻塞</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">MVCC 行版本与 xmin/xmax：读写互不阻塞</text>
  <rect x="40" y="55" width="820" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="60" y="80" width="220" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="109" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">事务A（写事务）</text>
  <text x="170" y="131" font-size="11" fill="#5b6b7c" text-anchor="middle">ID=631，update 后提交</text>
  <rect x="620" y="80" width="220" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="730" y="109" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">事务B（读事务）</text>
  <text x="730" y="131" font-size="11" fill="#5b6b7c" text-anchor="middle">全程只读，不阻塞</text>
  <rect x="340" y="170" width="230" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="455" y="195" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">版本 V1（旧）</text>
  <text x="455" y="217" font-size="12" fill="#5b6b7c" text-anchor="middle">xmin=630  xmax=631</text>
  <rect x="340" y="256" width="230" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="455" y="281" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">版本 V2（新）</text>
  <text x="455" y="303" font-size="12" fill="#5b6b7c" text-anchor="middle">xmin=631  xmax=0</text>
  <path d="M 170 150 V 288 H 334" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 730 150 V 202 H 578" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 455 236 V 252" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="468" y="250" font-size="11" fill="#5b6b7c">A 提交后</text>
  <text x="585" y="196" font-size="11" fill="#5b6b7c">B 读到旧版本</text>
  <text x="585" y="214" font-size="11" fill="#5b6b7c">（已提交快照）</text>
  <text x="585" y="284" font-size="11" fill="#5b6b7c">A 提交后，B 才</text>
  <text x="585" y="302" font-size="11" fill="#5b6b7c">能读到新版本</text>
  <text x="60" y="340" font-size="12" fill="#5b6b7c">说明：读事务读取旧版本快照，写事务生成新版本；读写互不阻塞，写写冲突仍由行锁解决。</text>
</svg>
