<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>GitLab 与 Runner 协作的 CI/CD 流水线</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">GitLab + Runner 的 CI/CD 流水线</text>

  <rect x="30" y="55" width="840" height="115" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="46" y="79" font-size="13" font-weight="700" fill="#2f6fd0">GitLab 服务器</text>

  <rect x="55" y="95" width="180" height="58" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="145" y="129" font-size="13" fill="#1f2b38" text-anchor="middle">开发者推送代码</text>

  <line x1="237" y1="124" x2="276" y2="124" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="280" y="95" width="215" height="58" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="387" y="120" font-size="13" fill="#1f2b38" text-anchor="middle">仓库根目录</text>
  <text x="387" y="138" font-size="12" fill="#5b6b7c" text-anchor="middle">.gitlab-ci.yml</text>

  <line x1="497" y1="124" x2="536" y2="124" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="540" y="95" width="305" height="58" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="692" y="129" font-size="13" fill="#1f2b38" text-anchor="middle">按 stage 生成作业并派发</text>

  <line x1="692" y1="172" x2="692" y2="196" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="706" y="189" font-size="12" fill="#5b6b7c">派发作业</text>

  <rect x="30" y="200" width="840" height="170" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="46" y="224" font-size="13" font-weight="700" fill="#5b6b7c">GitLab Runner（docker executor）</text>

  <rect x="55" y="240" width="175" height="62" rx="8" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="142" y="267" font-size="13" fill="#1f2b38" text-anchor="middle">Runner 领取作业</text>
  <text x="142" y="285" font-size="12" fill="#5b6b7c" text-anchor="middle">轮询 GitLab</text>

  <line x1="232" y1="271" x2="266" y2="271" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="270" y="240" width="185" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="362" y="267" font-size="13" fill="#1f2b38" text-anchor="middle">stage: package</text>
  <text x="362" y="285" font-size="12" fill="#5b6b7c" text-anchor="middle">mvn clean package</text>

  <line x1="457" y1="271" x2="491" y2="271" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="495" y="240" width="175" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="582" y="267" font-size="13" fill="#1f2b38" text-anchor="middle">stage: build</text>
  <text x="582" y="285" font-size="12" fill="#5b6b7c" text-anchor="middle">docker build</text>

  <line x1="672" y1="271" x2="706" y2="271" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="710" y="240" width="140" height="62" rx="8" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="780" y="267" font-size="13" fill="#1f2b38" text-anchor="middle">推送镜像</text>
  <text x="780" y="285" font-size="12" fill="#5b6b7c" text-anchor="middle">docker push</text>

  <text x="46" y="340" font-size="12" fill="#5b6b7c">Runner 通过挂载的 docker.sock 创建独立构建容器，每个作业在干净环境中执行，互不影响。</text>

  <line x1="780" y1="302" x2="780" y2="386" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="680" y="390" width="200" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="780" y="423" font-size="13" fill="#1f2b38" text-anchor="middle">Harbor 镜像仓库</text>
</svg>
