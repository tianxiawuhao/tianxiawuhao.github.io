<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>GitLab CI 流水线：从代码推送到镜像入库</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">GitLab CI 流水线：从代码推送到镜像入库</text>

  <rect x="30" y="70" width="186" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="123" y="98" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">① 推送代码</text>
  <text x="123" y="124" font-size="12" fill="#1f2b38" text-anchor="middle">dev-release 分支</text>
  <text x="123" y="148" font-size="12" fill="#1f2b38" text-anchor="middle">提交并 push</text>

  <line x1="216" y1="125" x2="242" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="246" y="70" width="186" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="339" y="98" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">② 触发流水线</text>
  <text x="339" y="124" font-size="12" fill="#1f2b38" text-anchor="middle">读取 .gitlab-ci.yml</text>
  <text x="339" y="148" font-size="12" fill="#1f2b38" text-anchor="middle">按 stages 依次执行</text>

  <line x1="432" y1="125" x2="458" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="462" y="70" width="186" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="555" y="98" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">③ package 阶段</text>
  <text x="555" y="122" font-size="12" fill="#1f2b38" text-anchor="middle">make_jar</text>
  <text x="555" y="144" font-size="12" fill="#1f2b38" text-anchor="middle">image: maven:3.6.3-jdk-8</text>
  <text x="555" y="166" font-size="12" fill="#1f2b38" text-anchor="middle">mvn package 生成 jar</text>

  <line x1="648" y1="125" x2="674" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="678" y="70" width="186" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="771" y="98" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">④ build 阶段</text>
  <text x="771" y="122" font-size="12" fill="#1f2b38" text-anchor="middle">make_image</text>
  <text x="771" y="144" font-size="12" fill="#1f2b38" text-anchor="middle">image: docker:latest</text>
  <text x="771" y="166" font-size="12" fill="#1f2b38" text-anchor="middle">build &amp; push 到 Harbor</text>

  <line x1="555" y1="215" x2="700" y2="215" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="627" y1="240" x2="627" y2="215" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="555" y1="215" x2="555" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="700" y1="215" x2="700" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="610" y="207" font-size="11" fill="#5b6b7c" text-anchor="middle">缓存读写</text>

  <rect x="280" y="240" width="460" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="510" y="268" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">cache（key: minio）跨 job 复用</text>
  <text x="510" y="292" font-size="12" fill="#5b6b7c" text-anchor="middle">.m2/repository/：Maven 依赖缓存</text>
  <text x="510" y="312" font-size="12" fill="#5b6b7c" text-anchor="middle">minio/target/*.jar：上一阶段编译产物</text>
</svg>
