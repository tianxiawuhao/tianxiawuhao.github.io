<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>GitLab Runner 与 Docker executor 架构</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">GitLab Runner 与 Docker executor 架构</text>

  <rect x="20" y="55" width="860" height="310" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="38" y="82" font-size="13" font-weight="700" fill="#5b6b7c">Docker 宿主机（挂载目录以 /srv 为例）</text>

  <rect x="40" y="100" width="150" height="70" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="128" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">开发者 / 浏览器</text>
  <text x="115" y="150" font-size="11" fill="#5b6b7c" text-anchor="middle">push 代码、访问页面</text>

  <rect x="230" y="95" width="175" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="317" y="122" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">GitLab CE 容器</text>
  <text x="317" y="146" font-size="11" fill="#1f2b38" text-anchor="middle">端口 80 / 8443 / 8022</text>
  <text x="317" y="168" font-size="11" fill="#1f2b38" text-anchor="middle">卷 /srv/gitlab/config</text>
  <text x="317" y="189" font-size="11" fill="#1f2b38" text-anchor="middle">卷 /srv/gitlab/data</text>

  <rect x="520" y="95" width="340" height="110" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="122" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">gitlab-runner 容器</text>
  <text x="690" y="146" font-size="11" fill="#1f2b38" text-anchor="middle">executor = docker</text>
  <text x="690" y="168" font-size="11" fill="#1f2b38" text-anchor="middle">卷 /srv/gitlab-runner/config</text>
  <text x="690" y="189" font-size="11" fill="#1f2b38" text-anchor="middle">挂载 /var/run/docker.sock</text>

  <rect x="40" y="250" width="160" height="85" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="120" y="278" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Harbor 镜像仓库</text>
  <text x="120" y="301" font-size="11" fill="#5b6b7c" text-anchor="middle">harbor.com/test/</text>
  <text x="120" y="322" font-size="11" fill="#5b6b7c" text-anchor="middle">minio-connect:$VERSION</text>

  <rect x="520" y="250" width="340" height="85" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="690" y="278" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">构建容器（job）</text>
  <text x="690" y="302" font-size="11" fill="#1f2b38" text-anchor="middle">image: maven:3.6.3-jdk-8 / docker:latest</text>
  <text x="690" y="323" font-size="11" fill="#1f2b38" text-anchor="middle">mvn package、docker build &amp; push</text>

  <line x1="190" y1="135" x2="226" y2="135" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="208" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">push</text>

  <line x1="405" y1="140" x2="516" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="460" y="128" font-size="11" fill="#5b6b7c" text-anchor="middle">下发 job</text>
  <text x="460" y="158" font-size="11" fill="#5b6b7c" text-anchor="middle">上报状态</text>

  <line x1="690" y1="205" x2="690" y2="246" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="702" y="230" font-size="11" fill="#5b6b7c">docker.sock 创建构建容器</text>

  <line x1="505" y1="292" x2="205" y2="292" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="355" y="285" font-size="11" fill="#5b6b7c" text-anchor="middle">docker push 镜像</text>
</svg>
