<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>强化学习的交互回路与一条轨迹：智能体按策略抽样动作，环境按状态转移函数抽样下一状态并给出奖励</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9e5b"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/></marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">智能体与环境的交互回路（MDP 与一条轨迹）</text>
  <rect x="40" y="58" width="230" height="92" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="155" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">智能体 Agent</text>
  <text x="155" y="108" text-anchor="middle" font-size="11" fill="#5b6b7c">在状态 s 下按策略 π(a|s) 抽样动作</text>
  <text x="155" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">两种随机性之一：动作随机</text>
  <rect x="630" y="58" width="230" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="745" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">环境 Environment</text>
  <text x="745" y="108" text-anchor="middle" font-size="11" fill="#5b6b7c">按 p(s′|s, a) 抽样下一状态并给出奖励</text>
  <text x="745" y="128" text-anchor="middle" font-size="11" fill="#5b6b7c">两种随机性之二：状态随机</text>
  <line x1="272" y1="82" x2="626" y2="82" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ahg)"/>
  <text x="449" y="74" text-anchor="middle" font-size="11" fill="#2e9e5b">动作 a ~ π(·|s)</text>
  <line x1="628" y1="126" x2="274" y2="126" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ahb)"/>
  <text x="449" y="144" text-anchor="middle" font-size="11" fill="#2f6fd0">奖励 r 与新状态 s′ ~ p(·|s, a)</text>
  <rect x="40" y="180" width="820" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="204" font-size="12" font-weight="700" fill="#1f2b38">一个 trajectory（轨迹）：s 与 a 交替出现，每步都伴随一个奖励 r</text>
  <rect x="60" y="222" width="74" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="97" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">状态 s₀</text>
  <rect x="164" y="222" width="74" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="201" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">动作 a₀</text>
  <rect x="268" y="222" width="74" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="305" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">奖励 r₀</text>
  <rect x="372" y="222" width="74" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="409" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">状态 s₁</text>
  <rect x="476" y="222" width="74" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="513" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">动作 a₁</text>
  <rect x="580" y="222" width="74" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="617" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">奖励 r₁</text>
  <text x="686" y="244" text-anchor="middle" font-size="13" fill="#5b6b7c">……</text>
  <rect x="730" y="222" width="110" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="785" y="244" text-anchor="middle" font-size="11" fill="#1f2b38">终止状态 s_T</text>
  <line x1="136" y1="239" x2="162" y2="239" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="240" y1="239" x2="266" y2="239" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="344" y1="239" x2="370" y2="239" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="448" y1="239" x2="474" y2="239" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="552" y1="239" x2="578" y2="239" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="656" y1="239" x2="682" y2="239" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="712" y1="239" x2="728" y2="239" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <rect x="40" y="320" width="820" height="90" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="346" font-size="11" fill="#1f2b38">① 折扣回报 U = r₀ + γ·r₁ + γ²·r₂ + ……，γ ∈ [0,1]；γ 越接近 1 越看重长远收益</text>
  <text x="60" y="370" font-size="11" fill="#1f2b38">② MDP = ⟨ 状态空间 S、动作空间 A、状态转移 p、奖励函数 R、折扣因子 γ ⟩，马尔可夫性指 s′ 只依赖当前 (s, a)</text>
  <text x="60" y="394" font-size="11" fill="#1f2b38">③ 价值函数把未来随机性积掉：Q(s,a) = E[U | s, a] 评价动作，V(s) = Σ π(a|s)·Q(s,a) 评价状态</text>
</svg>
