<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">EventLoop 与 Pipeline 处理链路</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <rect x="30" y="55" width="240" height="350" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="150" y="82" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">NioEventLoopGroup</text>
  <text x="150" y="102" font-size="11" fill="#5b6b7c" text-anchor="middle">默认线程数 = CPU 核数 × 2</text>

  <rect x="48" y="118" width="204" height="122" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="150" y="141" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">NioEventLoop(线程)</text>
  <text x="62" y="165" font-size="12" fill="#1f2b38">Selector —— 轮询 I/O 事件</text>
  <text x="62" y="187" font-size="12" fill="#1f2b38">TaskQueue —— 异步任务</text>
  <text x="62" y="209" font-size="12" fill="#1f2b38">ScheduledTaskQueue —— 定时任务</text>
  <text x="62" y="231" font-size="11" fill="#5b6b7c">一个 EventLoop 绑定一个线程，串行执行</text>

  <rect x="48" y="256" width="204" height="132" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="150" y="279" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">Channel(每个连接)</text>
  <text x="62" y="303" font-size="12" fill="#1f2b38">注册到某个 EventLoop 的 Selector</text>
  <text x="62" y="325" font-size="12" fill="#1f2b38">生命周期内固定由该 EventLoop 处理</text>
  <text x="62" y="347" font-size="11" fill="#5b6b7c">因此单条连接的读写天然无并发</text>
  <text x="62" y="369" font-size="11" fill="#5b6b7c">Channel 与 EventLoop 是 n : 1</text>

  <path d="M252 179 L 348 179" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="170" font-size="11" fill="#5b6b7c" text-anchor="middle">绑定</text>
  <path d="M252 322 L 348 322" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="313" font-size="11" fill="#2e9e5b" text-anchor="middle">内部持有</text>

  <rect x="352" y="120" width="518" height="268" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="611" y="146" font-size="14" font-weight="700" fill="#1f2b38" text-anchor="middle">ChannelPipeline(双向链表,每个 Channel 一个)</text>

  <rect x="372" y="238" width="72" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="408" y="258" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">Head</text>
  <text x="408" y="275" font-size="11" fill="#5b6b7c" text-anchor="middle">链表头</text>

  <rect x="452" y="238" width="110" height="46" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="507" y="258" font-size="12" fill="#1f2b38" text-anchor="middle">Decoder</text>
  <text x="507" y="275" font-size="11" fill="#5b6b7c" text-anchor="middle">入站:解码</text>

  <rect x="570" y="238" width="110" height="46" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="625" y="258" font-size="12" fill="#1f2b38" text-anchor="middle">业务 Handler</text>
  <text x="625" y="275" font-size="11" fill="#5b6b7c" text-anchor="middle">channelRead0</text>

  <rect x="688" y="238" width="110" height="46" rx="8" fill="#ffffff" stroke="#7a5bd0"/>
  <text x="743" y="258" font-size="12" fill="#1f2b38" text-anchor="middle">Encoder</text>
  <text x="743" y="275" font-size="11" fill="#5b6b7c" text-anchor="middle">出站:编码</text>

  <rect x="806" y="238" width="52" height="46" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="832" y="258" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">Tail</text>
  <text x="832" y="275" font-size="11" fill="#5b6b7c" text-anchor="middle">链表尾</text>

  <path d="M444 261 L 448 261" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M562 261 L 566 261" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M680 261 L 684 261" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M798 261 L 802 261" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#arrb)"/>

  <path d="M452 320 L 802 320" stroke="#7a5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="627" y="340" font-size="12" fill="#7a5bd0" text-anchor="middle">出站事件:write / flush 从 Tail 反向传递到 Head，最终落到 Socket</text>

  <rect x="372" y="166" width="478" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="611" y="188" font-size="12" fill="#1f2b38" text-anchor="middle">入站事件:channelRead 从 Head 依次传到 Tail，每个节点由 ChannelHandlerContext 串联</text>
  <text x="611" y="207" font-size="11" fill="#5b6b7c" text-anchor="middle">ctx.fireChannelRead(msg) 向后传递，ctx.writeAndFlush(msg) 则向前（出站方向）传递</text>

  <path d="M150 400 L 150 410" stroke="none"/>
  <text x="30" y="424" font-size="11" fill="#5b6b7c">要点:一个 Channel 只注册在一个 EventLoop 上，EventLoop 只跑一个线程，故同一条连接的所有 Handler 回调都在同一线程内串行执行。</text>
</svg>
