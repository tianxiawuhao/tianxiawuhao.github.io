<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>处理函数与窗口函数的职责对比</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">处理函数与窗口函数的职责对比</text>
  <rect x="24" y="50" width="412" height="356" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="76" font-size="13.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">处理函数：以“元素 / 时间”为中心</text>
  <rect x="40" y="90" width="380" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="110" font-size="11.5" font-weight="400" fill="#1f2b38" text-anchor="middle">ProcessFunction / KeyedProcessFunction</text>
  <text x="230" y="130" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">逐个处理元素：processElement(value, ctx, out)</text>
  <text x="230" y="150" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">可访问时间戳 ctx.timestamp() 与水位线</text>
  <text x="230" y="170" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">可注册 / 删除定时器，onTimer 回调</text>
  <text x="230" y="188" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">可读写按键状态，可发侧输出流</text>
  <rect x="40" y="206" width="380" height="76" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="230" y="228" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">典型用途</text>
  <text x="230" y="248" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">自定义会话窗口、超时告警、迟到数据分流</text>
  <text x="230" y="268" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">按 key 缓存数据、延迟触发计算</text>
  <rect x="40" y="294" width="380" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="230" y="314" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">时间语义完全自定义</text>
  <text x="230" y="334" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">事件时间由水位线驱动，处理时间由系统时钟驱动</text>
  <text x="230" y="354" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">只有 KeyedStream 才能注册定时器</text>
  <text x="230" y="374" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">onTimer 与 processElement 同步调用，无并发问题</text>
  <rect x="464" y="50" width="412" height="356" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="670" y="76" font-size="13.5" font-weight="700" fill="#7a5bd0" text-anchor="middle">窗口函数：以“窗口”为中心</text>
  <rect x="480" y="90" width="380" height="104" rx="8" fill="#eef4ff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="670" y="110" font-size="11.5" font-weight="400" fill="#1f2b38" text-anchor="middle">ProcessWindowFunction / ProcessAllWindowFunction</text>
  <text x="670" y="130" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">窗口触发时一次性处理：process(key, ctx, elements, out)</text>
  <text x="670" y="150" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">拿不到 TimerService，不能注册定时器</text>
  <text x="670" y="170" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">可访问 window()、windowState()、globalState()</text>
  <text x="670" y="188" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">用 clear() 显式清理自定义窗口状态</text>
  <rect x="480" y="206" width="380" height="76" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.4"/>
  <text x="670" y="228" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">典型用途</text>
  <text x="670" y="248" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">全窗口聚合（求中位数、Top N、去重）</text>
  <text x="670" y="268" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">配合 AggregateFunction 做增量聚合 + 补窗口信息</text>
  <rect x="480" y="294" width="380" height="96" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="670" y="314" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">更看重“窗口”语义</text>
  <text x="670" y="334" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">窗口已定义触发时间点，一般无需再定时</text>
  <text x="670" y="354" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">需要定时操作时改用窗口触发器 Trigger</text>
  <text x="670" y="374" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">TriggerContext 可获取时间、注册 / 删除定时器</text>
</svg>
