<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>雪花算法 64 位 ID 结构：符号位 1 + 时间戳 41 + 数据中心 5 + 机器 5 + 序列 12</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">雪花算法（Snowflake）64 位 ID 结构</text>
  <text x="860" y="70" text-anchor="end" font-size="11" fill="#5b6b7c">高位在左，低位在右，共 64 位</text>

  <rect x="40" y="120" width="12.8" height="72" rx="4" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="46.4" y="163" text-anchor="middle" font-size="11" fill="#7a5bd0">0</text>
  <path d="M 128 92 L 60 92 L 48 114" fill="none" stroke="#5b6b7c" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="134" y="96" font-size="11" fill="#5b6b7c">符号位固定 0，保证 ID 为正</text>

  <rect x="52.8" y="120" width="524.8" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="315.2" y="152" text-anchor="middle" font-size="13" fill="#1f2b38">41 位毫秒时间戳</text>
  <text x="315.2" y="174" text-anchor="middle" font-size="11" fill="#5b6b7c">相对自定义起始时间 twepoch，可用约 69.7 年</text>

  <rect x="577.6" y="120" width="64" height="72" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="609.6" y="150" text-anchor="middle" font-size="11" fill="#1f2b38">数据</text>
  <text x="609.6" y="166" text-anchor="middle" font-size="11" fill="#1f2b38">中心</text>
  <text x="609.6" y="182" text-anchor="middle" font-size="11" fill="#2e9e5b">5 位</text>

  <rect x="641.6" y="120" width="64" height="72" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="673.6" y="150" text-anchor="middle" font-size="11" fill="#1f2b38">机器</text>
  <text x="673.6" y="166" text-anchor="middle" font-size="11" fill="#1f2b38">ID</text>
  <text x="673.6" y="182" text-anchor="middle" font-size="11" fill="#e08a1e">5 位</text>

  <rect x="705.6" y="120" width="153.6" height="72" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="782.4" y="152" text-anchor="middle" font-size="13" fill="#1f2b38">12 位序列号</text>
  <text x="782.4" y="174" text-anchor="middle" font-size="11" fill="#5b6b7c">同毫秒内自增 0~4095</text>

  <text x="46.4" y="212" text-anchor="middle" font-size="11" fill="#5b6b7c">bit 63</text>
  <text x="315.2" y="212" text-anchor="middle" font-size="11" fill="#5b6b7c">bit 62 – bit 22</text>
  <text x="609.6" y="212" text-anchor="middle" font-size="11" fill="#5b6b7c">bit 21–17</text>
  <text x="673.6" y="212" text-anchor="middle" font-size="11" fill="#5b6b7c">bit 16–12</text>
  <text x="782.4" y="212" text-anchor="middle" font-size="11" fill="#5b6b7c">bit 11–0</text>

  <line x1="40" y1="240" x2="852" y2="240" stroke="#c8d3e0" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="40" y="258" font-size="11" fill="#5b6b7c">高位</text>
  <text x="859" y="258" text-anchor="end" font-size="11" fill="#5b6b7c">低位</text>

  <rect x="40" y="280" width="250" height="100" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="308" font-size="13" font-weight="700" fill="#1f2b38">单节点吞吐</text>
  <text x="60" y="336" font-size="12" fill="#5b6b7c">同一毫秒最多 4096 个 ID</text>
  <text x="60" y="362" font-size="12" fill="#5b6b7c">约 409.6 万 ID / 秒</text>

  <rect x="325" y="280" width="250" height="100" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="345" y="308" font-size="13" font-weight="700" fill="#1f2b38">集群规模</text>
  <text x="345" y="336" font-size="12" fill="#5b6b7c">5 位数据中心 + 5 位机器</text>
  <text x="345" y="362" font-size="12" fill="#5b6b7c">最多 1024 个节点</text>

  <rect x="610" y="280" width="250" height="100" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="630" y="308" font-size="13" font-weight="700" fill="#1f2b38">时间戳容量</text>
  <text x="630" y="336" font-size="12" fill="#5b6b7c">41 位 ≈ 69.7 年</text>
  <text x="630" y="362" font-size="12" fill="#5b6b7c">需自定义 twepoch 起点</text>
</svg>
