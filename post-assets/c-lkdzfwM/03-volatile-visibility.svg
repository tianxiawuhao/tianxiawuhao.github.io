<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>volatile 的可见性与内存屏障</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">volatile 的可见性与内存屏障</text>
  <rect x="120" y="60" width="660" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="92" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2b38">线程 A：写 volatile 变量 v = 1</text>
  <text x="450" y="118" text-anchor="middle" font-size="11.5" fill="#5b6b7c">先写入工作内存，volatile 写会把值立即刷新到主存</text>
  <line x1="450" y1="142" x2="450" y2="176" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="468" y="165" font-size="11.5" fill="#e08a1e">volatile 写 + StoreLoad 屏障</text>
  <rect x="120" y="178" width="660" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="210" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2b38">主存（共享变量）：v = 1</text>
  <text x="450" y="236" text-anchor="middle" font-size="11.5" fill="#5b6b7c">屏障保证屏障之前的普通写（如 x = 1）也一并对其他线程可见</text>
  <line x1="450" y1="260" x2="450" y2="294" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="468" y="283" font-size="11.5" fill="#e08a1e">volatile 读 + 读屏障</text>
  <rect x="120" y="296" width="660" height="80" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="328" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2b38">线程 B：读 v</text>
  <text x="450" y="354" text-anchor="middle" font-size="11.5" fill="#5b6b7c">看到 v == 1 后，再去读 x 也一定能读到最新值</text>
  <text x="450" y="408" text-anchor="middle" font-size="12" fill="#e08a1e">注意：volatile 只保证可见性与有序性，count++ 这类复合操作仍需 synchronized 或 AtomicInteger</text>
</svg>
