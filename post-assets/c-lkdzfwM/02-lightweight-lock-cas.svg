<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>轻量级锁 CAS 操作前后：线程栈与对象头的变化</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">轻量级锁 CAS 操作前后：线程栈与对象头的变化</text>
  <text x="340" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#5b6b7c">CAS 之前：无锁状态</text>
  <text x="720" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">CAS 之后：轻量级锁定</text>
  <rect x="40" y="95" width="120" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="100" y="130" text-anchor="middle" font-size="12.5" fill="#1f2b38">线程栈帧</text>
  <text x="100" y="152" text-anchor="middle" font-size="11" fill="#5b6b7c">Lock Record</text>
  <rect x="40" y="195" width="120" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="100" y="230" text-anchor="middle" font-size="12.5" fill="#1f2b38">对象头</text>
  <text x="100" y="252" text-anchor="middle" font-size="11" fill="#5b6b7c">Mark Word</text>
  <rect x="180" y="95" width="320" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="196" y="127" font-size="12" fill="#1f2b38">Displaced Mark Word：尚未拷贝</text>
  <text x="196" y="152" font-size="11.5" fill="#5b6b7c">owner 指针：—</text>
  <rect x="180" y="195" width="320" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="196" y="227" font-size="12" fill="#1f2b38">锁标志位：01（无锁）</text>
  <text x="196" y="252" font-size="11.5" fill="#5b6b7c">偏向位 0，线程 ID：—</text>
  <rect x="560" y="95" width="320" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="576" y="127" font-size="12" fill="#1f2b38">Displaced Mark Word：对象原值副本</text>
  <text x="576" y="152" font-size="11.5" fill="#5b6b7c">owner 指针：指向对象 Mark Word</text>
  <rect x="560" y="195" width="320" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="576" y="227" font-size="12" fill="#1f2b38">锁标志位：00（轻量级锁）</text>
  <text x="576" y="252" font-size="11.5" fill="#5b6b7c">存储内容：指向本线程 Lock Record</text>
  <line x1="505" y1="235" x2="553" y2="235" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="529" y="222" text-anchor="middle" font-size="11" fill="#2e9e5b">CAS</text>
  <text x="529" y="258" text-anchor="middle" font-size="11" fill="#2e9e5b">成功</text>
  <text x="450" y="325" text-anchor="middle" font-size="12" fill="#e08a1e">CAS 失败说明存在锁竞争，轻量级锁会膨胀为重量级锁（标志位变为 10）</text>
</svg>
