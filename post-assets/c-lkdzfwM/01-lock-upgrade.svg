<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>synchronized 锁升级路径（单向不可逆）</title>
  <rect width="900" height="290" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">synchronized 锁升级路径（单向不可逆）</text>
  <rect x="40" y="105" width="180" height="90" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">无锁</text>
  <text x="130" y="166" text-anchor="middle" font-size="11.5" fill="#5b6b7c">标志位 01</text>
  <text x="130" y="185" text-anchor="middle" font-size="11.5" fill="#5b6b7c">偏向位 0</text>
  <rect x="250" y="105" width="180" height="90" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">偏向锁</text>
  <text x="340" y="166" text-anchor="middle" font-size="11.5" fill="#5b6b7c">标志位 01</text>
  <text x="340" y="185" text-anchor="middle" font-size="11.5" fill="#5b6b7c">偏向位 1</text>
  <rect x="460" y="105" width="180" height="90" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="550" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">轻量级锁</text>
  <text x="550" y="166" text-anchor="middle" font-size="11.5" fill="#5b6b7c">标志位 00</text>
  <text x="550" y="185" text-anchor="middle" font-size="11.5" fill="#5b6b7c">CAS + 自旋</text>
  <rect x="670" y="105" width="180" height="90" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="760" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">重量级锁</text>
  <text x="760" y="166" text-anchor="middle" font-size="11.5" fill="#5b6b7c">标志位 10</text>
  <text x="760" y="185" text-anchor="middle" font-size="11.5" fill="#5b6b7c">互斥量 / 阻塞</text>
  <line x1="222" y1="150" x2="246" y2="150" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="432" y1="150" x2="456" y2="150" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="642" y1="150" x2="666" y2="150" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="227" text-anchor="middle" font-size="12" fill="#e08a1e">竞争加剧时锁只能由低到高升级，不会降级</text>
  <text x="450" y="255" text-anchor="middle" font-size="12" fill="#5b6b7c">JDK 6 起默认开启偏向锁与轻量级锁；JDK 15 起偏向锁被废弃并默认关闭（JEP 374）。</text>
</svg>
