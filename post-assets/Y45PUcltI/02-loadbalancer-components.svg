<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>负载均衡核心组件与 Ribbon → Spring Cloud LoadBalancer 演进</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">负载均衡核心组件与 Ribbon → Spring Cloud LoadBalancer 演进</text>
  <rect x="24" y="52" width="412" height="392" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="78" font-size="13.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">Ribbon（Hoxton 及以前）</text>
  <rect x="40" y="92" width="380" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.3"/>
  <text x="230" y="116" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">ILoadBalancer</text>
  <text x="230" y="135" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">负载均衡器：chooseServer(key)</text>
  <rect x="40" y="160" width="380" height="56" rx="8" fill="#eef4ff" stroke="#7a5bd0" stroke-width="1.3"/>
  <text x="230" y="184" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">IRule</text>
  <text x="230" y="203" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">负载均衡策略：默认 ZoneAvoidanceRule</text>
  <rect x="40" y="228" width="380" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.3"/>
  <text x="230" y="252" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">ServerList / ServerListFilter</text>
  <text x="230" y="271" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">从 Nacos 拉取并过滤实例列表</text>
  <rect x="40" y="296" width="380" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.3"/>
  <text x="230" y="320" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">ServerListUpdater</text>
  <text x="230" y="339" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">定时刷新：默认 30 秒一次</text>
  <rect x="40" y="364" width="380" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.3"/>
  <text x="230" y="388" font-size="11.5" font-weight="700" fill="#1f2b38" text-anchor="middle">ZoneAwareLoadBalancer</text>
  <text x="230" y="407" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">多可用区下的 Zone 感知实现</text>
  <rect x="464" y="52" width="412" height="392" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="670" y="78" font-size="13.5" font-weight="700" fill="#7a5bd0" text-anchor="middle">Spring Cloud LoadBalancer（2020.0+）</text>
  <rect x="480" y="92" width="380" height="56" rx="8" fill="#eef4ff" stroke="#7a5bd0" stroke-width="1.3"/>
  <text x="670" y="116" font-size="10.8" font-weight="700" fill="#1f2b38" text-anchor="middle">LoadBalancerClient</text>
  <text x="670" y="135" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">统一入口：choose(serviceId)</text>
  <rect x="480" y="160" width="380" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.3"/>
  <text x="670" y="184" font-size="10.8" font-weight="700" fill="#1f2b38" text-anchor="middle">ReactorLoadBalancer</text>
  <text x="670" y="203" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">响应式负载均衡器抽象</text>
  <rect x="480" y="228" width="380" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.3"/>
  <text x="670" y="252" font-size="10.8" font-weight="700" fill="#1f2b38" text-anchor="middle">ReactorServiceInstanceLoadBalancer</text>
  <text x="670" y="271" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">策略：默认 RoundRobinLoadBalancer</text>
  <rect x="480" y="296" width="380" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.3"/>
  <text x="670" y="320" font-size="10.8" font-weight="700" fill="#1f2b38" text-anchor="middle">ServiceInstanceListSupplier</text>
  <text x="670" y="339" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">实例来源：DiscoveryClient + 缓存</text>
  <rect x="480" y="364" width="380" height="56" rx="8" fill="#eef4ff" stroke="#7a5bd0" stroke-width="1.3"/>
  <text x="670" y="388" font-size="10.8" font-weight="700" fill="#1f2b38" text-anchor="middle">LoadBalancerCacheManager</text>
  <text x="670" y="407" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">实例列表缓存：默认 35 秒</text>
</svg>
