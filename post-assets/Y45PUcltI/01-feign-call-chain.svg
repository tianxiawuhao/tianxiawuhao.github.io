<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>@FeignClient 动态代理生成与负载均衡调用链路</title>
  <rect width="900" height="600" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">@FeignClient 动态代理生成与负载均衡调用链路</text>
  <rect x="24" y="52" width="6" height="252" rx="3" fill="#2f6fd0"/>
  <text x="38" y="76" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="start">启动阶段：生成代理对象</text>
  <rect x="24" y="338" width="6" height="252" rx="3" fill="#7a5bd0"/>
  <text x="38" y="362" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="start">运行阶段：一次远程调用</text>
  <rect x="24" y="88" width="204" height="74" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="126" y="112" font-size="11.5" font-weight="400" fill="#1f2b38" text-anchor="middle">@EnableFeignClients</text>
  <text x="126" y="130" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">@Import(FeignClientsRegistrar)</text>
  <text x="126" y="147" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">扫描 @FeignClient 接口</text>
  <rect x="246" y="88" width="204" height="74" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="348" y="112" font-size="11.5" font-weight="400" fill="#1f2b38" text-anchor="middle">FeignClientsRegistrar</text>
  <text x="348" y="130" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">registerBeanDefinitions()</text>
  <text x="348" y="147" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">registerFeignClient()</text>
  <rect x="468" y="88" width="204" height="74" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="570" y="112" font-size="11.5" font-weight="400" fill="#1f2b38" text-anchor="middle">FeignClientFactoryBean</text>
  <text x="570" y="130" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">getObject() → getTarget()</text>
  <text x="570" y="147" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">FactoryBean 定制化</text>
  <rect x="690" y="88" width="186" height="74" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="783" y="112" font-size="11.5" font-weight="400" fill="#1f2b38" text-anchor="middle">代理对象</text>
  <text x="783" y="130" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">JDK 动态代理</text>
  <text x="783" y="147" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">ReflectiveFeign</text>
  <line x1="228" y1="125" x2="242" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="450" y1="125" x2="464" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="672" y1="125" x2="686" y2="125" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="24" y="182" width="852" height="106" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="450" y="206" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">代理对象内部的方法调用链（Feign 的四大组件）</text>
  <rect x="42" y="222" width="196" height="54" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.3"/>
  <text x="140" y="244" font-size="11.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">Contract</text>
  <text x="140" y="263" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">解析 SpringMVC 注解</text>
  <rect x="248" y="222" width="196" height="54" rx="8" fill="#ffffff" stroke="#7a5bd0" stroke-width="1.3"/>
  <text x="346" y="244" font-size="11.5" font-weight="700" fill="#7a5bd0" text-anchor="middle">Encoder / Decoder</text>
  <text x="346" y="263" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">请求体编码、响应体解码</text>
  <rect x="454" y="222" width="196" height="54" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.3"/>
  <text x="552" y="244" font-size="11.5" font-weight="700" fill="#e08a1e" text-anchor="middle">RequestInterceptor</text>
  <text x="552" y="263" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">统一加 header / token</text>
  <rect x="660" y="222" width="196" height="54" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.3"/>
  <text x="758" y="244" font-size="11.5" font-weight="700" fill="#2e9e5b" text-anchor="middle">Retryer</text>
  <text x="758" y="263" font-size="10.8" font-weight="400" fill="#5b6b7c" text-anchor="middle">重试策略（默认关闭）</text>
  <line x1="570" y1="162" x2="570" y2="178" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="60" y1="288" x2="60" y2="334" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="24" y="338" width="252" height="220" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="150" y="362" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">调用代理方法</text>
  <text x="150" y="388" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">SynchronousMethodHandler</text>
  <text x="150" y="414" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">RequestTemplate → Request</text>
  <text x="150" y="440" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">Contract 解析方法元数据</text>
  <text x="150" y="466" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">RequestInterceptor 加工请求头</text>
  <text x="150" y="492" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">Encoder 编码请求体</text>
  <rect x="300" y="338" width="252" height="220" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="426" y="362" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">Client 执行（负载均衡）</text>
  <text x="426" y="388" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">Ribbon 版本：</text>
  <text x="426" y="414" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">LoadBalancerFeignClient</text>
  <text x="426" y="440" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">2020.0+ 版本：</text>
  <text x="426" y="466" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">FeignBlockingLoadBalancerClient</text>
  <text x="426" y="492" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">选实例 → 拼最终 URL</text>
  <rect x="576" y="338" width="300" height="220" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="726" y="362" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">目标实例与响应</text>
  <text x="726" y="388" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">http://10.206.73.156:1111/order/get/100</text>
  <text x="726" y="414" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">HTTP 调用 → 返回 Response</text>
  <text x="726" y="440" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">Decoder 解析响应体</text>
  <text x="726" y="466" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">异常交给 Retryer 处理</text>
  <text x="726" y="492" font-size="10.5" font-family="DejaVu Sans Mono, monospace" fill="#5b6b7c" text-anchor="middle">（默认关闭，不重试）</text>
  <line x1="276" y1="448" x2="296" y2="448" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="552" y1="448" x2="572" y2="448" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
</svg>
