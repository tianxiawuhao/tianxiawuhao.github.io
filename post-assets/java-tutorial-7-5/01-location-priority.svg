<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Nginx location 的四步匹配顺序</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">location 匹配顺序：精确 → 最长前缀 → 首个正则 → 回退</text>

  <rect x="40" y="70" width="380" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">① = 精确匹配</text>
  <text x="230" y="118" text-anchor="middle" font-size="11.5" fill="#5b6b7c">如 = /health</text>

  <rect x="460" y="70" width="400" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="96" font-size="11.5" fill="#1f2b38">命中即返回，跳过其余全部匹配</text>
  <text x="480" y="118" font-size="11.5" fill="#5b6b7c">性能最好，适合首页与健康检查</text>

  <line x1="230" y1="132" x2="230" y2="148" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="150" width="380" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">② 前缀匹配，记住最长的那条</text>
  <text x="230" y="198" text-anchor="middle" font-size="11.5" fill="#5b6b7c">^~ /static/ 命中后不再看正则</text>

  <rect x="460" y="150" width="400" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="176" font-size="11.5" fill="#1f2b38">普通前缀只是候选，先记下来</text>
  <text x="480" y="198" font-size="11.5" fill="#5b6b7c">轮到正则时不立即生效，要等③</text>

  <line x1="230" y1="212" x2="230" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="230" width="380" height="62" rx="8" fill="#eef4ff" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="230" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">③ 按书写顺序试正则</text>
  <text x="230" y="278" text-anchor="middle" font-size="11.5" fill="#5b6b7c">~ 区分大小写，~* 不区分</text>

  <rect x="460" y="230" width="400" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="256" font-size="11.5" fill="#1f2b38">第一个命中的正则立即生效</text>
  <text x="480" y="278" font-size="11.5" fill="#5b6b7c">所以正则的先后顺序会改变结果</text>

  <line x1="230" y1="292" x2="230" y2="308" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="40" y="310" width="380" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="230" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">④ 回退到记住的最长前缀</text>
  <text x="230" y="358" text-anchor="middle" font-size="11.5" fill="#5b6b7c">一个正则都没命中时才走这里</text>

  <rect x="460" y="310" width="400" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="336" font-size="11.5" fill="#1f2b38">都没有就用 location / 兜底</text>
  <text x="480" y="358" font-size="11.5" fill="#5b6b7c">写成 return 404，避免意外暴露</text>
</svg>
