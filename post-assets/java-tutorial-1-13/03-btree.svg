<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>B 树与 B+ 树的结构差异，以及 B+ 树为什么适合做数据库索引</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">B 树 vs B+ 树：为什么数据库索引用 B+ 树</text>

  <text x="60" y="62" font-size="13" fill="#2f6fd0" text-anchor="start" font-weight="700">B 树：每个节点都存 key 和 data</text>
  <rect x="150" y="74" width="180" height="36" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="97" font-size="12" fill="#1f2b38" text-anchor="middle">17 | 35</text>
  <line x1="190" y1="110" x2="120" y2="140" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="240" y1="110" x2="240" y2="140" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="290" y1="110" x2="360" y2="140" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="60" y="144" width="120" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="120" y="166" font-size="11.5" fill="#1f2b38" text-anchor="middle">8 | 12</text>
  <rect x="180" y="144" width="120" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="166" font-size="11.5" fill="#1f2b38" text-anchor="middle">20 | 28</text>
  <rect x="300" y="144" width="120" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="360" y="166" font-size="11.5" fill="#1f2b38" text-anchor="middle">40 | 55</text>
  <text x="60" y="202" font-size="11.5" fill="#5b6b7c" text-anchor="start">查找可能在内部节点就命中，路径更短；但每个节点都要额外存 data，</text>
  <text x="60" y="222" font-size="11.5" fill="#5b6b7c" text-anchor="start">且范围查询需要在树上反复回溯。</text>

  <line x1="40" y1="242" x2="860" y2="242" stroke="#c8d3e0" stroke-width="1.4"/>

  <text x="60" y="272" font-size="13" fill="#2e9e5b" text-anchor="start" font-weight="700">B+ 树：内部节点只存 key，data 全在叶子，叶子间有链表</text>
  <rect x="150" y="284" width="180" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="240" y="307" font-size="12" fill="#1f2b38" text-anchor="middle">17 | 35（只做导航）</text>
  <line x1="190" y1="320" x2="120" y2="348" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="240" y1="320" x2="240" y2="348" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="290" y1="320" x2="360" y2="348" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="40" y="352" width="150" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="115" y="375" font-size="11.5" fill="#1f2b38" text-anchor="middle">8 → 12 → 17</text>
  <rect x="200" y="352" width="150" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="275" y="375" font-size="11.5" fill="#1f2b38" text-anchor="middle">17 → 20 → 28 → 35</text>
  <rect x="360" y="352" width="150" height="36" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="435" y="375" font-size="11.5" fill="#1f2b38" text-anchor="middle">35 → 40 → 55</text>
  <line x1="192" y1="370" x2="198" y2="370" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="352" y1="370" x2="358" y2="370" stroke="#2e9e5b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="540" y="284" width="320" height="104" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="560" y="306" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">B+ 树更适合索引的三个原因</text>
  <text x="560" y="328" font-size="11.5" fill="#5b6b7c" text-anchor="start">1　内部节点不存 data，同样 16KB 页能装下更多 key，</text>
  <text x="560" y="346" font-size="11.5" fill="#5b6b7c" text-anchor="start">　　树更矮，磁盘 IO 次数更少。</text>
  <text x="560" y="364" font-size="11.5" fill="#5b6b7c" text-anchor="start">2　叶子成链表，范围查询顺序扫描即可，不必回溯。</text>
  <text x="560" y="382" font-size="11.5" fill="#5b6b7c" text-anchor="start">3　每次查询都要走到叶子，开销稳定可预测。</text>

  <rect x="40" y="404" width="820" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="424" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">和红黑树的区别：</text>
  <text x="152" y="424" font-size="11.5" fill="#5b6b7c" text-anchor="start">红黑树是二叉、内存结构、每个节点一个 key；B/B+ 树是多路平衡树，一个节点几百个 key，为磁盘页设计。</text>
  <text x="60" y="442" font-size="11.5" fill="#5b6b7c" text-anchor="start">MySQL InnoDB 的聚簇索引就是 B+ 树：叶子节点直接存整行数据，二级索引叶子存主键值（所以查非索引列要「回表」）。</text>
</svg>
