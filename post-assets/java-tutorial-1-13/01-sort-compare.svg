<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>八大排序算法的时间复杂度、空间复杂度与稳定性对照</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">八大排序算法对照：复杂度与稳定性怎么选</text>

  <text x="45" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">算法</text>
  <text x="215" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">平均</text>
  <text x="305" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">最坏</text>
  <text x="395" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">最好</text>
  <text x="485" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">空间</text>
  <text x="570" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">稳定性</text>
  <text x="665" y="62" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="700">一句话特征</text>
  <rect x="40" y="70" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="82" width="820" height="36" fill="#eef4ff"/>
  <text x="45" y="105" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">冒泡排序</text>
  <text x="215" y="105" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="305" y="105" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="395" y="105" font-size="12" fill="#1f2b38" text-anchor="start">O(n)</text>
  <text x="485" y="105" font-size="12" fill="#1f2b38" text-anchor="start">O(1)</text>
  <text x="570" y="105" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">稳定</text>
  <text x="665" y="105" font-size="11.5" fill="#5b6b7c" text-anchor="start">相邻比较；加标志位可提前结束</text>

  <rect x="40" y="118" width="820" height="36" fill="#ffffff"/>
  <text x="45" y="141" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">选择排序</text>
  <text x="215" y="141" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="305" y="141" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="395" y="141" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="485" y="141" font-size="12" fill="#1f2b38" text-anchor="start">O(1)</text>
  <text x="570" y="141" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">不稳定</text>
  <text x="665" y="141" font-size="11.5" fill="#5b6b7c" text-anchor="start">交换次数最少（最多 n-1 次）</text>

  <rect x="40" y="154" width="820" height="36" fill="#eef4ff"/>
  <text x="45" y="177" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">插入排序</text>
  <text x="215" y="177" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="305" y="177" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="395" y="177" font-size="12" fill="#1f2b38" text-anchor="start">O(n)</text>
  <text x="485" y="177" font-size="12" fill="#1f2b38" text-anchor="start">O(1)</text>
  <text x="570" y="177" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">稳定</text>
  <text x="665" y="177" font-size="11.5" fill="#5b6b7c" text-anchor="start">近乎有序时最快，小数组首选</text>

  <rect x="40" y="190" width="820" height="36" fill="#ffffff"/>
  <text x="45" y="213" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">希尔排序</text>
  <text x="215" y="213" font-size="12" fill="#1f2b38" text-anchor="start">约 O(n^1.3)</text>
  <text x="305" y="213" font-size="12" fill="#1f2b38" text-anchor="start">O(n²)</text>
  <text x="395" y="213" font-size="12" fill="#1f2b38" text-anchor="start">O(n)</text>
  <text x="485" y="213" font-size="12" fill="#1f2b38" text-anchor="start">O(1)</text>
  <text x="570" y="213" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">不稳定</text>
  <text x="665" y="213" font-size="11.5" fill="#5b6b7c" text-anchor="start">插入排序的增量版，突破 O(n²)</text>

  <rect x="40" y="226" width="820" height="36" fill="#eef4ff"/>
  <text x="45" y="249" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">归并排序</text>
  <text x="215" y="249" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="305" y="249" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="395" y="249" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="485" y="249" font-size="12" fill="#e08a1e" text-anchor="start">O(n)</text>
  <text x="570" y="249" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">稳定</text>
  <text x="665" y="249" font-size="11.5" fill="#5b6b7c" text-anchor="start">唯一稳定的 O(n log n)；需额外空间</text>

  <rect x="40" y="262" width="820" height="36" fill="#ffffff"/>
  <text x="45" y="285" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">快速排序</text>
  <text x="215" y="285" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="305" y="285" font-size="12" fill="#e08a1e" text-anchor="start">O(n²)</text>
  <text x="395" y="285" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="485" y="285" font-size="12" fill="#1f2b38" text-anchor="start">O(log n)</text>
  <text x="570" y="285" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">不稳定</text>
  <text x="665" y="285" font-size="11.5" fill="#5b6b7c" text-anchor="start">常数最小、实际最快；怕已排序序列</text>

  <rect x="40" y="298" width="820" height="36" fill="#eef4ff"/>
  <text x="45" y="321" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">堆排序</text>
  <text x="215" y="321" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="305" y="321" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="395" y="321" font-size="12" fill="#1f2b38" text-anchor="start">O(n log n)</text>
  <text x="485" y="321" font-size="12" fill="#1f2b38" text-anchor="start">O(1)</text>
  <text x="570" y="321" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">不稳定</text>
  <text x="665" y="321" font-size="11.5" fill="#5b6b7c" text-anchor="start">原地且最坏也是 n log n</text>

  <rect x="40" y="334" width="820" height="36" fill="#ffffff"/>
  <text x="45" y="357" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">计数排序</text>
  <text x="215" y="357" font-size="12" fill="#1f2b38" text-anchor="start">O(n + k)</text>
  <text x="305" y="357" font-size="12" fill="#1f2b38" text-anchor="start">O(n + k)</text>
  <text x="395" y="357" font-size="12" fill="#1f2b38" text-anchor="start">O(n + k)</text>
  <text x="485" y="357" font-size="12" fill="#e08a1e" text-anchor="start">O(k)</text>
  <text x="570" y="357" font-size="12" fill="#2e9e5b" text-anchor="start" font-weight="700">稳定</text>
  <text x="665" y="357" font-size="11.5" fill="#5b6b7c" text-anchor="start">非比较排序；k 为数据取值范围</text>
  <rect x="40" y="370" width="820" height="1.6" fill="#c8d3e0"/>

  <rect x="40" y="384" width="400" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="406" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">稳定性是什么</text>
  <text x="60" y="428" font-size="11.5" fill="#5b6b7c" text-anchor="start">排序前后，值相等的两个元素相对顺序不变，就叫稳定。</text>
  <text x="60" y="448" font-size="11.5" fill="#5b6b7c" text-anchor="start">多关键字排序时很关键：先按金额排、再按时间排，稳定排序能保住</text>
  <text x="60" y="462" font-size="11.5" fill="#5b6b7c" text-anchor="start">前一次的次序。</text>

  <rect x="460" y="384" width="400" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="406" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="700">Java 里怎么选</text>
  <text x="480" y="428" font-size="11.5" fill="#5b6b7c" text-anchor="start">对象数组用 Arrays.sort()：TimSort（归并+插入），稳定；</text>
  <text x="480" y="448" font-size="11.5" fill="#5b6b7c" text-anchor="start">基本类型数组用双轴快排（DualPivotQuicksort），不稳定但更快。</text>
  <text x="480" y="462" font-size="11.5" fill="#5b6b7c" text-anchor="start">要稳定又要 O(n log n)，就选归并排序。</text>
</svg>
