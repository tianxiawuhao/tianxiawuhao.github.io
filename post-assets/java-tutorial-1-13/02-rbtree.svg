<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>红黑树的五条性质与插入时的变色旋转</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">红黑树：用颜色换平衡，插入后靠变色与旋转复原</text>

  <rect x="40" y="50" width="400" height="176" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="74" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">五条性质（缺一不可）</text>
  <text x="60" y="98" font-size="11.5" fill="#5b6b7c" text-anchor="start">1　节点只有红、黑两种颜色</text>
  <text x="60" y="120" font-size="11.5" fill="#5b6b7c" text-anchor="start">2　根节点必须是黑色</text>
  <text x="60" y="142" font-size="11.5" fill="#5b6b7c" text-anchor="start">3　所有叶子节点（NIL）视为黑色</text>
  <text x="60" y="164" font-size="11.5" fill="#5b6b7c" text-anchor="start">4　红节点的两个子节点必须是黑色（不能红红相连）</text>
  <text x="60" y="186" font-size="11.5" fill="#5b6b7c" text-anchor="start">5　任一节点到其所有叶子的路径上，黑节点数目相同</text>
  <text x="60" y="210" font-size="11.5" fill="#e08a1e" text-anchor="start">性质 4 + 5 共同保证：最长路径不超过最短路径的两倍</text>

  <rect x="460" y="50" width="400" height="176" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="480" y="74" font-size="12.5" fill="#2e9e5b" text-anchor="start" font-weight="700">平衡的代价与收益</text>
  <text x="480" y="98" font-size="11.5" fill="#5b6b7c" text-anchor="start">AVL 树要求左右子树高度差不超过 1，查询更快但插入删除</text>
  <text x="480" y="118" font-size="11.5" fill="#5b6b7c" text-anchor="start">旋转更频繁；红黑树放弃严格平衡，换来更少的旋转次数。</text>
  <text x="480" y="142" font-size="11.5" fill="#5b6b7c" text-anchor="start">两者的增删查都是 O(log n)，所以「既要频繁修改又要有序</text>
  <text x="480" y="162" font-size="11.5" fill="#5b6b7c" text-anchor="start">遍历」时选红黑树。</text>
  <text x="480" y="188" font-size="11.5" fill="#1f2b38" text-anchor="start" font-weight="700">Java 中的落点</text>
  <text x="480" y="210" font-size="11.5" fill="#5b6b7c" text-anchor="start">TreeMap / TreeSet / HashMap 的树化桶（链表长度 ≥ 8 且容量 ≥ 64）</text>

  <line x1="40" y1="244" x2="860" y2="244" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="272" font-size="14" fill="#1f2b38" text-anchor="middle" font-weight="700">插入一个红节点后，若出现「红红相连」，按叔叔节点的颜色分两种处理</text>

  <circle cx="200" cy="320" r="17" fill="#1f2b38"/>
  <text x="200" y="325" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">40</text>
  <circle cx="120" cy="380" r="17" fill="#e08a1e"/>
  <text x="120" y="385" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">20</text>
  <line x1="196" y1="336" x2="128" y2="366" stroke="#c8d3e0" stroke-width="1.4"/>
  <circle cx="128" cy="380" r="17" fill="#e08a1e"/>
  <text x="152" y="404" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">新插入的节点</text>

  <line x1="250" y1="350" x2="330" y2="350" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="340" y="300" width="240" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="360" y="324" font-size="12" fill="#e08a1e" text-anchor="start" font-weight="700">情况一：叔叔是红色 → 只变色</text>
  <text x="360" y="346" font-size="11.5" fill="#1f2b38" text-anchor="start">父与叔变黑，祖父变红，再把祖父当作</text>
  <text x="360" y="366" font-size="11.5" fill="#1f2b38" text-anchor="start">新插入节点向上递归检查。</text>
  <text x="360" y="388" font-size="11.5" fill="#5b6b7c" text-anchor="start">不需要旋转，黑高不变。</text>

  <rect x="600" y="300" width="260" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="620" y="324" font-size="12" fill="#2f6fd0" text-anchor="start" font-weight="700">情况二：叔叔是黑色 → 旋转 + 变色</text>
  <text x="620" y="346" font-size="11.5" fill="#1f2b38" text-anchor="start">LL / RR 型：对祖父做一次单旋；</text>
  <text x="620" y="366" font-size="11.5" fill="#1f2b38" text-anchor="start">LR / RL 型：先对父节点旋一次，再对祖父旋一次。</text>
  <text x="620" y="388" font-size="11.5" fill="#5b6b7c" text-anchor="start">旋转后把新的子树根涂黑、其子涂红。</text>

  <text x="40" y="428" font-size="11.5" fill="#5b6b7c" text-anchor="start">记忆法：插入节点默认红色（这样不会改变黑高）；只有出现红红相连才需要调整，叔叔的颜色决定了是「只变色」还是「要旋转」。</text>
</svg>
