<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Sentinel 三种限流实现的原理与差异对比</title>
  <rect width="900" height="700" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Sentinel 三种限流实现对比（1.8.x）</text>

  <!-- panel 1 -->
  <rect x="30" y="55" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="80" font-size="14" font-weight="700" fill="#1f2b38">① 滑动时间窗口</text>
  <text x="50" y="99" font-size="11.5" fill="#2f6fd0">LeapArray / ArrayMetric，默认 2 格 × 500ms</text>
  <rect x="55" y="118" width="175" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="142" y="150" text-anchor="middle" font-size="12" fill="#1f2b38">小窗口 500ms</text>
  <text x="142" y="167" text-anchor="middle" font-size="11" fill="#5b6b7c">窗口 A 计数</text>
  <rect x="230" y="118" width="175" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="317" y="150" text-anchor="middle" font-size="12" fill="#1f2b38">小窗口 500ms</text>
  <text x="317" y="167" text-anchor="middle" font-size="11" fill="#5b6b7c">窗口 B 计数</text>
  <line x1="230" y1="110" x2="230" y2="176" stroke="#2f6fd0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="55" y1="192" x2="405" y2="192" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="55" y1="188" x2="55" y2="196" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="405" y1="188" x2="405" y2="196" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">统计跨度 Interval = 1000ms</text>
  <line x1="260" y1="228" x2="260" y2="248" stroke="#7a5bd0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="270" y="245" font-size="11" fill="#7a5bd0">统计范围 = 当前时间往前 1 秒内的小窗口之和</text>
  <text x="50" y="278" font-size="11.5" fill="#1f2b38">• 每秒最多放行 count 个请求，超出即快速失败</text>
  <text x="50" y="299" font-size="11.5" fill="#1f2b38">• 对应 DefaultController；改阈值曲线即 WarmUpController</text>
  <text x="50" y="320" font-size="11.5" fill="#2f6fd0">• 粒度由 sampleCount 决定，N 越大越平滑</text>
  <text x="50" y="341" font-size="11.5" fill="#1f2b38">• 无排队、无桶结构，只做计数与求和</text>

  <!-- panel 2 -->
  <rect x="470" y="55" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="80" font-size="14" font-weight="700" fill="#1f2b38">② 令牌桶</text>
  <text x="490" y="99" font-size="11.5" fill="#2f6fd0">ParamFlowChecker，热点参数限流专用</text>
  <text x="500" y="132" font-size="11.5" fill="#5b6b7c">按固定速率补充令牌</text>
  <line x1="500" y1="142" x2="640" y2="142" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="660" y="146" font-size="11" fill="#2e9e5b">token / 秒</text>
  <rect x="500" y="168" width="140" height="98" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="570" y="189" text-anchor="middle" font-size="11.5" fill="#1f2b38">桶容量 maxCount</text>
  <circle cx="537" cy="220" r="7" fill="#2e9e5b"/>
  <circle cx="567" cy="220" r="7" fill="#2e9e5b"/>
  <circle cx="597" cy="220" r="7" fill="#2e9e5b"/>
  <line x1="570" y1="268" x2="570" y2="292" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="582" y="286" font-size="11" fill="#5b6b7c">请求取令牌</text>
  <text x="660" y="222" font-size="11.5" fill="#1f2b38">每个参数值一个“桶”</text>
  <text x="660" y="242" font-size="11.5" fill="#1f2b38">令牌按 durationInSec 折算</text>
  <text x="490" y="320" font-size="11.5" fill="#1f2b38">• 桶内令牌数 = min(补充量 + 余量, maxCount)</text>
  <text x="490" y="341" font-size="11.5" fill="#1f2b38">• 允许一定突发（burstCount）后转入平稳</text>

  <!-- panel 3 -->
  <rect x="30" y="375" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="400" font-size="14" font-weight="700" fill="#1f2b38">③ 漏桶（流量整形）</text>
  <text x="50" y="419" font-size="11.5" fill="#2f6fd0">RateLimiterController，排队等待才生效</text>
  <path d="M 100 445 L 260 445 L 240 565 L 120 565 Z" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <circle cx="147" cy="490" r="7" fill="#2f6fd0"/>
  <circle cx="177" cy="490" r="7" fill="#2f6fd0"/>
  <circle cx="207" cy="490" r="7" fill="#2f6fd0"/>
  <circle cx="147" cy="520" r="7" fill="#2f6fd0"/>
  <circle cx="177" cy="520" r="7" fill="#2f6fd0"/>
  <text x="180" y="552" text-anchor="middle" font-size="11" fill="#5b6b7c">请求在排队</text>
  <line x1="180" y1="565" x2="180" y2="600" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="196" y="588" font-size="11" fill="#2f6fd0">固定时间间隔放行一个</text>
  <line x1="285" y1="462" x2="330" y2="462" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="338" y="466" font-size="11" fill="#e08a1e">等待超时</text>
  <text x="338" y="484" font-size="11" fill="#e08a1e">即拒绝</text>
  <text x="50" y="628" font-size="11.5" fill="#1f2b38">• 不是真的维护队列，只计算 expectedTime</text>
  <text x="50" y="649" font-size="11.5" fill="#1f2b38">• 超时用 Thread.sleep(waitTime) 自行等待</text>
  <text x="50" y="670" font-size="11.5" fill="#5b6b7c">• 代价：占用请求线程，maxQueueingTimeMs 需谨慎</text>

  <!-- panel 4 -->
  <rect x="470" y="375" width="400" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="400" font-size="14" font-weight="700" fill="#1f2b38">④ 三者的关键差异</text>
  <text x="490" y="419" font-size="11.5" fill="#5b6b7c">同样是 5 QPS：间隔 200ms 放行一个请求</text>
  <rect x="490" y="436" width="360" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="504" y="455" font-size="11.5" fill="#1f2b38">滑动窗口：秒内累加计数，超过阈值立刻拒绝</text>
  <text x="504" y="470" font-size="11" fill="#5b6b7c">无状态外溢，最省内存，但有窗口边界误差</text>
  <rect x="490" y="486" width="360" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="504" y="505" font-size="11.5" fill="#1f2b38">令牌桶：按秒匀速补充，允许瞬间拿多个令牌</text>
  <text x="504" y="520" font-size="11" fill="#5b6b7c">适合突发流量，桶容量决定可突发上限</text>
  <rect x="490" y="536" width="360" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="504" y="555" font-size="11.5" fill="#1f2b38">漏桶：出口速率恒定，入口突发被整形为平稳</text>
  <text x="504" y="570" font-size="11" fill="#5b6b7c">以等待换平稳，等待超时后仍会拒绝</text>
  <rect x="490" y="586" width="360" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="504" y="605" font-size="11.5" fill="#1f2b38">快速失败：不做缓冲，直接抛 FlowException</text>
  <text x="504" y="620" font-size="11" fill="#5b6b7c">默认策略，响应最快，由调用方决定降级动作</text>
  <text x="490" y="655" font-size="11.5" fill="#5b6b7c">三者共用同一套 FlowRule，通过 controlBehavior 选择控制器</text>
</svg>
