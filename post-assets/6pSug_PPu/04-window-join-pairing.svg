<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>窗口联结的配对时机：窗口结束时对两条流的数据做笛卡尔积并逐对调用 JoinFunction</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">窗口联结（Window Join）的配对时机</text>

  <rect x="50" y="55" width="800" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="70" y="80" font-size="12" font-weight="700" fill="#1f2b38">keyBy 分组并进入窗口缓存</text>
  <rect x="70" y="88" width="200" height="26" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="170" y="105" text-anchor="middle" font-size="11" fill="#1f2b38">key=a：2 条</text>
  <rect x="285" y="88" width="200" height="26" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="385" y="105" text-anchor="middle" font-size="11" fill="#1f2b38">key=b：2 条</text>
  <rect x="500" y="88" width="200" height="26" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="600" y="105" text-anchor="middle" font-size="11" fill="#1f2b38">key=c：1 条（流 A）</text>

  <line x1="450" y1="125" x2="450" y2="159" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="640" y="147" text-anchor="middle" font-size="11" fill="#5b6b7c">到达窗口结束时间时触发</text>

  <rect x="250" y="160" width="400" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">按 key 枚举两条流数据的全部组合（笛卡尔积）</text>

  <path d="M 360 206 L 180 239" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 206 L 450 239" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 540 206 L 720 239" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="50" y="240" width="260" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="180" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">key=a</text>
  <text x="180" y="286" text-anchor="middle" font-size="11" fill="#5b6b7c">2 × 2 = 4 对</text>
  <text x="180" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">每对调用一次 join()</text>
  <rect x="330" y="240" width="240" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">key=b</text>
  <text x="450" y="286" text-anchor="middle" font-size="11" fill="#5b6b7c">2 × 2 = 4 对</text>
  <text x="450" y="303" text-anchor="middle" font-size="11" fill="#5b6b7c">逐对输出结果</text>
  <rect x="590" y="240" width="260" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="720" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">key=c</text>
  <text x="720" y="286" text-anchor="middle" font-size="11" fill="#5b6b7c">另一条流没有 key=c</text>
  <text x="720" y="303" text-anchor="middle" font-size="11" fill="#e08a1e">不调用 join()，无输出</text>

  <line x1="450" y1="312" x2="450" y2="345" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="200" y="346" width="500" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">输出流：只有配对成功的数据才会进入下游</text>

  <rect x="50" y="404" width="800" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="70" y="426" font-size="11" fill="#1f2b38">这正对应 SQL 的 inner join：某一窗口中一条流的数据若在另一条流中没有同 key 数据，就不会有任何输出。</text>
  <text x="70" y="446" font-size="11" fill="#5b6b7c">组合数由窗口内数据量决定，数据倾斜或窗口过大时会产生大量配对，需要注意状态大小与输出放大。</text>
</svg>
