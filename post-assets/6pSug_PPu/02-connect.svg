<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 连接（connect）算子示意图：两条类型不同的流对接后由 CoProcessFunction 处理</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">连接（connect）：两条异类型流对接后再协同处理</text>

  <rect x="60" y="80" width="250" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">流 A：DataStream&lt;T1&gt;</text>
  <rect x="60" y="220" width="250" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">流 B：DataStream&lt;T2&gt;</text>

  <path d="M 310 100 L 465 128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 310 240 L 465 212" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="470" y="110" width="210" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="575" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">connect()</text>
  <text x="575" y="157" text-anchor="middle" font-size="11" fill="#5b6b7c">ConnectedStreams&lt;T1, T2&gt;</text>
  <text x="575" y="179" text-anchor="middle" font-size="11" fill="#5b6b7c">两条流仍各自独立</text>
  <text x="575" y="199" text-anchor="middle" font-size="11" fill="#5b6b7c">必须再接同处理算子</text>
  <text x="575" y="219" text-anchor="middle" font-size="11" fill="#e08a1e">如 CoProcessFunction / CoMap</text>

  <line x1="680" y1="170" x2="734" y2="170" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="740" y="130" width="120" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="800" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">输出流</text>
  <text x="800" y="178" text-anchor="middle" font-size="11" fill="#5b6b7c">DataStream&lt;R&gt;</text>
  <text x="800" y="196" text-anchor="middle" font-size="11" fill="#5b6b7c">类型可自定义</text>

  <rect x="60" y="305" width="800" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="80" y="329" font-size="11" fill="#1f2b38">要点：connect 允许两条流的元素类型不同，但一个 DataStream 内部类型仍然唯一，所以必须再接协同处理算子。</text>
  <text x="80" y="349" font-size="11" fill="#5b6b7c">两条流各自触发处理逻辑，若要共享状态或按 key 配对，先各自 keyBy 再 connect，可配合状态与定时器使用。</text>
  <text x="80" y="368" font-size="11" fill="#5b6b7c">底层上，窗口 join 与 coGroup 都由 connect + 协同处理实现，connect 是最灵活的一层。</text>
</svg>
