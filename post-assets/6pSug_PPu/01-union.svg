<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 联合（union）算子示意图：两条同类型流合并为一条流</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">联合（union）：同类型流直接合并</text>

  <rect x="60" y="70" width="250" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">流 A：DataStream&lt;T&gt;</text>
  <rect x="60" y="160" width="250" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">流 B：DataStream&lt;T&gt;</text>
  <rect x="60" y="250" width="250" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="185" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">流 C：DataStream&lt;T&gt;</text>

  <path d="M 310 90 L 485 166" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 310 180 L 485 180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 310 270 L 485 194" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="490" y="150" width="150" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="565" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">union()</text>
  <text x="565" y="197" text-anchor="middle" font-size="11" fill="#5b6b7c">不改变数据类型</text>

  <line x1="640" y1="180" x2="694" y2="180" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="700" y="140" width="160" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="780" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">合并流</text>
  <text x="780" y="188" text-anchor="middle" font-size="11" fill="#5b6b7c">DataStream&lt;T&gt;</text>
  <text x="780" y="206" text-anchor="middle" font-size="11" fill="#5b6b7c">包含 A、B、C 全部元素</text>

  <rect x="60" y="315" width="800" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="80" y="339" font-size="11" fill="#1f2b38">要点：参与 union 的流数据类型必须完全相同，合并后类型不变；它只是把元素放在一起，不按 key 配对、不做窗口对齐。</text>
  <text x="80" y="360" font-size="11" fill="#5b6b7c">因此 union 不保证元素之间的先后顺序，实践中多用于把多路同构数据汇成一路继续处理。</text>
</svg>
