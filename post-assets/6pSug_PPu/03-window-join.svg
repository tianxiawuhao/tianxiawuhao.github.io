<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Flink 基于时间的合流：窗口联结与间隔联结示意图</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">基于时间的合流：窗口联结与间隔联结</text>

  <text x="60" y="66" font-size="13" font-weight="700" fill="#1f2b38">窗口联结（Window Join）：同一窗口内按 key 做组合配对</text>
  <line x1="60" y1="80" x2="840" y2="80" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="114" font-size="12" fill="#1f2b38">流 A</text>
  <text x="60" y="152" font-size="12" fill="#1f2b38">流 B</text>
  <line x1="130" y1="105" x2="790" y2="105" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="130" y1="143" x2="790" y2="143" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="130" y1="88" x2="130" y2="160" stroke="#5b6b7c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="460" y1="88" x2="460" y2="160" stroke="#5b6b7c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="790" y1="88" x2="790" y2="160" stroke="#5b6b7c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="130" y="72" width="330" height="14" rx="7" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="295" y="83" text-anchor="middle" font-size="11" fill="#1f2b38">窗口 1：[0, 5s)</text>
  <rect x="460" y="72" width="330" height="14" rx="7" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="625" y="83" text-anchor="middle" font-size="11" fill="#1f2b38">窗口 2：[5s, 10s)</text>
  <circle cx="225" cy="105" r="5" fill="#2f6fd0"/>
  <circle cx="525" cy="105" r="5" fill="#2f6fd0"/>
  <circle cx="255" cy="143" r="5" fill="#2e9e5b"/>
  <circle cx="555" cy="143" r="5" fill="#2e9e5b"/>
  <text x="796" y="166" font-size="11" fill="#5b6b7c">时间 →</text>
  <path d="M 225 110 L 253 138" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 525 110 L 553 138" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="790" y="190" text-anchor="end" font-size="11" fill="#e08a1e">窗口结束时按 key 组合（笛卡尔积）配对</text>
  <rect x="60" y="180" width="800" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="80" y="204" font-size="11" fill="#1f2b38">输出：只有两条流在同一窗口内按 key 配对成功的数据才会交给 JoinFunction 处理，因此类似 SQL 的 inner join。</text>
  <text x="80" y="226" font-size="11" fill="#5b6b7c">调用形式：stream1.join(stream2).where(keyA).equalTo(keyB).window(assigner).apply(JoinFunction)</text>

  <text x="60" y="286" font-size="13" font-weight="700" fill="#1f2b38">间隔联结（Interval Join）：按每条数据的时间戳取一段区间</text>
  <line x1="60" y1="300" x2="840" y2="300" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="330" font-size="12" fill="#1f2b38">流 A</text>
  <text x="60" y="430" font-size="12" fill="#1f2b38">流 B</text>
  <line x1="130" y1="324" x2="790" y2="324" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="130" y1="420" x2="790" y2="420" stroke="#c8d3e0" stroke-width="1.2"/>
  <circle cx="350" cy="324" r="5" fill="#2f6fd0"/>
  <text x="350" y="314" text-anchor="middle" font-size="11" fill="#1f2b38">a</text>
  <line x1="250" y1="400" x2="520" y2="400" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="250" y1="342" x2="250" y2="408" stroke="#5b6b7c" stroke-width="1.2"/>
  <line x1="520" y1="342" x2="520" y2="408" stroke="#5b6b7c" stroke-width="1.2"/>
  <text x="385" y="394" text-anchor="middle" font-size="11" fill="#e08a1e">可匹配区间 [a.t + lowerBound, a.t + upperBound]</text>
  <text x="250" y="430" text-anchor="middle" font-size="11" fill="#5b6b7c">下界</text>
  <text x="520" y="430" text-anchor="middle" font-size="11" fill="#5b6b7c">上界</text>
  <circle cx="320" cy="420" r="5" fill="#2e9e5b"/>
  <circle cx="480" cy="420" r="5" fill="#2e9e5b"/>
  <text x="320" y="444" text-anchor="middle" font-size="11" fill="#2e9e5b">命中</text>
  <text x="480" y="444" text-anchor="middle" font-size="11" fill="#2e9e5b">命中</text>
  <text x="60" y="477" font-size="11" fill="#5b6b7c">要点：两条流必须先按相同 key 分组（keyBy），且只支持事件时间语义；一个元素可同时命中多个区间，属于 inner join 语义。</text>
</svg>
