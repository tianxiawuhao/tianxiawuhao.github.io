<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>间隔联结示意图：为流 A 的每条数据开辟时间区间，落在区间内的流 B 数据与之配对</title>
  <rect width="900" height="410" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">间隔联结（Interval Join）：按数据时间戳取一段可匹配区间</text>

  <line x1="90" y1="105" x2="820" y2="105" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="90" y1="265" x2="820" y2="265" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="60" y="110" font-size="12" fill="#1f2b38">流 A</text>
  <text x="60" y="270" font-size="12" fill="#1f2b38">流 B</text>

  <circle cx="330" cy="105" r="5" fill="#2f6fd0"/>
  <text x="330" y="92" text-anchor="middle" font-size="12" fill="#1f2b38">a</text>
  <line x1="180" y1="243" x2="560" y2="243" stroke="#e08a1e" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="180" y1="118" x2="180" y2="253" stroke="#5b6b7c" stroke-width="1.2"/>
  <line x1="560" y1="118" x2="560" y2="253" stroke="#5b6b7c" stroke-width="1.2"/>
  <text x="370" y="236" text-anchor="middle" font-size="11" fill="#e08a1e">可匹配区间 [a.t + lowerBound, a.t + upperBound]</text>
  <text x="180" y="285" text-anchor="middle" font-size="11" fill="#5b6b7c">下界</text>
  <text x="560" y="285" text-anchor="middle" font-size="11" fill="#5b6b7c">上界</text>

  <circle cx="240" cy="265" r="5" fill="#2e9e5b"/>
  <circle cx="480" cy="265" r="5" fill="#2e9e5b"/>
  <text x="240" y="305" text-anchor="middle" font-size="11" fill="#2e9e5b">命中：与 a 配对</text>
  <text x="480" y="305" text-anchor="middle" font-size="11" fill="#2e9e5b">命中：与 a 配对</text>
  <circle cx="690" cy="265" r="5" fill="#7a5bd0"/>
  <text x="690" y="305" text-anchor="middle" font-size="11" fill="#7a5bd0">区间外：不配对</text>

  <rect x="60" y="320" width="800" height="72" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="80" y="344" font-size="11" fill="#1f2b38">匹配条件：a.timestamp + lowerBound &lt;= b.timestamp &lt;= a.timestamp + upperBound，其中 a 属于流 A、b 属于流 B。</text>
  <text x="80" y="364" font-size="11" fill="#5b6b7c">两条流必须先按相同 key 分组（keyBy），且只支持事件时间语义；区间由上下界决定，可以与窗口边界无关。</text>
  <text x="80" y="384" font-size="11" fill="#5b6b7c">同一元素可以在多个区间内被匹配到；没有任何匹配时不会输出，因此间隔联结同样是 inner join 语义。</text>
</svg>
