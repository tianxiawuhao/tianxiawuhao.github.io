<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ReplicatedMergeTree 副本写入流程</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ReplicatedMergeTree 副本写入流程</text>
  <rect x="20" y="110" width="150" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="95" y="140" text-anchor="middle" font-size="13" fill="#1f2b38">客户端</text>
  <text x="95" y="161" text-anchor="middle" font-size="11" fill="#5b6b7c">INSERT 数据块</text>
  <line x1="172" y1="145" x2="240" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="245" y="80" width="280" height="130" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="385" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">hadoop102（rep_102）</text>
  <text x="385" y="133" text-anchor="middle" font-size="11" fill="#1f2b38">① 写入本地磁盘 part</text>
  <text x="385" y="157" text-anchor="middle" font-size="11" fill="#1f2b38">② 向 ZooKeeper 注册 block</text>
  <text x="385" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">客户端只与一个副本交互</text>
  <line x1="530" y1="145" x2="610" y2="145" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="570" y="132" text-anchor="middle" font-size="11" fill="#5b6b7c">拉取 part</text>
  <rect x="615" y="80" width="270" height="130" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="750" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">hadoop103（rep_103）</text>
  <text x="750" y="133" text-anchor="middle" font-size="11" fill="#1f2b38">③ 从 ZK 感知新 block</text>
  <text x="750" y="157" text-anchor="middle" font-size="11" fill="#1f2b38">④ 从 hadoop102 拉取 part</text>
  <text x="750" y="181" text-anchor="middle" font-size="11" fill="#5b6b7c">⑤ 就绪后即可查询</text>
  <rect x="245" y="280" width="640" height="96" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="565" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">ZooKeeper 集群：只存元数据，不存数据</text>
  <text x="565" y="333" text-anchor="middle" font-size="11" fill="#5b6b7c">/clickhouse/table/01/t_order_rep/replicas/{rep_102, rep_103}</text>
  <text x="565" y="357" text-anchor="middle" font-size="11" fill="#5b6b7c">block 元数据：part 名称、校验和、副本同步进度</text>
  <line x1="385" y1="212" x2="385" y2="276" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="375" y="248" text-anchor="end" font-size="11" fill="#5b6b7c">注册 block</text>
  <line x1="750" y1="276" x2="750" y2="212" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="760" y="248" text-anchor="start" font-size="11" fill="#5b6b7c">监听 / 感知</text>
</svg>
