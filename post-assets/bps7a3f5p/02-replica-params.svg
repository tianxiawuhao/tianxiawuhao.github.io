<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ReplicatedMergeTree 的两个关键参数</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ReplicatedMergeTree 的两个关键参数</text>
  <rect x="40" y="56" width="820" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="88" text-anchor="middle" font-size="13" fill="#1f2b38">ReplicatedMergeTree('/clickhouse/table/01/t_order_rep', 'rep_102')</text>
  <rect x="40" y="132" width="395" height="126" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="237" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">参数 1：zk_path</text>
  <text x="237" y="186" text-anchor="middle" font-size="11" fill="#1f2b38">格式：/clickhouse/table/{shard}/{table_name}</text>
  <text x="237" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">只有一个分片时 shard 写 01 即可</text>
  <text x="237" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">同一分片的所有副本必须完全相同</text>
  <rect x="465" y="132" width="395" height="126" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="662" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">参数 2：replica_name</text>
  <text x="662" y="186" text-anchor="middle" font-size="11" fill="#1f2b38">同一分片内每个副本的名称必须唯一</text>
  <text x="662" y="210" text-anchor="middle" font-size="11" fill="#5b6b7c">hadoop102 用 rep_102，hadoop103 用 rep_103</text>
  <text x="662" y="234" text-anchor="middle" font-size="11" fill="#5b6b7c">名称重复会导致副本无法启动</text>
  <rect x="40" y="278" width="820" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="310" text-anchor="middle" font-size="11" fill="#1f2b38">副本只同步数据、不同步表结构：每台机器都要手动建表（或用 ON CLUSTER 统一建表）</text>
</svg>
