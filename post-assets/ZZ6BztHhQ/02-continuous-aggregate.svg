<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5bd0"/>
    </marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">连续聚合的刷新链路与时间窗口</text>

  <!-- 链路 -->
  <rect x="30" y="58" width="200" height="92" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="130" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">原始 hypertable</text>
  <text x="130" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">conditions</text>
  <text x="130" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">高频写入，chunk 持续增长</text>

  <line x1="232" y1="104" x2="288" y2="104" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar2)"/>

  <rect x="292" y="58" width="200" height="92" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="392" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">后台刷新策略</text>
  <text x="392" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">start_offset / end_offset</text>
  <text x="392" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">定时增量重算</text>

  <line x1="494" y1="104" x2="550" y2="104" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar2)"/>

  <rect x="554" y="58" width="316" height="92" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="712" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">连续聚合物化视图</text>
  <text x="712" y="106" text-anchor="middle" font-size="11" fill="#5b6b7c">conditions_hourly</text>
  <text x="712" y="126" text-anchor="middle" font-size="11" fill="#5b6b7c">SELECT * FROM conditions_hourly 即可读</text>

  <!-- 窗口图 -->
  <text x="30" y="188" font-size="14" font-weight="700" fill="#1f2b38">时间轴上的三段区间</text>

  <rect x="30" y="204" width="240" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="150" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">已物化并冻结</text>
  <text x="150" y="242" text-anchor="middle" font-size="11" fill="#5b6b7c">早于 now() - start_offset</text>

  <rect x="280" y="204" width="240" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="400" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">可刷新区间</text>
  <text x="400" y="242" text-anchor="middle" font-size="11" fill="#5b6b7c">策略自动重算，通常设为 1 小时前</text>

  <rect x="530" y="204" width="340" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="700" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">实时区（未物化）</text>
  <text x="700" y="242" text-anchor="middle" font-size="11" fill="#5b6b7c">晚于 now() - end_offset，查询时与已物化结果合并</text>

  <line x1="30" y1="262" x2="870" y2="262" stroke="#c8d3e0" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="30" y="282" font-size="11" fill="#5b6b7c">更早（可 drop_chunks）</text>
  <text x="870" y="282" text-anchor="end" font-size="11" fill="#5b6b7c">now()</text>

  <!-- 手动刷新 -->
  <rect x="30" y="300" width="840" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="50" y="326" font-size="14" font-weight="700" fill="#1f2b38">手动补刷与策略语句（2.x）</text>
  <text x="50" y="350" font-size="12" fill="#5b6b7c">CALL refresh_continuous_aggregate('conditions_hourly', now() - INTERVAL '3 days', now());</text>
  <text x="50" y="372" font-size="12" fill="#5b6b7c">ALTER MATERIALIZED VIEW conditions_hourly SET (timescaledb.materialized_only = false);  -- 实时聚合</text>
  <text x="50" y="394" font-size="12" fill="#7a5bd0">SELECT add_retention_policy('conditions', INTERVAL '90 days');  -- 超表自动清理</text>
</svg>
