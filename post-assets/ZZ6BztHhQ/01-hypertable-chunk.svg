<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Hypertable 的逻辑视图与物理 Chunk 分区</text>

  <!-- 逻辑超表 -->
  <rect x="40" y="60" width="820" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="60" y="86" font-size="14" font-weight="700" fill="#1f2b38">逻辑层：hypertable（对应用户看到的普通表）</text>
  <text x="60" y="108" font-size="12" fill="#5b6b7c">CREATE TABLE conditions (time TIMESTAMPTZ NOT NULL, location TEXT, temperature DOUBLE PRECISION);</text>
  <text x="60" y="128" font-size="12" fill="#5b6b7c">SELECT create_hypertable('conditions', 'time', chunk_time_interval =&gt; INTERVAL '1 day');</text>
  <text x="60" y="152" font-size="12" fill="#2f6fd0">应用只读写 conditions，分区对 SQL 透明</text>
  <text x="60" y="172" font-size="12" fill="#5b6b7c">分区键：时间列（必需） + 空间维度 add_dimension('conditions', 'location', ...)（可选）</text>

  <line x1="450" y1="180" x2="450" y2="215" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="202" font-size="12" fill="#5b6b7c">按时间 + 空间自动切分</text>

  <!-- chunks -->
  <rect x="40" y="222" width="185" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="132" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">chunk_1</text>
  <text x="132" y="266" text-anchor="middle" font-size="11" fill="#5b6b7c">2023-06-01 ~ 06-02</text>
  <text x="132" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">location = 'New York'</text>
  <text x="132" y="302" text-anchor="middle" font-size="11" fill="#5b6b7c">物理表 _timescaledb_internal</text>
  <text x="132" y="320" text-anchor="middle" font-size="11" fill="#2e9e5b">已压缩 (2.x)</text>

  <rect x="245" y="222" width="185" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="337" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">chunk_2</text>
  <text x="337" y="266" text-anchor="middle" font-size="11" fill="#5b6b7c">2023-06-02 ~ 06-03</text>
  <text x="337" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">location = 'New York'</text>
  <text x="337" y="302" text-anchor="middle" font-size="11" fill="#5b6b7c">物理表 _timescaledb_internal</text>
  <text x="337" y="320" text-anchor="middle" font-size="11" fill="#2e9e5b">已压缩 (2.x)</text>

  <rect x="450" y="222" width="185" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="542" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">chunk_3</text>
  <text x="542" y="266" text-anchor="middle" font-size="11" fill="#5b6b7c">2023-06-03 ~ 06-04</text>
  <text x="542" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">location = 'London'</text>
  <text x="542" y="302" text-anchor="middle" font-size="11" fill="#5b6b7c">物理表 _timescaledb_internal</text>
  <text x="542" y="320" text-anchor="middle" font-size="11" fill="#e08a1e">写入热点（当前 chunk）</text>

  <rect x="655" y="222" width="205" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="757" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">chunk_4 …</text>
  <text x="757" y="266" text-anchor="middle" font-size="11" fill="#5b6b7c">2023-06-04 ~ 06-05</text>
  <text x="757" y="284" text-anchor="middle" font-size="11" fill="#5b6b7c">location = 'London'</text>
  <text x="757" y="302" text-anchor="middle" font-size="11" fill="#5b6b7c">DROP 整块即可，秒级完成</text>
  <text x="757" y="320" text-anchor="middle" font-size="11" fill="#5b6b7c">drop_chunks / 保留策略</text>

  <line x1="450" y1="334" x2="450" y2="366" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 连续聚合 -->
  <rect x="40" y="372" width="820" height="76" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="60" y="396" font-size="14" font-weight="700" fill="#1f2b38">连续聚合（continuous aggregate，2.x 为物化视图）</text>
  <text x="60" y="418" font-size="12" fill="#5b6b7c">按 time_bucket 预聚合 → 后台策略自动刷新 → 查询只扫描已物化的结果，不随原始数据量线性变慢</text>
  <text x="60" y="438" font-size="12" fill="#5b6b7c">CREATE MATERIALIZED VIEW … WITH (timescaledb.continuous) AS SELECT time_bucket('5 min', time), avg(temperature) …</text>
</svg>
