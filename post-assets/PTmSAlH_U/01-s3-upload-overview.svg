<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>上传文件到 Amazon S3 的整体流程</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">上传文件到 Amazon S3 的整体流程</text>
  <text x="30" y="62" font-size="12" fill="#5b6b7c">第一步：在 S3 控制台完成三项配置</text>
  <rect x="30" y="72" width="250" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="155" y="100" text-anchor="middle" font-size="13" fill="#1f2b38">创建存储桶</text>
  <text x="155" y="120" text-anchor="middle" font-size="11" fill="#5b6b7c">关闭阻止公开访问，设为公开</text>
  <line x1="280" y1="104" x2="318" y2="104" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="325" y="72" width="250" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="100" text-anchor="middle" font-size="13" fill="#1f2b38">配置存储桶策略</text>
  <text x="450" y="120" text-anchor="middle" font-size="11" fill="#5b6b7c">Public Read Get Object 允许读对象</text>
  <line x1="575" y1="104" x2="613" y2="104" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="620" y="72" width="250" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="745" y="100" text-anchor="middle" font-size="13" fill="#1f2b38">配置跨域规则</text>
  <text x="745" y="120" text-anchor="middle" font-size="11" fill="#5b6b7c">CORS 允许 PUT / POST / GET</text>
  <line x1="450" y1="136" x2="450" y2="196" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="462" y="170" font-size="12" fill="#5b6b7c">配置完成后，由后端代码上传</text>
  <rect x="30" y="210" width="180" height="80" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="120" y="243" text-anchor="middle" font-size="13" fill="#1f2b38">前端 / 客户端</text>
  <text x="120" y="265" text-anchor="middle" font-size="11" fill="#5b6b7c">选择并提交文件</text>
  <line x1="210" y1="250" x2="246" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="250" y="210" width="180" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="243" text-anchor="middle" font-size="13" fill="#1f2b38">后端上传接口</text>
  <text x="340" y="265" text-anchor="middle" font-size="11" fill="#5b6b7c">校验参数并生成对象键</text>
  <line x1="430" y1="250" x2="466" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="470" y="210" width="180" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="560" y="243" text-anchor="middle" font-size="13" fill="#1f2b38">AWS SDK</text>
  <text x="560" y="265" text-anchor="middle" font-size="11" fill="#5b6b7c">putObject 写入对象</text>
  <line x1="650" y1="250" x2="686" y2="250" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="690" y="210" width="180" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="780" y="243" text-anchor="middle" font-size="13" fill="#1f2b38">S3 存储桶</text>
  <text x="780" y="265" text-anchor="middle" font-size="11" fill="#5b6b7c">按日期 / UUID 存放对象</text>
  <path d="M 780 290 L 780 340 L 474 340" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="230" y="316" width="240" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="350" y="340" text-anchor="middle" font-size="13" fill="#1f2b38">返回公开访问地址</text>
  <text x="350" y="360" text-anchor="middle" font-size="11" fill="#5b6b7c">前端可直接引用该地址</text>
</svg>
