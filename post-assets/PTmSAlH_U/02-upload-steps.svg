<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>上传接口的执行步骤</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">上传接口 uploadFileToS3 的执行步骤</text>
  <rect x="60" y="70" width="340" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="100" text-anchor="middle" font-size="13" fill="#1f2b38">① 参数校验</text>
  <text x="230" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">文件大小非 0，原始文件名非空</text>
  <line x1="230" y1="140" x2="230" y2="168" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="170" width="340" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="200" text-anchor="middle" font-size="13" fill="#1f2b38">② 生成对象键</text>
  <text x="230" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">yyyyMMdd / UUID + 原文件名</text>
  <line x1="230" y1="240" x2="230" y2="268" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="270" width="340" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="300" text-anchor="middle" font-size="13" fill="#1f2b38">③ 设置对象元数据</text>
  <text x="230" y="322" text-anchor="middle" font-size="11" fill="#5b6b7c">ContentType 与 ContentLength</text>
  <path d="M 230 340 L 230 385 L 670 385 L 670 144" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="500" y="70" width="340" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="670" y="100" text-anchor="middle" font-size="13" fill="#1f2b38">④ 调用 putObject 上传</text>
  <text x="670" y="122" text-anchor="middle" font-size="11" fill="#5b6b7c">通过已初始化的 AmazonS3 客户端</text>
  <line x1="670" y1="140" x2="670" y2="168" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="500" y="170" width="340" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="200" text-anchor="middle" font-size="13" fill="#1f2b38">⑤ 返回访问地址</text>
  <text x="670" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">服务地址 + 对象键拼成完整地址</text>
  <line x1="670" y1="240" x2="670" y2="268" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="500" y="270" width="340" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="300" text-anchor="middle" font-size="13" fill="#1f2b38">⑥ 异常处理与收尾</text>
  <text x="670" y="322" text-anchor="middle" font-size="11" fill="#5b6b7c">异常转 FILE_UPLOAD_FAILED，finally 关流</text>
  <text x="450" y="408" text-anchor="middle" font-size="11" fill="#5b6b7c">上传失败时统一抛出业务异常，输入流在 finally 中关闭，避免句柄泄漏</text>
</svg>
