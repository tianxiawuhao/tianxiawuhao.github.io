<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>一次 RPC 调用的四个关键环节</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一次 RPC 调用：代理、序列化、传输、寻址</text>
  <rect x="30" y="90" width="220" height="175" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">消费方 Consumer</text>
  <text x="140" y="150" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">① 动态代理拦截调用</text>
  <text x="140" y="176" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">② 序列化参数为字节</text>
  <text x="140" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">③ 写入网络长连接</text>
  <text x="140" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">④ 反序列化响应结果</text>
  <text x="140" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">⑤ 寻址：订阅地址列表</text>
  <rect x="650" y="90" width="220" height="175" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="760" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">提供方 Provider</text>
  <text x="760" y="150" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">① 解码请求报文</text>
  <text x="760" y="176" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">② 反序列化参数</text>
  <text x="760" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">③ 按接口名找实现类</text>
  <text x="760" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">④ 反射执行方法</text>
  <text x="760" y="252" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">⑤ 写回返回结果</text>
  <path d="M 250 150 H 650" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 650 210 H 250" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">请求：接口名 + 方法名 + 参数</text>
  <text x="450" y="232" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">响应：结果或异常</text>
  <rect x="340" y="300" width="220" height="75" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">注册中心 Registry</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">订阅地址 · 负载均衡选一台</text>
  <path d="M 340 330 H 140 V 266" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 560 330 H 760 V 266" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="240" y="322" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">订阅与推送地址</text>
</svg>
