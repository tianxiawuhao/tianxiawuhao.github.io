<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Dubbo 五角色与一次调用的生命周期</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Dubbo 五角色：一次调用从启动到上报的完整链路</text>
  <rect x="50" y="70" width="180" height="100" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="140" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务容器 Container</text>
  <text x="140" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">启动 · 加载 · 运行</text>
  <text x="140" y="152" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">Provider 进程</text>
  <rect x="300" y="70" width="200" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="400" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务提供者 Provider</text>
  <text x="400" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">暴露服务并注册地址</text>
  <text x="400" y="152" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">执行业务并返回结果</text>
  <rect x="570" y="70" width="300" height="100" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="720" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">注册中心 Registry</text>
  <text x="720" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">接收注册 · 推送地址变更</text>
  <text x="720" y="152" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">ZooKeeper · Nacos（CP / AP）</text>
  <rect x="300" y="300" width="200" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="400" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">服务消费者 Consumer</text>
  <text x="400" y="358" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">订阅地址并本地缓存</text>
  <text x="400" y="382" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">按负载均衡选一台</text>
  <rect x="570" y="300" width="300" height="100" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="720" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">监控中心 Monitor</text>
  <text x="720" y="358" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">统计调用次数与耗时</text>
  <text x="720" y="382" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">接收 Provider / Consumer 上报</text>
  <path d="M 230 120 H 300" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="265" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">0 启动</text>
  <path d="M 500 120 H 570" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="535" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">1 注册</text>
  <path d="M 720 170 V 350 H 502" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="610" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">2 订阅 / 推送</text>
  <path d="M 400 300 V 172" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="415" y="240" text-anchor="start" font-size="11" font-weight="400" fill="#1f2b38">3 调用 / 失败重试</text>
  <path d="M 500 370 H 570" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="535" y="360" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2b38">4 上报</text>
  <text x="140" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">0 启动 → 1 注册</text>
  <text x="140" y="365" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b7c">2 订阅 → 3 调用 → 4 上报</text>
</svg>
