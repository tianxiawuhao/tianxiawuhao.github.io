<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">SpringMVC 处理一次请求的 11 个步骤</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#5b6b7c">DispatcherServlet 统一调度，ModelAndView 贯穿始终</text>

  <rect x="330" y="76" width="240" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">1 用户发送请求</text>
  <text x="450" y="118" text-anchor="middle" font-size="12" fill="#5b6b7c">到达前端控制器</text>

  <rect x="330" y="156" width="240" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="450" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">2-3 HandlerMapping</text>
  <text x="450" y="198" text-anchor="middle" font-size="12" fill="#5b6b7c">查找处理器，返回执行链</text>

  <rect x="330" y="236" width="240" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="450" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">4-5 HandlerAdapter</text>
  <text x="450" y="278" text-anchor="middle" font-size="12" fill="#5b6b7c">适配并调用 Controller</text>

  <rect x="330" y="316" width="240" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="450" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">6-7 ModelAndView</text>
  <text x="450" y="358" text-anchor="middle" font-size="12" fill="#5b6b7c">回传模型数据与逻辑视图名</text>

  <rect x="330" y="396" width="240" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="450" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">8-9 ViewResolver</text>
  <text x="450" y="438" text-anchor="middle" font-size="12" fill="#5b6b7c">解析逻辑视图名，返回 View</text>

  <rect x="330" y="476" width="240" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="450" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">10-11 渲染并响应</text>
  <text x="450" y="518" text-anchor="middle" font-size="12" fill="#5b6b7c">填充模型数据，写回响应</text>

  <path d="M 450 128 L 450 156" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#af)"/>
  <path d="M 450 208 L 450 236" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#af)"/>
  <path d="M 450 288 L 450 316" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#af)"/>
  <path d="M 450 368 L 450 396" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#af)"/>
  <path d="M 450 448 L 450 476" fill="none" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#af)"/>

  <rect x="60" y="76" width="230" height="452" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="175" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">框架提供的组件</text>
  <text x="175" y="140" text-anchor="middle" font-size="12" fill="#5b6b7c">DispatcherServlet</text>
  <text x="175" y="164" text-anchor="middle" font-size="12" fill="#5b6b7c">HandlerMapping</text>
  <text x="175" y="188" text-anchor="middle" font-size="12" fill="#5b6b7c">HandlerAdapter</text>
  <text x="175" y="212" text-anchor="middle" font-size="12" fill="#5b6b7c">ViewResolver</text>

  <rect x="610" y="76" width="230" height="452" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="725" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">工程需要开发的组件</text>
  <text x="725" y="140" text-anchor="middle" font-size="12" fill="#5b6b7c">Handler（Controller）</text>
  <text x="725" y="164" text-anchor="middle" font-size="12" fill="#5b6b7c">View（jsp、html…）</text>
</svg>
