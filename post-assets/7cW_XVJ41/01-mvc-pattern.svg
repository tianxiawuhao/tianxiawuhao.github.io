<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">MVC 模式中三部分的协作关系</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#5b6b7c">Controller 接收请求、调用 Model、派发 View</text>

  <rect x="330" y="96" width="240" height="66" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="450" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">Controller 控制器</text>
  <text x="450" y="146" text-anchor="middle" font-size="12" fill="#5b6b7c">接收请求 → 调用模型 → 派发页面</text>

  <rect x="330" y="296" width="240" height="66" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="450" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">用户 / 浏览器</text>
  <text x="450" y="346" text-anchor="middle" font-size="12" fill="#5b6b7c">发起请求，接收最终页面</text>

  <rect x="60" y="196" width="240" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="180" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">Model 模型</text>
  <text x="180" y="246" text-anchor="middle" font-size="12" fill="#5b6b7c">业务逻辑：service + dao + entity</text>

  <rect x="600" y="196" width="240" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="720" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2b38">View 视图</text>
  <text x="720" y="246" text-anchor="middle" font-size="12" fill="#5b6b7c">界面展示：jsp、html 等</text>

  <path d="M 400 162 L 220 196" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="268" y="176" font-size="12" fill="#5b6b7c">1 调用</text>
  <path d="M 300 230 L 400 148" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="316" y="214" font-size="12" fill="#5b6b7c">2 返回结果</text>
  <path d="M 500 148 L 600 218" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="506" y="196" font-size="12" fill="#5b6b7c">3 选择视图</text>
  <path d="M 720 262 L 490 300" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="524" y="288" font-size="12" fill="#5b6b7c">4 渲染页面</text>
  <path d="M 370 320 L 330 330 L 330 356 L 370 362" fill="none" stroke="#c8d3e0" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
