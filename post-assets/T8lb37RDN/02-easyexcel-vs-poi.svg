<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="c-ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#7a5bd0"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">EasyExcel 与原生 POI 的取舍</text>

  <!-- 表头 -->
  <rect x="24" y="48" width="180" height="38" rx="8" fill="#1f2b38"/>
  <text x="114" y="72" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">对比维度</text>
  <rect x="208" y="48" width="330" height="38" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="373" y="72" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">EasyExcel（阿里）</text>
  <rect x="542" y="48" width="334" height="38" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="709" y="72" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">Apache POI（原生）</text>

  <!-- 行 1 -->
  <rect x="24" y="90" width="852" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="114" y="121" font-size="12" fill="#5b6b7c" text-anchor="middle">底层实现</text>
  <text x="373" y="113" font-size="12" fill="#1f2b38" text-anchor="middle">封装 POI：读用 SAX，写用 SXSSF</text>
  <text x="373" y="131" font-size="11" fill="#5b6b7c" text-anchor="middle">按行回调，模型层自己转</text>
  <text x="709" y="113" font-size="12" fill="#1f2b38" text-anchor="middle">XSSF 全量入内存 / SXSSF 流式写</text>
  <text x="709" y="131" font-size="11" fill="#5b6b7c" text-anchor="middle">HSSF 处理 xls，模型最灵活</text>

  <!-- 行 2 -->
  <rect x="24" y="146" width="852" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="114" y="177" font-size="12" fill="#5b6b7c" text-anchor="middle">内存模型</text>
  <text x="373" y="169" font-size="12" fill="#1f2b38" text-anchor="middle">一行 / 一个行窗口</text>
  <text x="373" y="187" font-size="11" fill="#5b6b7c" text-anchor="middle">10 万行也不会 OOM</text>
  <text x="709" y="169" font-size="12" fill="#1f2b38" text-anchor="middle">XSSF 全量常驻堆内</text>
  <text x="709" y="187" font-size="11" fill="#5b6b7c" text-anchor="middle">大文件需自己改用 SXSSF</text>

  <!-- 行 3 -->
  <rect x="24" y="202" width="852" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="114" y="233" font-size="12" fill="#5b6b7c" text-anchor="middle">开发效率</text>
  <text x="373" y="225" font-size="12" fill="#1f2b38" text-anchor="middle">注解即映射，两三行读完</text>
  <text x="373" y="243" font-size="11" fill="#5b6b7c" text-anchor="middle">表头、日期、数字格式开箱即用</text>
  <text x="709" y="225" font-size="12" fill="#1f2b38" text-anchor="middle">逐个 getRow / getCell</text>
  <text x="709" y="243" font-size="11" fill="#5b6b7c" text-anchor="middle">空行、类型、格式都要手写</text>

  <!-- 行 4 -->
  <rect x="24" y="258" width="852" height="52" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="114" y="289" font-size="12" fill="#5b6b7c" text-anchor="middle">样式与图表</text>
  <text x="373" y="281" font-size="12" fill="#1f2b38" text-anchor="middle">常用样式够用，复杂样式受限</text>
  <text x="373" y="299" font-size="11" fill="#5b6b7c" text-anchor="middle">可用 WriteHandler 扩展</text>
  <text x="709" y="281" font-size="12" fill="#1f2b38" text-anchor="middle">样式、公式、图表、透视表全支持</text>
  <text x="709" y="299" font-size="11" fill="#5b6b7c" text-anchor="middle">能直接操作底层 Workbook</text>

  <!-- 行 5 -->
  <rect x="24" y="314" width="852" height="52" rx="8" fill="#ffffff" stroke="#c8d3e0"/>
  <text x="114" y="345" font-size="12" fill="#5b6b7c" text-anchor="middle">选型建议</text>
  <text x="373" y="337" font-size="12" fill="#2e9e5b" text-anchor="middle">导入导出业务数据、大文件</text>
  <text x="373" y="355" font-size="11" fill="#5b6b7c" text-anchor="middle">报表、模板填充、Web 上传下载</text>
  <text x="709" y="337" font-size="12" fill="#e08a1e" text-anchor="middle">要画图表 / 精细样式 / 特殊格式</text>
  <text x="709" y="355" font-size="11" fill="#5b6b7c" text-anchor="middle">或需要极限裁剪依赖时</text>

  <!-- 结论 -->
  <rect x="24" y="378" width="852" height="38" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="44" y="402" font-size="12" fill="#1f2b38">EasyExcel 没有取代 POI，而是把 POI 的流式能力包装成了注解 API；需要底层能力时仍可用 WriteHandler 拿到 POI 对象。</text>
  <line x1="860" y1="397" x2="872" y2="397" stroke="#7a5bd0" marker-end="url(#c-ar)"/>
</svg>
