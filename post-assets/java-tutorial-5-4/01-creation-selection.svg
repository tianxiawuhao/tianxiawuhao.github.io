<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>创建型模式选型：单例、工厂、建造者、原型的意图与代价</title>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">创建型模式选型：数量、解耦、参数、拷贝</text>

  <rect x="30" y="58" width="195" height="212" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="127" y="88" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">单例 Singleton</text>
  <line x1="44" y1="102" x2="211" y2="102" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="127" y="124" font-size="10.5" fill="#5b6b7c" text-anchor="middle">保证只有一个实例</text>
  <text x="44" y="150" font-size="10" fill="#5b6b7c">何时用</text>
  <text x="127" y="170" font-size="10.5" fill="#1f2b38" text-anchor="middle">配置中心、连接池、缓存</text>
  <text x="127" y="190" font-size="10.5" fill="#1f2b38" text-anchor="middle">需要全局唯一访问点</text>
  <text x="44" y="216" font-size="10" fill="#5b6b7c">代价与坑</text>
  <text x="127" y="236" font-size="10" fill="#5b6b7c" text-anchor="middle">反射、反序列化会破坏</text>
  <text x="127" y="254" font-size="10" fill="#5b6b7c" text-anchor="middle">推荐静态内部类或枚举</text>

  <rect x="245" y="58" width="195" height="212" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="342" y="88" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">工厂 Factory</text>
  <line x1="259" y1="102" x2="426" y2="102" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="342" y="124" font-size="10.5" fill="#5b6b7c" text-anchor="middle">把创建逻辑从调用方剥离</text>
  <text x="259" y="150" font-size="10" fill="#5b6b7c">何时用</text>
  <text x="342" y="170" font-size="10.5" fill="#1f2b38" text-anchor="middle">产品种类多、创建会变</text>
  <text x="342" y="190" font-size="10.5" fill="#1f2b38" text-anchor="middle">调用方不该知道构造细节</text>
  <text x="259" y="216" font-size="10" fill="#5b6b7c">代价与坑</text>
  <text x="342" y="236" font-size="10" fill="#5b6b7c" text-anchor="middle">别做成万能上帝类</text>
  <text x="342" y="254" font-size="10" fill="#5b6b7c" text-anchor="middle">简单工厂够用就不必再抽象</text>

  <rect x="460" y="58" width="195" height="212" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="557" y="88" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">建造者 Builder</text>
  <line x1="474" y1="102" x2="641" y2="102" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="557" y="124" font-size="10.5" fill="#5b6b7c" text-anchor="middle">分步装配复杂对象</text>
  <text x="474" y="150" font-size="10" fill="#5b6b7c">何时用</text>
  <text x="557" y="170" font-size="10.5" fill="#1f2b38" text-anchor="middle">参数多、部分可选</text>
  <text x="557" y="190" font-size="10.5" fill="#1f2b38" text-anchor="middle">部件要按固定顺序组装</text>
  <text x="474" y="216" font-size="10" fill="#5b6b7c">代价与坑</text>
  <text x="557" y="236" font-size="10" fill="#5b6b7c" text-anchor="middle">build() 里必须做校验</text>
  <text x="557" y="254" font-size="10" fill="#5b6b7c" text-anchor="middle">字段两三个时纯属噪音</text>

  <rect x="675" y="58" width="195" height="212" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="772" y="88" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">原型 Prototype</text>
  <line x1="689" y1="102" x2="856" y2="102" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="772" y="124" font-size="10.5" fill="#5b6b7c" text-anchor="middle">用拷贝代替重复创建</text>
  <text x="689" y="150" font-size="10" fill="#5b6b7c">何时用</text>
  <text x="772" y="170" font-size="10.5" fill="#1f2b38" text-anchor="middle">创建代价高、副本多</text>
  <text x="772" y="190" font-size="10.5" fill="#1f2b38" text-anchor="middle">先备好原型再克隆</text>
  <text x="689" y="216" font-size="10" fill="#5b6b7c">代价与坑</text>
  <text x="772" y="236" font-size="10" fill="#5b6b7c" text-anchor="middle">super.clone() 是浅拷贝</text>
  <text x="772" y="254" font-size="10" fill="#5b6b7c" text-anchor="middle">clone 不调用构造方法</text>

  <rect x="30" y="292" width="840" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="322" font-size="12" fill="#1f2b38" text-anchor="middle">模式解决的是「变化点」：创建方式永远不变时，硬套模式只会让类数量翻倍</text>
  <text x="450" y="348" font-size="11" fill="#5b6b7c" text-anchor="middle">模式之间可以组合：工厂内部返回单例，建造者的产物由工厂创建；先能读懂，再谈解耦</text>
</svg>
