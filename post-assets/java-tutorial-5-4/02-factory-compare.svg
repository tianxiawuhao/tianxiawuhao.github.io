<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>工厂三种形态的抽象程度与扩展方式对比</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">工厂三形态：抽象程度与扩展代价的权衡</text>

  <rect x="40" y="54" width="260" height="180" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="170" y="80" font-size="13.5" fill="#2f6fd0" text-anchor="middle" font-weight="700">简单工厂</text>
  <text x="170" y="102" font-size="11" fill="#5b6b7c" text-anchor="middle">静态方法 + if/switch</text>
  <line x1="60" y1="114" x2="280" y2="114" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="60" y="136" font-size="11.5" fill="#1f2b38" text-anchor="start">客户端：SenderFactory.create("sms")</text>
  <text x="60" y="158" font-size="11.5" fill="#1f2b38" text-anchor="start">新增产品：改 switch，违反开闭</text>
  <text x="60" y="180" font-size="11.5" fill="#1f2b38" text-anchor="start">类的数量：2（接口 + 工厂）</text>
  <text x="60" y="206" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">适用：产品种类少、创建逻辑简单</text>

  <rect x="320" y="54" width="260" height="180" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="80" font-size="13.5" fill="#e08a1e" text-anchor="middle" font-weight="700">工厂方法</text>
  <text x="450" y="102" font-size="11" fill="#5b6b7c" text-anchor="middle">每个产品配一个工厂类</text>
  <line x1="340" y1="114" x2="560" y2="114" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="340" y="136" font-size="11.5" fill="#1f2b38" text-anchor="start">客户端：new MailSenderFactory().create()</text>
  <text x="340" y="158" font-size="11.5" fill="#1f2b38" text-anchor="start">新增产品：只加一对类，符合开闭</text>
  <text x="340" y="180" font-size="11.5" fill="#1f2b38" text-anchor="start">类的数量：2n（成对增长）</text>
  <text x="340" y="206" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">适用：产品会持续增加</text>

  <rect x="600" y="54" width="260" height="180" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="730" y="80" font-size="13.5" fill="#2e9e5b" text-anchor="middle" font-weight="700">抽象工厂</text>
  <text x="730" y="102" font-size="11" fill="#5b6b7c" text-anchor="middle">一个工厂造一整族产品</text>
  <line x1="620" y1="114" x2="840" y2="114" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="620" y="136" font-size="11.5" fill="#1f2b38" text-anchor="start">客户端：new MailMessageFactory()</text>
  <text x="620" y="158" font-size="11.5" fill="#1f2b38" text-anchor="start">新增产品族：加一个工厂类</text>
  <text x="620" y="180" font-size="11.5" fill="#e08a1e" text-anchor="start">新增产品种类：改所有工厂</text>
  <text x="620" y="206" font-size="11.5" fill="#e08a1e" text-anchor="start" font-weight="700">产品必须配套时使用</text>

  <rect x="40" y="252" width="820" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="276" font-size="12.5" fill="#1f2b38" text-anchor="start" font-weight="700">一句话判断</text>
  <text x="60" y="300" font-size="11.5" fill="#5b6b7c" text-anchor="start">简单工厂解决「造哪一个」；工厂方法解决「谁来决定造哪一个」；抽象工厂解决「怎么保证一整套产品配套」。</text>

  <rect x="40" y="332" width="400" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="60" y="356" font-size="12.5" fill="#2f6fd0" text-anchor="start" font-weight="700">工厂 vs 建造者</text>
  <text x="60" y="378" font-size="11.5" fill="#1f2b38" text-anchor="start">工厂：一步到位返回成品，关心「造哪一个」</text>
  <text x="60" y="398" font-size="11.5" fill="#1f2b38" text-anchor="start">建造者：分步装配，关心「怎么一步步造」</text>

  <rect x="460" y="332" width="400" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="480" y="356" font-size="12.5" fill="#2f6fd0" text-anchor="start" font-weight="700">选择顺序</text>
  <text x="480" y="378" font-size="11.5" fill="#1f2b38" text-anchor="start">先用简单工厂；产品会不断增加时升级为工厂方法；</text>
  <text x="480" y="398" font-size="11.5" fill="#1f2b38" text-anchor="start">出现多套必须配套的产品时再引入抽象工厂</text>
</svg>
