<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>单元测试与代码质量流水线</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">质量流水线：写用例 → 隔离依赖 → 看覆盖 → 守规范</text>
<text x="40" y="52" font-size="11.5" fill="#5b6b7c" text-anchor="start">① 写用例</text>
<rect x="40" y="60" width="180" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="130" y="83" font-size="14" fill="#1f2b38" text-anchor="middle" font-weight="700">JUnit 5</text>
<rect x="40" y="104" width="180" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="52" y="128" font-size="11.5" fill="#5b6b7c" text-anchor="start">断言：期望值在前</text>
<text x="52" y="152" font-size="11.5" fill="#5b6b7c" text-anchor="start">参数化压缩重复用例</text>
<text x="52" y="176" font-size="11.5" fill="#5b6b7c" text-anchor="start">用 Jupiter 的 @Test</text>
<text x="52" y="200" font-size="11.5" fill="#5b6b7c" text-anchor="start">BeforeEach 重建对象</text>
<line x1="223" y1="163" x2="246" y2="163" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="250" y="52" font-size="11.5" fill="#5b6b7c" text-anchor="start">② 隔离依赖</text>
<rect x="250" y="60" width="180" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="340" y="83" font-size="14" fill="#1f2b38" text-anchor="middle" font-weight="700">Mockito</text>
<rect x="250" y="104" width="180" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="262" y="128" font-size="11.5" fill="#5b6b7c" text-anchor="start">Mock + InjectMocks</text>
<text x="262" y="152" font-size="11.5" fill="#5b6b7c" text-anchor="start">参数匹配器必须成套</text>
<text x="262" y="176" font-size="11.5" fill="#5b6b7c" text-anchor="start">严格桩：多余桩报错</text>
<text x="262" y="200" font-size="11.5" fill="#5b6b7c" text-anchor="start">值对象直接 new</text>
<line x1="433" y1="163" x2="456" y2="163" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="460" y="52" font-size="11.5" fill="#5b6b7c" text-anchor="start">③ 看覆盖</text>
<rect x="460" y="60" width="180" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="550" y="83" font-size="14" fill="#1f2b38" text-anchor="middle" font-weight="700">JaCoCo</text>
<rect x="460" y="104" width="180" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="472" y="128" font-size="11.5" fill="#5b6b7c" text-anchor="start">优先看分支覆盖</text>
<text x="472" y="152" font-size="11.5" fill="#5b6b7c" text-anchor="start">行覆盖会骗人</text>
<text x="472" y="176" font-size="11.5" fill="#5b6b7c" text-anchor="start">版本与 JDK 对齐</text>
<text x="472" y="200" font-size="11.5" fill="#5b6b7c" text-anchor="start">阈值做门禁，别当 KPI</text>
<line x1="643" y1="163" x2="666" y2="163" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="670" y="52" font-size="11.5" fill="#5b6b7c" text-anchor="start">④ 守规范</text>
<rect x="670" y="60" width="180" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="760" y="83" font-size="14" fill="#1f2b38" text-anchor="middle" font-weight="700">Checkstyle 等</text>
<rect x="670" y="104" width="180" height="118" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="682" y="128" font-size="11.5" fill="#5b6b7c" text-anchor="start">Checkstyle 管格式</text>
<text x="682" y="152" font-size="11.5" fill="#5b6b7c" text-anchor="start">SpotBugs 扫字节码</text>
<text x="682" y="176" font-size="11.5" fill="#5b6b7c" text-anchor="start">PMD 查复杂度</text>
<text x="682" y="200" font-size="11.5" fill="#5b6b7c" text-anchor="start">SonarQube 聚合成看板</text>
<rect x="40" y="244" width="810" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="445" y="266" font-size="12" fill="#1f2b38" text-anchor="middle">CI：每次提交自动跑 mvn test 与静态检查，结果汇总进看板</text>
<text x="445" y="285" font-size="11.5" fill="#5b6b7c" text-anchor="middle">门禁只拦 error 级规则：warning 先收集不拦人，否则存量项目第一次接入就爆出几千条告警</text>
  <!-- 制图说明：本图遵循站内自制示意图规范，白底卡片、纯矢量、无外链与脚本；内容要点：四段流水线依次是用 JUnit 5 写用例、用 Mockito 隔离依赖、用 JaCoCo 看分支覆盖、用 Checkstyle 等静态检查守规范，底部汇总到 CI 门禁。 -->
</svg>
