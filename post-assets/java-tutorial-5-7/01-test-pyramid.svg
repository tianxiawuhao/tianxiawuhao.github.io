<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>测试金字塔示意图</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">测试金字塔：单元测试打底，端到端收口</text>
<polygon points="240,190 320,190 350,245 210,245" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<polygon points="210,245 350,245 390,305 170,305" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<polygon points="170,305 390,305 450,365 110,365" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="280" y="222" font-size="12" fill="#1f2b38" text-anchor="middle" font-weight="700">E2E</text>
<text x="280" y="281" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">集成测试</text>
<text x="280" y="341" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">单元测试</text>
<line x1="341" y1="218" x2="494" y2="205" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="371" y1="275" x2="494" y2="272" stroke="#c8d3e0" stroke-width="1.4"/>
<line x1="426" y1="340" x2="494" y2="345" stroke="#c8d3e0" stroke-width="1.4"/>
<rect x="500" y="193" width="14" height="14" rx="3" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="524" y="205" font-size="12" fill="#1f2b38" text-anchor="start">端到端：极少量，验证整条链路</text>
<rect x="500" y="260" width="14" height="14" rx="3" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="524" y="272" font-size="12" fill="#1f2b38" text-anchor="start">集成：少量，真连数据库与消息队列</text>
<rect x="500" y="333" width="14" height="14" rx="3" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="524" y="345" font-size="12" fill="#1f2b38" text-anchor="start">单元：大量、毫秒级、零外部依赖</text>
<rect x="40" y="390" width="820" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="60" y="412" font-size="12" fill="#1f2b38" text-anchor="start">反模式「冰淇淋筒」：端到端与手工测试多、单元测试少，跑得慢、失败难定位，团队最终会抛弃它</text>
<text x="60" y="430" font-size="12" fill="#5b6b7c" text-anchor="start">单元测试的判定标准：只测一个行为，不碰网络、数据库、文件、当前时间与随机数</text>
