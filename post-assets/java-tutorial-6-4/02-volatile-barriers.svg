<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>volatile 的内存屏障</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">volatile 的内存屏障：写前后各一道，读之后再插两道</text>

  <text x="40" y="72" font-size="12" font-weight="700" fill="#2f6fd0">volatile 写</text>
  <rect x="60" y="82" width="170" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="145" y="115" text-anchor="middle" font-size="11.5" fill="#1f2b38">之前的普通读写</text>
  <rect x="260" y="82" width="120" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="320" y="115" text-anchor="middle" font-size="11.5" fill="#e08a1e">StoreStore</text>
  <rect x="410" y="82" width="160" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="490" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6fd0">volatile 写</text>
  <rect x="600" y="82" width="120" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="660" y="115" text-anchor="middle" font-size="11.5" fill="#e08a1e">StoreLoad</text>
  <rect x="750" y="82" width="110" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="805" y="115" text-anchor="middle" font-size="11" fill="#1f2b38">之后的读写</text>
  <line x1="230" y1="109" x2="258" y2="109" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="380" y1="109" x2="408" y2="109" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="109" x2="598" y2="109" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="720" y1="109" x2="748" y2="109" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="40" y="196" font-size="12" font-weight="700" fill="#2f6fd0">volatile 读</text>
  <rect x="60" y="206" width="160" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="140" y="239" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6fd0">volatile 读</text>
  <rect x="250" y="206" width="120" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="310" y="239" text-anchor="middle" font-size="11.5" fill="#e08a1e">LoadLoad</text>
  <rect x="400" y="206" width="120" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="460" y="239" text-anchor="middle" font-size="11.5" fill="#e08a1e">LoadStore</text>
  <rect x="550" y="206" width="170" height="54" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="635" y="239" text-anchor="middle" font-size="11.5" fill="#1f2b38">之后的普通读写</text>
  <line x1="220" y1="233" x2="248" y2="233" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="370" y1="233" x2="398" y2="233" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="520" y1="233" x2="548" y2="233" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="742" y="226" font-size="11" fill="#5b6b7c">屏障阻止两侧读写</text>
  <text x="742" y="246" font-size="11" fill="#5b6b7c">跨越屏障重排序</text>

  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#1f2b38">x86 上只有 StoreLoad 需要真正的 lock 前缀指令，其余三道是空操作——这就是 volatile 写比读贵的原因</text>
</svg>
