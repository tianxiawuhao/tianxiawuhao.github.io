<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>JMM 抽象模型</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">JMM 抽象模型：线程只操作工作内存，共享变量靠主内存传递</text>

  <rect x="200" y="60" width="500" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f6fd0">线程 A 的工作内存（缓存 / 写缓冲 / 寄存器）</text>
  <text x="450" y="120" text-anchor="middle" font-size="12" fill="#1f2b38">a = 1　（普通变量的写，可能停在写缓冲里）</text>
  <text x="450" y="146" text-anchor="middle" font-size="12" fill="#1f2b38">flag = true　（volatile 写：屏障把结果刷出去）</text>

  <line x1="450" y1="170" x2="450" y2="223" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="474" y="202" font-size="11.5" fill="#2f6fd0">volatile 写：对后续的读可见</text>

  <rect x="200" y="225" width="500" height="110" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="255" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2b38">主内存：所有共享变量</text>
  <text x="450" y="285" text-anchor="middle" font-size="12" fill="#1f2b38">a、flag 都存放在这里，读写最终落到这里</text>
  <text x="450" y="311" text-anchor="middle" font-size="12" fill="#1f2b38">线程之间不能直接访问对方的工作内存</text>

  <line x1="450" y1="335" x2="450" y2="388" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="474" y="367" font-size="11.5" fill="#2f6fd0">volatile 读：从主内存刷新副本</text>

  <rect x="200" y="390" width="500" height="100" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="418" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2e9e5b">线程 B 的工作内存</text>
  <text x="450" y="447" text-anchor="middle" font-size="12" fill="#1f2b38">读到 flag == true，就一定看到 a == 1（happens-before 传递性）</text>
  <text x="450" y="470" text-anchor="middle" font-size="12" fill="#5b6b7c">依据：程序顺序规则 + volatile 规则 + 传递性</text>
</svg>
