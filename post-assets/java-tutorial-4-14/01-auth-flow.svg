<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Spring Security 认证与授权主链路示意图</title>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Spring Security 认证与授权主链路</text>

  <!-- 主链路：第 1 行 请求 -->
  <rect x="60" y="70" width="330" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="98" text-anchor="middle" font-size="13" fill="#1f2b38">HTTP 请求</text>

  <!-- 第 2 行 FilterChainProxy -->
  <rect x="60" y="136" width="330" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="225" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">FilterChainProxy（过滤器链入口）</text>
  <text x="225" y="172" text-anchor="middle" font-size="11" fill="#5b6b7c">按序执行匹配的过滤器</text>

  <!-- 第 3 行 认证过滤器 -->
  <rect x="60" y="202" width="330" height="46" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="225" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">认证过滤器</text>
  <text x="225" y="238" text-anchor="middle" font-size="11" fill="#5b6b7c">UsernamePasswordAuthenticationFilter</text>

  <!-- 第 4 行 AuthenticationManager -->
  <rect x="60" y="268" width="330" height="46" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="225" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">AuthenticationManager</text>
  <text x="225" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">ProviderManager 遍历 Provider</text>

  <!-- 第 5 行 UserDetailsService -->
  <rect x="60" y="334" width="330" height="46" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="225" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">UserDetailsService</text>
  <text x="225" y="370" text-anchor="middle" font-size="11" fill="#5b6b7c">loadUserByUsername 加载用户与权限</text>

  <!-- 第 6 行 生成 Authentication -->
  <rect x="60" y="400" width="330" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="225" y="419" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">生成 Authentication</text>
  <text x="225" y="436" text-anchor="middle" font-size="11" fill="#5b6b7c">含 principal 与 authorities</text>

  <!-- 第 7 行 SecurityContextHolder / 授权决策 -->
  <rect x="60" y="466" width="330" height="46" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="225" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">SecurityContextHolder</text>
  <text x="225" y="502" text-anchor="middle" font-size="11" fill="#5b6b7c">授权决策 AuthorizationFilter</text>

  <!-- 主链路纵向箭头 -->
  <line x1="225" y1="116" x2="225" y2="134" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="225" y1="182" x2="225" y2="200" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="225" y1="248" x2="225" y2="266" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="225" y1="314" x2="225" y2="332" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="225" y1="380" x2="225" y2="398" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="225" y1="446" x2="225" y2="464" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- 右侧说明（虚线箭头指向说明框） -->
  <line x1="390" y1="93" x2="436" y2="93" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="390" y1="159" x2="436" y2="159" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="390" y1="225" x2="436" y2="225" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="390" y1="291" x2="436" y2="291" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="390" y1="357" x2="436" y2="357" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="390" y1="423" x2="436" y2="423" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="390" y1="489" x2="436" y2="489" stroke="#c8d3e0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>

  <rect x="440" y="70" width="440" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="89" font-size="12" fill="#1f2b38">请求先进入 Servlet 过滤器链</text>
  <text x="460" y="106" font-size="11" fill="#5b6b7c">Spring Security 过滤器注册在其中</text>

  <rect x="440" y="136" width="440" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="155" font-size="12" fill="#1f2b38">过滤器按固定顺序执行</text>
  <text x="460" y="172" font-size="11" fill="#5b6b7c">会话 → 认证 → 异常处理 → 授权</text>

  <rect x="440" y="202" width="440" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="221" font-size="12" fill="#1f2b38">从请求中提取用户名与密码</text>
  <text x="460" y="238" font-size="11" fill="#5b6b7c">封装为尚未认证的 Authentication</text>

  <rect x="440" y="268" width="440" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="287" font-size="12" fill="#1f2b38">逐个 Provider 尝试认证</text>
  <text x="460" y="304" font-size="11" fill="#5b6b7c">常用 DaoAuthenticationProvider</text>

  <rect x="440" y="334" width="440" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="353" font-size="12" fill="#1f2b38">查询用户及其权限</text>
  <text x="460" y="370" font-size="11" fill="#5b6b7c">返回 UserDetails（账号、密码、权限）</text>

  <rect x="440" y="400" width="440" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="419" font-size="12" fill="#1f2b38">认证成功：填充 authorities</text>
  <text x="460" y="436" font-size="11" fill="#5b6b7c">认证失败：抛 AuthenticationException</text>

  <rect x="440" y="466" width="440" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="485" font-size="12" fill="#1f2b38">本次请求内共享认证信息</text>
  <text x="460" y="502" font-size="11" fill="#5b6b7c">有权限放行，无权限返回 403</text>

  <text x="450" y="534" text-anchor="middle" font-size="11" fill="#5b6b7c">认证回答“你是谁”，授权回答“你能做什么”</text>
</svg>
