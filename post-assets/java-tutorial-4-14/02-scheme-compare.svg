<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>三种权限方案的定位对比</title>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Spring Security、Shiro 与 JWT 的定位</text>

  <rect x="40" y="60" width="250" height="252" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="165" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f6fd0">Spring Security</text>
  <text x="56" y="124" font-size="11" font-weight="700" fill="#5b6b7c">定位</text>
  <text x="56" y="146" font-size="12" fill="#1f2b38">功能最完整的框架</text>
  <text x="56" y="178" font-size="11" font-weight="700" fill="#5b6b7c">核心</text>
  <text x="56" y="200" font-size="11.5" fill="#1f2b38">FilterChainProxy 多条链</text>
  <text x="56" y="220" font-size="11.5" fill="#1f2b38">Voter 投票决定放行</text>
  <text x="56" y="252" font-size="11" font-weight="700" fill="#5b6b7c">适合</text>
  <text x="56" y="274" font-size="11.5" fill="#1f2b38">Spring Boot 项目</text>
  <text x="56" y="294" font-size="11.5" fill="#1f2b38">需要方法级权限</text>

  <rect x="330" y="60" width="250" height="252" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="455" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2e9e5b">Apache Shiro</text>
  <text x="346" y="124" font-size="11" font-weight="700" fill="#5b6b7c">定位</text>
  <text x="346" y="146" font-size="12" fill="#1f2b38">轻量、API 直观</text>
  <text x="346" y="178" font-size="11" font-weight="700" fill="#5b6b7c">核心</text>
  <text x="346" y="200" font-size="11.5" fill="#1f2b38">Realm 提供认证</text>
  <text x="346" y="220" font-size="11.5" fill="#1f2b38">与授权数据</text>
  <text x="346" y="252" font-size="11" font-weight="700" fill="#5b6b7c">适合</text>
  <text x="346" y="274" font-size="11.5" fill="#1f2b38">非 Spring 项目</text>
  <text x="346" y="294" font-size="11.5" fill="#1f2b38">追求轻量</text>

  <rect x="620" y="60" width="250" height="252" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="745" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e08a1e">JWT</text>
  <text x="636" y="124" font-size="11" font-weight="700" fill="#5b6b7c">定位</text>
  <text x="636" y="146" font-size="12" fill="#1f2b38">只是令牌格式</text>
  <text x="636" y="178" font-size="11" font-weight="700" fill="#5b6b7c">核心</text>
  <text x="636" y="200" font-size="11.5" fill="#1f2b38">携带身份声明</text>
  <text x="636" y="220" font-size="11.5" fill="#1f2b38">不解决授权</text>
  <text x="636" y="252" font-size="11" font-weight="700" fill="#5b6b7c">适合</text>
  <text x="636" y="274" font-size="11.5" fill="#1f2b38">无状态、跨域</text>
  <text x="636" y="294" font-size="11.5" fill="#1f2b38">多端场景</text>

  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#5b6b7c">Spring Boot 项目优先 Spring Security；JWT 只负责携带身份，授权仍由框架或规则决定</text>
</svg>
