<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="545" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">判空与默认值的选择路径</text>

  <rect x="330" y="48" width="240" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="450" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">拿到一个可能为空的值</text>

  <rect x="330" y="110" width="240" height="36" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="450" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">需要产出什么结果？</text>

  <path d="M450 146 L450 168" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <line x1="116" y1="168" x2="784" y2="168" stroke="#c8d3e0" stroke-width="1.5"/>
  <path d="M116 168 L116 192" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M450 168 L450 192" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M784 168 L784 192" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="118" y="186" font-size="11" fill="#5b6b7c">只想判断</text>
  <text x="452" y="186" font-size="11" fill="#5b6b7c">要替换默认值</text>
  <text x="786" y="186" font-size="11" fill="#5b6b7c">要连续取值</text>

  <rect x="26" y="194" width="180" height="150" rx="8" fill="#f7f9fc" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="116" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">判空</text>
  <line x1="44" y1="232" x2="188" y2="232" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="44" y="254" font-size="12" fill="#1f2b38">Objects.isNull(a)</text>
  <text x="44" y="278" font-size="12" fill="#1f2b38">Objects.nonNull(a)</text>
  <text x="44" y="302" font-size="12" fill="#1f2b38">Objects.requireNonNull</text>
  <text x="44" y="326" font-size="12" fill="#e08a1e">反例：a == null 散落各处</text>

  <rect x="360" y="194" width="180" height="150" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="450" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">默认值</text>
  <line x1="378" y1="232" x2="522" y2="232" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="378" y="254" font-size="12" fill="#1f2b38">Optional.ofNullable</text>
  <text x="378" y="278" font-size="12" fill="#1f2b38">.orElse / .orElseGet</text>
  <text x="378" y="302" font-size="12" fill="#1f2b38">Objects.toString(x, "")</text>
  <text x="378" y="326" font-size="12" fill="#e08a1e">注意：orElse 总会求值</text>

  <rect x="694" y="194" width="180" height="150" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="784" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">链式取值</text>
  <line x1="712" y1="232" x2="856" y2="232" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="712" y="254" font-size="12" fill="#1f2b38">Optional.map</text>
  <text x="712" y="278" font-size="12" fill="#1f2b38">.flatMap().orElse(null)</text>
  <text x="712" y="302" font-size="12" fill="#1f2b38">避免多层 if 嵌套</text>
  <text x="712" y="326" font-size="12" fill="#e08a1e">勿用 Optional.get() 裸取</text>

  <path d="M116 344 L116 372 L450 372 L450 392" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M450 344 L450 392" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M784 344 L784 372 L450 372" stroke="#5b6b7c" stroke-width="1.5" fill="none"/>

  <rect x="255" y="394" width="390" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="450" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">选型结论</text>
  <text x="275" y="444" font-size="12" fill="#1f2b38">通用逻辑优先 JDK Objects / Optional，零依赖、可读性最好</text>
  <text x="275" y="464" font-size="12" fill="#e08a1e">只有批量字符串处理才引入 Commons Lang / Hutool，避免重复造轮子</text>

  <rect x="255" y="486" width="390" height="42" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="450" y="513" text-anchor="middle" font-size="12" fill="#1f2b38">判空的目标：把「空」收敛到边界层显式处理，业务层只接非空值</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 z" fill="#5b6b7c"/>
    </marker>
  </defs>
</svg>
