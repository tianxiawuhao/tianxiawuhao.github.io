<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="545" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java 工具类按用途分类</text>

  <rect x="330" y="48" width="240" height="36" rx="8" fill="#1f2b38"/>
  <text x="450" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">工具类 · 按用途分四类</text>

  <path d="M450 84 L450 98 L146 98 L146 118" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M450 84 L450 98 L450 118" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M450 84 L450 98 L754 98 L754 118" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M450 84 L450 98 L146 98 L146 308" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M450 84 L450 98 L754 98 L754 308" stroke="#5b6b7c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <rect x="26" y="120" width="240" height="180" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="146" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">1. HTTP / 远程调用</text>
  <line x1="46" y1="158" x2="246" y2="158" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="46" y="182" font-size="12" fill="#1f2b38">RestTemplate 封装</text>
  <text x="46" y="206" font-size="12" fill="#5b6b7c">统一超时、重试、异常码</text>
  <text x="46" y="230" font-size="12" fill="#e08a1e">超时勿用 getMessage().contains</text>
  <text x="46" y="254" font-size="12" fill="#e08a1e">判字符串用 instanceof 判 Map</text>
  <text x="46" y="278" font-size="12" fill="#5b6b7c">响应一律判空再解析</text>

  <rect x="330" y="120" width="240" height="180" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="450" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">2. 字符串 / 集合 / 判空</text>
  <line x1="350" y1="158" x2="550" y2="158" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="350" y="182" font-size="12" fill="#1f2b38">判空：JDK Objects / 首选</text>
  <text x="350" y="206" font-size="12" fill="#1f2b38">默认值：JDK Optional / 首选</text>
  <text x="350" y="230" font-size="12" fill="#5b6b7c">拼接：String.join 或 Collectors</text>
  <text x="350" y="254" font-size="12" fill="#e08a1e">谨慎 Spring StringUtils.split</text>
  <text x="350" y="278" font-size="12" fill="#e08a1e">勿用 tomcat 内部 StringUtils</text>

  <rect x="634" y="120" width="240" height="180" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="754" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">3. 对象存储 / 文件 IO</text>
  <line x1="654" y1="158" x2="854" y2="158" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="654" y="182" font-size="12" fill="#1f2b38">MinioClient + Args 构造器</text>
  <text x="654" y="206" font-size="12" fill="#5b6b7c">上传 / 合并 / 预签名 URL</text>
  <text x="654" y="230" font-size="12" fill="#e08a1e">旧 PutObjectOptions 已废弃</text>
  <text x="654" y="254" font-size="12" fill="#5b6b7c">统一 7 天有效期上限</text>
  <text x="654" y="278" font-size="12" fill="#e08a1e">try-with-resources 关流</text>

  <rect x="330" y="310" width="240" height="180" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.5"/>
  <text x="450" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5bd0">4. 脚本 / 表达式引擎</text>
  <line x1="350" y1="348" x2="550" y2="348" stroke="#c8d3e0" stroke-width="1.5"/>
  <text x="350" y="372" font-size="12" fill="#1f2b38">ScriptEngine 执行 JS 片段</text>
  <text x="350" y="396" font-size="12" fill="#5b6b7c">参数注入 + 结果回读</text>
  <text x="350" y="420" font-size="12" fill="#e08a1e">引擎非线程安全，勿共享</text>
  <text x="350" y="444" font-size="12" fill="#e08a1e">勿把入参直接拼进脚本</text>
  <text x="350" y="468" font-size="12" fill="#5b6b7c">JDK 15 起需引入外部引擎</text>

  <text x="26" y="522" font-size="11" fill="#5b6b7c">说明：通用工具类优先用 JDK 与 Spring 自带能力，再考虑 Commons Lang / Guava / Hutool 等第三方库，避免同一功能引入多套实现。</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 z" fill="#5b6b7c"/>
    </marker>
  </defs>
</svg>
