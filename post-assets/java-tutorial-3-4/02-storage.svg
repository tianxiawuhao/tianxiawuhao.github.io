<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>四种客户端存储选型对比</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">客户端存储选型：容量、生命周期与共享范围</text>
  <rect x="40" y="52" width="193" height="34" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="136.5" y="75" font-size="14" fill="#e08a1e" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">cookie</text>
  <rect x="245" y="52" width="193" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="341.5" y="75" font-size="14" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">localStorage</text>
  <rect x="450" y="52" width="193" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="546.5" y="75" font-size="14" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sessionStorage</text>
  <rect x="655" y="52" width="193" height="34" rx="6" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="751.5" y="75" font-size="14" fill="#7a5bd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">IndexedDB</text>
  <rect x="40" y="82" width="820" height="40" rx="5" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1"/>
  <text x="48" y="104" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="700">典型容量</text>
  <text x="136.5" y="104" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">约 4KB</text>
  <text x="341.5" y="104" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">约 5MB</text>
  <text x="546.5" y="104" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">约 5MB</text>
  <text x="751.5" y="104" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">按磁盘配额</text>
  <text x="48" y="144" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="700">生命周期</text>
  <text x="136.5" y="144" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">可设过期时间</text>
  <text x="341.5" y="144" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">除非主动删除</text>
  <text x="546.5" y="144" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">仅当前标签页会话</text>
  <text x="751.5" y="144" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">持久，除非被清理</text>
  <rect x="40" y="162" width="820" height="40" rx="5" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1"/>
  <text x="48" y="184" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="700">共享范围</text>
  <text x="136.5" y="184" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">同源请求携带</text>
  <text x="341.5" y="184" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">同源标签页共享</text>
  <text x="546.5" y="184" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">不跨标签页</text>
  <text x="751.5" y="184" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">同源，支持索引/事务</text>
  <text x="48" y="224" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="700">存什么</text>
  <text x="136.5" y="224" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">字符串</text>
  <text x="341.5" y="224" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">只能存字符串</text>
  <text x="546.5" y="224" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">只能存字符串</text>
  <text x="751.5" y="224" font-size="11.5" fill="#1f2b38" text-anchor="middle" font-weight="400">结构化数据与二进制</text>
  <rect x="40" y="300" width="820" height="66" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="326" font-size="12" fill="#2f6fd0" text-anchor="start" font-family="DejaVu Sans Mono, monospace">localStorage.setItem('tags', JSON.stringify(['java','web','dom']))</text>
  <text x="60" y="350" font-size="12" fill="#2f6fd0" text-anchor="start" font-family="DejaVu Sans Mono, monospace">const saved = JSON.parse(localStorage.getItem('tags') || '[]')</text>
  <rect x="40" y="384" width="820" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="60" y="410" font-size="13" fill="#2e9e5b" text-anchor="start" font-weight="700">选型口诀</text>
  <text x="60" y="436" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="400">少量键值 → localStorage / sessionStorage（API 相同：setItem / getItem / removeItem / clear）</text>
  <text x="60" y="460" font-size="12" fill="#1f2b38" text-anchor="start" font-weight="400">需要随请求发给服务端 → cookie ｜ 数据量大、要索引或事务 → IndexedDB（异步，API 啰嗦但容量大）</text>
</svg>
