<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>事件流捕获目标冒泡与事件委托</title>
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">事件流三阶段：捕获 → 目标 → 冒泡</text>
<line x1="70" y1="140" x2="752" y2="140" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="410" y="128" font-size="12" fill="#2f6fd0" text-anchor="middle">① 捕获阶段：window → document → ul → li</text>
<rect x="60" y="170" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="145" y="210" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">window</text>
<rect x="260" y="170" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="345" y="210" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="700">document</text>
<rect x="460" y="170" width="170" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
<text x="545" y="210" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">ul#todo-list</text>
<rect x="660" y="170" width="180" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="750" y="200" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">li（目标元素）</text>
<text x="750" y="222" font-size="11.5" fill="#5b6b7c" text-anchor="middle">② 目标阶段</text>
<line x1="750" y1="170" x2="750" y2="140" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="750" y1="240" x2="750" y2="265" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="755" y1="265" x2="148" y2="265" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="450" y="288" font-size="12" fill="#2e9e5b" text-anchor="middle">③ 冒泡阶段：li → ul → document → window</text>
<rect x="200" y="315" width="500" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="338" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">事件委托：把监听器挂在稳定的父容器上</text>
<text x="450" y="360" font-size="11.5" fill="#5b6b7c" text-anchor="middle">回调里用 event.target.closest('li') 找到真正被点击的元素</text>
<!-- 设计说明：四个节点横向排列，上箭头为捕获路径、下箭头为冒泡路径，目标 li 用蓝色高亮，底部为委托要点。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
<!-- 版式备注：本图绘制在 900 像素宽的白色画布上，标题基线 y=30，图形主体自 y=55 起，同级元素间距不小于 20 像素，最小字号 11.5 像素；矩形圆角 rx=8、边框 1.4 像素，箭头统一引用 defs 中的 ah 标记，颜色只用站内纸色配色（墨色 #1f2b38、说明 #5b6b7c、蓝 #2f6fd0、绿 #2e9e5b、橙 #e08a1e、紫 #7a5bd0）。 -->
</svg>
