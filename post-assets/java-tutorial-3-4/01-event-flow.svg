<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>事件流三阶段与事件委托</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">事件流三阶段与事件委托</text>
  <rect x="40" y="48" width="170" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="125" y="68" font-size="12" fill="#2f6fd0" text-anchor="middle" font-weight="700">① 捕获 capture</text>
  <rect x="365" y="48" width="170" height="30" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="68" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700">② 目标 target</text>
  <rect x="690" y="48" width="170" height="30" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="775" y="68" font-size="12" fill="#2e9e5b" text-anchor="middle" font-weight="700">③ 冒泡 bubble</text>
  <path d="M 95 86 L 95 300" fill="none" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 125 92 L 125 300" fill="none" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 155 92 L 155 300" fill="none" stroke="#2f6fd0" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 745 302 L 745 92" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 775 302 L 775 92" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 805 302 L 805 92" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="86" width="240" height="30" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="106" font-size="12" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">window</text>
  <path d="M 450 116 L 450 136" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="136" width="240" height="30" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="156" font-size="12" fill="#1f2b38" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">document</text>
  <path d="M 450 166 L 450 186" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="186" width="240" height="44" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="206" font-size="13" fill="#2e9e5b" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ul#todo-list</text>
  <text x="450" y="222" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">事件委托：监听器挂在这个稳定的父容器上</text>
  <path d="M 450 230 L 450 258" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="320" y="258" width="260" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="278" font-size="13" fill="#2f6fd0" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">li.todo-item</text>
  <text x="450" y="294" font-size="11" fill="#5b6b7c" text-anchor="middle" font-weight="400">回调里用 event.target.closest() 定位真正被点的元素</text>
  <text x="450" y="322" font-size="12" fill="#2f6fd0" text-anchor="middle">捕获（capture）：window → document → 祖先元素 → 目标，默认不触发回调</text>
  <text x="450" y="342" font-size="12" fill="#2e9e5b" text-anchor="middle">冒泡（bubble）：目标 → 祖先元素 → document → window，绝大多数事件默认冒泡</text>
  <rect x="40" y="352" width="400" height="108" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="376" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">addEventListener 第三个参数</text>
  <text x="230" y="398" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">在捕获阶段执行回调</text>
  <text x="60" y="420" font-size="11" fill="#2f6fd0" text-anchor="start" font-family="DejaVu Sans Mono, monospace">{ once: true }</text>
  <text x="230" y="420" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">只执行一次后自动解绑</text>
  <text x="60" y="442" font-size="11" fill="#2f6fd0" text-anchor="start" font-family="DejaVu Sans Mono, monospace">{ passive: true }</text>
  <text x="230" y="442" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">承诺不调用 preventDefault，滚动更顺</text>
  <rect x="460" y="352" width="400" height="108" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="480" y="376" font-size="13" fill="#1f2b38" text-anchor="start" font-weight="700">两个方法作用完全不同</text>
  <text x="480" y="398" font-size="11" fill="#e08a1e" text-anchor="start" font-family="DejaVu Sans Mono, monospace">preventDefault()</text>
  <text x="640" y="398" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">阻止浏览器默认行为</text>
  <text x="480" y="420" font-size="11" fill="#e08a1e" text-anchor="start" font-family="DejaVu Sans Mono, monospace">stopPropagation()</text>
  <text x="650" y="420" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">阻止事件继续传播</text>
  <text x="480" y="442" font-size="11" fill="#5b6b7c" text-anchor="start" font-weight="400">event.target 是实际触发者，currentTarget 是绑定者</text>
</svg>
