<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>本地存储选型决策流程</title>
<rect width="900" height="480" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
<text x="450" y="30" font-size="17" fill="#1f2b38" text-anchor="middle" font-weight="700">本地存储选型：四条路怎么选</text>
<rect x="330" y="55" width="240" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
<text x="450" y="81" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">要在浏览器本地存数据</text>
<line x1="450" y1="97" x2="450" y2="123" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="310" y="125" width="280" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="155" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">要随每次请求发给服务器？</text>
<line x1="330" y1="168" x2="210" y2="196" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="250" y="172" font-size="12" fill="#e08a1e" text-anchor="start">是</text>
<rect x="60" y="200" width="250" height="112" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
<text x="185" y="228" font-size="13" fill="#7a5bd0" text-anchor="middle" font-weight="700">cookie</text>
<text x="185" y="252" font-size="11.5" fill="#5b6b7c" text-anchor="middle">≈ 4KB，每次请求自动携带</text>
<text x="185" y="274" font-size="11.5" fill="#5b6b7c" text-anchor="middle">只能存字符串，数量有上限</text>
<text x="185" y="296" font-size="11.5" fill="#5b6b7c" text-anchor="middle">会话标识请配 HttpOnly</text>
<line x1="450" y1="175" x2="450" y2="213" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="462" y="198" font-size="12" fill="#e08a1e" text-anchor="start">否</text>
<rect x="330" y="215" width="240" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
<text x="450" y="250" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="700">数据量小、只需键值？</text>
<text x="450" y="272" font-size="11.5" fill="#5b6b7c" text-anchor="middle">（几十 KB 以内）</text>
<line x1="570" y1="255" x2="630" y2="255" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="600" y="246" font-size="12" fill="#e08a1e" text-anchor="middle">否</text>
<rect x="630" y="200" width="240" height="112" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="750" y="228" font-size="13" fill="#2e9e5b" text-anchor="middle" font-weight="700">IndexedDB</text>
<text x="750" y="252" font-size="11.5" fill="#5b6b7c" text-anchor="middle">容量按磁盘配额，很大</text>
<text x="750" y="274" font-size="11.5" fill="#5b6b7c" text-anchor="middle">支持索引、游标与事务</text>
<text x="750" y="296" font-size="11.5" fill="#5b6b7c" text-anchor="middle">API 异步啰嗦，最后再选</text>
<line x1="450" y1="295" x2="450" y2="320" stroke="#5b6b7c" stroke-width="1.4"/>
<path d="M450,320 H435 V338" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M450,320 H745 V338" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="462" y="314" font-size="12" fill="#e08a1e" text-anchor="start">是</text>
<rect x="300" y="340" width="270" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="435" y="366" font-size="12.5" fill="#2e9e5b" text-anchor="middle" font-weight="700">localStorage</text>
<text x="435" y="389" font-size="11.5" fill="#5b6b7c" text-anchor="middle">长期保留，同源标签页共享</text>
<text x="435" y="411" font-size="11.5" fill="#5b6b7c" text-anchor="middle">只能存字符串，对象要 JSON 序列化</text>
<rect x="605" y="340" width="265" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
<text x="737" y="366" font-size="12.5" fill="#2e9e5b" text-anchor="middle" font-weight="700">sessionStorage</text>
<text x="737" y="389" font-size="11.5" fill="#5b6b7c" text-anchor="middle">仅当前标签页会话内有效</text>
<text x="737" y="411" font-size="11.5" fill="#5b6b7c" text-anchor="middle">刷新保留，关掉标签页就没了</text>
<text x="450" y="456" font-size="11.5" fill="#5b6b7c" text-anchor="middle">同源 = 协议 + 域名 + 端口一致，localStorage 才会跨标签页共享</text>
<!-- 设计说明：从「是否随请求发送」和「数据量大小」两个判断出发，分别导向 cookie、localStorage、sessionStorage 与 IndexedDB。 -->
</svg>
