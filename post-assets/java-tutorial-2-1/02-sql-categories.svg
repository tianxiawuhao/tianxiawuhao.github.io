<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>SQL 语句的四大分类：DDL、DML、DQL、DCL</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">SQL 语句按作用分四类</text>

  <rect x="350" y="52" width="200" height="42" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="79" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fd0">SQL 语句</text>

  <line x1="370" y1="94" x2="150" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="420" y1="94" x2="390" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="480" y1="94" x2="510" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="530" y1="94" x2="750" y2="146" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="50" y="150" width="200" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="150" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">DDL 定义结构</text>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#1f2b38">CREATE / ALTER</text>
  <text x="150" y="229" text-anchor="middle" font-size="12" fill="#1f2b38">DROP / TRUNCATE</text>
  <text x="150" y="254" text-anchor="middle" font-size="12" fill="#5b6b7c">改结构，自动提交</text>

  <rect x="290" y="150" width="200" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="390" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">DML 操纵数据</text>
  <text x="390" y="205" text-anchor="middle" font-size="12" fill="#1f2b38">INSERT / UPDATE</text>
  <text x="390" y="229" text-anchor="middle" font-size="12" fill="#1f2b38">DELETE</text>
  <text x="390" y="254" text-anchor="middle" font-size="12" fill="#5b6b7c">改行，可回滚</text>

  <rect x="530" y="150" width="200" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="630" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">DQL 查询数据</text>
  <text x="630" y="205" text-anchor="middle" font-size="12" fill="#1f2b38">SELECT</text>
  <text x="630" y="229" text-anchor="middle" font-size="12" fill="#1f2b38">WHERE / JOIN</text>
  <text x="630" y="254" text-anchor="middle" font-size="12" fill="#5b6b7c">不改数据</text>

  <rect x="770" y="150" width="110" height="120" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="825" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">DCL</text>
  <text x="825" y="205" text-anchor="middle" font-size="12" fill="#1f2b38">GRANT</text>
  <text x="825" y="229" text-anchor="middle" font-size="12" fill="#1f2b38">REVOKE</text>
  <text x="825" y="254" text-anchor="middle" font-size="12" fill="#5b6b7c">权限</text>

  <text x="450" y="303" text-anchor="middle" font-size="12" fill="#5b6b7c">日常最常写的是 DDL 与 DML；DQL 单独成类，因为它不改变任何数据</text>
</svg>
