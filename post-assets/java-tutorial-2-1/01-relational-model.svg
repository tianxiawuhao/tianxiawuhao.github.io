<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>关系模型中的库、表、行、列与主键</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">关系模型：库 &gt; 表 &gt; 行 / 列</text>

  <rect x="30" y="55" width="120" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="90" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">数据库 shop</text>

  <line x1="150" y1="75" x2="200" y2="75" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="200" y="55" width="120" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="260" y="80" text-anchor="middle" font-size="14" fill="#1f2b38">表 user</text>

  <line x1="320" y1="75" x2="370" y2="75" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="370" y="55" width="180" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="460" y="80" text-anchor="middle" font-size="13" fill="#1f2b38">行 = 一条记录</text>

  <line x1="550" y1="75" x2="600" y2="75" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="600" y="55" width="180" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="80" text-anchor="middle" font-size="13" fill="#1f2b38">列 = 一个字段</text>

  <rect x="30" y="125" width="840" height="180" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>

  <rect x="50" y="145" width="90" height="34" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="95" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">id 主键</text>
  <rect x="150" y="145" width="120" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="167" text-anchor="middle" font-size="13" fill="#1f2b38">name 非空</text>
  <rect x="280" y="145" width="120" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="340" y="167" text-anchor="middle" font-size="13" fill="#1f2b38">age</text>
  <rect x="410" y="145" width="160" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="490" y="167" text-anchor="middle" font-size="13" fill="#1f2b38">created_at 默认值</text>

  <line x1="50" y1="196" x2="850" y2="196" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="95" y="222" text-anchor="middle" font-size="13" fill="#1f2b38">1</text>
  <text x="210" y="222" text-anchor="middle" font-size="13" fill="#1f2b38">张三</text>
  <text x="340" y="222" text-anchor="middle" font-size="13" fill="#1f2b38">28</text>
  <text x="490" y="222" text-anchor="middle" font-size="13" fill="#1f2b38">2024-01-01</text>
  <text x="95" y="252" text-anchor="middle" font-size="13" fill="#1f2b38">2</text>
  <text x="210" y="252" text-anchor="middle" font-size="13" fill="#1f2b38">李四</text>
  <text x="340" y="252" text-anchor="middle" font-size="13" fill="#1f2b38">31</text>
  <text x="490" y="252" text-anchor="middle" font-size="13" fill="#1f2b38">2024-02-01</text>
  <text x="95" y="282" text-anchor="middle" font-size="13" fill="#1f2b38">3</text>
  <text x="210" y="282" text-anchor="middle" font-size="13" fill="#1f2b38">王五</text>
  <text x="340" y="282" text-anchor="middle" font-size="13" fill="#1f2b38">25</text>
  <text x="490" y="282" text-anchor="middle" font-size="13" fill="#1f2b38">2024-03-01</text>

  <text x="690" y="222" text-anchor="middle" font-size="12" fill="#5b6b7c">第 1 行</text>
  <text x="690" y="252" text-anchor="middle" font-size="12" fill="#5b6b7c">第 2 行</text>
  <text x="690" y="282" text-anchor="middle" font-size="12" fill="#5b6b7c">第 3 行</text>
  <text x="450" y="325" text-anchor="middle" font-size="12" fill="#5b6b7c">表中每一行的「列」含义相同，主键保证每一行都能被唯一标识</text>
</svg>
