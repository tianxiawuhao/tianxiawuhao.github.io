<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>主表与从表通过外键关联</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">外键：从表引用主表的主键</text>

  <rect x="50" y="60" width="300" height="210" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="200" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">主表 user（父表）</text>
  <rect x="70" y="100" width="90" height="32" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="115" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">id 主键</text>
  <rect x="170" y="100" width="160" height="32" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="250" y="121" text-anchor="middle" font-size="12" fill="#1f2b38">name</text>
  <line x1="70" y1="148" x2="330" y2="148" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="115" y="172" text-anchor="middle" font-size="12" fill="#1f2b38">1</text>
  <text x="250" y="172" text-anchor="middle" font-size="12" fill="#1f2b38">张三</text>
  <text x="115" y="202" text-anchor="middle" font-size="12" fill="#1f2b38">2</text>
  <text x="250" y="202" text-anchor="middle" font-size="12" fill="#1f2b38">李四</text>
  <text x="200" y="245" text-anchor="middle" font-size="12" fill="#5b6b7c">主键值唯一，可被别的表引用</text>

  <line x1="350" y1="165" x2="550" y2="165" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="152" text-anchor="middle" font-size="12" fill="#5b6b7c">FOREIGN KEY</text>

  <rect x="550" y="60" width="300" height="210" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="700" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">从表 orders（子表）</text>
  <rect x="570" y="100" width="80" height="32" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="610" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">id 主键</text>
  <rect x="660" y="100" width="170" height="32" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="745" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">user_id 外键</text>
  <line x1="570" y1="148" x2="830" y2="148" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="610" y="172" text-anchor="middle" font-size="12" fill="#1f2b38">101</text>
  <text x="745" y="172" text-anchor="middle" font-size="12" fill="#1f2b38">1</text>
  <text x="610" y="202" text-anchor="middle" font-size="12" fill="#1f2b38">102</text>
  <text x="745" y="202" text-anchor="middle" font-size="12" fill="#1f2b38">2</text>
  <text x="700" y="245" text-anchor="middle" font-size="12" fill="#5b6b7c">外键值必须在主表中存在</text>

  <text x="450" y="310" text-anchor="middle" font-size="12" fill="#1f2b38">外键挡住了脏数据：插入 user_id = 99 会被数据库直接拒绝</text>
  <text x="450" y="338" text-anchor="middle" font-size="12" fill="#5b6b7c">代价是写入需额外校验；互联网大厂常改由应用层保证一致性</text>
</svg>
