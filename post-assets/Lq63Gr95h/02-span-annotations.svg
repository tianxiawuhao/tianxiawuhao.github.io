<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>一次跨服务调用的时间线：cs、sr、ss、cr 四个注解</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">一次跨服务调用的时间线：cs / sr / ss / cr 四个注解</text>

  <text x="136" y="129" text-anchor="end" font-size="12.5" font-weight="700" fill="#2f6fd0">Service 1</text>
  <text x="136" y="219" text-anchor="end" font-size="12.5" font-weight="700" fill="#2e9e5b">Service 2</text>

  <text x="150" y="100" font-size="11" fill="#2f6fd0">cs Client Send</text>
  <text x="750" y="100" text-anchor="end" font-size="11" fill="#7a5bd0">cr Client Receive</text>
  <rect x="150" y="110" width="600" height="26" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="128" text-anchor="middle" font-size="12" fill="#1f2b38">Span B（Span ID = B，Trace ID = X）</text>
  <circle cx="150" cy="123" r="4.5" fill="#2f6fd0" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="750" cy="123" r="4.5" fill="#7a5bd0" stroke="#ffffff" stroke-width="1.4"/>

  <line x1="150" y1="138" x2="206" y2="198" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="216" y="166" font-size="11" fill="#5b6b7c">网络传输（请求）</text>

  <text x="210" y="190" font-size="11" fill="#2e9e5b">sr Server Receive</text>
  <text x="690" y="190" text-anchor="end" font-size="11" fill="#e08a1e">ss Server Send</text>
  <rect x="210" y="200" width="480" height="26" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="#1f2b38">Span B 在服务端的部分</text>
  <circle cx="210" cy="213" r="4.5" fill="#2e9e5b" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="690" cy="213" r="4.5" fill="#e08a1e" stroke="#ffffff" stroke-width="1.4"/>

  <line x1="690" y1="228" x2="744" y2="138" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="682" y="166" text-anchor="end" font-size="11" fill="#5b6b7c">网络传输（响应）</text>

  <rect x="250" y="250" width="400" height="26" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="268" text-anchor="middle" font-size="12" fill="#1f2b38">Span C：Service 2 内部处理（Parent = B）</text>

  <line x1="150" y1="316" x2="790" y2="316" stroke="#c8d3e0" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="800" y="320" font-size="11" fill="#5b6b7c">时间</text>

  <text x="40" y="360" font-size="11" fill="#5b6b7c">cs / sr / ss / cr 是同一个 Span B 在不同位置留下的注解；Span C 是 Service 2 内部的处理节点，Parent 指向 B。</text>
</svg>
