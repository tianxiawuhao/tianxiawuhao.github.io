<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>同一个 Trace ID 串起所有 Span，Parent ID 标明父子关系</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">同一个 Trace ID 串起所有 Span，Parent ID 标明父子关系</text>

  <rect x="40" y="52" width="820" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="74" font-size="12.5" font-weight="700" fill="#1f2b38">调用环节</text>
  <text x="296" y="74" font-size="12.5" font-weight="700" fill="#1f2b38">说明</text>
  <text x="645" y="74" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">Span ID</text>
  <text x="735" y="74" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">Parent ID</text>
  <text x="820" y="74" font-size="12.5" font-weight="700" fill="#1f2b38" text-anchor="middle">Trace ID</text>

  <rect x="40" y="86" width="820" height="34" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="108" font-size="12.5" fill="#1f2b38">Service 1 收到请求</text>
  <text x="296" y="108" font-size="11" fill="#5b6b7c">入口节点，创建 Trace ID</text>
  <text x="645" y="108" font-size="12.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">A</text>
  <text x="735" y="108" font-size="12.5" fill="#5b6b7c" text-anchor="middle">null</text>
  <text x="820" y="108" font-size="12.5" fill="#5b6b7c" text-anchor="middle">X</text>

  <rect x="40" y="124" width="820" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="146" font-size="12.5" fill="#1f2b38">Service 1 → Service 2</text>
  <text x="296" y="146" font-size="11" fill="#5b6b7c">跨服务调用，含 4 个注解</text>
  <text x="645" y="146" font-size="12.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">B</text>
  <text x="735" y="146" font-size="12.5" fill="#5b6b7c" text-anchor="middle">A</text>
  <text x="820" y="146" font-size="12.5" fill="#5b6b7c" text-anchor="middle">X</text>

  <rect x="40" y="162" width="820" height="34" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="184" font-size="12.5" fill="#1f2b38">Service 2 内部处理</text>
  <text x="296" y="184" font-size="11" fill="#5b6b7c">服务内部的处理过程</text>
  <text x="645" y="184" font-size="12.5" font-weight="700" fill="#2e9e5b" text-anchor="middle">C</text>
  <text x="735" y="184" font-size="12.5" fill="#5b6b7c" text-anchor="middle">B</text>
  <text x="820" y="184" font-size="12.5" fill="#5b6b7c" text-anchor="middle">X</text>

  <rect x="40" y="200" width="820" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="222" font-size="12.5" fill="#1f2b38">Service 2 → Service 3</text>
  <text x="296" y="222" font-size="11" fill="#5b6b7c">跨服务调用，含 4 个注解</text>
  <text x="645" y="222" font-size="12.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">D</text>
  <text x="735" y="222" font-size="12.5" fill="#5b6b7c" text-anchor="middle">C</text>
  <text x="820" y="222" font-size="12.5" fill="#5b6b7c" text-anchor="middle">X</text>

  <rect x="40" y="238" width="820" height="34" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="260" font-size="12.5" fill="#1f2b38">Service 3 内部处理</text>
  <text x="296" y="260" font-size="11" fill="#5b6b7c">服务内部的处理过程</text>
  <text x="645" y="260" font-size="12.5" font-weight="700" fill="#2e9e5b" text-anchor="middle">E</text>
  <text x="735" y="260" font-size="12.5" fill="#5b6b7c" text-anchor="middle">D</text>
  <text x="820" y="260" font-size="12.5" fill="#5b6b7c" text-anchor="middle">X</text>

  <rect x="40" y="276" width="820" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="298" font-size="12.5" fill="#1f2b38">Service 2 → Service 4</text>
  <text x="296" y="298" font-size="11" fill="#5b6b7c">跨服务调用，含 4 个注解</text>
  <text x="645" y="298" font-size="12.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">F</text>
  <text x="735" y="298" font-size="12.5" fill="#5b6b7c" text-anchor="middle">C</text>
  <text x="820" y="298" font-size="12.5" fill="#5b6b7c" text-anchor="middle">X</text>

  <rect x="40" y="314" width="820" height="34" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="56" y="336" font-size="12.5" fill="#1f2b38">Service 4 内部处理</text>
  <text x="296" y="336" font-size="11" fill="#5b6b7c">服务内部的处理过程</text>
  <text x="645" y="336" font-size="12.5" font-weight="700" fill="#2e9e5b" text-anchor="middle">G</text>
  <text x="735" y="336" font-size="12.5" fill="#5b6b7c" text-anchor="middle">F</text>
  <text x="820" y="336" font-size="12.5" fill="#5b6b7c" text-anchor="middle">X</text>

  <line x1="280" y1="52" x2="280" y2="348" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="600" y1="52" x2="600" y2="348" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="690" y1="52" x2="690" y2="348" stroke="#c8d3e0" stroke-width="1.4"/>
  <line x1="780" y1="52" x2="780" y2="348" stroke="#c8d3e0" stroke-width="1.4"/>

  <line x1="40" y1="382" x2="70" y2="382" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="80" y="386" font-size="11" fill="#5b6b7c">Span A 是根节点，Parent ID 为空；其余节点都靠 Parent ID 找到自己的父节点，Trace ID 全程不变。</text>
</svg>
