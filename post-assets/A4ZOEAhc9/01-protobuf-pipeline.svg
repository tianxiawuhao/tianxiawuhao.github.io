<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Netty 中 Protobuf 的编解码流程</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Netty 中 Protobuf 的编解码流程</text>

  <rect x="30" y="55" width="360" height="310" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="210" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">客户端（发送方）</text>

  <rect x="50" y="100" width="320" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="123" text-anchor="middle" font-size="13" fill="#1f2b38">MyDataInfo.MyMessage</text>
  <text x="210" y="142" text-anchor="middle" font-size="11" fill="#5b6b7c">业务 POJO 对象（学生 / 工人）</text>

  <line x1="210" y1="156" x2="210" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="50" y="186" width="320" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="210" text-anchor="middle" font-size="13" fill="#1f2b38">ProtobufEncoder（出站编码器）</text>
  <text x="210" y="231" text-anchor="middle" font-size="11" fill="#5b6b7c">把 MyMessage 序列化为二进制字节</text>

  <line x1="210" y1="250" x2="210" y2="278" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="50" y="280" width="320" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="210" y="303" text-anchor="middle" font-size="13" fill="#1f2b38">ChannelPipeline</text>
  <text x="210" y="322" text-anchor="middle" font-size="11" fill="#5b6b7c">addLast("encoder", new ProtobufEncoder())</text>

  <rect x="510" y="55" width="360" height="310" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="690" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">服务端（接收方）</text>

  <rect x="530" y="100" width="320" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="123" text-anchor="middle" font-size="13" fill="#1f2b38">ChannelPipeline</text>
  <text x="690" y="142" text-anchor="middle" font-size="11" fill="#5b6b7c">addLast("decoder", new ProtobufDecoder(…))</text>

  <line x1="690" y1="156" x2="690" y2="184" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="530" y="186" width="320" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="210" text-anchor="middle" font-size="13" fill="#1f2b38">ProtobufDecoder（入站解码器）</text>
  <text x="690" y="231" text-anchor="middle" font-size="11" fill="#5b6b7c">按 MyMessage 结构还原成对象</text>

  <line x1="690" y1="250" x2="690" y2="278" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="530" y="280" width="320" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="690" y="303" text-anchor="middle" font-size="13" fill="#1f2b38">GroupChatServerHandler</text>
  <text x="690" y="322" text-anchor="middle" font-size="11" fill="#5b6b7c">channelRead0 直接拿到 MyMessage 对象</text>

  <line x1="392" y1="210" x2="508" y2="210" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#5b6b7c">TCP 二进制字节流</text>
</svg>
