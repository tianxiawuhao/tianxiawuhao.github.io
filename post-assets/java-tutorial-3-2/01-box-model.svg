<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>CSS 盒模型：content、padding、border、margin</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">CSS 盒模型：content、padding、border、margin</text>
  <rect x="60" y="60" width="460" height="300" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="290" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b7c">margin 外边距（透明的间隔，不计入背景）</text>
  <rect x="95" y="100" width="390" height="225" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="290" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">border 边框</text>
  <rect x="130" y="138" width="320" height="155" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="290" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">padding 内边距（背景色会铺到这里）</text>
  <rect x="170" y="176" width="240" height="88" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="290" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">width / height</text>
  <text x="290" y="236" text-anchor="middle" font-size="12" fill="#1f2b38">默认只表示内容区大小</text>
  <line x1="170" y1="278" x2="410" y2="278" stroke="#2f6fd0" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#2f6fd0">width = content 宽度</text>
  <line x1="130" y1="390" x2="450" y2="390" stroke="#2e9e5b" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="290" y="380" text-anchor="middle" font-size="12" fill="#2e9e5b">content + 2×padding + 2×border</text>
  <rect x="570" y="90" width="290" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="715" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">box-sizing: content-box</text>
  <text x="715" y="133" text-anchor="middle" font-size="12" fill="#1f2b38">width 100px 变成 122px（默认）</text>
  <rect x="570" y="170" width="290" height="56" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="715" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">box-sizing: border-box</text>
  <text x="715" y="213" text-anchor="middle" font-size="12" fill="#1f2b38">width 100px 就是 100px</text>
  <rect x="570" y="250" width="290" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="715" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">box-sizing 不可继承</text>
  <text x="715" y="297" text-anchor="middle" font-size="12" fill="#1f2b38">用通配符统一设置：</text>
  <text x="715" y="317" text-anchor="middle" font-size="12" fill="#1f2b38">*, *::before, *::after</text>
  <text x="715" y="340" text-anchor="middle" font-size="12" fill="#1f2b38">{ box-sizing: border-box; }</text>
</svg>
