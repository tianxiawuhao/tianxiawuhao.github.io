<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>CSS 定位方式与包含块</title>
  <rect width="900" height="424" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">CSS 定位方式与包含块</text>
  <rect x="60" y="55" width="780" height="250" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6b7c">包含块：离它最近、且 position 不是 static 的祖先元素</text>
  <rect x="290" y="95" width="320" height="190" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">position: relative 的父容器</text>
  <rect x="330" y="140" width="240" height="120" rx="6" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">普通文档流内容</text>
  <rect x="470" y="150" width="120" height="52" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="530" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">position: absolute</text>
  <text x="530" y="190" text-anchor="middle" font-size="12" fill="#1f2b38">top / right 相对父容器</text>
  <line x1="590" y1="176" x2="600" y2="176" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="290" y1="360" x2="840" y2="360" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="150" y="352" text-anchor="middle" font-size="12" fill="#5b6b7c">static</text>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#5b6b7c">默认，跟随文档流</text>
  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#5b6b7c">fixed</text>
  <text x="450" y="372" text-anchor="middle" font-size="11" fill="#5b6b7c">相对视口，滚动不动</text>
  <text x="740" y="352" text-anchor="middle" font-size="12" fill="#5b6b7c">sticky</text>
  <text x="740" y="372" text-anchor="middle" font-size="11" fill="#5b6b7c">到阈值前是 relative，之后钉住</text>
  <text x="450" y="404" text-anchor="middle" font-size="12" fill="#e08a1e">注意：z-index 只对 position 不是 static 的元素生效，且只在自己的层叠上下文内比较</text>
</svg>
