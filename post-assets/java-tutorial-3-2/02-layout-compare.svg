<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>浮动、Flex 与 Grid 三种布局方式对比</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">浮动、Flex 与 Grid 三种布局方式对比</text>
  <rect x="40" y="58" width="240" height="248" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="160" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#e08a1e">float 浮动</text>
  <text x="160" y="106" text-anchor="middle" font-size="12" fill="#5b6b7c">脱离文档流，需手工清除</text>
  <rect x="62" y="120" width="196" height="70" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#1f2b38">父容器高度塌陷</text>
  <line x1="160" y1="190" x2="160" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="62" y="228" width="196" height="56" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="160" y="252" text-anchor="middle" font-size="12" fill="#1f2b38">clear: both 或</text>
  <text x="160" y="271" text-anchor="middle" font-size="12" fill="#1f2b38">display: flow-root</text>
  <rect x="310" y="58" width="240" height="248" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="430" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">flex 一维排列</text>
  <text x="430" y="106" text-anchor="middle" font-size="12" fill="#5b6b7c">主轴一行 / 一列，自动分配空间</text>
  <rect x="340" y="120" width="180" height="22" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <rect x="332" y="154" width="58" height="90" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <rect x="401" y="154" width="58" height="90" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <rect x="470" y="154" width="58" height="90" rx="4" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="430" y="266" text-anchor="middle" font-size="12" fill="#1f2b38">flex: 1 均分剩余空间</text>
  <text x="430" y="288" text-anchor="middle" font-size="12" fill="#1f2b38">justify-content / align-items</text>
  <rect x="580" y="58" width="280" height="248" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="720" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9e5b">grid 二维网格</text>
  <text x="720" y="106" text-anchor="middle" font-size="12" fill="#5b6b7c">行列同时控制，适合整页骨架</text>
  <rect x="602" y="122" width="70" height="60" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <rect x="680" y="122" width="70" height="60" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <rect x="758" y="122" width="70" height="60" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <rect x="602" y="190" width="148" height="60" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <rect x="758" y="190" width="70" height="60" rx="4" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="720" y="276" text-anchor="middle" font-size="12" fill="#1f2b38">grid-template-columns</text>
  <text x="720" y="296" text-anchor="middle" font-size="12" fill="#1f2b38">配合媒体查询改列数</text>
  <text x="450" y="336" text-anchor="middle" font-size="12" fill="#5b6b7c">优先级建议：能用 flex / grid 就不要用 float 排版；float 只留给「文字环绕图片」</text>
</svg>
