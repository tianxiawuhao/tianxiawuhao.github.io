<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>值栈与上下文的取值顺序</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">值栈（root）与上下文：不加 # 与加 # 的查找顺序</text>

  <text x="44" y="70" font-size="13" font-weight="700" fill="#2f6fd0">对象栈 CompoundRoot（根对象：直接写属性名，不加 #）</text>
  <line x1="62" y1="90" x2="62" y2="252" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="74" y="158" font-size="12" fill="#5b6b7c">查找顺序</text>
  <text x="74" y="176" font-size="12" fill="#5b6b7c">自栈顶向下</text>

  <rect x="150" y="88" width="560" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="166" y="110" font-size="13" fill="#1f2b38">[0] Map { nickname = Curry }</text>
  <text x="166" y="128" font-size="11" fill="#5b6b7c">set('nickname', 'Curry') 有名入栈：一个单键 Map 压在栈顶</text>
  <text x="694" y="110" font-size="12" fill="#2f6fd0" text-anchor="end">栈顶</text>

  <rect x="150" y="148" width="560" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="166" y="170" font-size="13" fill="#1f2b38">[1] String anonymous</text>
  <text x="166" y="188" font-size="11" fill="#5b6b7c">push('anonymous') 匿名入栈：栈顶直接就是那个对象</text>

  <rect x="150" y="208" width="560" height="50" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="166" y="230" font-size="13" fill="#1f2b38">[2] Action（username = Kobe）</text>
  <text x="166" y="248" font-size="11" fill="#5b6b7c">当前 Action 被框架自动压入，带 getter 的属性页面直接可取</text>
  <text x="694" y="230" font-size="12" fill="#5b6b7c" text-anchor="end">栈底</text>

  <line x1="44" y1="288" x2="856" y2="288" stroke="#c8d3e0" stroke-width="1.4" stroke-dasharray="6 6"/>
  <text x="44" y="312" font-size="13" font-weight="700" fill="#7a5bd0">上下文 ActionContext（Map 结构：必须加 # 前缀）</text>
  <text x="856" y="312" font-size="12" fill="#7a5bd0" text-anchor="end">加 # 只查这里</text>

  <rect x="44" y="326" width="152" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="120" y="352" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">#request</text>
  <text x="120" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">Web 域 request</text>
  <text x="120" y="392" font-size="11" fill="#5b6b7c" text-anchor="middle">按名称取键</text>

  <rect x="209" y="326" width="152" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="285" y="352" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">#session</text>
  <text x="285" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">Web 域 session</text>
  <text x="285" y="392" font-size="11" fill="#5b6b7c" text-anchor="middle">按名称取键</text>

  <rect x="374" y="326" width="152" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="352" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">#application</text>
  <text x="450" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">Web 域 application</text>
  <text x="450" y="392" font-size="11" fill="#5b6b7c" text-anchor="middle">按名称取键</text>

  <rect x="539" y="326" width="152" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="615" y="352" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">#parameters</text>
  <text x="615" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">请求参数是数组</text>
  <text x="615" y="392" font-size="11" fill="#5b6b7c" text-anchor="middle">通常写 [0]</text>

  <rect x="704" y="326" width="152" height="76" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="780" y="352" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">#attr</text>
  <text x="780" y="374" font-size="11" fill="#5b6b7c" text-anchor="middle">page→request→</text>
  <text x="780" y="392" font-size="11" fill="#5b6b7c" text-anchor="middle">session→application</text>

  <rect x="44" y="416" width="812" height="60" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="62" y="440" font-size="12" fill="#1f2b38">不加 #：先搜对象栈（栈顶→栈底），命中即停，找不到再搜上下文栈；加了 #：只搜上下文栈。</text>
  <text x="62" y="462" font-size="12" fill="#1f2b38">同名属性会被栈顶对象遮蔽：Action 的 username 压住 ActionContext 里的同名键，取值取错先看栈序。</text>
</svg>
