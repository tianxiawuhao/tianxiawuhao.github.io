<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Struts2 拦截器调用链</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Struts2 拦截器调用链：环绕 Action 的 invoke() 顺序</text>

  <text x="521" y="126" font-size="13" fill="#2f6fd0" text-anchor="middle">拦截器栈：invoke() 之前 → invoke() 之后（返回时逆序）</text>
  <path d="M316 150 L316 136 L726 136 L726 150" fill="none" stroke="#2f6fd0" stroke-width="1.4"/>

  <rect x="32" y="170" width="126" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="95" y="200" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">浏览器请求</text>
  <text x="95" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">进入过滤器链</text>

  <rect x="174" y="170" width="126" height="70" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="237" y="200" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">Filter 过滤器</text>
  <text x="237" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">拦 JSP、静态资源</text>

  <rect x="316" y="170" width="126" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="379" y="200" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">params</text>
  <text x="379" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">把参数注入 Action</text>

  <rect x="458" y="170" width="126" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="521" y="200" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">自定义拦截器</text>
  <text x="521" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">登录检查 / 日志计时</text>

  <rect x="600" y="170" width="126" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="663" y="200" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">validation</text>
  <text x="663" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">→ workflow 定流程</text>

  <rect x="742" y="170" width="126" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="805" y="200" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">Action + Result</text>
  <text x="805" y="220" font-size="11" fill="#5b6b7c" text-anchor="middle">execute() 与渲染</text>

  <line x1="158" y1="205" x2="170" y2="205" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="300" y1="205" x2="312" y2="205" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="442" y1="205" x2="454" y2="205" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="584" y1="205" x2="596" y2="205" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="726" y1="205" x2="738" y2="205" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="32" y="276" width="836" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="50" y="300" font-size="12" fill="#1f2b38">过滤器基于 Servlet 规范，能拦 JSP、静态资源等所有请求；拦截器基于 ActionInvocation 调用链，只作用于 Action 与结果渲染。</text>
  <text x="50" y="322" font-size="12" fill="#1f2b38">拦截器可用 invocation.getInvocationContext() 拿到值栈与 ActionContext，直接操作值栈——过滤器做不到。</text>

  <rect x="32" y="340" width="836" height="56" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="50" y="364" font-size="12" fill="#1f2b38">顺序：先声明先执行、返回时逆序。自定义拦截器插在 params 之前，Action 属性尚未注入，读到的全是默认值。</text>
  <text x="50" y="386" font-size="12" fill="#1f2b38">在 action 里显式写了 interceptor-ref 会让包的 default-stack 失效，必须手动补回 defaultStack。</text>
</svg>
