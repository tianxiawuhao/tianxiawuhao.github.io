<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Maven 依赖 scope 在编译、测试、运行、打包四个阶段的可见性对照</title>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Maven 依赖 scope：哪些阶段可见、是否打进包</text>

  <rect x="60" y="72" width="780" height="38" fill="#2f6fd0"/>
  <text x="155" y="96" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">scope</text>
  <text x="322" y="96" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">编译期</text>
  <text x="467" y="96" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">测试期</text>
  <text x="615" y="96" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">运行期</text>
  <text x="765" y="96" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">打包进包</text>

  <rect x="60" y="110" width="780" height="54" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="155" y="144" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">compile（默认）</text>
  <text x="322" y="145" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="467" y="145" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="615" y="145" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="765" y="145" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>

  <rect x="60" y="164" width="780" height="54" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="155" y="198" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">provided</text>
  <text x="322" y="199" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="467" y="199" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="615" y="199" font-size="15" fill="#5b6b7c" text-anchor="middle">—</text>
  <text x="765" y="199" font-size="15" fill="#5b6b7c" text-anchor="middle">—</text>

  <rect x="60" y="218" width="780" height="54" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="155" y="252" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">runtime</text>
  <text x="322" y="253" font-size="15" fill="#5b6b7c" text-anchor="middle">—</text>
  <text x="467" y="253" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="615" y="253" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="765" y="253" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>

  <rect x="60" y="272" width="780" height="54" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="155" y="306" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">test</text>
  <text x="322" y="307" font-size="15" fill="#5b6b7c" text-anchor="middle">—</text>
  <text x="467" y="307" font-size="15" fill="#2e9e5b" text-anchor="middle">✓</text>
  <text x="615" y="307" font-size="15" fill="#5b6b7c" text-anchor="middle">—</text>
  <text x="765" y="307" font-size="15" fill="#5b6b7c" text-anchor="middle">—</text>

  <line x1="250" y1="110" x2="250" y2="326" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="395" y1="110" x2="395" y2="326" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="540" y1="110" x2="540" y2="326" stroke="#c8d3e0" stroke-width="1.2"/>
  <line x1="690" y1="110" x2="690" y2="326" stroke="#c8d3e0" stroke-width="1.2"/>

  <text x="450" y="350" font-size="11" fill="#5b6b7c" text-anchor="middle">✓ 参与该阶段　　— 不参与（provided 编译测试可见、运行由容器提供，不打进包；test 不污染主程序）</text>
  <text x="450" y="376" font-size="11" fill="#5b6b7c" text-anchor="middle">多模块项目用父 POM 的 dependencyManagement 统一版本号，子模块只写 groupId 与 artifactId</text>
</svg>
