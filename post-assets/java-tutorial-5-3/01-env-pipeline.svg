<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 环境配置主线：定死基线、配好仓库、守住提交</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">环境配置主线：定死基线 → 配好仓库 → 守住提交</text>

  <rect x="30" y="52" width="400" height="78" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="79" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">IDE 级 Settings（全局生效）</text>
  <text x="230" y="100" font-size="11.5" fill="#5b6b7c" text-anchor="middle">主题、快捷键、行号、插件</text>
  <text x="230" y="119" font-size="11.5" fill="#5b6b7c" text-anchor="middle">与个人习惯相关的改这里</text>

  <rect x="470" y="52" width="400" height="78" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="670" y="79" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">项目级 Project Structure（仅本项目）</text>
  <text x="670" y="100" font-size="11.5" fill="#5b6b7c" text-anchor="middle">SDK、Language level、编码</text>
  <text x="670" y="119" font-size="11.5" fill="#5b6b7c" text-anchor="middle">与项目相关的配置跟着项目走</text>

  <rect x="30" y="155" width="250" height="118" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="155" y="182" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">① 定死 JDK 基线</text>
  <text x="155" y="207" font-size="11" fill="#1f2b38" text-anchor="middle">java -version 与 javac -version</text>
  <text x="155" y="228" font-size="11" fill="#5b6b7c" text-anchor="middle">两者版本必须一致</text>
  <text x="155" y="252" font-size="10.5" fill="#e08a1e" text-anchor="middle">否则报 UnsupportedClassVersionError</text>

  <line x1="284" y1="214" x2="319" y2="214" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="325" y="155" width="250" height="118" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="182" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">② 配好 Maven 仓库</text>
  <text x="450" y="207" font-size="11" fill="#1f2b38" text-anchor="middle">settings.xml 配镜像加速下载</text>
  <text x="450" y="228" font-size="11" fill="#5b6b7c" text-anchor="middle">本地仓库路径与 IDE 对齐</text>
  <text x="450" y="252" font-size="10.5" fill="#e08a1e" text-anchor="middle">scope 决定是否打进包里</text>

  <line x1="579" y1="214" x2="614" y2="214" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="620" y="155" width="250" height="118" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="745" y="182" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">③ 守住 Git 闭环</text>
  <text x="745" y="207" font-size="11" fill="#1f2b38" text-anchor="middle">enable → commit → push</text>
  <text x="745" y="228" font-size="11" fill="#5b6b7c" text-anchor="middle">提交前先写好 .gitignore</text>
  <text x="745" y="252" font-size="10.5" fill="#e08a1e" text-anchor="middle">push 之前必须先 commit</text>

  <text x="30" y="298" font-size="12" fill="#5b6b7c">高频键位（先记这几个，覆盖日常 90% 动作）</text>

  <rect x="30" y="308" width="195" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="127" y="337" font-size="12" fill="#1f2b38" text-anchor="middle">Alt+Enter 万能修复</text>
  <rect x="245" y="308" width="195" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="342" y="337" font-size="12" fill="#1f2b38" text-anchor="middle">Alt+F7 查找所有引用</text>
  <rect x="460" y="308" width="195" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="557" y="337" font-size="12" fill="#1f2b38" text-anchor="middle">Ctrl+Shift+V 剪贴板历史</text>
  <rect x="675" y="308" width="195" height="48" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="772" y="337" font-size="12" fill="#1f2b38" text-anchor="middle">Ctrl+Alt+L 格式化代码</text>

  <text x="450" y="380" font-size="11" fill="#5b6b7c" text-anchor="middle">配置调好后导出 Settings 备份，换机器 Import 一步还原</text>
</svg>
