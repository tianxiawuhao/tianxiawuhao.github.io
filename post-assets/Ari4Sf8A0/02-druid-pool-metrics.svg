<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">Druid 连接池参数分层与监控指标</text>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <rect x="40" y="60" width="820" height="170" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="60" y="86" font-size="14" font-weight="700" fill="#1f2b38">连接池容量与生命周期参数（spring.datasource.druid.*）</text>
  <rect x="60" y="100" width="170" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="145" y="124" font-size="12" text-anchor="middle" fill="#1f2b38">initialSize / minIdle</text>
  <text x="145" y="145" font-size="11" text-anchor="middle" fill="#5b6b7c">建立连接与保底空闲</text>
  <line x1="230" y1="131" x2="266" y2="131" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="266" y="100" width="170" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="351" y="124" font-size="12" text-anchor="middle" fill="#1f2b38">maxActive</text>
  <text x="351" y="145" font-size="11" text-anchor="middle" fill="#5b6b7c">最大连接池数量</text>
  <line x1="436" y1="131" x2="472" y2="131" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="472" y="100" width="170" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="557" y="124" font-size="12" text-anchor="middle" fill="#1f2b38">maxWait</text>
  <text x="557" y="145" font-size="11" text-anchor="middle" fill="#5b6b7c">获取连接最大等待</text>
  <line x1="642" y1="131" x2="678" y2="131" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="678" y="100" width="162" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="759" y="124" font-size="12" text-anchor="middle" fill="#1f2b38">timeBetweenEviction</text>
  <text x="759" y="145" font-size="11" text-anchor="middle" fill="#5b6b7c">RunsMillis 检测间隔</text>
  <text x="60" y="188" font-size="12" fill="#1f2b38">minEvictableIdleTimeMillis：连接最小生存时间，空闲超过该值才允许被回收线程关闭</text>
  <text x="60" y="212" font-size="12" fill="#1f2b38">removeAbandoned / removeAbandonedTimeout：回收疑似泄漏连接，只作兜底，根因仍是代码未 close</text>

  <rect x="40" y="246" width="820" height="164" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="60" y="272" font-size="14" font-weight="700" fill="#1f2b38">连接有效性检测参数</text>
  <rect x="60" y="286" width="190" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="155" y="310" font-size="12" text-anchor="middle" fill="#1f2b38">validationQuery</text>
  <text x="155" y="331" font-size="11" text-anchor="middle" fill="#5b6b7c">MySQL：SELECT 1</text>
  <line x1="250" y1="319" x2="286" y2="319" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="286" y="286" width="190" height="66" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="381" y="310" font-size="12" text-anchor="middle" fill="#1f2b38">testWhileIdle: true</text>
  <text x="381" y="331" font-size="11" text-anchor="middle" fill="#5b6b7c">空闲检测，推荐开启</text>
  <line x1="476" y1="319" x2="512" y2="319" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="512" y="286" width="160" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="592" y="310" font-size="12" text-anchor="middle" fill="#1f2b38">testOnBorrow</text>
  <text x="592" y="331" font-size="11" text-anchor="middle" fill="#5b6b7c">false，避免每次开销</text>
  <line x1="672" y1="319" x2="708" y2="319" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="708" y="286" width="132" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="774" y="310" font-size="12" text-anchor="middle" fill="#1f2b38">testOnReturn</text>
  <text x="774" y="331" font-size="11" text-anchor="middle" fill="#5b6b7c">false，归还时不校验</text>
  <text x="60" y="378" font-size="12" fill="#1f2b38">testWhileIdle 与 timeBetweenEvictionRunsMillis、minEvictableIdleTimeMillis 配合，兼顾安全与性能</text>
  <text x="60" y="400" font-size="12" fill="#1f2b38">poolPreparedStatements：MySQL 一般保持 false，Oracle 可开启并设置 maxPoolPreparedStatementPerConnectionSize</text>

  <rect x="40" y="426" width="820" height="146" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="60" y="452" font-size="14" font-weight="700" fill="#1f2b38">监控台关键指标</text>
  <rect x="60" y="466" width="182" height="88" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="151" y="492" font-size="12" text-anchor="middle" fill="#1f2b38">连接池状态</text>
  <text x="151" y="513" font-size="11" text-anchor="middle" fill="#5b6b7c">PoolingCount 空闲连接</text>
  <text x="151" y="533" font-size="11" text-anchor="middle" fill="#5b6b7c">ActiveCount 活跃连接</text>
  <line x1="242" y1="510" x2="278" y2="510" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="278" y="466" width="182" height="88" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="369" y="492" font-size="12" text-anchor="middle" fill="#1f2b38">SQL 执行</text>
  <text x="369" y="513" font-size="11" text-anchor="middle" fill="#5b6b7c">ExecuteCount 执行次数</text>
  <text x="369" y="533" font-size="11" text-anchor="middle" fill="#5b6b7c">ErrorCount 错误次数</text>
  <line x1="460" y1="510" x2="496" y2="510" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="496" y="466" width="182" height="88" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="587" y="492" font-size="12" text-anchor="middle" fill="#1f2b38">性能耗时</text>
  <text x="587" y="513" font-size="11" text-anchor="middle" fill="#5b6b7c">慢 SQL：slowSqlMillis</text>
  <text x="587" y="533" font-size="11" text-anchor="middle" fill="#5b6b7c">执行时间分布</text>
  <line x1="678" y1="510" x2="714" y2="510" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar2)"/>
  <rect x="714" y="466" width="126" height="88" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="777" y="500" font-size="12" text-anchor="middle" fill="#1f2b38">容量取舍</text>
  <text x="777" y="521" font-size="11" text-anchor="middle" fill="#5b6b7c">活跃逼近 maxActive</text>
  <text x="777" y="541" font-size="11" text-anchor="middle" fill="#5b6b7c">说明连接池偏小</text>
</svg>
