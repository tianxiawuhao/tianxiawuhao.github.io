<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect width="900" height="570" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38">Spring Boot + MyBatis + Druid 整合结构与请求 / 监控链路</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <rect x="40" y="60" width="820" height="116" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="60" y="86" font-size="14" font-weight="700" fill="#1f2b38">1. 请求入口与 Druid 监控链</text>
  <rect x="60" y="98" width="110" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="115" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">HTTP 请求</text>
  <text x="115" y="141" font-size="11" text-anchor="middle" fill="#5b6b7c">浏览器 / 客户端</text>
  <line x1="170" y1="127" x2="205" y2="127" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="205" y="98" width="150" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="280" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">WebStatFilter</text>
  <text x="280" y="141" font-size="11" text-anchor="middle" fill="#5b6b7c">URI / Session 统计</text>
  <line x1="355" y1="127" x2="390" y2="127" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="390" y="98" width="150" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="465" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">StatFilter</text>
  <text x="465" y="141" font-size="11" text-anchor="middle" fill="#5b6b7c">SQL 合并 / 慢 SQL</text>
  <line x1="540" y1="127" x2="575" y2="127" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="575" y="98" width="150" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="650" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">DruidDataSource</text>
  <text x="650" y="141" font-size="11" text-anchor="middle" fill="#5b6b7c">连接池统一管理</text>
  <line x1="725" y1="127" x2="760" y2="127" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="760" y="98" width="80" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="800" y="122" font-size="12" text-anchor="middle" fill="#1f2b38">MySQL</text>
  <text x="800" y="141" font-size="11" text-anchor="middle" fill="#5b6b7c">业务库</text>
  <text x="60" y="168" font-size="11" fill="#5b6b7c">WebStatFilter 放行静态资源与 /druid/*；StatFilter 由 filters: stat 启用，负责 SQL 统计与慢 SQL 记录。</text>

  <rect x="40" y="192" width="820" height="188" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="60" y="218" font-size="14" font-weight="700" fill="#1f2b38">2. 应用内调用链</text>
  <rect x="60" y="230" width="128" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="124" y="253" font-size="12" text-anchor="middle" fill="#1f2b38">Controller</text>
  <text x="124" y="272" font-size="11" text-anchor="middle" fill="#5b6b7c">接收请求</text>
  <line x1="188" y1="257" x2="224" y2="257" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="224" y="230" width="128" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="288" y="253" font-size="12" text-anchor="middle" fill="#1f2b38">Service</text>
  <text x="288" y="272" font-size="11" text-anchor="middle" fill="#5b6b7c">@Transactional</text>
  <line x1="352" y1="257" x2="388" y2="257" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="388" y="230" width="128" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="452" y="253" font-size="12" text-anchor="middle" fill="#1f2b38">Mapper 接口</text>
  <text x="452" y="272" font-size="11" text-anchor="middle" fill="#5b6b7c">@MapperScan 代理</text>
  <line x1="516" y1="257" x2="552" y2="257" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="552" y="230" width="150" height="54" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
  <text x="627" y="253" font-size="12" text-anchor="middle" fill="#1f2b38">SqlSessionFactory</text>
  <text x="627" y="272" font-size="11" text-anchor="middle" fill="#5b6b7c">mapper-locations 解析</text>
  <line x1="702" y1="257" x2="738" y2="257" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="738" y="230" width="102" height="54" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
  <text x="789" y="253" font-size="12" text-anchor="middle" fill="#1f2b38">DataSource</text>
  <text x="789" y="272" font-size="11" text-anchor="middle" fill="#5b6b7c">getConnection()</text>
  <line x1="124" y1="284" x2="124" y2="316" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="60" y="316" width="640" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="80" y="338" font-size="12" fill="#1f2b38">单数据源：Spring Boot 自动配置直接注入 DataSource</text>
  <text x="80" y="357" font-size="12" fill="#1f2b38">多数据源 / 主从：@Primary + AbstractRoutingDataSource.determineCurrentLookupKey() 路由</text>

  <rect x="40" y="394" width="820" height="156" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="60" y="420" font-size="14" font-weight="700" fill="#1f2b38">3. 监控台数据汇总</text>
  <rect x="60" y="434" width="200" height="96" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="160" y="460" font-size="12" text-anchor="middle" fill="#1f2b38">DruidDataSource 统计</text>
  <text x="160" y="481" font-size="11" text-anchor="middle" fill="#5b6b7c">连接数 / 活跃数 / 等待</text>
  <text x="160" y="501" font-size="11" text-anchor="middle" fill="#5b6b7c">执行数 / 错误数 / 耗时</text>
  <line x1="260" y1="482" x2="296" y2="482" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="296" y="434" width="200" height="96" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="396" y="460" font-size="12" text-anchor="middle" fill="#1f2b38">StatFilter 采集</text>
  <text x="396" y="481" font-size="11" text-anchor="middle" fill="#5b6b7c">mergeSql 合并同构 SQL</text>
  <text x="396" y="501" font-size="11" text-anchor="middle" fill="#5b6b7c">slowSqlMillis 慢 SQL 阈值</text>
  <line x1="496" y1="482" x2="532" y2="482" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="532" y="434" width="180" height="96" rx="8" fill="#f7f9fc" stroke="#7a5bd0"/>
  <text x="622" y="460" font-size="12" text-anchor="middle" fill="#1f2b38">StatViewServlet</text>
  <text x="622" y="481" font-size="11" text-anchor="middle" fill="#5b6b7c">/druid/* 登录鉴权</text>
  <text x="622" y="501" font-size="11" text-anchor="middle" fill="#5b6b7c">JSON API 输出</text>
  <line x1="712" y1="482" x2="748" y2="482" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="748" y="434" width="92" height="96" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
  <text x="794" y="476" font-size="12" text-anchor="middle" fill="#1f2b38">监控台</text>
  <text x="794" y="495" font-size="11" text-anchor="middle" fill="#5b6b7c">页面 / API</text>
</svg>
