<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>网关过滤器的分类与执行位置</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">网关过滤器的分类与执行位置</text>

  <rect x="350" y="52" width="200" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="82" font-size="13.5" fill="#1f2b38" text-anchor="middle">网关过滤器</text>
  <path d="M450 100 V 120 H 240 V 146" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M450 100 V 120 H 660 V 146" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="60" y="150" width="360" height="188" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="240" y="174" font-size="12.5" fill="#5b6b7c" text-anchor="middle">按生命周期划分</text>
  <rect x="80" y="190" width="320" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="240" y="214" font-size="13" fill="#1f2b38" text-anchor="middle">Pre 前置过滤器</text>
  <text x="240" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">路由前调用：认证、鉴权、记录时间</text>
  <rect x="80" y="268" width="320" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="240" y="292" font-size="13" fill="#1f2b38" text-anchor="middle">Post 后置过滤器</text>
  <text x="240" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">路由到微服务后：改响应头、包装结果</text>

  <rect x="480" y="150" width="360" height="188" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="660" y="174" font-size="12.5" fill="#5b6b7c" text-anchor="middle">按作用范围划分</text>
  <rect x="500" y="190" width="320" height="60" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="660" y="214" font-size="13" fill="#1f2b38" text-anchor="middle">GatewayFilter 局部过滤器</text>
  <text x="660" y="234" font-size="11" fill="#5b6b7c" text-anchor="middle">只作用于某个路由或路由分组</text>
  <rect x="500" y="268" width="320" height="60" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="660" y="292" font-size="13" fill="#1f2b38" text-anchor="middle">GlobalFilter 全局过滤器</text>
  <text x="660" y="312" font-size="11" fill="#5b6b7c" text-anchor="middle">作用于全部路由</text>

  <line x1="240" y1="338" x2="240" y2="366" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="660" y1="338" x2="660" y2="366" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="60" y="370" width="780" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="400" font-size="12.5" fill="#1f2b38" text-anchor="middle">执行顺序：Pre（Order 升序）→ 目标微服务 → Post（then 回调，逆序）</text>
</svg>
