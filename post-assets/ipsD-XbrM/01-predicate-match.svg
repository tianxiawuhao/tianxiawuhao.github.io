<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>网关断言的匹配过程</title>
  <rect width="900" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">网关断言的匹配过程</text>

  <rect x="230" y="52" width="440" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="82" font-size="13.5" fill="#1f2b38" text-anchor="middle">客户端请求：Path、RemoteAddr、Method、Cookie…</text>
  <line x1="450" y1="100" x2="450" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="110" y="132" width="680" height="122" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="156" font-size="12.5" fill="#5b6b7c" text-anchor="middle">断言组：多条断言为 AND 关系，全部为 true 才算匹配</text>
  <rect x="140" y="172" width="190" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="235" y="206" font-size="11.5" fill="#1f2b38" text-anchor="middle">Path=/server-user/**</text>
  <rect x="355" y="172" width="190" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="206" font-size="11.5" fill="#1f2b38" text-anchor="middle">RemoteAddr=192.168.0.1/24</text>
  <rect x="570" y="172" width="190" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="665" y="206" font-size="11.5" fill="#1f2b38" text-anchor="middle">Method=GET</text>

  <line x1="450" y1="254" x2="450" y2="282" stroke="#5b6b7c" stroke-width="1.4"/>
  <path d="M450 282 H 245 V 294" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M450 282 H 655 V 294" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="95" y="298" width="300" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="245" y="322" font-size="12.5" fill="#1f2b38" text-anchor="middle">任一断言为 false</text>
  <text x="245" y="342" font-size="11.5" fill="#5b6b7c" text-anchor="middle">请求匹配不到路由，返回 404</text>

  <rect x="505" y="298" width="300" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="655" y="322" font-size="12.5" fill="#1f2b38" text-anchor="middle">全部断言为 true</text>
  <text x="655" y="342" font-size="11.5" fill="#5b6b7c" text-anchor="middle">命中路由，进入过滤器链</text>

  <path d="M655 356 V 390 H 612" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="310" y="372" width="300" height="48" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="460" y="402" font-size="12" fill="#1f2b38" text-anchor="middle">转发到 uri: http://localhost:8060</text>
</svg>
