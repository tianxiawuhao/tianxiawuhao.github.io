<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 线程同步五种手段对比：保证什么、边界在哪里</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Java 线程同步五种手段对比</text>

  <rect x="40" y="55" width="210" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="78" font-size="13" font-weight="700" fill="#1f2b38">同步手段</text>
  <rect x="262" y="55" width="282" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="278" y="78" font-size="13" font-weight="700" fill="#1f2b38">提供了什么保证</text>
  <rect x="556" y="55" width="304" height="36" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="572" y="78" font-size="13" font-weight="700" fill="#1f2b38">适用场景与边界</text>

  <rect x="40" y="103" width="210" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="129" font-size="12" font-weight="700" fill="#1f2b38">synchronized 方法</text>
  <text x="56" y="148" font-size="11" fill="#5b6b7c">内置锁，锁住整个方法</text>
  <rect x="262" y="103" width="282" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="278" y="129" font-size="11" fill="#1f2b38">互斥 + 可见性，可重入</text>
  <text x="278" y="148" font-size="11" fill="#5b6b7c">实例方法锁 this，静态方法锁 Class</text>
  <rect x="556" y="103" width="304" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="572" y="129" font-size="11" fill="#1f2b38">写法最简单，不用手动释放</text>
  <text x="572" y="148" font-size="11" fill="#5b6b7c">粒度大；静态方法会锁住整个类</text>

  <rect x="40" y="177" width="210" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="203" font-size="12" font-weight="700" fill="#1f2b38">synchronized 代码块</text>
  <text x="56" y="222" font-size="11" fill="#5b6b7c">锁对象可以自己指定</text>
  <rect x="262" y="177" width="282" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="278" y="203" font-size="11" fill="#1f2b38">互斥 + 可见性，可重入</text>
  <text x="278" y="222" font-size="11" fill="#5b6b7c">粒度比同步方法更小</text>
  <rect x="556" y="177" width="304" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="572" y="203" font-size="11" fill="#1f2b38">只包住真正的临界区</text>
  <text x="572" y="222" font-size="11" fill="#5b6b7c">锁对象必须全线程一致，否则形同虚设</text>

  <rect x="40" y="251" width="210" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="277" font-size="12" font-weight="700" fill="#1f2b38">volatile 变量</text>
  <text x="56" y="296" font-size="11" fill="#5b6b7c">非锁机制，最轻量</text>
  <rect x="262" y="251" width="282" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="278" y="277" font-size="11" fill="#1f2b38">只保证可见性 + 禁止重排序</text>
  <text x="278" y="296" font-size="11" fill="#5b6b7c">不加锁，不保证原子性</text>
  <rect x="556" y="251" width="304" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="572" y="277" font-size="11" fill="#1f2b38">适合状态标志位（如 running）</text>
  <text x="572" y="296" font-size="11" fill="#5b6b7c">count++ 这类复合操作仍然不安全</text>

  <rect x="40" y="325" width="210" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="351" font-size="12" font-weight="700" fill="#1f2b38">ReentrantLock</text>
  <text x="56" y="370" font-size="11" fill="#5b6b7c">显式 lock / unlock</text>
  <rect x="262" y="325" width="282" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="278" y="351" font-size="11" fill="#1f2b38">互斥 + 可重入，功能更强</text>
  <text x="278" y="370" font-size="11" fill="#5b6b7c">公平锁、超时、Condition 条件队列</text>
  <rect x="556" y="325" width="304" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="572" y="351" font-size="11" fill="#1f2b38">需要高级能力时才用</text>
  <text x="572" y="370" font-size="11" fill="#5b6b7c">unlock 必须放在 finally，否则会死锁</text>

  <rect x="40" y="399" width="210" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="56" y="425" font-size="12" font-weight="700" fill="#1f2b38">ThreadLocal</text>
  <text x="56" y="444" font-size="11" fill="#5b6b7c">线程局部变量</text>
  <rect x="262" y="399" width="282" height="62" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="278" y="425" font-size="11" fill="#1f2b38">每个线程一份独立副本</text>
  <text x="278" y="444" font-size="11" fill="#5b6b7c">用空间换隔离，线程之间不共享</text>
  <rect x="556" y="399" width="304" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="572" y="425" font-size="11" fill="#1f2b38">适合上下文透传、连接绑定</text>
  <text x="572" y="444" font-size="11" fill="#5b6b7c">线程池复用线程，用完必须 remove</text>

  <text x="450" y="484" text-anchor="middle" font-size="12" fill="#e08a1e">volatile 与 ThreadLocal 都不提供互斥；需要原子性时用 synchronized、ReentrantLock 或 Atomic 类</text>
</svg>
