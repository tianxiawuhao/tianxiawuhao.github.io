<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>表格形式 Sarsa 的一次更新流程</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">表格形式 Sarsa 的一次更新</text>

  <rect x="20" y="80" width="195" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="117" y="112" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">① 观测 transition</text>
  <text x="117" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">(s, a, r, s′)</text>
  <text x="117" y="166" font-size="11" fill="#5b6b7c" text-anchor="middle">由环境交互得到</text>

  <rect x="241" y="80" width="195" height="120" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="338" y="112" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">② 策略 π 采样</text>
  <text x="338" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">下一动作 a′ ~ π(·|s′)</text>
  <text x="338" y="166" font-size="11" fill="#5b6b7c" text-anchor="middle">行为策略即目标策略</text>

  <rect x="462" y="80" width="195" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="559" y="112" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">③ 计算 TD target</text>
  <text x="559" y="140" font-size="11" fill="#5b6b7c" text-anchor="middle">y = r + γ · Q(s′, a′)</text>
  <text x="559" y="166" font-size="11" fill="#5b6b7c" text-anchor="middle">Q(s′, a′) 由查表得到</text>

  <rect x="683" y="80" width="195" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="780" y="107" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">④ TD error 与更新</text>
  <text x="780" y="133" font-size="11" fill="#5b6b7c" text-anchor="middle">δ = Q(s, a) − y</text>
  <text x="780" y="159" font-size="11" fill="#5b6b7c" text-anchor="middle">Q(s, a) ← Q(s, a) − α · δ</text>
  <text x="780" y="183" font-size="11" fill="#5b6b7c" text-anchor="middle">α 为学习率</text>

  <line x1="215" y1="140" x2="239" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="436" y1="140" x2="460" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="657" y1="140" x2="681" y2="140" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <path d="M 780 200 V 232 H 117 V 202" fill="none" stroke="#5b6b7c" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="450" y="258" font-size="11" fill="#5b6b7c" text-anchor="middle">进入下一轮迭代：s ← s′，继续更新新的状态-动作对</text>
</svg>
