<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Sarsa 的两种形式：表格形式与神经网络形式</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Sarsa 的两种形式：表格形式与神经网络形式</text>
  <rect x="30" y="58" width="380" height="272" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="220" y="88" font-size="15" font-weight="700" fill="#2f6fd0" text-anchor="middle">表格形式（Tabular Sarsa）</text>
  <line x1="60" y1="100" x2="380" y2="100" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="60" y="130" font-size="12" fill="#1f2b38">存储：一张 Q 表，行是状态 s，列是动作 a</text>
  <text x="60" y="158" font-size="12" fill="#1f2b38">前提：状态与动作有限、数量不大</text>
  <text x="60" y="186" font-size="12" fill="#1f2b38">目标：直接学出每个 Q(s, a) 的数值</text>
  <text x="60" y="214" font-size="12" fill="#1f2b38">更新：Q(s,a) ← Q(s,a) + α·δ</text>
  <text x="60" y="242" font-size="12" fill="#2e9e5b">优点：精确、不用训练、便于调试</text>
  <text x="60" y="270" font-size="12" fill="#5b6b7c">缺点：状态或动作一多，表就存不下</text>
  <rect x="490" y="58" width="380" height="272" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="680" y="88" font-size="15" font-weight="700" fill="#7a5bd0" text-anchor="middle">神经网络形式（Function Approx.）</text>
  <line x1="520" y1="100" x2="840" y2="100" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="520" y="130" font-size="12" fill="#1f2b38">存储：价值网络 q(s,a;w) 的参数 w</text>
  <text x="520" y="158" font-size="12" fill="#1f2b38">前提：状态可以连续、高维</text>
  <text x="520" y="186" font-size="12" fill="#1f2b38">目标：用 q(s,a;w) 近似 Q(s,a)</text>
  <text x="520" y="214" font-size="12" fill="#1f2b38">更新：梯度下降，L = ½·δ²</text>
  <text x="520" y="242" font-size="12" fill="#2e9e5b">优点：能泛化到没见过的状态</text>
  <text x="520" y="270" font-size="12" fill="#5b6b7c">缺点：要训练，近似存在误差</text>
  <line x1="418" y1="194" x2="482" y2="194" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="182" font-size="11" fill="#5b6b7c" text-anchor="middle">泛化需求</text>
  <text x="450" y="368" font-size="12" fill="#5b6b7c" text-anchor="middle">两种形式用的都是 TD 算法：区别只在于被更新的是表格里的一个数，还是价值网络的参数 w。</text>
</svg>
