<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>神经网络形式 Sarsa 的一轮迭代回路</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">神经网络形式 Sarsa 的一轮迭代</text>

  <rect x="60" y="80" width="230" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="175" y="112" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">① 观测 transition</text>
  <text x="175" y="138" font-size="11" fill="#5b6b7c" text-anchor="middle">(s, a, r, s′)</text>

  <rect x="335" y="80" width="230" height="80" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="450" y="112" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">② 策略 π 采样下一动作</text>
  <text x="450" y="138" font-size="11" fill="#5b6b7c" text-anchor="middle">a′ ~ π(·|s′)</text>

  <rect x="610" y="80" width="230" height="80" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="725" y="112" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">③ 计算 TD target</text>
  <text x="725" y="138" font-size="11" fill="#5b6b7c" text-anchor="middle">y = r + γ · q(s′, a′; w)</text>

  <rect x="610" y="250" width="230" height="80" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="725" y="282" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">④ Loss 与梯度下降</text>
  <text x="725" y="308" font-size="11" fill="#5b6b7c" text-anchor="middle">L = ½ · δ²，δ = q(s, a; w) − y</text>

  <rect x="60" y="250" width="230" height="80" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="175" y="282" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">⑤ 更新价值网络参数</text>
  <text x="175" y="308" font-size="11" fill="#5b6b7c" text-anchor="middle">w ← w − α · ∂L/∂w</text>

  <line x1="290" y1="120" x2="333" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="565" y1="120" x2="608" y2="120" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="725" y1="160" x2="725" y2="248" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="610" y1="290" x2="292" y2="290" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 175 250 V 162" fill="none" stroke="#5b6b7c" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <text x="450" y="372" font-size="11" fill="#5b6b7c" text-anchor="middle">w 更新后用于下一轮预测，如此循环，直到 Loss 收敛</text>
</svg>
