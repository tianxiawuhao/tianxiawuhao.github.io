<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>表格版 Sarsa 一次更新的流程</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">表格版 Sarsa 一次更新的流程</text>
  <rect x="40" y="70" width="180" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="130" y="97" font-size="13" fill="#1f2b38" text-anchor="middle">① 当前状态 s、动作 a</text>
  <text x="130" y="117" font-size="11" fill="#5b6b7c" text-anchor="middle">由策略采样得到</text>
  <rect x="253" y="70" width="180" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="343" y="97" font-size="13" fill="#1f2b38" text-anchor="middle">② 执行 a，观测奖励 r</text>
  <text x="343" y="117" font-size="11" fill="#5b6b7c" text-anchor="middle">与下一状态 s′</text>
  <rect x="466" y="70" width="180" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="556" y="97" font-size="13" fill="#1f2b38" text-anchor="middle">③ 用同一策略再采样</text>
  <text x="556" y="117" font-size="11" fill="#5b6b7c" text-anchor="middle">得到下一动作 a′</text>
  <rect x="679" y="70" width="180" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="769" y="97" font-size="13" fill="#1f2b38" text-anchor="middle">④ 查表读取</text>
  <text x="769" y="117" font-size="11" fill="#5b6b7c" text-anchor="middle">Q(s′, a′)</text>
  <line x1="222" y1="102" x2="247" y2="102" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="435" y1="102" x2="460" y2="102" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="648" y1="102" x2="673" y2="102" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 769 134 V 167 H 170 V 194" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="50" y="200" width="240" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="170" y="227" font-size="13" fill="#1f2b38" text-anchor="middle">⑤ 计算 TD target y</text>
  <text x="170" y="247" font-size="11" fill="#5b6b7c" text-anchor="middle">y = r + γ·Q(s′, a′)</text>
  <rect x="330" y="200" width="240" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="227" font-size="13" fill="#1f2b38" text-anchor="middle">⑥ 计算 TD error δ</text>
  <text x="450" y="247" font-size="11" fill="#5b6b7c" text-anchor="middle">δ = y − Q(s, a)</text>
  <rect x="610" y="200" width="240" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="730" y="227" font-size="13" fill="#1f2b38" text-anchor="middle">⑦ 更新 Q 表</text>
  <text x="730" y="247" font-size="11" fill="#5b6b7c" text-anchor="middle">Q(s,a) ← Q(s,a) + α·δ</text>
  <line x1="290" y1="232" x2="324" y2="232" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="232" x2="604" y2="232" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="450" y="292" font-size="12" fill="#5b6b7c" text-anchor="middle">Sarsa 属于 on-policy：TD target 里的 a′ 由当前策略采样得到，五元组 (s, a, r, s′, a′) 正是它名字的由来。</text>
</svg>
