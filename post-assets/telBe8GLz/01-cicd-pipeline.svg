<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Jenkins 集成编译发布流程</title>
  <rect width="900" height="240" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Jenkins 集成编译发布流程</text>

  <rect x="50" y="90" width="140" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#2f6fd0">开发提交代码</text>
  <text x="120" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">push 到 GitLab</text>

  <rect x="215" y="90" width="140" height="64" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="285" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#2f6fd0">GitLab Webhook</text>
  <text x="285" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">通知 Jenkins 构建</text>

  <rect x="380" y="90" width="140" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#2e9e5b">Maven 编译打包</text>
  <text x="450" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">mvn clean install</text>

  <rect x="545" y="90" width="140" height="64" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="615" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#2e9e5b">构建 Docker 镜像</text>
  <text x="615" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">docker build -t</text>

  <rect x="710" y="90" width="140" height="64" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="780" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#e08a1e">推送 Harbor</text>
  <text x="780" y="138" text-anchor="middle" font-size="11" fill="#5b6b7c">docker push</text>

  <line x1="190" y1="122" x2="211" y2="122" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="355" y1="122" x2="376" y2="122" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="520" y1="122" x2="541" y2="122" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="685" y1="122" x2="706" y2="122" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="192" text-anchor="middle" font-size="12" fill="#5b6b7c">提交代码即由 Webhook 自动触发：Jenkins 拉取源码 → Maven 打包 → 构建镜像 → 推送镜像仓库。</text>
</svg>
