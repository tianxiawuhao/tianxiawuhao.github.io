<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Jenkins 容器化部署的目录与端口映射</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Jenkins 容器化部署的目录与端口映射</text>

  <rect x="30" y="55" width="380" height="30" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="220" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#2f6fd0">宿主机（CentOS 7）</text>
  <rect x="490" y="55" width="380" height="30" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="680" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#e08a1e">jenkins 容器</text>

  <rect x="30" y="100" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="118" font-size="12" fill="#1f2b38">/home/jenkins/jenkins_home/</text>
  <text x="44" y="134" font-size="11" fill="#5b6b7c">JENKINS_HOME：插件、任务、凭据</text>
  <rect x="490" y="100" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="504" y="118" font-size="12" fill="#1f2b38">/var/jenkins_home/</text>
  <text x="504" y="134" font-size="11" fill="#5b6b7c">Jenkins 全部数据持久化于此</text>
  <line x1="412" y1="121" x2="486" y2="121" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="155" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="173" font-size="12" fill="#1f2b38">/home/jdk17/jdk-17.0.10</text>
  <text x="44" y="189" font-size="11" fill="#5b6b7c">宿主机已安装的 JDK 17</text>
  <rect x="490" y="155" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="504" y="173" font-size="12" fill="#1f2b38">/home/jdk17/jdk-17.0.10</text>
  <text x="504" y="189" font-size="11" fill="#5b6b7c">保持同路径，供 Maven 编译使用</text>
  <line x1="412" y1="176" x2="486" y2="176" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="210" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="228" font-size="12" fill="#1f2b38">/home/maven/apache-maven-3.8.8</text>
  <text x="44" y="244" font-size="11" fill="#5b6b7c">宿主机已安装的 Maven</text>
  <rect x="490" y="210" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="504" y="228" font-size="12" fill="#1f2b38">/home/maven/apache-maven-3.8.8</text>
  <text x="504" y="244" font-size="11" fill="#5b6b7c">保持同路径，容器内可直接执行 mvn</text>
  <line x1="412" y1="231" x2="486" y2="231" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="265" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="283" font-size="12" fill="#1f2b38">/var/run/docker.sock</text>
  <text x="44" y="299" font-size="11" fill="#5b6b7c">Docker 守护进程套接字</text>
  <rect x="490" y="265" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="504" y="283" font-size="12" fill="#1f2b38">/var/run/docker.sock</text>
  <text x="504" y="299" font-size="11" fill="#5b6b7c">容器内可执行 docker build / push</text>
  <line x1="412" y1="286" x2="486" y2="286" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="320" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="338" font-size="12" fill="#1f2b38">/root/.ssh</text>
  <text x="44" y="354" font-size="11" fill="#5b6b7c">SSH 私钥</text>
  <rect x="490" y="320" width="380" height="42" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="504" y="338" font-size="12" fill="#1f2b38">/root/.ssh</text>
  <text x="504" y="354" font-size="11" fill="#5b6b7c">拉取私有 Git 仓库时使用</text>
  <line x1="412" y1="341" x2="486" y2="341" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="450" y="382" text-anchor="middle" font-size="12" fill="#5b6b7c">端口映射：8080:8080（Web UI）、50000:50000（Agent 通信）；容器以 root 运行。</text>
</svg>
