<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>ThingsBoard 源码编译流程</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">ThingsBoard 源码编译流程（Windows + IDEA）</text>

  <rect x="25" y="70" width="190" height="120" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="120" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">1 准备环境</text>
  <text x="120" y="138" text-anchor="middle" font-size="11.5" fill="#1f2b38">JDK、Maven 3.6+</text>
  <text x="120" y="164" text-anchor="middle" font-size="11.5" fill="#5b6b7c">Node.js、Git、IDEA</text>

  <line x1="217" y1="130" x2="241" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="245" y="70" width="190" height="120" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="340" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">2 克隆源码</text>
  <text x="340" y="138" text-anchor="middle" font-size="11.5" fill="#1f2b38">git clone thingsboard</text>
  <text x="340" y="164" text-anchor="middle" font-size="11.5" fill="#5b6b7c">git checkout 目标分支</text>

  <line x1="437" y1="130" x2="461" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="465" y="70" width="190" height="120" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="560" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">3 配置镜像</text>
  <text x="560" y="138" text-anchor="middle" font-size="11.5" fill="#1f2b38">Maven → 阿里云仓库</text>
  <text x="560" y="164" text-anchor="middle" font-size="11.5" fill="#5b6b7c">npm → npmmirror</text>

  <line x1="657" y1="130" x2="681" y2="130" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="685" y="70" width="190" height="120" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="780" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5bd0">4 根目录编译</text>
  <text x="780" y="138" text-anchor="middle" font-size="11.5" fill="#1f2b38">mvn clean install</text>
  <text x="780" y="164" text-anchor="middle" font-size="11.5" fill="#5b6b7c">IDEA 以管理员启动</text>

  <line x1="780" y1="190" x2="780" y2="212" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="780" y1="212" x2="450" y2="212" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="450" y1="212" x2="450" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="180" y="230" width="540" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2b38">编译失败：kill 掉残留 java 进程 → mvn clean → 重新编译</text>
  <text x="450" y="276" text-anchor="middle" font-size="11.5" fill="#5b6b7c">常见原因：网络与镜像、Node/npm 版本、残留进程、License 检查</text>
</svg>
