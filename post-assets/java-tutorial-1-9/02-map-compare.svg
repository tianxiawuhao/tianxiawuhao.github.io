<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>HashMap、TreeMap、Hashtable 三者对比</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Map 三兄弟对比：HashMap / TreeMap / Hashtable</text>
  <rect x="30" y="52" width="180" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b7c">对比项</text>
  <rect x="210" y="52" width="220" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="320" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd0">HashMap</text>
  <rect x="430" y="52" width="220" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="540" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#2e9e5b">TreeMap</text>
  <rect x="650" y="52" width="220" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="760" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#e08a1e">Hashtable（遗留）</text>
  <rect x="30" y="102" width="180" height="220" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.2"/>
  <text x="120" y="136" text-anchor="middle" font-size="11.5" fill="#1f2b38">底层结构</text>
  <text x="122" y="180" text-anchor="middle" font-size="11.5" fill="#1f2b38">单次操作复杂度</text>
  <text x="122" y="224" text-anchor="middle" font-size="11.5" fill="#1f2b38">键值顺序</text>
  <text x="122" y="268" text-anchor="middle" font-size="11.5" fill="#1f2b38">线程安全</text>
  <text x="122" y="312" text-anchor="middle" font-size="11.5" fill="#1f2b38">null 键 / null 值</text>
  <rect x="210" y="102" width="220" height="220" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <rect x="430" y="102" width="220" height="220" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.2"/>
  <rect x="650" y="102" width="220" height="220" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.2"/>
  <line x1="30" y1="146" x2="870" y2="146" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="30" y1="190" x2="870" y2="190" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="30" y1="234" x2="870" y2="234" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="30" y1="278" x2="870" y2="278" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="210" y1="102" x2="210" y2="322" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="430" y1="102" x2="430" y2="322" stroke="#c8d3e0" stroke-width="1"/>
  <line x1="650" y1="102" x2="650" y2="322" stroke="#c8d3e0" stroke-width="1"/>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#1f2b38">数组 + 链表</text>
  <text x="320" y="145" text-anchor="middle" font-size="11" fill="#1f2b38">链表过长转红黑树</text>
  <text x="540" y="138" text-anchor="middle" font-size="11" fill="#1f2b38">红黑树</text>
  <text x="760" y="138" text-anchor="middle" font-size="11" fill="#1f2b38">数组 + 链表</text>
  <text x="320" y="176" text-anchor="middle" font-size="11" fill="#1f2b38">平均 O(1)</text>
  <text x="540" y="176" text-anchor="middle" font-size="11" fill="#1f2b38">O(log n)</text>
  <text x="760" y="176" text-anchor="middle" font-size="11" fill="#1f2b38">平均 O(1)</text>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#1f2b38">不保证顺序</text>
  <text x="540" y="220" text-anchor="middle" font-size="11" fill="#1f2b38">按键自动排序</text>
  <text x="762" y="220" text-anchor="middle" font-size="11" fill="#1f2b38">不保证顺序</text>
  <text x="320" y="264" text-anchor="middle" font-size="11" fill="#1f2b38">否</text>
  <text x="540" y="264" text-anchor="middle" font-size="11" fill="#1f2b38">否</text>
  <text x="762" y="264" text-anchor="middle" font-size="11" fill="#1f2b38">是（方法全 synchronized）</text>
  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#2e9e5b">允许 1 个 null 键</text>
  <text x="320" y="318" text-anchor="middle" font-size="11" fill="#2e9e5b">允许多个 null 值</text>
  <text x="540" y="308" text-anchor="middle" font-size="11" fill="#2e9e5b">允许 null 键</text>
  <text x="540" y="318" text-anchor="middle" font-size="11" fill="#2e9e5b">允许多个 null 值</text>
  <text x="762" y="308" text-anchor="middle" font-size="11" fill="#e08a1e">都不允许，put 即抛</text>
  <text x="762" y="318" text-anchor="middle" font-size="11" fill="#e08a1e">NullPointerException</text>
  <rect x="30" y="336" width="840" height="62" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">怎么选？</text>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#1f2b38">按 key 快速查找、不在乎顺序 → HashMap　｜　需要按 key 排序或区间查询 → TreeMap</text>
  <text x="450" y="394" text-anchor="middle" font-size="11" fill="#1f2b38">要线程安全 → ConcurrentHashMap，而不是 Hashtable</text>
  <rect x="30" y="410" width="840" height="62" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#2e9e5b">TreeMap / TreeSet 的使用前提</text>
  <text x="450" y="452" text-anchor="middle" font-size="11" fill="#1f2b38">元素必须可比较：实现 Comparable（自然排序），或构造时传入 Comparator（定制排序，优先级更高）</text>
  <text x="450" y="468" text-anchor="middle" font-size="11" fill="#1f2b38">否则运行时抛 ClassCastException</text>
</svg>
