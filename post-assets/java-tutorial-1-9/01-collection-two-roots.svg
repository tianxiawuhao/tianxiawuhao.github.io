<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Java 集合框架的两条主线：Collection 与 Map</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">集合框架的两条主线：Collection 与 Map</text>
  <line x1="450" y1="50" x2="450" y2="66" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="330" y="68" width="240" height="44" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2b38">java.util 集合框架</text>
  <path d="M 450 112 L 450 128 L 230 128 L 230 148" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 450 112 L 450 128 L 670 128 L 670 148" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="80" y="150" width="300" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="230" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Collection</text>
  <text x="230" y="189" text-anchor="middle" font-size="11" fill="#5b6b7c">一组单个元素</text>
  <rect x="520" y="150" width="300" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="670" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Map</text>
  <text x="670" y="189" text-anchor="middle" font-size="11" fill="#5b6b7c">键到值的映射（键值对为一个单位）</text>
  <path d="M 130 200 L 130 218 L 130 226" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 230 200 L 230 218 L 230 226" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 330 200 L 330 218 L 330 226" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 670 200 L 670 226" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="42" y="228" width="176" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="130" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">List</text>
  <text x="130" y="265" text-anchor="middle" font-size="11" fill="#5b6b7c">有下标 · 有序 · 可重复</text>
  <rect x="142" y="228" width="176" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="230" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">Set</text>
  <text x="230" y="265" text-anchor="middle" font-size="11" fill="#5b6b7c">无下标 · 不重复</text>
  <rect x="242" y="228" width="176" height="46" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="330" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">Queue</text>
  <text x="330" y="265" text-anchor="middle" font-size="11" fill="#5b6b7c">按排队规则取元素</text>
  <path d="M 130 274 L 130 308" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 230 274 L 230 308" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M 330 274 L 330 308" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="40" y="310" width="180" height="42" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="130" y="330" text-anchor="middle" font-size="12" fill="#1f2b38">ArrayList 数组</text>
  <text x="130" y="345" text-anchor="middle" font-size="11" fill="#5b6b7c">查快，中间增删慢</text>
  <rect x="230" y="310" width="180" height="42" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#1f2b38">LinkedList 双向链表</text>
  <text x="320" y="345" text-anchor="middle" font-size="11" fill="#5b6b7c">头尾增删快</text>
  <rect x="40" y="360" width="180" height="42" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="130" y="380" text-anchor="middle" font-size="12" fill="#1f2b38">HashSet 哈希去重</text>
  <text x="130" y="395" text-anchor="middle" font-size="11" fill="#5b6b7c">无序</text>
  <rect x="230" y="360" width="180" height="42" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.2"/>
  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#1f2b38">TreeSet 红黑树</text>
  <text x="320" y="395" text-anchor="middle" font-size="11" fill="#5b6b7c">自动排序</text>
  <path d="M 230 274 L 130 300 L 130 308" fill="none" stroke="#c8d3e0" stroke-width="0"/>
  <path d="M 140 274 L 140 300 L 320 300 L 320 308" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="520" y="228" width="300" height="86" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="670" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">HashMap 哈希表</text>
  <text x="670" y="268" text-anchor="middle" font-size="11" fill="#5b6b7c">平均常数时间增删改查</text>
  <text x="670" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">TreeMap 红黑树</text>
  <text x="670" y="304" text-anchor="middle" font-size="11" fill="#5b6b7c">按键排序 + 导航方法</text>
  <rect x="520" y="326" width="300" height="76" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="670" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">选型三问</text>
  <text x="670" y="368" text-anchor="middle" font-size="11" fill="#1f2b38">单个元素还是对应关系？</text>
  <text x="670" y="386" text-anchor="middle" font-size="11" fill="#1f2b38">顺序重要吗？允许重复吗？</text>
  <rect x="40" y="412" width="820" height="34" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="450" y="434" text-anchor="middle" font-size="11" fill="#5b6b7c">声明时优先写接口类型：List&lt;String&gt; list = new ArrayList&lt;&gt;();　Vector / Hashtable / Stack 属遗留集合，新代码不要用</text>
</svg>
