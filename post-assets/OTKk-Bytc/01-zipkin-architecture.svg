<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Zipkin 核心组件与链路数据流</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Zipkin 核心组件与链路数据流</text>

  <text x="166" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">微服务应用（Zipkin 客户端）</text>
  <line x1="36" y1="74" x2="296" y2="74" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="592" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">Zipkin 服务端</text>
  <line x1="320" y1="74" x2="864" y2="74" stroke="#2f6fd0" stroke-width="1.4"/>

  <rect x="36" y="90" width="118" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="95" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Reporter</text>
  <text x="95" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">采集埋点数据</text>

  <rect x="178" y="90" width="118" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="237" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Transport</text>
  <text x="237" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">HTTP / MQ 传输</text>

  <rect x="320" y="90" width="118" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="379" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Collector</text>
  <text x="379" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">收集并消费数据</text>

  <rect x="462" y="90" width="118" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="521" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">Storage</text>
  <text x="521" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">持久化存储</text>

  <rect x="604" y="90" width="118" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="663" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">API</text>
  <text x="663" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">提供查询接口</text>

  <rect x="746" y="90" width="118" height="76" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="805" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">UI</text>
  <text x="805" y="146" text-anchor="middle" font-size="11" fill="#5b6b7c">可视化链路界面</text>

  <line x1="154" y1="128" x2="178" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="296" y1="128" x2="320" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="438" y1="128" x2="462" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="580" y1="128" x2="604" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="722" y1="128" x2="746" y2="128" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <line x1="521" y1="166" x2="521" y2="205" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="425" y1="205" x2="775" y2="205" stroke="#5b6b7c" stroke-width="1.4"/>
  <line x1="425" y1="205" x2="425" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="600" y1="205" x2="600" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="775" y1="205" x2="775" y2="228" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="345" y="230" width="160" height="50" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="425" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Elasticsearch</text>
  <text x="425" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">生产环境推荐</text>

  <rect x="520" y="230" width="160" height="50" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="600" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">Cassandra</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">高写入吞吐</text>

  <rect x="695" y="230" width="160" height="50" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="775" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2b38">MySQL</text>
  <text x="775" y="270" text-anchor="middle" font-size="11" fill="#5b6b7c">需手动执行建表脚本</text>

  <text x="450" y="312" text-anchor="middle" font-size="11" fill="#5b6b7c">默认存储为内存（in-memory）：Zipkin 重启后链路数据会丢失</text>
</svg>
