<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
<rect width="900" height="800" fill="#ffffff"/>
<text x="450" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2b38" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">Seata AT 模式：全局锁与两阶段提交时序</text>
<rect x="300" y="48" width="200" height="28" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="400" y="67" font-size="12" font-weight="700" text-anchor="middle" fill="#2f6fd0" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">一阶段：提交本地事务</text>
<rect x="510" y="48" width="200" height="28" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="610" y="67" font-size="12" font-weight="700" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">二阶段：TC 驱动全局提交或回滚</text>
<text x="296" y="67" font-size="11" text-anchor="end" fill="#5b6b7c" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">阶段</text>
<line x1="290" y1="82" x2="290" y2="770" stroke="#c8d3e0" stroke-width="1"/>
<line x1="700" y1="82" x2="700" y2="770" stroke="#c8d3e0" stroke-width="1"/>
<line x1="770" y1="88" x2="770" y2="762" stroke="#c8d3e0" stroke-width="1.5"/>
<line x1="860" y1="88" x2="860" y2="762" stroke="#c8d3e0" stroke-width="1.5"/>
<rect x="776" y="96" width="78" height="26" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="815" y="114" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2b38" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">TM</text>
<rect x="776" y="132" width="78" height="26" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="815" y="150" font-size="12" font-weight="700" text-anchor="middle" fill="#2f6fd0" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">TC</text>
<rect x="776" y="168" width="78" height="26" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="815" y="186" font-size="12" font-weight="700" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">RM</text>
<line x1="815" y1="200" x2="815" y2="762" stroke="#c8d3e0" stroke-width="1"/>
<line x1="110" y1="200" x2="866" y2="200" stroke="#e08a1e" stroke-dasharray="4,3"/>
<text x="104" y="204" font-size="11" text-anchor="end" fill="#e08a1e" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">步骤 1</text>
<line x1="110" y1="310" x2="866" y2="310" stroke="#e08a1e" stroke-dasharray="4,3"/>
<text x="104" y="314" font-size="11" text-anchor="end" fill="#e08a1e" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">步骤 2</text>
<line x1="110" y1="420" x2="866" y2="420" stroke="#e08a1e" stroke-dasharray="4,3"/>
<text x="104" y="424" font-size="11" text-anchor="end" fill="#e08a1e" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">步骤 3</text>
<line x1="110" y1="530" x2="866" y2="530" stroke="#e08a1e" stroke-dasharray="4,3"/>
<text x="104" y="534" font-size="11" text-anchor="end" fill="#e08a1e" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">步骤 4</text>
<line x1="110" y1="640" x2="866" y2="640" stroke="#e08a1e" stroke-dasharray="4,3"/>
<text x="104" y="644" font-size="11" text-anchor="end" fill="#e08a1e" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">步骤 5</text>
<line x1="110" y1="750" x2="866" y2="750" stroke="#e08a1e" stroke-dasharray="4,3"/>
<text x="104" y="754" font-size="11" text-anchor="end" fill="#e08a1e" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">步骤 6</text>
<rect x="120" y="186" width="150" height="28" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="195" y="204" font-size="11" text-anchor="middle" fill="#1f2b38" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">开启全局事务</text>
<line x1="195" y1="200" x2="195" y2="186" stroke="#c8d3e0" stroke-width="1"/>
<path d="M270 200 L770 200" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#a-blue)"/>
<text x="520" y="194" font-size="11" text-anchor="middle" fill="#2f6fd0" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">申请开启全局事务</text>
<path d="M770 214 L270 214" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#a-blue)"/>
<text x="520" y="232" font-size="11" text-anchor="middle" fill="#2f6fd0" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">返回全局唯一 XID，TC 创建全局事务状态机</text>
<rect x="120" y="310" width="290" height="28" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="265" y="328" font-size="11" text-anchor="middle" fill="#1f2b38" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">执行本地事务：业务 SQL 与 undo_log 一并提交</text>
<rect x="150" y="296" width="290" height="28" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="295" y="314" font-size="11" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">持有本地锁，生成前后镜像并写 undo_log</text>
<line x1="295" y1="200" x2="295" y2="296" stroke="#c8d3e0" stroke-width="1"/>
<path d="M565 310 L770 310" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#a-green)"/>
<text x="600" y="278" font-size="11" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">申请全局锁（product#1）</text>
<path d="M770 338 L440 338" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#a-green)"/>
<text x="605" y="356" font-size="11" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">加锁成功，TC 在 lock_table 记录 lock</text>
<rect x="140" y="406" width="420" height="28" rx="8" fill="#eef4ff" stroke="#2f6fd0"/>
<text x="350" y="424" font-size="11" text-anchor="middle" fill="#2f6fd0" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">全局锁持有期：一阶段末尾申请，二阶段结束才释放</text>
<line x1="350" y1="200" x2="350" y2="406" stroke="#c8d3e0" stroke-width="1"/>


<rect x="150" y="516" width="290" height="28" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="295" y="534" font-size="11" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">分支注册并上报结果，全局锁仍然保留</text>
<line x1="295" y1="200" x2="295" y2="516" stroke="#c8d3e0" stroke-width="1"/>
<path d="M770 530 L400 530" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#a-green)"/>
<text x="630" y="492" font-size="11" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">上报分支状态</text>
<rect x="120" y="626" width="250" height="28" rx="8" fill="#f7f9fc" stroke="#c8d3e0"/>
<text x="245" y="644" font-size="11" text-anchor="middle" fill="#1f2b38" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">发起全局提交或全局回滚</text>
<line x1="245" y1="200" x2="245" y2="626" stroke="#c8d3e0" stroke-width="1"/>
<path d="M245 640 L770 640" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#a-blue)"/>
<text x="510" y="634" font-size="11" text-anchor="middle" fill="#2f6fd0" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">通知 TC 决定全局结果，TC 再通知各 RM 分支</text>
<rect x="120" y="736" width="300" height="28" rx="8" fill="#eaf7ef" stroke="#2e9e5b"/>
<text x="270" y="754" font-size="11" text-anchor="middle" fill="#2e9e5b" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">提交：异步批量删除 undo_log 记录</text>
<line x1="270" y1="200" x2="270" y2="736" stroke="#c8d3e0" stroke-width="1"/>
<rect x="440" y="736" width="330" height="28" rx="8" fill="#fff6e8" stroke="#e08a1e"/>
<text x="605" y="754" font-size="11" text-anchor="middle" fill="#e08a1e" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">回滚：校验后镜像，按前镜像反向补偿</text>
<line x1="605" y1="200" x2="605" y2="736" stroke="#c8d3e0" stroke-width="1"/>
<path d="M770 722 L440 722" stroke="#7a5bd0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-purple)"/>
<text x="605" y="716" font-size="11" text-anchor="middle" fill="#7a5bd0" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">释放全局锁，随后分支结束</text>
<text x="30" y="780" font-size="11" fill="#5b6b7c" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">观察点：一阶段业务数据与 undo_log 在同一本地事务提交，本地锁立刻释放；全局锁一直持有到二阶段结束，因此在默认的「读未提交」全局隔离级别下不会发生脏写。</text>
<defs>
<marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2f6fd0"/></marker>
<marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2e9e5b"/></marker>
<marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5bd0"/></marker>
</defs>
</svg>
