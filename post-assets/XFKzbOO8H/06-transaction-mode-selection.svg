<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Seata 四种事务模式的选型要点</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>

  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Seata 四种事务模式的选型要点</text>

  <rect x="30" y="55" width="195" height="34" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="127" y="77" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">AT 模式</text>
  <rect x="30" y="89" width="195" height="231" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="44" y="112" font-size="11" fill="#5b6b7c">适用条件</text>
  <text x="44" y="131" font-size="12" fill="#1f2b38">关系型数据库，通过</text>
  <text x="44" y="148" font-size="12" fill="#1f2b38">JDBC 访问</text>
  <text x="44" y="178" font-size="11" fill="#5b6b7c">隔离性</text>
  <text x="44" y="197" font-size="12" fill="#1f2b38">默认全局读未提交，</text>
  <text x="44" y="214" font-size="12" fill="#1f2b38">靠全局锁防脏写</text>
  <text x="44" y="244" font-size="11" fill="#5b6b7c">主要代价</text>
  <text x="44" y="263" font-size="12" fill="#1f2b38">需部署 TC，接受读</text>
  <text x="44" y="280" font-size="12" fill="#1f2b38">未提交的隔离级别</text>

  <rect x="245" y="55" width="195" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="342" y="77" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">TCC 模式</text>
  <rect x="245" y="89" width="195" height="231" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="259" y="112" font-size="11" fill="#5b6b7c">适用条件</text>
  <text x="259" y="131" font-size="12" fill="#1f2b38">跨库扣减、需要资源</text>
  <text x="259" y="148" font-size="12" fill="#1f2b38">预留的资金类业务</text>
  <text x="259" y="178" font-size="11" fill="#5b6b7c">隔离性</text>
  <text x="259" y="197" font-size="12" fill="#1f2b38">由业务在 Try 阶段</text>
  <text x="259" y="214" font-size="12" fill="#1f2b38">预留资源实现</text>
  <text x="259" y="244" font-size="11" fill="#5b6b7c">主要代价</text>
  <text x="259" y="263" font-size="12" fill="#1f2b38">需实现 Try/Confirm</text>
  <text x="259" y="280" font-size="12" fill="#1f2b38">/Cancel 并保证幂等</text>

  <rect x="460" y="55" width="195" height="34" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <text x="557" y="77" font-size="13" font-weight="700" fill="#7a5bd0" text-anchor="middle">SAGA 模式</text>
  <rect x="460" y="89" width="195" height="231" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="474" y="112" font-size="11" fill="#5b6b7c">适用条件</text>
  <text x="474" y="131" font-size="12" fill="#1f2b38">长流程、跨公司或</text>
  <text x="474" y="148" font-size="12" fill="#1f2b38">遗留系统编排</text>
  <text x="474" y="178" font-size="11" fill="#5b6b7c">隔离性</text>
  <text x="474" y="197" font-size="12" fill="#1f2b38">不保证隔离，中间</text>
  <text x="474" y="214" font-size="12" fill="#1f2b38">状态对外可见</text>
  <text x="474" y="244" font-size="11" fill="#5b6b7c">主要代价</text>
  <text x="474" y="263" font-size="12" fill="#1f2b38">正向与补偿服务需</text>
  <text x="474" y="280" font-size="12" fill="#1f2b38">成对实现与维护</text>

  <rect x="675" y="55" width="195" height="34" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="772" y="77" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle">XA 模式</text>
  <rect x="675" y="89" width="195" height="231" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="689" y="112" font-size="11" fill="#5b6b7c">适用条件</text>
  <text x="689" y="131" font-size="12" fill="#1f2b38">数据库原生支持 XA</text>
  <text x="689" y="178" font-size="11" fill="#5b6b7c">隔离性</text>
  <text x="689" y="197" font-size="12" fill="#1f2b38">由数据库本地事务</text>
  <text x="689" y="214" font-size="12" fill="#1f2b38">隔离级别保证</text>
  <text x="689" y="244" font-size="11" fill="#5b6b7c">主要代价</text>
  <text x="689" y="263" font-size="12" fill="#1f2b38">连接与行锁持有到</text>
  <text x="689" y="280" font-size="12" fill="#1f2b38">二阶段，性能最差</text>
</svg>
