<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Gradle 常用依赖配置作用域对比</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Gradle 常用依赖配置作用域对比</text>
  <rect x="30" y="60" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="195" y="60" width="215" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="425" y="60" width="215" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="655" y="60" width="215" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="105" y="85" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">配置</text>
  <text x="302" y="85" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">编译类路径</text>
  <text x="532" y="85" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">运行时类路径</text>
  <text x="762" y="85" font-size="13" font-weight="700" fill="#1f2b38" text-anchor="middle">对外暴露（传给消费者）</text>
  <rect x="30" y="100" width="150" height="40" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="195" y="100" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="425" y="100" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="655" y="100" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="105" y="125" font-size="12" font-weight="700" fill="#2f6fd0" text-anchor="middle">api</text>
  <text x="302" y="125" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="532" y="125" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="762" y="125" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <rect x="30" y="142" width="150" height="40" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <rect x="195" y="142" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="425" y="142" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="655" y="142" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="105" y="167" font-size="12" font-weight="700" fill="#2e9e5b" text-anchor="middle">implementation</text>
  <text x="302" y="167" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="532" y="167" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="762" y="167" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">否</text>
  <rect x="30" y="184" width="150" height="40" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <rect x="195" y="184" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="425" y="184" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="655" y="184" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="105" y="209" font-size="12" font-weight="700" fill="#e08a1e" text-anchor="middle">compileOnly</text>
  <text x="302" y="209" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="532" y="209" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">否</text>
  <text x="762" y="209" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">否</text>
  <rect x="30" y="226" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/>
  <rect x="195" y="226" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="425" y="226" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="655" y="226" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="105" y="251" font-size="12" font-weight="700" fill="#7a5bd0" text-anchor="middle">runtimeOnly</text>
  <text x="302" y="251" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">否</text>
  <text x="532" y="251" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="762" y="251" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">否</text>
  <rect x="30" y="268" width="150" height="40" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="195" y="268" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="425" y="268" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <rect x="655" y="268" width="215" height="40" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="105" y="293" font-size="12" font-weight="700" fill="#1f2b38" text-anchor="middle">testImplementation</text>
  <text x="302" y="293" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="532" y="293" font-size="13" font-weight="700" fill="#2e9e5b" text-anchor="middle">是</text>
  <text x="762" y="293" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">否</text>
  <text x="30" y="332" font-size="12" fill="#5b6b7c">· implementation：编译与运行时都可用，但不进入消费者的编译类路径，改动可减少重新编译范围，是默认推荐选择</text>
  <text x="30" y="354" font-size="12" fill="#5b6b7c">· api 需配合 java-library 插件；compileOnly 常见于 lombok、servlet-api 等只在编译期需要的依赖</text>
  <text x="30" y="376" font-size="12" fill="#5b6b7c">· testImplementation / testCompileOnly / testRuntimeOnly 只在测试源集生效，不会进入主产物与对外变体</text>
</svg>
