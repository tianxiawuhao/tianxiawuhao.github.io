<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>在有序数组中二分查找 7 的过程</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">二分查找 7：数组 [1, 3, 5, 7, 9, 11, 13]（下标 0~6）</text>

  <g font-size="12" fill="#5b6b7c">
    <text x="60" y="76">下标</text>
    <text x="170" y="76">0</text><text x="256" y="76">1</text><text x="342" y="76">2</text>
    <text x="428" y="76">3</text><text x="514" y="76">4</text><text x="596" y="76">5</text>
    <text x="682" y="76">6</text>
  </g>
  <g font-size="14" fill="#1f2b38">
    <rect x="158" y="88" width="80" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
    <text x="198" y="110" text-anchor="middle">1</text>
    <rect x="244" y="88" width="80" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
    <text x="284" y="110" text-anchor="middle">3</text>
    <rect x="330" y="88" width="80" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
    <text x="370" y="110" text-anchor="middle">5</text>
    <rect x="416" y="88" width="80" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
    <text x="456" y="110" text-anchor="middle">7</text>
    <rect x="502" y="88" width="80" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
    <text x="542" y="110" text-anchor="middle">9</text>
    <rect x="588" y="88" width="80" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
    <text x="628" y="110" text-anchor="middle">11</text>
    <rect x="674" y="88" width="80" height="34" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
    <text x="714" y="110" text-anchor="middle">13</text>
  </g>
  <line x1="158" y1="132" x2="754" y2="132" stroke="#e08a1e" stroke-width="2"/>
  <text x="770" y="137" font-size="12" fill="#e08a1e">low=0, high=6</text>
  <line x1="456" y1="80" x2="456" y2="132" stroke="#2e9e5b" stroke-width="2"/>
  <text x="466" y="72" font-size="12" fill="#2e9e5b">mid=3</text>
  <text x="60" y="137" font-size="12" fill="#5b6b7c">第 1 次</text>

  <text x="60" y="196" font-size="12" fill="#5b6b7c">第 2 次</text>
  <rect x="158" y="158" width="248" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="282" y="180" text-anchor="middle" font-size="12" fill="#1f2b38">a[3] = 7 等于目标 → 直接命中</text>
  <text x="282" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">仅 1 次比较就结束，无需再看右半段</text>

  <rect x="430" y="158" width="400" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="630" y="180" text-anchor="middle" font-size="12" fill="#1f2b38">若查找 8：a[3]=7 &lt; 8 → low=4，范围缩到下标 4~6</text>
  <text x="630" y="200" text-anchor="middle" font-size="12" fill="#5b6b7c">再取 mid=5（值 11）&gt; 8 → high=4；mid=4（值 9）&gt; 8 → high=3</text>

  <line x1="282" y1="216" x2="282" y2="240" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="630" y1="216" x2="630" y2="240" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="158" y="248" width="248" height="62" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="282" y="272" text-anchor="middle" font-size="12" fill="#1f2b38">返回下标 3，查找成功</text>
  <text x="282" y="294" text-anchor="middle" font-size="12" fill="#5b6b7c">最多比较 log₂n 次 → O(log n)</text>

  <rect x="430" y="248" width="400" height="62" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="630" y="272" text-anchor="middle" font-size="12" fill="#1f2b38">low=4 &gt; high=3，循环结束，返回 -(low+1) = -5</text>
  <text x="630" y="294" text-anchor="middle" font-size="12" fill="#5b6b7c">负值同时表示"未找到"与"应插入下标 4"</text>
</svg>
