<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>长度为 5 的 int 数组的内存布局</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">int[] scores = new int[5] 的内存布局</text>

  <text x="60" y="80" font-size="13" font-weight="700" fill="#1f2b38">① 下标（index）</text>
  <rect x="230" y="62" width="88" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="274" y="82" text-anchor="middle" font-size="13" fill="#1f2b38">0</text>
  <rect x="322" y="62" width="88" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="366" y="82" text-anchor="middle" font-size="13" fill="#1f2b38">1</text>
  <rect x="414" y="62" width="88" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="458" y="82" text-anchor="middle" font-size="13" fill="#1f2b38">2</text>
  <rect x="506" y="62" width="88" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="550" y="82" text-anchor="middle" font-size="13" fill="#1f2b38">3</text>
  <rect x="598" y="62" width="88" height="30" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="642" y="82" text-anchor="middle" font-size="13" fill="#1f2b38">4</text>
  <text x="700" y="82" font-size="11" fill="#5b6b7c">共 scores.length = 5 个</text>

  <text x="60" y="140" font-size="13" font-weight="700" fill="#1f2b38">② 元素值</text>
  <rect x="230" y="122" width="88" height="42" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="274" y="149" text-anchor="middle" font-size="14" fill="#1f2b38">0</text>
  <rect x="322" y="122" width="88" height="42" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="366" y="149" text-anchor="middle" font-size="14" fill="#1f2b38">0</text>
  <rect x="414" y="122" width="88" height="42" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="458" y="149" text-anchor="middle" font-size="14" fill="#1f2b38">0</text>
  <rect x="506" y="122" width="88" height="42" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="550" y="149" text-anchor="middle" font-size="14" fill="#1f2b38">0</text>
  <rect x="598" y="122" width="88" height="42" rx="6" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="642" y="149" text-anchor="middle" font-size="14" fill="#1f2b38">0</text>

  <text x="60" y="200" font-size="13" font-weight="700" fill="#1f2b38">③ 内存地址</text>
  <rect x="230" y="182" width="456" height="30" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="458" y="202" text-anchor="middle" font-size="12" fill="#5b6b7c">首地址 → 首地址+4 → +8 → +12 → +16（每个 int 占 4 字节，连续排列）</text>

  <line x1="458" y1="212" x2="458" y2="240" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="230" y="248" width="456" height="34" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="458" y="270" text-anchor="middle" font-size="12" fill="#1f2b38">scores[2] = 首地址 + 2 × 4 = 一步定位，与长度无关</text>

  <rect x="712" y="122" width="158" height="160" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="791" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2b38">三条硬规则</text>
  <text x="726" y="174" font-size="11" fill="#5b6b7c">length 是属性，无括号</text>
  <text x="726" y="200" font-size="11" fill="#5b6b7c">下标 0 起，上界 length-1</text>
  <text x="726" y="226" font-size="11" fill="#5b6b7c">越界抛</text>
  <text x="726" y="246" font-size="11" fill="#5b6b7c">ArrayIndexOutOfBounds</text>
  <text x="726" y="268" font-size="11" fill="#5b6b7c">长度创建后不可改变</text>
</svg>
