<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>选择排序前三轮的过程</title>
  <rect width="900" height="340" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">选择排序：{70, 80, 31, 37, 10} 的前三轮</text>

  <text x="36" y="80" font-size="12" font-weight="700" fill="#1f2b38">第 0 轮</text>
  <rect x="120" y="60" width="76" height="34" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="158" y="82" text-anchor="middle" font-size="14" fill="#1f2b38">70</text>
  <rect x="200" y="60" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="238" y="82" text-anchor="middle" font-size="14" fill="#1f2b38">80</text>
  <rect x="280" y="60" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="318" y="82" text-anchor="middle" font-size="14" fill="#1f2b38">31</text>
  <rect x="360" y="60" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="398" y="82" text-anchor="middle" font-size="14" fill="#1f2b38">37</text>
  <rect x="440" y="60" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="478" y="82" text-anchor="middle" font-size="14" fill="#1f2b38">10</text>
  <text x="530" y="82" font-size="12" fill="#5b6b7c">未排序区最小 = 10，与 arr[0] 交换</text>

  <text x="36" y="150" font-size="12" font-weight="700" fill="#1f2b38">第 1 轮</text>
  <rect x="120" y="130" width="76" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="158" y="152" text-anchor="middle" font-size="14" fill="#1f2b38">10</text>
  <rect x="200" y="130" width="76" height="34" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="238" y="152" text-anchor="middle" font-size="14" fill="#1f2b38">80</text>
  <rect x="280" y="130" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="318" y="152" text-anchor="middle" font-size="14" fill="#1f2b38">31</text>
  <rect x="360" y="130" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="398" y="152" text-anchor="middle" font-size="14" fill="#1f2b38">37</text>
  <rect x="440" y="130" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="478" y="152" text-anchor="middle" font-size="14" fill="#1f2b38">70</text>
  <text x="530" y="152" font-size="12" fill="#5b6b7c">余下最小 = 31，与 arr[1] 交换</text>

  <text x="36" y="220" font-size="12" font-weight="700" fill="#1f2b38">第 2 轮</text>
  <rect x="120" y="200" width="76" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="158" y="222" text-anchor="middle" font-size="14" fill="#1f2b38">10</text>
  <rect x="200" y="200" width="76" height="34" rx="6" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="238" y="222" text-anchor="middle" font-size="14" fill="#1f2b38">31</text>
  <rect x="280" y="200" width="76" height="34" rx="6" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="318" y="222" text-anchor="middle" font-size="14" fill="#1f2b38">80</text>
  <rect x="360" y="200" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="398" y="222" text-anchor="middle" font-size="14" fill="#1f2b38">37</text>
  <rect x="440" y="200" width="76" height="34" rx="6" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="478" y="222" text-anchor="middle" font-size="14" fill="#1f2b38">70</text>
  <text x="530" y="222" font-size="12" fill="#5b6b7c">余下最小 = 37，与 arr[2] 交换</text>

  <line x1="275" y1="96" x2="275" y2="126" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="275" y1="166" x2="275" y2="196" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="120" y="262" width="396" height="56" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="318" y="284" text-anchor="middle" font-size="12" fill="#1f2b38">橙 = 本轮待定位的位置　绿 = 仍属未排序区　蓝 = 已排序区</text>
  <text x="318" y="306" text-anchor="middle" font-size="12" fill="#5b6b7c">每轮只交换一次，共 n-1 轮，比较 n(n-1)/2 次 → O(n²)</text>

  <rect x="540" y="262" width="330" height="56" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="705" y="284" text-anchor="middle" font-size="12" fill="#1f2b38">先记录最小值的下标 minIndex，</text>
  <text x="705" y="306" text-anchor="middle" font-size="12" fill="#1f2b38">内层循环结束后再交换，避免无效交换</text>
</svg>
