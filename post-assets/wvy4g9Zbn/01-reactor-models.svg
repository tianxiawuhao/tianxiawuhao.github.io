<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Reactor 三种线程模型对比</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Reactor 三种线程模型对比</text>

  <rect x="20" y="55" width="860" height="135" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="82" font-size="13" font-weight="700" fill="#2f6fd0">单 Reactor 单线程</text>
  <rect x="40" y="100" width="150" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="134" text-anchor="middle" font-size="12" fill="#1f2b38">客户端请求</text>
  <line x1="190" y1="129" x2="222" y2="129" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="224" y="100" width="300" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="374" y="123" text-anchor="middle" font-size="12" fill="#1f2b38">Reactor（单线程）</text>
  <text x="374" y="143" text-anchor="middle" font-size="11" fill="#5b6b7c">select · dispatch · 业务处理</text>
  <line x1="524" y1="129" x2="556" y2="129" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="558" y="100" width="150" height="58" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="633" y="134" text-anchor="middle" font-size="12" fill="#1f2b38">返回响应</text>
  <text x="40" y="180" font-size="11" fill="#5b6b7c">连接建立、事件分发与业务处理都在同一个线程完成，业务一旦阻塞，事件循环也随之停摆。</text>

  <rect x="20" y="205" width="860" height="135" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="232" font-size="13" font-weight="700" fill="#2f6fd0">单 Reactor 多线程</text>
  <rect x="40" y="250" width="150" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="115" y="284" text-anchor="middle" font-size="12" fill="#1f2b38">客户端请求</text>
  <line x1="190" y1="279" x2="222" y2="279" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="224" y="250" width="240" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="344" y="273" text-anchor="middle" font-size="12" fill="#1f2b38">Reactor（单线程）</text>
  <text x="344" y="293" text-anchor="middle" font-size="11" fill="#5b6b7c">select + dispatch</text>
  <line x1="464" y1="279" x2="496" y2="279" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="498" y="250" width="190" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="593" y="273" text-anchor="middle" font-size="12" fill="#1f2b38">Worker 线程池</text>
  <text x="593" y="293" text-anchor="middle" font-size="11" fill="#5b6b7c">业务处理</text>
  <text x="40" y="330" font-size="11" fill="#5b6b7c">Reactor 只负责监听与分发事件，耗时业务交给线程池，避免阻塞事件循环。</text>

  <rect x="20" y="355" width="860" height="135" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/>
  <text x="40" y="382" font-size="13" font-weight="700" fill="#2f6fd0">主从 Reactor 多线程</text>
  <rect x="40" y="400" width="120" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="100" y="434" text-anchor="middle" font-size="12" fill="#1f2b38">客户端请求</text>
  <line x1="160" y1="429" x2="190" y2="429" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="192" y="400" width="190" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="287" y="434" text-anchor="middle" font-size="12" fill="#1f2b38">MainReactor：accept</text>
  <line x1="382" y1="429" x2="412" y2="429" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="414" y="400" width="190" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="509" y="434" text-anchor="middle" font-size="12" fill="#1f2b38">SubReactor×N：read</text>
  <line x1="604" y1="429" x2="634" y2="429" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="636" y="400" width="190" height="58" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="731" y="434" text-anchor="middle" font-size="12" fill="#1f2b38">Worker 线程池：业务</text>
  <text x="40" y="480" font-size="11" fill="#5b6b7c">主线程只处理连接建立，读写事件由多个 SubReactor 分担，适合高并发连接场景。</text>
</svg>
