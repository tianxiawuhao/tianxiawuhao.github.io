<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"
     font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <title>Reactor 事件分发流程</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2b38">Reactor 事件分发流程</text>

  <rect x="200" y="58" width="500" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="89" text-anchor="middle" font-size="12" fill="#1f2b38">① 客户端发起连接或读写请求（InputSource）</text>
  <line x1="450" y1="110" x2="450" y2="132" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="200" y="134" width="500" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="450" y="165" text-anchor="middle" font-size="12" fill="#1f2b38">② Selector 轮循事件缓冲队列，取出就绪事件</text>
  <line x1="450" y1="186" x2="450" y2="208" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="200" y="210" width="500" height="52" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="450" y="241" text-anchor="middle" font-size="12" fill="#1f2b38">③ Dispatcher 按 EventType 分发给对应 EventHandler</text>
  <line x1="450" y1="262" x2="450" y2="284" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="200" y="286" width="500" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="317" text-anchor="middle" font-size="12" fill="#1f2b38">④ AcceptEventHandler / ReadEventHandler 处理事件</text>
  <line x1="450" y1="338" x2="450" y2="360" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="200" y="362" width="500" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="450" y="393" text-anchor="middle" font-size="12" fill="#1f2b38">⑤ 业务交给 Worker 线程池，结果由 Handler 回写客户端</text>

  <text x="712" y="240" font-size="11" fill="#5b6b7c">EventType：</text>
  <text x="712" y="258" font-size="11" fill="#5b6b7c">ACCEPT / READ / WRITE</text>
</svg>
