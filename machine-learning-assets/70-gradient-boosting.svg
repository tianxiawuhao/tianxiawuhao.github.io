<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">梯度提升树（GBDT）：串行加法模型，每棵树拟合前一轮的负梯度</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs><rect x="40" y="150" width="120" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="100.0" y="181.0" font-size="14" font-weight="600" fill="#2f6fd0" text-anchor="middle">F₀(x)</text><text x="100.0" y="201.0" font-size="11" fill="#5b6b7c" text-anchor="middle">初始常数（均值）</text><rect x="215" y="150" width="120" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/><text x="275.0" y="181.0" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">h₁(x)</text><text x="275.0" y="201.0" font-size="11" fill="#5b6b7c" text-anchor="middle">拟合 −g₁</text><text x="275" y="240" font-size="11.5" fill="#5b6b7c" text-anchor="middle" font-weight="400">学习率 ν · h1</text><line x1="160" y1="185" x2="209" y2="185" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#ah)"/><text x="185" y="175" font-size="17" fill="#2f6fd0" text-anchor="middle" font-weight="700">+</text><rect x="390" y="150" width="120" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/><text x="450.0" y="181.0" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">h₂(x)</text><text x="450.0" y="201.0" font-size="11" fill="#5b6b7c" text-anchor="middle">拟合 −g₂</text><text x="450" y="240" font-size="11.5" fill="#5b6b7c" text-anchor="middle" font-weight="400">学习率 ν · h2</text><line x1="335" y1="185" x2="384" y2="185" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><text x="360" y="175" font-size="17" fill="#5b6b7c" text-anchor="middle" font-weight="700">+</text><rect x="565" y="150" width="120" height="70" rx="8" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/><text x="625.0" y="181.0" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">hₘ(x)</text><text x="625.0" y="201.0" font-size="11" fill="#5b6b7c" text-anchor="middle">拟合 −gₘ</text><text x="625" y="240" font-size="11.5" fill="#5b6b7c" text-anchor="middle" font-weight="400">学习率 ν · h3</text><line x1="510" y1="185" x2="559" y2="185" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><text x="535" y="175" font-size="17" fill="#5b6b7c" text-anchor="middle" font-weight="700">+</text><rect x="750" y="150" width="120" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/><text x="810.0" y="181.0" font-size="14" font-weight="600" fill="#2e9e5b" text-anchor="middle">Fₘ(x)</text><text x="810.0" y="201.0" font-size="11" fill="#5b6b7c" text-anchor="middle">最终强学习器</text><line x1="695" y1="185" x2="744" y2="185" stroke="#2e9e5b" stroke-width="1.8" marker-end="url(#ah)"/><text x="450" y="300" font-size="13" fill="#1f2b38" text-anchor="middle" font-weight="400">Fₘ(x) = F₀(x) + ν·Σₘ hₘ(x)   （ν 为学习率 / 收缩系数，越小越稳、需更多轮）</text><text x="450" y="330" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">每棵树只学「残差」→ 逐步降低偏差：这是 Bagging（并行降方差）之外的第三条路线</text><text x="450" y="362" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">工程实现：XGBoost（预排序近似分位）· LightGBM（直方图 + Leaf-wise）· CatBoost（对称树 + 有序提升）</text></svg>