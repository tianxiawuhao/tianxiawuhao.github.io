<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif"><rect width="980" height="430" fill="#ffffff"/><text x="490.0" y="34" font-size="18" font-weight="700" fill="#1f2b38" text-anchor="middle">分词器（Tokenizer）：文本 → 子词 → 整数 ID</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs><rect x="60" y="72" width="860" height="56" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.6"/><text x="490.0" y="107" font-size="20" font-weight="600" fill="#1f2b38" text-anchor="middle">机器学习很有趣</text><text x="910" y="107" font-size="12" fill="#5b6b7c" text-anchor="end">原始文本（7 个汉字）</text><line x1="490.0" y1="128" x2="490.0" y2="164" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><text x="508.0" y="152" font-size="12.5" fill="#5b6b7c">按词典做子词切分（BPE / WordPiece / Unigram）</text><rect x="71.0" y="176" width="190" height="72" rx="9" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/><text x="166.0" y="208" font-size="19" font-weight="600" fill="#1f2b38" text-anchor="middle">机器</text><text x="166.0" y="232" font-size="11.5" fill="#5b6b7c" text-anchor="middle">BPE 合并高频对</text><rect x="287.0" y="176" width="190" height="72" rx="9" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/><text x="382.0" y="208" font-size="19" font-weight="600" fill="#1f2b38" text-anchor="middle">学习</text><text x="382.0" y="232" font-size="11.5" fill="#5b6b7c" text-anchor="middle">语义完整子词</text><rect x="503.0" y="176" width="190" height="72" rx="9" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/><text x="598.0" y="208" font-size="19" font-weight="600" fill="#1f2b38" text-anchor="middle">很</text><text x="598.0" y="232" font-size="11.5" fill="#5b6b7c" text-anchor="middle">单字保留</text><rect x="719.0" y="176" width="190" height="72" rx="9" fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.4"/><text x="814.0" y="208" font-size="19" font-weight="600" fill="#1f2b38" text-anchor="middle">有趣</text><text x="814.0" y="232" font-size="11.5" fill="#5b6b7c" text-anchor="middle">跨字组合</text><line x1="490.0" y1="256" x2="490.0" y2="292" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><text x="508.0" y="280" font-size="12.5" fill="#5b6b7c">查表 → 整数编号（相当于词典页码）</text><rect x="71.0" y="304" width="190" height="52" rx="9" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/><text x="166.0" y="337" font-size="19" font-weight="700" fill="#2e9e5b" text-anchor="middle">1024</text><rect x="287.0" y="304" width="190" height="52" rx="9" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/><text x="382.0" y="337" font-size="19" font-weight="700" fill="#2e9e5b" text-anchor="middle">3689</text><rect x="503.0" y="304" width="190" height="52" rx="9" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/><text x="598.0" y="337" font-size="19" font-weight="700" fill="#2e9e5b" text-anchor="middle">87</text><rect x="719.0" y="304" width="190" height="52" rx="9" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/><text x="814.0" y="337" font-size="19" font-weight="700" fill="#2e9e5b" text-anchor="middle">7721</text><text x="490.0" y="392" font-size="12.5" fill="#5b6b7c" text-anchor="middle">同一句文本在不同词表下 token 数不同：中文压缩率直接决定成本与有效上下文长度</text><text x="490.0" y="414" font-size="12" fill="#5b6b7c" text-anchor="middle">BPE（频率驱动）· WordPiece（似然驱动）· SentencePiece（免预处理，多语言友好）· Unigram（概率剪枝，编码效率高）</text></svg>