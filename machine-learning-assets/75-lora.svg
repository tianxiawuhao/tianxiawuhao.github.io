<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="860" height="400" fill="#ffffff"/>
<text x="430.0" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">LoRA：冻结预训练权重 W₀，只训练低秩增量 ΔW = BA</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs><rect x="60" y="150" width="130" height="70" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="125.0" y="181.0" font-size="13" font-weight="600" fill="#2f6fd0" text-anchor="middle">输入 x</text><text x="125.0" y="201.0" font-size="10" fill="#5b6b7c" text-anchor="middle">d 维</text><rect x="300" y="90" width="200" height="66" rx="8" fill="#eef1f5" stroke="#5b6b7c" stroke-width="1.4"/><text x="400.0" y="119.0" font-size="13" font-weight="600" fill="#5b6b7c" text-anchor="middle">W₀ ∈ R^(d×k)</text><text x="400.0" y="139.0" font-size="10" fill="#5b6b7c" text-anchor="middle">❄ 冻结，不更新</text><rect x="300" y="226" width="200" height="66" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/><text x="400.0" y="255.0" font-size="13" font-weight="600" fill="#e08a1e" text-anchor="middle">ΔW = B·A</text><text x="400.0" y="275.0" font-size="10" fill="#5b6b7c" text-anchor="middle">🔥 可训练（低秩 r ≪ d,k）</text><rect x="600" y="150" width="140" height="70" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/><text x="670.0" y="181.0" font-size="13" font-weight="600" fill="#2e9e5b" text-anchor="middle">输出 h</text><text x="670.0" y="201.0" font-size="10" fill="#5b6b7c" text-anchor="middle">W₀x + (α/r)·BAx</text><line x1="194" y1="175" x2="296" y2="123" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><line x1="194" y1="195" x2="296" y2="259" stroke="#e08a1e" stroke-width="1.8" marker-end="url(#ah)"/><line x1="504" y1="123" x2="596" y2="168" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><line x1="504" y1="259" x2="596" y2="202" stroke="#e08a1e" stroke-width="1.8" marker-end="url(#ah)"/><text x="430" y="320" font-size="12.5" fill="#1f2b38" text-anchor="middle" font-weight="400">参数量对比：全参微调 100% → LoRA 常可低至 0.01%～1%（r 取 8～64）</text><text x="430" y="350" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">推理时可合并回 W₀ + BA，不增加延迟；QLoRA = 4-bit 量化基座 + LoRA，单卡即可微调 7B～70B</text></svg>