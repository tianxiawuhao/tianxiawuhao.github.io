<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs><rect x="70" y="110" width="190" height="110" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.4"/><text x="165.0" y="161.0" font-size="15" font-weight="600" fill="#2f6fd0" text-anchor="middle">智能体 Agent</text><text x="165.0" y="181.0" font-size="12" fill="#5b6b7c" text-anchor="middle">策略 π(a|s) / 价值 V,Q</text><rect x="500" y="110" width="190" height="110" rx="8" fill="#fff6e8" stroke="#e08a1e" stroke-width="1.4"/><text x="595.0" y="161.0" font-size="15" font-weight="600" fill="#e08a1e" text-anchor="middle">环境 Environment</text><text x="595.0" y="181.0" font-size="12" fill="#5b6b7c" text-anchor="middle">状态转移 P(s'|s,a)</text><line x1="265" y1="140" x2="495" y2="140" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#ah)"/><text x="380.0" y="132" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">动作 aₜ</text><line x1="495" y1="195" x2="265" y2="195" stroke="#e08a1e" stroke-width="1.8" marker-end="url(#ah)"/><text x="380.0" y="213" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">状态 sₜ₊₁  奖励 rₜ₊₁</text><text x="380" y="250" font-size="13.5" fill="#1f2b38" text-anchor="middle" font-weight="400">目标：最大化期望累积回报  Gₜ = Σ γᵏ rₜ₊ₖ₊₁</text><text x="380" y="280" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">马尔可夫性：P(sₜ₊₁|sₜ,aₜ) = P(sₜ₊₁|s₁,a₁,…,sₜ,aₜ) —— 下一状态只依赖当前状态与动作</text><text x="380" y="308" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">贝尔曼方程把「当前价值」与「未来价值」递归连接，是动态规划与 TD 学习的理论基石</text></svg>