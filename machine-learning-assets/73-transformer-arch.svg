<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="450.0" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">Transformer 总体架构：输入 → 编码器 → 解码器 → 输出</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs><rect x="60" y="70" width="360" height="340" rx="12" fill="#f2f7ff" stroke="#2f6fd0" stroke-width="1.6" stroke-dasharray="6 5"/><text x="240" y="94" font-size="13.5" fill="#2f6fd0" text-anchor="middle" font-weight="700">编码器 Encoder × N（双向注意力）</text><rect x="100" y="110" width="280" height="42" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/><text x="240.0" y="135.55" font-size="13" font-weight="600" fill="#2f6fd0" text-anchor="middle">输入嵌入 + 位置编码</text><rect x="100" y="172" width="280" height="46" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/><text x="240.0" y="191.0" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">多头自注意力</text><text x="240.0" y="211.0" font-size="11" fill="#5b6b7c" text-anchor="middle">全局可见，捕捉任意距离依赖</text><text x="240" y="236" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">＋ 残差连接 &amp; LayerNorm</text><rect x="100" y="252" width="280" height="46" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.4"/><text x="240.0" y="271.0" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">前馈网络 FFN</text><text x="240.0" y="291.0" font-size="11" fill="#5b6b7c" text-anchor="middle">逐位置独立的两层 MLP</text><text x="240" y="316" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">＋ 残差连接 &amp; LayerNorm</text><rect x="100" y="332" width="280" height="52" rx="8" fill="#eaf7ef" stroke="#2e9e5b" stroke-width="1.4"/><text x="240.0" y="354.0" font-size="13" font-weight="600" fill="#2e9e5b" text-anchor="middle">中间表示（语义向量）</text><text x="240.0" y="374.0" font-size="10" fill="#5b6b7c" text-anchor="middle">K / V 提供给解码器</text><rect x="480" y="70" width="360" height="340" rx="12" fill="#fff8f0" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="6 5"/><text x="660" y="94" font-size="13.5" fill="#e08a1e" text-anchor="middle" font-weight="700">解码器 Decoder × N（因果掩码）</text><rect x="520" y="110" width="280" height="42" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/><text x="660.0" y="127.0" font-size="13" font-weight="600" fill="#e08a1e" text-anchor="middle">输出嵌入 + 位置编码</text><text x="660.0" y="147.0" font-size="10" fill="#5b6b7c" text-anchor="middle">已生成序列（右移一位）</text><rect x="520" y="172" width="280" height="46" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/><text x="660.0" y="191.0" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">掩码多头自注意力</text><text x="660.0" y="211.0" font-size="11" fill="#5b6b7c" text-anchor="middle">只能看到左侧，保证自回归</text><rect x="520" y="252" width="280" height="46" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/><text x="660.0" y="271.0" font-size="14" font-weight="600" fill="#1f2b38" text-anchor="middle">交叉注意力</text><text x="660.0" y="291.0" font-size="11" fill="#5b6b7c" text-anchor="middle">Q 来自解码器，K/V 来自编码器</text><rect x="520" y="332" width="280" height="52" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.4"/><text x="660.0" y="362.55" font-size="13" font-weight="600" fill="#e08a1e" text-anchor="middle">前馈网络 FFN + 残差 &amp; LayerNorm</text><line x1="420" y1="358" x2="516" y2="275" stroke="#2e9e5b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="452" y="300" font-size="11.5" fill="#2e9e5b" text-anchor="middle" font-weight="400">K, V</text><line x1="130" y1="420" x2="766" y2="420" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240" y="445" width="180" height="48" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/><text x="330.0" y="465.0" font-size="13" font-weight="600" fill="#7a5bd0" text-anchor="middle">线性层 + Softmax</text><text x="330.0" y="485.0" font-size="10" fill="#5b6b7c" text-anchor="middle">映射到词表维度</text><rect x="520" y="445" width="180" height="48" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/><text x="610.0" y="465.0" font-size="13" font-weight="600" fill="#7a5bd0" text-anchor="middle">下一个 token 概率</text><text x="610.0" y="485.0" font-size="10" fill="#5b6b7c" text-anchor="middle">自回归生成</text><line x1="430" y1="469" x2="516" y2="469" stroke="#7a5bd0" stroke-width="1.8" marker-end="url(#ah)"/><text x="450" y="528" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">关键优化：FlashAttention（IO 感知）· GQA/MQA（压缩 KV Cache）· RoPE（位置外推）· MoE（稀疏激活）</text></svg>