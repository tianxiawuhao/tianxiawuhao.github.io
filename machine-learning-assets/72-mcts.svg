<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Source Han Sans SC, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<rect width="860" height="330" fill="#ffffff"/>
<text x="430.0" y="30" font-size="17" font-weight="700" fill="#1f2b38" text-anchor="middle">蒙特卡洛树搜索（MCTS）：选择 → 扩展 → 模拟 → 回溯</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs><rect x="40" y="90" width="180" height="90" rx="8" fill="#f7f9fc" stroke="#2f6fd0" stroke-width="1.4"/><text x="130.0" y="131.0" font-size="13" font-weight="600" fill="#2f6fd0" text-anchor="middle">① 选择 Selection</text><text x="130.0" y="151.0" font-size="10" fill="#5b6b7c" text-anchor="middle">按 UCB 从根节点下行</text><line x1="224" y1="135" x2="248" y2="135" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><rect x="248" y="90" width="180" height="90" rx="8" fill="#f7f9fc" stroke="#2e9e5b" stroke-width="1.4"/><text x="338.0" y="131.0" font-size="13" font-weight="600" fill="#2e9e5b" text-anchor="middle">② 扩展 Expansion</text><text x="338.0" y="151.0" font-size="10" fill="#5b6b7c" text-anchor="middle">在未完全探索节点新增子节点</text><line x1="432" y1="135" x2="456" y2="135" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><rect x="456" y="90" width="180" height="90" rx="8" fill="#f7f9fc" stroke="#e08a1e" stroke-width="1.4"/><text x="546.0" y="131.0" font-size="13" font-weight="600" fill="#e08a1e" text-anchor="middle">③ 模拟 Simulation</text><text x="546.0" y="151.0" font-size="10" fill="#5b6b7c" text-anchor="middle">随机 rollout 估计回报</text><line x1="640" y1="135" x2="664" y2="135" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#ah)"/><rect x="664" y="90" width="180" height="90" rx="8" fill="#f7f9fc" stroke="#7a5bd0" stroke-width="1.4"/><text x="754.0" y="131.0" font-size="13" font-weight="600" fill="#7a5bd0" text-anchor="middle">④ 回溯 Backpropagation</text><text x="754.0" y="151.0" font-size="10" fill="#5b6b7c" text-anchor="middle">沿路径回传并更新访问次数与均值</text><path d="M 130 186 C 130 250, 730 250, 730 186" fill="none" stroke="#5b6b7c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="430" y="262" font-size="12.5" fill="#5b6b7c" text-anchor="middle" font-weight="400">循环迭代直到耗尽预算，最终按访问次数最多的子节点落子</text><text x="430" y="295" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="400">不依赖马尔可夫性，适用于复杂 / 部分可观测环境：AlphaGo、AlphaZero 用 MCTS + 策略价值网络</text></svg>